장애가 난 뒤의 대응으로만 알면 v를 옳다고 고르기 쉽다.","why":["정답. ii와 iii만 1.2.3과 일치한다.","i과 iv가 들어 있어 틀렸다. 빌드 파일 같은 지원 산출물에도 결함이 있을 수 있고, 사람의 실수가 오류, 산출물에 남은 결점이 결함이다(1.2.3).","v가 들어 있어 틀렸다. 근본 원인 분석은 장애가 발생하거나 결함을 식별한 경우 수행한다(1.2.3).","i, iv, v가 모두 1.2.3과 어긋난다."],"ref":"1.2.3","hard":true},{"id":"h1-010","ch":1,"lo":"FL-1.3.1","k":2,"q":"다음은 네 팀이 내린 결정이다.\n\n1. 요구사항이 확정되기 전부터 테스터가 사용자 스토리 리뷰에 참여했고, 컴포넌트가 하나씩 완성될 때마다 바로 컴포넌트 테스트를 실행했다.\n2. 지난 릴리스들의 운영 장애 대부분이 전체 20개 컴포넌트 중 2개에서 발생했다는 분석 결과를 리스크 기반 테스팅의 입력으로 사용했다.\n3. 가능한 입력 조합이 수백만 가지여서, 테스트 기법으로 대표 값을 고르고 우선순위가 높은 조합부터 테스트했다.\n4. 매 빌드마다 자동 리그레션 테스트는 그대로 반복 실행하되, 반복 주기마다 수행하던 수동 테스트는 테스트 데이터를 바꾸고 새 테스트를 추가했다.\n\nA. 완벽한 테스팅은 불가능하다\nB. 테스트 효과는 줄어든다\nC. 조기 테스팅으로 시간과 비용을 절약할 수 있다\nD. 결함은 집중된다\n\n결정 1~4와 각 결정을 가장 직접적으로 뒷받침하는 테스팅 원리 A~D를 연결한 것은?","opts":["1C, 2A, 3D, 4B","1C, 2D, 3A, 4B","1B, 2D, 3A, 4C","1B, 2A, 3D, 4C"],"ans":[1],"exp":"1.3 원리 3(조기 테스팅)은 정적 테스팅과 동적 테스팅 모두 최대한 이른 시점에 시작해야 한다고 한다(1→C). 원리 4(결함 집중)는 소수의 컴포넌트에 결함과 운영 장애 대부분이 몰리며, 예상 및 실제 관측한 결함 집중 영역이 리스크 기반 테스팅에서 중요하게 고려된다고 한다(2→D). 원리 2(완벽한 테스팅 불가능)는 테스트 기법, 테스트 케이스 우선순위 지정, 리스크 기반 테스팅으로 테스트 노력을 집중하라고 한다(3→A). 원리 5(테스트 효과 감소)는 기존 테스트와 테스트 데이터를 수정하고 새 테스트를 작성할 필요가 있을 수 있으며, 자동 리그레션 테스팅처럼 같은 테스트의 반복이 유익한 경우도 있다고 한다(4→B). 함정 포인트: 2와 3에 모두 '리스크'나 '우선순위'가 나와 헷갈린다. 2의 핵심 단서는 '장애가 소수 컴포넌트에 몰림', 3의 핵심 단서는 '입력 조합이 너무 많음'이다.","why":["2A와 3D가 틀렸다. 소수 컴포넌트에 장애가 몰린 것은 결함 집중(D), 조합이 너무 많은 것은 완벽한 테스팅 불가능(A)이다(1.3).","정답. 1C, 2D, 3A, 4B가 1.3의 원리 3, 4, 2, 5와 각각 맞는다.","1B와 4C가 틀렸다. 리뷰와 테스트를 일찍 시작한 것은 조기 테스팅(C), 테스트 데이터를 바꾸고 새 테스트를 추가한 것은 테스트 효과 감소(B)에 대한 대응이다(1.3).","네 짝이 모두 틀렸다. 1은 C, 2는 D, 3은 A, 4는 B다(1.3)."],"ref":"1.3","hard":true},{"id":"h1-011","ch":1,"lo":"FL-1.3.1","k":2,"q":"테스팅 원리와 관련된 다음 설명을 보자.\n\ni. 테스팅은 테스트 대상에 결함이 잔존해 있을 확률을 줄일 수 있지만, 결함이 발견되지 않았다고 해서 소프트웨어가 완벽하다는 뜻은 아니다\nii. 조기 테스팅 원리에 따르면 정적 테스팅은 최대한 이른 시점에 시작하고, 동적 테스팅은 코드가 모두 완성된 뒤에 시작해야 한다\niii. 예상 결함 집중 영역과 테스트나 운영 중 실제로 관측한 결함 집중 영역은 리스크 기반 테스팅에서 중요하게 고려된다\niv. 테스트 효과 감소 원리에 따라, 자동 리그레션 테스트도 같은 테스트를 반복하지 말고 빌드마다 테스트 데이터를 바꿔야 한다\nv. 테스팅은 정황에 의존적이므로, 어느 정황에서나 테스트 목적 달성에 필요한 보편적인 테스트 활동이라는 것은 없다\n\n실라버스에 비추어 옳은 것만 모두 고른 것은?","opts":["i, ii, v","iii, iv","i, iii","ii, iv, v"],"ans":[2],"exp":"i은 1.3 원리 1, iii은 원리 4의 설명과 일치한다. ii는 원리 3이 정적 테스팅과 동적 테스팅 '모두' 최대한 이른 시점에 시작해야 한다고 하므로 틀렸다. iv는 원리 5가 기존 테스트 케이스와 테스트 데이터를 수정할 필요가 있을 수 있다고 하면서도, 자동 리그레션 테스팅처럼 같은 테스트를 반복하는 것이 유익한 경우도 있다고 하므로 틀렸다. v는 1.4가 '테스팅은 정황에 의존적이지만, 그에 관계없이 테스트 목적을 달성하기 위해 필요한 보편적인 테스트 활동들이 있다'고 하므로 틀렸다. 함정 포인트: v는 원리 6('모든 상황에 적용할 수 있는 하나의 테스팅 접근법은 없다')과 비슷해 보인다. 원리 6은 접근법이 하나로 정해지지 않는다는 뜻이지, 공통 테스트 활동까지 없다는 뜻이 아니다.","why":["ii와 v가 들어 있어 틀렸다. 동적 테스팅도 최대한 이른 시점에 시작해야 하고(1.3 원리 3), 정황에 의존적이어도 보편적인 테스트 활동들은 있다(1.4).","iv가 들어 있어 틀렸다. 자동 리그레션 테스팅처럼 같은 테스트의 반복이 유익한 경우도 있다(1.3 원리 5). i도 빠졌다.","정답. i(원리 1)과 iii(원리 4)만 옳다.","ii, iv, v가 모두 틀렸다(1.3, 1.4)."],"ref":"1.3","hard":true},{"id":"h1-012","ch":1,"lo":"FL-1.3.1","k":2,"q":"외주 개발사가 납품 보고 회의에서 다음과 같이 말했다.\n\n\"자동화 테스트 5,000개를 모두 실행했고 전부 통과했습니다. (가) 따라서 이 시스템에는 결함이 없습니다. (나) 또 명세서의 요구사항을 모두 충족했으니, 이 시스템은 고객사의 비즈니스 목표 달성에 성공할 것입니다.\"\n\n(가)와 (나)가 각각 어긋나는 테스팅 원리를 바르게 짝지은 것은?","opts":["(가) 결함-부재는 궤변이다 / (나) 테스팅은 결함의 존재를 밝히는 활동이지, 결함이 없음을 증명하지는 않는다","(가) 테스트 효과는 줄어든다 / (나) 결함-부재는 궤변이다","(가) 결함-부재는 궤변이다 / (나) 테스팅은 정황에 의존적이다","(가) 테스팅은 결함의 존재를 밝히는 활동이지, 결함이 없음을 증명하지는 않는다 / (나) 결함-부재는 궤변이다"],"ans":[3],"exp":"1.3 원리 1: 테스팅은 결함이 있음을 보여줄 수 있지만 결함이 없다는 것을 증명할 수는 없다. 결함이 전혀 발견되지 않았더라도 그 소프트웨어가 완벽하다는 뜻은 아니다 → (가). 원리 7: 베리피케이션이 시스템의 성공을 보장할 것이라고 기대하는 것은 잘못된 생각이다. 정의한 모든 요구사항을 철저히 테스트하고 발견한 결함을 모두 수정해도 사용자의 요구나 고객의 비즈니스 목표를 충족하지 못할 수 있으므로 밸리데이션도 해야 한다 → (나). 함정 포인트: 원리 7의 이름 '결함-부재'가 (가)의 '결함이 없다'와 글자가 닮아서 (가)에 짝짓기 쉽다. 원리 7의 핵심은 '결함이 없음'이 아니라 '베리피케이션만으로 성공을 기대하는 착각'이다. 또 '자동화 테스트 5,000개'라는 말에서 원리 5가 떠오를 수 있지만, 지문에는 같은 테스트를 반복했다는 내용이 없고 (가)의 잘못은 통과 결과를 결함이 없다는 증거로 삼은 데 있다.","why":["두 짝이 서로 바뀌었다. '결함이 없다'는 주장은 원리 1에, '요구사항 충족이면 성공'이라는 주장은 원리 7에 어긋난다(1.3).","(가)가 틀렸다. 원리 5는 같은 테스트를 반복하면 신규 결함 식별 효과가 줄어든다는 내용이다. 테스트 통과를 결함이 없다는 증거로 삼은 (가)는 원리 1에 어긋난다(1.3).","두 짝이 모두 틀렸다. (가)는 원리 1, (나)는 원리 7에 어긋난다. 원리 6은 정황에 따라 테스팅을 다르게 진행해야 한다는 내용이다(1.3).","정답. (가)는 원리 1, (나)는 원리 7에 어긋난다(1.3)."],"ref":"1.3","hard":true},{"id":"h1-013","ch":1,"lo":"FL-1.4.1","k":2,"q":"테스트 실행이 한창인 반복 주기 중간에, 테스터가 테스트 베이시스(test basis)의 할인 규칙이 모호해서 '쿠폰과 포인트를 함께 쓰는 경우'라는 테스트 컨디션(test condition)이 빠져 있었다는 것을 알게 됐다. 팀은 다른 테스트 실행은 계속하면서, 이 테스트 컨디션을 새로 정의하고 그에 맞는 테스트 케이스를 만들었다.\n\n이 상황에 대한 설명으로 실라버스에 가장 부합하는 것은?","opts":["실행이 진행 중이어도 테스트 컨디션을 새로 정의하고 테스트 케이스로 구체화한 것은, 테스트 활동이 반복적 또는 병렬로 이뤄진다는 설명과 맞다","누락을 테스트 실행 중에 찾았으므로, 새 테스트 컨디션을 정의하는 일은 테스트 실행의 이상 사항 분석 업무에 해당한다","새 테스트 컨디션을 정의하는 일은 '어떻게 테스트할 것인가'에 답하는 활동이므로, 테스트 분석이 아니라 테스트 설계에 해당한다","테스트 베이시스의 모호함은 아직 해결되지 않은 결함이므로, 이번 주기에는 손대지 말고 테스트 완료 때 변경 요청서로 넘기는 것이 실라버스가 정한 순서다"],"ans":[0],"exp":"1.4.1: 테스트 프로세스의 주요 활동 중 대부분은 순차적으로 수행되는 것처럼 보일 수 있으나, 실제로는 반복적 또는 병렬로 구현되는 경우가 많다. 테스팅 활동은 일반적으로 시스템과 프로젝트에 맞게 조정한다. 테스트 컨디션을 정의하는 것은 테스트 분석('무엇을 테스트할 것인가'), 테스트 컨디션을 테스트 케이스로 구체화하는 것은 테스트 설계('어떻게 테스트할 것인가')다. 테스트 실행의 이상 사항 분석은 실제 결과와 기대 결과를 비교한 뒤 그 차이의 가능한 원인을 파악하는 일이고, 변경 요청서는 테스트 완료에서 해결되지 않은 결함에 대해 만드는 산출물이다. 함정 포인트: 누락을 '실행 중에' 찾았다는 시점 때문에 실행 업무로 보거나, 분석('무엇을')과 설계('어떻게')를 거꾸로 외우면 오답이 옳아 보인다.","why":["정답. 테스트 활동은 반복적 또는 병렬로 구현되는 경우가 많다(1.4.1). 테스트 컨디션 정의는 분석, 테스트 케이스 구체화는 설계다.","실행 중에 찾았더라도 테스트 컨디션을 정의하는 일은 테스트 분석이다. 테스트 실행의 이상 사항 분석은 실제 결과와 기대 결과의 차이를 분석해 가능한 원인을 파악하는 일이다(1.4.1).","테스트 컨디션 정의는 '무엇을 테스트할 것인가'에 답하는 테스트 분석이다. '어떻게'에 답하는 것은 테스트 설계다(1.4.1).","실라버스는 테스트 활동이 반복적 또는 병렬로 구현되는 경우가 많고 시스템과 프로젝트에 맞게 조정한다고 한다. 실행 중 발견한 누락을 완료 때까지 미뤄야 한다는 순서는 없다(1.4.1)."],"ref":"1.4.1","hard":true},{"id":"h1-014","ch":1,"lo":"FL-1.4.1","k":2,"q":"테스터가 테스트 실행 일정에 따라 테스트를 수행하다가 실제 결과가 기대 결과와 다른 것을 발견했다. 테스터는 결함 보고서를 쓰기 전에, 테스트 케이스의 기대 결과가 잘못 적혀 있는지와 테스트 환경 설정이 잘못되었는지를 먼저 살펴보았다. 그 결과 소프트웨어의 장애로 판단하고 이상 사항을 보고했다.\n\n테스터가 한 일에 대한 설명으로 가장 적절한 것은?","opts":["이상 사항의 원인을 분석하는 것은 디버깅이므로, 테스터는 원인을 살펴보지 말고 결과 차이만 그대로 보고했어야 한다","보고 전에 가능한 원인을 살펴본 일과, 그 결과 장애로 판단한 것을 보고한 일은 모두 테스트 실행 활동의 업무다","실행 결과를 근거로 테스트 대상 안의 결함을 식별하는 일이므로, 이번 원인 분석은 테스트 분석 활동에 속한다","테스트 환경 설정을 살펴본 것은 테스트 구현 업무이므로, 이번 이상 사항 분석은 테스트 실행이 아니라 테스트 구현 활동에 속한다"],"ans":[1],"exp":"1.4.1 테스트 실행(test execution): 테스트 실행 일정에 따라 테스트를 수행하고, 실제 테스트 결과를 기대 결과와 비교하고, 테스트 결과를 기록한다. 이상 사항을 분석해 가능한 원인을 파악하며, 이런 분석을 통해 관찰한 장애를 기반으로 이상 사항을 보고할 수 있다. 함정 포인트: '원인 분석'이라는 말 때문에 디버깅으로, '테스트 대상의 결함 식별'이라는 말 때문에 테스트 분석으로 착각하기 쉽다. 디버깅은 장애를 재현하고, 분석해 결함을 찾고, 결함을 수정하는 것이다(1.1.2). 테스트 분석에도 테스트 대상의 결함 식별이 들어 있지만, 1.4.1은 실행 결과에 나타난 이상 사항의 분석과 보고를 테스트 실행 업무로 명시한다.","why":["이상 사항 분석은 1.4.1에 명시된 테스트 실행 업무다. 장애를 재현하고, 결함을 찾고, 수정하는 디버깅(1.1.2)과는 다르다.","정답. 이상 사항의 가능한 원인 파악과 관찰한 장애를 기반으로 한 보고는 1.4.1의 테스트 실행 업무다.","테스트 분석은 테스트 베이시스를 분석해 테스트 컨디션을 정의하는 활동이다. 실행 결과의 이상 사항을 분석해 원인을 파악하는 일은 1.4.1에서 테스트 실행 업무로 적혀 있다.","이상 사항의 원인 분석은 테스트 실행 업무다. 테스트 구현에서 테스트 환경을 구축하고 설정을 확인하는 일과는 목적이 다르다(1.4.1)."],"ref":"1.4.1","hard":true},{"id":"h1-015","ch":1,"lo":"FL-1.4.2","k":2,"q":"어느 회사의 테스트 관리자가 올해 테스트 프로세스를 바꿔야 했던 이유를 다음과 같이 정리했다.\n\n1. 고객사 담당자들이 테스트 참여에 소극적이어서 인수 테스트 일정을 잡기 어려웠다.\n2. 제품이 하나의 큰 애플리케이션에서 여러 개의 작은 서비스로 나뉘는 구조로 바뀌었다.\n3. 조직 개편으로 독립 테스트팀이 해체되고, 테스터가 각 개발팀에 나뉘어 배치되었다.\n4. 개발 방법론이 순차적 개발에서 짧은 반복 주기의 애자일 방식으로 바뀌었다.\n\nA. 소프트웨어 개발수명주기(SDLC)\nB. 이해관계자\nC. 조직적 요인\nD. 기술적 요인\n\n사례 1~4와 정황(context) 요소 A~D를 가장 적절하게 연결한 것은?","opts":["1B, 2C, 3D, 4A","1A, 2D, 3C, 4B","1B, 2D, 3C, 4A","1A, 2C, 3D, 4B"],"ans":[2],"exp":"1.4.2의 정황 요소: 이해관계자(필요, 기대, 요구사항, 협력 의지 등) → 1. 기술적 요인(소프트웨어 유형, 제품 아키텍처, 사용된 기술 등) → 2. 조직적 요인(조직 구조, 기존 정책, 적용한 프랙티스 등) → 3. 소프트웨어 개발수명주기(공학적 프랙티스, 개발 방법론 등) → 4. 이런 요소는 테스트 전략, 적용된 테스트 기법, 테스트 자동화 수준, 필요 커버리지 수준, 테스트웨어의 상세화 수준, 테스트 보고 등에 영향을 미친다. 함정 포인트: '구조'라는 말이 2(제품 아키텍처)와 3(조직 구조)에 모두 나온다. 제품의 구조는 기술적 요인, 조직의 구조는 조직적 요인이다.","why":["2C와 3D가 틀렸다. 제품 구조 변경은 기술적 요인(D), 조직 개편은 조직적 요인(C)이다(1.4.2).","1A와 4B가 틀렸다. 고객사 담당자의 협력 의지는 이해관계자(B), 개발 방법론 변경은 SDLC(A)다(1.4.2).","정답. 1B, 2D, 3C, 4A가 1.4.2의 정황 요소 설명과 일치한다.","네 짝이 모두 틀렸다. 1은 B, 2는 D, 3은 C, 4는 A다(1.4.2)."],"ref":"1.4.2","hard":true},{"id":"h1-016","ch":1,"lo":"FL-1.4.2","k":2,"q":"사내 행사 일정을 안내하는 웹페이지를 2주 안에 만들어 한 달만 쓰고 폐기할 예정이다. 한 테스터가 '모든 소프트웨어는 같은 기준으로 테스트해야 한다'며, 회사의 결제 시스템과 똑같이 100% 분기 커버리지와 상세한 테스트 절차 문서를 요구했다.\n\n이 주장에 대한 반론으로 실라버스에 가장 부합하는 것은?","opts":["비즈니스 도메인과 프로젝트 제약 조건 같은 정황 요소는 필요 커버리지 수준과 테스트웨어 상세화 수준에도 영향을 미쳐 기준이 달라질 수 있다","테스팅 비용은 테스트팀이 부담하므로, 필요 커버리지 수준과 테스트웨어 상세화 수준은 테스트팀이 자기 일정에 맞춰 스스로 정하면 된다","테스팅 방식을 바꾸는 정황 요소는 테스트 대상의 중요도 같은 비즈니스 도메인뿐이므로, 2주라는 일정은 빼고 낮은 중요도만 근거로 들어야 한다","완벽한 테스팅은 불가능하다는 원리에 따라, 100% 분기 커버리지처럼 모든 것을 테스트하려는 기준은 결제 시스템에도 요구해서는 안 된다"],"ans":[0],"exp":"1.4.2: 테스팅 비용은 이해관계자가 부담하며, 테스팅의 최종 목표는 이해관계자의 비즈니스 목표 달성을 지원하는 것이다. 따라서 테스팅 수행 방식은 비즈니스 도메인(테스트 대상의 중요도 등), 프로젝트 제약 조건(범위, 시간, 예산, 자원 등) 같은 정황 요소에 따라 달라진다. 이 요소들은 테스트 전략, 적용된 테스트 기법, 테스트 자동화 수준, 필요 커버리지 수준, 테스트웨어의 상세화 수준, 테스트 보고 등에 영향을 미친다. 한 달 쓰고 폐기할 사내 페이지라는 점(중요도)과 2주 일정(시간)은 결제 시스템과 다른 커버리지·문서 수준을 정할 근거가 된다. 함정 포인트: 네 보기 모두 테스터의 주장에 반대하므로 결론만 봐서는 고를 수 없다. 테스팅 비용을 누가 부담하는지(이해관계자), 정황 요소에 프로젝트 제약 조건이 들어가는지, '완벽한 테스팅'이 무엇을 뜻하는지(모든 것을 테스트하는 것)를 알아야 근거가 틀린 반론을 걸러낼 수 있다.","why":["정답. 정황 요소(비즈니스 도메인, 프로젝트 제약 조건)와 그 영향을 받는 필요 커버리지 수준·테스트웨어 상세화 수준이 1.4.2의 설명과 일치한다.","1.4.2는 테스팅 비용을 이해관계자가 부담하고, 테스팅의 최종 목표가 이해관계자의 비즈니스 목표 달성 지원이라고 한다. 테스트팀이 비용을 부담해 스스로 정한다는 근거가 틀렸다.","1.4.2의 정황 요소에는 비즈니스 도메인 말고도 프로젝트 제약 조건(범위, 시간, 예산, 자원 등)이 있다. 2주 일정도 근거가 된다.","원리 2(1.3)의 '완벽한 테스팅'은 모든 것을 테스트하는 것을 말한다. 100% 분기 커버리지는 코드의 모든 분기를 테스트 케이스로 실행하는, 달성할 수 있는 커버리지 목표다(4.3.2)."],"ref":"1.4.2","hard":true},{"id":"h1-017","ch":1,"lo":"FL-1.4.3","k":2,"q":"다음은 한 프로젝트에서 만든 테스트웨어(testware)를 이름을 밝히지 않고 설명한 것이다.\n\n1. 리스크마다 발생 가능성, 영향도, 완화 정보를 함께 적어 둔 목록\n2. 아직 개발되지 않은 외부 결제 서비스 대신 응답을 흉내 내도록 만든 구성요소\n3. 성능 테스트에 필요한 서버 사양, 네트워크 구성, 부하 생성 도구를 정리한 문서\n4. 요구사항 명세서에서 발견했지만 작성자가 바로 고치지 못한, 두 요구사항 간 모순에 대한 기록\n\nA. 테스트 분석\nB. 테스트 계획\nC. 테스트 구현\nD. 테스트 설계\n\n각 테스트웨어와 그것을 작업 산출물로 만드는 테스트 활동을 가장 적절하게 연결한 것은?","opts":["1B, 2D, 3C, 4A","1A, 2C, 3D, 4B","1A, 2D, 3C, 4B","1B, 2C, 3D, 4A"],"ans":[3],"exp":"1.4.3: 1은 리스크 관리 대장(risk register)으로 테스트 계획의 작업 산출물이다. 2는 서비스 가상화, 시뮬레이터, 스텁 같은 테스트 환경 요소로 테스트 구현의 작업 산출물이다. 3은 테스트 환경 요구사항으로 테스트 설계의 작업 산출물이다. 4는 (바로 수정하지 않은) 테스트 베이시스의 결함에 관한 결함 보고서로 테스트 분석의 작업 산출물이다. 함정 포인트: 2와 3은 둘 다 '테스트 환경'에 관한 것이다. 필요한 환경을 정리한 '요구사항'은 설계, 실제로 만든 '환경 요소'는 구현이다.","why":["2D와 3C가 틀렸다. 실제로 만든 구성요소(테스트 환경 요소)는 구현, 환경 요구사항 문서는 설계의 산출물이다(1.4.3).","1A와 4B가 틀렸다. 리스크 관리 대장은 테스트 계획, 테스트 베이시스 결함 보고서는 테스트 분석의 산출물이다(1.4.3).","네 짝이 모두 틀렸다. 1은 B, 2는 C, 3은 D, 4는 A다(1.4.3).","정답. 1B, 2C, 3D, 4A가 1.4.3의 분류와 일치한다."],"ref":"1.4.3","hard":true},{"id":"h1-018","ch":1,"lo":"FL-1.4.3","k":2,"q":"다음 중 같은 테스트 활동의 작업 산출물끼리 짝지은 것 두 개를 고르시오.","opts":["완료 조건(exit criteria) – 테스트 완료 보고서","테스트 차터 – 커버리지 항목","테스트 데이터 – 테스트 데이터 요구사항","테스트 로그 – 테스트 진행 상황 보고서","테스트 절차 – 테스트 스위트"],"ans":[1,4],"exp":"1.4.3: 테스트 차터와 커버리지 항목은 모두 테스트 설계의 작업 산출물이고, 테스트 절차와 테스트 스위트는 모두 테스트 구현의 작업 산출물이다. 나머지 짝은 이름이 비슷하지만 활동이 다르다. 완료 조건은 테스트 계획, 테스트 완료 보고서는 테스트 완료의 산출물이다. 테스트 데이터는 테스트 구현, 테스트 데이터 요구사항은 테스트 설계의 산출물이다. 테스트 로그는 테스트 실행, 테스트 진행 상황 보고서는 테스트 모니터링과 테스트 제어의 산출물이다. 함정 포인트: 이름이 닮은 짝일수록 같은 활동이라고 착각하기 쉽다. '완료 조건'은 이름에 '완료'가 들어 있지만 테스트 계획에서 정한다. 테스트 데이터 요구사항을 정의하는 것은 설계이고, 테스트 데이터를 실제로 만들거나 획득하는 것은 구현이다(1.4.1).","why":["완료 조건은 시작 조건과 함께 테스트 계획의 산출물이고, 테스트 완료 보고서는 테스트 완료의 산출물이다(1.4.3).","정답. 둘 다 테스트 설계의 산출물이다(1.4.3).","테스트 데이터는 테스트 구현, 테스트 데이터 요구사항은 테스트 설계의 산출물이다(1.4.3).","테스트 로그는 테스트 실행, 테스트 진행 상황 보고서는 테스트 모니터링과 테스트 제어의 산출물이다(1.4.3).","정답. 둘 다 테스트 구현의 산출물이다(1.4.3)."],"ref":"1.4.3","hard":true},{"id":"h1-019","ch":1,"lo":"FL-1.4.4","k":2,"q":"온라인 쇼핑몰 테스트팀이 이번 릴리스에서 추적성(traceability)을 활용한 사례다.\n\ni. 반품 정책 요구사항이 바뀌자, 그 요구사항에 연결된 테스트 컨디션과 테스트 케이스를 찾아 변경의 영향을 파악했다\nii. 테스트 진행 상황 보고서에 요구사항별 테스트 상태를 함께 실어, 이해관계자가 보고서를 쉽게 이해하게 했다\niii. 테스트 케이스와 요구사항을 연결한 추적성을 근거로, 출시 직전 테스트 대상의 잔존 리스크 수준을 평가했다\niv. 추적성은 프로젝트 진행 상황을 평가하는 정보만 줄 뿐 비즈니스 목표 대비 제품 품질을 평가하는 정보는 주지 않으므로, 품질 평가는 추적성 없이 따로 했다\nv. 리스크별로 연결된 테스트 결과를 모아, 출시 직전 테스트 대상의 잔존 리스크 수준을 평가했다\n\n실라버스가 설명하는 추적성의 가치에 맞게 활용한 것만 모두 고른 것은?","opts":["i, iii, iv","i, ii, v","ii, iii","iv, v"],"ans":[1],"exp":"1.4.4: 좋은 추적성은 변경사항의 영향을 파악할 수 있게 한다(i 옳음). 또 테스트 베이시스 요소들의 상태를 명시해 테스트 진행 상황 보고서와 테스트 완료 보고서를 더 쉽게 이해하게 한다(ii 옳음). 커버리지 평가의 예로, 테스트 결과에서 리스크로의 추적성을 통해 테스트 대상의 잔존 리스크 수준을 평가할 수 있다(v 옳음). 같은 곳에서 테스트 케이스에서 요구사항으로의 추적성의 예로 드는 것은 테스트 케이스가 요구사항을 커버하는지 확인하는 일이다. 추적성은 비즈니스 목표 대비 제품 품질, 프로세스 역량, 프로젝트 진행 상황 등을 평가할 수 있는 정보를 제공한다(iv 틀림). 함정 포인트: iii과 v는 둘 다 '잔존 리스크'를 말한다. 잔존 리스크 수준 평가에는 테스트 결과와 리스크를 잇는 추적성이 필요하다. 테스트 케이스와 요구사항의 연결에는 테스트 결과도 리스크 정보도 없어 잔존 리스크를 평가할 수 없다(iii 틀림). 1.4.4는 이 추적성의 예로 요구사항 커버리지 확인을 든다.","why":["iii과 iv가 들어 있어 틀렸다. 잔존 리스크 평가에는 테스트 결과에서 리스크로의 추적성이 필요하고, 추적성은 비즈니스 목표 대비 제품 품질을 평가할 정보도 준다(1.4.4).","정답. i, ii, v가 1.4.4와 일치한다.","iii이 들어 있어 틀렸다. 잔존 리스크 평가에는 테스트 결과에서 리스크로의 추적성이 필요하다. 테스트 케이스와 요구사항의 연결은 1.4.4가 요구사항 커버리지 확인의 예로 드는 추적성이다. i과 v도 빠졌다.","iv가 들어 있어 틀렸다. 추적성은 비즈니스 목표 대비 제품 품질, 프로세스 역량, 프로젝트 진행 상황을 평가할 정보를 제공한다(1.4.4)."],"ref":"1.4.4","hard":true},{"id":"h1-020","ch":1,"lo":"FL-1.4.5","k":2,"q":"스타트업의 팀 리더 최씨가 개발 업무와 함께 이번 분기의 테스트 관리 역할도 맡게 되었다. 최씨가 정리한 업무 목록 중 테스트 관리 역할의 주요 관심 영역에 속하지 **않는** 것은?","opts":["실제 테스트 진행 상황을 계획과 비교하고, 지연된 테스트의 범위를 조정하는 조치를 결정한다","테스트 목적을 정의하고, 예산과 일정 제약 안에서 목적을 가장 잘 달성할 접근법을 선택한다","효율적인 테스트 실행을 위해, 우선순위를 반영해 테스트 절차를 테스트 실행 일정으로 정리한다","테스트 완료 보고서를 작성하고, 향후 반복 주기를 위한 교훈과 개선 사항을 파악한다"],"ans":[2],"exp":"1.4.5: 테스트 관리 역할은 주로 테스트 계획, 테스트 모니터링, 테스트 제어, 테스트 완료 활동에 초점을 두고, 테스팅 역할은 주로 테스트 분석, 테스트 설계, 테스트 구현, 테스트 실행에 초점을 둔다. 우선순위를 반영해 테스트 절차를 테스트 실행 일정으로 정리하는 것은 1.4.1의 테스트 구현 업무이므로 테스팅 역할의 관심 영역이다. 테스트 관리 역할은 팀 리더, 테스트 관리자, 개발 관리자 등이 수행할 수 있고, 한 사람이 테스팅과 테스트 관리 역할을 동시에 수행하는 경우도 있다. 함정 포인트: '일정'과 '우선순위'라는 말이 관리 업무처럼 들린다. 하지만 테스트 실행 일정은 테스트 구현의 산출물이다.","why":["테스트 모니터링과 테스트 제어 업무로, 테스트 관리 역할의 주요 관심 영역이다(1.4.1, 1.4.5).","테스트 계획 업무로, 테스트 관리 역할의 주요 관심 영역이다(1.4.1, 1.4.5).","정답. 테스트 실행 일정 정리는 테스트 구현 업무라 테스팅 역할의 관심 영역이다(1.4.1, 1.4.5).","테스트 완료 업무로, 테스트 관리 역할의 주요 관심 영역이다(1.4.1, 1.4.5)."],"ref":"1.4.5","hard":true},{"id":"h1-021","ch":1,"lo":"FL-1.4.5","k":2,"q":"한 은행에서 애자일 팀 다섯 개가 하나의 인터넷뱅킹 제품을 함께 개발한다. 각 팀의 반복 주기 안에서 테스트 진행 점검과 테스트 범위 조정은 팀이 직접 하고, 다섯 팀에 걸친 공통 릴리스 테스트의 계획과 완료는 개발팀 밖의 테스트 관리자가 맡는다. 팀 C의 박씨는 이번 반복 주기에 테스트 케이스를 설계하고 실행하면서, 팀의 테스트 진행 상황을 계획과 비교해 점검하고 보고하는 일도 함께 한다.\n\n이 상황에 대한 설명으로 실라버스에 가장 부합하는 것은?","opts":["팀 C가 반복 주기 안에서 테스트 범위를 조정하는 것은 테스트 제어이므로, 팀 밖 테스트 관리자의 승인 없이 하면 실라버스의 역할 구분과 어긋난다","박씨의 진행 상황 점검은 자신이 실행한 테스트 결과를 기록하는 일의 연장이므로 테스트 실행에 속하고, 박씨는 테스팅 역할만 수행한다","팀 밖 관리자는 계획과 완료를 맡으니 테스트 관리 역할, 박씨는 설계와 실행을 맡으니 테스팅 역할이며, 역할은 이처럼 사람마다 하나로 정해진다","진행 상황을 계획과 비교해 점검하는 일은 테스트 관리 역할의 관심 영역이므로, 박씨는 테스팅 역할과 함께 테스트 관리 역할의 일부도 수행하고 있다"],"ans":[3],"exp":"1.4.5: 테스트 관리 역할의 주요 관심 영역은 테스트 계획, 테스트 모니터링, 테스트 제어, 테스트 완료이고, 테스팅 역할은 주로 테스트 분석, 테스트 설계, 테스트 구현, 테스트 실행에 초점을 둔다. 실제 진행 상황을 계획과 비교하는 것은 테스트 모니터링이다(1.4.1). 애자일 소프트웨어 개발에서는 테스트 관리 업무의 일부를 애자일팀이 처리할 수 있고, 여러 팀 또는 조직 전체의 협업이 필요한 과업은 개발팀 외부의 테스트 관리자가 수행할 수도 있다. 또 한 사람이 테스팅과 테스트 관리 역할을 동시에 수행하는 경우도 있다. 그래서 설계와 실행을 하면서 진행 상황도 점검하는 박씨는 두 역할을 함께 수행하고 있다. 함정 포인트: 박씨가 테스트 설계와 실행을 맡고 있어 테스팅 역할만 한다고 보기 쉽다. 실라버스는 테스트 관리 역할을 팀 리더, 개발 관리자 등도 수행할 수 있다고 하므로, 직함보다 맡은 활동을 보고 판단해야 한다.","why":["애자일 소프트웨어 개발에서는 테스트 관리 업무의 일부를 애자일팀이 처리할 수 있다(1.4.5). 팀이 범위를 조정하는 것은 역할 구분과 어긋나지 않는다.","실제 진행 상황을 계획과 비교하는 것은 테스트 모니터링이고(1.4.1), 테스트 모니터링은 테스트 관리 역할의 주요 관심 영역이다(1.4.5).","한 사람이 테스팅과 테스트 관리 역할을 동시에 수행하는 경우도 있다(1.4.5). 역할이 사람마다 하나로 정해지는 것은 아니다.","정답. 진행 상황 점검(테스트 모니터링)은 테스트 관리 역할의 관심 영역이고, 한 사람이 두 역할을 함께 수행할 수 있다(1.4.1, 1.4.5)."],"ref":"1.4.5","hard":true},{"id":"h1-022","ch":1,"lo":"FL-1.5.1","k":2,"q":"테스터 윤씨가 신규 대출 심사 시스템을 테스트하면서 한 일이다.\n\n1. 대출 약관 용어와 심사 실무를 알고 있어, 심사 담당자가 쓴 인수 기준의 의도를 정확히 이해했다.\n2. 경계값 분석을 적용해 금리 구간마다 테스트 케이스를 도출했다.\n3. 같은 입력을 수백 번 반복해야 하는 테스트를 적절한 테스트 도구로 자동화했다.\n4. 결함을 보고할 때 개발자의 설명을 끝까지 듣고, 사람이 아니라 사실을 중심으로 논의했다.\n\nA. 테스팅 지식\nB. 기술 지식\nC. 도메인 지식\nD. 우수한 의사소통 기술, 경청하는 자세, 팀플레이\n\n실라버스의 '테스팅에 보편적으로 필요한 기술'에 비추어, 1~4에서 윤씨가 가장 직접적으로 활용한 기술을 A~D와 바르게 연결한 것은?","opts":["1C, 2B, 3A, 4D","1D, 2A, 3B, 4C","1C, 2A, 3B, 4D","1D, 2B, 3A, 4C"],"ans":[2],"exp":"1.5.1의 예시를 기준으로 고른다. 테스팅 지식은 '예: 테스트 기법 활용'이므로 경계값 분석을 적용한 2가 A다. 기술 지식은 '예: 적절한 테스트 도구 사용'이므로 도구로 자동화한 3이 B다. 도메인 지식은 최종 사용자와 비즈니스 대표자를 이해하고 그들과 소통하기 위한 것이므로, 업무 지식으로 심사 담당자의 인수 기준을 이해한 1이 C다. 우수한 의사소통 기술, 경청하는 자세, 팀플레이는 결함을 보고하고 논의하는 데 필요하므로 4가 D다. 함정 포인트: '기술 지식'이라는 이름 때문에 테스트 기법과 헷갈리기 쉽다. 또 1과 4는 둘 다 다른 사람을 이해하는 장면이지만, 1은 업무 지식이 바탕이고 4는 결함을 논의하는 의사소통 자세가 바탕이다.","why":["2B와 3A가 틀렸다. 테스트 기법 활용은 테스팅 지식, 테스트 도구 사용은 기술 지식의 예다(1.5.1).","1D와 4C가 틀렸다. 업무 용어와 실무를 알아 비즈니스 담당자를 이해한 것은 도메인 지식, 결함을 보고하고 논의하며 경청한 것은 의사소통 기술과 경청하는 자세다(1.5.1).","정답. 1C, 2A, 3B, 4D가 1.5.1의 설명과 일치한다.","네 짝이 모두 틀렸다. 1은 C, 2는 A, 3은 B, 4는 D다(1.5.1)."],"ref":"1.5.1","hard":true},{"id":"h1-023","ch":1,"lo":"FL-1.5.3","k":2,"q":"보험사 차세대 시스템의 시스템 테스팅을 같은 회사의 별도 테스트 부서가 맡았다. 테스트 부서의 오씨는 요구사항 명세서와 가입 화면을 살펴보다가, 기획자와 개발자가 '모든 피보험자는 주민등록번호를 가진다'고 가정하고 가입 절차를 설계하고 구현했다는 점을 지적했다. 확인해 보니 외국인 피보험자는 가입할 수 없었다. 이 결함을 고치느라 출시가 3주 늦어지자, 영업 본부는 '테스트 부서가 출시를 막는 병목'이라며 테스트 부서를 비난했다.\n\n이 사례에 나타난 테스팅의 독립성(independence of testing)의 이점과 단점을 바르게 짝지은 것은?","opts":["이점: 명세와 구현 과정에서 이해관계자가 한 가정을 검증하고 이의를 제기할 수 있다 / 단점: 개발자가 품질에 대한 책임감을 잃을 수 있다","이점: 팀 내 의사소통과 협업이 강화되고, 다양한 기술을 활용해 시너지를 창출할 수 있다 / 단점: 병목으로 인식되거나 출시 지연의 원인으로 비난받을 수 있다","이점: 명세와 구현 과정에서 이해관계자가 한 가정을 검증하고 이의를 제기할 수 있다 / 단점: 병목으로 인식되거나 출시 지연의 원인으로 비난받을 수 있다","이점: 팀 내 의사소통과 협업이 강화되고, 다양한 기술을 활용해 시너지를 창출할 수 있다 / 단점: 개발자가 품질에 대한 책임감을 잃을 수 있다"],"ans":[2],"exp":"1.5.3: 독립적인 테스터는 시스템 명세를 작성하고 구현하는 과정에서 이해관계자가 한 가정을 검증하고 이의를 제기하거나 반증할 수 있다(오씨가 '모두 주민등록번호를 가진다'는 가정을 지적). 단점으로, 독립적인 테스터는 병목으로 인식되거나 출시 지연의 원인으로 비난받을 수 있다(영업 본부의 비난). 같은 조직 안이지만 저자의 팀 밖에 있는 테스트 부서이므로 높은 독립성에 해당한다. 함정 포인트: 보기에 나온 문장은 모두 실라버스에 있다. '개발자가 품질에 대한 책임감을 잃을 수 있다'는 독립성의 단점이 맞지만 이 사례에는 나타나지 않는다. '의사소통과 협업 강화, 시너지 창출'은 독립성이 아니라 전체 팀 접근법의 장점(1.5.2)이다.","why":["단점이 틀렸다. 책임감 상실은 독립성의 단점이 맞지만, 이 사례에 나타난 것은 출시 지연에 대한 비난이다(1.5.3).","이점이 틀렸다. 의사소통과 협업 강화, 시너지 창출은 전체 팀 접근법의 장점이다(1.5.2).","정답. 가정에 대한 이의 제기와 출시 지연에 대한 비난이 1.5.3의 이점, 단점과 일치한다.","이점과 단점이 모두 틀렸다. 이점은 전체 팀 접근법의 장점이고(1.5.2), 책임감 상실은 이 사례에 나타나지 않는다(1.5.3)."],"ref":"1.5.3","hard":true},{"id":"h1-024","ch":1,"lo":"FL-1.5.3","k":2,"q":"한 프로젝트에서 같은 모듈을 두 번 테스트했다. 모듈을 작성한 개발자가 직접 테스트해 반나절 만에 결함 12건을 찾았고, 이후 회사 밖 전문 업체의 테스터가 이틀 동안 테스트해 결함 4건을 더 찾았다. 업체가 찾은 4건은 모두 개발자가 업무 규칙을 잘못 이해해서 생긴 결함이었다. 프로젝트 관리자가 '업체가 더 적게 찾았으니 다음부터는 개발자 테스트만 하자'고 제안했다.\n\n관리자의 제안에 반대하는 근거로 실라버스에 비추어 가장 적절한 것은?","opts":["독립적인 테스터는 개발자와 다른 유형의 결함을 찾을 가능성이 높고, 업체가 찾은 업무 규칙 결함 4건이 그 예다","독립성이 친숙함을 대체하는 것은 아니며, 개발자는 자신이 작성한 코드에서 많은 결함을 효율적으로 찾아낼 수 있다","독립적인 테스터는 개발팀과 차단되어 협업과 의사소통이 어려울 수 있으며, 병목으로 인식될 수도 있다","독립적인 테스터가 참여하면 개발자가 품질에 대한 책임감을 더 강하게 갖게 되므로 업체 테스트를 유지해야 한다"],"ans":[0],"exp":"1.5.3: 독립적인 테스팅의 주요 이점은 독립적인 테스터가 배경, 기술적 관점, 편향이 다르기 때문에 개발자와 다른 유형의 장애와 결함을 식별할 가능성이 높다는 점이다. 업체가 찾은 4건(개발자가 업무 규칙을 잘못 이해해서 생긴 결함)이 그런 예다. 실라버스는 대부분의 프로젝트가 여러 수준의 독립성으로 테스팅하는 것이 가장 좋다고도 한다. 함정 포인트: 결함 '개수'로 비교하면 관리자 말이 그럴듯하다. 하지만 실라버스가 꼽는 독립적 테스팅의 주요 이점은 개발자와 '다른 유형'의 결함을 찾을 가능성이 높다는 점이다. 친숙함과 병목에 관한 보기는 실라버스에 있는 맞는 문장이지만, 오히려 관리자의 제안을 뒷받침한다.","why":["정답. 개발자와 다른 유형의 결함을 찾을 가능성이 높다는 것은 1.5.3의 주요 이점이고, 업체가 찾은 4건이 그 예다.","1.5.3에 있는 맞는 문장이지만, 개발자 테스트의 가치를 말할 뿐 업체 테스트를 없애면 안 되는 이유는 되지 않는다.","1.5.3에 있는 독립성의 단점이다. 맞는 문장이지만 오히려 관리자의 제안을 뒷받침한다.","실라버스는 독립적인 테스터가 있으면 개발자가 품질에 대한 책임감을 잃을 수도 있다고 한다(1.5.3). 반대로 쓴 문장이다."],"ref":"1.5.3","hard":true},{"id":"h3-001","ch":3,"lo":"FL-3.1.1","k":1,"q":"보험 청구 시스템 프로젝트의 테스터가 정적 테스팅(static testing)을 어디에 적용할지 검토하며 다음과 같이 메모했다.\ni. 고객사와 맺은 소프트웨어 개발 계약서도 리뷰(review)로 검토할 수 있는 작업 산출물(work product)이다.\nii. 테스트 케이스는 테스팅 활동에서 나온 산출물이므로 정적 테스팅으로 검토할 작업 산출물이 아니다.\niii. 공식 문법으로 작성된 시스템 모델은 정적 분석(static analysis) 도구로 검사할 수 있다.\niv. 라이선스 계약상 분석이 금지된 외부 업체의 실행 코드는 정적 테스팅에 적합한 작업 산출물이 아니다.\nv. 정적 분석은 사람이 읽고 이해할 수 있는 작업 산출물이라면 구조와 관계없이 적용할 수 있다.\n실라버스에 맞는 메모만 모두 고른 것은?","opts":["i, ii, iv","ii, iii, v","i, iii, iv","i, iv, v"],"ans":[2],"exp":"3.1.1 기준으로 진술을 하나씩 판정한다.\ni. 맞다. 읽고 이해할 수 있는 모든 작업 산출물은 리뷰 대상이 될 수 있고, 계약서는 실라버스가 직접 든 예시다.\nii. 틀리다. 테스트 케이스는 테스트 계획서, 테스트 차터와 함께 정적 테스팅으로 검토할 수 있는 작업 산출물의 예시다.\niii. 맞다. 정적 분석에는 검사 기준이 되는 구조(예: 모델, 공식 문법이 정해진 코드나 텍스트)가 필요한데, 공식 문법으로 쓴 모델은 이 조건을 갖췄다.\niv. 맞다. 사람이 해석하기 어렵고 도구로 분석해서도 안 되는 작업 산출물은 정적 테스팅에 적합하지 않다. 실라버스 예시가 '법적으로 문제가 되는 타사의 실행 코드'이고, 라이선스 계약으로 분석이 금지된 외부 업체의 실행 코드가 여기에 해당한다.\nv. 틀리다. '읽고 이해할 수 있으면 된다'는 리뷰의 조건이다. 정적 분석은 검사 기준이 되는 구조가 있어야 한다.\n따라서 i, iii, iv.\n함정 포인트: v는 리뷰의 조건(읽고 이해할 수 있음)과 정적 분석의 조건(검사할 구조가 있음)을 섞어 놓았고, ii는 '테스트 산출물은 검토 대상이 아니다'라는 직관에 기대고 있어 끌린다. iv는 '거의 모든 작업 산출물을 검토할 수 있다'는 문장만 기억하면 틀린 것처럼 보인다.","why":["ii가 틀렸다. 3.1.1은 테스트 케이스를 정적 테스팅으로 검토할 수 있는 작업 산출물 예시로 든다. 맞는 진술 iii도 빠졌다.","ii와 v가 틀렸다. 테스트 케이스는 검토 대상 예시이고, 정적 분석에는 검사 기준이 되는 구조가 필요하다(3.1.1). 맞는 진술 i, iv도 빠졌다.","정답. i(3.1.1 리뷰 대상), iii(3.1.1 정적 분석에 필요한 구조), iv(3.1.1 정적 테스팅에 부적합한 작업 산출물)가 모두 맞다.","v가 틀렸다. 구조가 필요한 것은 정적 분석이다(3.1.1). 맞는 진술 iii도 빠졌다."],"ref":"3.1.1","hard":true},{"id":"h3-002","ch":3,"lo":"FL-3.2.1","k":1,"q":"한 공공 서비스 앱 개발팀은 지금까지 요구사항 문서를 받은 뒤 출시 직전에야 현업 담당자에게 결과물을 보여 줬다. 이번 프로젝트부터는 스프린트마다 동작하는 화면을 현업 담당자와 사용자 대표에게 보여 주고 의견을 받기로 했다.\n실라버스가 이해관계자 피드백을 조기에 자주 받을 때의 이점으로 제시한 것은?","opts":["개발팀이 구현 중인 제품을 잘 이해해, 이해관계자에게 가장 중요하고 식별한 리스크에 가장 긍정적인 영향을 미치는 기능에 집중할 수 있다","개발팀이 이해관계자의 반응을 미리 보고, 구현 공수가 가장 적고 식별한 리스크가 가장 낮은 기능부터 먼저 집중해 개발 속도를 높일 수 있다","스프린트마다 받은 요구사항 변경 의견을 출시 직전까지 모아 두었다가 한 번에 반영하므로, 변경을 이해하고 구현하는 노력이 줄어든다","매번 이해관계자의 초기 요구를 기준으로 결과물을 확인하므로, 개발 도중 달라진 현재 요구는 반영하지 않아도 되어 개발 범위가 안정된다"],"ans":[0],"exp":"3.2.1: 이해관계자의 피드백을 자주 받으면 요구사항에 대한 오해를 방지하고 요구사항 변경을 조기에 이해하고 구현할 수 있다. 이를 통해 개발팀은 구현 중인 제품에 대한 이해도를 높이고, 이해관계자에게 가장 중요하고 식별한 리스크에 가장 긍정적인 영향을 미치는 기능에 집중할 수 있다.\n오답 셋은 이 설명을 한 군데씩 비틀었다. 집중할 기능의 기준을 '공수가 적고 리스크가 낮은 기능'으로 바꾸거나, 변경을 '조기에' 반영하는 것을 '출시 직전에 한꺼번에'로 바꾸거나, 이해관계자의 '초기 및 현재 요구'에서 현재 요구를 뺐다.\n함정 포인트: '공수가 가장 적고 리스크가 가장 낮은 기능'에 집중한다는 보기는 정답과 문장 구조와 결론이 같아서, 무엇에 집중하는지를 확인하지 않으면 고르기 쉽다.","why":["정답. 3.2.1: 개발팀은 구현 중인 제품에 대한 이해도를 높이고, 이해관계자에게 가장 중요하고 식별한 리스크에 가장 긍정적인 영향을 미치는 기능에 집중할 수 있다.","3.2.1이 말하는 집중 대상은 이해관계자에게 가장 중요하고 식별한 리스크에 가장 긍정적인 영향을 미치는 기능이다. 구현 공수가 적거나 리스크가 낮은 기능이 아니다.","3.2.1: 피드백을 자주 받으면 요구사항 변경을 조기에 이해하고 구현할 수 있다. 변경 의견을 출시 직전까지 모아 두는 것은 그 반대다.","3.2.1: 이해관계자의 참여가 적으면 제품이 이해관계자의 초기 및 현재 요구를 충족하지 못할 수 있다. 현재 요구를 반영하지 않아도 된다는 것은 이점이 아니다."],"ref":"3.2.1","hard":true},{"id":"h3-003","ch":3,"lo":"FL-3.2.3","k":1,"q":"한 팀이 다음 리뷰를 준비하며 역할 분담표를 만들었다. 각 진술은 역할과 그 역할에 배정한 책임이다.\ni. 저자(author) - 리뷰 대상인 API 명세서를 작성하고, 리뷰 후 지적된 내용을 반영해 직접 수정한다.\nii. 리뷰어(reviewer) - 프로젝트 팀원이 아닌 결제 분야 주제 전문가도 리뷰어로 참여할 수 있다.\niii. 리뷰 리더(review leader) - 리뷰에 대한 전반적인 책임을 지므로, 같은 리뷰에서 다른 역할을 함께 맡을 수 없다.\niv. 서기(scribe) - 리뷰어들이 찾은 이상 사항(anomaly)을 모으고, 회의 중 내린 결정과 새로 발견된 이상 사항을 기록한다.\nv. 관리자(manager) - 리뷰 회의를 운영하며 시간을 관리하고, 모두가 자유롭게 발언할 수 있는 안전한 환경을 만든다.\n실라버스의 역할과 책임에 맞는 진술만 모두 고른 것은?","opts":["i, iii, iv","ii, iii, v","i, iv, v","i, ii, iv"],"ans":[3],"exp":"3.2.3 기준으로 판정한다.\ni. 맞다. 저자는 리뷰 대상 작업 산출물을 작성하고 수정한다.\nii. 맞다. 리뷰어는 프로젝트에 참여하는 사람, 주제 전문가, 기타 이해관계자가 될 수 있다.\niii. 틀리다. 리뷰에 참여하는 사람은 여러 역할을 동시에 맡을 수 있다. 리뷰 리더의 책임은 참여자를 정하고 리뷰 시간과 장소를 협의하는 등 리뷰 전반을 책임지는 것이다.\niv. 맞다. 서기(기록자)의 책임 그대로다.\nv. 틀리다. 중재, 시간 관리, 안전한 리뷰 환경 조성은 중재자(퍼실리테이터)의 책임이다. 관리자는 리뷰할 내용을 결정하고 사람과 시간 등 자원을 제공한다.\n따라서 i, ii, iv.\n함정 포인트: iii은 리뷰 리더의 실제 책임인 '전반적인 책임'으로 시작해 그럴듯하지만, 한 명이 여러 역할을 맡을 수 있다는 3.2.3 문장과 어긋난다.","why":["iii이 틀렸다. 3.2.3: 한 명이 여러 역할을 동시에 맡을 수 있다. 맞는 진술 ii도 빠졌다.","iii과 v가 틀렸다. 한 명이 여러 역할을 맡을 수 있고, 회의 운영, 시간 관리, 안전한 환경 조성은 중재자의 책임이다(3.2.3). 맞는 진술 i, iv도 빠졌다.","v가 틀렸다. 관리자는 리뷰할 내용을 정하고 사람과 시간 등 자원을 제공한다. 회의 운영, 시간 관리, 안전한 환경 조성은 중재자의 책임이다(3.2.3). 맞는 진술 ii도 빠졌다.","정답. i(저자), ii(리뷰어), iv(서기)가 3.2.3의 역할과 책임에 맞다."],"ref":"3.2.3","hard":true},{"id":"h3-004","ch":3,"lo":"FL-3.2.3","k":1,"q":"품질 담당자가 지난달 진행한 리뷰를 점검하고 다음 문제를 찾았다. 각 문제는 리뷰의 주요 역할 중 한 역할이 맡은 책임이 제대로 수행되지 않아 생겼다.\n1. 리뷰 일주일 전까지 무엇을 리뷰할지 정해지지 않았고, 리뷰어들은 준비에 쓸 시간을 업무 계획에서 배정받지 못했다.\n2. 외부 결제 전문가를 리뷰에 부를지가 회의 당일까지 정해지지 않았고, 회의 날짜와 장소도 두 번이나 바뀌었다.\n3. 회의에서 한 리뷰어가 발언을 독점해 신입 리뷰어는 의견을 내지 못했고, 시간이 모자라 안건의 절반을 다루지 못했다.\n4. 회의가 끝난 뒤 보니, 회의에서 내린 결정과 회의 중 새로 발견한 이상 사항(anomaly)이 어디에도 남아 있지 않았다.\n역할은 다음과 같다.\nA. 리뷰 리더(review leader)\nB. 서기(scribe)\nC. 관리자(manager)\nD. 중재자(moderator)\nE. 리뷰어(reviewer)\n각 문제를 그 책임을 맡은 역할과 바르게 연결한 것은?","opts":["1C, 2A, 3E, 4D","1A, 2C, 3D, 4B","1C, 2A, 3D, 4B","1A, 2C, 3E, 4D"],"ans":[2],"exp":"3.2.3의 역할별 책임과 대조한다.\n1. 리뷰할 내용을 결정하고 리뷰에 필요한 사람과 시간 등 자원을 제공하는 것은 관리자(C)다.\n2. 리뷰에 참여할 사람을 결정하고 리뷰 시간과 장소를 협의하는 것은 리뷰 리더(A)다.\n3. 중재, 시간 관리, 모든 사람이 자유롭게 발언할 수 있는 안전한 리뷰 환경 조성 등 리뷰 회의의 효과적인 운영은 중재자(D)가 맡는다.\n4. 결정 사항이나 리뷰 회의 중에 발견한 새로운 이상 사항 등 리뷰 정보를 기록하는 것은 서기(B)다.\n따라서 1C, 2A, 3D, 4B.\n함정 포인트: 1~3이 모두 시간과 관련된다(1은 준비에 쓸 시간, 2는 회의 날짜, 3은 회의 안의 시간). 리뷰에 쓸 시간이라는 자원을 제공하는 것은 관리자, 리뷰를 언제 어디서 할지 협의하는 것은 리뷰 리더, 회의 안에서 시간을 관리하는 것은 중재자다. 3은 발언을 독점한 사람이 리뷰어라서 리뷰어의 책임으로 착각하기 쉽지만, 리뷰어의 책임은 리뷰를 수행하는 것이고 회의 운영은 중재자의 몫이다.","why":["3과 4가 틀렸다. 모두가 발언할 수 있게 하고 회의 시간을 관리하는 것은 중재자, 결정 사항과 새 이상 사항을 기록하는 것은 서기의 책임이다(3.2.3). 리뷰어의 책임은 리뷰 수행이다.","1과 2가 뒤바뀌었다. 리뷰할 내용을 정하고 사람과 시간 등 자원을 제공하는 것은 관리자, 참여자를 정하고 리뷰 시간과 장소를 협의하는 것은 리뷰 리더다(3.2.3).","정답. 네 쌍 모두 3.2.3의 역할별 책임과 일치한다.","네 쌍이 모두 틀렸다. 1은 관리자, 2는 리뷰 리더, 3은 중재자, 4는 서기의 책임이다(3.2.3)."],"ref":"3.2.3","hard":true},{"id":"h3-005","ch":3,"lo":"FL-3.2.5","k":1,"q":"리뷰를 도입한 지 석 달 된 조직의 회고에서 다음 문제가 나왔다.\n1. 설계서 300쪽을 한 번에 리뷰하다 보니, 회의 후반에는 리뷰어들이 지쳐 같은 쪽을 건성으로 넘겼다.\n2. 리뷰 자료가 회의 1시간 전에야 배포되어 리뷰어 대부분이 회의에서 문서를 처음 읽었다.\n3. 리뷰에서 지적받은 건수를 개인 성과 지표로 집계하자, 저자들이 자기 산출물을 리뷰에 올리기를 꺼렸다.\n4. 처음 서기(scribe)를 맡은 직원이 무엇을 해야 하는지 몰라, 리뷰어들이 미리 낸 이상 사항(anomaly)을 모으지 않고 회의 발언만 받아 적었다.\n실라버스에 제시된 리뷰의 성공 요소는 다음과 같다.\nA. 참가자가 리뷰를 준비할 수 있는 충분한 시간을 제공한다\nB. 모든 참가자가 자신의 역할을 어떻게 충족해야 하는지 알 수 있도록 적절한 교육을 제공한다\nC. 리뷰어가 집중력을 잃지 않도록 작은 단위로 리뷰를 진행한다\nD. 명확한 목표와 측정 가능한 완료 조건을 정의하되, 참가자의 평가가 목적이 되어서는 안 된다\n각 문제를 가장 직접 해결하는 성공 요소와 바르게 연결한 것은?","opts":["1A, 2C, 3D, 4B","1C, 2A, 3B, 4D","1C, 2A, 3D, 4B","1A, 2C, 3B, 4D"],"ans":[2],"exp":"3.2.5의 성공 요소와 대조한다.\n1. 큰 작업 산출물을 한 번에 리뷰해 리뷰어가 지침 → C(작은 단위로 리뷰 진행)\n2. 자료를 늦게 받아 준비하지 못함 → A(충분한 준비 시간 제공)\n3. 리뷰 결과가 개인 성과 평가에 쓰임 → D(참가자의 평가가 목적이 되어서는 절대 안 된다)\n4. 서기가 자기 역할을 수행하는 방법을 모름 → B(적절한 교육 제공). 리뷰어로부터 이상 사항을 수집하는 것은 3.2.3의 서기 책임이다.\n따라서 1C, 2A, 3D, 4B.\n함정 포인트: 1과 2는 모두 '리뷰어가 제 몫을 못 했다'는 증상이라 A와 C를 바꿔 고르기 쉽다. 원인이 분량(집중력)인지 준비 시간인지를 봐야 한다. 4는 기록이 엉성해진 문제라 목표·완료 조건(D)이 불명확했던 탓으로 보일 수 있지만, 원인은 서기가 자기 역할을 몰랐다는 것이므로 교육(B)으로 해결한다.","why":["1과 2가 뒤바뀌었다. 분량이 커서 리뷰어가 지친 문제는 작은 단위로 리뷰(C), 자료를 늦게 받아 준비하지 못한 문제는 충분한 준비 시간(A)으로 해결한다(3.2.5).","3과 4가 뒤바뀌었다. 지적 건수를 개인 성과로 집계한 문제는 참가자 평가를 목적으로 삼지 말라는 D, 서기가 할 일을 몰랐던 문제는 교육 제공(B)이다(3.2.5).","정답. 네 쌍 모두 3.2.5의 성공 요소와 맞다.","네 쌍이 모두 틀렸다. 1은 C, 2는 A, 3은 D, 4는 B다(3.2.5)."],"ref":"3.2.5","hard":true},{"id":"h3-006","ch":3,"lo":"FL-3.2.5","k":1,"q":"리뷰 개선 TF가 내년도 리뷰 운영 방안 다섯 가지를 제안했다.\n다음 중 실라버스에 제시된 리뷰의 성공 요소에 부합하는 방안 두 개를 고르시오.","opts":["리뷰 목표는 회의 때마다 참가자들이 정하고, 완료 조건은 측정하기 어려우므로 따로 정하지 않는다","아이디어를 모을 초안은 워크쓰루로, 이상 사항을 최대한 많이 찾을 설계서는 인스펙션으로 리뷰한다","리뷰를 조직 문화로 정착시키려고, 리뷰 참여 횟수와 찾아낸 이상 사항 수를 개인 평가 항목에 넣는다","관리층이 리뷰를 공식 업무로 인정하고, 리뷰에 필요한 일정을 프로젝트 계획에 반영해 지원한다","리뷰 회의는 진행자를 따로 두지 않고, 참석자 모두가 같은 권한으로 자유롭게 발언하게 한다"],"ans":[1,3],"exp":"3.2.5의 성공 요소 목록과 대조한다.\n- '주어진 목표를 달성할 수 있으면서 작업 산출물 유형, 리뷰 참여자, 프로젝트 요구사항 및 정황에 맞는 리뷰 유형을 선택한다' → 새로운 아이디어 창출(워크쓰루의 목적)과 이상 사항 최대 발견(인스펙션의 주요 목적)에 맞춰 유형을 고르는 방안이 부합한다(3.2.4 참고).\n- '리뷰 프로세스를 관리층이 지원한다' → 관리층이 리뷰를 공식 업무로 인정하고 일정을 반영하는 방안이 부합한다.\n나머지 셋은 성공 요소를 한 군데씩 어겼다. 명확한 목표와 측정 가능한 완료 조건을 정의해야 하고, 참가자의 평가가 목적이 되어서는 절대 안 되며, 회의에 퍼실리테이션을 적용해야 한다.\n함정 포인트: 오답 셋은 '참가자 합의', '조직 문화', '자유로운 발언'처럼 좋게 들리는 표현을 앞세웠다. 뒤에 붙은 조치(완료 조건 없음, 개인 평가 반영, 진행자 없음)가 성공 요소에 어긋난다.","why":["3.2.5: 명확한 목표와 측정 가능한 완료 조건을 정의한다. 완료 조건은 3.2.2의 계획 단계에서 리뷰 범위로 정의하는 항목이기도 하다.","정답. 3.2.5: 주어진 목표를 달성할 수 있으면서 작업 산출물 유형 등에 맞는 리뷰 유형을 선택한다. 새로운 아이디어 창출은 워크쓰루(walkthrough)의 목적, 이상 사항을 최대한 많이 찾는 것은 인스펙션(inspection)의 주요 목적이다(3.2.4).","3.2.5: 참가자의 평가가 목적이 되어서는 절대 안 된다. 리뷰를 조직 문화의 일부로 만드는 목적은 학습 및 프로세스 개선 촉진이다.","정답. 3.2.5: 리뷰 프로세스를 관리층이 지원한다.","3.2.5: 회의에 퍼실리테이션을 적용한다. 모든 사람이 자유롭게 발언할 수 있는 안전한 환경을 만드는 것도 중재자(퍼실리테이터)의 책임이다(3.2.3)."],"ref":"3.2.5","hard":true},{"id":"h3-007","ch":3,"lo":"FL-3.1.2","k":2,"q":"한 결제 시스템 팀이 이번 프로젝트부터 설계서와 소스 코드에 리뷰를 도입했다. 프로젝트가 끝난 뒤 다음 사실이 확인되었다.\n- 리뷰 준비와 회의에 이전 프로젝트보다 많은 노력이 들었지만, 전체 프로젝트 비용은 오히려 낮았다. 시스템 테스트 케이스 수와 실행 횟수는 이전 프로젝트와 비슷했다.\n- 코드 리뷰에서, 설계서에 정한 설계 패턴이 코드에 의도대로 구현되지 않은 것을 발견했다. 이 코드는 기존 시스템 테스트를 모두 통과한 상태였다.\n이 결과를 정적 테스팅(static testing)의 가치에 비추어 설명한 것으로 가장 적절한 것은?","opts":["리뷰 구축 비용은 클 수 있지만 프로젝트 후반의 결함 수정 노력이 줄어 전체 비용이 낮아지는 경우가 많다. 설계 패턴 문제는 시스템 테스트를 더 촘촘히 추가했다면 장애로 드러났을 결함이다","리뷰가 동적 테스팅의 일부를 대신하게 되어 테스트 실행 노력이 줄었기 때문에 전체 비용이 낮아졌다. 설계 패턴 문제는 동적 테스팅으로는 식별할 수 없는 결함의 예다","리뷰가 동적 테스팅의 일부를 대신하게 되어 테스트 실행 노력이 줄었기 때문에 전체 비용이 낮아졌다. 설계 패턴 문제는 시스템 테스트를 더 촘촘히 추가했다면 장애로 드러났을 결함이다","리뷰 구축 비용은 클 수 있지만 프로젝트 후반의 결함 수정 노력이 줄어 전체 비용이 낮아지는 경우가 많다. 설계 패턴 문제는 동적 테스팅으로는 식별할 수 없는 결함의 예다"],"ans":[3],"exp":"3.1.2의 두 문장으로 판단한다.\n① 리뷰를 구축하는 비용은 클 수 있지만, 프로젝트 후반에 결함을 수정하는 시간과 노력이 줄어 리뷰를 하지 않을 때보다 전체 프로젝트 비용이 훨씬 낮아지는 경우가 많다.\n② 정적 테스팅은 동적 테스팅으로 식별할 수 없는 결함(예: 도달 불가능한 코드, 원하는 대로 구현되지 않은 설계 패턴, 비-실행 작업 산출물의 결함)을 찾을 수 있다.\n앞부분은 ①, 뒷부분은 ②와 맞아야 한다. 앞부분 두 가지와 뒷부분 두 가지가 보기에 각각 두 번씩 나오므로 앞뒤를 모두 판단해야 한다.\n함정 포인트: '리뷰가 동적 테스팅의 일부를 대신해 실행 노력이 줄었다'는 설명은 그럴듯하지만, 상황에서 시스템 테스트 수와 실행 횟수는 그대로였고, 실라버스도 비용이 낮아지는 이유를 후반의 결함 수정 노력 감소로 든다. 정적 테스팅과 동적 테스팅은 서로를 보완한다(3.1.3).","why":["앞부분은 3.1.2와 맞다. 하지만 원하는 대로 구현되지 않은 설계 패턴은 3.1.2가 '동적 테스팅으로 식별할 수 없는 결함'의 예로 든 것이다. 테스트를 늘리면 장애로 드러난다고 볼 수 없다.","뒷부분은 맞다. 하지만 3.1.2는 비용이 낮아지는 이유를 후반의 결함 수정 시간과 노력 감소로 설명하고, 상황에서도 시스템 테스트 수와 실행 횟수는 줄지 않았다. 정적 테스팅과 동적 테스팅은 서로를 보완한다(3.1.3).","앞뒤 모두 틀렸다. 비용 감소의 이유는 후반의 결함 수정 노력 감소이고, 설계 패턴 문제는 동적 테스팅으로 식별할 수 없는 결함의 예다(3.1.2).","정답. 앞부분은 3.1.2의 비용 설명, 뒷부분은 3.1.2의 '동적 테스팅으로 식별할 수 없는 결함' 예시와 일치한다."],"ref":"3.1.2","hard":true},{"id":"h3-008","ch":3,"lo":"FL-3.1.3","k":2,"q":"테스트 리드가 팀 위키에 정적 테스팅(static testing)과 동적 테스팅(dynamic testing)의 차이를 다음과 같이 정리했다.\ni. 두 활동은 결함 식별을 지원하는 등 목적이 비슷하고 서로를 보완하지만, 둘 중 한 가지로만 식별할 수 있는 결함 유형도 있다.\nii. 버퍼 오버플로우 같은 특정 유형의 보안 취약성은 정적 테스팅으로 더 쉽게, 또는 더 적은 비용으로 식별할 수 있다.\niii. 인수 조건 하나에 대한 테스트 누락 같은 테스트 베이시스 커버리지의 차이는 테스트를 실행해 봐야 드러나므로 동적 테스팅으로 찾는 것이 더 쉽다.\niv. 동적 테스팅은 실행 가능한 작업 산출물에만 적용할 수 있다.\nv. 비효율적인 데이터베이스 구조 같은 설계 결함은 성능 테스트를 실행해 봐야 더 쉽게, 더 적은 비용으로 찾을 수 있다.\n실라버스와 일치하는 진술만 모두 고른 것은?","opts":["i, ii, iv","i, iii, iv","ii, iii, v","i, iv, v"],"ans":[0],"exp":"3.1.3 기준으로 판정한다.\ni. 맞다. 두 활동은 비슷한 목적을 가지고 서로를 보완하며, 둘 중 한 가지로만 식별할 수 있는 결함 유형도 있다.\nii. 맞다. '특정 유형의 보안 취약성(예: 버퍼 오버플로우)'은 정적 테스팅으로 더 쉽게 적은 비용으로 식별할 수 있는 대표 결함이다.\niii. 틀리다. '테스트 베이시스 커버리지의 차이 또는 부정확성(예: 인수 조건 하나에 대한 테스트 누락)'도 정적 테스팅으로 더 쉽게 찾는 대표 결함 목록에 있다.\niv. 맞다. 정적 테스팅은 비-실행 작업 산출물에도 적용할 수 있지만, 동적 테스팅은 실행 가능한 작업 산출물에만 적용할 수 있다.\nv. 틀리다. '설계 결함(예: 비효율적인 데이터베이스 구조, 모듈화 불량)'은 정적 테스팅으로 더 쉽게 적은 비용으로 식별할 수 있는 대표 결함이다.\n따라서 i, ii, iv.\n함정 포인트: iii과 v는 '실행해 봐야 드러난다'는 그럴듯한 이유를 붙였지만, 둘 다 3.1.3의 '정적 테스팅으로 더 쉽게 찾는 결함' 목록에 있는 항목이다.","why":["정답. i, ii, iv 모두 3.1.3 문장과 일치한다.","iii이 틀렸다. 인수 조건에 대한 테스트 누락은 3.1.3에서 정적 테스팅으로 더 쉽게 찾는 결함의 예다. 맞는 진술 ii도 빠졌다.","iii과 v가 틀렸다. 둘 다 3.1.3에서 정적 테스팅으로 더 쉽게 찾는 결함의 예다. 맞는 진술 i, iv도 빠졌다.","v가 틀렸다. 비효율적인 데이터베이스 구조는 3.1.3에서 정적 테스팅으로 더 쉽게, 적은 비용으로 찾는 설계 결함의 예다. 맞는 진술 ii도 빠졌다."],"ref":"3.1.3","hard":true},{"id":"h3-009","ch":3,"lo":"FL-3.1.3","k":2,"q":"한 팀이 출시 전에 찾아야 할 네 가지 문제와, 각 문제에 쓸 방법 및 그 이유를 표로 정리했다.\n선택한 방법과 그 이유가 모두 실라버스에 맞는 행은?","table":{"head":["행","찾으려는 문제","선택한 방법","선택 이유"],"rows":[["1","2월 29일에만 실행되는 이자 계산 분기의 결함","정적 분석","정적 테스팅은 거의 실행되지 않거나 동적 테스팅으로 도달하기 어려운 코드 경로의 결함을 더 쉽게 발견할 수 있기 때문"],["2","월말 정산 때 대량 데이터 처리가 느려지는 문제","동적 테스팅","동적 테스팅은 결함을 직접 식별하므로 처리 지연을 일으킨 코드를 바로 찾을 수 있기 때문"],["3","요구사항 명세서의 두 조항 사이의 모순","리뷰","정적 테스팅은 실행 가능한 작업 산출물에만 적용할 수 있기 때문"],["4","코딩 표준의 명명 규칙 위반","정적 분석","정적 테스팅은 유지보수성처럼 코드 실행에 의존하는 품질 특성을 측정하는 데 쓰이기 때문"]]},"opts":["1행(윤년 이자 분기)","2행(대량 처리 지연)","3행(요구사항 모순)","4행(명명 규칙 위반)"],"ans":[0],"exp":"3.1.3으로 방법과 이유를 각각 확인한다. 네 행 모두 방법은 실라버스에 맞으므로 이유에서 갈린다.\n1행: 방법과 이유 모두 맞다. 정적 테스팅은 거의 실행되지 않거나 동적 테스팅으로 도달하기 어려운 코드 경로에 있는 결함을 더 쉽게 발견할 수 있다. 2월 29일에만 실행되는 분기가 그런 경로다.\n2행: 방법은 맞다(처리 시간 같은 성능 효율성은 코드 실행에 의존하는 품질 특성이라 동적 테스팅으로 측정한다). 이유가 틀렸다. 결함을 직접 식별하는 것은 정적 테스팅이고, 동적 테스팅은 장애를 일으킨 뒤 후속 분석으로 연관된 결함을 찾는다.\n3행: 방법은 맞다(요구사항 결함은 정적 테스팅으로 더 쉽게 찾는 대표 결함이다). 이유가 틀렸다. 실행 가능한 작업 산출물에만 적용할 수 있는 것은 동적 테스팅이고, 정적 테스팅은 비-실행 작업 산출물에도 적용할 수 있다.\n4행: 방법은 맞다(표준 위반은 정적 테스팅으로 더 쉽게 찾는 대표 결함이다). 이유가 틀렸다. 정적 테스팅은 코드 실행에 의존하지 않는 품질 특성(예: 유지보수성)을 측정하는 데 쓴다.\n함정 포인트: 2~4행의 이유는 3.1.3 문장에서 한 곳씩(정적↔동적, 의존하지 않는↔의존하는) 바꿔 놓아 실라버스 문장처럼 읽힌다. 방법만 보면 네 행이 모두 맞아 보인다.","why":["정답. 3.1.3: 정적 테스팅은 거의 실행되지 않거나 동적 테스팅으로 도달하기 어려운 코드 경로에 있는 결함을 더 쉽게 발견할 수 있다.","방법은 맞지만 이유가 틀렸다. 3.1.3: 정적 테스팅은 결함을 직접 식별하고, 동적 테스팅은 장애를 일으킨 뒤 후속 분석으로 연관된 결함을 찾는다.","방법은 맞지만 이유가 틀렸다. 3.1.3: 정적 테스팅은 비-실행 작업 산출물에도 적용할 수 있고, 실행 가능한 작업 산출물에만 적용할 수 있는 것은 동적 테스팅이다.","방법은 맞지만 이유가 틀렸다. 3.1.3: 정적 테스팅은 코드 실행에 의존하지 않는 품질 특성(예: 유지보수성)을 측정하는 데 사용할 수 있다."],"ref":"3.1.3","hard":true},{"id":"h3-010","ch":3,"lo":"FL-3.2.2","k":2,"q":"한 팀이 ISO/IEC 20246에 기반한 리뷰 프로세스로 결제 API 설계서를 리뷰한 뒤, 활동별로 한 일 중 일부를 다음 표로 정리했다.\n실라버스의 리뷰 프로세스 활동 설명과 맞지 **않게** 수행된 활동은?","table":{"head":["활동","팀이 한 일"],"rows":[["계획(planning)","리뷰 목적, 대상 작업 산출물, 집중할 영역, 공수와 일정을 정했다. 완료 조건(exit criteria)은 이상 사항이 얼마나 나오는지 본 뒤 논의 및 분석 단계에서 정하기로 했다."],["개별 리뷰(individual review)","각 리뷰어가 시나리오 기반 리뷰를 적용해 설계서를 평가하고, 이상 사항뿐 아니라 권장 사항과 의문 사항도 기록했다."],["논의 및 분석(communication and analysis)","이상 사항이 반드시 결함은 아니므로 회의에서 각 이상 사항의 상태, 담당자, 필요 조치를 정했다. 조치를 마무리하려고 후속 리뷰도 한 번 더 잡았다."],["수정 및 보고(fixing and reporting)","결함마다 결함 보고서를 작성해 후속 조치를 추적했고, 완료 조건을 충족한 뒤 설계서를 승인하고 리뷰 결과를 보고했다."]]},"opts":["계획","개별 리뷰","논의 및 분석","수정 및 보고"],"ans":[0],"exp":"3.2.2: 계획 단계에서 목적, 리뷰 대상 작업 산출물, 평가할 품질 특성, 집중할 영역, 완료 조건, 적용 표준 같은 추가 정보, 공수, 리뷰 일정으로 구성되는 리뷰의 범위를 정의해야 한다. 완료 조건을 논의 및 분석 단계로 미룬 계획 활동이 맞지 않는다.\n나머지 세 활동은 3.2.2의 설명과 일치한다.\n함정 포인트: 개별 리뷰에서 권장 사항과 의문 사항까지 기록하는 것, 논의 및 분석에서 후속 리뷰를 잡는 것은 낯설어 틀린 것처럼 느껴지지만 둘 다 3.2.2에 있는 내용이다.","why":["정답. 3.2.2: 완료 조건은 계획 단계에서 정의해야 하는 리뷰 범위의 일부다.","3.2.2와 일치한다. 리뷰어는 리뷰 기법(예: 시나리오 기반 리뷰)을 적용해 이상 사항, 권장 사항, 의문 사항을 식별하고 모두 기록한다.","3.2.2와 일치한다. 이상 사항이 반드시 결함은 아니므로 상태, 담당자, 필요 조치를 판단하며, 조치를 완료하기 위해 후속 리뷰가 필요할 수 있다.","3.2.2와 일치한다. 모든 결함에 대해 결함 보고서를 작성해 후속 조치를 추적하고, 완료 조건을 충족하면 작업 결과물을 승인하며 리뷰 결과를 보고한다."],"ref":"3.2.2","hard":true},{"id":"h3-011","ch":3,"lo":"FL-3.2.4","k":2,"q":"실라버스에 나오는 네 가지 리뷰 유형, 즉 비공식 리뷰(informal review), 워크쓰루(walkthrough), 기술 리뷰(technical review), 인스펙션(inspection)의 목적을 비교하고 있다.\n워크쓰루와 기술 리뷰 양쪽 모두의 목적으로 제시되면서, 비공식 리뷰와 인스펙션의 목적으로는 제시되지 않는 것 두 개를 고르시오.","opts":["합의 도출","리뷰어 교육","저자의 개선 동기 부여 및 지원","품질 평가 및 신뢰 구축","새로운 아이디어 창출"],"ans":[0,4],"exp":"3.2.4의 목적을 유형별로 정리하면 다음과 같다.\n- 비공식 리뷰: 이상 사항 식별(주요 목적)\n- 워크쓰루: 품질 평가 및 작업 산출물에 대한 신뢰 구축, 리뷰어 교육, 합의 도출, 새로운 아이디어 창출, 저자가 개선할 수 있도록 동기 부여 및 지원, 이상 사항 발견\n- 기술 리뷰: 기술 문제에 대한 합의 도출 및 결정, 이상 사항 식별, 품질 평가 및 신뢰 구축, 새로운 아이디어 창출, 저자 동기 부여 및 지원\n- 인스펙션: 이상 사항을 최대한 많이 찾기(주요 목적), 품질 평가, 신뢰 구축, 저자 동기 부여 및 지원\n워크쓰루와 기술 리뷰 양쪽에 모두 있고 비공식 리뷰와 인스펙션에는 없는 것은 합의 도출과 새로운 아이디어 창출이다.\n함정 포인트: 리뷰어 교육은 워크쓰루에만 있고 기술 리뷰에는 없다. 저자 동기 부여와 품질 평가·신뢰 구축은 인스펙션의 기타 목적에도 있다.","why":["정답. 워크쓰루(합의 도출)와 기술 리뷰(기술 문제에 대한 합의 도출 및 결정)에 있고, 비공식 리뷰와 인스펙션의 목적에는 없다(3.2.4).","워크쓰루의 목적이지만 3.2.4의 기술 리뷰 목적에는 리뷰어 교육이 없다. 양쪽 모두에 있어야 한다는 조건을 충족하지 못한다.","워크쓰루, 기술 리뷰, 인스펙션 세 유형의 목적이다. 3.2.4는 인스펙션의 기타 목적으로도 저자가 개선할 수 있도록 동기 부여 및 지원을 든다.","워크쓰루, 기술 리뷰, 인스펙션 세 유형의 목적이다. 3.2.4는 인스펙션의 기타 목적으로 품질 평가와 작업 산출물에 대한 신뢰 구축을 든다.","정답. 워크쓰루와 기술 리뷰 모두 새로운 아이디어 창출을 목적으로 하며, 비공식 리뷰와 인스펙션의 목적에는 없다(3.2.4)."],"ref":"3.2.4","hard":true},{"id":"h3-012","ch":3,"lo":"FL-3.2.4","k":2,"q":"네 팀이 각자 수행한 리뷰를 다음과 같이 설명했다.\n- 팀 1(워크쓰루(walkthrough)라고 부름): 중재자(moderator)가 리더가 되어 회의를 이끌었고, 리뷰어 교육과 새로운 아이디어 창출을 목적에 포함했다.\n- 팀 2(기술 리뷰(technical review)라고 부름): 기술적인 자격을 갖춘 리뷰어가 참여했고, 저자가 리더가 되어 기술 문제에 대한 결정을 이끌어 냈다.\n- 팀 3(인스펙션(inspection)이라고 부름): 저자는 리뷰 리더나 서기를 맡지 않았고, 보편적 리뷰 프로세스를 모두 따랐으며, 수집한 메트릭을 리뷰 프로세스 개선에 활용했다.\n- 팀 4(비공식 리뷰(informal review)라고 부름): 정의된 프로세스 없이 진행했고, 주요 목적을 리뷰어 교육과 합의 도출에 두었다.\n설명한 특징이 팀이 붙인 리뷰 유형과 실라버스에 비추어 일치하는 팀은?","opts":["팀 1(워크쓰루)","팀 2(기술 리뷰)","팀 3(인스펙션)","팀 4(비공식 리뷰)"],"ans":[2],"exp":"3.2.4와 하나씩 대조한다.\n팀 1: 워크쓰루는 저자가 리더가 된다. 리뷰어 교육과 새로운 아이디어 창출은 워크쓰루의 목적이 맞지만, 중재자가 리더인 것은 맞지 않는다.\n팀 2: 기술 리뷰는 기술적인 자격을 갖춘 리뷰어가 수행하고 중재자가 리더가 된다. 저자가 리더인 것은 맞지 않는다.\n팀 3: 인스펙션은 가장 공식적인 유형으로 보편적 프로세스를 철저히 따르고, 메트릭을 수집해 리뷰 프로세스를 포함한 전체 소프트웨어 개발수명주기(SDLC)를 개선하는 데 쓰며, 저자는 리뷰 리더나 서기가 될 수 없다. 모두 일치한다.\n팀 4: 비공식 리뷰의 주요 목적은 이상 사항 식별이다.\n함정 포인트: 팀 1과 팀 2는 목적 부분이 실라버스와 맞아 정답처럼 보이지만, 리더가 뒤바뀌었다(워크쓰루는 저자, 기술 리뷰는 중재자).","why":["3.2.4: 워크쓰루는 저자가 리더가 된다. 목적은 맞지만 리더가 틀렸다.","3.2.4: 기술 리뷰는 중재자가 리더가 된다. 저자가 리더인 것은 워크쓰루의 특징이다.","정답. 3.2.4의 인스펙션 설명(보편적 프로세스 준수, 메트릭 수집과 활용, 저자는 리뷰 리더나 서기 불가)과 모두 일치한다.","3.2.4: 비공식 리뷰의 주요 목적은 이상 사항 식별이다. 리뷰어 교육과 합의 도출은 워크쓰루의 목적에 나온다."],"ref":"3.2.4","hard":true},{"id":"h6-001","ch":6,"lo":"FL-6.1.1","k":2,"q":"한 핀테크 팀이 사용하는 도구 네 가지를 팀 위키에 다음과 같이 설명했다.\n1. 밤마다 리그레션 테스트 스크립트 1,200개를 사람 손을 거치지 않고 돌리고, 그동안 코드의 구문 중 몇 퍼센트가 실행됐는지 리포트를 만든다.\n2. 릴리스 3.2 빌드를 기준으로 요구사항별 통과·실패 건수, 연결된 결함, 그 빌드의 형상 정보를 한 화면에서 본다.\n3. 개발자가 코드를 main 브랜치에 병합할 때마다 빌드를 자동으로 만들고, 그 빌드가 스테이징을 거쳐 운영까지 나가는 단계별 진행 상황을 보여 준다.\n4. 인수 조건을 넣으면 테스트 케이스와 입력 데이터 조합을 만들어 주고, 이를 실행 순서대로 묶은 테스트 절차를 생성한다.\n실라버스의 도구 유형은 다음과 같다.\nA. 테스트 관리 도구(test management tools)\nB. 데브옵스 도구(DevOps tools)\nC. 테스트 설계 및 테스트 구현 도구(test design and test implementation tools)\nD. 테스트 실행 및 테스트 커버리지 도구(test execution and test coverage tools)\n각 도구와 도구 유형을 바르게 연결한 것은?","opts":["1D, 2B, 3A, 4C","1C, 2A, 3B, 4D","1D, 2A, 3B, 4C","1C, 2B, 3A, 4D"],"ans":[2],"exp":"6.1의 도구 유형 설명과 대조한다.\n1. 자동 테스트 실행과 커버리지 측정(실행된 구문 비율)을 지원 → D 테스트 실행 및 테스트 커버리지 도구\n2. 요구사항, 테스트, 결함, 형상 관리를 용이하게 함 → A 테스트 관리 도구\n3. 자동 빌드 프로세스, 데브옵스 배포 파이프라인, 작업 흐름 추적, CI/CD를 지원 → B 데브옵스 도구\n4. 테스트 케이스, 테스트 데이터, 테스트 절차 생성을 용이하게 함 → C 테스트 설계 및 테스트 구현 도구\n따라서 1D, 2A, 3B, 4C.\n함정 포인트: 2에는 '빌드'가 나와 데브옵스 도구로, 3에는 '진행 상황'이 나와 테스트 관리 도구로 착각하기 쉽다. 2는 요구사항·결함·형상 정보를 관리하는 일이고, 3은 빌드와 배포 파이프라인을 지원하는 일이다. 4는 '실행 순서'와 '테스트 절차' 때문에 실행 도구로 보이지만, 절차를 실행하는 것이 아니라 생성하는 일이다.","why":["2와 3이 뒤바뀌었다. 요구사항·결함·형상 정보를 함께 관리하는 것은 테스트 관리 도구, 자동 빌드와 배포 파이프라인 진행 추적은 데브옵스 도구다(6.1).","1과 4가 뒤바뀌었다. 테스트 자동 실행과 커버리지 측정은 테스트 실행 및 테스트 커버리지 도구, 테스트 케이스·데이터·절차 생성은 테스트 설계 및 테스트 구현 도구다(6.1).","정답. 네 쌍 모두 6.1의 도구 유형 설명과 일치한다.","네 쌍이 모두 틀렸다. 1은 D, 2는 A, 3은 B, 4는 C다(6.1)."],"ref":"6.1","hard":true},{"id":"h6-002","ch":6,"lo":"FL-6.1.1","k":2,"q":"새로 온 테스트 리드가 도구 도입 계획 회의에서 다음과 같이 말했다.\ni. 결함 집계에 쓰는 스프레드시트도 테스팅에 활용한다면 테스트 도구로 볼 수 있다.\nii. 정적 테스팅 도구(static testing tools)는 정적 분석을 지원하지만, 리뷰는 사람이 하는 활동이므로 도구가 지원하는 대상이 아니다.\niii. 수동으로 실행하기 어렵거나 불가능한 비기능 테스트를 수행하려면 비기능 테스팅 도구(non-functional testing tools)가 도움이 된다.\niv. 테스트 관리 도구(test management tools)는 테스트와 결함 관리를 돕지만, 요구사항 관리는 지원 대상이 아니다.\nv. 원격 근무하는 팀원 간 원활한 커뮤니케이션을 돕는 협업 도구(collaboration tools)도 테스팅을 지원하는 도구의 예다.\n실라버스와 일치하는 발언만 모두 고른 것은?","opts":["i, ii, v","ii, iii, iv","i, iv, v","i, iii, v"],"ans":[3],"exp":"6.1 기준으로 판정한다.\ni. 맞다. 테스팅에 활용하면 스프레드시트도 테스트 도구가 된다.\nii. 틀리다. 정적 테스팅 도구는 테스터의 리뷰와 정적 분석 수행을 모두 지원한다.\niii. 맞다. 비기능 테스팅 도구는 수동으로 실행하기 어렵거나 불가능한 비기능 테스트를 테스터가 수행할 수 있게 한다.\niv. 틀리다. 테스트 관리 도구는 소프트웨어 개발수명주기(SDLC), 요구사항, 테스트, 결함, 형상 관리를 용이하게 해서 테스트 프로세스 효율성을 높인다. 요구사항 관리도 지원 대상이다.\nv. 맞다. 협업 도구는 원활한 커뮤니케이션을 지원하며, 6.1의 테스트 도구 예시 목록에 있다.\n따라서 i, iii, v.\n함정 포인트: ii는 '리뷰는 사람이 한다'는 상식에 기대지만, 6.1은 리뷰도 도구가 지원하는 대상으로 든다. iv는 요구사항 관리를 별도 영역으로 떼어 놓아 그럴듯하지만, 6.1의 테스트 관리 도구 설명에 요구사항이 들어 있다.","why":["ii가 틀렸다. 6.1: 정적 테스팅 도구는 테스터의 리뷰와 정적 분석 수행을 지원한다. 맞는 발언 iii도 빠졌다.","ii와 iv가 틀렸다. 정적 테스팅 도구는 리뷰도 지원하고, 테스트 관리 도구는 요구사항 관리도 지원한다(6.1). 맞는 발언 i, v도 빠졌다.","iv가 틀렸다. 6.1: 테스트 관리 도구는 SDLC, 요구사항, 테스트, 결함, 형상 관리를 용이하게 한다. 맞는 발언 iii도 빠졌다.","정답. i, iii, v 모두 6.1의 설명과 일치한다."],"ref":"6.1","hard":true},{"id":"h6-003","ch":6,"lo":"FL-6.1.1","k":2,"q":"모바일 뱅킹 팀이 다음 두 가지를 개선하려고 도구 도입을 검토하고 있다.\n(가) 개발자가 코드를 main 브랜치에 병합하기 전에, 선언되지 않은 변수와 코딩 표준의 명명 규칙 위반을 도구로 찾아내고 싶다.\n(나) 리그레션 테스트 전날, 운영 서버와 OS·미들웨어 설정이 똑같은 테스트 환경을 이미지 하나로 30개까지 빠르게 늘렸다가 테스트가 끝나면 줄이고 싶다.\n(가)와 (나)를 각각 직접 지원하는 도구 유형 두 개를 고르시오.","opts":["정적 테스팅 도구(static testing tools)","데브옵스 도구(DevOps tools)","비기능 테스팅 도구(non-functional testing tools)","확장성 및 배포 표준화 지원 도구(tools supporting scalability and deployment standardization)","테스트 관리 도구(test management tools)"],"ans":[0,3],"exp":"6.1 기준으로 판단한다.\n(가) 선언되지 않은 변수와 명명 규칙 위반은 코드를 실행하지 않고 정적 분석으로 찾는 대표 결함이다(3.1.3). 6.1에서 정적 분석 수행을 지원하는 도구 유형은 정적 테스팅 도구다.\n(나) 같은 구성의 테스트 환경을 빠르게 늘리고 줄이는 일은 확장성과 배포 표준화에 해당한다. 6.1은 확장성 및 배포 표준화 지원 도구의 예로 가상 머신과 컨테이너화 도구를 든다.\n함정 포인트: (가)의 '병합'은 CI를 떠올리게 해 데브옵스 도구가 끌리고, (나)의 '운영과 같은 설정'은 형상 관리를 떠올리게 해 테스트 관리 도구가 끌린다. 정적 분석을 CI에 통합하는 경우가 많지만(3.1) 정적 분석 수행을 지원하는 유형은 정적 테스팅 도구이고, 테스트 관리 도구의 형상 관리는 같은 구성의 환경을 늘리고 줄이는 일과 다르다.","why":["정답. (가)에 해당한다. 6.1: 정적 테스팅 도구는 테스터의 리뷰와 정적 분석 수행을 지원한다.","6.1: 데브옵스 도구는 데브옵스 배포 파이프라인, 작업 흐름 추적, 자동 빌드 프로세스, CI/CD를 지원한다. 정적 분석을 CI에 통합할 수는 있지만(3.1) 정적 분석 수행을 지원하는 유형은 정적 테스팅 도구이고, 같은 구성의 환경을 늘리는 일은 확장성 및 배포 표준화 지원 도구의 몫이다.","6.1: 비기능 테스팅 도구는 수동으로 실행하기 어렵거나 불가능한 비기능 테스트를 수행할 수 있게 한다. (나)는 테스트를 수행하는 일이 아니라 테스트 환경을 늘리고 줄이는 일이다.","정답. (나)에 해당한다. 6.1은 확장성 및 배포 표준화 지원 도구의 예로 가상 머신과 컨테이너화 도구를 든다.","6.1: 테스트 관리 도구는 SDLC, 요구사항, 테스트, 결함, 형상 관리를 용이하게 한다. (나)의 환경 복제와 확장은 이 설명에 없고, 6.1은 가상 머신과 컨테이너화 도구를 확장성 및 배포 표준화 지원 도구로 분류한다."],"ref":"6.1","hard":true},{"id":"h6-004","ch":6,"lo":"FL-6.2.1","k":1,"q":"테스트 관리자가 매주 경영진 보고를 위해 테스트 진행률, 실패율, 테스트 실행 기간을 여러 팀의 엑셀 파일에서 손으로 모아 그래프로 만든다. 집계 결과는 정확하지만 매주 하루가 꼬박 걸린다.\n이 상황과 가장 직접 관련된 테스트 자동화(test automation)의 효과는?","opts":["테스트 관리와 테스트 보고를 지원하는 테스팅 정보에 더 쉽게 접근할 수 있다","커버리지 같은 보다 객관적인 평가와, 사람이 판단하기 어려운 복잡한 측정치를 얻을 수 있다","테스트 실행 시간이 단축되어 결함 조기 식별, 빠른 피드백, 출시 시간 단축이 가능해진다","테스트 데이터를 체계적으로 생성해 일관성과 재현성을 높이고 사람의 단순 실수를 막을 수 있다"],"ans":[0],"exp":"6.2: 테스트 자동화의 효과 중 하나는 테스트 관리 및 테스트 보고를 지원하기 위한 테스팅 정보에 더 쉽게 접근할 수 있다는 것이다(예: 테스트 진행률, 실패율, 테스트 실행 기간에 대한 통계, 그래프, 집계 데이터). 상황의 문제가 바로 이 정보를 손으로 모으는 데 드는 시간이다.\n나머지 보기도 6.2에 있는 효과지만 이 상황의 문제와 직접 관련이 없다.\n함정 포인트: 상황에 '테스트 실행 기간'이라는 말이 나와 '테스트 실행 시간 단축'이 끌린다. 실행 기간은 보고할 통계 항목일 뿐이고, 문제는 실행이 느린 것이 아니라 보고용 정보를 모으기 어려운 것이다.","why":["정답. 6.2의 '테스트 관리 및 테스트 보고를 지원하기 위한 테스팅 정보에 더 쉽게 접근 가능'에 해당하며, 실라버스 예시가 바로 진행률, 실패율, 실행 기간 통계다.","6.2에 있는 효과지만, 이 상황은 단순 통계를 모으는 시간의 문제이지 객관적 평가나 복잡한 측정치가 필요한 상황이 아니다.","6.2에 있는 효과지만, 이 상황의 문제는 테스트 실행 속도가 아니라 보고용 정보를 모으는 데 드는 시간이다.","6.2에 있는 효과지만, 상황에서 집계 결과는 정확하다고 했으므로 사람의 실수 방지가 핵심이 아니다."],"ref":"6.2","hard":true},{"id":"h6-005","ch":6,"lo":"FL-6.2.1","k":1,"q":"B사는 사내에서 직접 만든 UI 프레임워크로 업무 시스템을 개발한다. 팀이 새로 들여온 테스트 자동화(test automation) 도구로 화면 테스트를 녹화해 보니, 이 프레임워크가 그린 버튼과 입력란을 도구가 화면 요소로 인식하지 못했다. 녹화된 스크립트에는 좌표 클릭만 남았고, 입력란의 값을 읽어 기대 결과와 비교하는 단계는 만들 수 없었다. 도입 전 시범 적용에서 일반 웹 화면은 기대대로 동작했다.\n이 사례에서 현실화된 테스트 자동화의 리스크로 가장 적절한 것은?","opts":["도구의 효과(기능 및 사용 편의성 포함)에 대한 비현실적인 기대","규제 요건이나 안전 표준을 준수하지 않는 부적합한 도구의 선택","자동화 도구가 개발 플랫폼과 호환되지 않을 수 있음","도구 도입과 스크립트 유지 관리에 드는 시간, 비용, 노력의 부정확한 추정"],"ans":[2],"exp":"6.2의 리스크 '자동화 도구가 개발 플랫폼과 호환되지 않을 수 있음'이 현실화됐다. 도구가 사내 프레임워크의 화면 요소를 인식하지 못해, 테스트 대상에 값을 넣고 결과를 읽어 비교하는 자동화를 만들 수 없었다.\n시범 적용에서 일반 웹 화면은 기대대로 동작했으므로 도구 기능에 대한 기대 자체가 비현실적이었던 것이 아니다. 문제는 특정 개발 플랫폼에서만 생겼다.\n함정 포인트: '부적합한 도구의 선택'은 이 도구가 팀에 맞지 않았다는 점에서 끌리지만, 6.2의 이 리스크는 규제 요건이나 안전 표준을 준수하지 않는 도구로 범위가 정해져 있다. '기대대로 안 됐다'는 겉모습 때문에 비현실적인 기대를 고르기도 쉽다.","why":["6.2의 리스크이지만, 시범 적용에서 일반 웹 화면은 기대대로 동작했다. 도구 기능에 대한 기대가 비현실적이었던 것이 아니라 사내 프레임워크에서만 문제가 생겼다.","6.2의 리스크이지만, 이 리스크는 규제 요건이나 안전 표준을 준수하지 않는 도구를 고른 경우다. 사례에는 규제나 안전 표준 문제가 없다.","정답. 6.2: 자동화 도구가 개발 플랫폼과 호환되지 않을 수 있음. 도구가 사내 UI 프레임워크의 화면 요소를 인식하지 못한 것이 이에 해당한다.","6.2의 리스크이지만, 사례에는 계획한 시간이나 비용, 노력이 실제와 달랐다는 내용이 없다. 문제는 도구가 개발 플랫폼에서 동작하지 않은 것이다."],"ref":"6.2","hard":true},{"id":"h6-006","ch":6,"lo":"FL-6.2.1","k":1,"q":"자동차 전장 소프트웨어 팀이 오픈소스 테스트 자동화(test automation) 도구를 도입했다. 커뮤니티가 꾸준히 관리하는 도구라 1년 동안 같은 버전을 별다른 패치 없이 썼고, 팀의 빌드 서버와 타깃 보드에서도 정상 동작했다. 테스터들은 자동화 결과와 별도로 탐색적 테스팅(exploratory testing)도 계속했다. 그런데 출시 전 기능 안전 인증 심사에서 '이 도구로 얻은 테스트 결과는 이 제품의 인증 증거로 인정할 수 없다'는 판정을 받아 도구를 바꿔야 했다.\n이 사례에서 현실화된 테스트 자동화의 리스크로 가장 적절한 것은?","opts":["지원이 중단되거나 내부 컴포넌트를 자주 업데이트해야 할 수 있는 오픈소스 소프트웨어의 사용","자동화 도구가 개발 플랫폼과 호환되지 않을 수 있음","사람의 비판적 사고의 필요성을 무시하고 도구에 지나치게 의존하는 것","규제 요건이나 안전 표준을 준수하지 않는 부적합한 도구의 선택"],"ans":[3],"exp":"6.2의 리스크 '규제 요건이나 안전 표준을 준수하지 않는 부적합한 도구의 선택'이 현실화됐다. 인증 심사에서 이 도구로 얻은 결과를 인증 증거로 인정받지 못했다는 것은, 도구가 제품 인증에 필요한 요건을 충족하지 못했다는 뜻이다.\n다른 리스크는 사례의 사실로 배제된다. 같은 버전을 패치 없이 1년간 썼으므로 오픈소스 리스크(지원 중단, 잦은 내부 컴포넌트 업데이트)가 아니다. 빌드 서버와 타깃 보드에서 정상 동작했으므로 호환성 문제가 아니다. 탐색적 테스팅을 계속했으므로 도구에 지나치게 의존한 것도 아니다.\n함정 포인트: 첫 문장의 '오픈소스'가 눈에 띄어 오픈소스 리스크를 고르기 쉽다. 실제로 일어난 일(인증 증거로 인정받지 못함)을 기준으로 골라야 한다.","why":["6.2의 리스크이지만, 이 도구는 커뮤니티가 꾸준히 관리했고 1년 동안 같은 버전을 패치 없이 썼다. 지원 중단이나 잦은 업데이트 문제는 생기지 않았다.","6.2의 리스크이지만, 도구는 팀의 빌드 서버와 타깃 보드에서 정상 동작했다.","6.2의 리스크이지만, 테스터들은 자동화 결과와 별도로 탐색적 테스팅을 계속해 사람의 판단을 유지했다.","정답. 6.2: 규제 요건이나 안전 표준을 준수하지 않는 부적합한 도구의 선택. 기능 안전 인증 심사에서 도구로 얻은 결과를 증거로 인정받지 못한 것이 이에 해당한다."],"ref":"6.2","hard":true},{"id":"h4k2-001","ch":4,"lo":"FL-4.1.1","k":2,"q":"주차장 관리 시스템 팀에서 다음 활동이 진행되었다.\n1. 테스터가 요금 정책 문서에 나온 주차 시간 구간(30분 이하 무료, 31~120분, 121분 이상)을 보고, 구간마다 대표값 하나와 경계값을 골라 테스트를 설계했다.\n2. 아직 실행할 수 없는 정산 로직의 슈도 코드(pseudocode)를 제어 흐름 그래프로 옮긴 뒤, 결정마다 참·거짓 결과를 하나씩 따라가며 검토했다.\n3. 숙련 테스터가 그동안 주차 앱 이용자들이 자주 불편을 호소한 점을 떠올려 '출차 화면에 최종 요금이 바로 보이는가?' 같은 확인 항목 목록을 만들고, 항목마다 테스트했다.\n4. 제품 소유자, 개발자, 테스터가 한자리에 모여 '정기권 자동 갱신' 사용자 스토리를 함께 쓰고, 갱신이 실패하는 경우까지 포함한 인수 조건을 정했다.\n5. 테스터가 예전에 다른 주차 시스템에서 자정을 넘긴 주차 건의 요금이 잘못 계산되던 장애를 여러 번 본 터라, 자정을 걸치는 입·출차 시각을 골라 테스트를 설계했다.\n\nA. 경험 기반 테스트 기법(experience-based test technique)\nB. 협업 기반 테스트 접근법(collaboration-based test approach)\nC. 블랙박스 테스트 기법(black-box test technique)\nD. 화이트박스 테스트 기법(white-box test technique)\n\n각 활동과 그 바탕이 되는 기법·접근법을 올바르게 연결한 것은? (같은 기법·접근법이 두 번 이상 쓰일 수 있다)","opts":["1C, 2C, 3C, 4B, 5A","1C, 2D, 3A, 4B, 5A","1C, 2D, 3C, 4B, 5C","1C, 2C, 3A, 4B, 5C"],"ans":[1],"exp":"1은 요금 정책 문서에 명시된 동작(시간 구간)을 분석해 구간 대표값과 경계값을 골랐으므로 블랙박스 기법(동등 분할·경계값 분석)이다(4.1, 4.2.1, 4.2.2).\n2는 슈도 코드를 제어 흐름 그래프로 모델링해 결정 결과를 따라간 것으로, 화이트박스 기법을 정적 테스팅에 쓴 경우다. 실라버스는 화이트박스 기법이 아직 실행할 준비가 되지 않은 코드, 그리고 슈도 코드처럼 제어 흐름 그래프로 모델링할 수 있는 논리를 검토하는 데 적합하다고 설명한다(4.3.3).\n3은 사용자에게 중요한 것에 대한 지식으로 만든 확인 항목 목록, 곧 체크리스트를 쓴 체크리스트 기반 테스팅이므로 경험 기반 기법이다(4.4.3).\n4는 비즈니스·개발·테스팅 관점의 사람들이 함께 사용자 스토리와 인수 조건을 쓰는 협업 기반 테스트 접근법이다(4.5, 4.5.1).\n5는 다른 유사 애플리케이션에서 발생한 장애 유형에 대한 지식으로 테스트를 설계했으므로 오류 추정, 곧 경험 기반 기법이다(4.4.1).\n함정 포인트: 2는 실행할 수 없는 설계 단계 산출물이라 명세 기반(블랙박스)으로 보기 쉽고, 5는 특정 시각 값을 고르는 모양이 경계값 분석처럼 보인다. 분류 기준은 테스트를 무엇에서 도출했는가(명시된 동작, 내부 구조, 테스터의 지식과 경험)다.","why":["2와 3이 틀렸다. 슈도 코드의 결정 결과를 제어 흐름 그래프로 따라간 것은 내부 구조를 분석한 화이트박스 기법의 정적 활용이고(4.3.3), 이용자 불편 사항으로 만든 확인 항목 목록은 체크리스트 기반 테스팅, 곧 경험 기반 기법이다(4.4.3).","정답. 1 블랙박스(4.1, 4.2), 2 화이트박스의 정적 활용(4.3.3), 3 체크리스트 기반 테스팅(경험 기반, 4.4.3), 4 협업 기반 접근법(4.5.1), 5 오류 추정(경험 기반, 4.4.1).","3과 5가 틀렸다. 이용자 불편 사항으로 만든 확인 항목 목록은 체크리스트 기반 테스팅이고(4.4.3), 유사 시스템에서 본 장애를 떠올려 고른 시각은 오류 추정이다(4.4.1). 둘 다 경험 기반 기법이다.","2와 5가 틀렸다. 슈도 코드를 제어 흐름 그래프로 검토한 것은 화이트박스 기법의 정적 활용이고(4.3.3), 자정을 걸치는 시각은 명세의 분할 경계가 아니라 유사 시스템의 장애에 대한 테스터의 지식에서 나왔으므로 오류 추정이다(4.4.1)."],"ref":"4.1","hard":true},{"id":"h4k2-002","ch":4,"lo":"FL-4.1.1","k":2,"q":"결제 시스템 팀이 만든 테스트 세트들에 대한 기록이다.\n다음 중 화이트박스 테스트 기법(white-box test technique)으로 설계한 테스트 세트를 두 개 고르시오.","opts":["결제 API 문서에 적힌 오류 코드 목록을 보고 코드마다 테스트를 하나씩 만들었다. 그 뒤 내부 구현이 두 번 바뀌었지만 같은 테스트를 그대로 쓰고 있다.","환불 함수의 처리 흐름에서 조건마다 갈라지는 길을 모두 한 번씩 지나도록 입력값을 골랐다. 함수 안의 조건문 구성이 바뀌자 이 세트도 다시 설계했다.","할인 규칙 명세의 금액 구간마다 값을 하나씩 골라 테스트를 설계·실행한 뒤, 커버리지 도구로 측정한 구문 커버리지 92%를 결과 보고서에 적었다.","코드를 한 줄씩 따라가 보니 예외 처리 블록에 도달하는 테스트가 하나도 없어서, 그 블록이 실행되는 입력값을 찾아 테스트를 추가했다.","테스터가 결제 화면을 처음 써 보며 기능을 익히는 동안, 이상해 보이는 곳이 있으면 그 자리에서 테스트를 만들어 실행하고 결과를 확인했다."],"ans":[1,3],"exp":"화이트박스 테스트 기법은 테스트 대상의 내부 구조와 처리에 대한 분석을 기반으로 하며, 테스트 케이스가 소프트웨어 설계 방식에 의존한다(4.1).\n• 환불 함수의 처리 흐름에서 갈라지는 길(결정 결과)을 모두 지나도록 고른 세트는 분기 테스팅이다(4.3.2). 조건문 구성이 바뀌자 다시 설계해야 했다는 점도 설계 의존성을 보여 준다.\n• 실행되지 않은 예외 처리 블록을 찾아 실행되도록 테스트를 추가한 세트는 구문 테스팅이다(4.3.1).\n나머지 셋: API 문서(명시된 동작)에서 도출해 구현이 바뀌어도 그대로 쓰는 세트는 블랙박스 기법이다(4.1). 명세의 금액 구간에서 값을 고른 세트도 블랙박스 기법이며, 실행 뒤 코드 커버리지를 측정했다고 설계 근거가 바뀌지는 않는다. 블랙박스 테스팅만으로는 코드 커버리지 측정치를 얻을 수 없어서 화이트박스 커버리지 측정으로 그 값을 확인한 것이다(4.3.3). 기능을 익히면서 그 자리에서 설계·실행·평가한 세트는 탐색적 테스팅, 곧 경험 기반 기법이다(4.4.2).\n함정 포인트: 'API 테스트'나 '커버리지 도구'라는 말만 보고 화이트박스로 고르기 쉽다. 분류 기준은 테스트를 무엇에서 도출했는가(명시된 동작인가, 내부 구조인가)다.","why":["API 문서에 정의된 동작(오류 코드)에서 도출했고 구현이 바뀌어도 그대로 유효하므로 블랙박스 기법이다(4.1). API 테스트라는 이유만으로 화이트박스가 되지는 않는다.","정답. 처리 흐름의 결정 결과를 모두 지나도록 설계한 분기 테스팅이며, 설계가 바뀌자 테스트도 다시 만들어야 했다는 점이 화이트박스 기법의 특성이다(4.1, 4.3.2).","명세의 금액 구간에서 값을 골라 설계했으므로 블랙박스 기법이다(4.1, 4.2.1). 실행 뒤 코드 커버리지를 측정한 것은 결과를 확인한 것일 뿐 설계 근거를 바꾸지 않는다(4.3.3).","정답. 코드를 분석해 실행되지 않은 구문을 찾고 그 구문이 실행되도록 테스트를 추가했으므로 구문 테스팅이다(4.3.1).","대상을 배워 가며 테스트의 설계·실행·평가를 동시에 했으므로 탐색적 테스팅, 곧 경험 기반 기법이다(4.4.2)."],"ref":"4.1","hard":true},{"id":"h4k2-003","ch":4,"lo":"FL-4.1.1","k":2,"q":"같은 기능을 두 테스터가 경험 기반 테스트 기법(experience-based test technique)으로 테스트했는데, 찾은 결함의 수와 종류가 크게 달랐다. 그중 몇 건은 블랙박스·화이트박스 기법으로 만든 기존 테스트 스위트가 놓친 결함이었다. 관리자는 '사람마다 결과가 다르니 경험 기반 기법은 빼고 블랙박스·화이트박스 기법만 쓰자'고 한다.\n실라버스에 비추어 관리자에게 할 답변으로 가장 적절한 것은?","opts":["경험 기반 기법은 명세 기반 기법이라고도 불리므로, 명세를 더 자세히 쓰면 테스터마다 결과가 달라지는 문제는 사라진다.","블랙박스 기법의 테스트 케이스는 구현이 바뀌어도 유효하므로, 유지보수를 생각하면 관리자 의견대로 그 두 기법만 쓰는 편이 낫다.","체크리스트를 쓰면 경험 기반 기법도 일정 수준의 일관성을 얻으므로, 결과가 이만큼 달랐다면 기법을 잘못 적용했다는 증거다.","효과가 테스터 능력에 크게 좌우되는 것은 이 기법의 특성이며, 다른 두 기법이 놓칠 수 있는 결함을 찾아 이를 보완한다."],"ans":[3],"exp":"4.1: 경험 기반 테스트 기법은 테스터의 지식과 경험을 테스트 케이스 설계·구현에 활용하며, 효과성이 테스터의 능력에 따라 크게 달라진다. 또 블랙박스·화이트박스 기법으로 식별하지 못할 수 있는 결함을 찾을 수 있으므로 두 기법을 보완한다. 사례의 '사람마다 다른 결과'와 '기존 스위트가 놓친 결함'이 이 두 특성을 그대로 보여 준다.\n함정 포인트: 오답 중 둘은 실라버스에 있는 맞는 전제(블랙박스 테스트 케이스는 구현이 바뀌어도 유효하다, 체크리스트는 일정 수준의 일관성을 준다)에서 출발한다. 전제가 맞아도 '경험 기반 기법을 빼자', '결과 차이는 잘못 적용한 증거다'라는 결론은 4.1의 '보완'과 '테스터 능력에 따라 효과가 달라진다'에 어긋난다.","why":["명세 기반 기법은 블랙박스 테스트 기법의 다른 이름이다(4.1). 경험 기반 기법은 명세가 아니라 테스터의 지식과 경험을 활용한다.","블랙박스 테스트 케이스가 구현 변경에도 유효하다는 전제는 맞다(4.1). 그러나 이 사례처럼 두 기법이 놓친 결함을 찾는 것이 경험 기반 기법을 함께 쓰는 이유이므로(보완, 4.1), 빼자는 결론은 틀렸다.","체크리스트 기반 테스팅이 일정 수준의 일관성을 준다는 설명은 4.4.3에 있지만, 경험 기반 기법의 효과성은 원래 테스터 능력에 따라 크게 달라진다(4.1). 상위 수준 체크리스트에서도 실제 테스트는 조금씩 달라질 수 있다(4.4.3). 결과 차이만으로 잘못 적용했다고 볼 수 없다.","정답. 효과성이 테스터 능력에 좌우된다는 점과 다른 두 분류를 보완한다는 점 모두 4.1의 설명이다."],"ref":"4.1","hard":true},{"id":"h4k2-004","ch":4,"lo":"FL-4.3.1","k":2,"q":"다음 코드에서 실행 가능한 구문에는 S1~S8 번호를 붙였다(ENDIF는 구문으로 세지 않는다). qty는 입력된 주문 수량(0 이상의 정수), total은 주문 총액이다. 두 테스트 케이스를 준비했다.\n• TC1: qty = 10, total = 200000\n• TC2: qty = 1, total = 50000\n\ni. TC1 하나만으로 구문 커버리지(statement coverage) 100%를 달성한다.\nii. TC1을 실행한 뒤 TC2를 추가해도 구문 커버리지는 더 높아지지 않는다.\niii. TC1과 TC2를 함께 실행해도 분기 커버리지(branch coverage)는 100%가 되지 않는다.\niv. TC1이 S8을 실행하고 통과했으므로, S8의 나눗셈에서 장애가 날 수 있는 입력은 없다.\nv. TC2만 실행했을 때의 구문 커버리지는 75%다.\n\n옳은 진술만 모두 고른 것은?","code":"S1  READ qty, total\nS2  discount = 0\nS3  IF qty >= 10 THEN\nS4      discount = 5\n    ENDIF\nS5  IF total > 100000 THEN\nS6      discount = discount + 10\n    ENDIF\nS7  pay = total * (100 - discount) / 100\nS8  PRINT pay / qty","opts":["i, iii, v","i, ii, v","ii, iv","iii, iv"],"ans":[1],"exp":"구문 커버리지 = 실행한 구문 수 ÷ 실행 가능한 구문 총수(4.3.1).\n① TC1: qty = 10이라 S3이 참 → S4 실행, total = 200000이라 S5가 참 → S6 실행. S1~S8이 모두 실행되어 8/8 = 100%다(i 맞음).\n② TC1만으로 이미 100%이므로 TC2를 더해도 구문 커버리지는 그대로다(ii 맞음).\n③ TC2: qty = 1이라 S4를 건너뛰고, total = 50000이라 S6을 건너뛴다. S1, S2, S3, S5, S7, S8이 실행되어 6/8 = 75%다(v 맞음). 검산: 건너뛴 구문은 S4, S6 두 개뿐이므로 8 − 2 = 6.\n④ TC1은 두 IF의 참 결과를, TC2는 두 IF의 거짓 결과를 실행한다. 두 결정의 참·거짓 결과와 모든 구문이 실행되므로, 둘을 함께 실행하면 분기 커버리지는 100%다(iii 틀림, 4.3.2). 참·거짓 조합 네 가지를 모두 실행할 필요는 없다.\n⑤ qty가 0이면 S8에서 0으로 나누는 장애가 난다. 구문을 실행했다고 데이터에 종속적인 결함이 반드시 식별되지는 않는다(iv 틀림, 4.3.1).\n함정 포인트: ii와 iii은 둘 다 'TC2를 더하면'에 관한 진술이다. TC2를 더해 오르는 것은 분기 커버리지(100%가 됨)이고, 구문 커버리지는 이미 100%라 그대로다. 'IF가 두 개면 조합 네 가지가 필요하다'는 생각은 분기가 아니라 경로를 세는 착각이다.","why":["iii이 틀렸다. TC1이 두 IF의 참 결과를, TC2가 거짓 결과를 실행하므로 둘을 합치면 모든 분기가 실행된다(4.3.2). 맞는 진술 ii도 빠졌다. TC1만으로 구문 커버리지가 이미 100%다(4.3.1).","정답. i(8/8 = 100%), ii(이미 100%라 그대로), v(6/8 = 75%)가 맞다(4.3.1).","iv가 틀렸다. qty가 0이면 S8에서 0으로 나누는 장애가 나며, 이런 데이터 종속 결함은 구문을 실행해도 식별하지 못할 수 있다(4.3.1). 맞는 진술 i, v도 빠졌다.","iii(둘을 합치면 분기 커버리지 100%)과 iv(qty = 0이면 S8에서 장애)가 모두 틀렸다(4.3.1, 4.3.2). 맞는 진술 i, ii, v도 빠졌다."],"ref":"4.3.1","hard":true},{"id":"h4k2-005","ch":4,"lo":"FL-4.3.1","k":2,"q":"요구사항: 회원은 10% 할인, 비회원은 정가로 결제한다. 다음 코드에서 S2는 rate를 0으로 초기화해야 하는데 5로 잘못 작성되었다(ENDIF는 구문으로 세지 않는다).\n단위 테스트는 TC1(isMember = 참, price = 20000, 기대 결과 18000)과 TC2(isMember = 참, price = 50000, 기대 결과 45000) 두 개였다. 둘 다 통과했고 구문 커버리지(statement coverage)는 100%였다. 그런데 운영 중 일부 고객에게 잘못된 금액이 결제되는 장애(failure)가 발생했다.\n이 상황을 가장 잘 설명한 것은?","code":"S1  READ isMember, price\nS2  rate = 5\nS3  IF isMember THEN\nS4      rate = 10\n    ENDIF\nS5  PRINT price * (100 - rate) / 100","opts":["S2는 실행됐지만 결함은 IF가 거짓일 때만 장애로 드러나며, 100% 구문 커버리지는 그 분기의 실행까지 보장하지 않는다.","TC1과 TC2가 결함이 있는 S2를 실행했으므로 결함은 이미 식별된 셈이고, 운영 장애는 운영 환경의 차이로 생긴 것이다.","구문 커버리지가 100%였으므로 결정 논리도 모두 테스트되었고, 원인은 두 테스트의 기대 결과를 잘못 정한 데 있다.","분기를 실행해도 결함이 반드시 식별되지는 않으므로, 분기 커버리지 100%를 목표로 했더라도 비회원 데이터로 테스트할 필요는 없었다."],"ans":[0],"exp":"① TC1, TC2 모두 isMember가 참이라, S2(rate = 5)를 실행한 뒤 S4(rate = 10)가 값을 덮어쓴다. 결함이 있는 S2가 실행되었는데도 결과가 맞은 이유다. ② S1~S5가 모두 실행되어 구문 커버리지는 100%다. ③ 비회원이면 S4가 실행되지 않아 rate가 5로 남고, 정가 대신 5% 할인된 금액이 결제된다. 즉 결함은 IF의 거짓 결과에서만 장애로 드러나는데, 두 테스트는 이 결과를 실행하지 않았다.\n4.3.1: 100% 구문 커버리지는 결함이 있는 구문을 포함해 모든 실행 가능한 구문을 실행하게 하지만, 구문을 실행했다고 결함이 반드시 식별되는 것은 아니다. 또 모든 결정 논리를 테스트했다고 보장하지 않으며, 모든 분기가 실행되지 않았을 수 있다. 1.2.3도 특정 상황에서만 장애를 일으키는 결함이 있다고 설명한다.\n함정 포인트: '분기를 실행해도 결함이 반드시 식별되지는 않는다'(4.3.2)는 맞는 문장이라 끌리기 쉽다. 그러나 분기 커버리지 100%를 달성하려면 IF의 거짓 결과를 실행해야 하므로 비회원 데이터로 테스트할 수밖에 없다.","why":["정답. S2는 실행됐지만 결함은 IF의 거짓 결과(비회원)에서만 장애로 드러난다. 100% 구문 커버리지는 모든 분기의 실행을 보장하지 않는다(4.3.1).","구문을 실행했다고 결함이 식별되는 것은 아니며(4.3.1), 두 테스트가 통과했으므로 결함은 식별되지 않았다. 장애는 비회원일 때 S2의 값이 그대로 남아서 생긴 것이다.","100% 구문 커버리지가 모든 결정 논리를 테스트했다고 보장하지 않는다(4.3.1). 두 테스트의 기대 결과(회원 10% 할인)도 요구사항과 맞다.","분기를 실행해도 결함이 반드시 식별되지는 않는다는 전제는 맞지만(4.3.2), 분기 커버리지 100%는 IF의 참·거짓 결과를 모두 실행해야 하므로 비회원 데이터가 꼭 필요하다."],"ref":"4.3.1","hard":true},{"id":"h4k2-006","ch":4,"lo":"FL-4.3.2","k":2,"q":"다음 코드에서 실행 가능한 구문에는 S1~S7 번호를 붙였다(ELSE, ENDIF는 구문으로 세지 않는다).\n다음 테스트 세트 중 구문 커버리지(statement coverage)는 100%를 달성하지만 분기 커버리지(branch coverage)는 100%를 달성하지 못하는 것은?","code":"S1  READ age, isMember\nS2  fee = 10000\nS3  IF age < 13 THEN\nS4      fee = 5000\n    ELSE\nS5      IF isMember THEN\nS6          fee = fee - 2000\n        ENDIF\n    ENDIF\nS7  PRINT fee","opts":["(age = 30, isMember = 참), (age = 50, isMember = 거짓)","(age = 10, isMember = 참), (age = 30, isMember = 참), (age = 40, isMember = 거짓)","(age = 10, isMember = 거짓), (age = 30, isMember = 참)","(age = 12, isMember = 참), (age = 13, isMember = 거짓)"],"ans":[2],"exp":"구문 커버리지 100%에는 S4(age < 13)와 S6(age ≥ 13이면서 회원)이 모두 실행되어야 한다. 분기 커버리지 100%에는 여기에 더해 두 결정의 참·거짓 결과가 모두 실행되어야 한다(4.3.2).\n① (10, 거짓), (30, 참): 10 → S4, (30, 참) → S6. 모든 구문이 실행되어 구문 100%. 안쪽 IF의 거짓 결과(age ≥ 13이면서 비회원)는 실행되지 않아 분기는 100% 미만. 조건에 맞는다.\n② (10, 참), (30, 참), (40, 거짓): 바깥 IF의 참·거짓, 안쪽 IF의 참·거짓이 모두 실행되어 구문·분기 모두 100%.\n③ (12, 참), (13, 거짓): 13은 안쪽 IF가 거짓이라 S6이 실행되지 않아 구문부터 100% 미만.\n④ (30, 참), (50, 거짓): age < 13인 값이 없어 S4가 실행되지 않아 구문부터 100% 미만.\n분기 커버리지는 구문 커버리지를 포함하지만, 그 반대는 성립하지 않는다(4.3.2).\n함정 포인트: 경계 근처 값(12, 13)이 들어 있는 세트가 꼼꼼해 보이지만, 커버리지는 고른 값이 아니라 실행된 구문과 분기로 판단한다.","why":["age < 13인 값이 없어 S4가 실행되지 않으므로 구문 커버리지부터 100%가 아니다(4.3.1).","바깥·안쪽 IF의 참·거짓 결과가 모두 실행되어 구문과 분기 커버리지 모두 100%다(4.3.2).","정답. 모든 구문은 실행되지만 안쪽 IF의 거짓 결과(age ≥ 13이면서 비회원)가 실행되지 않는다(4.3.1, 4.3.2).","(13, 거짓)은 안쪽 IF가 거짓이라 S6이 실행되지 않으므로 구문 커버리지부터 100%가 아니다(4.3.1)."],"ref":"4.3.2","hard":true},{"id":"h4k2-007","ch":4,"lo":"FL-4.3.2","k":2,"q":"다음 코드에서 실행 가능한 구문에는 S1~S6 번호를 붙였다(ENDWHILE은 구문으로 세지 않는다). 두 테스트 케이스로 테스트했다.\n• T1: n = 0\n• T2: n = 2\n분기 커버리지(branch coverage)에 대한 설명으로 옳은 것은?","code":"S1  READ n\nS2  total = 0\nS3  WHILE n > 0 DO\nS4      total = total + n\nS5      n = n - 1\n    ENDWHILE\nS6  PRINT total","opts":["T1은 루프 본문을 한 번도 실행하지 않으므로, 어떤 조건 분기도 실행하지 않은 것이다.","분기 커버리지 100%를 달성하려면 루프를 한 번도 돌지 않는 T1이 반드시 함께 있어야 한다.","T2는 구문 커버리지 100%를 달성하지만, 루프 종료 결정은 분기가 아니어서 분기 수에서 빠진다.","T2만으로 루프의 계속 결정과 종료 결정이 모두 실행되어, 분기 커버리지 100%가 된다."],"ans":[3],"exp":"4.3.2: 조건 분기에는 루프에서 종료 또는 계속 여부의 결정도 포함된다. T2(n = 2)를 따라가면 ① n = 2 → 조건 참 → S4, S5 ② n = 1 → 참 → S4, S5 ③ n = 0 → 거짓 → S6. 계속(참)과 종료(거짓) 결과가 모두 실행되고, 루프 본문에서 조건으로 되돌아가는 무조건 분기도 지나가므로 T2 하나로 모든 분기가 실행된다. T1(n = 0)은 처음부터 조건이 거짓이라 종료 결과 하나만 실행하며, 이 결과는 T2도 이미 실행했다.\n함정 포인트: '루프를 0번 도는 테스트가 꼭 있어야 한다'고 생각하기 쉽다. 분기 커버리지는 모든 분기를 한 번 이상 실행했는지만 따지며, 0번 반복이라는 특정 경로를 요구하지 않는다.","why":["T1은 루프 조건이 처음부터 거짓이므로 종료 결과, 즉 조건 분기 하나를 실행한다(4.3.2).","T2만으로 모든 분기가 실행되므로 분기 커버리지 100%에 T1이 꼭 필요하지는 않다(4.3.2).","루프에서 종료 또는 계속 여부의 결정은 조건 분기이며 분기 총수에 들어간다(4.3.2).","정답. 루프의 계속·종료 결정은 조건 분기이고, T2가 둘 다 실행한다(4.3.2)."],"ref":"4.3.2","hard":true},{"id":"h4k2-008","ch":4,"lo":"FL-4.3.3","k":2,"q":"레거시 정산 시스템의 테스트 방향을 두고 팀원들이 다음과 같이 말했다. 요구사항 명세는 2년 전에 작성되어 지금 코드와 맞지 않고, 새로 추가 중인 분할 정산 모듈은 아직 빌드가 되지 않아 실행할 수 없다. 지금까지는 명세에서 도출한 테스트만 수행했다.\ni. '명세가 지금 코드와 맞지 않더라도, 화이트박스 테스팅(white-box testing)은 구현 전체를 고려하므로 결함을 찾는 데 도움이 된다.'\nii. '명세에 있던 기능이 아예 구현되지 않았더라도, 분기 커버리지 100%를 채우면 그 누락은 드러난다.'\niii. '분할 정산 모듈은 아직 실행할 수 없으니, 빌드될 때까지는 화이트박스 기법을 적용할 수 없다.'\niv. '명세에서 도출한 테스트만 수행했으니, 그것만으로는 코드가 실제로 얼마나 실행되었는지 측정치를 얻을 수 없다.'\nv. '코드 커버리지를 측정하면, 커버리지를 높이려면 어떤 테스트를 더 만들어야 할지 판단할 정보도 얻을 수 있다.'\n실라버스에 비추어 옳은 발언만 모두 고른 것은?","opts":["i, iii, v","ii, iv","i, iv, v","ii, iii"],"ans":[2],"exp":"4.3.3과 발언을 하나씩 대조한다.\ni 화이트박스 기법의 근본적인 강점은 테스트 중 전체 소프트웨어 구현을 고려하므로, 명세가 모호하거나 뒤떨어지고 불완전해도 결함 감지가 쉽다는 점이다(맞음).\nii 소프트웨어가 하나 이상의 요구사항을 구현하지 않으면, 화이트박스 테스팅으로 그 누락 결함을 식별하지 못할 수 있다(틀림). 분기 커버리지는 코드에 있는 분기를 기준으로 계산한다(4.3.2).\niii 화이트박스 기법은 코드 드라이 런 같은 정적 테스팅에 쓸 수 있고, 아직 실행할 준비가 되지 않은 코드를 검토하는 데 적합하다(틀림).\niv 블랙박스 테스팅만 수행해서는 실제 코드 커버리지 측정치를 얻을 수 없다(맞음).\nv 화이트박스 커버리지 측정치는 객관적인 커버리지 측정값과, 커버리지를 높이기 위한 추가 테스트 생성에 필요한 정보를 준다(맞음).\n함정 포인트: '분기 커버리지 100%'라는 강한 표현 때문에 ii를, '실행할 수 없으면 코드 기반 기법도 못 쓴다'는 생각 때문에 iii을 고르기 쉽다.","why":["iii이 틀렸다. 화이트박스 기법은 코드 드라이 런 같은 정적 테스팅에 쓸 수 있고, 아직 실행할 준비가 되지 않은 코드를 검토하는 데 적합하다(4.3.3). 맞는 발언 iv도 빠졌다.","ii가 틀렸다. 요구사항이 구현되지 않으면 화이트박스 테스팅으로 그 누락 결함을 식별하지 못할 수 있다(4.3.3). 맞는 발언 i, v도 빠졌다.","정답. i(명세가 뒤떨어져도 결함 감지), iv(블랙박스 테스팅만으로는 코드 커버리지 측정치를 얻을 수 없음), v(커버리지 측정치가 추가 테스트 정보 제공)가 4.3.3과 일치한다.","ii(누락 결함은 식별하지 못할 수 있음)와 iii(실행 전 코드도 정적 검토 가능)이 모두 틀렸다(4.3.3). 맞는 발언 i, iv, v가 빠졌다."],"ref":"4.3.3","hard":true},{"id":"h4k2-009","ch":4,"lo":"FL-4.3.3","k":2,"q":"회원 등급 모듈을 요구사항 명세에서 도출한 블랙박스 테스트로 테스트했고 모두 통과했다. 이어서 분기 커버리지(branch coverage)를 측정해 보니 85%였다. 실행되지 않은 분기를 따라가 보니, 명세에 없는 '특정 직원 번호면 등급 검사를 건너뛴다'는 코드가 있었고 팀은 이를 결함으로 등록했다.\n이 사례가 보여 주는 화이트박스 테스팅의 가치로 가장 적절한 것은?","opts":["블랙박스 테스팅만으로는 얻을 수 없는 코드 커버리지 측정치가, 실행되지 않은 구현과 추가할 테스트 정보를 주었다.","화이트박스 테스팅은 명세에 있지만 구현되지 않은 요구사항을 찾는 데 강하므로, 이번에도 명세의 누락을 찾아냈다.","화이트박스 기법은 아직 실행할 준비가 되지 않은 코드를 드라이 런으로 검토하는 데 적합하다는 점을 보여 준다.","분기 커버리지 측정이 블랙박스 테스트의 기대 결과가 맞는지 검증해 주어, 통과한 테스트 가운데 잘못된 것을 가려냈다."],"ans":[0],"exp":"4.3.3: 블랙박스 테스팅만 수행해서는 실제 코드 커버리지 측정치를 얻을 수 없다. 화이트박스 커버리지 측정치는 객관적인 커버리지 측정값과, 커버리지를 높이기 위한 추가 테스트 생성에 필요한 정보를 제공한다. 또 화이트박스 기법은 테스트 중 전체 소프트웨어 구현을 고려한다. 이 사례에서는 ① 블랙박스 테스트가 모두 통과했지만 ② 분기 커버리지 측정으로 실행되지 않은 구현 부분이 드러났고 ③ 그 분기를 따라가 명세에 없는 코드를 찾았다.\n함정 포인트: 명세와 다른 코드를 찾았다는 이유로 '명세 누락을 찾았다'는 보기를 고르기 쉽다. 이 사례는 명세에 없는 코드가 추가된 경우이고, 구현되지 않은 요구사항(누락)은 오히려 화이트박스 테스팅의 약점이다.","why":["정답. 블랙박스 테스팅만으로는 실제 코드 커버리지를 측정할 수 없고, 화이트박스 커버리지 측정치는 커버리지를 높일 추가 테스트에 필요한 정보를 준다(4.3.3).","반대다. 요구사항이 구현되지 않은 누락 결함은 화이트박스 테스팅으로 식별하지 못할 수 있다(4.3.3). 이 사례는 누락이 아니라 명세에 없는 코드가 들어간 경우다.","화이트박스 기법을 드라이 런 같은 정적 테스팅에 쓸 수 있다는 설명 자체는 맞지만(4.3.3), 이 사례는 코드를 실행하고 커버리지를 측정한 경우라 이 가치와 관계없다.","커버리지는 실행한 분기 수를 분기 총수로 나눈 값으로, 기대 결과가 맞는지를 검증하지 않는다(4.3.2). 이 사례에서도 통과한 테스트가 잘못된 것으로 드러나지 않았고, 결함은 실행되지 않은 분기를 따라가서 찾았다."],"ref":"4.3.3","hard":true},{"id":"h4k2-010","ch":4,"lo":"FL-4.4.1","k":2,"q":"테스터가 오류 추정(error guessing)에 쓰려고 과거 프로젝트에서 나온 문제를 정리했다.\n1. 주문 모듈이 결제 모듈을 호출할 때 넘기는 매개변수의 순서가 결제 모듈이 기대하는 순서와 맞지 않았다.\n2. 배송 유형을 처리하는 switch 문에 '해외 배송' 경우의 처리가 빠져 있었다.\n3. 이자 계산식에서 원금 변수 대신 수수료 변수를 피연산자로 썼다.\n4. 사용자의 회원 가입 요청에 필수 매개변수인 생년월일이 빠져 있었다.\n\nA. 입력\nB. 인터페이스\nC. 계산\nD. 논리\n\n실라버스가 오류·결함·장애와 관련 있다고 제시한 영역의 예에 맞게 연결한 것은?","opts":["1A, 2D, 3C, 4B","1B, 2A, 3C, 4D","1B, 2D, 3C, 4A","1B, 2C, 3D, 4A"],"ans":[2],"exp":"4.4.1의 예: 입력(올바른 입력을 인식하지 못함, 매개변수 오류 또는 누락), 출력(잘못된 형식, 잘못된 결과), 논리(사례 누락, 잘못된 연산자), 계산(잘못된 피연산자, 잘못된 계산), 인터페이스(매개변수 불일치, 호환되지 않는 유형), 데이터(잘못된 초기화, 잘못된 유형).\n1 호출하는 쪽과 받는 쪽의 매개변수 순서가 맞지 않음 → 매개변수 불일치 → 인터페이스(B)\n2 switch 문의 경우 처리 누락 → 사례 누락 → 논리(D)\n3 잘못된 피연산자 → 계산(C)\n4 필수 매개변수 누락 → 입력(A)\n함정 포인트: '매개변수'라는 말이 1과 4에, '누락'이라는 말이 2와 4에 함께 나온다. 매개변수가 서로 맞지 않으면 인터페이스, 빠져 있으면 입력, 처리할 경우가 빠지면 논리다.","why":["1과 4가 뒤바뀌었다. 매개변수 불일치는 인터페이스, 매개변수 누락은 입력의 예다(4.4.1).","2와 4가 뒤바뀌었다. 사례 누락은 논리, 매개변수 누락은 입력의 예다(4.4.1).","정답. 1 인터페이스, 2 논리, 3 계산, 4 입력(4.4.1).","2와 3이 뒤바뀌었다. 사례 누락은 논리, 잘못된 피연산자는 계산의 예다(4.4.1)."],"ref":"4.4.1","hard":true},{"id":"h4k2-011","ch":4,"lo":"FL-4.4.1","k":2,"q":"테스터가 오류 추정(error guessing)으로 성인 인증 기능(기준: 만 19세 이상)에서 생길 문제를 예측해 목록을 만들고, 각 항목을 오류(error)·결함(defect)·장애(failure) 중 하나로 표시했다.\ni. 개발자가 '만 나이'를 '현재 연도 − 출생 연도'로 계산하는 것으로 착각했을 것이다 → 오류\nii. 오늘이 19번째 생일인 고객이 성인 인증에 실패할 것이다 → 장애\niii. 마감 압박에 시달린 개발자가 몹시 피곤한 상태였을 것이다 → 오류\niv. 날짜 차이를 계산하는 식에 생일의 일(日) 값 대신 월(月) 값이 피연산자로 들어가 있을 것이다 → 결함\nv. 생년월일을 비교하는 코드에 '<=' 대신 '<' 연산자가 들어가 있을 것이다 → 장애\n표시가 올바른 것만 모두 고른 것은?","opts":["i, ii, iv","ii, iii, iv","i, v","iii, v"],"ans":[0],"exp":"1.2.3: 사람은 오류(실수)를 저지르며 이에 따라 결함이 발생하고, 이는 장애로 이어질 수 있다. 사람은 시간적 압박이나 피로 같은 이유로 오류를 범할 수 있으며, 근본 원인은 오류로 이어지는 상황 같은 문제 발생의 근본적인 이유다. 4.4.1: 오류 추정은 테스터의 지식으로 오류, 결함, 장애의 발생을 예측하는 기법이다.\ni 사람이 잘못 이해함 → 오류(맞음)\nii 실행 중 관찰되는 잘못된 동작 → 장애(맞음)\niii 피로와 시간 압박 → 오류를 부르는 상황, 곧 근본 원인인데 오류로 표시(틀림)\niv 코드에 잘못된 피연산자가 들어간 상태 → 결함(맞음)\nv 코드에 잘못된 연산자가 들어간 상태 → 결함인데 장애로 표시(틀림)\n함정 포인트: i과 iii은 둘 다 개발자에 관한 진술이라 둘 다 오류로 보기 쉽다. 착각은 사람의 실수(오류)지만, 피곤한 상태는 실수를 부르는 상황이라 근본 원인 쪽이다. 실라버스는 근본 원인을 오류·결함·장애와 구별한다(FL-1.2.3).","why":["정답. i 오류, ii 장애, iv 결함으로 올바르게 표시했다(1.2.3, 4.4.1).","iii이 틀렸고 맞는 진술 i이 빠졌다. 피로와 시간 압박은 사람이 오류를 범하는 이유, 곧 근본 원인이고(1.2.3), 개발자가 착각한 것이 오류다.","v가 틀렸다. 코드에 잘못된 연산자가 들어간 것은 장애가 아니라 결함이다(1.2.3, 4.4.1). 맞는 진술 ii, iv도 빠졌다.","iii(근본 원인)과 v(결함)의 표시가 모두 틀렸고, 맞는 진술 i, ii, iv가 빠졌다(1.2.3)."],"ref":"4.4.1","hard":true},{"id":"h4k2-012","ch":4,"lo":"FL-4.4.2","k":2,"q":"신규 예약 기능은 요구사항 명세가 상세해 명세 리뷰에서도 지적 사항이 거의 없었다. 팀은 명세에서 블랙박스 기법으로 설계한 테스트를 계획보다 일주일 먼저 모두 실행했다. 테스트 리더는 남은 기간에 탐색적 테스팅(exploratory testing)을 추가하기로 했다.\n이 결정의 근거로 가장 적절한 것은?","opts":["탐색적 테스팅은 다른 공식 기법을 보완하고, 테스트되지 않은 영역의 테스트를 만드는 데 유용하다.","탐색적 테스팅은 명세가 부족하거나 부적합할 때, 또 테스트에 시간적 압박이 심할 때 특히 유용하다.","탐색적 테스팅은 차터의 테스트 목적을 커버리지 항목으로 삼으므로, 커버리지를 객관적으로 측정하기 쉽다.","탐색적 테스팅 중에도 다른 기법을 쓸 수 있으므로, 이미 실행한 명세 기반 테스트를 똑같이 반복해 재확인하기에 알맞다."],"ans":[0],"exp":"4.4.2: 탐색적 테스팅은 테스트 대상에 대해 더 배우고, 집중된 테스트로 더 깊이 탐색하고, 테스트되지 않은 영역에 대한 테스트를 만드는 데 쓰인다. 또 다른 공식 테스트 기법을 보완하는 데에도 유용하다. 이 상황은 명세 기반 블랙박스 테스트를 마친 뒤 탐색적 테스팅을 더하는 경우이므로 '보완'과 '테스트되지 않은 영역'이 근거다.\n함정 포인트: '명세 부족·시간 압박'은 실라버스에 있는 맞는 문장이라 끌리기 쉽다. 그러나 명세가 상세해 리뷰 지적이 거의 없었고 테스트를 계획보다 먼저 끝냈으므로 이번 결정의 근거가 아니다.","why":["정답. 탐색적 테스팅은 다른 공식 테스트 기법을 보완하는 데 유용하고, 테스트되지 않은 영역에 대한 테스트를 만드는 데 쓰인다(4.4.2).","문장 자체는 4.4.2에 있지만, 이 상황은 명세가 상세하고 테스트를 계획보다 먼저 끝냈으므로 이번 결정의 근거가 될 수 없다.","세션 기반 접근법에서 테스트 목적은 상위 수준의 테스트 컨디션으로 취급하고, 커버리지 항목은 세션 중에 식별한다(4.4.2). 객관적인 커버리지 측정은 화이트박스 커버리지 측정치의 가치다(4.3.3).","탐색적 테스팅 중 다른 기법을 쓸 수 있다는 전제는 맞지만(4.4.2), 탐색적 테스팅은 대상을 더 배우고 더 깊이 탐색하며 테스트되지 않은 영역의 테스트를 만드는 데 쓰인다. 이미 실행한 테스트를 똑같이 반복하는 것은 그 쓰임이 아니다."],"ref":"4.4.2","hard":true},{"id":"h4k2-013","ch":4,"lo":"FL-4.4.2","k":2,"q":"테스터가 '결제 화면에서 만료 쿠폰과 정상 쿠폰을 섞어 적용해 할인 계산 결함 찾기'라는 목적이 적힌 테스트 차터(test charter)를 받아 90분짜리 세션 기반 탐색적 테스팅(exploratory testing)을 했다. 세션 중 쿠폰 화면을 써 보면서 쿠폰 상태를 '만료'와 '정상'으로 나눠 각각 적용해 보았고, 이어서 '만료 쿠폰 + 정상 쿠폰', '같은 쿠폰 두 번 적용' 같은 조합을 찾아 하나씩 시도했다. 한 일과 발견한 내용은 테스트 세션 시트에 적었다. 세션이 끝난 뒤에는 보고(debriefing)가 이어졌다.\ni. 수행 절차와 발견 내용을 테스트 세션 시트에 적은 것은 세션 기반 접근법에서 테스터가 쓸 수 있는 방법이다.\nii. 세션 중 쿠폰 조합을 찾아 하나씩 시도한 것은 커버리지 항목을 세션 중에 식별하고 실행한 것에 해당한다.\niii. 차터에 적은 테스트 목적은 이 세션의 커버리지 항목으로 취급한다.\niv. 쿠폰 상태를 '만료'와 '정상'으로 나눠 각각 적용해 본 것은 동등 분할을 함께 쓴 것이며, 탐색적 테스팅 중에도 그렇게 할 수 있다.\nv. 보고는 같은 세션을 진행한 테스터들끼리 결과를 맞춰 보는 자리이며, 이해관계자는 참여하지 않는다.\n실라버스와 일치하는 진술만 모두 고른 것은?","opts":["i, iii, iv","ii, v","iii, v","i, ii, iv"],"ans":[3],"exp":"4.4.2: 세션 기반 접근법에서는 시간을 정해 놓고 탐색적 테스팅을 하며, 테스트 목적이 담긴 테스트 차터를 지침으로 쓴다. 테스터는 수행 절차와 발견 내용을 기록하려고 테스트 세션 시트를 쓸 수 있다(i 맞음). 테스트 목적은 상위 수준의 테스트 컨디션으로 취급할 수 있고, 커버리지 항목은 세션 중에 식별하고 실행한다(ii 맞음, iii 틀림). 탐색적 테스팅 중 동등 분할 같은 다른 테스트 기법을 쓸 수 있다(iv 맞음). 세션이 끝나면 보통 보고가 이어지며, 이는 테스터와 세션 결과에 관심이 있는 이해관계자 간의 토론이다(v 틀림).\n함정 포인트: ii와 iii은 '목적'과 '커버리지 항목'의 자리를 바꾼 짝이다. 차터의 목적은 상위 수준의 테스트 컨디션이고, 커버리지 항목은 세션 중에 찾아 실행하는 것이다.","why":["iii이 틀렸다. 차터의 테스트 목적은 상위 수준의 테스트 컨디션으로 취급하며, 커버리지 항목은 세션 중에 식별하고 실행한다(4.4.2). 그래서 맞는 진술 ii가 빠졌다.","v가 틀렸다. 보고는 테스터와 세션 결과에 관심이 있는 이해관계자 간의 토론이다(4.4.2). 맞는 진술 i, iv도 빠졌다.","iii(테스트 목적은 상위 수준 테스트 컨디션)과 v(보고에는 이해관계자가 참여)가 모두 틀렸다(4.4.2). 맞는 진술 i, ii, iv가 빠졌다.","정답. i(테스트 세션 시트), ii(커버리지 항목을 세션 중 식별·실행), iv(다른 기법 사용 가능)가 4.4.2와 일치한다."],"ref":"4.4.2","hard":true},{"id":"h4k2-014","ch":4,"lo":"FL-4.4.3","k":2,"q":"모바일 쇼핑 앱의 체크리스트 기반 테스팅(checklist-based testing)에 쓸 체크리스트 초안에 다음 항목이 있다.\ni. 빌드 서버의 컴파일 경고가 0건인가?\nii. 사용자가 현재 결제 단계 중 어디에 있는지 화면에서 항상 알 수 있는가?\niii. 계획된 테스트 케이스의 95% 이상이 합격했는가?\niv. 결제가 실패하면 이미 입력한 배송 정보가 그대로 남아 있는가?\nv. 앱의 품질이 전반적으로 만족스러운가?\n실라버스 기준으로 체크리스트에서 빼야 하는 항목만 모두 고른 것은?","opts":["i, ii, v","i, iii, v","ii, iii, v","i, iii, iv"],"ans":[1],"exp":"4.4.3: 체크리스트에는 자동으로 점검할 수 있는 항목, 시작 조건이나 완료 조건(exit criteria, 4.4.3 원문 표기는 '종료 조건')으로 더 적합한 항목, 너무 일반적인 항목을 넣지 않는다.\ni 컴파일 경고 수는 빌드 도구가 자동으로 점검할 수 있다(빼야 함).\niii 계획된 테스트의 합격 비율은 테스트 활동을 끝낼지 판단하는 완료 조건으로 더 적합하다(빼야 함). 5.1.3도 실패한 테스트 케이스 수 같은 철저함의 척도를 완료 조건의 예로 든다.\nv는 너무 일반적이다(빼야 함).\nii는 사용성 관련 항목이지만 체크리스트는 기능·비기능 테스트를 모두 지원할 수 있고, iv와 함께 개별적·직접적으로 확인할 수 있는 항목이다(유지).\n함정 포인트: iii은 '95%'라는 구체적인 숫자가 있어 좋은 항목처럼 보이지만, 성격은 완료 조건이다.","why":["ii는 빼면 안 된다. 체크리스트는 사용성 같은 비기능 테스트도 지원할 수 있다(4.4.3). 완료 조건으로 더 적합한 iii이 빠졌다.","정답. i은 자동으로 점검할 수 있는 항목, iii은 완료 조건으로 더 적합한 항목, v는 너무 일반적인 항목이다(4.4.3).","ii는 빼면 안 되는 비기능(사용성) 항목이다. 자동으로 점검할 수 있는 i이 빠졌다(4.4.3).","iv는 개별적이고 직접적으로 확인할 수 있는 항목이라 유지해야 한다. 너무 일반적인 v가 빠졌다(4.4.3)."],"ref":"4.4.3","hard":true},{"id":"h4k2-015","ch":4,"lo":"FL-4.4.3","k":2,"q":"팀이 로그인 화면 테스트에 쓸 체크리스트를 검토하다가 다음 항목을 두고 의견을 나눴다.\n'비밀번호 표시 전환, 자동 로그인 설정, 비밀번호 찾기 링크, 회원 가입 링크가 모두 동작하는가?'\n체크리스트 기반 테스팅(checklist-based testing)에 대한 실라버스 설명에 비추어 가장 적절한 의견은?","opts":["체크리스트가 너무 길어지지 않게 주의해야 하므로, 네 가지를 한 항목으로 묶어 둔 지금 형태를 유지하자.","네 가지 확인 내용이 한 항목에 묶였다. 항목은 개별적·직접적으로 확인할 수 있어야 하니 나누자.","상위 수준 항목은 실제 테스트가 조금씩 달라져 커버리지를 높일 수 있으므로, 이 항목도 그대로 두자.","체크리스트는 결함 분석을 기반으로 정기적으로 업데이트하므로, 관련 결함이 나올 때까지 이 항목은 두고 보자."],"ans":[1],"exp":"4.4.3: 체크리스트 항목은 질문 형식으로 표현하는 경우가 많고, 각 항목은 개별적이면서 직접적으로 확인할 수 있어야 한다. 이 항목은 확인 대상 네 가지를 한 문장에 묶어 하나씩 따로 확인할 수 없으므로, 나누자는 의견이 실라버스 설명에 맞는다.\n함정 포인트: 나머지 의견도 '너무 길어지지 않게 주의', '상위 수준이면 커버리지가 높아질 수 있음', '결함 분석으로 정기 업데이트'처럼 4.4.3에 실제로 있는 문장을 근거로 든다. 전제가 맞아도 결론이 '각 항목은 개별적·직접적으로 확인할 수 있어야 한다'는 원칙과 어긋나면 답이 아니다.","why":["체크리스트가 너무 길어지지 않게 주의하라는 설명은 맞지만(4.4.3), 여러 확인 내용을 한 항목에 묶으면 각 항목을 개별적·직접적으로 확인할 수 있어야 한다는 원칙에 어긋난다.","정답. 각 항목은 개별적이면서 직접적으로 확인할 수 있어야 한다(4.4.3).","상위 수준 체크리스트는 커버리지가 높아질 수 있지만 재현 가능성은 떨어질 수 있다(4.4.3). 이 항목의 문제는 상위 수준이라서가 아니라 네 가지 확인 내용을 묶었다는 점이며, 각 항목은 개별적으로 확인할 수 있어야 한다.","결함 분석을 기반으로 정기적으로 업데이트해야 한다는 설명은 맞지만(4.4.3), 이 항목의 문제는 지금 구조가 개별 확인 원칙에 맞지 않는다는 점이라 결함을 기다릴 이유가 없다."],"ref":"4.4.3","hard":true},{"id":"h4k2-016","ch":4,"lo":"FL-4.5.1","k":2,"q":"백로그 개선 작업 회의에서 업무 대표자가 '고객은 주문 후 30분 안에는 취소할 수 있어야 한다'고 구두로 설명했다. 개발자, 테스터와 이야기를 나눈 끝에 '주문 후 30분 이내의 취소 요청은 승인되고, 30분이 지나면 거절된다'는 인수 조건(acceptance criteria)을 전자 게시판의 스토리 항목에 덧붙였다.\n이 상황을 사용자 스토리의 3C로 설명한 것으로 옳은 것을 두 개 고르시오.","opts":["전자 게시판의 스토리 항목은 인수 조건을 담고 있으므로 확인(Confirmation)에 해당한다.","덧붙인 인수 조건은 논의를 거쳐 정해졌으므로 대화(Conversation)에 해당한다.","업무 대표자의 구두 설명과 팀의 논의는 대화(Conversation)에 해당한다.","구두 설명은 문서로 남지 않았으므로 3C의 어느 요소에도 해당하지 않는다.","스토리 항목에 덧붙인 인수 조건은 3C 중 확인(Confirmation)에 해당한다."],"ans":[2,4],"exp":"4.5.1: 3C는 카드(Card: 사용자 스토리를 설명하는 매체, 예: 인덱스 카드, 전자 게시판 항목), 대화(Conversation: 소프트웨어 사용 방법에 대한 설명, 문서 또는 구두), 확인(Confirmation: 인수 조건)이다. 업무 대표자의 구두 설명과 팀 논의는 대화, 덧붙인 인수 조건은 확인, 전자 게시판 항목은 카드다.\n함정 포인트: 4.5.2는 '인수 조건은 보통 3C 중 대화를 통해 결정된다'고 한다. 그래서 인수 조건을 대화로 고르기 쉽다. 대화는 결정되는 과정이고, 그 결과물인 인수 조건은 확인에 해당한다.","why":["전자 게시판 항목은 사용자 스토리를 설명하는 매체이므로 카드(Card)다(4.5.1).","인수 조건은 보통 대화를 통해 결정되지만(4.5.2), 3C에서 인수 조건은 확인(Confirmation)이다(4.5.1).","정답. 대화는 소프트웨어 사용 방법에 대한 설명이며 문서 또는 구두로 할 수 있다(4.5.1).","대화는 문서뿐 아니라 구두로도 할 수 있다(4.5.1).","정답. 확인(Confirmation)은 인수 조건이다(4.5.1)."],"ref":"4.5.1","hard":true},{"id":"h4k2-017","ch":4,"lo":"FL-4.5.2","k":2,"q":"'회원으로서 저장한 카드로 원클릭 결제를 해 결제 시간을 줄이고 싶다'는 사용자 스토리의 인수 조건(acceptance criteria)이 다음과 같이 작성되어 있다.\n• 원클릭 결제 금액은 장바구니 합계 금액과 같아야 한다.\n• 주문 완료 화면에는 주문 번호와 결제 금액이 표시되어야 한다.\n• 결제 완료 확인 메일은 1분 이내에 발송되어야 한다.\n테스터가 '카드 한도 초과나 유효기간 만료처럼 결제가 실패하는 경우가 하나도 없다'고 지적했다.\n이 인수 조건의 작성 형식과, 테스터의 지적에 따르면 이 인수 조건이 인수 조건의 용도 중 무엇을 제대로 하지 못하고 있는지를 바르게 짝지은 것은?","opts":["시나리오 기반 – 긍정과 부정 시나리오 설명","규칙 기반 – 사용자 스토리 범위 정의","시나리오 기반 – 사용자 스토리 범위 정의","규칙 기반 – 긍정과 부정 시나리오 설명"],"ans":[3],"exp":"① 형식: 확인할 항목을 글머리표 목록으로 나열했으므로 규칙 기반(예: 베리피케이션이 필요한 목록, 표로 표현된 입력-출력 매핑)이다. 시나리오 기반은 행위 주도 개발에서 쓰는 Given/When/Then처럼, 어떤 상황에서 어떤 동작을 하면 어떤 결과가 나오는지 예시 흐름을 서술한다(4.5.2). 문장이 '~해야 한다'로 끝나는지는 판단 기준이 아니다. 공식 샘플 문제에는 '규칙 중심', '시나리오 중심'이라는 표기도 쓰인다.\n② 용도: 인수 조건은 사용자 스토리 범위 정의, 이해관계자 간 합의 도출, 긍정과 부정 시나리오 설명, 사용자 스토리 인수 테스팅의 베이시스 제공, 정확한 계획 및 추정에 쓰인다(4.5.2). 결제가 실패하는 경우가 없다는 지적은 부정 시나리오가 빠졌다는 뜻이다.\n함정 포인트: 지적의 핵심 단어가 '시나리오'라서 형식도 시나리오 기반으로 고르기 쉽다. 형식은 인수 조건이 어떻게 쓰였는지, 용도는 무엇에 쓰이는지로 따로 판단한다.","why":["용도는 맞지만 형식이 틀렸다. 확인할 항목을 나열한 목록(베리피케이션 목록)은 규칙 기반이다. 시나리오 기반의 예는 Given/When/Then 형식이다(4.5.2).","형식은 맞지만, 실패하는 경우가 없다는 지적은 범위가 아니라 부정 시나리오가 빠졌다는 뜻이다(4.5.2).","형식과 용도가 모두 틀렸다. 확인할 항목을 나열한 목록은 규칙 기반이고, 지적은 범위가 아니라 부정 시나리오가 빠진 것에 관한 것이다(4.5.2).","정답. 확인할 항목을 나열한 목록(베리피케이션 목록)은 규칙 기반이고, 지적은 '긍정과 부정 시나리오 설명' 용도가 충족되지 않았다는 뜻이다(4.5.2)."],"ref":"4.5.2","hard":true},{"id":"h4k2-018","ch":4,"lo":"FL-4.5.2","k":2,"q":"백로그 개선 작업 회의에서 '주문 환불' 사용자 스토리의 인수 조건(acceptance criteria)을 정리하며 다음 발언이 나왔다.\n1. '부분 환불 화면은 다음 스토리로 넘기기로 했으니, 이 스토리의 조건에서는 빼 둡시다.'\n2. '지금 조건에는 환불이 정상 처리되는 경우만 적혀 있네요. 환불 요청 금액이 결제 금액보다 크면 거절하고 안내 문구를 띄우는 경우도 적어 둡시다.'\n3. '조건 목록이 확정됐으니 플래닝 포커 카드를 다시 내 보고, 이번 반복 주기에 넣을 수 있을지 봅시다.'\n4. '제품 소유자는 \"환불 완료\"를 카드사 승인 시점으로, 개발자는 주문 상태 값이 바뀌는 시점으로 알고 있었는데, 조건 문구를 같이 고치면서 카드사 승인 시점으로 정리했습니다.'\n\nA. 이해관계자 간 합의 도출\nB. 사용자 스토리 범위 정의\nC. 사용자 스토리 인수 테스팅의 베이시스 제공\nD. 정확한 계획 및 추정\nE. 긍정과 부정 시나리오 설명\n\n각 발언에 드러난 인수 조건의 용도를 올바르게 연결한 것은? (어느 발언에도 해당하지 않는 용도가 있을 수 있고, 같은 용도가 두 번 쓰일 수도 있다)","opts":["1E, 2B, 3D, 4A","1B, 2B, 3C, 4A","1B, 2E, 3D, 4A","1E, 2E, 3C, 4A"],"ans":[2],"exp":"4.5.2: 인수 조건은 사용자 스토리 범위 정의, 이해관계자 간 합의 도출, 긍정과 부정 시나리오 설명, 사용자 스토리 인수 테스팅의 베이시스 제공, 정확한 계획 및 추정에 쓰인다.\n1 이 스토리에서 다루지 않을 기능을 조건에서 뺌 → 범위 정의(B)\n2 정상 처리 경우만 있던 조건에 거절되는 경우를 더함 → 긍정과 부정 시나리오 설명(E)\n3 확정된 조건으로 플래닝 포커(5.1.4)를 다시 해 반복 주기에 넣을지 판단 → 정확한 계획 및 추정(D)\n4 '환불 완료'를 서로 다르게 알던 제품 소유자와 개발자가 조건 문구로 이해를 맞춤 → 이해관계자 간 합의 도출(A)\nC(인수 테스팅의 베이시스 제공)는 실제 용도지만 어느 발언에도 드러나지 않는다.\n함정 포인트: 2는 요청을 '거절'하는 조건이라 스토리의 범위를 정하는 것처럼 보인다. 스토리에서 기능을 빼는 것이 범위 정의이고, 잘못된 요청에 시스템이 어떻게 반응하는지 적는 것은 부정 시나리오 설명이다.","why":["1과 2가 뒤바뀌었다. 다음 스토리로 넘길 기능을 조건에서 빼는 것은 범위 정의이고, 정상 처리만 있던 조건에 거절되는 경우를 더하는 것은 긍정과 부정 시나리오 설명이다(4.5.2).","2와 3이 틀렸다. 거절되는 경우를 더하는 것은 부정 시나리오 설명이고, 플래닝 포커로 다시 추정해 반복 주기에 넣을지 보는 것은 정확한 계획 및 추정이다(4.5.2, 5.1.4).","정답. 1 범위 정의, 2 긍정과 부정 시나리오 설명, 3 정확한 계획 및 추정, 4 이해관계자 간 합의 도출(4.5.2). 인수 테스팅의 베이시스 제공(C)은 어느 발언에도 드러나지 않는다.","1과 3이 틀렸다. 다음 스토리로 넘길 기능을 빼는 것은 범위 정의이고, 플래닝 포커로 다시 추정하는 것은 정확한 계획 및 추정이다(4.5.2, 5.1.4)."],"ref":"4.5.2","hard":true},{"id":"h4k3-001","ch":4,"lo":"FL-4.2.1","k":3,"q":"전기차 충전 예약 앱을 동등 분할(equivalence partitioning)로 테스트한다. 앱은 다음 세 입력값을 받는다. 입력값끼리는 서로 독립적이라 어떤 조합이든 입력할 수 있다. 시스템은 세 값을 모두 받은 뒤 한꺼번에 처리하므로, 테스트 케이스 하나에 들어간 각 값은 모두 자기 분할을 실행한 것으로 본다.\n- 목표 충전량(%, 정수): 0 이하 오류 / 1~80 일반 충전 / 81~100 완충 모드 / 101 이상 오류\n- 충전 시작 시각: 23:00~05:59 심야 요금 / 06:00~09:59 아침 요금 / 10:00~17:59 주간 요금 / 18:00~22:59 저녁 요금\n- 결제 수단: 신용카드 / 충전 포인트 / 법인 카드\n\n이미 다음 두 테스트 케이스가 있다.\n- TC1: 목표 81%, 05:59 시작, 신용카드\n- TC2: 목표 0%, 23:00 시작, 신용카드\n\n이치 초이스 커버리지(Each Choice coverage) 100%를 달성하려면 테스트 케이스를 최소 몇 개 더 추가해야 하는가?","opts":["4개","2개","7개","3개"],"ans":[3],"exp":"풀이(4.2.1): 이치 초이스 커버리지는 모든 분할 집합의 각 분할을 최소 한 번씩 실행하면 되고, 분할의 조합은 따지지 않는다.\n① 기존 테스트가 실행한 분할: 목표 충전량은 81%→'81~100', 0%→'0 이하'. 시작 시각은 05:59와 23:00이 둘 다 '심야 요금(23:00~05:59)'. 결제 수단은 '신용카드'.\n② 남은 분할: 목표 충전량 2개('1~80', '101 이상'), 시작 시각 3개(아침, 주간, 저녁), 결제 수단 2개(충전 포인트, 법인 카드).\n③ 테스트 케이스 하나는 집합마다 분할을 하나씩만 실행한다. 그래서 추가 개수는 남은 분할 수의 합이 아니라 가장 큰 값인 3이다. 예: (50%, 07:00, 충전 포인트), (120%, 12:00, 법인 카드), (30%, 19:00, 신용카드).\n검산: 테스트 케이스 2개로는 시작 시각의 남은 분할 3개를 모두 실행할 수 없다. 3개로는 위 예처럼 가능하므로 최소는 3개다.\n함정 포인트: 23:00을 '저녁 요금'으로 읽으면 남은 시각 분할이 2개로 보여 '2개'를 고르게 된다.","why":["틀림. 시작 시각 분할 4개를 처음부터 다시 센 값이다. TC1·TC2가 이미 '심야 요금' 분할을 실행했으므로 남은 시각 분할은 3개다(4.2.1).","틀림. 23:00을 저녁 요금으로 잘못 보면 남은 시각 분할이 2개로 보인다. 23:00은 심야 요금(23:00~05:59)에 속하므로 남은 시각 분할은 3개다(4.2.1).","틀림. 남은 분할 수 2 + 3 + 2를 모두 더한 값이다. 이치 초이스 커버리지에서는 테스트 케이스 하나가 여러 분할 집합의 분할을 함께 실행하므로 합이 아니라 가장 큰 값을 본다(4.2.1).","정답. 남은 분할이 가장 많은 집합은 시작 시각(아침·주간·저녁 3개)이고, 테스트 케이스 3개로 세 집합의 남은 분할을 모두 실행할 수 있다(4.2.1)."],"ref":"4.2.1","hard":true},{"id":"h4k3-002","ch":4,"lo":"FL-4.2.1","k":3,"q":"수도 요금 앱은 계량기에서 받은 한 달 사용량(톤, 정수)에 따라 다음과 같이 처리한다. 테스터는 이 기능을 동등 분할(equivalence partitioning)로 테스트하며, 아래 여섯 구간을 각각 하나의 분할로 식별했다.\n- 0 미만: '계량기 값 오류' 메시지\n- 0 이상 10 이하: 기본 요금\n- 10 초과 20 미만: 1단계 요금\n- 20 이상 30 이하: 2단계 요금\n- 30 초과 40 미만: 3단계 요금\n- 40 이상: '누수 점검 요청' 메시지\n\n테스트 입력 집합:\n1. 0, 5, 15, 20, 30, 50\n2. -1, 0, 19, 30, 31, 40\n3. 1, 10, 20, 30, 40, 45\n4. -3, 9, 10, 25, 35, 40\n\n동등 분할 커버리지:\nA. 100%\nB. 약 83%\nC. 약 67%\nD. 50%\n\n각 테스트 입력 집합(1~4)과, 그 집합만 실행했을 때 달성하는 동등 분할 커버리지(A~D)를 올바르게 연결한 것은?","opts":["1C, 2B, 3D, 4A","1C, 2A, 3D, 4B","1A, 2C, 3D, 4B","1C, 2A, 3B, 4D"],"ans":[1],"exp":"풀이(4.2.1): 먼저 구간을 정수 범위로 바꾼다. P1 -1 이하, P2 0~10, P3 11~19, P4 20~30, P5 31~39, P6 40 이상. 커버리지는 하나 이상의 테스트 케이스(여기서는 값 하나)로 실행한 분할 수를 식별한 분할 수 6으로 나눈 값이다(비유효 분할 포함).\n① 집합 1: 0→P2, 5→P2, 15→P3, 20→P4, 30→P4, 50→P6. 실행한 분할은 P2, P3, P4, P6의 4개 → 4/6 ≈ 67%(C).\n② 집합 2: -1→P1, 0→P2, 19→P3, 30→P4, 31→P5, 40→P6. 6개 모두 → 100%(A).\n③ 집합 3: 1→P2, 10→P2, 20→P4, 30→P4, 40→P6, 45→P6. P2, P4, P6의 3개 → 3/6 = 50%(D).\n④ 집합 4: -3→P1, 9→P2, 10→P2, 25→P4, 35→P5, 40→P6. P3만 빠진 5개 → 5/6 ≈ 83%(B).\n검산: 경계에 걸린 값을 다시 확인했다. 0은 '0 이상'이라 P2, 10은 '10 이하'라 P2, 20은 '20 이상'이라 P4, 30은 '30 이하'라 P4, 40은 '40 이상'이라 P6이다.\n함정 포인트: 네 집합 모두 값이 6개라 분할 6개를 다 실행한 것처럼 보인다. 10을 '10 초과' 쪽(P3)으로 읽으면 집합 4가 100%처럼 보이고, 30을 '30 초과' 쪽(P5)으로 읽으면 집합 2가 P4를 빠뜨린 약 83%처럼 보인다.","why":["틀림. 2와 4가 바뀌었다. 집합 2의 30은 '20 이상 30 이하'에 속하고 31이 '30 초과 40 미만'을 실행하므로 6개 분할을 모두 실행한다. 집합 4의 10은 '0 이상 10 이하'에 속해 '10 초과 20 미만'이 빠진다(5/6)(4.2.1).","정답. 집합 1은 4/6, 집합 2는 6/6, 집합 3은 3/6, 집합 4는 5/6이다(4.2.1).","틀림. 1과 2가 바뀌었다. 집합 1의 0은 '0 이상 10 이하', 30은 '20 이상 30 이하'에 속해 '0 미만'과 '30 초과 40 미만'이 빠진다(4/6). 집합 2는 6개 분할을 모두 실행한다(4.2.1).","틀림. 3과 4가 바뀌었다. 집합 3은 값이 6개지만 1과 10, 20과 30, 40과 45가 각각 같은 분할이라 3/6 = 50%다. 집합 4는 5/6이다(4.2.1)."],"ref":"4.2.1","hard":true},{"id":"h4k3-003","ch":4,"lo":"FL-4.2.1","k":3,"q":"중고 거래 앱의 판매 수수료 기능을 동등 분할(equivalence partitioning)로 테스트해 왔다. 판매 가격은 원 단위 정수다.\n\n[기존 명세] 0 이하 오류 / 1~9,999 수수료 없음 / 10,000~99,999 수수료 3% / 100,000 이상 수수료 5%\n기존 테스트 케이스 5개의 판매 가격: 0, 5,000, 20,000, 25,000, 300,000 (기존 명세 기준으로 100% 동등 분할 커버리지 달성)\n\n[변경 명세] 0 이하 오류 / 1~9,999 수수료 없음 / 10,000~29,999 수수료 2% / 30,000~99,999 수수료 3% / 100,000~999,999 수수료 5% / 1,000,000 이상 '고가 품목 별도 심사' 안내\n\n테스터는 변경 명세의 각 구간을 하나의 분할로 식별했다. 기존 테스트 케이스 5개를 그대로 실행할 때 변경 명세 기준 동등 분할 커버리지와, 100%를 달성하려고 추가해야 하는 최소 테스트 케이스 수로 옳은 것은? (테스트 케이스 하나는 판매 가격 하나만 입력한다.)","opts":["80%, 1개","약 83%, 1개","약 67%, 2개","100%, 0개"],"ans":[2],"exp":"풀이(4.2.1): 변경 명세의 분할은 6개다. P1 0 이하, P2 1~9,999, P3 10,000~29,999, P4 30,000~99,999, P5 100,000~999,999, P6 1,000,000 이상.\n① 기존 값을 새 분할에 다시 대응시킨다. 0→P1, 5,000→P2, 20,000→P3, 25,000→P3, 300,000→P5.\n② 실행한 분할은 P1, P2, P3, P5의 4개이므로 커버리지는 4/6 ≈ 66.7%다.\n③ 남은 P4(예: 50,000)와 P6(예: 2,000,000)은 값 하나가 분할 하나만 실행하므로 2개를 추가해야 한다.\n검산: 20,000과 25,000은 기존 명세에서도 같은 분할이었고 변경 뒤에도 둘 다 10,000~29,999에 있다. 그래서 30,000~99,999를 실행하는 값이 없다.\n함정 포인트: 변경 전에 100%였다는 정보만 믿고 다시 대응시키지 않으면 '100%, 0개'를, 새로 생긴 1,000,000 이상 분할을 놓치면 '80%, 1개'를 고르게 된다.","why":["틀림. 새로 생긴 '1,000,000 이상' 분할을 빼고 분할을 5개로 센 값이다. 변경 명세는 이 구간을 따로 처리하므로 별도의 분할이다(4.2.1).","틀림. 25,000을 '30,000~99,999' 분할로 잘못 넣으면 5/6이 된다. 25,000은 '10,000~29,999'에 속한다(4.2.1).","정답. 6개 분할 중 4개를 실행해 약 67%이고, '30,000~99,999'와 '1,000,000 이상'을 위해 2개를 추가해야 한다(4.2.1).","틀림. 기존 명세 기준의 결과다. 명세가 바뀌면 분할이 달라지므로 기존 테스트 값을 새 분할에 다시 대응시켜야 한다(4.2.1)."],"ref":"4.2.1","hard":true},{"id":"h4k3-004","ch":4,"lo":"FL-4.2.2","k":3,"q":"사내 교육 신청 화면의 '수강 인원' 칸에는 글자를 자유롭게 입력할 수 있다. 테스터는 명세에서 다음 5개 분할을 식별했다. 숫자는 정수만 입력된다고 보고, 아주 작은 음수나 아주 큰 수도 입력할 수 있다(가장 작은 분할의 최솟값과 가장 큰 분할의 최댓값은 정해져 있지 않다).\n- P1 숫자가 아닌 입력(예: 'abc', 공백): '숫자를 입력하세요' 오류. 이 분할의 값들 사이에는 순서가 없다.\n- P2 0 이하: '1명 이상 입력하세요' 오류\n- P3 1~30: 소형 강의실 배정\n- P4 31~100: 대강당 배정\n- P5 101 이상: '온라인 강의로 신청하세요' 안내\n\n100% 동등 분할 커버리지와 100% 세 개 선택 경계값 분석(3-value boundary value analysis) 커버리지를 함께 달성하는 데 필요한 서로 다른 테스트 입력값의 최소 개수는?","opts":["13개","12개","17개","19개"],"ans":[0],"exp":"풀이(4.2.1, 4.2.2):\n① 경계값 분석은 정렬된 분할에만 쓸 수 있다. 순서가 없는 P1에는 경계값이 없고, P2~P5만 대상이다.\n② 경계값은 각 분할의 최솟값과 최댓값이다. P2의 최댓값 0, P3의 1과 30, P4의 31과 100, P5의 최솟값 101. 모두 6개다.\n③ 세 개 선택 커버리지 항목은 경계값과 양쪽 이웃이다. 0→-1,0,1 / 1→0,1,2 / 30→29,30,31 / 31→30,31,32 / 100→99,100,101 / 101→100,101,102. 겹치는 값을 빼면 -1, 0, 1, 2, 29, 30, 31, 32, 99, 100, 101, 102의 12개다.\n④ 이 12개 값에는 P2~P5에 속한 값이 모두 들어 있어 동등 분할을 위해 따로 더할 숫자가 없다. P1만 숫자가 아닌 값 1개(예: 'abc')가 더 필요하다.\n⑤ 합계 12 + 1 = 13개.\n검산: 6개 × 3 = 18개에서 두 번씩 나온 0, 1, 30, 31, 100, 101의 중복 6개를 빼면 12개다.\n함정 포인트: 경계값 분석 값만 세면 P1을 놓쳐 '12개'가 되고, 동등 분할 값 5개를 따로 더하면 '17개'가 된다.","why":["정답. 세 개 선택 커버리지 항목 12개가 P2~P5를 모두 실행하고, 순서가 없는 P1을 위한 값 1개를 더하면 13개다(4.2.1, 4.2.2).","틀림. 세 개 선택 커버리지 항목 12개만 센 값이다. P1은 경계값 분석 대상이 아니지만 동등 분할 커버리지를 위해 값 1개를 더 실행해야 한다(4.2.1, 4.2.2).","틀림. 동등 분할용 값 5개를 경계값 분석 값 12개와 따로 더한 값이다. 경계값도 각 분할에 속한 값이라 P2~P5는 이미 실행된다(4.2.1).","틀림. 경계값 6개마다 3개씩 18개를 겹침 없이 세고 P1을 더한 값이다. 커버리지 항목은 서로 다른 값이므로 겹치는 값은 한 번만 센다(4.2.2)."],"ref":"4.2.2","hard":true},{"id":"h4k3-005","ch":4,"lo":"FL-4.2.2","k":3,"q":"명세: '배송 거리 d(km, 정수)가 5 이하면 무료 배송, 6 이상이면 유료 배송이다.' 이 문제에서는 5와 6 사이의 경계만 고려한다.\n개발자들이 만든 구현 네 가지에는 각각 결함이 하나씩 있다.\n1. if (d < 5) 무료 else 유료\n2. if (d <= 6) 무료 else 유료\n3. if (d == 5) 무료 else 유료\n4. if (d == 6) 유료 else 무료\n\n테스트 입력값은 다음 네 가지다.\nA. d = 4\nB. d = 5\nC. d = 6\nD. d = 7\n\n각 구현(1~4)과, 네 입력값 중 그 구현의 결함으로 인한 장애(failure)를 드러내는 유일한 입력값(A~D)을 올바르게 연결한 것은?","opts":["1B, 2C, 3D, 4A","1C, 2B, 3A, 4D","1B, 2C, 3A, 4D","1B, 2D, 3A, 4C"],"ans":[2],"exp":"풀이(4.2.2): 입력값마다 명세 결과와 구현 결과를 비교한다. 명세대로라면 4·5는 무료, 6·7은 유료다.\n① 구현 1(d < 5만 무료): 4 무료, 5 유료(불일치), 6·7 유료 → B만 장애를 드러낸다.\n② 구현 2(d ≤ 6이면 무료): 4·5 무료, 6 무료(불일치), 7 유료 → C만.\n③ 구현 3(d = 5만 무료): 4 유료(불일치), 5 무료, 6·7 유료 → A만.\n④ 구현 4(d = 6만 유료): 4·5 무료, 6 유료, 7 무료(불일치) → D만.\n검산: 4 × 4 = 16칸을 다시 비교해 각 구현에서 불일치가 정확히 한 값에서만 생기는 것을 확인했다.\n이 경계의 두 개 선택(2-value) 커버리지 항목은 5, 6이고, 세 개 선택(3-value)은 4, 5, 6, 7이다. 경계가 위아래로 밀린 구현 1·2는 두 개 선택 값으로 드러나지만, 구현 3·4는 세 개 선택에서만 추가되는 이웃 값(4, 7)으로만 드러난다. 실라버스의 'x ≤ 10'이 'x = 10'으로 잘못 구현된 예와 같은 구조다.\n함정 포인트: 'd == 5'는 5에서 문제가 생길 것처럼 보이지만 d=5의 결과는 명세와 같다. 장애는 경계 바로 안쪽 이웃인 4에서 드러난다.","why":["틀림. 구현 3은 d=7에서 유료라 명세와 같고, 구현 4는 d=4에서 무료라 명세와 같다. 3은 d=4(A), 4는 d=7(D)에서 장애가 드러난다(4.2.2).","틀림. 구현 1은 d=6에서 유료라 명세와 같고, 구현 2는 d=5에서 무료라 명세와 같다. 1은 d=5(B), 2는 d=6(C)에서 장애가 드러난다(4.2.2).","정답. 구현 1은 5(B), 2는 6(C), 3은 4(A), 4는 7(D)에서만 명세와 다른 결과가 나온다(4.2.2).","틀림. 구현 2는 d=7에서 유료라 명세와 같고, 구현 4는 d=6에서 유료라 명세와 같다. 2는 d=6(C), 4는 d=7(D)에서 장애가 드러난다(4.2.2)."],"ref":"4.2.2","hard":true},{"id":"h4k3-006","ch":4,"lo":"FL-4.2.2","k":3,"q":"스마트 보일러의 온수 설정 온도(℃, 정수)는 다음과 같이 처리된다. 가장 작은 분할의 최솟값과 가장 큰 분할의 최댓값은 정해져 있지 않다고 가정한다.\n- 39 이하: '설정 불가' 오류\n- 40~44: 저온 모드\n- 45: 절약 권장 모드\n- 46~60: 고온 모드\n- 61 이상: '화상 위험' 오류\n\n테스터가 39, 41, 44, 45, 47, 60, 62로 테스트했다. 이 테스트 집합이 달성한 두 개 선택 경계값 분석(2-value BVA) 커버리지와, 100% 세 개 선택 경계값 분석(3-value BVA) 커버리지를 달성하려고 추가해야 하는 서로 다른 값의 최소 개수로 옳은 것은?","opts":["약 57%, 14개","50%, 6개","약 57%, 3개","약 57%, 6개"],"ans":[3],"exp":"풀이(4.2.2):\n① 경계값은 각 분할의 최솟값과 최댓값이다. 39 / 40, 44 / 45 / 46, 60 / 61. 45는 분할의 최솟값이자 최댓값인 값 하나라서 한 번만 센다. 경계값은 7개다.\n② 두 개 선택 커버리지 항목은 경계값과 인접 분할에 속한 가장 가까운 값이다. 여기서는 그 이웃이 모두 경계값이라 항목은 {39, 40, 44, 45, 46, 60, 61}의 7개다. 실행한 값은 39, 44, 45, 60의 4개 → 4/7 ≈ 57%.\n③ 세 개 선택 커버리지 항목은 경계값과 양쪽 이웃이다. 겹치는 값을 빼면 {38, 39, 40, 41, 43, 44, 45, 46, 47, 59, 60, 61, 62}의 13개다.\n④ 테스트 값 7개(39, 41, 44, 45, 47, 60, 62)는 모두 이 13개에 들어 있다. 남은 값은 38, 40, 43, 46, 59, 61의 6개다.\n검산: 7개 × 3 = 21개 중 39, 40, 44, 46, 60, 61은 두 번, 45는 세 번 나오므로 중복 8개를 빼면 13개다. 13 - 7 = 6.\n함정 포인트: 값이 하나뿐인 분할 45를 경계값에서 빼면 경계값이 6개(39, 40, 44, 46, 60, 61)로 보여 3/6 = 50%가 나오고, 겹치는 값을 빼지 않으면 21 - 7 = 14개가 나온다.","why":["틀림. 경계값 7개 × 3 = 21개를 겹침 없이 센 뒤 7을 뺀 값이다. 커버리지 항목은 서로 다른 값으로 세므로 세 개 선택 항목은 13개다(4.2.2).","틀림. 단일 값 분할인 45를 경계값에서 빼고 경계값을 6개(39, 40, 44, 46, 60, 61)로 본 값이다(실행 39, 44, 60 → 3/6). 45는 그 분할의 최솟값이자 최댓값이므로 경계값이다(4.2.2).","틀림. 두 개 선택에서 빠진 경계값(40, 46, 61)만 센 값이다. 세 개 선택에서는 경계값의 양쪽 이웃(38, 43, 59 등)도 커버리지 항목이다(4.2.2).","정답. 두 개 선택 항목 7개 중 4개를 실행해 약 57%이고, 세 개 선택 항목 13개 중 아직 실행하지 않은 값은 38, 40, 43, 46, 59, 61의 6개다(4.2.2)."],"ref":"4.2.2","hard":true},{"id":"h4k3-00
