<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>CTFL 합격 노트</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CTFL 노트"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0e131d" media="(prefers-color-scheme: dark)"><link rel="apple-touch-icon" href="icon-180.png"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>CTFL 합격 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 휴대폰 한 손 조작 기준 단일 칼럼 + 하단 탭바. 아이패드 가로(1024px~)에서 홈은 2단, 노트는 목차 사이드바. 문제 풀이는 집중을 위해 항상 1단. */
:root {
  --paper: #f3f5f9; --surface: #ffffff; --sunk: #e9edf4;
  --ink: #141c2e; --ink2: #4a5570; --ink3: #5d6781;
  --line: #d8deea; --line-ui: #8a94ab;
  --pen: #2140c8; --pen-ink: #ffffff; --pen-soft: #e5eafc;
  --mark: rgba(255, 216, 50, .62);
  --ok: #157548; --ok-soft: #e2f3e9; --bad: #c0392b; --bad-soft: #fbe6e3; --warn: #9a5b00; --warn-soft: #fff0d3;
  --on-solid: #ffffff; --scrim: rgba(10, 14, 22, .45);
  --shadow: 0 1px 2px rgba(20, 28, 46, .06), 0 6px 20px rgba(20, 28, 46, .06);
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --f-display: "Hahmlet", "AppleMyungjo", "Nanum Myeongjo", serif;
  /* Plex Mono엔 한글이 없어서 한글만 본문 글꼴로 이어지게 둔다 */
  --f-mono: "IBM Plex Mono", "IBM Plex Sans KR", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
  --t-cap: .8125rem; --t-sm: .9rem; --t-lead: 1.0625rem; --t-h3: 1.125rem; --t-h2: 1.2rem; --t-h1: 1.75rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e131d; --surface: #161d2b; --sunk: #1d2537;
    --ink: #e7ecf6; --ink2: #a8b2c8; --ink3: #8d98b0;
    --line: #2b3549; --line-ui: #606d8a;
    --pen: #92a7ff; --pen-ink: #0e131d; --pen-soft: #1f2a4d;
    --mark: rgba(214, 182, 40, .32);
    --ok: #52c58e; --ok-soft: #13301f; --bad: #ff8070; --bad-soft: #3a1b17; --warn: #f0b04a; --warn-soft: #33270f;
    --on-solid: #161d2b; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e131d; --surface: #161d2b; --sunk: #1d2537;
  --ink: #e7ecf6; --ink2: #a8b2c8; --ink3: #8d98b0;
  --line: #2b3549; --line-ui: #606d8a;
  --pen: #92a7ff; --pen-ink: #0e131d; --pen-soft: #1f2a4d;
  --mark: rgba(214, 182, 40, .32);
  --ok: #52c58e; --ok-soft: #13301f; --bad: #ff8070; --bad-soft: #3a1b17; --warn: #f0b04a; --warn-soft: #33270f;
  --on-solid: #161d2b; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { font-size: var(--fs, 17px); -webkit-text-size-adjust: 100%; }
@media (min-width: 700px) { html { font-size: calc(var(--fs, 17px) + 1px); } }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 1rem; line-height: 1.75; letter-spacing: -.003em;
  padding-inline: 16px; word-break: keep-all; overflow-wrap: break-word;
}
button { font: inherit; color: inherit; }
button, a, label, summary { touch-action: manipulation; }
.qtext, .exp, .opt, .sec li, .trap, .kw dd, .flash .def, p { text-wrap: pretty; }
.pbr { display: block; height: .6em; }
a { color: var(--pen); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; border-radius: 6px; }
[tabindex="-1"]:focus { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 128px; display: grid; gap: 18px; align-content: start; }
.wrap > * { min-width: 0; }
h1, h2, h3 { line-height: 1.35; text-wrap: balance; margin: 0; }
.page-title { font-family: var(--f-display); font-weight: 800; font-size: var(--t-h1); letter-spacing: -.01em; }
h2 { font-size: var(--t-h2); font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: var(--t-h3); }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink2); }
.small { font-size: var(--t-sm); line-height: 1.6; }
.ep { color: var(--ink2); }
.hl { background: linear-gradient(transparent 58%, var(--mark) 58%); padding-inline: 2px; }
.eyebrow { font-size: var(--t-cap); letter-spacing: .02em; color: var(--ink3); font-weight: 700; }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.lead { color: var(--ink2); max-width: 36em; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.flat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; }

.btn {
  appearance: none; border: 1px solid var(--line-ui); background: var(--surface); color: var(--ink);
  border-radius: 12px; min-height: 48px; padding: 10px 16px; font-weight: 600; cursor: pointer; line-height: 1.35;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; text-decoration: none;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--pen); color: var(--pen-ink); border-color: var(--pen); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--pen); padding-inline: 8px; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.primary[disabled] { opacity: 1; background: var(--sunk); color: var(--ink2); border-color: var(--line); }
.btn.block { width: 100%; }
.btn .sub { display: block; font-size: var(--t-cap); font-weight: 400; color: inherit; opacity: .85; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 10px;
  font-size: var(--t-cap); font-weight: 600; background: var(--sunk); color: var(--ink2); white-space: nowrap; line-height: 1.5;
}
.chip.k3 { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.hard { background: var(--ink); color: var(--paper); }
.newbox { border: 1.5px solid var(--pen); background: var(--pen-soft); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button {
  border: 1px solid var(--line-ui); background: var(--surface); border-radius: 999px; min-height: 44px; padding: 6px 14px;
  font-weight: 600; cursor: pointer; color: var(--ink2); line-height: 1.35;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btngrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.btngrid .btn { flex-direction: column; gap: 0; padding: 8px 6px; }

/* 홈: 수험표 */
.ticket { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.ticket .stub { padding: 20px 20px 16px; display: grid; gap: 4px; }
.ticket .big { font-family: var(--f-display); font-weight: 800; font-size: clamp(3.2rem, 15vw, 4.6rem); line-height: 1; letter-spacing: -.02em; }
.ticket .big .hl { padding-inline: 6px; }
.ticket .count { font-family: var(--f-mono); font-size: .98rem; color: var(--ink2); font-variant-numeric: tabular-nums; }
.ticket dl { margin: 0; padding: 14px 20px 18px; border-top: 2px dashed var(--line-ui); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; position: relative; }
.ticket dl::before, .ticket dl::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); border: 1px solid var(--line); }
.ticket dl::before { left: -11px; }
.ticket dl::after { right: -11px; }
.ticket dt { font-size: var(--t-cap); color: var(--ink3); font-weight: 700; letter-spacing: .04em; }
.ticket dd { margin: 0; font-weight: 600; line-height: 1.45; }
@media (min-width: 560px) {
  .ticket { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
  .ticket dl { border-top: 0; border-left: 2px dashed var(--line-ui); padding: 20px; align-content: center; }
  .ticket dl::before { top: -11px; left: -11px; }
  .ticket dl::after { top: auto; bottom: -11px; right: auto; left: -11px; }
}

/* 예상 점수 막대: 0~40 눈금 하나로 그림 */
.gauge { position: relative; height: 16px; border-radius: 8px; background: var(--sunk); margin: 30px 0 24px; }
.gauge .fill { position: absolute; inset: 0 auto 0 0; border-radius: 8px; background: var(--pen); }
.gauge .tick { position: absolute; top: -8px; bottom: -8px; width: 2px; background: var(--ink); }
.gauge .tick.goal { background: var(--ok); }
.gauge .tlabel { position: absolute; top: -30px; font-size: var(--t-cap); font-weight: 700; white-space: nowrap; font-family: var(--f-mono); }
.gauge .tlabel.pass { transform: translateX(calc(-100% - 4px)); }
.gauge .tlabel.goal { transform: translateX(6px); color: var(--ok); }
.gauge .blabel { position: absolute; top: 22px; font-size: var(--t-cap); color: var(--ink3); font-family: var(--f-mono); }
.bignum { font-family: var(--f-display); font-weight: 800; font-size: 2.6rem; line-height: 1; }

.chrow { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 12px 2px; border: 0; border-top: 1px solid var(--line); cursor: pointer; background: none; width: 100%; text-align: left; }
.chrow:first-of-type { border-top: 0; }
.chrow .no { font-family: var(--f-display); font-weight: 800; font-size: 1.4rem; color: var(--ink3); grid-row: span 3; align-self: start; line-height: 1.3; }
.chrow .nm { font-weight: 600; min-width: 0; }
.chrow .meta { font-size: var(--t-cap); color: var(--ink2); grid-column: 2; }
.chrow .pct { font-family: var(--f-mono); font-weight: 600; grid-row: span 3; text-align: right; align-self: center; }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; grid-column: 2; margin-top: 4px; }
.bar > i { display: block; height: 100%; background: var(--pen); }

.task { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; border-top: 1px dashed var(--line); }
.task:first-child { border-top: 0; }
.task input { width: 24px; height: 24px; accent-color: var(--pen); margin: 0; }
.task .tt { display: block; padding-block: 12px; line-height: 1.5; cursor: pointer; }
.task .btn.ghost { min-height: 44px; padding: 6px 10px; }
.task.done .tt { text-decoration: line-through; color: var(--ink3); }
.task .when { font-family: var(--f-mono); font-size: var(--t-cap); color: var(--warn); margin-right: 6px; }
.planday { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 2px; }
.planday.today { background: var(--pen-soft); border-radius: 12px; padding: 12px; border-top-color: transparent; }
.planday .d { font-family: var(--f-mono); font-weight: 600; }

.facts { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.facts li { padding-left: 16px; position: relative; }
.facts li::before { content: ""; position: absolute; left: 2px; top: .75em; width: 6px; height: 6px; border-radius: 50%; background: var(--ink3); }
.src { font-size: var(--t-cap); color: var(--ink3); line-height: 1.55; }
.links { display: grid; }
.links a { display: flex; align-items: center; min-height: 46px; border-top: 1px solid var(--line); text-decoration: none; }
.links a:first-child { border-top: 0; }

.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.mode { display: grid; gap: 10px; align-content: start; }
.mode h2 { display: flex; gap: 8px; align-items: center; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quick .btn.primary { grid-column: 1 / -1; }
.quick .btn { flex-direction: column; gap: 0; min-height: 64px; padding: 8px; }

/* 개념 노트 */
.note-head { display: grid; gap: 4px; }
.toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--paper); display: flex; gap: 6px; overflow-x: auto; padding-block: 8px; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
.toc::-webkit-scrollbar { display: none; }
.toc a { text-decoration: none; flex: none; min-height: 36px; }
.toc a .tt { display: none; }
.note-nav { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px; align-items: center; }
.note-nav .btn { padding-inline: 8px; }
.note-nav .seg { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.note-nav .seg button { padding: 0; }
.sec { display: grid; gap: 12px; scroll-margin-top: 64px; }
.sec h3 { font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; }
.sec h3 .sid { font-family: var(--f-mono); color: var(--ink3); margin-right: 8px; font-size: var(--t-sm); font-weight: 600; }
.sec ul { margin: 0; padding-left: 1.15em; display: grid; gap: 10px; }
.sec li::marker { color: var(--ink3); }
.trap { background: var(--warn-soft); border-left: 3px solid var(--warn); border-radius: 4px 10px 10px 4px; padding: 12px 14px; display: grid; gap: 8px; }
.trap > b { color: var(--warn); font-size: var(--t-cap); letter-spacing: .02em; }
.trap > div + div { border-top: 1px dashed var(--line-ui); padding-top: 8px; }
.kw { margin: 0; }
.kw dt { font-weight: 700; margin-top: 14px; }
.kw dt .en { font-weight: 400; color: var(--ink3); font-size: var(--t-sm); margin-left: 6px; font-family: var(--f-mono); }
.kw dd { margin: 2px 0 0; color: var(--ink2); }
details > summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "펼치기"; font-size: var(--t-cap); font-weight: 600; color: var(--pen); flex: none; }
details[open] > summary::after { content: "접기"; }

/* 문제 풀이 */
.quiz-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 6px; display: grid; gap: 6px; box-shadow: 0 1px 0 var(--line); margin-inline: -16px; padding-inline: 16px; }
.quiz-top .btn { min-height: 44px; padding-block: 4px; }
.prog-btn { font: 600 1rem var(--f-mono); min-height: 44px; padding: 4px 12px; border: 1px solid var(--line-ui); border-radius: 10px; background: var(--surface); color: var(--ink); cursor: pointer; }
.quiz-top .bar1 { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.quiz-top .prog { font-family: var(--f-mono); font-weight: 600; }
.qprog { height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden; }
.qprog > i { display: block; height: 100%; background: var(--pen); }
.timer { font-family: var(--f-mono); font-weight: 600; font-size: 1.05rem; padding: 3px 10px; border-radius: 8px; background: var(--sunk); }
.timer.low { background: var(--bad-soft); color: var(--bad); }
.timer.behind { background: var(--warn-soft); color: var(--warn); }
.sw { font-family: var(--f-mono); font-size: var(--t-sm); color: var(--ink2); background: var(--sunk); border-radius: 8px; padding: 3px 8px; }
.sw.over { color: var(--warn); background: var(--warn-soft); }
.pace { font-size: var(--t-sm); color: var(--ink2); }
.qtext { font-size: var(--t-lead); line-height: 1.8; }
.pick2 { display: inline-block; font-weight: 700; color: var(--warn); }
/* 표 칸이 한 글자 폭까지 눌리지 않게 줄바꿈 규칙을 끄고, 넘치면 가로로 스크롤. 첫 열(조건·상태 이름)은 고정. */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tbl table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: var(--t-sm); line-height: 1.45; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; overflow-wrap: normal; word-break: keep-all; }
.tbl td { min-width: 3.5em; }
.tbl th { background: var(--sunk); font-weight: 700; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { position: sticky; left: 0; z-index: 1; min-width: 7em; max-width: 11em; background: var(--surface); box-shadow: 1px 0 0 var(--line); }
.tbl th:first-child { background: var(--sunk); }
.tbl tr:last-child td { border-bottom: 0; }
pre.code { margin: 0; overflow-x: auto; background: var(--sunk); border-radius: 10px; padding: 12px 14px; font-family: var(--f-mono); font-size: var(--t-sm); line-height: 1.6; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 4px 10px; align-items: start; text-align: left;
  border: 1.5px solid var(--line-ui); background: var(--surface); border-radius: 12px; padding: 12px 14px; min-height: 54px; line-height: 1.65;
}
.opt > :not(.lt) { grid-column: 2; }
button.opt { cursor: pointer; }
button.opt:active, .chrow:active, .navgrid button:active { background: var(--sunk); }
.opt .lt { font-family: var(--f-mono); font-weight: 600; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); color: var(--ink2); grid-row: 1 / span 3; }
.opt.sel { border-color: var(--pen); background: var(--pen-soft); }
.opt.sel .lt { background: var(--pen); color: var(--pen-ink); }
.opt.right { border: 2.5px solid var(--ok); background: var(--ok-soft); }
.opt.right .lt { background: var(--ok); color: var(--on-solid); }
.opt.wrong { border: 2px dashed var(--bad); background: var(--bad-soft); }
.opt.wrong .lt { background: var(--bad); color: var(--on-solid); }
.opt .tag { justify-self: start; font-size: var(--t-cap); font-weight: 700; line-height: 1.5; padding: 1px 9px; border-radius: 999px; color: var(--on-solid); }
.opt .tag.ok { background: var(--ok); }
.opt .tag.bad { background: var(--bad); }
.opt .why { font-size: var(--t-sm); color: var(--ink2); border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 2px; line-height: 1.65; }
.others { border: 1px solid var(--line); border-radius: 12px; padding: 2px 14px 6px; }
.others .opt { border: 0; padding: 10px 0; min-height: 0; background: none; border-top: 1px dashed var(--line); border-radius: 0; }
.others .opt .why { border: 0; margin: 0; padding: 0; }
.verdict { font-weight: 800; font-size: var(--t-h3); padding: 12px 14px; border-radius: 12px; scroll-margin-top: 80px; }
.verdict.ok { color: var(--ok); background: var(--ok-soft); }
.verdict.bad { color: var(--bad); background: var(--bad-soft); }
.exp { background: var(--sunk); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; line-height: 1.8; scroll-margin-top: 80px; scroll-margin-bottom: 120px; }
.exp > b { font-size: var(--t-cap); color: var(--ink2); letter-spacing: .04em; }
.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}

<script type="application/json" id="data">{"questions":[{"id":"c1-001","ch":1,"lo":"FL-1.1.1","k":1,"q":"다음 중 실라버스에 제시된 일반적인 테스트 목적(test objective)에 해당하는 것은?","opts":["발견한 결함(defect)을 제거하기 위해 테스트 대상(test object)의 코드를 수정하는 것","테스트 대상이 계약, 법률, 규제 요구사항을 준수하는지 확인하는 베리피케이션(verification)","모든 프로젝트에 똑같이 적용할 수 있는 하나의 표준 테스팅 접근법을 확립하는 것","개발 프로세스의 구현과 개선에 초점을 맞춘 프로세스 중심의 예방 활동을 수행하는 것"],"ans":[1],"exp":"1.1.1의 일반적인 테스트 목적 목록에 '테스트 대상의 계약, 법률, 규제 요구사항 준수 여부를 확인하는 베리피케이션'이 그대로 들어 있다.","why":["결함을 제거하려고 코드를 수정하는 일은 디버깅이며, 테스팅과는 별개의 활동이다(1.1.2, 1.2.1).","정답. 1.1.1 목록에 있는 테스트 목적이다.","테스팅은 정황에 의존적이며, 모든 상황에 적용할 수 있는 하나의 테스팅 접근법은 없다(1.3 원리 6).","프로세스의 구현과 개선에 초점을 맞춘 프로세스 중심의 예방 접근법은 품질 보증(QA)이다. 테스팅은 제품 지향적인 교정 접근법이다(1.2.2)."],"ref":"1.1.1"},{"id":"c1-002","ch":1,"lo":"FL-1.1.1","k":1,"q":"다음 중 실라버스에 제시된 일반적인 테스트 목적 두 개를 고르시오.","opts":["장애(failure)가 발생한 코드를 테스터가 직접 수정해 결함을 제거하는 것","테스트 대상에 대해 요구된 커버리지(coverage)를 보장하는 것","정의된 요구사항에 대한 테스트를 모두 통과하면 시스템이 비즈니스에서 성공할 것임을 보장하는 것","이해관계자를 대신해 테스터가 릴리스 여부를 단독으로 결정하는 것","테스트 대상의 품질에 대한 자신감을 획득하는 것"],"ans":[1,4],"exp":"1.1.1 목록에는 '테스트 대상에 대해 요구된 커버리지 보장'과 '테스트 대상의 품질에 대한 자신감 획득'이 모두 들어 있다.","why":["장애의 원인(결함)을 찾아 분석하고 수정해 제거하는 일은 디버깅이며, 테스팅과는 별개의 활동이다(1.1.2, 1.2.1). 결함 식별은 테스트 목적에 들어가지만 결함 제거는 들어가지 않는다(1.1.1).","정답. 1.1.1 목록에 있는 테스트 목적이다.","베리피케이션이 시스템의 성공을 보장한다고 기대하는 것은 잘못된 생각이다(1.3 원리 7 결함-부재는 궤변이다).","1.1.1의 테스트 목적 중 하나는 이해관계자가 정보에 입각한 결정을 내리는 데 필요한 정보를 제공하는 것이다. 결정을 내리는 쪽은 이해관계자이고, 테스팅은 릴리스 결정 같은 판단에 기여할 뿐이다(1.1.1, 1.2.1).","정답. 1.1.1 목록에 있는 테스트 목적이다."],"ref":"1.1.1"},{"id":"c1-003","ch":1,"lo":"FL-1.1.1","k":1,"q":"테스트 목적에 대한 설명으로 옳은 것은?","opts":["테스트 목적은 테스트 레벨이나 리스크와 관계없이 정해지며, 시장 출시 시기 같은 비즈니스 정황(business context)의 영향도 받지 않는다.","테스트 목적은 베리피케이션에 한정되며, 이해관계자의 기대 충족 여부를 확인하는 밸리데이션(validation)은 포함되지 않는다.","테스트 목적은 정황에 따라 달라질 수 있으며, 정황에는 테스트 레벨, 리스크, 시장 출시 시기 같은 비즈니스 정황이 포함된다.","테스트 목적은 테스트 실행으로만 달성되므로, 요구사항이나 설계 같은 작업 산출물을 평가하는 것은 테스트 목적이 아니다."],"ans":[2],"exp":"1.1.1은 '테스팅의 목적은 정황에 따라 달라질 수 있다'고 하고, 정황의 예로 테스트 대상 작업 산출물, 테스트 레벨, 리스크, SDLC, 기업 구조·경쟁사 구도·시장 출시 시기 같은 비즈니스 정황을 든다.","why":["테스트 목적은 테스트 레벨, 리스크, 시장 출시 시기 같은 비즈니스 정황 등 정황에 따라 달라질 수 있다(1.1.1).","1.1.1 목록에 '테스트 대상의 완성 여부와 이해관계자의 기대 충족 여부를 확인하는 밸리데이션'이 들어 있다.","정답. 1.1.1은 테스트 목적이 정황에 따라 달라질 수 있다고 하며, 정황의 예로 테스트 레벨, 리스크, 비즈니스 정황 등을 든다.","'요구사항, 사용자 스토리, 설계, 소스 코드 등 작업 산출물 평가'는 1.1.1에 있는 테스트 목적이다."],"ref":"1.1.1"},{"id":"c1-004","ch":1,"lo":"FL-1.1.2","k":2,"q":"온라인 서점의 결제 기능을 동적 테스팅하던 중 다음 일이 차례로 일어났다.\n① 테스터가 테스트를 실행하다가 할인 금액이 잘못 계산되는 장애(failure)를 관찰했다.\n② 개발자가 같은 입력으로 장애를 재현했다.\n③ 개발자가 코드를 분석해 할인율 계산식의 결함(defect)을 찾았다.\n④ 개발자가 결함을 수정했다.\n⑤ 테스터가 같은 테스트를 다시 실행해 문제가 해결됐는지 확인했다.\n\n이 중 디버깅(debugging)에 해당하는 것만 모두 고른 것은?","opts":["①, ②, ③","①, ⑤","②, ③, ④, ⑤","②, ③, ④"],"ans":[3],"exp":"1.1.2에 따르면 동적 테스팅이 장애를 유발했을 때 일반적인 디버깅 프로세스는 장애 재현(②), 분석·결함 찾기(③), 결함 수정(④)이다. 장애를 유발한 것(①)은 테스팅이고, 수정 후 다시 확인하는 것(⑤)은 확인 테스팅이다.","why":["①은 동적 테스팅으로 장애를 유발한 것이라 테스팅이고, 결함 수정(④)이 빠졌다.","①과 ⑤는 테스팅에 해당하는 활동이다. 디버깅이 아니다.","⑤는 문제가 제대로 수정됐는지 확인하는 확인 테스팅이다. 디버깅 프로세스(재현, 분석, 수정)에 들어가지 않는다.","정답. 재현-분석-수정이 1.1.2의 디버깅 프로세스다."],"ref":"1.1.2"},{"id":"c1-005","ch":1,"lo":"FL-1.1.2","k":2,"q":"요구사항 명세서 리뷰(정적 테스팅)에서 '환불 가능 기간' 값이 문서의 두 곳에 서로 다르게 적힌 결함을 발견했다. 이 경우 디버깅에 대한 설명으로 옳은 것은?","opts":["리뷰가 장애를 유발하지 않고 결함을 직접 찾았으므로, 디버깅은 장애 재현과 분석 없이 결함 제거에 중점을 둔다.","정적 테스팅으로 찾은 결함이라도, 디버깅은 먼저 소프트웨어를 실행해 장애를 재현하고 분석하는 것부터 시작한다.","리뷰에서 결함을 찾아낸 활동 자체가 디버깅이므로, 이후 별도로 결함을 제거하는 활동은 필요하지 않다.","문서에 있는 결함은 디버깅 대상이 아니며, 디버깅은 동적 테스팅에서 실행한 소스 코드의 결함만 제거한다."],"ans":[0],"exp":"1.1.2: '정적 테스팅으로 결함을 식별한 경우 디버깅은 결함을 제거하는 데 중점을 둔다. 정적 테스팅에서는 장애를 유발하지 않고 직접 결함을 식별하기 때문에 장애를 재현하고 분석할 필요는 없다.'","why":["정답. 정적 테스팅으로 결함을 식별한 경우 장애를 재현하고 분석할 필요가 없으며, 디버깅은 결함 제거에 중점을 둔다(1.1.2).","정적 테스팅은 장애를 유발하지 않고 결함을 직접 찾으므로, 장애를 재현하고 분석할 필요가 없다(1.1.2).","테스팅과 디버깅은 별개의 활동이다. 리뷰는 정적 테스팅이고, 찾은 결함은 디버깅으로 제거한다(1.1.2).","1.1.2는 정적 테스팅으로 찾은 결함도 디버깅으로 제거한다고 설명한다. 결함은 요구사항 명세서 같은 문서에도 있을 수 있다(1.2.3)."],"ref":"1.1.2"},{"id":"c1-006","ch":1,"lo":"FL-1.1.2","k":2,"q":"개발자가 디버깅으로 결함을 수정한 뒤 이어지는 확인 테스팅(confirmation testing)과 리그레션 테스팅(regression testing)에 대한 설명으로 옳은 것은?","opts":["확인 테스팅은 수정 사항이 테스트 대상의 다른 부분에 장애를 일으키지 않았는지 확인하는 활동이다.","확인 테스팅은 처음 테스트한 사람이 다시 수행하는 것이 바람직하며, 이어서 리그레션 테스팅을 추가로 수행할 수 있다.","확인 테스팅은 장애 재현과 분석에 이어지는 디버깅 프로세스의 마지막 단계이므로, 테스팅 활동이 아니라 디버깅 활동이다.","리그레션 테스팅은 결함이 제대로 수정됐는지 확인하는 활동이므로, 수정 후에는 확인 테스팅 대신 리그레션 테스팅만 수행한다."],"ans":[1],"exp":"1.1.2: 확인 테스팅으로 문제가 제대로 수정됐는지 확인하며, 처음 테스트를 수행한 사람이 다시 하는 것이 바람직하다. 수정이 다른 부분에 장애를 일으키지 않았는지는 리그레션 테스팅을 추가로 수행해 확인할 수 있다.","why":["다른 부분에 장애가 생겼는지 보는 것은 리그레션 테스팅이다. 확인 테스팅은 문제가 제대로 수정됐는지 확인한다(1.1.2).","정답. 1.1.2: 확인 테스팅은 처음 테스트를 수행한 사람이 다시 수행하는 것이 바람직하다. 수정이 다른 부분에 장애를 일으키지 않았는지 보려고 리그레션 테스팅을 추가로 수행할 수 있다.","디버깅 프로세스는 장애 재현, 분석, 결함 수정이다. 확인 테스팅은 그 '이후'에 문제가 제대로 수정됐는지 확인하는 테스팅이다(1.1.2).","결함이 제대로 수정됐는지 확인하는 것은 확인 테스팅이다. 리그레션 테스팅은 수정이 다른 부분에 장애를 일으키지 않았는지 보려고 추가로 수행할 수 있는 것이며, 확인 테스팅을 대신하지 않는다(1.1.2)."],"ref":"1.1.2"},{"id":"c1-007","ch":1,"lo":"FL-1.2.1","k":2,"q":"모바일 뱅킹 앱의 시스템 테스팅이 끝난 뒤, 프로젝트 운영위원회가 테스트 결과로 파악한 품질 수준을 근거로 다음 달 릴리스 진행 여부를 결정했다. 이 사례에서 테스팅이 성공에 기여한 방법에 대한 설명으로 옳은 것은?","opts":["테스팅은 발견한 결함을 직접 제거하는 활동이므로, 테스트 대상의 품질 향상에 직접적으로 기여한다.","테스팅은 결함이 없음을 입증하므로, 그 결과는 릴리스 후 운영 중에 장애가 발생하지 않는다는 보증이 된다.","테스팅은 테스트 대상의 품질을 직접 평가하는 수단이며, 그 결과는 릴리스 같은 다음 단계 결정에 기여한다.","테스트 결과는 테스트팀 내부의 개선 자료로만 쓰이며, 릴리스 같은 프로젝트 관리 결정에는 사용되지 않는다."],"ans":[2],"exp":"1.2.1: 테스팅은 SDLC의 여러 단계에서 테스트 대상의 품질을 직접 평가할 수 있는 방법을 제공한다. 평가 결과는 프로젝트 관리 활동에 사용되며, 릴리스가 적합한지 같은 다음 단계 진행 결정에 기여한다.","why":["결함 제거는 테스팅이 아닌 디버깅으로 하므로 테스팅은 품질 향상에 '간접적으로' 기여한다(1.2.1).","테스팅은 결함이 없음을 증명할 수 없다(1.3 원리 1). 그러니 릴리스 후 장애가 없다는 보증도 될 수 없다.","정답. 1.2.1: 테스팅은 테스트 대상의 품질을 직접 평가할 수 있는 방법을 제공하고, 평가 결과는 릴리스 같은 다음 단계 진행 결정에 기여한다.","평가 결과는 프로젝트 관리 활동에 사용되며, 릴리스 같은 다음 단계 진행 결정에 기여한다(1.2.1)."],"ref":"1.2.1"},{"id":"c1-008","ch":1,"lo":"FL-1.2.1","k":2,"q":"병원 예약 시스템 프로젝트에서 실제 환자와 간호사를 개발 내내 참여시키려 했지만 비용이 많이 들고 적합한 사용자를 구하기 어려웠다. 대신 테스터가 자신이 이해한 사용자 요구사항이 개발수명주기 전반에 반영되도록 했다. 이 사례가 보여주는 테스팅의 기여는?","opts":["테스팅은 개발 프로젝트에서 사용자를 간접적으로 대변한다.","테스팅은 결함을 제거하는 디버깅을 대신한다.","테스터가 사용자를 대변하므로 이해관계자의 필요를 확인하는 밸리데이션은 필요 없다.","테스팅은 계약 또는 법적 요구사항이 있을 때만 필요하다."],"ans":[0],"exp":"1.2.1: 테스팅은 개발 프로젝트에서 사용자를 간접적으로 대변한다. 사용자 대표 집단을 참여시키는 방법도 있지만 비용이 많이 들고 적합한 사용자의 참여가 어려운 경우가 많다.","why":["정답. 1.2.1의 설명과 사례가 일치한다.","테스팅과 디버깅은 별개의 활동이며, 결함 제거는 디버깅이 한다(1.1.2, 1.2.1).","베리피케이션과 함께 밸리데이션도 수행해야 한다(1.3 원리 7). 사용자 대변이 밸리데이션을 없애지 않는다.","계약·법적 요구사항 충족은 테스팅이 필요한 이유 중 하나일 뿐이다(1.2.1). 결함 식별, 품질 평가, 사용자 대변 등 다른 이유도 있다."],"ref":"1.2.1"},{"id":"c1-009","ch":1,"lo":"FL-1.2.1","k":2,"q":"의료기기 소프트웨어를 만드는 회사가 규제 표준을 준수하기 위해 테스팅을 수행하고 있다. 테스팅이 필요한 이유와 테스팅의 기여에 대한 설명으로 옳은 것은?","opts":["규제 표준 준수는 프로세스 중심인 품질 보증의 영역이므로, 테스팅이 필요한 이유가 될 수 없다.","식별한 결함은 테스팅이 아닌 디버깅으로 제거되므로, 테스팅은 품질 향상에 간접적으로 기여한다.","테스팅은 결함을 식별하는 데 비용이 많이 드는 방법이므로 규제 준수 목적이 있을 때만 수행한다.","프로젝트 이해관계자 중 테스트팀만 테스트 기술을 활용해 프로젝트 성공에 기여할 수 있다."],"ans":[1],"exp":"1.2.1: 테스팅은 결함을 식별하는 비용 효율적인 방법이고, 식별한 결함은 (테스팅이 아닌) 디버깅으로 제거하므로 테스팅은 품질 향상에 간접적으로 기여한다. 규제 표준 준수를 위해 테스팅이 필요할 수도 있다.","why":["1.2.1은 '규제 표준 준수를 위해 테스팅이 필요할 수도 있다'고 명시한다.","정답. 1.2.1: 테스팅으로 식별한 결함은 테스팅이 아닌 디버깅으로 제거하므로, 테스팅은 테스트 대상의 품질 향상에 간접적으로 기여한다.","1.2.1은 테스팅을 결함을 식별하는 '비용 효율적인' 방법이라고 한다.","1.2는 성공에 기여하는 테스팅이 테스트팀의 활동으로 국한되지 않으며 모든 이해관계자가 기여할 수 있다고 한다."],"ref":"1.2.1"},{"id":"c1-010","ch":1,"lo":"FL-1.2.2","k":1,"q":"테스팅과 품질 보증(QA, quality assurance)의 관계에 대한 설명으로 옳은 것은?","opts":["테스팅은 프로세스 중심의 예방 접근법이고, 품질 보증은 제품 지향적인 교정 접근법(corrective approach)이다.","테스팅과 품질 보증은 같은 의미이므로, 프로젝트에서 두 용어를 서로 바꿔 써도 된다.","테스팅은 제품 지향적인 교정 접근법이고, 품질 보증은 프로세스 중심의 예방 접근법이다.","품질 보증은 테스팅의 한 형태로, 테스트 실행 중 실제 결과를 기록하는 활동을 가리킨다."],"ans":[2],"exp":"1.2.2: 테스팅은 제품 지향적이고 적합한 수준의 품질 달성을 지원하는 교정 접근법이다. 품질 보증은 프로세스의 구현과 개선에 초점을 맞춘 프로세스 중심의 예방 접근법이다.","why":["두 설명이 서로 뒤바뀌었다. 테스팅이 제품 지향적인 교정 접근법이고, 품질 보증이 프로세스 중심의 예방 접근법이다(1.2.2).","1.2.2는 두 용어를 혼용하는 경우가 많지만 같지 않다고 명시한다.","정답. 1.2.2의 설명과 일치한다. 품질 보증은 프로세스의 구현과 개선에 초점을 맞춘다.","품질 보증은 테스팅의 한 형태가 아니라 프로세스 중심의 예방 접근법이다. 테스트 결과를 기록하는 일은 테스트 실행 활동이다(1.2.2, 1.4.1)."],"ref":"1.2.2"},{"id":"c1-011","ch":1,"lo":"FL-1.2.2","k":1,"q":"테스트 결과(test result)가 테스팅과 품질 보증에서 각각 어떻게 사용되는지 바르게 짝지은 것은?","opts":["테스팅: 개발 및 테스트 프로세스가 잘 동작하는지에 대한 피드백 / 품질 보증: 결함 수정","테스팅: 결함 수정 / 품질 보증: 테스트 결과를 사용하지 않음","테스팅: 테스트 결과를 사용하지 않음 / 품질 보증: 결함 수정과 프로세스 피드백","테스팅: 결함 수정 / 품질 보증: 개발 및 테스트 프로세스가 잘 동작하는지에 대한 피드백"],"ans":[3],"exp":"1.2.2: 테스트 결과는 품질 보증과 테스팅 모두에 사용된다. 테스팅에서는 결함 수정에, 품질 보증에서는 개발 및 테스트 프로세스가 잘 동작하는지 확인하는 피드백으로 사용한다.","why":["두 용도가 서로 뒤바뀌었다(1.2.2).","테스트 결과는 품질 보증에서도 프로세스 피드백으로 사용된다(1.2.2).","테스팅도 테스트 결과를 결함 수정에 사용한다(1.2.2).","정답. 1.2.2의 설명과 일치한다."],"ref":"1.2.2"},{"id":"c1-012","ch":1,"lo":"FL-1.2.2","k":1,"q":"품질 보증(QA)에 대한 설명으로 옳은 것은?","opts":["품질 보증은 개발 프로세스와 테스팅 프로세스 모두에 적용되며, 프로젝트에 참여하는 모두의 책임이다.","품질 보증은 테스팅 프로세스에만 적용되며, 테스트팀이 책임진다.","품질 보증은 좋은 제품을 철저히 테스트하면 좋은 프로세스가 만들어진다는 가정을 기반으로 한다.","품질 보증은 품질 제어의 주요 활동이며, 정형 기법·시뮬레이션·프로토타이핑과 같은 범주에 속한다."],"ans":[0],"exp":"1.2.2: 품질 보증은 개발 및 테스팅 프로세스 모두에 적용되며, 프로젝트에 참여하는 모두의 책임이다.","why":["정답. 1.2.2의 설명과 일치한다.","품질 보증은 개발 프로세스에도 적용되며 프로젝트 참여자 모두의 책임이다(1.2.2).","가정의 방향이 반대다. 품질 보증은 '좋은 프로세스를 올바르게 준수하면 좋은 제품이 만들어진다'는 가정을 기반으로 한다(1.2.2).","품질 제어의 주요 활동은 테스팅이다. 정형 기법, 시뮬레이션, 프로토타이핑도 품질 제어에 속한다(1.2.2)."],"ref":"1.2.2"},{"id":"c1-013","ch":1,"lo":"FL-1.2.3","k":2,"q":"보험료 계산 시스템에서 다음 사실이 확인됐다.\n• 새 할인 규정을 맡은 개발자는 해당 업무 도메인 교육을 받지 못한 채 배치됐다.\n• 그 개발자는 할인 규정의 '65세 이상'을 '65세 초과'로 잘못 이해했다.\n• 그 결과 소스 코드의 조건문이 'age > 65'로 작성됐다.\n• 운영 중 정확히 65세인 고객에게 할인이 적용되지 않았다.\n\n이 사례에서 근본 원인(root cause)에 해당하는 것은?","opts":["개발자가 '이상'을 '초과'로 잘못 이해한 것","도메인 교육 없이 개발자가 배치된 상황","소스 코드의 조건문이 'age > 65'로 작성된 것","65세 고객에게 할인이 적용되지 않은 것"],"ans":[1],"exp":"1.2.3: 근본 원인은 문제 발생의 근본적인 이유(예: 오류로 이어지는 상황)다. 사람은 훈련 부족 등으로 오류를 범한다. 따라서 '교육 없이 배치된 상황'이 근본 원인, 잘못 이해한 것이 오류(error), 잘못된 조건문이 결함(defect), 할인 미적용이 장애(failure)다.","why":["사람이 저지른 실수이므로 오류(error)다(1.2.3).","정답. 오류로 이어진 상황이므로 근본 원인이다(1.2.3).","소스 코드에 생긴 결점이므로 결함(defect)이다(1.2.3).","결함이 실행되어 시스템이 해야 할 일을 하지 못한 것이므로 장애(failure)다(1.2.3)."],"ref":"1.2.3"},{"id":"c1-014","ch":1,"lo":"FL-1.2.3","k":2,"q":"인공위성 탑재 장비가 강한 우주 방사선에 노출된 뒤 펌웨어에 문제가 생겨 장애가 발생했다. 조사 결과 개발자의 오류(error)에서 비롯된 결함은 발견되지 않았다. 이 사례에 대한 설명으로 옳은 것은?","opts":["장애는 반드시 사람의 오류에서 비롯된 결함 때문에 발생하므로, 조사 결과가 잘못된 것이다.","방사선 같은 환경 조건으로 생긴 펌웨어 문제는 사람의 실수와 같은 오류로 분류한다.","결함은 소스 코드에만 존재하므로, 방사선으로 펌웨어에 생긴 문제는 결함이 될 수 없다.","장애는 오류와 결함 외에 방사선이나 전자기장 같은 환경 조건으로도 발생할 수 있다."],"ans":[3],"exp":"1.2.3: 장애의 원인이 오류와 결함만 있는 것은 아니다. 방사선이나 전자기장이 펌웨어에 문제가 생기게 하는 경우처럼 환경 조건으로 발생하는 것도 있다.","why":["1.2.3은 환경 조건으로도 장애가 발생할 수 있다고 명시한다.","오류는 사람이 저지르는 실수다(1.2.3). 방사선 같은 환경 조건은 사람의 실수가 아니다.","결함은 문서, 소스 코드, 빌드 파일 같은 지원 산출물에서도 나올 수 있다(1.2.3). 결함이 소스 코드에만 있다는 전제부터 틀렸다.","정답. 1.2.3: 장애의 원인이 오류와 결함만 있는 것은 아니며, 방사선이나 전자기장 같은 환경 조건으로도 발생한다."],"ref":"1.2.3"},{"id":"c1-015","ch":1,"lo":"FL-1.2.3","k":2,"q":"날짜 처리 모듈에 2월 29일을 잘못 처리하는 결함(defect)이 있다. 이 모듈은 매일 실행되지만, 윤년의 2월 29일 날짜가 들어올 때만 잘못된 결과를 낸다. 이 상황에 대한 설명으로 옳은 것은?","opts":["결함이 있는 코드가 실행되면 항상 장애(failure)가 발생하므로, 이 결함은 매일 장애를 일으킨다.","몇 년 동안 장애가 관찰되지 않았다면 그 코드에는 결함이 없다고 판단할 수 있다.","실행될 때마다 장애를 일으키는 결함도 있지만, 이 결함처럼 특정 상황에서만 장애를 일으키는 결함도 있다.","이 결함은 장애로 이어질 수 있으므로 결함이 아니라 장애로 분류해야 한다."],"ans":[2],"exp":"1.2.3: 실행될 경우 항상 장애를 일으키는 결함도 있지만, 특정 상황에서만 장애를 일으키거나 장애로 이어지지 않는 결함도 있다.","why":["1.2.3은 특정 상황에서만 장애를 일으키는 결함도 있다고 설명한다.","장애가 관찰되지 않았다고 결함이 없다는 뜻은 아니다. 특정 상황에서만 장애를 일으키거나 장애로 이어지지 않는 결함도 있다(1.2.3).","정답. 1.2.3의 설명과 일치한다.","결함은 요구사항 명세서, 소스 코드 같은 작업 산출물 안에 있는 결점(버그)이다. 소스 코드의 결함이 실행되면 시스템이 해야 할 일을 하지 못하거나 하지 않아야 할 일을 해 장애를 일으킬 수 있다. 장애로 이어질 수 있다고 해서 결함이 장애가 되는 것은 아니다(1.2.3)."],"ref":"1.2.3"},{"id":"c1-016","ch":1,"lo":"FL-1.2.3","k":2,"q":"출시 후 비슷한 장애가 반복되자 팀은 근본 원인 분석(root cause analysis)을 수행했다. 그 결과 '마감 압박이 있을 때 요구사항 리뷰를 생략하는 관행'이 개발자의 오류로 이어졌다는 것을 확인했다. 근본 원인과 근본 원인 분석에 대한 설명으로 옳은 것은?","opts":["근본 원인 분석은 장애가 발생한 경우에만 수행하며, 리뷰 등에서 결함을 식별한 경우에는 수행하지 않는다.","근본 원인을 처리(예: 제거)하면 유사한 장애와 결함을 예방하거나 그 빈도를 줄일 수 있다.","근본 원인은 장애를 일으킨 소스 코드의 결함 그 자체를 말하며, 디버깅의 분석 단계에서 찾는다.","마감 압박 같은 상황은 오류의 원인이 될 수 없으므로 근본 원인으로 볼 수 없다."],"ans":[1],"exp":"1.2.3: 근본 원인은 근본 원인 분석으로 찾으며, 보통 장애가 발생하거나 결함을 식별한 경우 수행한다. 근본 원인을 처리(예: 제거)하면 유사한 장애와 결함을 예방하거나 그 빈도를 줄일 수 있다.","why":["근본 원인 분석은 장애가 발생하거나 결함을 식별한 경우 수행한다(1.2.3).","정답. 1.2.3의 설명과 일치한다.","근본 원인은 문제 발생의 근본적인 이유(예: 오류로 이어지는 상황)이며, 근본 원인 분석으로 찾는다. 소스 코드의 결점은 결함이다(1.2.3).","1.2.3은 시간적인 압박을 사람이 오류를 범하는 이유로 들고, 근본 원인의 예로 '오류로 이어지는 상황'을 든다."],"ref":"1.2.3"},{"id":"c1-017","ch":1,"lo":"FL-1.3.1","k":2,"q":"테스트 관리자가 회의에서 이렇게 말했다.\n\"이번 릴리스는 테스트 케이스 800개를 모두 실행했는데 결함이 하나도 발견되지 않았습니다. 그러니 이 소프트웨어에는 결함이 없습니다.\"\n\n이 발언과 가장 직접적으로 어긋나는 테스팅 원리는?","opts":["대부분의 결함은 소수의 시스템 컴포넌트에 집중되어 발생하는 경향이 있다.","프로세스 초기에 제거한 결함은 연관된 다른 산출물의 후속 결함으로 이어지지 않는다.","같은 테스트를 계속 반복하면 신규 결함 식별 효과가 점점 줄어든다.","테스팅은 결함이 있음을 보여줄 수 있지만, 결함이 없다는 것을 증명할 수는 없다."],"ans":[3],"exp":"1.3 원리 1: 테스팅은 결함이 있음을 보여줄 수 있지만 결함이 없다는 것을 증명할 수는 없다. 결함이 전혀 발견되지 않았더라도 그 소프트웨어가 완벽하다는 뜻은 아니다.","why":["원리 4(결함은 집중된다)의 내용이다. 결함이 소수 컴포넌트에 몰리는 현상으로, '결함이 없다'는 주장과는 관련이 없다.","원리 3(조기 테스팅으로 시간과 비용을 절약할 수 있다)의 내용이다. 결함을 일찍 제거하는 효과에 관한 것이다.","원리 5(테스트 효과는 줄어든다)의 내용이다. 같은 테스트를 반복할 때의 현상인데, 사례에는 반복 실행 이야기가 없다.","정답. 원리 1(테스팅은 결함의 존재를 밝히는 활동이지, 결함이 없음을 증명하지는 않는다)의 내용이다. '결함이 없다'는 결론은 이 원리와 정면으로 어긋난다."],"ref":"1.3"},{"id":"c1-018","ch":1,"lo":"FL-1.3.1","k":2,"q":"보험 가입 화면에는 입력 필드가 12개 있고, 필드마다 수십~수백 개의 값을 가질 수 있어 가능한 입력 조합이 수조 개를 넘는다. 테스트 관리자가 '모든 조합을 테스트하라'고 지시했다. 테스팅 원리에 비추어 가장 적절한 대응은?","opts":["모든 조합을 테스트할 수 있도록 테스트 인력을 늘리고, 그때까지 릴리스를 연기한다.","조합이 너무 많아 테스트가 의미 없으므로, 동적 테스팅을 생략하고 리뷰만 수행한다.","모든 조합을 실행하면 결함이 없음을 증명할 수 있으므로, 자동화 도구로 수조 개 조합을 전부 실행한다.","테스트 기법, 테스트 케이스 우선순위 지정, 리스크 기반 테스팅으로 테스트 노력을 집중한다."],"ans":[3],"exp":"1.3 원리 2(완벽한 테스팅은 불가능하다): 매우 간단한 소프트웨어를 제외하면 모든 것을 테스트할 수 없다. 완벽하게 테스트하려 하기보다 테스트 기법, 테스트 케이스 우선순위 지정, 리스크 기반 테스팅으로 테스트 노력을 집중해야 한다.","why":["모든 것을 테스트하는 것은 불가능하므로, 인력을 늘려 그때까지 기다리는 것은 원리 2와 어긋난다.","원리 2는 테스팅을 포기하라는 것이 아니라 테스트 기법 등을 사용해 테스트 노력을 집중하라는 것이다.","모든 조합 실행은 불가능하며(원리 2), 테스팅으로 결함이 없음을 증명할 수도 없다(원리 1).","정답. 원리 2(완벽한 테스팅은 불가능하다)가 제시하는 대응 그대로다."],"ref":"1.3"},{"id":"c1-019","ch":1,"lo":"FL-1.3.1","k":2,"q":"한 팀이 코딩을 시작하기 전에 요구사항 명세서를 리뷰해 모호한 정산 규칙을 찾아 바로잡았다. 덕분에 그 규칙을 바탕으로 만들 설계와 코드에는 같은 문제가 생기지 않았다. 이 사례와 관련된 테스팅 원리에 대한 설명으로 옳은 것은?","opts":["조기 테스팅 원리의 사례로, 초기에 제거한 결함은 연관된 다른 산출물의 후속 결함으로 이어지지 않는다.","조기 테스팅 원리는 정적 테스팅에만 적용되며, 동적 테스팅은 코드가 모두 완성된 뒤에 시작해야 한다.","결함 집중 원리의 사례로, 결함은 대부분 요구사항 명세서에 집중되므로 리뷰는 요구사항에만 하면 된다.","조기 테스팅을 하면 소프트웨어 개발수명주기 후반의 장애는 늘어나지만 결함 수정 비용은 줄어든다."],"ans":[0],"exp":"1.3 원리 3(조기 테스팅으로 시간과 비용을 절약할 수 있다): 초기에 발견해 제거한 결함은 연관된 다른 산출물의 후속 결함으로 이어지지 않는다. SDLC 후반의 장애가 줄어 품질 비용이 절감된다. 정적 테스팅과 동적 테스팅 모두 최대한 이른 시점에 시작해야 한다.","why":["정답. 원리 3(조기 테스팅으로 시간과 비용을 절약할 수 있다): 프로세스 초기에 제거한 결함은 연관된 다른 산출물의 후속 결함으로 이어지지 않는다.","원리 3은 정적 테스팅과 동적 테스팅 '모두' 최대한 일찍 시작해야 한다고 한다.","원리 4(결함은 집중된다)는 결함이 소수의 시스템 컴포넌트에 집중되는 현상이다. 결함이 요구사항 명세서에 집중된다거나 리뷰를 요구사항에만 하라는 내용은 없다.","원리 3에 따르면 SDLC 후반에 발생하는 장애가 '줄어든다'."],"ref":"1.3"},{"id":"c1-020","ch":1,"lo":"FL-1.3.1","k":2,"q":"전자상거래 시스템의 15개 컴포넌트 중 '결제'와 '쿠폰' 두 컴포넌트에서 지난 릴리스 결함의 대부분과 운영 장애 대부분이 나왔다. 이 현상과 관련된 테스팅 원리와 그 활용으로 옳은 것은?","opts":["테스트 효과는 줄어든다. 따라서 두 컴포넌트의 테스트를 중단해야 한다.","결함은 집중된다. 따라서 나머지 13개 컴포넌트에는 결함이 없으므로 테스트하지 않아도 된다.","테스팅은 정황에 의존적이다. 따라서 결함 분포는 테스트 계획에 반영하지 않는다.","결함은 집중된다. 예상되거나 실제로 관측된 결함 집중 영역은 리스크 기반 테스팅에서 중요하게 고려된다."],"ans":[3],"exp":"1.3 원리 4(결함은 집중된다): 대부분의 결함과 운영 장애는 소수의 컴포넌트에서 발생하는 경향이 있으며(파레토 원리의 예), 예상 결함 집중 영역과 실제 관측한 결함 집중 영역은 리스크 기반 테스팅에서 중요하게 고려된다.","why":["원리 5는 같은 테스트 반복의 효과 감소에 관한 것이며, 결함이 몰린 곳의 테스트를 중단하라는 내용이 아니다.","결함이 발견되지 않았다고 결함이 없다고 볼 수 없다(원리 1). 원리 4는 나머지를 테스트하지 말라고 하지 않는다.","결함 집중 영역은 리스크 기반 테스팅에서 중요하게 고려된다(원리 4). 반영하지 않는다는 설명은 틀렸다.","정답. 원리 4의 설명과 일치한다."],"ref":"1.3"},{"id":"c1-021","ch":1,"lo":"FL-1.3.1","k":2,"q":"2년 동안 매 릴리스마다 같은 수동 테스트 케이스 300개를 같은 테스트 데이터로 실행해 왔다. 최근 1년간 이 테스트로 새로 발견된 결함이 거의 없는데, 운영에서는 새로운 장애가 계속 보고되고 있다. 이 상황과 관련된 테스팅 원리에 비추어 옳은 설명 두 개를 고르시오.","opts":["같은 테스트를 계속 반복하면 신규 결함 식별 효과가 점점 줄어들 수 있으므로, 기존 테스트 케이스와 테스트 데이터를 수정하고 새로운 테스트를 작성할 필요가 있을 수 있다.","최근 1년간 새 결함이 발견되지 않았다는 것은 테스트 대상에 결함이 없다는 증거다.","기존 테스트 케이스는 리그레션 확인의 기준이므로 어떤 경우에도 수정해서는 안 된다.","같은 테스트의 반복은 어떤 경우에도 유익하지 않으므로 자동 리그레션 테스팅도 중단해야 한다.","자동 리그레션 테스팅처럼 같은 테스트를 반복하는 것이 유익한 경우도 있다."],"ans":[0,4],"exp":"1.3 원리 5(테스트 효과는 줄어든다): 같은 테스트를 계속 반복하면 신규 결함 식별 효과가 줄어든다. 이를 극복하려면 기존 테스트 케이스와 테스트 데이터를 수정하고 새 테스트를 작성할 필요가 있을 수 있다. 그러나 자동 리그레션 테스팅처럼 같은 테스트의 반복이 유익한 경우도 있다.","why":["정답. 원리 5의 설명과 일치한다.","결함이 발견되지 않았다고 결함이 없음이 증명되지는 않는다(원리 1).","원리 5는 오히려 기존 테스트 케이스와 테스트 데이터를 수정할 필요가 있을 수 있다고 한다.","원리 5는 자동 리그레션 테스팅처럼 반복이 유익한 경우도 있다고 한다.","정답. 원리 5에 명시된 예외다."],"ref":"1.3"},{"id":"c1-022","ch":1,"lo":"FL-1.3.1","k":2,"q":"한 회사가 생명유지 장치용 의료 소프트웨어와 일주일짜리 이벤트 홍보 웹페이지를 동시에 개발하면서, 두 제품에 똑같은 테스트 접근법과 같은 수준의 문서화를 적용하기로 했다. 이 결정과 가장 직접적으로 어긋나는 테스팅 원리는?","opts":["완벽한 테스팅은 불가능하다.","결함-부재는 궤변이다.","테스팅은 정황에 의존적이다.","테스트 효과는 줄어든다."],"ans":[2],"exp":"1.3 원리 6(테스팅은 정황에 의존적이다): 모든 상황에 적용할 수 있는 하나의 테스팅 접근법은 없으며, 테스팅은 정황에 따라 다르게 진행해야 한다.","why":["원리 2는 모든 것을 테스트할 수 없으니 테스트 노력을 집중하라는 것이다. 서로 다른 제품에 같은 접근법을 쓰는 문제와는 거리가 있다.","원리 7은 베리피케이션만으로 시스템 성공이 보장되지 않는다는 것이다.","정답. 정황이 전혀 다른 두 제품에 같은 접근법을 쓰는 것은 원리 6과 어긋난다.","원리 5는 같은 테스트를 반복할 때 효과가 줄어드는 현상이다."],"ref":"1.3"},{"id":"c1-023","ch":1,"lo":"FL-1.3.1","k":2,"q":"시스템 공급업체가 계약서에 정의된 요구사항 120개를 모두 철저히 테스트하고, 발견한 결함도 모두 수정해 납품했다. 그러나 실제 사용자들은 업무 흐름에 맞지 않는다며 사용을 거부했고, 경쟁 제품보다 불편하다는 평가를 받았다. 이 상황을 설명하는 테스팅 원리와 교훈으로 옳은 것은?","opts":["결함-부재는 궤변이다. 베리피케이션이 시스템의 성공을 보장하지는 않으므로 밸리데이션도 수행해야 한다.","완벽한 테스팅은 불가능하다. 요구사항 120개보다 더 많은 테스트 케이스를 만들었어야 했다.","테스트 효과는 줄어든다. 같은 테스트를 반복했기 때문에 사용자 요구를 놓쳤다.","결함-부재는 궤변이다. 발견한 결함을 모두 수정했으므로 시스템은 성공한 것이며, 사용자 불만은 테스팅과 무관하다."],"ans":[0],"exp":"1.3 원리 7(결함-부재는 궤변이다): 정의한 모든 요구사항을 철저히 테스트하고 발견한 모든 결함을 수정해도, 사용자의 요구나 기대에 못 미치거나 경쟁 시스템보다 부족한 시스템이 만들어질 수 있다. 따라서 베리피케이션과 함께 밸리데이션도 수행해야 한다.","why":["정답. 원리 7의 설명과 사례가 일치한다.","원리 2는 테스트를 더 늘리라는 것이 아니라 테스트 노력을 집중하라는 것이다. 이 사례의 문제는 요구사항 자체가 사용자 필요를 반영하지 못한 데 있다.","사례에는 같은 테스트를 반복했다는 내용이 없다. 원리 5와 관련이 없다.","원리 7은 결함을 모두 고쳐도 시스템이 성공하지 못할 수 있다는 것이다. 설명이 원리와 정반대다."],"ref":"1.3"},{"id":"c1-024","ch":1,"lo":"FL-1.4.1","k":2,"q":"테스터가 사용자 스토리와 요구사항 명세서를 읽으며 테스트 가능한 기능을 식별하고, 관련 리스크 수준을 고려해 테스트 컨디션(test condition)을 정의하고 우선순위를 매겼다. 이 과정에서 요구사항 문장의 모호한 부분도 결함으로 기록했다. 이 업무들은 주로 어떤 테스트 활동에 해당하는가?","opts":["테스트 계획(test planning)","테스트 분석(test analysis)","테스트 설계(test design)","테스트 구현(test implementation)"],"ans":[1],"exp":"1.4.1: 테스트 분석에서는 테스트 베이시스를 분석해 테스트 가능한 기능을 식별하고, 연관된 리스크와 리스크 수준을 고려해 테스트 컨디션을 정의하고 우선순위를 매긴다. 테스트 베이시스에 있을 수 있는 결함도 함께 식별한다.","why":["테스트 계획은 테스트 목적을 정의하고 이를 가장 잘 달성할 접근법을 선택하는 활동이다(1.4.1).","정답. 1.4.1의 테스트 분석 설명과 일치한다.","테스트 설계는 테스트 컨디션을 테스트 케이스와 기타 테스트웨어로 구체화하는 활동이다(1.4.1).","테스트 구현은 테스트 실행에 필요한 테스트웨어를 만들거나 획득하는 활동이다(1.4.1)."],"ref":"1.4.1"},{"id":"c1-025","ch":1,"lo":"FL-1.4.1","k":2,"q":"테스터가 우선순위가 매겨진 테스트 컨디션을 바탕으로 커버리지 항목을 식별해 테스트 케이스 입력값을 구체화했다. 또 테스트 데이터 요구사항을 정의하고, 테스트 환경을 설계하고, 필요한 인프라와 도구를 식별했다. 이 활동에 대한 설명으로 옳은 것은?","opts":["테스트 분석이며, '무엇을 테스트할 것인가?'라는 질문에 측정 가능한 커버리지 조건으로 답한다.","테스트 구현이며, 테스트 환경을 구축하고 올바르게 설정되었는지 확인하는 활동이다.","테스트 설계이며, '어떻게 테스트할 것인가?'라는 질문에 답한다.","테스트 계획이며, 전반적인 제약 조건 안에서 테스트 목적을 가장 잘 달성할 접근법을 선택하는 활동이다."],"ans":[2],"exp":"1.4.1: 테스트 설계는 테스트 컨디션을 테스트 케이스와 기타 테스트웨어로 구체화하며, 커버리지 항목 식별, 테스트 데이터 요구사항 정의, 테스트 환경 설계, 필요한 인프라와 도구 식별을 포함한다. 테스트 설계는 '어떻게 테스트할 것인가?'에 답한다.","why":["테스트 컨디션을 정의하는 것은 분석이지만, 사례는 이미 정의된 테스트 컨디션을 구체화하는 설계 업무다(1.4.1).","테스트 환경 '구축과 설정 확인'은 구현이지만, 사례의 환경 '설계'와 데이터 요구사항 정의는 설계 업무다(1.4.1).","정답. 1.4.1의 테스트 설계 설명과 일치한다.","사례에는 테스트 목적 정의나 접근법 선택이 없다(1.4.1)."],"ref":"1.4.1"},{"id":"c1-026","ch":1,"lo":"FL-1.4.1","k":2,"q":"테스트 실행을 하루 앞두고 테스터가 다음 업무를 했다.\n• 테스트 케이스를 테스트 절차(test procedure)로 묶고, 이를 테스트 스위트(test suite)로 조합했다.\n• 수동 및 자동 테스트 스크립트를 작성했다.\n• 우선순위를 반영해 테스트 실행 일정을 정리했다.\n• 테스트 환경을 구축하고 올바르게 설정되었는지 확인했다.\n\n이 업무들이 속하는 테스트 활동은?","opts":["테스트 설계","테스트 실행","테스트 완료","테스트 구현"],"ans":[3],"exp":"1.4.1: 테스트 구현은 테스트 실행에 필요한 테스트웨어를 만들거나 획득하는 활동이다. 테스트 케이스를 테스트 절차로 묶고 테스트 스위트로 조합하며, 수동·자동 테스트 스크립트를 만들고, 우선순위를 반영한 테스트 실행 일정을 정리하고, 테스트 환경을 구축해 설정을 확인한다.","why":["테스트 설계는 테스트 케이스를 구체화하고 테스트 환경을 '설계'하는 활동이다. 환경 구축과 실행 일정 정리는 구현이다(1.4.1).","테스트 실행은 실행 일정에 따라 테스트를 수행하고 결과를 비교·기록하는 활동이다(1.4.1).","테스트 완료는 프로젝트 마일스톤에서 테스트웨어 보관, 환경 종료, 교훈 파악 등을 하는 활동이다(1.4.1).","정답. 나열된 업무가 모두 1.4.1의 테스트 구현 업무다."],"ref":"1.4.1"},{"id":"c1-027","ch":1,"lo":"FL-1.4.1","k":2,"q":"테스트 관리자가 매일 실제 테스트 진행 상황을 계획과 비교하다가, 결함 수정이 늦어져 테스트 실행이 계획보다 3일 늦어졌다는 것을 알게 됐다. 그래서 테스트 목적을 달성하기 위해 우선순위가 낮은 테스트를 뒤로 미루고 인력을 재배치했다. 두 행동을 순서대로 바르게 짝지은 것은?","opts":["테스트 모니터링(test monitoring) → 테스트 제어(test control)","테스트 제어 → 테스트 모니터링","테스트 계획(test planning) → 테스트 완료(test completion)","테스트 분석(test analysis) → 테스트 구현(test implementation)"],"ans":[0],"exp":"1.4.1: 테스트 모니터링은 지속적으로 모든 테스트 활동을 점검하고 실제 진행 상황을 계획과 비교하는 활동이다. 테스트 제어는 테스트 목적을 달성하는 데 필요한 조치를 하는 활동이다.","why":["정답. 진행 상황을 계획과 비교한 것은 모니터링, 조치를 취한 것은 제어다(1.4.1).","순서가 뒤바뀌었다. 비교·점검이 모니터링이고, 조치가 제어다(1.4.1).","테스트 계획은 테스트 목적을 정의하고 이를 달성할 접근법을 고르는 활동이고, 테스트 완료는 보통 프로젝트 마일스톤에서 수행하는 활동이다. 진행 상황을 계획과 비교하고 조치하는 일은 모니터링과 제어다(1.4.1).","분석과 구현은 테스트 컨디션 정의, 테스트웨어 준비에 관한 활동이다(1.4.1)."],"ref":"1.4.1"},{"id":"c1-028","ch":1,"lo":"FL-1.4.1","k":2,"q":"다음 중 테스트 완료(test completion) 활동에서 수행하는 업무 두 개를 고르시오.","opts":["실제 테스트 결과를 기대 결과와 비교하고 기록한다.","해결되지 않은 결함에 대해 변경 요청서나 제품 백로그 항목을 만든다.","테스트 목적을 정의하고, 제약 조건 안에서 목적을 가장 잘 달성할 접근법을 선택한다.","테스트 환경을 합의된 상태로 종료한다.","연관된 리스크 수준을 고려해 테스트 컨디션을 정의하고 우선순위를 매긴다."],"ans":[1,3],"exp":"1.4.1: 테스트 완료에서는 해결되지 않은 결함에 대해 변경 요청서나 제품 백로그 항목을 만들고, 유용한 테스트웨어를 보관·인계하며, 테스트 환경을 합의된 상태로 종료하고, 교훈과 개선 사항을 파악하고, 테스트 완료 보고서를 작성해 전달한다.","why":["실제 결과와 기대 결과의 비교·기록은 테스트 실행 업무다(1.4.1).","정답. 1.4.1의 테스트 완료 업무다.","테스트 목적 정의와 접근법 선택은 테스트 계획 업무다(1.4.1).","정답. 1.4.1의 테스트 완료 업무다.","테스트 컨디션 정의와 우선순위 지정은 테스트 분석 업무다(1.4.1)."],"ref":"1.4.1"},{"id":"c1-029","ch":1,"lo":"FL-1.4.2","k":2,"q":"인공호흡기 제어 소프트웨어를 테스트하는 팀이 있다. 테스트 대상이 환자의 생명과 직결돼 중요도가 매우 높고, 식별된 리스크도 많아서 테스트 접근법을 엄격하게 정했다. 이 결정에 가장 직접적으로 영향을 준 정황 요소는?","opts":["소프트웨어 개발수명주기","프로젝트 제약 조건","조직적 요인","비즈니스 도메인"],"ans":[3],"exp":"1.4.2: 테스팅 수행 방식에 영향을 주는 정황 요소 중 '비즈니스 도메인'에는 테스트 대상의 중요도, 식별된 리스크, 시장 요구사항, 구체적인 법적 규제 등이 포함된다.","why":["소프트웨어 개발수명주기(SDLC) 요소는 공학적 프랙티스, 개발 방법론 등이다(1.4.2).","프로젝트 제약 조건은 범위, 시간, 예산, 자원 등이다(1.4.2).","조직적 요인은 조직 구조, 기존 정책, 적용한 프랙티스 등이다(1.4.2).","정답. 테스트 대상의 중요도와 식별된 리스크는 비즈니스 도메인 요소다(1.4.2)."],"ref":"1.4.2"},{"id":"c1-030","ch":1,"lo":"FL-1.4.2","k":2,"q":"정황과 테스트 프로세스의 관계에 대한 설명으로 옳은 것은?","opts":["테스팅은 조직의 개발 프로세스와 분리해 테스트팀이 단독으로 수행하는 것이 원칙이다.","테스팅 비용은 테스트팀이 부담하므로, 테스팅의 최종 목표는 테스트팀이 세운 목표의 달성이다.","프로젝트 제약 조건 같은 정황 요소는 테스트 전략, 테스트 자동화 수준, 필요 커버리지 수준에 영향을 준다.","정황 요소는 어떤 테스트 기법을 쓸지에는 영향을 주지만, 테스트웨어의 상세화 수준이나 테스트 보고에는 영향을 주지 않는다."],"ans":[2],"exp":"1.4.2: 정황 요소(이해관계자, 팀원, 비즈니스 도메인, 기술적 요인, 프로젝트 제약 조건, 조직적 요인, SDLC, 도구)는 테스트 전략, 적용된 테스트 기법, 테스트 자동화 수준, 필요 커버리지 수준, 테스트웨어의 상세화 수준, 테스트 보고 등에 영향을 미친다.","why":["1.4.2는 테스팅이 단독으로 수행되지 않으며, 테스트 활동은 조직에서 수행하는 개발 프로세스의 필수적인 부분이라고 한다.","테스팅 비용은 이해관계자가 부담하며, 최종 목표는 이해관계자의 비즈니스 목표 달성 지원이다(1.4.2).","정답. 1.4.2: 프로젝트 제약 조건(범위, 시간, 예산, 자원 등) 같은 정황 요소는 테스트 전략, 테스트 자동화 수준, 필요 커버리지 수준 등에 영향을 미친다.","1.4.2는 테스트웨어의 상세화 수준과 테스트 보고도 정황 요소의 영향을 받는다고 한다."],"ref":"1.4.2"},{"id":"c1-031","ch":1,"lo":"FL-1.4.3","k":2,"q":"다음 중 테스트 구현(test implementation) 활동의 작업 산출물에 해당하는 것은?","opts":["테스트 로그와 결함 보고서","커버리지 항목과 테스트 차터","우선순위가 지정된 테스트 컨디션","스텁(stub)과 드라이버"],"ans":[3],"exp":"1.4.3: 테스트 구현 작업 산출물에는 테스트 절차, 수동 및 자동 테스트 스크립트, 테스트 스위트, 테스트 데이터, 테스트 실행 일정, 테스트 환경 요소가 있다. 테스트 환경 요소의 예로 스텁, 드라이버, 시뮬레이터, 서비스 가상화가 있다.","why":["테스트 로그와 결함 보고서는 테스트 실행 작업 산출물이다(1.4.3). 테스트 베이시스의 결함에 관한 결함 보고서는 테스트 분석 작업 산출물에도 들어가지만, 테스트 구현 작업 산출물은 아니다.","커버리지 항목과 테스트 차터(test charter)는 테스트 설계 작업 산출물이다(1.4.3).","우선순위가 지정된 테스트 컨디션은 테스트 분석 작업 산출물이다(1.4.3).","정답. 스텁과 드라이버는 테스트 환경 요소의 예이고, 테스트 환경 요소는 테스트 구현 작업 산출물이다(1.4.3)."],"ref":"1.4.3"},{"id":"c1-032","ch":1,"lo":"FL-1.4.3","k":2,"q":"테스트웨어(testware)와 그것을 만드는 테스트 활동을 바르게 짝지은 것은?","opts":["리스크 관리 대장(risk register) – 테스트 완료","테스트 로그 – 테스트 구현","테스트 차터 – 테스트 분석","테스트 진행 상황 보고서 – 테스트 모니터링과 제어"],"ans":[3],"exp":"1.4.3: 테스트 모니터링과 테스트 제어 작업 산출물에는 테스트 진행 상황 보고서, 제어 지침 문서, 리스크 정보가 있다.","why":["리스크 관리 대장은 테스트 계획 작업 산출물이다(1.4.3).","테스트 로그는 테스트 실행 작업 산출물이다(1.4.3).","테스트 차터는 테스트 설계 작업 산출물이다(1.4.3).","정답. 1.4.3의 테스트 모니터링과 제어 작업 산출물이다."],"ref":"1.4.3"},{"id":"c1-033","ch":1,"lo":"FL-1.4.3","k":2,"q":"테스터가 테스트 베이시스(test basis)인 요구사항 명세서를 살펴보다가 서로 모순되는 두 요구사항을 발견했다. 작성자가 바로 수정하지 못해 결함 보고서(defect report)를 작성했다. 실라버스의 테스트웨어 분류에 따르면 이 결함 보고서는 어떤 테스트 활동의 작업 산출물인가?","opts":["테스트 계획","테스트 구현","테스트 완료","테스트 분석"],"ans":[3],"exp":"1.4.3: 테스트 분석 작업 산출물에는 (우선순위가 지정된) 테스트 컨디션과 '(바로 수정하지 않았다면) 테스트 베이시스의 결함에 관한 결함 보고서'가 있다.","why":["테스트 계획 작업 산출물에는 테스트 계획, 테스트 일정, 리스크 관리 대장, 시작 및 완료 조건 등이 있다(1.4.3).","테스트 구현 작업 산출물에는 테스트 절차, 수동 및 자동 테스트 스크립트, 테스트 스위트, 테스트 데이터, 테스트 실행 일정, 테스트 환경 요소 등이 있다(1.4.3).","테스트 완료 작업 산출물에는 테스트 완료 보고서, 개선 실천 항목, 문서로 기록한 교훈, 변경 요청서 등이 있다(1.4.3).","정답. 테스트 베이시스의 결함에 관한 결함 보고서는 테스트 분석 작업 산출물이다(1.4.3)."],"ref":"1.4.3"},{"id":"c1-034","ch":1,"lo":"FL-1.4.4","k":2,"q":"릴리스 결정 회의를 앞두고 경영진이 '지금 출시하면 테스트 대상에 리스크가 어느 정도 남아 있는가?'라고 물었다. 이 질문에 답하는 데 가장 직접적으로 쓰이는 추적성(traceability)은?","opts":["테스트 결과에서 리스크로의 추적성","테스트 케이스에서 테스트 데이터로의 추적성","테스트 절차에서 테스트 실행 일정으로의 추적성","테스트 케이스에서 요구사항으로의 추적성"],"ans":[0],"exp":"1.4.4: 테스트 결과에서 리스크로의 추적성을 통해 테스트 대상의 잔존 리스크 수준을 평가할 수 있다.","why":["정답. 1.4.4에 제시된 예와 일치한다.","테스트 케이스와 테스트 데이터의 연결은 잔존 리스크 수준과 관련이 없다.","테스트 절차와 실행 일정의 연결은 실행 순서에 관한 것이며 잔존 리스크 평가와 관련이 없다.","테스트 케이스에서 요구사항으로의 추적성은 테스트 케이스가 요구사항을 커버하는지 확인하는 데 쓰인다(1.4.4)."],"ref":"1.4.4"},{"id":"c1-035","ch":1,"lo":"FL-1.4.4","k":2,"q":"결제 관련 요구사항 하나가 변경되었다. 테스트 관리자는 이 요구사항에 연결된 테스트 컨디션, 테스트 케이스, 테스트 결과를 바로 찾아내 어떤 테스트웨어를 고치고 다시 실행해야 하는지 파악했다. 이 사례가 보여주는 추적성(traceability)의 가치는?","opts":["추적성은 테스트 대상에 결함이 없음을 증명해 준다.","좋은 추적성은 변경사항의 영향을 파악할 수 있게 해 준다.","추적성은 테스트 실행을 자동화해 실행 시간을 줄여 준다.","추적성은 테스트 계획 활동에서만 필요하며, 테스트 프로세스 전반에 걸쳐 유지할 필요는 없다."],"ans":[1],"exp":"1.4.4: 좋은 추적성은 커버리지 평가 외에도 변경사항의 영향을 파악할 수 있게 한다.","why":["테스팅은 결함이 없음을 증명할 수 없다(1.3 원리 1). 추적성도 마찬가지다.","정답. 1.4.4의 설명과 사례가 일치한다.","1.4.4는 추적성의 가치로 테스트 실행 자동화를 들지 않는다. 사례도 영향 파악에 관한 것이다.","1.4.4는 테스트 프로세스 전반에 걸쳐 추적성을 구축하고 유지하는 것이 중요하다고 한다."],"ref":"1.4.4"},{"id":"c1-036","ch":1,"lo":"FL-1.4.4","k":2,"q":"추적성을 유지하는 것의 가치로 실라버스에 제시된 것 두 개를 고르시오.","opts":["테스트 감사를 용이하게 하고, IT 운영 및 관리(IT governance) 기준을 충족하는 데 도움이 된다.","테스트 케이스를 실행하지 않아도 테스트 결과를 알 수 있게 해 준다.","테스트 베이시스 요소들의 상태를 명시해 테스트 진행 상황 보고서와 테스트 완료 보고서를 더 쉽게 이해할 수 있게 해 준다.","같은 테스트를 반복해도 신규 결함 식별 효과가 줄어들지 않게 해 준다.","개발자가 디버깅 없이도 결함을 제거할 수 있게 해 준다."],"ans":[0,2],"exp":"1.4.4: 좋은 추적성은 변경사항의 영향 파악, 테스트 감사 용이, IT 운영 및 관리 기준 충족에 도움이 된다. 또 테스트 베이시스 요소들의 상태를 명시해 테스트 진행 상황 보고서와 테스트 완료 보고서를 더 쉽게 이해하게 해 준다.","why":["정답. 1.4.4에 제시된 가치다.","추적성은 이미 나온 테스트 결과를 다른 요소와 연결해 줄 뿐, 실행 없이 결과를 알려 주지 않는다(1.4.4).","정답. 1.4.4에 제시된 가치다.","같은 테스트 반복으로 효과가 줄어드는 것은 원리 5의 내용이며, 추적성의 가치가 아니다(1.3).","결함 제거는 디버깅으로 한다(1.1.2). 추적성이 디버깅을 대신하지 않는다."],"ref":"1.4.4"},{"id":"c1-037","ch":1,"lo":"FL-1.4.5","k":2,"q":"테스트 관리 역할과 테스팅 역할을 비교한 설명으로 옳은 것은?","opts":["테스트 관리 역할은 테스팅의 공학(기술)적 측면을, 테스팅 역할은 테스트 프로세스, 테스트팀, 테스트 활동 리더십을 각각 책임진다.","테스트 관리 역할은 테스트 프로세스, 테스트팀, 테스트 활동 리더십을, 테스팅 역할은 테스팅의 공학(기술)적 측면을 책임진다.","두 역할에 할당되는 활동과 업무는 프로젝트 정황, 담당자의 기술 수준, 조직 상황과 관계없이 동일하게 고정되어 있다.","테스팅 역할은 주로 테스트 계획, 테스트 모니터링, 테스트 제어, 테스트 완료 활동에 초점을 둔다."],"ans":[1],"exp":"1.4.5: 테스트 관리 역할은 테스트 프로세스, 테스트팀, 테스트 활동 리더십에 대한 전반적인 책임을 진다. 테스팅 역할은 테스팅의 공학(기술)적인 측면에 대한 전반적인 책임을 진다.","why":["두 역할의 책임이 서로 뒤바뀌었다(1.4.5).","정답. 1.4.5: 테스트 관리 역할은 테스트 프로세스, 테스트팀, 테스트 활동 리더십에, 테스팅 역할은 테스팅의 공학(기술)적 측면에 전반적인 책임을 진다.","두 역할에 할당되는 활동과 업무는 프로젝트·제품 정황, 담당자 기술 수준, 조직 상황 등에 따라 달라진다(1.4.5).","테스트 계획, 모니터링, 제어, 완료는 테스트 관리 역할의 주요 관심 영역이다. 테스팅 역할은 주로 테스트 분석, 설계, 구현, 실행에 초점을 둔다(1.4.5)."],"ref":"1.4.5"},{"id":"c1-038","ch":1,"lo":"FL-1.4.5","k":2,"q":"작은 회사에서 개발 관리자가 이번 프로젝트의 테스트 관리 역할을 맡게 되었다. 이 역할로서 그가 주로 초점을 맞출 테스트 활동의 조합으로 옳은 것은?","opts":["테스트 분석, 테스트 설계, 테스트 구현, 테스트 실행","테스트 계획, 테스트 설계, 테스트 실행, 테스트 완료","테스트 분석, 테스트 모니터링, 테스트 구현, 테스트 완료","테스트 계획, 테스트 모니터링, 테스트 제어, 테스트 완료"],"ans":[3],"exp":"1.4.5: 테스트 관리 역할의 주요 관심 영역은 테스트 계획, 테스트 모니터링, 테스트 제어, 테스트 완료 활동이다. 테스트 관리 역할은 팀 리더, 테스트 관리자, 개발 관리자 등이 수행할 수 있다.","why":["이 조합은 테스팅 역할이 주로 초점을 두는 활동이다(1.4.5).","테스트 설계와 테스트 실행은 테스팅 역할의 활동이다(1.4.5).","테스트 분석과 테스트 구현은 테스팅 역할의 활동이다(1.4.5).","정답. 1.4.5에 제시된 테스트 관리 역할의 주요 관심 영역이다."],"ref":"1.4.5"},{"id":"c1-039","ch":1,"lo":"FL-1.4.5","k":2,"q":"테스팅에서의 역할 분담에 대한 설명으로 옳은 것은?","opts":["테스트 관리 역할은 '테스트 관리자' 직함을 가진 사람만 수행할 수 있으며, 팀 리더는 맡을 수 없다.","애자일 소프트웨어 개발에서는 테스트 관리 업무의 일부를 애자일팀이 처리할 수 있다.","한 사람이 테스팅 역할과 테스트 관리 역할을 동시에 맡는 것은 허용되지 않는다.","애자일 소프트웨어 개발에서는 테스트 관리 역할이 필요 없으므로 테스트 관리 업무가 모두 사라진다."],"ans":[1],"exp":"1.4.5: 테스트 관리 역할의 수행 방식은 정황에 따라 달라진다. 애자일 소프트웨어 개발에서는 테스트 관리 업무의 일부를 애자일팀이 처리할 수 있고, 여러 팀 또는 조직 전체의 협업이 필요한 과업은 개발팀 외부의 테스트 관리자가 수행할 수도 있다.","why":["테스트 관리 역할은 팀 리더, 테스트 관리자, 개발 관리자 등이 수행할 수 있다(1.4.5).","정답. 1.4.5: 애자일 소프트웨어 개발에서는 테스트 관리 업무의 일부를 애자일팀이 처리할 수 있다. 여러 팀이나 조직 전체에 걸친 과업은 개발팀 외부의 테스트 관리자가 수행할 수도 있다.","1.4.5는 한 사람이 테스팅과 테스트 관리 역할을 동시에 수행하는 경우도 있다고 한다.","애자일에서는 테스트 관리 업무의 '일부'를 애자일팀이 처리할 수 있다는 것이지 업무가 사라지는 것이 아니다(1.4.5)."],"ref":"1.4.5"},{"id":"c1-040","ch":1,"lo":"FL-1.5.1","k":2,"q":"보험 청구 시스템을 테스트하는 테스터가 보험 심사 담당자들과 회의할 때마다 업무 용어와 절차를 이해하지 못해 소통에 어려움을 겪고 있다. 실라버스에 비추어 이 테스터에게 가장 보강이 필요한 기술은?","opts":["도메인 지식","기술 지식","테스팅 지식","철저함과 체계적인 접근"],"ans":[0],"exp":"1.5.1: 도메인 지식은 최종 사용자/비즈니스 대표자를 이해하고 그들과 소통하기 위해 필요하다.","why":["정답. 비즈니스 대표자를 이해하고 소통하기 위한 기술은 도메인 지식이다(1.5.1).","기술 지식은 적절한 테스트 도구 사용 등을 통해 테스팅을 개선하기 위한 것이다(1.5.1).","테스팅 지식은 테스트 기법 활용 등으로 테스팅 효과를 높이기 위한 것이다(1.5.1).","철저함과 체계적인 접근은 결함, 특히 찾기 어려운 결함을 식별하기 위한 것이다(1.5.1)."],"ref":"1.5.1"},{"id":"c1-041","ch":1,"lo":"FL-1.5.1","k":2,"q":"테스터가 개발자에게 결함을 보고하자, 개발자는 자신이 비난받는다고 느끼며 방어적으로 반응했다. 이 상황에 대한 실라버스의 설명으로 옳은 것은?","opts":["나쁜 소식은 갈등을 일으키므로, 테스터는 심각한 결함만 말로 전하고 나머지는 보고하지 않는다.","확증 편향(confirmation bias)은 기존 믿음과 맞지 않는 정보를 더 쉽게 받아들이게 만든다.","테스트 결과 전달은 제품이나 작성자에 대한 비판으로 받아들여질 수 있으며, 결함과 장애 정보는 건설적인 방법으로 전달해야 한다.","테스팅은 파괴적인 활동이므로 개발자의 반발은 피할 수 없으며, 테스터에게 의사소통 기술은 중요하지 않다."],"ans":[2],"exp":"1.5.1: 테스터는 나쁜 소식을 전하는 경우가 많고, 사람은 나쁜 소식을 전한 사람을 탓하는 경향이 있어 테스터에게 의사소통 기술이 매우 중요하다. 테스트 결과의 전달은 제품이나 작성자에 대한 비판으로 오해받을 소지가 있다. 테스팅을 파괴적인 활동으로 보는 사람도 있는데, 이런 인식을 개선하려면 결함과 장애 정보를 건설적인 방법으로 전달해야 한다.","why":["1.5.1은 결함을 숨기라고 하지 않는다. 결함을 보고하고 논의하는 것도 의사소통 기술의 목적이다.","방향이 반대다. 확증 편향은 현재 믿음과 맞지 않는 정보를 받아들이기 '어렵게' 만든다(1.5.1).","정답. 1.5.1의 설명과 일치한다.","1.5.1은 테스팅을 파괴적 활동으로 보는 사람이 있지만 테스팅은 프로젝트 성공에 크게 기여하며, 의사소통 기술은 매우 중요하다고 한다."],"ref":"1.5.1"},{"id":"c1-042","ch":1,"lo":"FL-1.5.1","k":2,"q":"테스터에게 필요한 기술과 그 기술이 필요한 이유를 바르게 짝지은 것은?","opts":["도메인 지식 – 적절한 테스트 도구 사용으로 테스팅 효과를 높이기 위해","테스팅 지식 – 최종 사용자/비즈니스 대표자를 이해하고 그들과 소통하기 위해","철저함, 신중함, 호기심 – 결함, 특히 찾기 어려운 결함을 식별하기 위해","우수한 의사소통 기술, 경청하는 자세 – 테스트 기법을 활용해 테스팅 효과를 높이기 위해"],"ans":[2],"exp":"1.5.1: 철저함, 신중함, 호기심, 세부사항에 대한 주의력, 체계적인 접근은 결함, 특히 찾기 어려운 결함을 식별하기 위해 필요하다.","why":["적절한 테스트 도구 사용은 기술 지식의 예다. 도메인 지식은 최종 사용자/비즈니스 대표자를 이해하고 소통하기 위한 것이다(1.5.1).","최종 사용자/비즈니스 대표자와의 소통은 도메인 지식의 목적이다. 테스팅 지식은 테스트 기법 활용 등으로 테스팅 효과를 높이기 위한 것이다(1.5.1).","정답. 1.5.1: 철저함, 신중함, 호기심, 세부사항에 대한 주의력, 체계적인 접근은 결함, 특히 찾기 어려운 결함을 식별하기 위해 필요하다.","테스트 기법 활용은 테스팅 지식의 예다. 우수한 의사소통 기술, 경청하는 자세, 팀플레이는 이해관계자와 효과적으로 상호작용하고 결함을 보고·논의하기 위한 것이다(1.5.1)."],"ref":"1.5.1"},{"id":"c1-043","ch":1,"lo":"FL-1.5.2","k":1,"q":"전체 팀 접근법(whole team approach)의 장점으로 실라버스에 제시된 것은?","opts":["팀원 간 의사소통의 필요성이 줄어들어 회의와 상호작용을 최소화할 수 있다.","팀원마다 담당 업무가 엄격히 고정되어 업무 경계와 품질 책임자가 분명해진다.","팀 내 의사소통과 협업을 강화하고, 다양한 기술을 활용해 시너지를 창출한다.","비즈니스 담당자와 협력할 필요가 없어져 인수 테스트를 테스터가 단독으로 작성한다."],"ans":[2],"exp":"1.5.2: 전체 팀 접근법은 팀의 활력을 높이고 팀 내 의사소통과 협업을 강화하며, 프로젝트의 성공을 위해 팀이 가진 다양한 기술을 활용해 시너지를 창출한다.","why":["전체 팀 접근법은 의사소통과 협업을 '강화'한다(1.5.2).","전체 팀 접근법에서는 필요 지식과 기술을 갖춘 팀원이라면 누구나 어떤 작업이라도 수행할 수 있고, 모든 팀원이 품질에 대한 책임을 진다(1.5.2).","정답. 1.5.2에 제시된 장점이다. 팀의 활력을 높이는 것도 장점에 들어간다.","테스터는 비즈니스 담당자와 협력해 적절한 인수 테스트를 작성한다(1.5.2)."],"ref":"1.5.2"},{"id":"c1-044","ch":1,"lo":"FL-1.5.2","k":1,"q":"전체 팀 접근법에서 작업 수행과 품질 책임에 대한 설명으로 옳은 것은?","opts":["필요 지식과 기술을 갖춘 팀원은 누구나 어떤 작업이든 할 수 있고, 모든 팀원이 품질을 책임진다.","테스트 작업은 테스터만, 개발 작업은 개발자만 수행하며, 품질 책임은 테스터에게 있다.","품질 책임은 비즈니스 담당자에게 있고, 테스터와 개발자는 각자 지시받은 작업만 수행한다.","모든 팀원이 모든 작업을 똑같이 나눠 맡아야 하며, 작업을 배정할 때 지식이나 기술 수준은 고려하지 않는다."],"ans":[0],"exp":"1.5.2: 전체 팀 접근법에서는 필요 지식과 기술을 갖춘 팀원이라면 누구나 어떤 작업이라도 수행할 수 있고, 모든 팀원이 품질에 대한 책임을 진다.","why":["정답. 1.5.2의 설명과 일치한다.","모든 팀원이 품질에 대한 책임을 지며, 작업도 역할로 나뉘어 고정되지 않는다(1.5.2).","품질 책임은 특정 역할이 아니라 모든 팀원에게 있다(1.5.2).","작업 수행의 조건은 '필요 지식과 기술을 갖춘' 팀원이다(1.5.2). 지식과 기술 수준을 고려하지 않는다는 설명은 이와 반대다."],"ref":"1.5.2"},{"id":"c1-045","ch":1,"lo":"FL-1.5.2","k":1,"q":"전체 팀 접근법에서 팀원들이 (물리적 또는 가상의) 작업 공간을 공유하는 이유로 옳은 것은?","opts":["같은 공간을 사용하는 것(co-location)이 의사소통과 상호작용을 용이하게 하기 때문이다.","테스터가 개발자의 작업을 감시해 테스트 독립성을 높이기 위해서다.","물리적으로 같은 사무실을 써야만 하며, 가상 작업 공간은 전체 팀 접근법으로 인정되지 않기 때문이다.","작업 공간 비용을 줄이는 것이 전체 팀 접근법의 주목적이기 때문이다."],"ans":[0],"exp":"1.5.2: 같은 공간을 사용하는 것(co-location)은 의사소통과 상호작용을 용이하게 하므로 팀원들은 (물리적 또는 가상의) 작업 공간을 공유한다.","why":["정답. 1.5.2의 설명과 일치한다.","1.5.2에는 감시나 독립성 향상에 관한 내용이 없다. 공간 공유의 이유는 의사소통과 상호작용이다.","1.5.2는 작업 공간이 물리적이거나 가상일 수 있다고 명시한다.","1.5.2는 공간 공유의 이유로 비용 절감을 들지 않는다."],"ref":"1.5.2"},{"id":"c1-046","ch":1,"lo":"FL-1.5.2","k":1,"q":"전체 팀 접근법에서 테스터가 다른 팀원과 협력하는 방식으로 실라버스에 제시된 것은?","opts":["개발자에게 테스트 전략을 통보하고, 테스트 자동화 접근법은 테스터가 단독으로 결정한다.","비즈니스 담당자와 함께 인수 테스트를 작성하고, 개발자와 함께 테스트 전략과 자동화 접근법을 정한다.","인수 테스트는 비즈니스 담당자가 단독으로 작성하고, 테스터는 테스트 전략 협의 등에서 개발자와만 협력한다.","테스트 전문성을 지키기 위해 테스팅 지식은 다른 팀원과 공유하지 않고 테스터끼리만 공유한다."],"ans":[1],"exp":"1.5.2: 테스터는 비즈니스 담당자와 협력해 적절한 인수 테스트를 작성하고, 개발자와 협력해 테스트 전략을 협의하고 테스트 자동화 접근법을 결정한다. 그래서 테스터는 테스팅 지식을 다른 팀원과 공유하고 제품 개발에 영향을 준다.","why":["테스트 전략과 자동화 접근법은 개발자와 '협력해' 협의·결정한다(1.5.2).","정답. 1.5.2: 테스터는 비즈니스 담당자와 협력해 적절한 인수 테스트를 작성하고, 개발자와 협력해 테스트 전략을 협의하고 테스트 자동화 접근법을 결정한다.","테스터는 비즈니스 담당자와 협력해 인수 테스트를 작성한다(1.5.2). 개발자와만 협력하는 것이 아니다.","1.5.2는 테스터가 테스팅 지식을 다른 팀원과 공유하게 된다고 한다."],"ref":"1.5.2"},{"id":"c1-047","ch":1,"lo":"FL-1.5.2","k":1,"q":"전체 팀 접근법의 유래와 적용 범위에 대한 설명으로 옳은 것은?","opts":["스크럼에서 시작된 프랙티스이며, 안전이 치명적인 경우처럼 높은 독립성이 필요할 때는 적절하지 않을 수 있다.","익스트림 프로그래밍에서 시작된 프랙티스이며, 안전이 치명적이어서 높은 독립성이 필요한 시스템에 더 적합하다.","익스트림 프로그래밍에서 시작된 프랙티스이며, 높은 테스트 독립성이 필요한 상황에서는 적절하지 않을 수 있다.","스크럼에서 시작된 프랙티스이며, 프로젝트 정황과 관계없이 어떤 프로젝트에도 똑같이 적합하다."],"ans":[2],"exp":"1.5.2: 전체 팀 접근법은 익스트림 프로그래밍에서 시작됐다. 정황에 따라 적절하지 않을 수도 있으며, 예를 들어 안전이 치명적인 경우에는 높은 수준의 테스트 독립성이 필요할 수 있다.","why":["적용 범위 설명은 맞지만, 실라버스는 전체 팀 접근법이 스크럼이 아니라 익스트림 프로그래밍에서 시작됐다고 한다(1.5.2).","유래는 맞지만, 안전이 치명적인 경우에는 높은 수준의 테스트 독립성이 필요할 수 있어 전체 팀 접근법이 적절하지 않을 수 있다(1.5.2).","정답. 1.5.2의 설명과 일치한다.","유래가 틀렸고(익스트림 프로그래밍), 정황에 따라 적절하지 않을 수도 있다(1.5.2)."],"ref":"1.5.2"},{"id":"c1-048","ch":1,"lo":"FL-1.5.3","k":2,"q":"한 회사가 개발한 모바일 앱을 다음 네 주체가 각각 테스트한다고 하자. 실라버스의 분류에 따를 때 '높은 독립성'에 해당하는 것은?","opts":["앱 코드를 직접 작성한 개발자 본인","같은 개발팀에서 일하는 동료 개발자","같은 회사의 별도 테스트 부서 테스터","회사 외부 전문 테스트 업체의 테스터"],"ans":[2],"exp":"1.5.3: 저자 본인(독립성 없음), 같은 팀 동료(일정 수준의 독립성), 저자의 팀 외부에 있지만 조직 내에 있는 테스터(높은 독립성), 조직 외부의 테스터(매우 높은 독립성).","why":["저자가 직접 테스트하면 독립성이 없다(1.5.3).","같은 팀 동료는 일정 수준의 독립성이다(1.5.3).","정답. 저자의 팀(개발팀) 외부이면서 조직 내부의 테스터이므로 높은 독립성이다(1.5.3).","조직 외부의 테스터는 매우 높은 독립성이다(1.5.3)."],"ref":"1.5.3"},{"id":"c1-049","ch":1,"lo":"FL-1.5.3","k":2,"q":"독립적 테스팅의 장점 두 개를 고르시오.","opts":["독립적인 테스터는 배경, 기술적 관점, 편향이 개발자와 달라 개발자와 다른 유형의 장애와 결함을 식별할 가능성이 높다.","독립적인 테스터가 품질을 맡으므로 개발자의 품질 책임감이 높아진다.","독립적인 테스터는 개발팀과 분리되어 있어 개발팀과의 협업과 의사소통이 더 쉬워진다.","독립적인 테스터는 시스템 명세와 구현 과정에서 이해관계자가 한 가정을 검증하고, 이의를 제기하거나 반증할 수 있다.","독립적인 테스터가 참여하면 출시 지연의 원인으로 지목될 일이 없어진다."],"ans":[0,3],"exp":"1.5.3: 독립적인 테스팅의 주요 이점은 배경, 기술적 관점, 편향이 달라 개발자와 다른 유형의 장애와 결함을 식별할 가능성이 높다는 점이다. 또 독립적인 테스터는 이해관계자가 한 가정을 검증하고 이의를 제기하거나 반증할 수 있다.","why":["정답. 1.5.3에 제시된 장점이다.","반대다. 독립적 테스팅의 단점으로 개발자가 품질에 대한 책임감을 잃을 수 있다는 점이 있다(1.5.3).","반대다. 독립적인 테스터는 개발팀과 차단되어 협업과 의사소통이 어려울 수 있다(1.5.3).","정답. 1.5.3에 제시된 장점이다.","반대다. 독립적인 테스터가 출시 지연의 원인으로 비난받을 수 있다는 점이 단점이다(1.5.3)."],"ref":"1.5.3"},{"id":"c1-050","ch":1,"lo":"FL-1.5.3","k":2,"q":"외부 업체에 시스템 테스팅을 맡긴 뒤, 개발자들이 '어차피 테스트 업체가 찾아줄 것'이라며 자체 컴포넌트 테스팅을 소홀히 하기 시작했다. 이 현상에 해당하는 독립적 테스팅의 단점은?","opts":["독립적인 테스터가 병목으로 인식될 수 있다.","개발자가 품질에 대한 책임감을 잃을 수 있다.","독립적인 테스터는 개발자와 다른 유형의 결함을 식별할 가능성이 높다.","개발팀과 적대적인 관계로 이어질 수 있다."],"ans":[1],"exp":"1.5.3: 독립적 테스팅의 단점 중 하나로 '개발자가 품질에 대한 책임감을 잃을 수도 있다'가 있다. 사례에서 개발자들이 자체 테스팅을 소홀히 한 것이 이에 해당한다.","why":["병목 인식도 단점이지만, 사례는 테스터에 대한 인식이 아니라 개발자의 태도 변화에 관한 것이다.","정답. 1.5.3에 제시된 단점이며 사례와 일치한다.","이것은 독립적 테스팅의 장점이다(1.5.3).","적대적 관계도 단점이지만, 사례에는 갈등이나 대립이 나타나지 않는다."],"ref":"1.5.3"},{"id":"c1-051","ch":1,"lo":"FL-1.5.3","k":2,"q":"테스팅의 독립성에 대한 설명으로 옳은 것은?","opts":["독립성은 높을수록 좋으므로, 모든 테스트 레벨을 조직 외부 테스터에게 맡기는 것이 가장 좋다.","개발자는 자신이 작성한 코드의 결함을 찾지 못하므로 컴포넌트 테스팅도 독립적인 테스터가 수행해야 한다.","독립성이 친숙함을 대체하는 것은 아니며, 대부분의 프로젝트는 여러 수준의 독립성으로 테스팅을 수행하는 것이 가장 좋다.","저자와 테스터의 인지 편향(cognitive bias)이 같을수록 테스터가 결함을 더 효과적으로 식별한다."],"ans":[2],"exp":"1.5.3: 독립성이 친숙함을 대체하는 것은 아니다(예: 개발자는 자신이 작성한 코드에서 많은 결함을 효율적으로 찾아낼 수 있다). 대부분의 프로젝트는 여러 수준의 독립성으로 테스팅을 수행하는 것이 가장 좋다(예: 개발자가 컴포넌트·컴포넌트 통합 테스팅, 테스트팀이 시스템·시스템 통합 테스팅, 비즈니스 담당자가 인수 테스팅).","why":["1.5.3은 여러 수준의 독립성으로 테스팅하는 것이 대부분의 프로젝트에 가장 좋다고 한다.","개발자는 자신이 작성한 코드에서 많은 결함을 효율적으로 찾아낼 수 있으며, 1.5.3의 예에서도 컴포넌트 테스팅은 개발자가 수행한다.","정답. 1.5.3의 설명과 일치한다.","저자와 테스터의 인지 편향 '차이' 때문에 테스터가 결함을 더 효과적으로 식별한다(1.5.3)."],"ref":"1.5.3"},{"id":"c2-001","ch":2,"lo":"FL-2.1.2","k":1,"q":"선택한 소프트웨어 개발수명주기(SDLC) 모델에 상관없이 적용되는 좋은 테스팅 프랙티스(good testing practices)로 실라버스 2.1.2절에 제시된 것은? (두 개를 고르시오)","opts":["증분을 자주 전달하므로 반복 주기마다 광범위한 리그레션 테스팅(regression testing)을 수행한다.","테스트 레벨(test level)마다 구체적이면서 독립적인 테스트 목적을 설정한다.","한 테스트 레벨의 완료 조건이 다음 테스트 레벨의 시작 조건에 포함되도록 테스트 레벨을 정의한다.","수동 테스팅은 사전 테스트 분석과 설계가 많이 필요하지 않은 경험 기반 테스트 기법으로 진행한다.","테스터가 작업 산출물의 문서 초안이 가용한 즉시 작업 산출물 리뷰에 참여한다."],"ans":[1,4],"exp":"2.1.2는 SDLC 모델과 상관없는 좋은 테스팅 프랙티스 네 가지를 든다. ① 모든 개발 활동에 상응하는 테스트 활동을 둔다 ② 테스트 레벨마다 구체적이면서 독립적인 테스트 목적을 설정한다 ③ 테스트 분석과 설계를 상응하는 개발 단계에서 시작한다 ④ 문서 초안이 가용한 즉시 테스터가 리뷰에 참여한다. 나머지 보기는 특정 SDLC 모델(반복적·점진적, 순차적, 애자일)에서 나타나는 특징이다.","why":["2.1.1에서 일부 반복적·점진적 개발 모델의 특징으로 설명한 내용이고, 2.1.2의 공통 프랙티스 목록에는 없다.","2.1.2의 두 번째 좋은 테스팅 프랙티스다.","2.2에서 순차적 SDLC 모델이 테스트 레벨을 정의하는 흔한 방식으로 설명한 내용이며, 일부 반복적 모델은 이와 다르다고 했다.","2.1.1에서 애자일 프로젝트의 경향으로 설명한 내용이고, 모든 SDLC 공통 프랙티스로 제시되지 않았다.","2.1.2의 네 번째 좋은 테스팅 프랙티스다."],"ref":"2.1.2"},{"id":"c2-002","ch":2,"lo":"FL-2.1.2","k":1,"q":"어떤 조직은 컴포넌트 테스팅, 시스템 테스팅, 인수 테스팅에 각각 구체적이면서 독립적인 테스트 목적(test objective)을 정해 둔다.\n실라버스 2.1.2에 따르면 이 좋은 테스팅 프랙티스로 얻으려는 효과는?","opts":["모든 테스트 레벨에서 같은 테스트 케이스를 재사용해 테스트 설계 공수를 줄인다.","한 테스트 레벨의 테스트가 끝나야 다음 레벨을 시작할 수 있도록 일정을 통제한다.","중복은 피하면서도 적절하면서 포괄적인 테스팅이 가능해진다.","테스트 레벨 수를 줄여 전체 테스트 기간을 단축한다."],"ans":[2],"exp":"2.1.2: 테스트 레벨마다 구체적이면서 독립적인 테스트 목적을 설정해, 중복은 피하고 적절하면서 포괄적인 테스팅이 가능하게 한다. 레벨마다 맡은 목적이 다르면 같은 것을 두 번 테스트하지 않으면서도 빠진 곳 없이 테스트할 수 있다.","why":["레벨마다 다른 목적을 두라는 프랙티스이며, 같은 테스트 케이스 재사용은 실라버스가 든 효과가 아니다.","레벨 간 완료·시작 조건 연결은 2.2에서 순차적 모델의 특징으로 설명한 것이고, 이 프랙티스의 효과가 아니다.","2.1.2에 적힌 효과 그대로다.","테스트 레벨 수를 줄인다는 내용은 실라버스에 없다."],"ref":"2.1.2"},{"id":"c2-003","ch":2,"lo":"FL-2.1.2","k":1,"q":"비즈니스 분석가가 요구사항 명세의 초안을 막 작성했다. 테스트 매니저는 문서가 최종 승인될 때까지 기다리지 않고, 초안이 나온 지금 바로 테스터를 리뷰(review)에 참여시키기로 했다.\n실라버스 2.1.2에 따르면 이 좋은 테스팅 프랙티스가 지원하는 것은?","opts":["조기 테스팅과 결함 발견으로 시프트 레프트(shift left)를 지원한다.","테스트 레벨 간 중복은 피하면서 적절하고 포괄적인 테스팅을 가능하게 한다.","배포 파이프라인을 통한 자동화로 반복적인 수동 테스팅을 줄인다.","SDLC 후반의 테스트 레벨을 생략해 전체 테스트 공수를 줄일 수 있게 한다."],"ans":[0],"exp":"2.1.2의 네 번째 프랙티스: 테스터가 작업 산출물의 문서 초안이 가용한 즉시 리뷰에 참여하도록 해서, 이 조기 테스팅과 결함 발견이 시프트 레프트 전략을 지원하게 한다(2.1.5 참조).","why":["2.1.2: 테스터가 문서 초안이 가용한 즉시 리뷰에 참여하면 이 조기 테스팅과 결함 발견이 시프트 레프트 전략을 지원한다.","중복은 피하면서 적절하고 포괄적인 테스팅을 가능하게 하는 것은 테스트 레벨마다 구체적이면서 독립적인 테스트 목적을 두는 프랙티스의 효과다.","2.1.4에서 데브옵스의 이점으로 든 내용이다.","2.1.5에 따르면 시프트 레프트는 SDLC 후반의 테스트를 무시해도 된다는 뜻이 아니며, 2.1.2에도 후반 테스트 레벨을 생략한다는 내용은 없다."],"ref":"2.1.2"},{"id":"c2-004","ch":2,"lo":"FL-2.1.2","k":1,"q":"좋은 테스팅 프랙티스와, 실라버스 2.1.2가 설명한 그 프랙티스의 효과를 바르게 연결한 것은?","opts":["모든 개발 활동에 상응하는 테스트 활동을 둔다 → 테스트 레벨 간 중복을 피한다","테스트 레벨마다 구체적이면서 독립적인 테스트 목적을 설정한다 → 모든 개발 활동이 품질 제어의 대상이 된다","테스터가 작업 산출물 초안이 가용한 즉시 리뷰에 참여한다 → 테스트 자동화 범위가 넓어진다","특정 테스트 레벨의 테스트 분석과 설계를 상응하는 개발 단계에서 시작한다 → 조기 테스팅 원리를 준수할 수 있다"],"ans":[3],"exp":"2.1.2의 프랙티스와 효과는 이렇게 짝지어진다. ① 상응하는 테스트 활동 → 모든 개발 활동이 품질 제어의 대상 ② 레벨별 구체적·독립적 목적 → 중복 회피, 적절하면서 포괄적인 테스팅 ③ 상응하는 개발 단계에서 테스트 분석과 설계 시작 → 조기 테스팅 원리(1.3) 준수 ④ 초안 즉시 리뷰 참여 → 시프트 레프트 지원.","why":["상응하는 테스트 활동을 두는 목적은 모든 개발 활동이 품질 제어의 대상이 되게 하는 것이고, 중복 회피는 레벨별 목적 설정의 효과다.","두 프랙티스의 효과가 서로 바뀌었다. 레벨별 목적 설정은 중복 회피와 포괄적 테스팅을 위한 것이다.","초안 리뷰 참여는 조기 테스팅과 결함 발견으로 시프트 레프트를 지원하는 것이며, 자동화 범위와는 관련이 없다.","2.1.2에 적힌 연결 그대로다."],"ref":"2.1.2"},{"id":"c2-005","ch":2,"lo":"FL-2.1.2","k":1,"q":"어떤 프로젝트는 코딩 활동에 대해서만 테스트 활동을 계획했다. 요구사항 정의, 아키텍처 설계 같은 다른 개발 활동에는 상응하는 테스트 활동이 없다.\n실라버스 2.1.2에 따르면 이 프로젝트에 적용해야 할 좋은 테스팅 프랙티스는?","opts":["테스트 활동은 실행 가능한 코드가 생겨 동적 테스팅을 할 수 있는 코딩 단계부터 시작한다.","모든 개발 활동에 상응하는 테스트 활동을 두어, 개발 활동이 품질 제어 대상이 되게 한다.","요구사항과 설계 문서는 최종 승인된 뒤에만 테스터가 리뷰에 참여하도록 일정을 잡는다.","테스트 레벨을 하나로 합쳐 모든 테스트 목적을 한 번에 다룸으로써 테스트 레벨 간 중복을 피한다."],"ans":[1],"exp":"2.1.2의 첫 번째 프랙티스: 모든 소프트웨어 개발 활동에 상응하는 테스트 활동을 두어, 모든 개발 활동이 품질 제어의 대상이 되게 한다. 이 프로젝트는 코딩 외 개발 활동이 품질 제어에서 빠져 있다.","why":["코딩 단계부터 테스트를 시작하면 요구사항 정의, 설계 같은 다른 개발 활동이 품질 제어에서 빠지므로 2.1.2와 반대다.","2.1.2의 첫 번째 좋은 테스팅 프랙티스와 같은 내용이다.","2.1.2는 테스터가 문서 초안이 가용한 즉시 리뷰에 참여하라고 한다.","2.1.2는 테스트 레벨마다 구체적이면서 독립적인 테스트 목적을 두어 중복을 피하라고 하며, 레벨을 합치라는 내용은 없다."],"ref":"2.1.2"},{"id":"c2-006","ch":2,"lo":"FL-2.1.3","k":1,"q":"개발자 민수는 할인 금액 계산 기능을 만들 때 먼저 테스트를 작성한다. 그다음 이 테스트를 충족하도록 코드를 작성하고, 마지막으로 테스트와 코드를 함께 리팩토링(refactoring)한다. 광범위한 소프트웨어 설계 대신 테스트 케이스가 코딩의 방향을 이끈다.\n민수가 사용한 접근법은?","opts":["행위 주도 개발(BDD)","인수 테스트 주도 개발(ATDD)","테스트 주도 개발(TDD)","기능 주도 개발(FDD)"],"ans":[2],"exp":"2.1.3: 테스트 주도 개발(TDD)은 (광범위한 소프트웨어 설계 대신) 테스트 케이스를 통해 코딩을 주도한다. 테스트를 먼저 작성하고, 이를 충족하도록 코드를 작성한 다음, 테스트와 코드를 리팩토링한다.","why":["BDD는 기대 동작을 이해관계자가 이해하기 쉬운 자연어(보통 Given/When/Then)로 표현하는 것이 특징이다.","ATDD는 시스템 설계 프로세스 중 인수 조건에서 테스트를 도출하는 것이 특징이다.","2.1.3이 TDD의 특징으로 설명한 순서와 내용 그대로다.","FDD는 2.1에서 개발 방법의 예로 이름만 나오며, 2.1.3의 테스트 우선 접근법(TDD, ATDD, BDD)에 들지 않는다."],"ref":"2.1.3"},{"id":"c2-007","ch":2,"lo":"FL-2.1.3","k":1,"q":"제품 소유자, 개발자, 테스터가 함께 회원 가입 기능의 기대 동작을 다음과 같이 적었다.\n「Given 이미 가입된 이메일이 있을 때, When 같은 이메일로 가입을 요청하면, Then 중복 가입 안내 메시지를 보여 준다」\n이해관계자도 쉽게 읽을 수 있는 이 문장들은 이후 자동으로 실행 가능한 테스트로 변환된다. 이 접근법은?","opts":["행위 주도 개발(BDD)","테스트 주도 개발(TDD)","칸반(Kanban)","도메인 주도 설계(DDD)"],"ans":[0],"exp":"2.1.3: 행위 주도 개발(BDD)은 애플리케이션의 기대 동작을 이해관계자가 이해하기 쉬운 간단한 자연어 테스트 케이스로 표현하며, 일반적으로 Given/When/Then 형태를 쓴다. 이후 테스트 케이스는 자동으로 실행 가능한 테스트로 변환된다.","why":["2.1.3이 BDD의 특징으로 설명한 내용 그대로다.","TDD는 테스트 먼저 → 코드 작성 → 테스트와 코드 리팩토링이 특징이며, 이해관계자용 자연어 표현은 TDD의 특징으로 제시되지 않았다.","칸반은 2.1에서 애자일 프랙티스의 예로 이름만 나오며, 테스트 우선 접근법이 아니다.","DDD는 2.1에서 개발 방법의 예로 이름만 나오며, 테스트 우선 접근법이 아니다."],"ref":"2.1.3"},{"id":"c2-008","ch":2,"lo":"FL-2.1.3","k":1,"q":"팀이 시스템 설계 프로세스 중에 인수 조건(acceptance criteria)에서 테스트를 도출한다. 그리고 그 테스트를 만족해야 할 애플리케이션 영역을 개발하기 전에 테스트를 작성한다.\n실라버스 2.1.3에서 이 특징으로 설명하는 접근법은?","opts":["테스트 주도 개발(TDD)","행위 주도 개발(BDD)","도메인 주도 설계(DDD)","인수 테스트 주도 개발(ATDD)"],"ans":[3],"exp":"2.1.3: 인수 테스트 주도 개발(ATDD)은 시스템 설계 프로세스 중 인수 조건에서 테스트를 도출하며, 테스트는 해당 테스트를 만족해야 할 애플리케이션 영역을 개발하기 전에 작성한다.","why":["TDD의 특징은 테스트 케이스로 코딩을 주도하고 테스트와 코드를 리팩토링하는 것이며, 인수 조건에서의 도출이 아니다.","BDD의 특징은 이해관계자가 이해하기 쉬운 자연어(Given/When/Then) 테스트 케이스와 실행 가능한 테스트로의 자동 변환이다.","도메인 주도 설계는 2.1에서 소프트웨어 개발 방법과 애자일 프랙티스의 예로 이름만 나오며, 2.1.3이 설명하는 테스트 우선 접근법이 아니다.","2.1.3이 ATDD의 특징으로 설명한 내용 그대로다."],"ref":"2.1.3"},{"id":"c2-009","ch":2,"lo":"FL-2.1.3","k":1,"q":"테스트 주도 개발(TDD), 인수 테스트 주도 개발(ATDD), 행위 주도 개발(BDD)의 공통점으로 옳은 것은?","opts":["폭포수 모델이나 V-모델 같은 순차적 개발 모델을 지원하기 위한 접근법이다.","완성된 코드가 명세대로 동작하는지 검증하기 위해 코드 작성 후에 테스트를 정의한다.","코드 작성 전에 테스트를 정의하므로 시프트 레프트(shift left)를 따른다.","테스트는 개발 방향과 무관하며, 릴리스 직전 품질 확인 용도로만 사용한다."],"ans":[2],"exp":"2.1.3: TDD, ATDD, BDD는 개발 방향 결정을 위한 수단으로 테스트를 정의하는 유사한 접근법이다. 코드 작성 전에 테스트를 정의하므로 조기 테스팅 원리(1.3)와 시프트 레프트 접근법(2.1.5)을 따르며, 반복적 개발 모델을 지원한다.","why":["2.1.3은 이 접근법들이 반복적 개발 모델을 지원한다고 한다. 폭포수 모델과 V-모델은 2.1에서 순차적 개발 모델의 예로 나온다.","세 접근법 모두 코드 작성 전에 테스트를 정의한다.","2.1.3: 코드 작성 전에 테스트를 정의하므로 조기 테스팅 원리와 시프트 레프트 접근법을 따른다.","세 접근법은 테스트를 개발 방향 결정을 위한 수단으로 정의한다."],"ref":"2.1.3"},{"id":"c2-010","ch":2,"lo":"FL-2.1.3","k":1,"q":"한 팀이 테스트 주도 개발(TDD)로 기능을 개발하면서 많은 테스트를 작성했다. 기능 개발이 끝난 뒤 이 테스트들을 어떻게 다룰 수 있는지에 대해 실라버스 2.1.3과 일치하는 것은?","opts":["향후 구현·리팩토링 때 코드 품질 보장을 위해 자동화 테스트로 유지할 수 있다.","개발 방향을 정하는 역할이 끝났으므로 기능 개발이 끝나면 폐기해야 한다.","인수 테스트로 바꿔서 인수 테스팅 레벨에서만 재사용할 수 있다.","리팩토링할 때마다 기존 테스트를 버리고 새로 작성해야 하므로 유지할 필요가 없다."],"ans":[0],"exp":"2.1.3: TDD, ATDD, BDD 모두에서 테스트는 향후 구현/리팩토링 시 코드 품질 보장을 위해 자동화 테스트로 유지할 수 있다.","why":["2.1.3의 마지막 문장(향후 구현/리팩토링 시 코드 품질 보장을 위해 자동화 테스트로 유지할 수 있다)과 같다.","실라버스는 테스트를 자동화 테스트로 유지할 수 있다고 하며, 폐기하라는 내용은 없다.","2.1.3은 테스트를 향후 구현/리팩토링 시 코드 품질 보장용 자동화 테스트로 유지할 수 있다고 하며, 인수 테스팅 레벨로 바꾸거나 제한한다는 내용은 없다.","실라버스는 테스트를 유지해 리팩토링 시 코드 품질 보장에 쓸 수 있다고 한다."],"ref":"2.1.3"},{"id":"c2-011","ch":2,"lo":"FL-2.2.1","k":2,"q":"온라인 서점 애플리케이션 개발팀이 상향식(bottom-up) 통합 전략으로 컴포넌트를 하나씩 결합하고 있다. 지금은 같은 애플리케이션 안의 「장바구니」 컴포넌트와 「주문」 컴포넌트 사이의 인터페이스와 상호 작용을 테스트한다.\n이 활동에 해당하는 테스트 레벨(test level)은?","opts":["컴포넌트 테스팅(component testing)","시스템 통합 테스팅(system integration testing)","시스템 테스팅(system testing)","컴포넌트 통합 테스팅(component integration testing)"],"ans":[3],"exp":"2.2.1: 컴포넌트 통합 테스팅은 컴포넌트 간의 인터페이스와 상호 작용을 테스트하는 데 중점을 두며, 상향식·하향식·빅뱅 등 통합 전략에 따라 크게 달라진다. 같은 애플리케이션 안의 두 컴포넌트를 결합해 테스트하므로 이 레벨이다.","why":["컴포넌트 테스팅은 컴포넌트를 개별적으로 테스트하는 데 중점을 둔다.","시스템 통합 테스팅은 테스트 대상 시스템과 다른 시스템 또는 외부 서비스 간의 인터페이스에 중점을 둔다.","시스템 테스팅은 전체 시스템 또는 제품의 전반적인 동작과 기능에 중점을 둔다.","컴포넌트 간 인터페이스와 상호 작용, 통합 전략 의존이라는 2.2.1의 설명과 일치한다."],"ref":"2.2.1"},{"id":"c2-012","ch":2,"lo":"FL-2.2.1","k":2,"q":"호텔 예약 시스템은 외부 결제 대행 서비스, 그리고 회사의 회계 시스템과 데이터를 주고받는다. 테스트팀은 운영 환경과 유사하게 구성한 테스트 환경에서 예약 시스템과 이 두 대상 사이의 인터페이스를 테스트하려 한다.\n이 테스트 레벨은?","opts":["인수 테스팅(acceptance testing)","시스템 통합 테스팅(system integration testing)","컴포넌트 통합 테스팅(component integration testing)","컴포넌트 테스팅(component testing)"],"ans":[1],"exp":"2.2.1: 시스템 통합 테스팅은 다른 시스템 또는 외부 서비스와 테스트 대상 시스템의 인터페이스를 테스트하는 데 중점을 두며, 가급적 운영 환경과 유사한 적절한 테스트 환경을 사용한다.","why":["인수 테스팅은 밸리데이션과 배포 준비, 즉 사용자의 비즈니스 필요 충족 확인에 중점을 둔다.","다른 시스템·외부 서비스와의 인터페이스, 운영 환경과 유사한 테스트 환경이라는 2.2.1의 설명과 일치한다.","컴포넌트 통합 테스팅은 한 시스템 안의 컴포넌트 간 인터페이스와 상호 작용에 중점을 둔다.","컴포넌트 테스팅은 컴포넌트를 개별적으로 테스트한다."],"ref":"2.2.1"},{"id":"c2-013","ch":2,"lo":"FL-2.2.1","k":2,"q":"독립된 테스트팀이 모바일 뱅킹 시스템을 실제 환경을 대변하는 테스트 환경에 설치했다. 팀은 시스템 명세를 바탕으로 계좌 조회부터 이체 완료까지의 엔드투엔드(end-to-end) 기능과, 사용성 같은 비기능 품질 특성을 함께 테스트한다. 일부 서브-시스템은 시뮬레이션으로 대신한다.\n이 테스트 레벨은?","opts":["시스템 테스팅(system testing)","시스템 통합 테스팅(system integration testing)","인수 테스팅(acceptance testing)","컴포넌트 통합 테스팅(component integration testing)"],"ans":[0],"exp":"2.2.1: 시스템 테스팅은 전체 시스템의 전반적인 동작과 기능에 중점을 두며, 엔드투엔드 기능 테스팅과 품질 특성에 대한 비기능 테스팅을 포함하는 경우가 많다. 사용성처럼 실제 환경을 대변하는 테스트 환경에서 완성된 시스템으로 테스트하는 것이 좋은 특성도 있고, 서브-시스템 시뮬레이션을 쓸 수 있다. 독립된 테스트팀이 수행할 수 있으며 시스템 명세와 관련이 있다.","why":["독립된 테스트팀, 시스템 명세, 엔드투엔드 기능과 비기능 테스팅이라는 2.2.1의 시스템 테스팅 설명과 일치한다.","시스템 통합 테스팅은 다른 시스템이나 외부 서비스와의 인터페이스에 중점을 둔다.","인수 테스팅은 사용자의 비즈니스 필요 충족과 배포 준비 확인에 중점을 두고, 실제 사용자가 수행하는 것이 이상적이다.","컴포넌트 통합 테스팅은 컴포넌트 간의 인터페이스와 상호 작용에 중점을 둔다."],"ref":"2.2.1"},{"id":"c2-014","ch":2,"lo":"FL-2.2.1","k":2,"q":"병원이 새 진료 예약 시스템을 도입하기 전에, 실제로 이 시스템을 쓸 접수 창구 직원들이 평소 업무 흐름대로 시스템을 사용해 본다. 목적은 시스템이 병원 업무에 필요한 사항을 충족하는지, 그리고 배포할 준비가 되었는지 확인하는 것이다.\n이 테스트 레벨과 그 특징을 바르게 설명한 것은?","opts":["시스템 테스팅(system testing)이다. 독립된 테스트팀이 시스템 명세와 비교해 수행하는 레벨이기 때문이다.","시스템 통합 테스팅(system integration testing)이다. 병원의 다른 시스템과의 인터페이스를 확인하기 때문이다.","인수 테스팅(acceptance testing)이다. 밸리데이션과 배포할 준비 확인에 중점을 두며, 실제 사용자가 수행하는 것이 이상적이다.","컴포넌트 테스팅(component testing)이다. 사용자가 화면을 하나씩 개별적으로 확인하기 때문이다."],"ans":[2],"exp":"2.2.1: 인수 테스팅은 밸리데이션과 배포할 준비, 즉 시스템이 사용자의 비즈니스에 필요한 사항을 충족하는지 확인하는 데 중점을 둔다. 실제 사용자가 수행하는 것이 이상적이다.","why":["시나리오는 시스템 명세가 아니라 사용자의 업무 필요 충족과 배포 준비를 확인하고 있다.","다른 시스템과의 인터페이스를 테스트한다는 내용이 시나리오에 없다.","2.2.1의 인수 테스팅 설명과 일치한다.","컴포넌트 테스팅은 컴포넌트를 개별적으로 테스트하는 레벨로, 보통 개발자가 개발 환경에서 수행한다."],"ref":"2.2.1"},{"id":"c2-015","ch":2,"lo":"FL-2.2.1","k":2,"q":"테스트 레벨(test level)에 대한 설명으로 옳은 것은? (두 개를 고르시오)","opts":["컴포넌트 통합 테스팅은 상향식, 하향식, 빅뱅 중 어떤 통합 전략을 쓰든 같은 방식으로 진행된다.","컴포넌트 테스팅은 테스트 하네스(test harness)나 단위 테스트 프레임워크 같은 구체적인 지원 수단이 필요한 경우가 많다.","인수 테스팅은 개발자가 자신의 개발 환경에서 수행하는 것이 이상적이다.","테스트 레벨은 테스트 활동의 중복을 피하기 위해 테스트 대상, 테스트 목적, 테스트 베이시스 같은 속성으로 구분한다.","반복적 모델에서도 테스트 레벨은 시간상 겹치지 않도록 항상 순서대로 진행한다."],"ans":[1,3],"exp":"2.2.1: 컴포넌트 테스팅은 테스트 하네스나 단위 테스트 프레임워크 같은 지원 수단이 필요한 경우가 많다. 테스트 레벨은 중복을 피하기 위해 테스트 대상, 테스트 목적, 테스트 베이시스, 결함과 장애, 접근법과 역할 같은 속성으로 구분한다.","why":["2.2.1은 컴포넌트 통합 테스팅이 통합 전략에 따라 크게 달라진다고 한다.","2.2.1의 컴포넌트 테스팅 설명 그대로다.","인수 테스팅은 실제 사용자가 수행하는 것이 이상적이며, 개발 환경에서 개발자가 수행하는 것은 컴포넌트 테스팅의 일반적인 모습이다.","2.2.1의 테스트 레벨 구분 속성 설명과 일치한다.","2.2는 테스트 레벨이 시간상 서로 겹칠 수 있다고 한다."],"ref":"2.2.1"},{"id":"c2-016","ch":2,"lo":"FL-2.2.2","k":2,"q":"테스터가 여러 테스트의 목적을 정리하고 있다. 각 테스트가 확인하려는 품질 특성이 다음과 같을 때, 비기능 테스팅(non-functional testing)에 해당하는 것은?","opts":["기능 정확성(functional correctness)","호환성(compatibility)","기능 타당성(적합성)(functional appropriateness)","기능 성숙도(완전성)(functional completeness)"],"ans":[1],"exp":"2.2.2: 기능 테스팅의 주요 목적은 기능 성숙도(완전성), 기능 정확성, 기능 타당성(적합성)을 확인하는 것이다. 비기능 테스팅의 주요 목적은 비기능 품질 특성을 확인하는 것이고, ISO/IEC 25010은 이를 수행 효율성, 호환성, 유용성, 신뢰도, 보안, 유지 가능성(유지 관리성), 이동성, 안전성으로 분류한다.","why":["기능 정확성은 기능 테스팅의 주요 목적이다.","호환성은 ISO/IEC 25010의 비기능 품질 특성 목록에 있다.","기능 타당성(적합성)은 기능 테스팅의 주요 목적이다.","기능 성숙도(완전성)는 기능 테스팅의 주요 목적이다."],"ref":"2.2.2"},{"id":"c2-017","ch":2,"lo":"FL-2.2.2","k":2,"q":"테스터가 결제 모듈의 소스 코드와 데이터 플로우를 분석해 테스트를 도출하고, 테스트가 코드 구조를 충분히 실행했는지 확인한다.\n이 테스트 유형(test type)과 그 주요 목적을 바르게 짝지은 것은?","opts":["블랙박스 테스팅 — 명세와 비교해 시스템의 동작을 확인한다","화이트박스 테스팅 — 테스트를 통해 내부 구조를 인수에 필요한 수준까지 충분히 커버한다","기능 테스팅 — 기능 성숙도(완전성), 기능 정확성, 기능 타당성(적합성)을 확인한다","화이트박스 테스팅 — 명세와 비교해 시스템의 동작을 확인한다"],"ans":[1],"exp":"2.2.2: 화이트박스 테스팅은 구조 기반이며, 시스템의 구현 또는 내부 구조(예: 코드, 아키텍처, 워크플로우, 데이터 플로우)에서 테스트를 도출한다. 주요 목적은 테스트를 통해 내부 구조를 인수에 필요한 수준까지 충분히 커버하는 것이다.","why":["블랙박스 테스팅은 내부 구조와 관련 없는 문서에서 테스트를 도출하므로 코드와 데이터 플로우를 분석하는 이 시나리오와 맞지 않는다.","2.2.2의 화이트박스 테스팅 설명과 목적 그대로다.","시나리오는 코드 구조에서 테스트를 도출하고 구조를 커버하는 것이 핵심이라 기능 테스팅의 목적과 맞지 않는다.","명세와 비교해 동작을 확인하는 것은 블랙박스 테스팅의 주요 목적이다."],"ref":"2.2.2"},{"id":"c2-018","ch":2,"lo":"FL-2.2.2","k":2,"q":"인터넷 뱅킹의 이체 기능에 대해 두 가지 테스트를 설계했다.\n테스트 A: 이체를 실행하면 출금 계좌와 입금 계좌의 잔액이 올바르게 바뀌는지 확인한다.\n테스트 B: 테스트 A와 같은 이체 절차를 그대로 사용하되, 이체가 정해진 시간 안에 처리되는지 확인한다.\n두 테스트를 기능 테스팅(functional testing)과 비기능 테스팅(non-functional testing) 관점에서 바르게 설명한 것은?","opts":["A는 기능 테스팅, B는 비기능 테스팅이다. B는 기능 수행 중 비기능 제약 조건 충족을 확인한다.","A와 B 모두 기능 테스팅이다. B도 A와 같은 이체 절차로 이체 기능을 실행하기 때문이다.","A는 비기능 테스팅, B는 기능 테스팅이다. A는 결과의 정확성을, B는 기능의 실행을 다루기 때문이다.","A와 B 모두 비기능 테스팅이다. 둘 다 시스템이 얼마나 잘 동작하는지 확인하기 때문이다."],"ans":[0],"exp":"2.2.2: 기능 테스팅은 테스트 대상이 무엇을 해야 하는지(기능)를 평가하고, 비기능 테스팅은 시스템이 얼마나 잘 동작하는지를 테스트한다. 많은 비기능 테스트는 기능 테스트에서 도출되며, 기능이 수행되는 동안 비기능 제약 조건(예: 특정 시간 내 수행)이 충족되는지 확인한다.","why":["2.2.2의 설명과 예(기능 테스트에서 도출해 특정 시간 내에 기능이 수행되는지 확인)와 일치한다.","B는 A와 같은 절차로 기능을 실행하지만, 확인하는 것은 시간 제약이라는 비기능 제약 조건이다.","잔액이 올바르게 바뀌는지는 기능(무엇을 하는가)에 대한 확인이므로 A는 기능 테스팅이다.","A는 기능이 올바르게 수행되는지를 확인하므로 비기능 테스팅이 아니다."],"ref":"2.2.2"},{"id":"c2-019","ch":2,"lo":"FL-2.2.2","k":2,"q":"실라버스 2.2.2가 다루는 네 가지 테스트 유형(test type), 즉 기능 테스팅(functional testing), 비기능 테스팅(non-functional testing), 블랙박스 테스팅(black-box testing), 화이트박스 테스팅(white-box testing)에 대한 설명으로 옳은 것은?","opts":["화이트박스 테스팅은 코드에서 테스트를 도출하므로 컴포넌트 테스팅 레벨에서만 적용할 수 있다.","블랙박스 테스팅은 코드, 아키텍처, 워크플로우 같은 내부 구조에서 테스트를 도출한다.","비기능 테스팅은 완성된 시스템이 필요하므로 리뷰나 컴포넌트 테스팅 중에는 시작할 수 없다.","이 네 가지 테스트 유형은 모두 모든 테스트 레벨에 사용할 수 있지만, 레벨마다 관심의 대상은 다를 수 있다."],"ans":[3],"exp":"2.2.2: 기능, 비기능, 블랙박스, 화이트박스의 네 가지 테스트 유형은 모든 테스트 레벨에 사용할 수 있지만 레벨마다 관심의 대상은 다를 수 있다.","why":["네 가지 테스트 유형 모두 모든 테스트 레벨에 사용할 수 있다.","내부 구조에서 테스트를 도출하는 것은 화이트박스 테스팅이고, 블랙박스 테스팅은 내부 구조와 관련 없는 문서에서 도출한다.","2.2.2는 비기능 테스팅을 SDLC 초기(예: 리뷰나 컴포넌트 테스팅 중)에 시작하는 것이 바람직할 때가 있다고 한다.","2.2.2에 적힌 내용 그대로다."],"ref":"2.2.2"},{"id":"c2-020","ch":2,"lo":"FL-2.2.3","k":2,"q":"결함 D-17(쿠폰 적용 시 결제 금액 오류)이 수정되었다. 테스터는 다음 두 작업을 했다.\n작업 1: D-17 결함 때문에 실패했던 테스트 케이스 4개를 다시 실행했다.\n작업 2: 이번 수정으로 포인트 적립, 환불 같은 다른 기능에 부정적인 영향이 생기지 않았는지 기존 테스트 스위트를 실행했다.\n두 작업을 바르게 구분한 것은?","opts":["작업 1은 리그레션 테스팅(regression testing), 작업 2는 확인 테스팅(confirmation testing)이다.","작업 1과 작업 2 모두 확인 테스팅이다.","작업 1은 확인 테스팅, 작업 2는 리그레션 테스팅이다.","작업 1과 작업 2 모두 리그레션 테스팅이다."],"ans":[2],"exp":"2.2.3: 확인 테스팅은 원래 결함이 성공적으로 수정됐는지 확인하며, 그 결함으로 인해 이전에 실패했던 모든 테스트 케이스를 실행하는 방법이 있다. 리그레션 테스팅은 변경으로 인해 부정적인 영향이 없었는지 확인한다.","why":["두 작업의 이름이 서로 바뀌었다.","작업 2는 수정된 결함이 아니라 변경의 부정적 영향을 확인하므로 리그레션 테스팅이다.","2.2.3의 두 정의와 일치한다.","작업 1은 원래 결함이 수정됐는지 확인하므로 확인 테스팅이다."],"ref":"2.2.3"},{"id":"c2-021","ch":2,"lo":"FL-2.2.3","k":2,"q":"릴리스를 앞두고 결함 수정에 쓸 수 있는 시간이나 비용이 부족한 상황에서 결함 하나를 수정했다.\n실라버스 2.2.3에 따르면 이때 확인 테스팅(confirmation testing)을 제한할 수 있는 수준은?","opts":["결함으로 생긴 장애를 재현하는 테스트 절차를 실행해 장애가 재발하지 않는지만 확인한다.","영향도 분석만 수행해 수정 범위를 파악하고, 테스트 실행은 다음 릴리스 때로 미룬다.","수정된 컴포넌트와 연결된 다른 시스템까지 포함해 리그레션 테스트 스위트 전체를 실행한다.","수정한 코드에 대한 코드 리뷰로 확인 테스팅을 대신하고, 테스트 케이스는 실행하지 않는다."],"ans":[0],"exp":"2.2.3: 결함을 수정하는 데 시간이나 비용이 부족한 경우, 확인 테스팅은 해당 결함으로 생긴 장애를 재현하기 위한 테스트 절차를 거쳐 장애가 다시 발생하지 않는지만 확인하는 수준으로 제한될 수 있다.","why":["2.2.3에 적힌 제한 수준(장애 재현 테스트 절차를 거쳐 장애가 다시 발생하지 않는지만 확인)과 같다.","실라버스는 테스트를 미루는 방식이 아니라 장애 재현 절차만 실행하는 수준으로 제한할 수 있다고 한다.","리그레션 테스트 스위트 전체 실행은 확인 테스팅을 제한하는 방법이 아니며, 목적도 리그레션 확인이다.","2.2.3이 말하는 제한 수준도 장애 재현 테스트 절차를 실행하는 것이며, 테스트 실행 없이 코드 리뷰로 대신한다는 내용은 없다."],"ref":"2.2.3"},{"id":"c2-022","ch":2,"lo":"FL-2.2.3","k":2,"q":"결제 컴포넌트의 결함을 수정했고, 확인 테스팅도 통과했다.\n이 상황의 리그레션 테스팅(regression testing)에 대한 설명으로 옳은 것은?","opts":["확인 테스팅을 통과한 수정 사항은 이미 검증되었으므로 리그레션 테스팅에서 고려하는 변경에 포함되지 않는다.","변경의 영향은 연결된 다른 시스템에도 미칠 수 있어, 먼저 영향도 분석으로 범위를 파악하는 것이 좋다.","부정적인 영향은 변경된 곳에서만 생기므로, 리그레션 테스팅은 결제 컴포넌트 자체로 한정한다.","리그레션 테스팅은 테스트 대상 자체만 다루므로, 환경과 관련된 부분은 리그레션 범위에서 뺀다."],"ans":[1],"exp":"2.2.3: 리그레션 테스팅은 변경으로 인해 부정적인 영향이 없었는지 확인하며, 이미 확인 테스팅이 끝난 수정 사항도 변경에 포함된다. 부정적인 영향은 변경된 컴포넌트 자체, 같은 시스템의 다른 컴포넌트, 연결된 다른 시스템에도 미칠 수 있다. 범위를 파악하기 위해 먼저 영향도 분석을 수행하는 것이 좋다.","why":["2.2.3은 이미 확인 테스팅이 끝난 수정 사항도 리그레션 테스팅에서 말하는 변경에 포함된다고 한다.","2.2.3: 부정적인 영향은 같은 시스템의 다른 컴포넌트나 연결된 다른 시스템에도 미칠 수 있으며, 리그레션 테스팅 범위를 파악하기 위해 먼저 영향도 분석을 수행하는 것이 좋다.","2.2.3은 부정적인 영향이 변경된 컴포넌트 자체뿐 아니라 같은 시스템의 다른 컴포넌트나 연결된 다른 시스템에도 미칠 수 있다고 한다.","2.2.3은 리그레션 테스팅이 테스트 대상 자체에만 국한되지 않고 환경과도 관련이 있을 수 있다고 한다."],"ref":"2.2.3"},{"id":"c2-023","ch":2,"lo":"FL-2.2.3","k":2,"q":"2주 단위로 릴리스하는 팀이 있다. 릴리스가 거듭될수록 리그레션 테스트 케이스가 계속 늘어나고 있다.\n이 팀의 리그레션 테스트 자동화에 대해 실라버스 2.2.3과 일치하는 것은?","opts":["리그레션 테스트 케이스 수가 더 늘지 않는 프로젝트 후반에 자동화를 시작하는 것이 좋다.","지속적 통합(CI)을 사용한다면 빌드 속도를 위해 자동 리그레션 테스트는 빼는 것이 좋다.","자동 리그레션 테스트는 레벨 간 중복을 피하기 위해 한 테스트 레벨의 테스트로만 구성해야 한다.","반복 실행되고 케이스가 늘어 자동화에 매우 적합하며, 자동화는 프로젝트 초기에 시작해야 한다."],"ans":[3],"exp":"2.2.3: 리그레션 테스트 스위트는 반복적으로 실행되며 반복 주기나 릴리스 때마다 케이스 수가 늘어나므로 자동화하기 매우 적합하다. 자동화는 프로젝트 초기에 시작해야 하고, 데브옵스처럼 지속적 통합을 사용하는 경우 자동 리그레션 테스트를 포함하는 것이 좋은 프랙티스다.","why":["2.2.3은 리그레션 테스트 자동화를 프로젝트 초기에 시작해야 한다고 한다.","2.2.3은 지속적 통합을 사용할 때 자동 리그레션 테스트를 포함하는 것이 좋은 프랙티스라고 한다.","2.2.3은 상황에 따라 여러 테스트 레벨의 리그레션 테스트가 포함될 수 있다고 한다.","2.2.3: 리그레션 테스트 스위트는 반복적으로 실행되고 케이스 수가 늘어나므로 자동화하기 매우 적합하며, 자동화는 프로젝트 초기에 시작해야 한다."],"ref":"2.2.3"},{"id":"c2-024","ch":2,"lo":"FL-2.3.1","k":2,"q":"한 보험사가 운영 중인 계약 관리 시스템을 기존 플랫폼에서 새로운 플랫폼으로 옮기면서, 지금은 다른 애플리케이션에 있는 고객 데이터도 이 시스템으로 이전하기로 했다.\n이 유지보수 테스팅(maintenance testing)의 계기와 필요할 수 있는 테스트를 바르게 설명한 것은?","opts":["단종에 의한 계기다. 데이터 보관(archiving) 테스팅과 보관 이후 복원 및 복구 절차 테스팅이 필요할 수 있다.","운영 환경의 마이그레이션에 의한 계기다. 새로운 환경 관련 테스트와 데이터 변환 테스트가 필요할 수 있다.","계획된 개선사항(릴리스 기반)에 의한 계기다. 새 기능에 대한 확인 테스팅만 필요하다.","플랫폼만 바뀌고 소프트웨어 코드는 그대로이므로 유지보수 테스팅의 계기에 해당하지 않는다."],"ans":[1],"exp":"2.3: 운영 환경의 업그레이드나 마이그레이션(예: 한 플랫폼에서 다른 플랫폼으로)은 유지보수와 유지보수 테스팅의 계기다. 변경된 소프트웨어뿐 아니라 새로운 환경 관련 테스트가 필요할 수 있고, 다른 애플리케이션의 데이터를 유지보수 중인 시스템으로 마이그레이션할 때는 데이터 변환 테스트가 필요할 수 있다.","why":["데이터 보관 테스팅과 복원·복구 절차 테스팅은 시스템 단종 계기에 해당한다.","2.3의 마이그레이션 계기 설명과 일치한다(새로운 환경 관련 테스트, 다른 애플리케이션 데이터를 옮길 때의 데이터 변환 테스트).","시나리오는 기능 개선이 아니라 플랫폼 이전과 데이터 이전이며, 2.3은 이를 운영 환경의 마이그레이션 계기로 분류한다.","2.3은 운영 환경의 업그레이드나 마이그레이션(예: 한 플랫폼에서 다른 플랫폼으로)을 유지보수와 유지보수 테스팅의 계기로 분류한다."],"ref":"2.3"},{"id":"c2-025","ch":2,"lo":"FL-2.3.1","k":2,"q":"도서관 대출 관리 시스템이 수명을 다해 단종될 예정이다. 대출 기록은 오랜 기간 보존해야 하고, 보존 기간 중에 특정 기록을 다시 꺼내 봐야 할 수도 있다.\n실라버스 2.3이 이런 단종 계기에 필요할 수 있다고 제시한 테스팅은? (두 개를 고르시오)","opts":["데이터 보관(archiving) 테스팅","다른 애플리케이션의 데이터를 이 시스템으로 옮기는 데이터 변환 테스트","보관 이후 복원 및 복구 절차 테스팅","새로운 운영 환경 관련 테스트","핫픽스(hot-fixes)에 대한 확인 테스팅"],"ans":[0,2],"exp":"2.3: 애플리케이션의 수명이 다하는 등의 단종으로 시스템을 단종할 때, 데이터 보존 기간이 길면 데이터 보관 테스팅이 필요할 수 있다. 보관 기간 중 데이터가 필요한 경우를 대비해 보관 이후 복원 및 복구 절차 테스팅도 필요할 수 있다.","why":["2.3에서 단종 시 데이터 보존 기간이 길면 필요할 수 있다고 한 테스팅이다.","데이터 변환 테스트는 다른 애플리케이션의 데이터를 마이그레이션할 때의 계기에 해당한다.","2.3에서 보관 기간 중 데이터가 필요할 때를 대비해 필요할 수 있다고 한 테스팅이다.","새로운 환경 관련 테스트는 운영 환경의 업그레이드나 마이그레이션 계기에 해당한다.","핫픽스는 수정사항 계기에 해당하며, 단종 계기와 관련이 없다."],"ref":"2.3"},{"id":"c2-026","ch":2,"lo":"FL-2.3.1","k":2,"q":"유지보수 테스팅(maintenance testing)에 대한 설명으로 옳은 것은?","opts":["유지보수 테스팅의 범위는 기존 시스템의 크기와 관계없이 변경사항의 크기로만 결정된다.","영향도 분석은 변경 여부를 결정하는 데 쓸 수 없고, 변경이 적용된 다음에만 수행한다.","핫픽스 같은 계획되지 않은 릴리스는 유지보수 범주에 들지 않아 유지보수 테스팅 대상이 아니다.","변경이 성공적으로 구현됐는지와, 변경되지 않은 영역의 리그레션 여부를 모두 확인한다."],"ans":[3],"exp":"2.3: 운영 중인 시스템의 변경사항을 테스트하는 것에는 변경사항이 성공적으로 구현되었는지 검증하는 것과, 변경되지 않은 시스템 영역(보통 대부분의 시스템)에서 발생할 수 있는 리그레션을 확인하는 작업이 모두 포함된다.","why":["2.3: 유지보수 테스팅의 범위는 변경의 리스크 수준, 기존 시스템의 크기, 변경사항의 크기에 따라 달라진다.","2.3은 변경 전에 영향도 분석을 수행해 다른 영역에 미칠 잠재적 영향을 변경사항 결정에 참고할 수 있다고 한다.","유지보수는 계획된 릴리스와 계획되지 않은 릴리스(핫픽스) 모두와 연관되며, 핫픽스는 유지보수 계기(수정사항)에도 들어 있다.","2.3: 운영 중인 시스템의 변경 테스트에는 변경 구현의 성공 여부 검증과, 변경되지 않은 영역의 리그레션 확인이 모두 포함된다."],"ref":"2.3"},{"id":"c2-027","ch":2,"lo":"FL-2.1.1","k":2,"q":"V-모델을 따르는 프로젝트가 있다.\n실라버스 2.1.1에 따르면 이런 순차적 개발 모델에서 일반적으로 나타나는 테스팅의 모습은?","opts":["테스터는 초기 단계에 요구사항 리뷰, 테스트 분석과 설계에 참여하며, 동적 테스팅은 초기에 하기 어려운 경우가 많다.","반복 주기마다 동작하는 제품 증분이 나오므로 초기부터 모든 테스트 레벨에서 정적 테스팅과 동적 테스팅을 모두 수행한다.","프로젝트 어느 시점에도 변화가 생길 수 있다고 가정해 가벼운 작업 산출물 문서화와 광범위한 테스트 자동화를 선호한다.","실행 가능한 코드가 완성될 때까지 테스터는 프로젝트에 참여하지 않으며, 요구사항 리뷰도 개발 후반에 몰아서 수행한다."],"ans":[0],"exp":"2.1.1: 일반적으로 순차적 개발 모델에서 테스터는 초기 단계에서 요구사항 리뷰, 테스트 분석과 설계에 참여한다. 실행 가능한 코드는 보통 개발 후반에 생성되므로, 동적 테스팅은 SDLC 초기에 수행하기 어려운 경우가 많다. V-모델은 2.1에서 순차적 개발 모델의 예로 나온다.","why":["2.1.1의 순차적 개발 모델 설명과 일치한다. 실행 가능한 코드가 보통 개발 후반에 생성되므로 동적 테스팅은 초기에 수행하기 어려운 경우가 많다.","반복 주기마다 증분이 나와 모든 레벨에서 정적·동적 테스팅을 할 수 있다는 것은 일부 반복적·점진적 개발 모델의 설명이다.","변화를 전제로 가벼운 작업 산출물 문서화와 테스트 자동화를 선호하는 것은 애자일 소프트웨어 개발의 설명이다.","순차적 모델에서도 테스터는 초기 단계에서 요구사항 리뷰와 테스트 분석·설계에 참여한다."],"ref":"2.1.1"},{"id":"c2-028","ch":2,"lo":"FL-2.1.1","k":2,"q":"한 팀이 3주마다 동작하는 제품 증분을 만들어 고객에게 자주 전달하는 점진적 개발 모델을 사용한다.\n실라버스 2.1.1에 따르면 이 모델이 테스팅에 미치는 영향으로 옳은 것은?","opts":["실행 가능한 코드가 개발 후반에야 생기므로 동적 테스팅은 마지막 증분에서 한 번에 수행한다.","증분마다 정적 테스팅만 수행하고, 동적 테스팅은 모든 증분이 통합된 뒤 시스템 테스팅에서 수행한다.","반복 주기마다 정적·동적 테스팅을 할 수 있고, 빠른 피드백과 광범위한 리그레션 테스팅이 필요하다.","증분마다 추가되는 기능이 적으므로 리그레션 테스팅의 필요성이 줄어들고, 피드백 속도도 중요하지 않다."],"ans":[2],"exp":"2.1.1: 일부 반복적 개발 모델과 점진적 개발 모델은 반복 주기마다 동작하는 프로토타입이나 제품 증분이 만들어진다고 가정한다. 그래서 반복 주기마다 모든 테스트 레벨에서 정적 테스팅과 동적 테스
