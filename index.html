,"k":3,"q":"전자 결재 문서의 상태 전이 모델은 다음 표와 같다. 초기 상태는 '작성 중'이고, '승인됨'과 '폐기됨'은 최종 상태라 이후 이벤트가 없다.\n모든 테스트 케이스는 '작성 중'에서 시작하고, 최종 상태에 도달하면 끝난다(최종 상태가 아닌 곳에서 끝내도 된다).\n\n100% 모든 상태 커버리지(all states coverage)와 100% 유효 전이 커버리지(valid transitions coverage)를 달성하는 데 필요한 최소 테스트 케이스 수는 각각?","table":{"head":["현재 상태","이벤트","다음 상태"],"rows":[["작성 중","제출","검토 중"],["검토 중","승인","승인됨"],["검토 중","반려","반려됨"],["검토 중","회수","작성 중"],["반려됨","수정","작성 중"],["반려됨","폐기","폐기됨"],["작성 중","삭제","폐기됨"]]},"opts":["모든 상태 1개, 유효 전이 3개","모든 상태 2개, 유효 전이 3개","모든 상태 2개, 유효 전이 7개","모든 상태 5개, 유효 전이 7개"],"ans":[1],"exp":"모든 상태 커버리지:\n① 최종 상태가 2개(승인됨, 폐기됨)이고 하나에 도달하면 테스트가 끝나므로, 테스트 하나로 둘 다 거칠 수 없다 → 최소 2개.\n② 2개로 가능하다. TC1: 제출 → 승인(작성 중, 검토 중, 승인됨), TC2: 제출 → 반려 → 폐기(반려됨, 폐기됨) → 상태 5개 모두.\n유효 전이 커버리지:\n③ 최종 상태로 들어가는 유효 전이는 검토 중→승인됨, 반려됨→폐기됨, 작성 중→폐기됨의 3개다. 테스트 하나에는 이 중 하나만 마지막 전이로 들어갈 수 있으므로 최소 3개.\n④ 3개로 가능하다. TC1: 제출 → 회수 → 제출 → 승인 / TC2: 제출 → 반려 → 수정 → 제출 → 반려 → 폐기 / TC3: 삭제 → 유효 전이 7개 모두.\n따라서 2개와 3개다(4.2.4절).","why":["최종 상태가 2개라서 테스트 하나로는 승인됨과 폐기됨을 모두 거칠 수 없다.","정답.","유효 전이마다 테스트 케이스를 하나씩 만든 경우다. 테스트 케이스 하나는 보통 여러 전이를 포함한다(4.2.4절).","상태와 전이마다 테스트를 하나씩 만든 경우다. 테스트 하나로 여러 상태와 전이를 다룰 수 있다."],"ref":"4.2.4"},{"id":"c4k3-026","ch":4,"lo":"FL-4.2.4","k":3,"q":"전자레인지의 상태 테이블(state table)은 다음과 같다. 셀에는 다음 상태가 적혀 있고, 빈 셀은 비유효 전이다(초기 상태: 대기).\n팀은 결함 마스킹을 피하려고 테스트 케이스 하나에 비유효 전이를 최대 하나만 넣기로 했다. 모든 테스트 케이스는 '대기'에서 시작하고, 비유효 전이를 시도하면 그 테스트 케이스는 끝난다.\n\n100% 모든 전이 커버리지(all transitions coverage)를 달성하는 데 필요한 최소 테스트 케이스 수는?","table":{"head":["상태 \\ 이벤트","시작 버튼","정지 버튼","타이머 종료"],"rows":[["대기","조리 중","",""],["조리 중","","일시정지","대기"],["일시정지","조리 중","대기",""]]},"opts":["1","4","5","9"],"ans":[1],"exp":"① 셀 9개(상태 3 × 이벤트 3) 중 유효 전이 5개, 비유효 전이 4개다. 비유효 전이: 대기+정지 버튼, 대기+타이머 종료, 조리 중+시작 버튼, 일시정지+타이머 종료.\n② 비유효 전이는 테스트 케이스마다 하나만 넣을 수 있으므로 최소 4개가 필요하다.\n③ 유효 전이는 비유효 전이를 시도하기 전 단계에 함께 넣을 수 있으므로 테스트를 더 늘릴 필요가 없다. 예:\n- TC1: 시작 → 정지 → 시작 → 정지 → 정지 → [정지 버튼]\n- TC2: 시작 → 타이머 종료 → [타이머 종료]\n- TC3: 시작 → [시작 버튼]\n- TC4: 시작 → 정지 → [타이머 종료]\n이 4개로 유효 전이 5개와 비유효 전이 4개를 모두 다룬다.\n④ 따라서 최소 4개다. 4.2.4절: 모든 전이 커버리지는 모든 유효 전이를 실행하고 비유효 전이 실행도 시도해야 하며, 테스트 케이스 하나에서 비유효 전이 하나만 테스트하면 결함 마스킹을 방지하는 데 도움이 된다.","why":["비유효 전이 4개를 테스트 하나에 몰아넣어야 나오는 수다. 팀 규칙에 어긋나고, 비유효 전이를 시도하면 테스트가 끝나므로 불가능하다.","정답. 비유효 전이 4개를 하나씩 담은 테스트 4개 안에 유효 전이 5개도 모두 넣을 수 있다.","유효 전이만 다루는 테스트를 따로 하나 더 만든 경우다. 유효 전이는 비유효 전이 시도 전에 함께 실행할 수 있다.","셀마다 테스트를 하나씩 만든 경우다."],"ref":"4.2.4"},{"id":"c4k3-027","ch":4,"lo":"FL-4.2.4","k":3,"q":"ATM 카드 인증의 상태 테이블(state table)은 다음과 같다. 셀에는 다음 상태가 적혀 있고, 빈 셀은 비유효 전이다. 초기 상태는 '카드 대기'다.\n\n다음 이벤트 순서 중 비유효 전이를 포함하는 테스트 케이스를 두 개 고르시오.","table":{"head":["상태 \\ 이벤트","카드 삽입","올바른 PIN","틀린 PIN","취소"],"rows":[["카드 대기","PIN 입력","","",""],["PIN 입력","","인증 완료","오류 1회","카드 대기"],["오류 1회","","인증 완료","오류 2회","카드 대기"],["오류 2회","","인증 완료","카드 잠김","카드 대기"],["인증 완료","","","",""],["카드 잠김","","","",""]]},"opts":["카드 삽입 → 틀린 PIN → 취소 → 카드 삽입 → 올바른 PIN","카드 삽입 → 올바른 PIN → 취소","카드 삽입 → 틀린 PIN → 틀린 PIN → 틀린 PIN","카드 삽입 → 취소 → 올바른 PIN","카드 삽입 → 틀린 PIN → 틀린 PIN → 올바른 PIN"],"ans":[1,3],"exp":"상태를 따라가며 이벤트마다 해당 셀이 비어 있는지 확인한다(4.2.4절: 상태 테이블은 비유효 전이를 빈 셀로 보여준다).\n- 카드 삽입 → 틀린 PIN → 취소 → 카드 삽입 → 올바른 PIN: 카드 대기→PIN 입력→오류 1회→카드 대기→PIN 입력→인증 완료 → 모두 유효\n- 카드 삽입 → 올바른 PIN → 취소: 카드 대기→PIN 입력→인증 완료. 그다음 '인증 완료 + 취소'는 빈 셀 → 비유효 전이 포함\n- 카드 삽입 → 틀린 PIN 3회: 카드 대기→PIN 입력→오류 1회→오류 2회→카드 잠김 → 모두 유효\n- 카드 삽입 → 취소 → 올바른 PIN: 카드 대기→PIN 입력→카드 대기. 그다음 '카드 대기 + 올바른 PIN'은 빈 셀 → 비유효 전이 포함\n- 카드 삽입 → 틀린 PIN 2회 → 올바른 PIN: 카드 대기→PIN 입력→오류 1회→오류 2회→인증 완료 → 모두 유효","why":["오류 1회에서 취소하면 카드 대기로 돌아가는 유효 전이다. 모든 전이가 유효하다.","정답. 인증 완료 상태에는 정의된 전이가 없으므로 '취소'는 비유효 전이다.","세 번째 틀린 PIN은 오류 2회에서 카드 잠김으로 가는 유효 전이다.","정답. 취소 후 카드 대기 상태에서 '올바른 PIN'은 비유효 전이다.","오류 2회에서 올바른 PIN을 입력하면 인증 완료로 가는 유효 전이다."],"ref":"4.2.4"},{"id":"c4k3-028","ch":4,"lo":"FL-4.2.4","k":3,"q":"ATM 카드 인증의 상태 테이블(state table)은 다음과 같다. 셀에는 다음 상태가 적혀 있고, 빈 셀은 비유효 전이다. 모든 테스트 케이스는 '카드 대기'에서 시작한다.\n- TC-A: 카드 삽입 → 틀린 PIN → 틀린 PIN → 틀린 PIN\n- TC-B: 카드 삽입 → 취소 → 카드 삽입 → 틀린 PIN → 취소 → 카드 삽입 → 올바른 PIN\n- TC-C: 카드 삽입 → 틀린 PIN → 취소 → 카드 삽입 → 틀린 PIN → 틀린 PIN → 취소 → 카드 삽입 → 올바른 PIN\n- TC-D: (카드 삽입 → 취소)를 5번 반복한 뒤 카드 삽입 → 올바른 PIN\n\n유효 전이 커버리지(valid transitions coverage)가 가장 높은 테스트 케이스는?","table":{"head":["상태 \\ 이벤트","카드 삽입","올바른 PIN","틀린 PIN","취소"],"rows":[["카드 대기","PIN 입력","","",""],["PIN 입력","","인증 완료","오류 1회","카드 대기"],["오류 1회","","인증 완료","오류 2회","카드 대기"],["오류 2회","","인증 완료","카드 잠김","카드 대기"],["인증 완료","","","",""],["카드 잠김","","","",""]]},"opts":["TC-A","TC-B","TC-C","TC-D"],"ans":[2],"exp":"① 유효 전이(채워진 셀)는 10개다: 카드 대기→PIN 입력 / PIN 입력→인증 완료, 오류 1회, 카드 대기 / 오류 1회→인증 완료, 오류 2회, 카드 대기 / 오류 2회→인증 완료, 카드 잠김, 카드 대기.\n② 테스트별 서로 다른 유효 전이:\n- TC-A: 카드 대기→PIN 입력, PIN 입력→오류 1회, 오류 1회→오류 2회, 오류 2회→카드 잠김 → 4개(40%)\n- TC-B: 카드 대기→PIN 입력, PIN 입력→카드 대기, PIN 입력→오류 1회, 오류 1회→카드 대기, PIN 입력→인증 완료 → 5개(50%)\n- TC-C: 카드 대기→PIN 입력, PIN 입력→오류 1회, 오류 1회→카드 대기, 오류 1회→오류 2회, 오류 2회→카드 대기, PIN 입력→인증 완료 → 6개(60%)\n- TC-D: 카드 대기→PIN 입력, PIN 입력→카드 대기, PIN 입력→인증 완료 → 3개(30%)\n③ 4.2.4절: 유효 전이 커버리지 = 실행한 유효 전이 수 ÷ 총 유효 전이 수. 같은 전이를 여러 번 실행해도 1개로 센다. 가장 높은 것은 TC-C(60%)다.","why":["서로 다른 유효 전이 4개(40%)를 실행한다.","서로 다른 유효 전이 5개(50%)를 실행한다.","정답. 서로 다른 유효 전이 6개(60%)로 가장 높다.","이벤트는 12개로 가장 많지만 같은 전이를 반복해서 서로 다른 유효 전이는 3개(30%)뿐이다."],"ref":"4.2.4"},{"id":"c4k3-029","ch":4,"lo":"FL-4.5.3","k":3,"q":"사용자 스토리: '온라인 서점 회원으로서 주문할 때 할인 쿠폰을 적용하고 싶다. 그래서 책을 더 싸게 살 수 있다.'\n인수 조건(acceptance criteria):\n- AC1: 유효한 쿠폰 코드를 입력하면 주문 금액에서 10%가 할인된다.\n- AC2: 사용 기한이 지난 쿠폰 코드를 입력하면 '사용 기한이 지난 쿠폰입니다' 메시지가 표시되고 할인되지 않는다.\n- AC3: 쿠폰 적용 결과는 적용 버튼을 누른 뒤 2초 이내에 화면에 표시된다.\n\n팀은 인수 테스트 주도 개발(ATDD)로 다음 세 테스트 케이스를 도출했다.\n- 가: 사용 기한이 지난 쿠폰 'OLD10'을 30,000원 주문에 입력하면 안내 메시지가 표시되고 결제 금액은 30,000원 그대로다.\n- 나: 유효한 쿠폰 'BOOK10'을 적용하면서, 적용 버튼을 누른 시점부터 할인 결과가 화면에 표시될 때까지의 응답 시간을 측정하면 2초 이내다.\n- 다: 유효한 쿠폰 'BOOK10'을 30,000원 주문에 입력하면 결제 금액이 27,000원이 된다.\n\nATDD에서 일반적으로 테스트 케이스를 다루는 순서로 옳은 것은?","opts":["가 → 다 → 나","다 → 나 → 가","나 → 다 → 가","다 → 가 → 나"],"ans":[3],"exp":"4.5.3절: 일반적으로 첫 테스트 케이스는 예외나 오류 조건 없이 올바른 동작을 확인하는 긍정/유효 테스트 케이스다. 유효 테스트 케이스를 끝내면 비유효/부정 테스트를 수행하고, 마지막으로 비기능 품질 특성(예: 성능 효율성, 사용성)을 다룬다.\n- 다: 유효한 쿠폰으로 정상 할인 → 긍정 테스트(AC1)\n- 가: 기한 지난 쿠폰 거부 → 부정 테스트(AC2)\n- 나: 응답 시간 2초 이내 확인 → 비기능(성능 효율성) 테스트(AC3)\n따라서 다 → 가 → 나 순서다.","why":["부정 테스트를 긍정 테스트보다 먼저 했다. 긍정 테스트가 먼저다.","비기능 테스트를 부정 테스트보다 먼저 했다. 나도 유효한 쿠폰을 쓰지만 확인 대상은 응답 시간(성능 효율성)이라는 비기능 품질 특성이므로 마지막에 다룬다.","비기능 테스트를 가장 먼저 했다.","정답. 긍정 → 부정 → 비기능 순서다."],"ref":"4.5.3"},{"id":"c4k3-030","ch":4,"lo":"FL-4.5.3","k":3,"q":"사용자 스토리: '온라인 마트 고객으로서 결제 전에 배송비를 확인하고 싶다. 그래서 예상하지 못한 비용을 피할 수 있다.'\n인수 조건(acceptance criteria, 규칙 기반 형식):\n- 일반 회원은 주문 금액이 40,000원 이상이면 배송비가 0원이다.\n- 일반 회원은 주문 금액이 40,000원 미만이면 배송비가 3,000원이다.\n- 골드 회원은 주문 금액과 관계없이 배송비가 0원이다.\n\n인수 테스트 주도 개발(ATDD)에서 이 인수 조건을 기반으로 도출한 테스트 케이스 중 기대 결과가 올바른 것은?","opts":["일반 회원이 39,000원을 주문하면 배송비는 0원이다.","골드 회원이 15,000원을 주문하면 배송비는 3,000원이다.","골드 회원이 40,000원을 주문하면 배송비는 3,000원이다.","일반 회원이 40,000원을 주문하면 배송비는 0원이다."],"ans":[3],"exp":"4.5.3절: ATDD의 테스트 케이스는 인수 조건을 기반으로 하며, 소프트웨어가 어떻게 동작하는지 보여주는 예제로 볼 수 있다. 각 보기의 입력을 인수 조건에 대입한다.\n- 일반 회원, 39,000원: 일반 회원이고 40,000원 미만 → 3,000원\n- 골드 회원, 15,000원: 골드 회원 → 0원\n- 골드 회원, 40,000원: 골드 회원은 금액과 관계없이 → 0원\n- 일반 회원, 40,000원: 일반 회원이고 40,000원 이상 → 0원(기대 결과 일치)","why":["39,000원은 40,000원 미만이므로 배송비는 3,000원이어야 한다.","골드 회원은 금액과 관계없이 0원이어야 한다.","골드 회원은 주문 금액과 관계없이 배송비가 0원이므로 3,000원은 틀린 기대 결과다.","정답. 40,000원은 '40,000원 이상'에 포함되므로 배송비는 0원이다."],"ref":"4.5.3"},{"id":"c4k3-031","ch":4,"lo":"FL-4.5.3","k":3,"q":"사용자 스토리: '도서관 회원으로서 대출 중인 책의 반납 기한을 온라인으로 연장하고 싶다. 그래서 도서관에 가지 않고도 책을 더 오래 읽을 수 있다.'\n인수 조건(acceptance criteria):\n- AC1: 대출 1건당 연장은 1회만 할 수 있다.\n- AC2: 예약자가 있는 책은 연장할 수 없고 '예약된 도서입니다' 메시지가 표시된다.\n- AC3: 연장하면 반납 기한이 7일 늘어난다.\n\n팀이 인수 테스트 주도 개발(ATDD)로 테스트 케이스 후보를 만들었다. 이 사용자 스토리를 벗어나므로 포함하지 않아야 하는 테스트 케이스를 두 개 고르시오.","opts":["예약자가 없는 책을 처음 연장하면 반납 기한이 7일 늘어난다.","이미 1회 연장한 책을 다시 연장하려 하면 연장되지 않는다.","연체료를 앱에서 신용카드로 결제하면 결제 완료 영수증이 표시된다.","예약자가 있는 책을 연장하려 하면 '예약된 도서입니다' 메시지가 표시된다.","대출하지 않은 책을 앱에서 예약 신청하면 예약 대기 순번이 표시된다."],"ans":[2,4],"exp":"4.5.3절: 테스트 케이스는 사용자 스토리의 모든 특성을 다뤄야 하며 스토리를 벗어나면 안 된다. 이 스토리의 범위는 '대출 중인 책의 반납 기한 온라인 연장'이다.\n- 첫 연장 시 7일 연장 → AC3(긍정)\n- 1회 연장 후 재연장 거부 → AC1(부정)\n- 연체료 카드 결제 → 연장과 무관한 결제 기능, 스토리 범위 밖\n- 예약 도서 연장 거부 → AC2(부정)\n- 대출하지 않은 책 예약 신청 → 연장과 무관한 예약 기능, 스토리 범위 밖","why":["AC3를 확인하는 긍정 테스트다.","AC1(연장 1회 제한)을 확인하는 부정 테스트다.","정답. 연체료 결제는 이 스토리가 다루는 연장 기능이 아니다.","AC2를 확인하는 부정 테스트다.","정답. 새 책 예약 신청은 이 스토리가 다루는 연장 기능이 아니다."],"ref":"4.5.3"},{"id":"c4k3-032","ch":4,"lo":"FL-4.5.3","k":3,"q":"사용자 스토리: '헬스장 회원으로서 앱에서 PT 수업을 예약하고 싶다. 그래서 원하는 시간에 수업을 받을 수 있다.'\n인수 조건(acceptance criteria):\n- AC1: 잔여 PT 횟수가 1회 이상이면 예약이 확정되고 잔여 횟수가 1회 줄어든다.\n- AC2: 잔여 PT 횟수가 0회이면 예약이 거부되고 '잔여 횟수가 없습니다' 메시지가 표시된다.\n- AC3: 같은 시간대에 이미 예약이 있으면 예약이 거부되고 '중복 예약' 메시지가 표시된다.\n\n테스트 케이스 후보:\n- TC1: 잔여 3회인 회원이 예약하면 예약이 확정되고 잔여 2회가 된다.\n- TC2: 잔여 5회인 회원이 예약하면 예약이 확정되고 잔여 4회가 된다.\n- TC3: 잔여 0회인 회원이 예약하면 거부되고 '잔여 횟수가 없습니다'가 표시된다.\n- TC4: 오후 7시 수업을 이미 예약한 회원이 같은 시간 수업을 다시 예약하면 거부되고 '중복 예약'이 표시된다.\n\n인수 테스트 주도 개발(ATDD) 지침에 맞는 테스트 케이스 집합은?","opts":["TC1, TC3, TC4","TC1, TC2, TC3, TC4","TC1, TC2, TC3","TC1, TC3"],"ans":[0],"exp":"4.5.3절: 테스트 케이스는 사용자 스토리의 모든 특성을 다뤄야 하고, 두 개 이상의 테스트 케이스가 사용자 스토리의 같은 특성을 설명해서는 안 된다.\n- TC1과 TC2는 모두 AC1(잔여 1회 이상 → 확정·차감)이라는 같은 특성을 설명한다. 하나만 남긴다.\n- TC3 → AC2, TC4 → AC3.\n따라서 TC1, TC3, TC4가 모든 인수 조건을 중복 없이 다룬다.","why":["정답. AC1~AC3을 하나씩, 중복 없이 다룬다.","모든 인수 조건을 다루지만 TC1과 TC2가 같은 특성(AC1)을 중복해서 설명한다.","TC1과 TC2가 중복이고 AC3(중복 예약 거부)을 다루지 않는다.","중복은 없지만 AC3을 다루지 않아 스토리의 모든 특성을 다루지 못한다."],"ref":"4.5.3"},{"id":"c5-001","ch":5,"lo":"FL-5.1.2","k":1,"q":"애자일 팀의 테스터 민지는 다음 분기 릴리스 계획(release planning) 회의에 참여한다.\n실라버스에 따르면 릴리스 계획에서 테스터가 기여하는 방식으로 옳은 것은?","opts":["사용자 스토리가 테스트 가능한지는 릴리스 계획에서 다루지 않고, 테스트 실행 단계에서 처음 확인한다.","테스트 노력 추정은 개발자에게 맡기고, 테스터는 반복 주기가 끝난 뒤 실제로 든 노력만 기록한다.","프로젝트 리스크와 품질 리스크 분석에 참여하고, 사용자 스토리와 관련된 테스트 노력을 추정한다.","리스크 분석은 테스트 실행 결과가 나와야 할 수 있으므로 릴리스 계획 단계에서는 하지 않는다."],"ans":[2],"exp":"5.1.2: 릴리스 계획에 참여하는 테스터는 테스트 가능한 사용자 스토리와 인수 조건이 작성되도록 하고, 프로젝트 및 품질 리스크 분석에 참여하고, 사용자 스토리와 관련된 테스트 노력을 추정하고, 테스트 접근법을 결정하고, 릴리스를 위한 테스팅을 계획한다.","why":["릴리스 계획의 테스터는 테스트 가능한 사용자 스토리와 인수 조건이 작성되도록 참여한다(5.1.2). 실행 단계까지 미루지 않는다.","사용자 스토리와 관련된 테스트 노력 추정은 릴리스 계획에서 테스터가 하는 일이다(5.1.2).","정답. 5.1.2에 나오는 릴리스 계획에서의 테스터 기여다.","테스터는 릴리스 계획에서 프로젝트 및 품질 리스크 분석에 참여한다(5.1.2). 제품 리스크 분석도 SDLC 초기에 시작하는 것이 이상적이다(5.2.3)."],"ref":"5.1.2"},{"id":"c5-002","ch":5,"lo":"FL-5.1.2","k":1,"q":"새 반복 주기(iteration)를 시작하기 전에 반복 주기 계획(iteration planning) 회의가 열렸다.\n실라버스에 따르면 이 회의에 참여한 테스터가 하는 일로 옳은 것은?","opts":["사용자 스토리의 비기능적 측면은 반복 주기 계획에서 다루지 않고, 릴리스 이후 운영 단계에서 식별한다.","사용자 스토리를 업무(특히 테스팅 업무) 단위로 나누고, 각 테스팅 업무에 필요한 테스트 노력을 추정한다.","리스크 분석은 릴리스 계획에서 이미 끝났으므로, 반복 주기 계획에서는 사용자 스토리의 리스크 분석을 하지 않는다.","사용자 스토리의 테스트 용이성은 반복 주기 계획에서 판단하지 않고, 테스트 케이스를 실행하면서 처음 판단한다."],"ans":[1],"exp":"5.1.2: 반복 주기 계획에 참여하는 테스터는 사용자 스토리의 구체적인 리스크 분석에 참여하고, 사용자 스토리의 테스트 용이성을 판단하고, 사용자 스토리를 업무(특히 테스팅 업무) 단위로 분류하고, 각 테스팅 업무에 필요한 테스트 노력을 추정하고, 테스트 대상의 기능 및 비기능적 측면을 식별하고 구체화한다.","why":["반복 주기 계획에서 테스터는 테스트 대상의 기능 및 비기능적 측면을 식별하고 구체화한다(5.1.2).","정답. 5.1.2에 나오는 반복 주기 계획에서의 테스터 활동이다.","반복 주기 계획에서도 테스터는 사용자 스토리의 구체적인 리스크 분석에 참여한다(5.1.2).","사용자 스토리의 테스트 용이성 판단은 반복 주기 계획에서 테스터가 하는 일이다(5.1.2)."],"ref":"5.1.2"},{"id":"c5-003","ch":5,"lo":"FL-5.1.2","k":1,"q":"반복적 소프트웨어 개발수명주기(SDLC)의 릴리스 계획(release planning)과 반복 주기 계획(iteration planning)에 대한 설명으로 옳은 것은?","opts":["반복적 SDLC에서는 릴리스 계획만 하고, 반복 주기마다 따로 계획하지는 않는다.","반복 주기 계획은 제품 릴리스 전체를 내다보며 제품 백로그를 (재)정의하는 활동이다.","릴리스 계획은 반복 주기 백로그만 다루므로, 큰 사용자 스토리를 작은 사용자 스토리로 세분화하는 일은 포함하지 않는다.","릴리스 계획은 제품 백로그를 (재)정의하며, 개별 반복 주기의 테스트 접근법과 테스트 계획을 위한 기반이 된다."],"ans":[3],"exp":"5.1.2: 반복적 SDLC에서는 보통 릴리스 계획과 반복 주기 계획 두 가지가 이루어진다. 릴리스 계획은 제품 릴리스를 계획하며 제품 백로그를 (재)정의하고, 큰 사용자 스토리를 작은 사용자 스토리로 세분화하는 작업을 포함할 수 있으며, 개별 반복 주기의 테스트 접근법과 테스트 계획을 위한 기반이 된다. 반복 주기 계획은 개별 반복 주기를 계획하며 반복 주기 백로그와 관련이 있다.","why":["반복적 SDLC에서는 일반적으로 릴리스 계획과 반복 주기 계획 두 가지가 이루어진다(5.1.2).","제품 백로그를 (재)정의하는 것은 릴리스 계획이다. 반복 주기 계획은 개별 반복 주기를 계획하며 반복 주기 백로그와 관련이 있다(5.1.2).","릴리스 계획은 제품 백로그를 다루고, 큰 사용자 스토리를 작은 사용자 스토리로 세분화하는 작업을 포함할 수 있다(5.1.2).","정답. 5.1.2의 릴리스 계획 설명과 일치한다."],"ref":"5.1.2"},{"id":"c5-004","ch":5,"lo":"FL-5.1.6","k":1,"q":"테스트 피라미드(test pyramid) 모델이 팀을 지원하는 방식으로 실라버스에 제시된 것은?","opts":["서로 다른 테스트 목표가 서로 다른 테스트 자동화 수준으로 지원된다는 것을 보여 줌으로써, 테스트 자동화와 테스트 노력 할당을 지원한다.","테스트를 비즈니스 측면과 기술 측면, 팀 지원과 제품 평가로 나누어 이해관계자에게 테스트 유형을 설명하게 해 준다.","리스크 발생 가능성과 리스크 영향을 곱해 각 층의 리스크 수준을 계산하게 해 준다.","가장 낙관적인 추정치, 확률적으로 가장 높은 추정치, 가장 비관적인 추정치로 각 층의 테스트 노력을 계산하게 해 준다."],"ans":[0],"exp":"5.1.6: 테스트 피라미드는 테스트에 따라 세분화 수준(granularity)이 다를 수 있음을 보여 주는 모델이다. 다양한 테스트 목표가 서로 다른 테스트 자동화 수준에 따라 지원된다는 것을 보여 줌으로써 팀의 테스트 자동화와 테스트 노력 할당을 지원한다.","why":["정답. 5.1.6의 설명 그대로다.","비즈니스/기술 측면과 팀 지원/제품 평가로 나누는 것은 테스팅 사분면(testing quadrants) 모델이다(5.1.7).","발생 가능성 × 영향으로 리스크 수준을 구하는 것은 정량적 리스크 평가다(5.2.3). 테스트 피라미드와 관계없다.","세 개의 추정치를 쓰는 것은 3점 추정 기법이다(5.1.4)."],"ref":"5.1.6"},{"id":"c5-005","ch":5,"lo":"FL-5.1.6","k":1,"q":"테스트 피라미드에서 위층으로 올라갈수록 나타나는 변화로 옳은 것은?","opts":["테스트 세분화 정도는 높아지고, 테스트 격리는 높아지며, 테스트 실행 시간은 짧아진다.","테스트 세분화 정도는 낮아지고, 테스트 격리는 높아지며, 테스트 실행 시간은 짧아진다.","테스트 세분화 정도는 낮아지고, 테스트 격리는 낮아지며, 테스트 실행 시간은 길어진다.","테스트 세분화 정도는 높아지고, 테스트 격리는 낮아지며, 테스트 실행 시간은 길어진다."],"ans":[2],"exp":"5.1.6: 층이 높아질수록 테스트 세분화 정도는 낮아지고, 테스트 격리는 낮아지며(즉, 시스템의 다른 요소에 대한 의존도가 커지며), 테스트 실행 시간은 길어진다.","why":["세 가지 모두 반대다. 위층일수록 세분화 정도와 격리는 낮아지고 실행 시간은 길어진다(5.1.6).","위층일수록 테스트 격리는 낮아지고(다른 요소에 더 의존하고) 실행 시간은 길어진다(5.1.6).","정답. 5.1.6 설명과 일치한다.","위층일수록 세분화 정도는 낮아진다. 위층 테스트는 큰 규모의 기능을 확인한다(5.1.6)."],"ref":"5.1.6"},{"id":"c5-006","ch":5,"lo":"FL-5.1.6","k":1,"q":"테스트 피라미드의 층에 대한 설명으로 옳은 것은?","opts":["아래층 테스트는 큰 규모의 기능을 확인하므로, 적은 수의 테스트로도 적절한 커버리지를 달성할 수 있다.","층의 수와 명칭은 모델에 따라 다를 수 있으며, 최초 모델(Cohn 2009)은 '단위 테스트', '서비스 테스트', 'UI 테스트' 세 층을 정의했다.","층의 수와 명칭은 '단위 테스트', '서비스 테스트', 'UI 테스트' 세 층으로 고정되어 있어, 다른 테스트 레벨 분류는 쓸 수 없다.","맨 위층은 작고 독립적이며 빠른 테스트로 이루어지고, 맨 아래층은 복잡한 엔드-투-엔드 테스트로 이루어진다."],"ans":[1],"exp":"5.1.6: 층의 수와 각 층의 명칭은 다를 수 있다. 최초의 테스트 피라미드 모델(Cohn 2009)은 '단위 테스트', '서비스 테스트', 'UI 테스트' 세 층을 정의했고, 단위(컴포넌트)·통합(컴포넌트 통합)·엔드-투-엔드 테스트로 정의하는 모델도 많이 알려져 있다. 다른 테스트 레벨 분류를 쓰기도 한다.","why":["작은 기능을 확인해서 많은 수가 필요한 것이 아래층이고, 큰 기능을 확인해서 적은 수로 충분한 것은 위층이다(5.1.6).","정답. 5.1.6과 일치한다.","층의 수와 명칭은 다를 수 있다. 단위(컴포넌트)/통합(컴포넌트 통합)/엔드-투-엔드 모델이나 다른 테스트 레벨 분류도 쓴다(5.1.6).","위아래가 바뀌었다. 아래층이 작고 독립적이며 빠른 테스트, 위층이 복잡한 엔드-투-엔드 테스트다(5.1.6)."],"ref":"5.1.6"},{"id":"c5-007","ch":5,"lo":"FL-5.2.1","k":1,"q":"실라버스에 따르면 리스크(risk)를 특징짓는 두 가지 요소는?","opts":["리스크 식별과 리스크 평가","리스크 완화와 리스크 모니터링","리스크 발생 가능성과 필요한 테스트 노력","리스크 발생 가능성과 리스크 영향"],"ans":[3],"exp":"5.2.1: 리스크는 리스크 발생 가능성(리스크 발생 확률)과 리스크 영향(피해, 즉 발생했을 때 생기게 될 피해) 두 요소로 특징지을 수 있다. 이 두 요소로 리스크 수준을 표현한다.","why":["리스크 식별과 리스크 평가는 리스크 분석을 이루는 활동이다(5.2, 5.2.3). 리스크의 속성이 아니다.","리스크 완화와 리스크 모니터링은 리스크 제어를 이루는 활동이다(5.2, 5.2.4).","필요한 테스트 노력은 리스크를 특징짓는 요소가 아니다. 두 요소는 발생 가능성과 영향(피해)이다(5.2.1). 제품 리스크 분석 결과는 업무별 필요 테스트 노력을 추정하는 데 쓰인다(5.2.3).","정답. 5.2.1. 실라버스 표기는 '리스크 영향(피해)'이다."],"ref":"5.2.1"},{"id":"c5-008","ch":5,"lo":"FL-5.2.1","k":1,"q":"리스크 발생 가능성(risk likelihood)과 리스크 수준(risk level)에 대한 설명으로 옳은 것은?","opts":["리스크 발생 가능성은 리스크가 발생했을 때 생기게 될 피해의 크기를 말하며, 확률로는 표현하지 않는다.","리스크 발생 가능성은 0보다 크고 1보다 작은 확률이며, 리스크 수준이 높을수록 조치가 중요해진다.","리스크 발생 가능성은 0 이상 1 이하의 값이며, 1이면 리스크 수준이 가장 높은 리스크로 본다.","리스크 수준이 높을수록 이미 잘 알려진 리스크이므로 그에 대한 조치의 중요도는 낮아진다."],"ans":[1],"exp":"5.2.1: 리스크 발생 가능성은 리스크 발생 확률(0보다 크고 1보다 작음)이다. 발생 가능성과 리스크 영향으로 리스크 수준을 표현하며, 리스크 수준이 높을수록 그에 대한 조치 또한 중요해진다.","why":["발생했을 때 생기게 될 피해는 리스크 영향(피해)이다. 리스크 발생 가능성은 리스크 발생 확률이다(5.2.1).","정답. 5.2.1.","발생 가능성은 0보다 크고 1보다 작다(5.2.1). 0과 1은 포함하지 않는다.","리스크 수준이 높을수록 그에 대한 조치가 더 중요해진다(5.2.1)."],"ref":"5.2.1"},{"id":"c5-009","ch":5,"lo":"FL-5.2.1","k":1,"q":"한 팀이 정량적 접근법으로 제품 리스크 4개의 리스크 수준을 평가하려 한다. 리스크 발생 가능성은 확률로, 리스크 영향은 1~10 점수로 매겼다.\n리스크 수준이 가장 높은 것은?","table":{"head":["리스크","리스크 발생 가능성","리스크 영향(1~10)"],"rows":[["R1","0.2","9"],["R2","0.5","4"],["R3","0.8","2"],["R4","0.3","7"]]},"opts":["R1","R2","R3","R4"],"ans":[3],"exp":"5.2.1, 5.2.3: 정량적 접근법에서 리스크 수준은 리스크 발생 가능성과 리스크 영향을 곱한 값이다.\nR1 = 0.2 × 9 = 1.8\nR2 = 0.5 × 4 = 2.0\nR3 = 0.8 × 2 = 1.6\nR4 = 0.3 × 7 = 2.1\n가장 높은 것은 R4(2.1)다. 발생 가능성만 보면 R3, 영향만 보면 R1이 가장 크지만, 리스크 수준은 두 요소를 함께 봐야 한다.","why":["R1은 영향(9)이 가장 크지만 0.2 × 9 = 1.8로 R4(2.1)보다 낮다.","R2는 0.5 × 4 = 2.0으로 R4(2.1)보다 낮다.","R3은 발생 가능성(0.8)이 가장 크지만 0.8 × 2 = 1.6으로 네 개 중 가장 낮다.","정답. 0.3 × 7 = 2.1로 가장 높다."],"ref":"5.2.1"},{"id":"c5-010","ch":5,"lo":"FL-5.3.1","k":1,"q":"실라버스가 '제품 품질 메트릭(product quality metrics)'의 예로 든 것은?","opts":["결함 발견 비율(defect detection percentage)","테스트 환경 준비 진행률(test environment preparation progress)","평균 장애 시간(mean time to failure)","잔여 리스크 수준(residual risk level)"],"ans":[2],"exp":"5.3.1: 제품 품질 메트릭의 예는 가용성(availability), 응답 시간(response time), 평균 장애 시간(mean time to failure)이다.","why":["결함 발견 비율은 결함 메트릭의 예다(5.3.1).","테스트 환경 준비 진행률은 테스트 진행 상황 메트릭의 예다(5.3.1).","정답. 5.3.1.","잔여 리스크 수준은 리스크 메트릭의 예다(5.3.1)."],"ref":"5.3.1"},{"id":"c5-011","ch":5,"lo":"FL-5.3.1","k":1,"q":"테스트 메트릭과 실라버스의 메트릭 분류를 바르게 짝지은 것은?","opts":["결함 밀도 – 결함 메트릭","테스트 노력 투입률 – 테스트 진행 상황 메트릭","요구사항 커버리지 – 제품 품질 메트릭","조직의 품질 비용 – 리스크 메트릭"],"ans":[0],"exp":"5.3.1: 결함 메트릭의 예는 발견/수정한 결함의 수와 우선순위, 결함 밀도, 결함 발견 비율이다.","why":["정답. 결함 밀도는 결함 메트릭의 예다(5.3.1).","테스트 노력 투입률은 프로젝트 진행 상황 메트릭(작업 완료율, 자원 사용률, 테스트 노력 투입률)의 예다(5.3.1).","요구사항 커버리지는 커버리지 메트릭의 예다(5.3.1).","조직의 품질 비용은 비용 메트릭의 예다(5.3.1)."],"ref":"5.3.1"},{"id":"c5-012","ch":5,"lo":"FL-5.3.1","k":1,"q":"실라버스에 따르면 테스트 메트릭(test metrics)을 수집하는 목적으로 옳은 것은? (두 개를 고르시오)","opts":["계획한 테스트 일정 및 예산 대비 현재 진행 상황을 보여 주기 위해","결함을 만든 개발자를 찾아 개인별 성과를 평가하기 위해","테스트 대상의 현재 품질을 보여 주기 위해","테스트가 모두 끝난 뒤에만 수집해 다음 프로젝트의 예산을 확정하기 위해","테스트 케이스의 기대 결과를 자동으로 도출하기 위해"],"ans":[0,2],"exp":"5.3.1: 테스트 메트릭은 계획한 테스트 일정 및 예산 대비 현재 진행 상황, 테스트 대상의 현재 품질, 테스트 목적이나 반복 주기 목표 대비 테스트 활동의 효과를 보여 주기 위해 수집한다. 테스트 모니터링은 테스트 제어와 테스트 완료 활동을 지원하는 다양한 메트릭을 수집한다.","why":["정답. 5.3.1.","실라버스가 든 수집 목적이 아니다. 목적은 진행 상황, 테스트 대상의 품질, 테스트 활동의 효과를 보여 주는 것이다(5.3.1).","정답. 5.3.1.","메트릭은 테스트 모니터링 중에 수집해 테스트 제어와 테스트 완료를 지원한다(5.3.1). 끝난 뒤에만 수집하는 것이 아니다.","기대 결과 도출은 메트릭 수집 목적이 아니다(5.3.1)."],"ref":"5.3.1"},{"id":"c5-013","ch":5,"lo":"FL-5.1.1","k":2,"q":"테스트 계획서(test plan)의 목적으로 실라버스에 제시된 것은?","opts":["끝난 테스트 활동에서 경험과 테스트웨어를 모으고, 테스팅 관련 교훈을 정리한다.","결함을 처리하는 담당자가 장애를 재현할 수 있도록 재현 절차와 기대 결과·실제 결과를 기록한다.","테스팅이 기존 테스트 정책과 테스트 전략을 준수함을 보여 주거나, 준수하지 않는다면 그 이유를 설명한다.","매일 또는 매주 이해관계자에게 테스트 진행 상황과 테스팅 진행 방해 요소를 알린다."],"ans":[2],"exp":"5.1.1: 테스트 계획서는 테스트 목적 달성을 위한 방법과 일정을 문서화하고, 수행한 테스트 활동이 정해진 기준을 충족하는 데 도움을 주고, 팀원과 기타 이해관계자의 의사소통 수단으로 쓰이며, 테스팅이 수립한 테스트 정책 및 전략을 준수함을 보여 준다(또는 준수하지 않는 이유를 설명한다).","why":["끝난 활동에서 경험·테스트웨어를 모으고 교훈을 정리하는 것은 테스트 완료와 테스트 완료 보고서의 몫이다(5.3, 5.3.2).","재현에 필요한 정보와 기대 결과·실제 결과는 결함 보고서의 내용이다(5.5).","정답. 5.1.1.","정기적으로 진행 상황과 방해 요소를 알리는 것은 테스트 진행 상황 보고서다(5.3.2)."],"ref":"5.1.1"},{"id":"c5-014","ch":5,"lo":"FL-5.1.1","k":2,"q":"테스트 관리자가 테스트 계획서를 작성하고 있다. 실라버스에 따르면 테스트 계획서의 '테스트 접근법(test approach)' 항목에 들어가는 내용의 예로 옳은 것은?","opts":["테스트 기법, 테스팅의 독립성, 수집할 메트릭","의사소통 방법 및 빈도, 문서 양식","역할, 책임, 테스팅 관련성, 채용 및 훈련 요구사항","테스트 범위, 테스트 목적, 테스트 베이시스"],"ans":[0],"exp":"5.1.1: 테스트 계획서의 테스트 접근법 항목의 예는 테스트 레벨, 테스트 유형, 테스트 기법, 테스트 산출물, 시작 조건 및 완료 조건, 테스팅의 독립성, 수집할 메트릭, 테스트 데이터 요구사항, 테스트 환경 요구사항, 테스트 정책과 테스트 전략과의 편차다.","why":["정답. 5.1.1.","테스트 계획서의 '의사소통' 항목 예시다(5.1.1).","테스트 계획서의 '이해관계자' 항목 예시다(5.1.1).","테스트 계획서의 '테스팅 정황' 항목 예시다(5.1.1)."],"ref":"5.1.1"},{"id":"c5-015","ch":5,"lo":"FL-5.1.1","k":2,"q":"다음 중 테스트 계획서의 일반적인 내용으로 실라버스에 제시된 것은? (두 개를 고르시오)","opts":["테스트 진행 상황(예: 예정보다 빠른지 늦은지)과 테스팅 진행 방해 요소","테스트 프로젝트의 가정 및 제약 사항","이상 사항을 발견한 절차, 관련 테스트 로그, 스크린샷","수정되지 않은 결함과 테스팅 관련 교훈","예산 및 일정"],"ans":[1,4],"exp":"5.1.1: 테스트 계획서는 보통 테스팅 정황, 테스트 프로젝트의 가정 및 제약 사항, 이해관계자, 의사소통, 리스크 목록, 테스트 접근법, 예산 및 일정을 포함한다.","why":["테스트 진행 상황과 방해 요소는 테스트 진행 상황 보고서의 내용이다(5.3.2).","정답. 5.1.1.","장애 재현에 필요한 정보는 결함 보고서의 내용이다(5.5).","수정되지 않은 결함과 교훈은 테스트 완료 보고서의 내용이다(5.3.2).","정답. 5.1.1."],"ref":"5.1.1"},{"id":"c5-016","ch":5,"lo":"FL-5.1.3","k":2,"q":"시스템 테스트 레벨에 대해 다음 조건들을 정했다. 실라버스가 제시한 예에 따르면 시작 조건(entry criteria)에 해당하는 것은? (두 개를 고르시오)","opts":["목표로 한 커버리지 수준(80%)을 달성했다.","테스트 환경과 테스트 데이터를 사용할 수 있다.","계획한 모든 테스트가 실행되었다.","테스트 대상에 대한 모든 스모크 테스트가 합격했다.","발견한 모든 결함이 보고되었다."],"ans":[1,3],"exp":"5.1.3: 일반적인 시작 조건은 자원의 가용성(예: 인력, 도구, 환경, 테스트 데이터, 예산, 시간), 테스트웨어 가용성(예: 테스트 베이시스, 테스트 가능한 요구사항, 사용자 스토리, 테스트 케이스), 테스트 대상의 초기 품질 수준(예: 모든 스모크 테스트가 합격함)이다. 달성한 커버리지 수준, 계획한 테스트의 실행 여부, 발견한 결함의 보고 여부는 완료 조건의 예다.","why":["달성한 커버리지 수준은 철저함을 측정하는 완료 조건의 예다(5.1.3).","정답. 자원의 가용성(환경, 테스트 데이터)은 시작 조건의 예다(5.1.3).","'계획한 모든 테스트가 실행되었는가'는 예/아니오로 판단하는 완료 조건의 예다(5.1.3).","정답. 테스트 대상의 초기 품질 수준(모든 스모크 테스트 합격)은 시작 조건의 예다(5.1.3).","'발견한 모든 결함이 보고되었는가'는 예/아니오로 판단하는 완료 조건의 예다(5.1.3)."],"ref":"5.1.3"},{"id":"c5-017","ch":5,"lo":"FL-5.1.3","k":2,"q":"출시를 앞둔 프로젝트에서 테스트 예산이 모두 소진되었다. 완료 조건 중 '요구사항 커버리지 100%'는 아직 충족하지 못했다. 이해관계자들은 추가 테스트 없이 배포하는 리스크를 검토하고 수용하기로 했다.\n실라버스에 따르면 이 상황에 대한 설명으로 옳은 것은?","opts":["커버리지 완료 조건이 충족되지 않았으므로, 예산과 관계없이 커버리지 100%를 달성할 때까지 테스팅을 계속해야 한다.","완료 조건은 테스트 시작 전에 확정되므로, 테스트 도중 이해관계자가 리스크를 수용하더라도 테스팅 종료 여부에는 영향을 줄 수 없다.","시간과 예산의 소진은 완료 조건이 될 수 없으므로, 이해관계자의 수용 여부와 관계없이 테스팅을 끝낼 수 없다.","시간이나 예산의 소진도 유효한 완료 조건으로 볼 수 있고 이해관계자가 리스크를 수용했으므로, 다른 완료 조건이 충족되지 않았더라도 테스팅을 종료할 수 있다."],"ans":[3],"exp":"5.1.3: 시간 및 예산의 소진도 유효한 완료 조건으로 볼 수 있다. 이해관계자들이 추가 테스트 없이 배포하는 리스크를 검토하고 수용했다면, 다른 완료 조건이 충족되지 않더라도 테스트를 종료할 수 있다.","why":["이해관계자가 리스크를 검토하고 수용했다면 다른 완료 조건이 충족되지 않아도 종료할 수 있다(5.1.3).","이해관계자가 추가 테스트 없이 배포하는 리스크를 검토하고 수용하면 테스트를 종료할 수 있다(5.1.3).","실라버스는 시간 및 예산의 소진도 유효한 완료 조건으로 볼 수 있다고 한다(5.1.3).","정답. 5.1.3."],"ref":"5.1.3"},{"id":"c5-018","ch":5,"lo":"FL-5.1.3","k":2,"q":"애자일 팀이 쓰는 준비의 정의(Definition of Ready)와 완료의 정의(Definition of Done)를 시작 조건(entry criteria)·완료 조건(exit criteria)과 비교한 설명으로 옳은 것은?","opts":["준비의 정의는 사용자 스토리가 개발 및 테스트 활동을 시작하기 위해 충족해야 하는 시작 조건이고, 완료의 정의는 릴리스 가능 항목에 대한 완료 조건이다.","완료의 정의는 사용자 스토리가 개발 및 테스트 활동을 시작하기 위해 충족해야 하는 시작 조건이고, 준비의 정의는 릴리스 가능 항목에 대한 완료 조건이다.","준비의 정의와 완료의 정의는 모두 릴리스 가능 항목에 대한 완료 조건이며, 애자일에서는 시작 조건을 따로 정의하지 않는다.","시작 조건과 완료 조건은 테스트 목적과 관계없이 모든 테스트 레벨에 똑같이 적용되므로, 준비의 정의와 완료의 정의도 테스트 레벨과 무관하게 하나로 정한다."],"ans":[0],"exp":"5.1.3: 애자일 소프트웨어 개발에서 완료 조건을 완료의 정의(Definition of Done)라고 하는 경우가 많으며, 릴리스 가능 항목에 대한 팀의 목표 메트릭을 정의한다. 개발 및 테스트 활동을 시작하기 위해 사용자 스토리가 충족해야 하는 시작 조건을 준비의 정의(Definition of Ready)라고 한다.","why":["정답. 5.1.3.","두 정의가 뒤바뀌었다. 준비의 정의가 시작 조건, 완료의 정의가 완료 조건이다(5.1.3).","준비의 정의는 사용자 스토리가 개발 및 테스트 활동을 시작하기 위해 충족해야 하는 시작 조건이다(5.1.3).","시작 조건과 완료 조건은 각 테스트 레벨에 대해 정의해야 하며 테스트 목적에 따라 달라진다(5.1.3)."],"ref":"5.1.3"},{"id":"c5-019","ch":5,"lo":"FL-5.1.7","k":2,"q":"테스팅 사분면(testing quadrants)에서 탐색적 테스팅, 사용성 테스팅, 사용자 인수 테스팅이 속하는 사분면과 그 관점을 바르게 짝지은 것은?","opts":["2 사분면 – 비즈니스 측면, 팀 지원","3 사분면 – 비즈니스 측면, 제품 평가","4 사분면 – 기술 측면, 제품 평가","1 사분면 – 기술 측면, 팀 지원"],"ans":[1],"exp":"5.1.7: 3 사분면(비즈니스 측면, 제품 평가)은 탐색적 테스팅, 사용성 테스팅, 사용자 인수 테스팅을 포함한다. 이런 테스트는 사용자를 중심으로 이루어지며, 수동으로 실행하는 경우가 많다.","why":["2 사분면은 기능 테스트, 예제, 사용자 스토리 테스트, 사용자 경험 프로토타입, API 테스팅, 시뮬레이션 등을 포함한다(5.1.7).","정답. 5.1.7.","4 사분면은 스모크 테스트와 비기능 테스트(사용성 테스트 제외)를 포함한다(5.1.7).","1 사분면은 컴포넌트 테스트와 컴포넌트 통합 테스트를 포함한다(5.1.7)."],"ref":"5.1.7"},{"id":"c5-020","ch":5,"lo":"FL-5.1.7","k":2,"q":"한 팀이 테스팅 사분면으로 다음 두 테스트를 분류하려 한다.\n· 테스트 A: 보안(security) 품질 특성을 확인하는 비기능 테스트\n· 테스트 B: 사용성 테스트\n실라버스에 따른 분류로 옳은 것은?","opts":["사용성 테스트도 비기능 테스트이므로 테스트 B는 테스트 A와 같은 4 사분면에 속한다.","테스트 A는 1 사분면, 테스트 B는 3 사분면에 속한다.","테스트 A는 4 사분면, 테스트 B는 2 사분면에 속한다.","테스트 A는 4 사분면, 테스트 B는 3 사분면에 속한다."],"ans":[3],"exp":"5.1.7: 4 사분면(기술 측면, 제품 평가)은 스모크 테스트와 비기능 테스트를 포함하되 사용성 테스트는 제외한다. 사용성 테스팅은 3 사분면(비즈니스 측면, 제품 평가)에 속한다.","why":["4 사분면의 비기능 테스트에서 사용성 테스트는 제외된다. 사용성 테스팅은 3 사분면이다(5.1.7).","1 사분면은 컴포넌트 테스트와 컴포넌트 통합 테스트를 포함한다. 사용성을 제외한 비기능 테스트는 4 사분면이다(5.1.7).","2 사분면은 기능 테스트, 예제, 사용자 스토리 테스트 등을 포함한다. 사용성 테스팅은 3 사분면이다(5.1.7).","정답. 5.1.7."],"ref":"5.1.7"},{"id":"c5-021","ch":5,"lo":"FL-5.1.7","k":2,"q":"테스팅 사분면의 1 사분면(Q1)에 대한 설명으로 옳은 것은?","opts":["비즈니스 측면에서 팀을 지원하며, 기능 테스트와 사용자 스토리 테스트를 포함하고, 인수 조건을 확인하며 수동 또는 자동으로 실행할 수 있다.","기술 측면에서 제품을 평가하며, 스모크 테스트와 비기능 테스트(사용성 테스트 제외)를 포함하고, 자동화되는 경우가 많다.","기술 측면에서 팀을 지원하며, 컴포넌트 테스트와 컴포넌트 통합 테스트를 포함하고, 자동화해 지속적인 통합(CI) 프로세스에 포함해야 한다.","비즈니스 측면에서 제품을 평가하며, 탐색적 테스팅과 사용성 테스팅을 포함하고, 사용자 중심이며 수동으로 실행하는 경우가 많다."],"ans":[2],"exp":"5.1.7: 1 사분면(기술 측면, 팀 지원)은 컴포넌트 테스트 및 컴포넌트 통합 테스트를 포함한다. 이런 테스트는 자동화해야 하며, 지속적인 통합(CI) 프로세스에 포함돼야 한다.","why":["2 사분면(비즈니스 측면, 팀 지원) 설명이다(5.1.7).","4 사분면(기술 측면, 제품 평가) 설명이다(5.1.7).","정답. 5.1.7.","3 사분면(비즈니스 측면, 제품 평가) 설명이다(5.1.7)."],"ref":"5.1.7"},{"id":"c5-022","ch":5,"lo":"FL-5.1.7","k":2,"q":"애자일 팀이 API 테스팅과 사용자 경험 프로토타입을 테스팅 사분면에 배치하려 한다. 실라버스에 따른 배치와 그 특징으로 옳은 것은?","opts":["1 사분면 – API 테스팅은 기술적인 테스트이므로 기술 측면·팀 지원에 속하며, 반드시 CI 프로세스에서 자동화해야 한다.","4 사분면 – 기술 측면·제품 평가에 속하며, 자동화되는 경우가 많다.","3 사분면 – 비즈니스 측면·제품 평가에 속하며, 사용자 중심이고 수동으로 실행하는 경우가 많다.","2 사분면 – 비즈니스 측면·팀 지원에 속하며, 인수 조건을 확인하고 수동 또는 자동으로 실행할 수 있다."],"ans":[3],"exp":"5.1.7: 2 사분면(비즈니스 측면, 팀 지원)은 기능 테스트, 예제, 사용자 스토리 테스트, 사용자 경험 프로토타입, API 테스팅, 시뮬레이션 등을 포함한다. 이런 테스트는 인수 조건을 확인하며, 수동으로 실행하거나 자동화할 수 있다.","why":["API 테스팅은 2 사분면에 포함된다. 1 사분면은 컴포넌트 테스트와 컴포넌트 통합 테스트다(5.1.7).","4 사분면은 스모크 테스트와 비기능 테스트(사용성 테스트 제외)다(5.1.7).","3 사분면은 탐색적 테스팅, 사용성 테스팅, 사용자 인수 테스팅이다(5.1.7).","정답. 5.1.7."],"ref":"5.1.7"},{"id":"c5-023","ch":5,"lo":"FL-5.1.7","k":2,"q":"테스팅 사분면 모델에 대한 설명으로 옳은 것은? (두 개를 고르시오)","opts":["팀 지원(support the team) 테스트는 개발을 위한 지침 역할을 하고, 제품 평가(critique the product) 테스트는 기대치 대비 동작을 측정한다.","테스팅 사분면은 순차적 개발 모델에서 테스트 레벨의 실행 순서를 정하기 위해 정의된 모델이다.","모든 테스트 유형이 모든 테스트 레벨과 똑같은 연관성을 가진다는 점을 보여 준다.","개발자, 테스터, 비즈니스 담당자 등 모든 이해관계자에게 테스트 유형을 구분하고 설명하는 방법을 제공한다.","4 사분면 테스트는 사용자 중심이며 수동으로 실행하는 경우가 많다."],"ans":[0,3],"exp":"5.1.7: 브라이언 마릭이 정의한 테스팅 사분면은 애자일 소프트웨어 개발에서 테스트 레벨을 적합한 테스트 유형, 활동, 테스트 기법, 작업 산출물과 묶는다. 테스트 관리자가 필요한 모든 테스트 유형과 테스트 레벨을 SDLC에 포함하고, 테스트 레벨에 따라 테스트 유형별 연관성이 다르다는 점을 이해하도록 돕는다. 또 모든 이해관계자에게 테스트 유형을 구분하고 설명하는 방법을 제공한다. 팀 지원은 개발을 위한 지침, 제품 평가는 기대치 대비 동작 측정을 뜻한다.","why":["정답. 5.1.7.","테스팅 사분면은 애자일 소프트웨어 개발에서 테스트 레벨을 테스트 유형·활동·테스트 기법·작업 산출물과 묶는 모델이다(5.1.7).","반대다. 테스트 레벨에 따라 테스트 유형별 연관성이 다르다는 점을 이해하도록 돕는다(5.1.7).","정답. 5.1.7.","사용자 중심이고 수동인 경우가 많은 것은 3 사분면이다. 4 사분면 테스트는 자동화되는 경우가 많다(5.1.7)."],"ref":"5.1.7"},{"id":"c5-024","ch":5,"lo":"FL-5.2.2","k":2,"q":"모바일 결제 앱 프로젝트에서 다음 리스크가 식별되었다. 이 중 제품 리스크(product risk)는?","opts":["결제 요청에 대한 응답 시간이 부적절하게 길어질 수 있다.","테스트 자동화 도구의 지원이 부족할 수 있다.","테스트 담당자의 기술이 부족할 수 있다.","외부 업체가 맡은 모듈의 인도에 실패할 수 있다."],"ans":[0],"exp":"5.2.2: 제품 리스크는 제품 품질 특성과 관련이 있으며, 부적절한 응답 시간은 실라버스가 든 제품 리스크의 예다. 나머지는 프로젝트 관리 및 제어와 관련된 프로젝트 리스크다.","why":["정답. 5.2.2.","도구 지원 부족은 프로젝트 리스크 중 기술적 문제의 예다(5.2.2).","기술 부족은 프로젝트 리스크 중 인력 문제의 예다(5.2.2).","제3자 인도 실패는 프로젝트 리스크 중 공급업체 문제의 예다(5.2.2)."],"ref":"5.2.2"},{"id":"c5-025","ch":5,"lo":"FL-5.2.2","k":2,"q":"다음 중 프로젝트 리스크(project risk)에 해당하는 것은? (두 개를 고르시오)","opts":["비효율적인 알고리즘","협의되지 않은 개발 범위의 점진적 추가(scope creep)","열악한 아키텍처","보안 취약점","부정확한 추정"],"ans":[1,4],"exp":"5.2.2: 프로젝트 리스크에는 조직 문제(작업 산출물 인도 지연, 부정확한 추정, 예산 축소), 인력 문제, 기술적 문제(협의되지 않은 개발 범위의 점진적 추가, 도구 지원 부족), 공급업체 문제가 있다. 비효율적인 알고리즘, 열악한 아키텍처, 보안 취약점은 제품 리스크의 예다.","why":["제품 리스크의 예다(5.2.2).","정답. 프로젝트 리스크 중 기술적 문제의 예다(5.2.2).","제품 리스크의 예다(5.2.2). '기술적'으로 들려도 제품 품질과 관련된다.","제품 리스크의 예다(5.2.2).","정답. 프로젝트 리스크 중 조직 문제의 예다(5.2.2)."],"ref":"5.2.2"},{"id":"c5-026","ch":5,"lo":"FL-5.2.2","k":2,"q":"프로젝트 리스크 중 '인력 문제'의 예로 실라버스에 제시된 것은?","opts":["부정확한 추정과 예산 축소","도구 지원 부족","갈등과 의사소통 문제","지원 기업의 파산"],"ans":[2],"exp":"5.2.2: 인력 문제의 예는 기술 부족, 갈등, 의사소통 문제, 직원 부족이다.","why":["부정확한 추정과 예산 축소는 조직 문제의 예다(5.2.2).","기술적 문제의 예다(5.2.2).","정답. 5.2.2.","공급업체 문제의 예다(5.2.2)."],"ref":"5.2.2"},{"id":"c5-027","ch":5,"lo":"FL-5.2.2","k":2,"q":"프로젝트 리스크와 제품 리스크를 구별한 설명으로 옳은 것은?","opts":["도구 지원 부족은 테스트 대상 제품의 품질을 떨어뜨리므로 제품 리스크로 분류한다.","프로젝트 리스크는 프로젝트 관리 및 제어와 관련이 있고, 제품 리스크는 제품 품질 특성과 관련이 있다.","제품 리스크는 ISO 25010 같은 품질 모델이 아니라 프로젝트 관리 계획에 정한 일정과 예산에 관련된 리스크다.","런타임 오류와 부정확한 계산은 프로젝트 진행을 늦추므로 프로젝트 리스크로 분류한다."],"ans":[1],"exp":"5.2.2: 프로젝트 리스크는 프로젝트 관리 및 제어와 관련이 있고, 발생하면 프로젝트 일정, 예산, 범위에 영향을 끼쳐 프로젝트의 목표 달성 능력에 영향을 미칠 수 있다. 제품 리스크는 (예: ISO 25010 품질 모델이 설명하는) 제품 품질 특성과 관련이 있다.","why":["도구 지원 부족은 프로젝트 리스크(기술적 문제)의 예다(5.2.2).","정답. 5.2.2.","제품 리스크는 제품 품질 특성(예: ISO 25010 품질 모델)과 관련이 있다(5.2.2).","런타임 오류와 부정확한 계산은 실라버스가 든 제품 리스크의 예다(5.2.2)."],"ref":"5.2.2"},{"id":"c5-028","ch":5,"lo":"FL-5.2.2","k":2,"q":"온라인 뱅킹 앱에서 '이자 계산이 부정확할 수 있다'는 리스크가 식별되었다. 이 리스크의 유형과, 실제로 발현되었을 때 초래될 수 있는 결과를 바르게 짝지은 것은?","opts":["프로젝트 리스크 – 인력 문제로 분류되며, 직원 부족으로 이어질 수 있다.","프로젝트 리스크 – 조직 문제로 분류되며, 작업 산출물 인도 지연으로 이어질 수 있다.","제품 리스크 – 공급업체 문제로 분류되며, 지원 기업의 파산으로 이어질 수 있다.","제품 리스크 – 사용자 불만족이나 매출, 신뢰, 평판 손실로 이어질 수 있다."],"ans":[3],"exp":"5.2.2: 부정확한 계산은 제품 리스크의 예다. 제품 리스크가 발현되면 사용자 불만족, 매출·신뢰·평판 손실, 제3자 피해, 높은 유지보수 비용과 고객지원 부서의 과부하, 형사 처벌, 극단적인 경우 신체적 손상·부상·사망 같은 결과를 초래할 수 있다.","why":["부정확한 계산은 제품 리스크다. 인력 문제와 직원 부족은 프로젝트 리스크의 범주와 예다(5.2.2).","부정확한 계산은 제품 리스크다. 조직 문제와 작업 산출물 인도 지연은 프로젝트 리스크의 범주와 예다(5.2.2).","공급업체 문제와 지원 기업의 파산은 프로젝트 리스크의 범주와 예다(5.2.2).","정답. 5.2.2."],"ref":"5.2.2"},{"id":"c5-029","ch":5,"lo":"FL-5.2.3","k":2,"q":"보험 가입 시스템의 제품 리스크 분석(product risk analysis) 결과, '보험료 산정' 기능의 리스크 수준이 가장 높게 평가되었다.\n실라버스에 따르면 이 분석 결과를 활용하는 방법으로 옳은 것은?","opts":["보험료 산정 기능에 사용할 테스트 기법과 달성할 커버리지를 정하고, 중요 결함을 가능한 한 빨리 찾도록 이 기능의 테스트 우선순위를 높인다.","리스크 분석 결과는 테스트 우선순위지정에만 쓰이므로, 테스트 범위와 테스트 기법은 분석과 관계없이 정한다.","쉽게 찾을 수 있는 결함부터 처리하도록, 리스크 수준이 낮은 기능을 먼저 테스트한다.","제품 리스크 분석은 테스트 실행이 끝난 뒤 남은 리스크를 확인하기 위한 것이므로, 지금 단계에서는 결과를 테스트에 반영하지 않는다."],"ans":[0],"exp":"5.2.3: 제품 리스크 분석은 테스팅의 철저함 정도와 테스트 범위에 영향을 줄 수 있다. 분석 결과는 수행할 테스트 범위 결정, 테스트 레벨 결정 및 수행할 테스트 유형 제안, 사용할 테스트 기법과 달성할 커버리지 결정, 업무별 필요 테스트 노력 추정, 중요 결함을 가능한 한 빨리 식별하기 위한 테스트 우선순위지정, 리스크를 줄이기 위해 테스팅 외 다른 활동을 할 수 있는지 판단에 쓰인다.","why":["정답. 5.2.3.","분석 결과는 우선순위지정뿐 아니라 테스트 범위, 테스트 레벨·테스트 유형, 테스트 기법과 커버리지 결정에도 쓰인다(5.2.3).","우선순위지정의 목적은 중요 결함을 가능한 한 빨리 식별하는 것이다(5.2.3). 리스크가 낮은 기능을 먼저 테스트하는 것은 이와 반대다.","제품 리스크 분석은 SDLC 초기에 시작하는 것이 이상적이며, 그 결과로 테스트 노력을 집중한다(5.2.3)."],"ref":"5.2.3"},{"id":"c5-030","ch":5,"lo":"FL-5.2.3","k":2,"q":"제품 리스크 분석을 이루는 리스크 식별(risk identification)과 리스크 평가(risk assessment)에 대한 설명으로 옳은 것은?","opts":["리스크 식별은 리스크 행렬을 사용해 각 리스크의 리스크 수준을 판단하고 우선순위를 정하는 작업이다.","리스크 평가는 리스크 분류, 발생 가능성·영향·수준 결정, 우선순위지정, 조치 방법 제안을 포함한다.","리스크 분류는 완화 조치를 정하는 데 도움이 되지 않으므로, 리스크 평가에서는 분류 없이 리스크 수준만 결정한다.","정량적 접근법에서 리스크 수준은 리스크 발생 가능성과 리스크 영향을 더한 값으로 계산한다."],"ans":[1],"exp":"5.2.3: 제품 리스크 분석은 리스크 식별과 리스크 평가로 이루어진다. 리스크 식별은 포괄적인 리스크 목록을 만드는 것이고(브레인스토밍, 워크숍, 인터뷰, 원인-결과 다이어그램 등 사용), 리스크 평가는 분류, 발생 가능성·영향·수준 결정, 우선순위지정, 조치 방법 제안을 포함한다. 정량적 접근법은 발생 가능성과 영향을 곱하고, 정성적 접근법은 리스크 행렬로 리스크 수준을 판단하기도 한다.","why":["리스크 식별은 포괄적인 리스크 목록을 만드는 일이다. 리스크 행렬로 수준을 판단하고 우선순위를 정하는 것은 리스크 평가에 속한다(5.2.3).","정답. 5.2.3.","리스크 평가는 분류를 포함하며, 같은 범주의 리스크는 유사한 접근법으로 완화할 수 있는 경우가 많아 분류는 완화 조치를 정하는 데 도움이 된다(5.2.3).","정량적 접근법에서 리스크 수준은 발생 가능성과 영향을 곱한 값이다(5.2.3)."],"ref":"5.2.3"},{"id":"c5-031","ch":5,"lo":"FL-5.2.3","k":2,"q":"제품 리스크 분석 결과의 활용 방법으로 실라버스에 제시된 것은?","opts":["업무별 필요 테스트 노력은 리스크 분석과 관계없이 과거 프로젝트의 평균값으로만 추정한다.","분석 결과로 사용할 테스트 기법은 정하지만, 달성할 커버리지는 리스크와 관계없이 모든 영역에 똑같이 적용한다.","리스크를 줄이기 위해 테스팅 외에 다른 활동을 할 수 있는지 판단한다.","리스크 수준이 높은 영역의 테스트는 다른 테스트가 모두 끝난 뒤 마지막에 실행하도록 정한다."],"ans":[2],"exp":"5.2.3: 제품 리스크 분석 결과는 테스트 범위 결정, 테스트 레벨 결정 및 테스트 유형 제안, 테스트 기법과 커버리지 결정, 업무별 필요 테스트 노력 추정, 중요 결함을 가능한 한 빨리 식별하기 위한 우선순위지정, 리스크를 줄이기 위해 테스팅 외 다른 활동을 할 수 있는지 판단에 쓰인다.","why":["분석 결과는 업무별 필요 테스트 노력을 추정하는 데 쓰인다(5.2.3).","분석 결과는 사용할 테스트 기법과 달성할 커버리지를 함께 정하는 데 쓰인다(5.2.3).","정답. 5.2.3.","분석 결과는 중요 결함을 가능한 한 빨리 식별하도록 테스트 우선순위를 정하는 데 쓰인다(5.2.3)."],"ref":"5.2.3"},{"id":"c5-032","ch":5,"lo":"FL-5.2.4","k":2,"q":"회원 정보 관리 시스템에서 '보안 취약점'이라는 제품 리스크가 높게 평가되었다.\n실라버스에 따르면 테스팅을 통해 이 리스크를 완화하는 조치로 옳은 것은?","opts":["리스크 전가(risk transfer)를 선택한다.","이 리스크 유형에 적절한 경험과 기술을 갖춘 테스터를 선정한다.","리스크가 발현될 때를 대비한 대안 계획(contingency plan)을 세운다.","리스크 수용(risk acceptance)을 선택한다."],"ans":[1],"exp":"5.2.4: 분석된 리스크에 대응하는 방안에는 테스팅을 통한 리스크 완화, 리스크 수용, 리스크 전가, 대안 계획 등이 있다. 테스팅으로 제품 리스크를 완화하는 조치는 적절한 경험과 기술을 갖춘 테스터 선정, 적절한 수준의 테스팅 독립성 적용, 리뷰 및 정적 분석 수행, 적절한 테스트 기법 및 커버리지 수준 적용, 영향을 받는 품질 특성을 다루는 적절한 테스트 유형 적용, 리그레션 테스팅을 포함한 동적 테스팅 수행이다.","why":["리스크 전가는 리스크 대응 방안의 하나지만 테스팅을 통한 완화 조치는 아니다(5.2.4).","정답. 5.2.4.","대안 계획은 리스크 대응 방안의 하나지만 테스팅을 통한 완화 조치는 아니다(5.2.4).","리스크 수용은 리스크 대응 방안의 하나지만 테스팅을 통한 완화 조치는 아니다(5.2.4)."],"ref":"5.2.4"},{"id":"c5-033","ch":5,"lo":"FL-5.2.4","k":2,"q":"제품 리스크 제어(product risk control)를 이루는 리스크 완화(risk mitigation)와 리스크 모니터링(risk monitoring)에 대한 설명으로 옳은 것은?","opts":["리스크 모니터링은 리스크 완화 조치의 효과 확인, 리스크 평가 개선을 위한 정보 확보, 새롭게 나타난 리스크 식별을 목적으로 한다.","리스크 완화는 브레인스토밍, 워크숍, 인터뷰, 원인-결과 다이어그램 등으로 포괄적인 리스크 목록을 만드는 활동이다.","리스크 모니터링은 리스크 평가 때 제안된 조치를 실행해 리스크 수준을 낮추는 활동이고, 리스크 완화는 그 조치가 효과적인지 확인하는 활동이다.","새롭게 나타난 리스크를 찾는 일은 리스크 모니터링의 목적이 아니며, 리스크 분석 단계에서만 한다."],"ans":[0],"exp":"5.2.4: 제품 리스크 제어는 식별 및 평가된 제품 리스크에 대응해 취하는 모든 조치이며, 리스크 완화와 리스크 모니터링으로 이루어진다. 리스크 완화는 리스크 평가 때 제안된 조치를 실행해 리스크 수준을 낮추는 활동이고, 리스크 모니터링의 목적은 완화 조치의 효과 확인, 리스크 평가 개선을 위한 추가 정보 확보, 새롭게 나타난 리스크 식별이다.","why":["정답. 5.2.4.","포괄적인 리스크 목록을 만드는 것은 리스크 식별이다(5.2.3).","두 정의가 뒤바뀌었다. 제안된 조치를 실행해 리스크 수준을 낮추는 것은 리스크 완화이고, 완화 조치가 효과적인지 확인하는 것은 리스크 모니터링의 목적이다(5.2.4).","새롭게 나타난 리스크 식별은 리스크 모니터링의 목적 중 하나다(5.2.4)."],"ref":"5.2.4"},{"id":"c5-034","ch":5,"lo":"FL-5.2.4","k":2,"q":"결제 모듈에서 '부정확한 계산'이라는 제품 리스크가 높게 평가되어, 팀이 이 리스크에 대응할 조치를 정하려 한다.\n다음 중 실라버스가 제시한 '테스팅을 통한 제품 리스크 완화 조치'에 해당하는 것은?","opts":["원인-결과 다이어그램을 그려 결제 모듈의 리스크 목록을 새로 만든다.","적절한 수준의 테스팅 독립성을 적용하고, 리그레션 테스팅을 포함한 동적 테스팅을 수행한다.","결제 모듈 리스크의 발생 가능성과 영향을 곱해 리스크 수준을 다시 계산한다.","테스트 완료 보고서에 '완화되지 않은 리스크'로 기록하고 테스팅을 종료한다."],"ans":[1],"exp":"5.2.4: 테스팅으로 제품 리스크를 완화하는 조치는 적절한 경험과 기술을 갖춘 테스터 선정, 적절한 수준의 테스팅 독립성 적용, 리뷰 및 정적 분석 수행, 적절한 테스트 기법 및 커버리지 수준 적용, 영향을 받는 품질 특성을 다루는 적절한 테스트 유형 적용, 리그레션 테스팅을 포함한 동적 테스팅 수행이다.","why":["원인-결과 다이어그램으로 리스크 목록을 만드는 것은 리스크 식별(리스크 분석)이다(5.2.3).","정답. 5.2.4.","발생 가능성 × 영향으로 리스크 수준을 정하는 것은 리스크 평가(정량적 접근법)다(5.2.3).","완화되지 않은 리스크를 기록하는 것은 테스트 완료 보고서의 내용일 뿐, 테스팅을 통한 완화 조치가 아니다(5.3.2, 5.2.4)."],"ref":"5.2.4"},{"id":"c5-035","ch":5,"lo":"FL-5.3.2","k":2,"q":"시스템 테스트 레벨이 끝나 테스트 완료 보고서(test completion report)를 작성하려 한다. 일반적인 테스트 완료 보고서에 포함되는 내용으로 옳은 것은?","opts":["완화되지 않은 리스크와 수정되지 않은 결함","이해관계자의 역할, 책임, 채용 및 훈련 요구사항","이상 사항을 발견한 절차, 관련 테스트 로그, 기대 결과와 실제 결과","테스트 데이터 요구사항과 테스트 환경 요구사항"],"ans":[0],"exp":"5.3.2: 일반적인 테스트 완료 보고서는 테스트 요약, 원래 테스트 계획에 기반한 테스팅 및 제품 품질 평가, 테스트 계획과의 편차, 테스팅 방해 요소와 대응 방법, 테스트 진행 상황 보고서를 기반으로 한 테스트 메트릭, 완화되지 않은 리스크·수정되지 않은 결함, 테스팅 관련 교훈을 포함한다.","why":["정답. 5.3.2.","테스트 계획서의 '이해관계자' 항목 내용이다(5.1.1).","결함 보고서의 내용이다(5.5).","테스트 계획서의 '테스트 접근법' 항목 내용이다(5.1.1)."],"ref":"5.3.2"},{"id":"c5-036","ch":5,"lo":"FL-5.3.2","k":2,"q":"테스트 진행 상황 보고서(test progress report)의 목적으로 옳은 것은?","opts":["특정 테스트 활동(예: 테스트 레벨, 테스트 주기, 반복 주기)을 요약하며, 정해진 템플릿에 따라 한 번 작성한다.","지속적인 테스트 제어를 지원하며, 테스트 일정·자원·계획을 수정할 수 있을 만큼 충분한 정보를 제공한다.","결함을 처리하고 해결할 책임자에게 장애 재현과 문제 해결을 위한 충분한 정보를 제공한다.","테스팅이 기존 테스트 정책과 테스트 전략을 준수함을 보여 주거나, 준수하지 않는 이유를 설명한다."],"ans":[1],"exp":"5.3.2: 테스트 진행 상황 보고서는 지속적인 테스트 제어를 지원하며, 계획에서 벗어나거나 상황이 바뀌어 테스트 일정, 자원, 테스트 계획을 수정해야 할 경우 그것을 할 수 있는 충분한 정보를 제공해야 한다. 보통 정기적으로(예: 매일, 매주) 작성한다.","why":["테스트 완료 보고서에 대한 설명이다(5.3.2).","정답. 5.3.2.","결함 보고서의 목적이다(5.5).","테스트 계획서의 목적이다(5.1.1)."],"ref":"5.3.2"},{"id":"c5-037","ch":5,"lo":"FL-5.3.2","k":2,"q":"테스트 관리자는 같은 팀 개발자들과 경영진 모두에게 테스트 정보를 보고해야 한다. 보고 대상과 보고 방식에 대한 설명으로 실라버스와 일치하는 것은?","opts":["보고서에 들어갈 정보와 형식은 보고 대상과 관계없이 같아야 하며, 보고 빈도만 대상별로 다르게 한다.","테스트 완료 보고는 같은 팀 구성원에게 매일 비공식적으로 반복해서 하는 것이 일반적이다.","보고 대상에 따라 보고서에 들어갈 정보뿐 아니라 보고의 형식과 빈도도 달라진다.","테스트 진행 상황 보고서는 테스트가 끝난 시점에 한 번만 작성하고, 테스트 진행 중에는 보고하지 않는다."],"ans":[2],"exp":"5.3.2: 보고하는 대상에 따라 보고서에 들어갈 정보가 달라지고(영문 different information, 한글 실라버스에는 '정도'로 표기), 보고의 형식(영문 degree of formality)과 빈도도 달라진다. 같은 팀 구성원에게 테스트 진행 상황을 보고할 때는 빈번하고 비공식적인 경우가 많지만, 테스트 완료 보고는 정해진 템플릿을 따르며 한 번만 이뤄지는 것이 일반적이다.","why":["보고 대상에 따라 들어갈 정보, 형식, 빈도가 모두 달라진다(5.3.2).","테스트 완료 보고는 정해진 템플릿을 따르며 한 번만 이뤄지는 것이 일반적이다(5.3.2).","정답. 5.3.2.","진행 상황 보고서는 테스트 모니터링·제어 중 정기적으로(예: 매일, 매주) 작성한다(5.3.2)."],"ref":"5.3.2"},{"id":"c5-038","ch":5,"lo":"FL-5.3.3","k":2,"q":"서울과 뉴욕에 팀원이 나뉘어 있는 분산 팀이 테스트 상황을 공유하려 한다. 시차 때문에 직접 대화할 시간이 거의 없다.\n실라버스에 따른 설명으로 옳은 것은?","opts":["물리적 거리나 시차로 직접 대화가 어려운 분산 팀에는 더 공식적인 의사소통 방법이 적합할 수 있다.","테스트 상황은 한 가지 의사소통 방법으로만 전달해야 하므로, 대시보드와 이메일을 함께 쓰면 안 된다.","분산 팀이라도 대면 대화가 언제나 가장 좋은 방법이므로, 다른 의사소통 방법은 쓰지 않는다.","모든 이해관계자는 같은 정보에 관심이 있으므로, 같은 내용을 같은 방식으로 전달한다."],"ans":[0],"exp":"5.3.3: 테스트 상황 전달 방법은 하나 이상을 함께 쓸 수 있다. 물리적 거리나 시차로 직접적인 대화가 어려운 분산된 팀은 더욱 공식적인 의사소통 방법을 사용하는 것이 적합할 수 있다. 이해관계자마다 관심 정보가 다르므로 의사소통 방식을 그에 맞게 조정할 필요가 있다.","why":["정답. 5.3.3.","의사소통 방법은 하나 이상을 사용할 수 있다(5.3.3).","가장 좋은 방법은 상황에 따라 달라지며, 분산 팀에는 더 공식적인 방법이 적합할 수 있다(5.3.3).","보통 이해관계자마다 관심을 가지는 정보가 달라, 의사소통 방식을 그에 맞게 조정할 필요가 있다(5.3.3)."],"ref":"5.3.3"},{"id":"c5-039","ch":5,"lo":"FL-5.3.3","k":2,"q":"테스트 상황을 전달하는 방법(왼쪽)과 실라버스가 그 방법의 예로 든 것(오른쪽)을 바르게 짝지은 것은?","opts":["대시보드 – 이메일","전자 통신 채널 – 태스크 보드","공식 테스트 보고서 – 채팅","대시보드 – 번다운 차트"],"ans":[3],"exp":"5.3.3: 대시보드(dashboards)의 예는 지속적 통합/지속적 전달 대시보드(CI/CD dashboards), 태스크 보드(task boards), 번다운 차트(burn-down charts)이고, 전자 통신 채널(electronic communication channels)의 예는 이메일(email)과 채팅(chat)이다. 이 밖에 팀원 및 기타 이해관계자와의 대화, 온라인 문서, 공식 테스트 보고서(formal test reports)가 있다.","why":["이메일은 대시보드가 아니라 전자 통신 채널의 예다(5.3.3).","태스크 보드는 전자 통신 채널이 아니라 대시보드의 예다(5.3.3).","채팅은 공식 테스트 보고서가 아니라 전자 통신 채널의 예다(5.3.3).","정답. 번다운 차트는 대시보드의 예다(5.3.3)."],"ref":"5.3.3"},{"id":"c5-040","ch":5,"lo":"FL-5.3.3","k":2,"q":"테스트 상황을 전달하는 가장 좋은 의사소통 방법에 대한 설명으로 실라버스와 일치하는 것은?","opts":["공식 테스트 보고서가 가장 좋은 방법으로 정해져 있으므로, 테스트 관리자의 관심이나 조직의 테스트 전략, 규제 표준은 고려하지 않는다.","테스트 관리자의 관심, 조직의 테스트 전략, 규제 표준, 자체 조직 팀(self-organizing team)이면 팀 자체에 따라 달라진다.","자체 조직 팀이라도 테스트 상황 전달 방법은 팀 밖의 조직에서 정해지며, 팀 자체는 의사소통 방법을 고르는 데 영향을 주지 않는다.","규제 표준은 테스트 상황 전달 방법과 관계가 없으므로, 테스트 관리자의 관심과 조직의 테스트 전략만 고려해 의사소통 방법을 정한다."],"ans":[1],"exp":"5.3.3: 테스트 상황을 전달하는 가장 좋은 의사소통 방법은 테스트 관리자의 관심, 조직의 테스트 전략, 규제 표준, 또 자체 조직 팀일 경우 팀 자체에 따라서도 달라진다.","why":["가장 좋은 방법은 테스트 관리자의 관심, 조직의 테스트 전략, 규제 표준 등에 따라 달라지며, 공식 테스트 보고서는 여러 선택지 중 하나다(5.3.3).","정답. 5.3.3.","자체 조직 팀일 경우 팀 자체에 따라서도 달라진다(5.3.3).","규제 표준도 방법을 좌우하는 요인이며, 테스트 관리자의 관심과 조직의 테스트 전략만으로 정해지지 않는다(5.3.3)."],"ref":"5.3.3"},{"id":"c5-041","ch":5,"lo":"FL-5.4.1","k":2,"q":"테스트 환경의 구성(서버 OS, 데이터베이스, 라이브러리 버전)이 테스팅용으로 승인되었다. 이후 한 개발자가 라이브러리 버전을 바꾸려 한다.\n형상 관리(configuration management) 관점에서 실라버스와 일치하는 설명은?","opts":["형상 관리는 소스 코드만 대상으로 하므로, 테스트 환경 변경은 형상 관리와 관계없다.","베이스라인은 테스트가 모두 끝난 뒤에 만들어지므로, 지금은 자유롭게 바꿔도 된다.","승인된 형상 항목은 베이스라인이 되며, 공식적인 변경 제어 프로세스를 통해서만 변경할 수 있다.","테스트 환경 같은 복잡한 형상 항목은 버전만 기록하고, 구성 항목과 항목 간 관계는 기록하지 않는다."],"ans":[2],"exp":"5.4: 테스트 환경 같은 복잡한 형상 항목의 경우 형상 관리는 구성 항목, 항목 간 관계, 버전을 기록한다. 형상 항목이 테스팅용으로 승인되면 베이스라인이 되며, 공식적인 변경 제어 프로세스를 통해서만 수정할 수 있다.","why":["형상 관리는 테스트 계획서, 테스트 케이스, 테스트 로그 같은 작업 산출물과 테스트 환경 같은 복잡한 형상 항목도 다룬다(5.4).","형상 항목이 테스팅용으로 승인되면 그때 베이스라인이 된다(5.4).","정답. 5.4.","복잡한 형상 항목은 구성 항목, 항목 간 관계, 버전을 기록한다(5.4)."],"ref":"5.4"},{"id":"c5-042","ch":5,"lo":"FL-5.4.1","k":2,"q":"석 달 전 릴리스 버전에서 얻었던 테스트 결과를 다시 재현해야 하는 상황이 생겼다. 형상 관리가 이를 어떻게 지원하는가?","opts":["새 베이스라인을 만들 때 변경된 형상 항목의 기록을 유지하므로, 이전 베이스라인으로 되돌려 이전 테스트 결과를 재현할 수 있다.","형상 관리는 최신 베이스라인만 보관하므로, 이전 테스트 결과는 테스트 완료 보고서로만 확인할 수 있다.","형상 관리는 결함을 발견부터 종료까지 처리하는 작업 흐름을 제공하므로, 종료된 결함 보고서를 다시 열어 재현한다.","테스트 결과와 테스트 로그는 형상 항목이 아니므로, 형상 관리로는 재현할 수 없다."],"ans":[0],"exp":"5.4: 형상 관리는 새 베이스라인을 만들 때 변경된 형상 항목에 대한 기록을 유지한다. 이전 베이스라인으로 되돌리면 이전 테스트 결과를 재현할 수 있다.","why":["정답. 5.4.","형상 관리는 변경된 형상 항목의 기록을 유지하며, 이전 베이스라인으로 되돌릴 수 있다(5.4).","발견부터 종료까지의 작업 흐름은 결함 관리 프로세스의 내용이다(5.5).","테스트 결과와 테스트 로그도 형상 관리가 형상 항목으로 다루는 작업 산출물이다(5.4)."],"ref":"5.4"},{"id":"c5-043","ch":5,"lo":"FL-5.4.1","k":2,"q":"테스팅을 적절히 지원하기 위해 형상 관리가 보장하는 것으로 옳은 것은?","opts":["테스트 케이스의 실행 순서를 리스크 분석 결과에 따라 정해, 가장 중요한 리스크를 다루는 테스트를 먼저 실행한다.","보고된 이상 사항이 실제 결함인지, 거짓-양성 결과나 변경 요청인지를 판정하고 결함 보고서를 종료한다.","형상 항목은 테스트 대상 소프트웨어로 한정되며, 테스트 케이스, 테스트 스크립트, 테스트 결과 같은 테스트웨어는 제외된다.","모든 형상 항목이 고유하게 식별되고, 버전이 관리되며, 변경이 추적되고, 다른 형상 항목과 연관되어 추적성이 유지된다."],"ans":[3],"exp":"5.4: 테스팅을 적절히 지원하기 위해 형상 관리는 테스트 항목을 포함한 모든 형상 항목에 고유한 식별자가 부여되고, 버전이 관리되며, 변경사항이 추적되고, 다른 형상 항목과의 연관성이 식별돼 테스트 프로세스 전체에서 추적성이 유지되도록 보장한다. 또 식별된 모든 문서와 소프트웨어 항목이 테스트웨어 내에서 명확하게 참조되도록 보장한다.","why":["리스크 기반 우선순위지정에 대한 설명이다(5.1.5).","보고된 이상 사항이 결함인지, 거짓-양성 결과나 변경 요청인지는 결함 보고서를 처리하는 과정(결함 관리)에서 가려진다(5.5).","형상 관리는 테스트 계획서, 테스트 케이스, 테스트 스크립트, 테스트 결과, 테스트 로그 같은 작업 산출물도 형상 항목으로 다룬다(5.4).","정답. 5.4."],"ref":"5.4"},{"id":"c5-044","ch":5,"lo":"FL-5.4.1","k":2,"q":"팀이 지속적 통합, 지속적 전달, 지속적 배포와 관련 테스팅을 자동화된 데브옵스(DevOps) 파이프라인으로 구현하려 한다.\n형상 관리와 관련해 실라버스 설명과 일치하는 것은?","opts":["파이프라인이 자동화되면 형상 항목의 버전 관리는 더 이상 필요하지 않다.","자동화된 파이프라인에서는 승인된 베이스라인도 공식적인 변경 제어 없이 누구나 수정할 수 있다.","이런 데브옵스 파이프라인에는 보통 자동화된 형상 관리가 포함된다.","식별된 문서와 소프트웨어 항목은 파이프라인 안에서만 관리되므로, 테스트웨어에서 참조할 필요가 없다."],"ans":[2],"exp":"5.4: 지속적 통합, 지속적 전달, 지속적 배포, 그리고 관련된 테스팅은 일반적으로 자동화된 데브옵스 파이프라인으로 구현하며, 여기에 보통 자동화된 형상 관리가 포함돼 있다.","why":["형상 관리는 모든 형상 항목의 버전 관리를 보장하며, 파이프라인에는 보통 자동화된 형상 관리가 포함된다(5.4).","베이스라인은 공식적인 변경 제어 프로세스를 통해서만 수정할 수 있다(5.4).","정답. 5.4.","형상 관리는 식별된 모든 문서와 소프트웨어 항목이 테스트웨어 내에서 명확하게 참조되도록 보장한다(5.4)."],"ref":"5.4"},{"id":"c5k3-001","ch":5,"lo":"FL-5.1.4","k":3,"q":"도서관 좌석 예약 앱에 '빈자리 알림' 기능이 추가된다. 테스트 리더는 이 기능의 테스트 노력을 3점 추정(three-point estimation)으로 구하려고 전문가에게 다음 세 값을 받았다.\n• 가장 낙관적인 추정치(a): 10 맨아워(MH)\n• 확률적으로 가장 높은 추정치(m): 16 맨아워\n• 가장 비관적인 추정치(b): 28 맨아워\n실라버스가 제시하는 계산식으로 최종 추정치(E)와 측정 오류(표준 편차, SD)를 구해 '최종 추정치 ± 표준 편차' 형태로 보고하려 한다. 보고할 값으로 옳은 것은?","opts":["17 ± 3 맨아워 (14~20 맨아워)","18 ± 3 맨아워 (15~21 맨아워)","16 ± 3 맨아워 (13~19 맨아워)","17 ± 2 맨아워 (15~19 맨아워)"],"ans":[0],"exp":"3점 추정(5.1.4)은 E=(a+4×m+b)/6, SD=(b−a)/6을 쓴다.\n① E=(10+4×16+28)/6=(10+64+28)/6=102/6=17\n② SD=(28−10)/6=18/6=3\n③ 17±3이므로 14~20 맨아워 사이다.\n검산: 6×17=102, 6×3=18. 하한 17−3=14, 상한 17+3=20.","why":["정답. E=102/6=17, SD=18/6=3이다.","세 값의 단순 평균 (10+16+28)/3=18을 쓴 경우다. 3점 추정은 m에 4배 가중치를 주는 가중 산술 평균이다.","확률적으로 가장 높은 추정치(m)=16을 그대로 최종 추정치로 쓴 경우다. 최종 추정치는 세 값의 가중 산술 평균이다.","표준 편차를 (b−m)/6=(28−16)/6=2로 잘못 계산한 경우다. 실라버스의 SD는 (b−a)/6이다."],"ref":"5.1.4"},{"id":"c5k3-002","ch":5,"lo":"FL-5.1.4","k":3,"q":"온라인 결제 모듈의 리그레션 테스트 준비 작업은 규모가 커서, 테스트 리더가 이를 세 개의 작은 작업으로 나눈 뒤 각각을 3점 추정(three-point estimation)으로 추정했다(단위: 맨아워).\n실라버스의 계산식을 적용할 때, 세 작업 전체의 최종 추정치(E)는 얼마인가?","table":{"head":["작업","가장 낙관적(a)","확률적으로 가장 높음(m)","가장 비관적(b)"],"rows":[["테스트 데이터 준비","4","7","16"],["테스트 스크립트 수정","6","12","24"],["테스트 환경 점검","2","5","14"]]},"opts":["24 맨아워","27 맨아워","30 맨아워","33 맨아워"],"ans":[1],"exp":"5.1.4에 따르면 작은 작업의 추정치가 보통 더 정확하므로 큰 작업은 작은 작업으로 나눠 추정한다. 3점 추정의 최종 추정치는 E=(a+4×m+b)/6이다.\n① 테스트 데이터 준비: (4+28+16)/6=48/6=8\n② 테스트 스크립트 수정: (6+48+24)/6=78/6=13\n③ 테스트 환경 점검: (2+20+14)/6=36/6=6\n④ 합계: 8+13+6=27 맨아워\n검산: a, m, b를 각각 먼저 더해(12, 24, 54) 한 번에 계산해도 (12+4×24+54)/6=162/6=27로 같다.","why":["m 값만 더한 것이다(7+12+5=24). 3점 추정은 a와 b도 반영하는 가중 산술 평균이다.","정답. 작업별 E는 8, 13, 6이고 합은 27이다.","작업마다 세 값의 단순 평균(9, 14, 7)을 구해 더한 것이다. m에 4배 가중치를 주지 않았다.","작업마다 a와 b의 중간값(10, 15, 8)을 구해 더한 것이다. 확률적으로 가장 높은 추정치(m)를 빠뜨렸다."],"ref":"5.1.4"},{"id":"c5k3-003","ch":5,"lo":"FL-5.1.4","k":3,"q":"쇼핑몰의 두 기능 X, Y에 대해 전문가가 3점 추정(three-point estimation)을 했다(단위: 맨아워).\n실라버스의 계산식을 적용한 결과에 대한 설명으로 옳은 것은? (두 개를 고르시오)","table":{"head":["기능","가장 낙관적(a)","확률적으로 가장 높음(m)","가장 비관적(b)"],"rows":[["X","12","15","24"],["Y","8","14","32"]]},"opts":["Y는 확률적으로 가장 높은 추정치(m)가 X보다 작으므로 최종 추정치(E)도 X보다 작다.","X와 Y의 최종 추정치(E)는 둘 다 16 맨아워이다.","X의 최종 추정치는 17 맨아워, Y의 최종 추정치는 18 맨아워이다.","최종 추정치가 같으면 측정 오류(표준 편차)도 같으므로, 두 기능의 추정 범위는 같다.","Y의 표준 편차는 4 맨아워로 X의 2배이며, Y의 추정 범위(12~20)가 X의 추정 범위(14~18)보다 넓다."],"ans":[1,4],"exp":"5.1.4의 3점 추정: E=(a+4×m+b)/6, SD=(b−a)/6.\n① X: E=(12+60+24)/6=96/6=16, SD=(24−12)/6=12/6=2 → 16±2(14~18)\n② Y: E=(8+56+32)/6=96/6=16, SD=(32−8)/6=24/6=4 → 16±4(12~20)\n두 기능의 E는 같지만, a와 b의 간격이 넓은 Y의 SD가 X의 2배다.\n검산: 6×16=96, 6×2=12, 6×4=24.","why":["m만 비교한 판단이다. Y는 b가 커서 E가 X와 같은 16이 된다.","정답. 두 기능 모두 E=96/6=16이다.","세 값의 단순 평균(51/3=17, 54/3=18)을 쓴 경우다.","SD=(b−a)/6이므로 a와 b의 간격에 따라 달라진다. X는 2, Y는 4로 다르다.","정답. Y의 SD=(32−8)/6=4, X의 SD=(24−12)/6=2이다."],"ref":"5.1.4"},{"id":"c5k3-004","ch":5,"lo":"FL-5.1.4","k":3,"q":"한 조직은 자기 조직의 과거 프로젝트 데이터에서 '표준' 비율을 뽑아 테스트 노력을 추정하는 비율 기반 추정(estimation based on ratios)을 쓴다. 이번 신규 프로젝트와 비슷한 직전 프로젝트의 기록은 다음과 같다.\n• 프로젝트 전체 노력(개발+테스트): 1,200MD(person-day)\n• 그중 테스트 노력: 300MD\n신규 프로젝트의 개발 노력은 840MD로 예상된다. 직전 프로젝트의 '개발 노력 대 테스트 노력' 비율을 적용하면 신규 프로젝트의 테스트 노력 추정치는 얼마인가?","opts":["210MD","280MD","300MD","2,520MD"],"ans":[1],"exp":"비율 기반 추정(5.1.4)은 조직의 이전 프로젝트에서 수집한 수치로 '표준' 비율을 도출해 새 프로젝트에 적용하는 메트릭 기반 기법이다.\n① 직전 프로젝트 개발 노력 = 1,200−300 = 900MD\n② 개발 노력 : 테스트 노력 = 900 : 300 = 3 : 1\n③ 신규 프로젝트 테스트 노력 = 840 ÷ 3 = 280MD\n검산: 840 : 280 = 3 : 1로 직전 프로젝트 비율과 같다.","why":["테스트가 전체 노력에서 차지하는 비율(300/1,200=25%)을 개발 노력 840MD에 곱한 경우다. 840MD는 전체 노력이 아니라 개발 노력이다.","정답. 개발:테스트=3:1이므로 840÷3=280MD이다.","직전 프로젝트의 테스트 노력을 그대로 가져온 경우다. 비율 기반 추정은 비율을 새 프로젝트 규모에 적용한다.","비율을 거꾸로 적용한 경우다(840×3). 테스트 노력은 개발 노력의 1/3이다."],"ref":"5.1.4"},{"id":"c5k3-005","ch":5,"lo":"FL-5.1.4","k":3,"q":"반복적 소프트웨어 개발수명주기(SDLC)로 개발하는 팀이 지금까지 다섯 번의 반복 주기에서 실제로 투입한 테스트 노력은 표와 같다.\n팀은 외삽법(extrapolation)을 적용해, 직전 세 번의 반복 주기에 들인 평균 노력으로 6번째 반복 주기의 테스트 노력을 추정하기로 했다. 추정치는 얼마인가?","table":{"head":["반복 주기","1","2","3","4","5"],"rows":[["테스트 노력(MD)","21","30","27","33","36"]]},"opts":["26MD","29.4MD","32MD","36MD"],"ans":[2],"exp":"외삽법(5.1.4)은 현재 프로젝트에서 가능한 한 빨리 측정한 데이터로 남은 작업의 노력을 추정하는 메트릭 기반 기법이며, 반복적 SDLC에 잘 맞는다.\n① 직전 세 번의 반복 주기 = 3, 4, 5번째\n② (27+33+36)/3 = 96/3 = 32MD\n검산: 27+33=60, 60+36=96, 32×3=96.","why":["처음 세 번(1~3번째)의 평균 (21+30+27)/3=78/3=26이다. 직전 세 번이 아니다.","다섯 번 전체의 평균 147/5=29.4이다. 팀이 정한 기준(직전 세 번)과 다르다.","정답. 3~5번째 반복 주기의 평균이 32MD다.","마지막 반복 주기 값만 쓴 경우다."],"ref":"5.1.4"},{"id":"c5k3-006","ch":5,"lo":"FL-5.1.4","k":3,"q":"한 시스템 테스팅에서 실행할 테스트 케이스는 모두 300개다. 테스트 리더는 실행 첫 2주 동안 실제로 들어간 노력을 측정했고, 테스트 케이스 80개를 실행하는 데 64맨아워(MH)가 들었다. 남은 테스트 케이스도 같은 비율로 노력이 든다고 보고(단순 비례 모델), 남은 작업에 필요한 노력을 추정하려 한다.\n이 상황에서 쓰는 추정 기법과 남은 작업의 추정치로 옳은 것은?","opts":["외삽법(extrapolation), 176맨아워","외삽법(extrapolation), 240맨아워","외삽법(extrapolation), 275맨아워","비율 기반 추정(estimation based on ratios), 176맨아워"],"ans":[0],"exp":"현재 프로젝트에서 가능한 한 빨리 측정한 데이터를 수학적 모델로 늘려 남은 작업의 노력을 근사하는 것은 외삽법이다(5.1.4). 비율 기반 추정은 조직의 이전 프로젝트 수치로 만든 '표준' 비율을 쓴다.\n① 테스트 케이스 1개당 노력 = 64 ÷ 80 = 0.8맨아워\n② 남은 테스트 케이스 = 300 − 80 = 220개\n③ 남은 노력 = 220 × 0.8 = 176맨아워\n검산: 176 ÷ 220 = 0.8로 측정한 비율(64 ÷ 80 = 0.8)과 같다.","why":["정답. 현재 프로젝트의 측정치로 남은 220개에 176맨아워를 추정했다.","300개 전체에 0.8맨아워를 곱한 값이다. 이미 실행한 80개를 빼지 않았다.","220을 0.8로 나눈 값이다. 1개당 0.8맨아워가 들므로 곱해야 한다.","비율 기반 추정은 이전 프로젝트에서 얻은 '표준' 비율을 쓴다. 여기서는 현재 프로젝트의 측정치를 쓰므로 외삽법이다."],"ref":"5.1.4"},{"id":"c5k3-007","ch":5,"lo":"FL-5.1.4","k":3,"q":"네 명의 전문가가 와이드밴드 델파이(Wideband Delphi)로 '정산 배치' 기능의 테스트 노력을 추정한다. 팀은 미리 '가장 큰 추정치와 가장 작은 추정치의 차이가 5MD 이하이면 합의된 것으로 본다'는 범위를 정했다. 각 전문가가 혼자 추정한 1차 결과는 18MD, 20MD, 21MD, 32MD였다.\n실라버스가 설명하는 와이드밴드 델파이 절차에 따라 다음에 할 일로 옳은 것은?","opts":["네 추정치의 평균인 22.75MD를 최종 추정치로 확정한다.","합의된 범위를 벗어난 32MD를 빼고, 나머지 세 값의 평균인 약 19.7MD를 최종 추정치로 한다.","편차가 크므로 경력이 가장 긴 전문가 한 명의 추정치를 최종 추정치로 채택한다.","전문가들이 각자의 현재 추정치에 대해 논의한 뒤, 그 결과를 바탕으로 각자 다시 혼자 새 추정치를 낸다."],"ans":[3],"exp":"와이드밴드 델파이(5.1.4)는 반복적인 전문가 기반 기법이다. 각 전문가가 혼자 추정하고, 추정치의 편차가 합의된 범위를 벗어나면 현재 추정치를 놓고 논의한 뒤 다시 각자 새로 추정한다. 합의에 이를 때까지 이 과정을 반복한다.\n① 1차 결과의 차이 = 32 − 18 = 14MD\n② 14MD > 5MD이므로 합의된 범위를 벗어났다.\n③ 따라서 논의 후 각자 재추정하는 다음 라운드를 진행한다.","why":["편차가 범위를 벗어났는데 평균((18+20+21+32)/4=22.75)으로 끝내면 논의와 재추정 단계가 빠진다.","범위를 벗어난 값을 버리는 단계는 없다. 벗어난 편차는 논의할 대상이다.","한 사람의 추정치를 고르는 방식은 와이드밴드 델파이가 아니다. 합의에 이를 때까지 논의와 재추정을 반복한다.","정답. 차이가 14MD로 합의된 범위(5MD)를 넘었으므로 논의한 뒤 각자 다시 추정한다."],"ref":"5.1.4"},{"id":"c5k3-008","ch":5,"lo":"FL-5.1.5","k":3,"q":"보험 청구 웹 시스템의 테스트 케이스 다섯 개를 리스크 기반 우선순위지정(risk-based prioritization)으로 정렬하려 한다. 리스크 수준은 정량적 접근법(리스크 발생 가능성 × 리스크 영향)으로 계산하며, 값이 클수록 중요한 리스크다. 단, TC-E는 TC-B가 만든 청구 데이터를 쓰므로 TC-B가 먼저 실행돼야 한다.\n가장 중요한 리스크를 다루는 테스트 케이스를 가능한 한 먼저 실행하면서 종속성을 지키는 실행 순서는?","table":{"head":["테스트 케이스","리스크 발생 가능성","리스크 영향(점수)","종속성"],"rows":[["TC-A","0.6","5","없음"],["TC-B","0.2","9","없음"],["TC-C","0.8","3","없음"],["TC-D","0.4","4","없음"],["TC-E","0.5","7","TC-B 이후 실행"]]},"opts":["TC-E → TC-A → TC-C → TC-B → TC-D","TC-B → TC-E → TC-A → TC-D → TC-C","TC-A → TC-C → TC-B → TC-E → TC-D","TC-B → TC-E → TC-A → TC-C → TC-D"],"ans":[3],"exp":"리스크 기반 우선순위지정은 리스크 분석 결과에 따라 가장 중요한 리스크를 다루는 테스트 케이스를 먼저 실행한다(5.1.5). 정량적 접근법에서 리스크 수준은 발생 가능성과 영향을 곱한 값이다(5.2.3).\n① 리스크 수준: A=0.6×5=3.0, B=0.2×9=1.8, C=0.8×3=2.4, D=0.4×4=1.6, E=0.5×7=3.5\n② 높은 순서: E(3.5) > A(3.0) > C(2.4) > B(1.8) > D(1.6)\n③ 우선순위가 높은 TC-E가 낮은 TC-B에 종속되므로 TC-B를 먼저 실행한다(5.1.5).\n④ 결과: TC-B → TC-E → TC-A → TC-C → TC-D","why":["리스크 수준 순서는 맞지만 TC-E가 TC-B보다 먼저 실행돼 종속성을 어긴다.","리스크 영향 점수만으로 정렬한 순서다(9, 7, 5, 4, 3). 발생 가능성을 곱하면 TC-C(2.4)가 TC-D(1.6)보다 높다.","지금 실행할 수 있는 것부터 고르다 보니 리스크 수준이 가장 높은 TC-E가 네 번째로 밀렸다. 가장 중요한 리스크를 먼저 다룬다는 목표에 맞지 않는다.","정답. 리스크 수준 1위인 TC-E를 위해 TC-B를 먼저 실행하고, 나머지는 TC-A(3.0), TC-C(2.4), TC-D(1.6) 순이다."],"ref":"5.1.5"},{"id":"c5k3-009","ch":5,"lo":"FL-5.1.5","k":3,"q":"요구사항 기반 우선순위지정(requirements-based prioritization)으로 테스트 실행 일정을 짠다. 요구사항 우선순위는 이해관계자가 정했고 1이 가장 높다. 각 테스트 케이스는 표의 요구사항으로 추적되며, 종속성이 있는 테스트 케이스는 선행 테스트 케이스가 끝나야 실행할 수 있다.\n가장 중요한 요구사항의 테스트 케이스를 가능한 한 먼저 실행하도록 일정을 짤 때, 네 번째로 실행하는 테스트 케이스는?","table":{"head":["테스트 케이스","추적되는 요구사항","요구사항 우선순위","종속성"],"rows":[["TC-1","REQ-C","3","없음"],["TC-2","REQ-A","1","TC-4 이후 실행"],["TC-3","REQ-E","5","없음"],["TC-4","REQ-D","4","TC-3 이후 실행"],["TC-5","REQ-B","2","없음"]]},"opts":["TC-1","TC-2","TC-4","TC-5"],"ans":[3],"exp":"요구사항 기반 우선순위지정은 테스트 케이스가 추적되는 요구사항의 우선순위대로 실행 순서를 정하며, 요구사항 우선순위는 이해관계자가 정한다(5.1.5). 우선순위가 높은 테스트 케이스가 낮은 테스트 케이스에 종속되면 낮은 쪽을 먼저 실행한다.\n① 가장 높은 TC-2(1)는 TC-4에 종속되고, TC-4는 다시 TC-3에 종속된다.\n② 그래서 TC-3 → TC-4 → TC-2 순으로 먼저 실행한다.\n③ 남은 것은 우선순위대로 TC-5(2) → TC-1(3)\n④ 전체: TC-3 → TC-4 → TC-2 → TC-5 → TC-1. 네 번째는 TC-5다.","why":["TC-1은 다섯 번째다. TC-4가 TC-3에 종속된다는 점을 빠뜨리면 TC-4 → TC-2 → TC-5 → TC-1 순으로 착각해 TC-1을 네 번째로 고르게 된다.","TC-2는 세 번째다(TC-3, TC-4 다음).","종속성을 무시하고 우선순위 숫자만 따르면 TC-2 → TC-5 → TC-1 → TC-4 순이 되어 TC-4가 네 번째가 된다. 실제로 TC-4는 두 번째다.","정답. TC-3 → TC-4 → TC-2 다음 네 번째로 TC-5를 실행한다."],"ref":"5.1.5"},{"id":"c5k3-010","ch":5,"lo":"FL-5.1.5","k":3,"q":"한 컴포넌트에는 실행 가능한 구문이 S1~S12, 모두 12개 있다. 테스트 케이스 네 개가 실행하는 구문은 표와 같다. 팀은 구문 커버리지(statement coverage)를 기준으로 추가 커버리지 우선순위지정(additional coverage prioritization)을 적용한다.\n실행 순서로 옳은 것은?","table":{"head":["테스트 케이스","실행하는 구문","구문 수"],"rows":[["TC-1","S1, S2, S3, S4, S5, S6, S7","7"],["TC-2","S1, S2, S3, S4, S5, S8","6"],["TC-3","S8, S9, S10, S11","4"],["TC-4","S6, S7, S12","3"]]},"opts":["TC-1 → TC-2 → TC-3 → TC-4","TC-1 → TC-3 → TC-4 → TC-2","TC-1 → TC-3 → TC-2 → TC-4","TC-4 → TC-3 → TC-2 → TC-1"],"ans":[1],"exp":"추가 커버리지 우선순위지정은 가장 높은 커버리지를 달성하는 테스트 케이스를 먼저 실행하고, 그다음부터는 가장 높은 추가 커버리지를 달성하는 테스트 케이스를 실행한다(5.1.5).\n① 첫 번째: 구문이 가장 많은 TC-1(7개). 커버된 구문 S1~S7\n② 새로 늘어나는 구문: TC-2는 S8 1개, TC-3은 S8~S11 4개, TC-4는 S12 1개 → TC-3. 커버된 구문 S1~S11\n③ 새로 늘어나는 구문: TC-2는 0개, TC-4는 S12 1개 → TC-4. 12개 모두 커버(100%)\n④ 마지막: TC-2\n결과: TC-1 → TC-3 → TC-4 → TC-2","why":["각 테스트 케이스의 전체 구문 수 순서(7, 6, 4, 3)다. 이는 기본 커버리지 기반 우선순위지정이다. TC-2는 TC-1과 겹쳐 새로 늘리는 구문이 S8 하나뿐이다.","정답. 매 단계 새로 커버하는 구문이 가장 많은 테스트 케이스를 골랐다.","세 번째 단계에서 TC-2가 새로 늘리는 구문은 0개(S8은 TC-3이 이미 커버)이고 TC-4는 S12 1개이므로 TC-4가 먼저다.","구문 수가 적은 순서다. 커버리지가 가장 높은 테스트 케이스부터 실행해야 한다."],"ref":"5.1.5"},{"id":"c5k3-011","ch":5,"lo":"FL-5.1.5","k":3,"q":"회의실 예약 시스템의 테스트 케이스 네 개에 대한 정보가 표와 같다. 팀은 이번 테스트 실행 일정을 커버리지 기반 우선순위지정(coverage-based prioritization)으로 짜기로 했다(추가 커버리지 변형은 쓰지 않는다). TC-3은 TC-2가 만든 예약 데이터가 있어야 실행할 수 있다.\n커버리지가 가장 높은 테스트 케이스를 가능한 한 먼저 실행하면서 종속성을 지키는 실행 순서는?","table":{"head":["테스트 케이스","리스크 수준","관련 요구사항 우선순위(1이 가장 높음)","구문 커버리지","종속성"],"rows":[["TC-1","9","3","40%","없음"],["TC-2","4","1","25%","없음"],["TC-3","6","2","70%","TC-2 이후 실행"],["TC-4","2","4","55%","없음"]]},"opts":["TC-1 → TC-2 → TC-3 → TC-4","TC-3 → TC-4 → TC-1 → TC-2","TC-2 → TC-3 → TC-4 → TC-1","TC-2 → TC-3 → TC-1 → TC-4"],"ans":[2],"exp":"커버리지 기반 우선순위지정은 커버리지(예: 구문 커버리지)가 가장 높은 테스트 케이스부터 실행한다(5.1.5). 리스크 수준과 요구사항 우선순위 열은 이번 전략에서 쓰지 않는다.\n① 커버리지 순서: TC-3(70%) > TC-4(55%) > TC-1(40%) > TC-2(25%)\n② 우선순위가 가장 높은 TC-3이 TC-2에 종속되므로 TC-2를 먼저 실행한다.\n③ 결과: TC-2 → TC-3 → TC-4 → TC-1","why":["리스크 수준(9, 6, 4, 2)으로 정렬하고 종속성을 반영한 순서다. 리스크 기반 우선순위지정의 결과다.","커버리지 순서는 맞지만 TC-3이 TC-2보다 먼저 실행돼 종속성을 어긴다.","정답. 커버리지가 가장 높은 TC-3을 위해 TC-2를 먼저 실행하고, 이어서 TC-4(55%), TC-1(40%) 순이다.","요구사항 우선순위(1, 2, 3, 4)로 정렬한 순서다. 요구사항 기반 우선순위지정의 결과다."],"ref":"5.1.5"},{"id":"c5k3-012","ch":5,"lo":"FL-5.1.5","k":3,"q":"오늘 테스트 실행 시간은 09:00~14:00이다. 테스트 케이스는 각각 정확히 1시간씩 걸리고, 한 번에 하나씩 쉬지 않고 이어서 실행한다(09~10시, 10~11시, 11~12시, 12~13시, 13~14시). TC-01은 부하 생성 도구가 필요한데, 이 도구는 11:00~12:00에만 쓸 수 있다.\n우선순위(1이 가장 높음)가 높은 테스트 케이스를 가능한 한 먼저 실행하되, 종속성과 자원 가용성을 모두 지키는 실행 순서는?","table":{"head":["테스트 케이스","우선순위","종속성","필요 자원"],"rows":[["TC-01","1","없음","부하 생성 도구(11:00~12:00만 가능)"],["TC-02","2","TC-05 이후 실행","없음"],["TC-03","3","없음","없음"],["TC-04","4","없음","없음"],["TC-05","5","없음","없음"]]},"opts":["TC-01 → TC-05 → TC-02 → TC-03 → TC-04","TC-05 → TC-02 → TC-01 → TC-03 → TC-04","TC-02 → TC-03 → TC-01 → TC-04 → TC-05","TC-05 → TC-02 → TC-03 → TC-04 → TC-01"],"ans":[1],"exp":"테스트 실행 순서는 우선순위와 종속성뿐 아니라 자원의 가용성도 고려해야 한다. 필요한 테스트 도구, 테스트 환경, 인력을 특정 시간에만 쓸 수 있는 경우가 있다(5.1.5).\n① TC-01은 도구를 쓸 수 있는 세 번째 칸(11~12시)에만 실행할 수 있다.\n② 남은 칸(09~10, 10~11, 12~13, 13~14시)에 우선순위 순으로 배치한다. 다음으로 높은 TC-02는 TC-05에 종속되므로 09~10시 TC-05, 10~11시 TC-02.\n③ 12~13시 TC-03, 13~14시 TC-04\n④ 결과: TC-05 → TC-02 → TC-01 → TC-03 → TC-04","why":["TC-01을 09~10시에 배치했다. 부하 생성 도구는 11~12시에만 쓸 수 있으므로 이 시간에는 실행할 수 없다.","정답. TC-01은 도구를 쓸 수 있는 11~12시에, 나머지는 우선순위와 종속성에 따라 배치했다.","TC-02가 TC-05보다 먼저 실행돼 종속성을 어긴다.","TC-01이 13~14시에 배치돼 도구를 쓸 수 있는 시간을 놓쳤다. 우선순위가 가장 높은 TC-01은 도구를 쓸 수 있는 11~12시에 실행해야 한다."],"ref":"5.1.5"},{"id":"c5k3-013","ch":5,"lo":"FL-5.1.5","k":3,"q":"다음 여섯 개 테스트 케이스의 실행 순서를 정한다. 우선순위는 1이 가장 높다. 우선순위가 높은 테스트 케이스를 가능한 한 먼저 실행하되, 종속성이 있으면 선행 테스트 케이스를 먼저 실행해야 한다.\n네 번째로 실행하는 테스트 케이스는?","table":{"head":["테스트 케이스","우선순위","종속성"],"rows":[["TC-1","4","없음"],["TC-2","1","TC-5 이후 실행"],["TC-3","2","TC-5 이후 실행"],["TC-4","3","TC-6 이후 실행"],["TC-5","6","없음"],["TC-6","5","없음"]]},"opts":["TC-1","TC-3","TC-4","TC-6"],"ans":[3],"exp":"5.1.5: 우선순위가 높은 테스트 케이스가 낮은 테스트 케이스에 종속되면 낮은 쪽을 먼저 실행한다.\n① TC-2(1)는 TC-5에 종속 → TC-5, TC-2\n② TC-3(2)도 TC-5에 종속되지만 TC-5는 이미 실행됐다 → TC-3\n③ TC-4(3)는 TC-6에 종속 → TC-6, TC-4\n④ TC-1(4)\n결과: TC-5 → TC-2 → TC-3 → TC-6 → TC-4 → TC-1. 네 번째는 TC-6이다.","why":["종속성을 무시하면 TC-2 → TC-3 → TC-4 → TC-1 순이 되어 TC-1이 네 번째가 된다. 실제로 TC-1은 여섯 번째다.","TC-3은 세 번째다. TC-5는 TC-2를 위해 이미 실행됐으므로 TC-3 앞에서 다시 실행할 필요가 없다.","TC-4는 다섯 번째다. TC-4 앞에 선행 테스트 케이스인 TC-6을 먼저 실행해야 한다.","정답. TC-5, TC-2, TC-3 다음으로 TC-4를 위해 TC-6을 네 번째로 실행한다."],"ref":"5.1.5"},{"id":"c5k3-014","ch":5,"lo":"FL-5.5.1","k":3,"q":"테스터가 배달 앱의 시스템 테스팅 중 장애(failure)를 발견하고 다음과 같이 결함 보고서(defect report) 초안을 작성했다.\n실라버스가 제시하는 '동적 테스팅 중 작성하는 결함 보고서'의 일반적인 내용과 비교할 때, 이 초안에 빠져 있어 추가해야 할 항목은? (두 개를 고르시오)","table":{"head":["항목","작성 내용"],"rows":[["식별자","DEF-0412"],["제목","할인 쿠폰 2장을 함께 선택하면 결제 금액이 잘못 계산됨"],["관찰 일자 / 보고 조직 / 작성자","2026-09-21 / 품질팀 / 테스터 A(시스템 테스트 담당)"],["테스트 대상 / 테스트 환경","배달 앱 v3.2.0(빌드 118), 안드로이드 14, 테스트 서버"],["정황","시스템 테스팅 중 TC-CPN-07 실행, 경계값 분석으로 만든 쿠폰 데이터 사용"],["재현 절차","① 15,000원 메뉴 담기 ② 3,000원 쿠폰과 10% 쿠폰 동시 선택 ③ 결제 화면 이동(스크린샷 첨부)"],["실제 결과","결제 금액이 9,000원으로 표시됨"],["심각도","높음"],["결함 상태","신규"],["참조 사항","TC-CPN-07"]]},"opts":["결함의 근본 원인 분석 결과","기대 결과","테스트 대상 및 테스트 환경 식별 정보","수정 우선순위","결함 상태"],"ans":[1,3],"exp":"5.5가 제시하는 결함 보고서 내용: 고유 식별자, 이상 사항을 요약하는 제목, 관찰 날짜·보고 주체 조직·작성자(역할 포함), 테스트 대상 및 테스트 환경 식별 정보, 결함의 정황, 장애의 재현 및 해결에 필요한 정보, 기대 결과와 실제 결과, 영향의 심각도, 수정 우선순위, 결함 상태, 참조 사항.\n초안과 하나씩 대조하면 ① '실제 결과'만 있고 '기대 결과'가 없다. ② '심각도'는 있지만 '수정 우선순위'가 없다.\n기대 결과가 없으면 담당자는 9,000원이 왜 틀렸는지 판단하기 어렵다.","why":["근본 원인은 근본 원인 분석으로 찾는 대상이며(1.2.3), 5.5의 결함 보고서 내용 목록에 없다.","정답. '기대 결과와 실제 결과' 중 실제 결과만 적혀 있다.","이미 '배달 앱 v3.2.0(빌드 118), 안드로이드 14, 테스트 서버'로 적혀 있다.","정답. 심각도와 별개 항목인 '수정 우선순위'가 빠져 있다.","이미 '신규'로 적혀 있다."],"ref":"5.5"},{"id":"c5k3-015","ch":5,"lo":"FL-5.5.1","k":3,"q":"테스터가 주문 취소 기능에서 장애(failure)를 발견하고, 결함 보고서(defect report)를 쓰려고 다음 메모를 남겼다.\n① 모바일 앱 v2.8.1(빌드 2081), iOS 18, 테스트 서버\n② 테스트 실행 활동 중이었고, '주문 취소 체크리스트 v3'와 동등 분할로 만든 주문 데이터를 사용함\n③ 주문 목록 → 주문 상세 → 취소 → 사유 선택 → 확인 순으로 진행함. 서버 로그와 화면 녹화 파일 첨부\n④ 취소 완료 화면에 환불 예정 금액이 0원으로 표시됨. 명세에 따르면 결제 금액 23,000원이 표시돼야 함\n결함 보고서 항목\n(가) 테스트 대상 및 테스트 환경 식별 정보\n(나) 결함의 정황\n(다) 장애의 재현 및 해결에 필요한 정보\n(라) 기대 결과와 실제 결과\n메모와 항목을 바르게 연결한 것은?","opts":["①-(나), ②-(가), ③-(다), ④-(라)","①-(가), ②-(다), ③-(나), ④-(라)","①-(가), ②-(나), ③-(다), ④-(라)","①-(가), ②-(나), ③-(라), ④-(다)"],"ans":[2],"exp":"5.5의 결함 보고서 항목 설명에 맞춰 보면 다음과 같다.\n① 앱 버전·빌드·OS·서버는 테스트 대상과 테스트 환경을 식별하는 정보 → (가)\n② 수행 중인 테스트 활동, 사용 중인 체크리스트와 테스트 데이터는 결함의 정황 예시 → (나)\n③ 이상 사항을 발견한 절차와 로그·녹화 파일은 장애의 재현 및 해결에 필요한 정보 → (다)\n④ 0원 표시(실제)와 23,000원 표시(명세상 기대)는 기대 결과와 실제 결과 → (라)","why":["①과 ②를 바꿨다. 버전·OS·서버는 환경 식별 정보이고, 테스트 활동·체크리스트·테스트 데이터는 정황이다.","②와 ③을 바꿨다. 화면 진행 절차와 로그·녹화 파일이 재현 정보이고, 체크리스트·테스트 데이터는 정황이다.","정답. 네 메모가 실라버스의 항목 설명과 그대로 맞는다.","③과 ④를 바꿨다. ④처럼 무엇이 표시됐고 무엇이 표시돼야 하는지가 기대 결과와 실제 결과다."],"ref":"5.5"},{"id":"c5k3-016","ch":5,"lo":"FL-5.5.1","k":3,"q":"회원 등급 할인 기능에서 장애(failure)가 발견돼 테스터가 결함 보고서(defect report)를 쓰고 있다. 관련자들에게서 다음 정보를 받았다.\n이 중 결함 보고서의 '수정 우선순위' 항목에 기록할 내용으로 가장 적절한 것은?","opts":["제품 소유자 결정: 다음 주 화요일 정기 배포 전에 반드시 수정한다.","이 장애 때문에 'VIP 회원 10% 할인' 요구사항(REQ-22)이 충족되지 않아 VIP 회원이 할인을 받지 못한다.","개발자가 수정을 마쳤고, 테스터의 확인 테스팅을 기다리고 있다.","이 결함을 발견한 테스트 케이스: TC-DSC-03"],"ans":[0],"exp":"5.5의 결함 보고서는 '결함이 이해관계자의 이익 또는 요구사항에 끼치는 영향의 심각도'와 '수정 우선순위'를 별개 항목으로 둔다.\n① 언제까지 고칠지에 대한 결정 → 수정 우선순위\n② 요구사항을 충족하지 못한다는 영향 설명 → 심각도\n③ 확인 테스팅을 기다리는 상태 → 결함 상태(확인 테스트 대기)\n④ 관련 테스트 케이스 → 참조 사항","why":["정답. 언제까지 수정할지에 대한 결정이므로 수정 우선순위다.","요구사항과 이해관계자의 이익에 끼치는 영향을 설명하므로 심각도 항목에 들어간다.","결함 상태 중 '확인 테스트 대기'에 해당한다.","관련 테스트 케이스 정보로 참조 사항(또는 결함의 정황)에 들어간다. 수정 시점과는 관계없다."],"ref":"5.5"},{"id":"c5k3-017","ch":5,"lo":"FL-5.5.1","k":3,"q":"결함 관리 도구에 등록된 결함 보고서(defect report) 세 건의 상황이 다음과 같다.\n① DEF-305: 같은 장애가 이미 DEF-210으로 보고돼 있음이 확인됐다.\n② DEF-311: 개발자가 수정 버전을 테스트 환경에 배포했고, 테스터는 아직 확인 테스팅(confirmation testing)을 하지 않았다.\n③ DEF-318: 실제 결함이 맞지만, 이해관계자가 이번 릴리스에서는 고치지 않고 다음 릴리스로 미루기로 했다.\n각 보고서의 결함 상태로 가장 적절한 조합은?","opts":["① 중복 / ② 확인 테스트 대기 / ③ 연기","① 중복 / ② 완료 / ③ 연기","① 재-오픈 / ② 확인 테스트 대기 / ③ 연기","① 중복 / ② 확인 테스트 대기 / ③ 거부"],"ans":[0],"exp":"5.5는 결함 상태의 예로 신규, 연기, 중복, 수정 대기, 확인 테스트 대기, 재-오픈, 완료, 거부를 든다.\n① 이미 보고된 장애와 같음 → 중복\n② 수정은 끝났지만 확인 테스팅 전 → 확인 테스트 대기. 확인 테스팅은 원래 결함이 성공적으로 수정됐는지 확인하는 활동이다(2.2.3).\n③ 결함은 맞지만 수정 시점을 다음 릴리스로 미룸 → 연기","why":["정답. 세 상황이 각각 중복, 확인 테스트 대기, 연기에 해당한다.","②는 확인 테스팅 전이라 수정이 성공했는지 아직 모른다. '완료'로 닫기에는 이르다.","①은 같은 장애가 이미 보고된 경우이므로 '중복'이다. 다시 여는(re-opened) 상황이 아니다.","③은 실제 결함으로 인정하고 수정을 다음 릴리스로 미룬 것이므로 '연기(deferred)'다. '거부(rejected)'와 다르다."],"ref":"5.5"},{"id":"c5k3-018","ch":5,"lo":"FL-5.5.1","k":3,"q":"테스터가 '야간 정산 배치 실행 후 일부 가맹점의 정산 금액이 0원으로 저장됨'이라는 결함 보고서(defect report)를 등록했다. 보고서에는 식별자, 제목, 관찰 일자와 작성자, 테스트 대상(정산 배치 v1.4.2)과 테스트 환경, 기대 결과와 실제 결과, 심각도, 수정 우선순위, 결함 상태가 들어 있다. 개발자는 '어떤 조건에서 실행했는지 알 수 없어 장애를 재현할 수 없다'며 보고서를 되돌려 보냈다.\n실라버스의 결함 보고서 내용을 기준으로, 이 문제를 해결하려면 무엇을 보완하는 것이 가장 적절한가?","opts":["결함 상태를 '재-오픈'으로 바꾸고 심각도와 수정 우선순위를 한 단계씩 높여 다시 제출한다.","장애를 일으킨 소스 코드 위치를 직접 찾아 수정 방법과 함께 보고서에 적는다.","이상 사항을 발견한 절차, 사용한 테스트 데이터, 관련 테스트 로그를 추가한다.","테스트 대상의 버전 번호를 다시 확인해 보고서 제목 맨 앞에 '[v1.4.2]'로 붙인다."],"ans":[2],"exp":"결함 보고서의 목적 중 하나는 결함을 처리하고 해결할 책임자에게 문제 해결에 충분한 정보를 주는 것이다(5.5).\n① 이 보고서에는 '결함의 정황(예: 사용 중인 테스트 데이터)'이 없다.\n② '장애의 재현 및 해결에 필요한 정보(이상 사항을 발견한 절차, 관련 테스트 로그, 데이터베이스 덤프 등)'도 없다.\n③ 개발자가 재현하지 못한 이유가 이 정보 부족이므로 이 두 가지를 보완해야 한다.","why":["상태, 심각도, 수정 우선순위는 이미 보고서에 있다. 이 값을 바꿔도 재현에 필요한 정보는 늘지 않는다.","장애의 원인(결함)을 찾고 분석해 제거하는 일은 디버깅이다(1.1.2). 소스 코드 위치나 수정 방법은 5.5의 결함 보고서 내용 목록에 없다.","정답. 정황(사용한 테스트 데이터)과 재현 정보(이상 사항을 발견한 절차, 관련 테스트 로그)를 보완해야 개발자가 재현할 수 있다.","테스트 대상 식별 정보(정산 배치 v1.4.2)는 이미 들어 있다. 같은 버전 번호를 제목에 붙여도 재현 조건은 늘지 않는다."],"ref":"5.5"},{"id":"c5k3-019","ch":5,"lo":"FL-5.5.1","k":3,"q":"요구사항에 따르면 비밀번호를 5회 연속 틀리면 계정이 잠겨야 한다. 그런데 테스터가 틀린 비밀번호를 5회 입력한 뒤 6번째에 올바른 비밀번호를 넣자 로그인이 됐다. 테스터는 이 장애(failure)에 대한 결함 보고서(defect report)를 쓰려 한다.\n결함 보고서의 '제목' 항목에 쓸 내용으로 가장 적절한 것은?","opts":["비밀번호를 5회 연속 틀린 뒤에도 계정이 잠기지 않고 6번째 시도에서 로그인됨","로그인 오류 발생","TC-LOG-04 실패","① 로그인 화면 이동 ② 틀린 비밀번호 5회 입력 ③ 올바른 비밀번호 입력 ④ 로그인 성공 확인(로그 첨부)"],"ans":[0],"exp":"5.5의 결함 보고서 항목 중 제목은 '보고하는 이상 사항을 요약하는' 것이다. 이 문제에서는 무엇이 잘못됐는지(5회 연속 틀린 뒤에도 잠기지 않고 로그인됨)가 드러나야 요약이 된다.\n테스트 케이스 번호는 결함의 정황(예: 실행 중인 테스트 케이스)이나 참조 사항(예: 관련 테스트 케이스)에, 단계별 절차와 로그는 장애의 재현 및 해결에 필요한 정보에 들어갈 내용이다.","why":["정답. 조건(5회 연속 틀림)과 잘못된 동작(잠기지 않고 로그인됨)을 짧게 요약했다.","어떤 이상 사항인지 요약하지 못한다. 로그인 기능의 어떤 장애인지 알 수 없다.","테스트 케이스 번호는 결함의 정황(예: 실행 중인 테스트 케이스)이나 참조 사항(예: 관련 테스트 케이스)에 들어갈 정보이며, 이상 사항을 요약하지 않는다.","이상 사항을 발견한 절차로, 장애의 재현 및 해결에 필요한 정보 항목에 들어갈 내용이다."],"ref":"5.5"},{"id":"c6-001","ch":6,"lo":"FL-6.1.1","k":2,"q":"한 조직은 요구사항, 테스트, 결함, 형상 정보가 여러 문서와 메일에 흩어져 있어 테스트 진행 상황을 관리하기 어렵다. 이 정보들을 함께 관리해 테스트 프로세스의 효율성을 높이고 싶다.\n실라버스의 도구 유형 중 가장 적합한 것은?","opts":["협업 도구(collaboration tools)","테스트 관리 도구(test management tools)","데브옵스 도구(DevOps tools)","테스트 설계 및 테스트 구현 도구(test design and test implementation tools)"],"ans":[1],"exp":"6.1: 테스트 관리 도구는 소프트웨어 개발수명주기(SDLC), 요구사항, 테스트, 결함, 형상 관리를 용이하게 해서 테스트 프로세스 효율성을 높인다.","why":["협업 도구는 원활한 커뮤니케이션을 지원한다(6.1). 요구사항·테스트·결함·형상 관리를 용이하게 하는 것은 테스트 관리 도구다.","정답. 6.1의 테스트 관리 도구 설명과 일치한다.","데브옵스 도구는 데브옵스 배포 파이프라인, 작업 흐름 추적, 자동 빌드 프로세스, 지속적인 통합 및 배포 등을 지원한다(6.1).","테스트 설계 및 테스트 구현 도구는 테스트 케이스, 테스트 데이터, 테스트 절차 생성을 용이하게 한다(6.1)."],"ref":"6.1"},{"id":"c6-002","ch":6,"lo":"FL-6.1.1","k":2,"q":"테스터가 새 기능에 필요한 테스트 케이스와 테스트 데이터를 만들고, 이를 실행 순서에 맞춰 테스트 절차로 엮는 데 많은 시간을 쓰고 있다.\n이 작업을 도와줄 도구 유형으로 가장 적합한 것은?","opts":["테스트 실행 및 테스트 커버리지 도구(test execution and test coverage tools)","확장성 및 배포 표준화 지원 도구(tools supporting scalability and deployment standardization)","테스트 설계 및 테스트 구현 도구(test design and test implementation tools)","테스트 관리 도구(test management tools)"],"ans":[2],"exp":"6.1: 테스트 설계 및 테스트 구현 도구는 테스트 케이스, 테스트 데이터, 테스트 절차 생성을 용이하게 한다.","why":["테스트 실행 및 테스트 커버리지 도구는 자동 테스트 실행과 커버리지 측정을 지원한다(6.1). 테스트 케이스나 테스트 데이터를 생성하는 도구 유형이 아니다.","6.1에서 확장성 및 배포 표준화 지원 도구의 예로 드는 것은 가상 머신, 컨테이너화 도구다. 테스트 케이스, 테스트 데이터, 테스트 절차 생성을 용이하게 하는 유형이 아니다.","정답. 6.1의 테스트 설계 및 테스트 구현 도구 설명과 일치한다.","테스트 관리 도구는 SDLC, 요구사항, 테스트, 결함, 형상 관리를 용이하게 해 테스트 프로세스 효율성을 높인다(6.1). 테스트 케이스, 테스트 데이터, 테스트 절차 생성을 용이하게 하는 것은 6.1에서 테스트 설계 및 테스트 구현 도구의 몫이다."],"ref":"6.1"},{"id":"c6-003","ch":6,"lo":"FL-6.1.1","k":2,"q":"팀은 빌드가 끝날 때마다 수백 개의 리그레션 테스트(regression test)를 사람 손을 거치지 않고 실행하고, 그 테스트들이 코드를 얼마나 실행했는지 커버리지(coverage)를 측정하고 싶다.\n이 요구를 직접 지원하는 도구 유형은?","opts":["정적 테스팅 도구(static testing tools)","협업 도구(collaboration tools)","테스트 설계 및 테스트 구현 도구(test design and test implementation tools)","테스트 실행 및 테스트 커버리지 도구(test execution and test coverage tools)"],"ans":[3],"exp":"6.1: 테스트 실행 및 테스트 커버리지 도구는 자동 테스트 실행 및 커버리지 측정을 지원한다.","why":["정적 테스팅 도구는 테스터의 리뷰와 정적 분석 수행을 지원한다(6.1). 자동 테스트 실행과 커버리지 측정을 지원하는 것은 테스트 실행 및 테스트 커버리지 도구다(6.1).","협업 도구는 원활한 커뮤니케이션을 지원한다(6.1).","테스트 설계 및 테스트 구현 도구는 테스트 케이스, 테스트 데이터, 테스트 절차 생성을 용이하게 한다(6.1).","정답. 6.1의 테스트 실행 및 테스트 커버리지 도구 설명과 일치한다."],"ref":"6.1"},{"id":"c6-004","ch":6,"lo":"FL-6.1.1","k":2,"q":"온라인 티켓 예매 시스템이 예매 오픈 직후 동시 접속자 5만 명을 견디는지 확인해야 한다. 테스터 몇 명이 손으로 접속해서는 이런 상황을 만들 수 없다.\n실라버스의 도구 유형 중 이 테스팅을 가능하게 하는 것은?","opts":["비기능 테스팅 도구(non-functional testing tools)","확장성 및 배포 표준화 지원 도구(tools supporting scalability and deployment standardization)","테스트 관리 도구(test management tools)","정적 테스팅 도구(static testing tools)"],"ans":[0],"exp":"6.1: 비기능 테스팅 도구는 수동으로 실행하기 어렵거나 불가능한 비기능 테스트를 테스터가 수행할 수 있게 한다. 동시 접속자 5만 명 상황은 사람이 손으로 만들 수 없는 비기능 테스트 조건이다.","why":["정답. 6.1의 비기능 테스팅 도구 설명과 일치한다.","확장성 및 배포 표준화 지원 도구의 예는 가상 머신, 컨테이너화 도구다(6.1). 수동으로 하기 어려운 비기능 테스트를 수행하게 해 주는 도구 유형은 비기능 테스팅 도구다.","테스트 관리 도구는 SDLC, 요구사항, 테스트, 결함, 형상 관리를 용이하게 한다(6.1).","정적 테스팅 도구는 리뷰와 정적 분석을 지원한다(6.1). 정적 테스팅은 소프트웨어를 실행하지 않으므로(3.1) 접속 부하 상황을 만들지 않는다."],"ref":"6.1"},{"id":"c6-005","ch":6,"lo":"FL-6.1.1","k":2,"q":"팀원마다 테스트 환경을 직접 설치하다 보니 설정이 조금씩 달라, 같은 테스트의 결과가 사람마다 다르게 나온다. 팀은 가상 머신과 컨테이너화 도구로 동일한 테스트 환경을 표준화하고, 필요할 때 환경을 빠르게 늘리려고 한다.\n이 도구들은 실라버스의 어떤 도구 유형에 해당하는가?","opts":["데브옵스 배포 파이프라인, 작업 흐름 추적, 자동 빌드 프로세스, 지속적인 통합 및 배포를 지원하는 데브옵스 도구(DevOps tools)","수동으로 실행하기 어렵거나 불가능한 비기능 테스트를 수행할 수 있게 하는 비기능 테스팅 도구(non-functional testing tools)","확장성 및 배포 표준화 지원 도구(tools supporting scalability and deployment standardization)","자동 테스트 실행 및 커버리지 측정을 지원하는 테스트 실행 및 테스트 커버리지 도구(test execution and test coverage tools)"],"ans":[2],"exp":"6.1: 확장성 및 배포 표준화 지원 도구의 예로 가상 머신과 컨테이너화 도구를 든다.","why":["데브옵스 도구에 대한 설명 자체는 6.1과 같다. 하지만 6.1에서 가상 머신과 컨테이너화 도구는 데브옵스 도구가 아니라 확장성 및 배포 표준화 지원 도구의 예로 나온다.","비기능 테스팅 도구에 대한 설명 자체는 6.1과 같다. 하지만 6.1에서 가상 머신과 컨테이너화 도구는 확장성 및 배포 표준화 지원 도구의 예로 나온다.","정답. 6.1에서 이 유형의 예로 가상 머신, 컨테이너화 도구를 든다.","테스트 실행 및 테스트 커버리지 도구에 대한 설명 자체는 6.1과 같다. 하지만 6.1에서 가상 머신과 컨테이너화 도구는 확장성 및 배포 표준화 지원 도구의 예로 나온다."],"ref":"6.1"},{"id":"c6-006","ch":6,"lo":"FL-6.1.1","k":2,"q":"테스트 도구 유형과 그에 대한 설명을 짝지은 것 중 실라버스와 일치하는 것 두 개를 고르시오.","opts":["협업 도구(collaboration tools) - 자동 빌드 프로세스와 지속적인 통합 및 배포(CI/CD)를 지원한다","정적 테스팅 도구(static testing tools) - 테스터의 리뷰와 정적 분석 수행을 지원한다","데브옵스 도구(DevOps tools) - 테스트 케이스, 테스트 데이터, 테스트 절차 생성을 용이하게 한다","테스팅에 도움이 되는 기타 도구(any other tool that assists in testing) - 테스팅에 활용하면 스프레드시트도 테스트 도구가 된다","테스트 관리 도구(test management tools) - 수동으로 실행하기 어렵거나 불가능한 비기능 테스트를 수행할 수 있게 한다"],"ans":[1,3],"exp":"6.1: 정적 테스팅 도구는 테스터의 리뷰와 정적 분석 수행을 지원한다. 또 테스팅에 도움이 되는 기타 도구의 예로, 테스팅에 활용하면 스프레드시트도 테스트 도구가 된다.","why":["자동 빌드 프로세스와 CI/CD 지원은 데브옵스 도구의 설명이다. 협업 도구는 원활한 커뮤니케이션을 지원한다(6.1).","정답. 6.1의 정적 테스팅 도구 설명이다.","테스트 케이스, 테스트 데이터, 테스트 절차 생성은 테스트 설계 및 테스트 구현 도구의 설명이다(6.1).","정답. 6.1의 마지막 항목이다.","수동으로 실행하기 어렵거나 불가능한 비기능 테스트를 수행할 수 있게 하는 것은 비기능 테스팅 도구(non-functional testing tools)다. 테스트 관리 도구는 SDLC, 요구사항, 테스트, 결함, 형상 관리를 용이하게 한다(6.1)."],"ref":"6.1"},{"id":"c6-007","ch":6,"lo":"FL-6.2.1","k":1,"q":"다음 중 테스트 자동화(test automation)의 효과로 실라버스에 제시된 것은?","opts":["도구가 사람의 비판적 사고를 대신하므로 테스터의 판단이 필요 없어진다","테스트 스크립트를 한 번 만들어 두면 이후에는 유지 관리 노력이 들지 않는다","도구가 테스트 대상의 요구사항을 스스로 분석하고 확정해 준다","예상 결과와 실제 결과의 비교 같은 반복적 수작업을 줄여 시간을 절약한다"],"ans":[3],"exp":"6.2: 테스트 자동화의 효과로 반복적 수작업(예: 리그레션 테스트 실행, 같은 테스트 데이터의 반복 입력, 예상 결과와 실제 결과의 비교, 코딩 표준 확인)을 줄여 시간을 절약하는 것을 든다.","why":["6.2: 도구에 지나치게 의존해 사람의 비판적 사고의 필요성을 무시하는 것은 리스크로 나온다.","6.2: 새 도구마다 유지보수 등을 위한 노력이 들고, 테스트 스크립트 유지 관리에 필요한 시간, 비용, 노력을 부정확하게 추정하는 것은 리스크로 나온다. 스크립트를 만든 뒤에도 유지 관리 노력은 들어간다.","6.2의 효과 목록에 없는 내용이다. 6.2에는 요구사항에서 테스트를 일관되게 도출한다는 예가 있을 뿐, 도구가 요구사항을 확정한다는 내용은 없다.","정답. 6.2의 첫 번째 효과(반복적 수작업을 줄여 시간 절약)이고, 예상 결과와 실제 결과의 비교는 그 예로 나온다."],"ref":"6.2"},{"id":"c6-008","ch":6,"lo":"FL-6.2.1","k":1,"q":"다음 중 테스트 자동화 활용 시의 잠재적 리스크로 실라버스에 제시된 것은?","opts":["커버리지 같은 보다 객관적인 평가와 사람이 판단하기 어려운 복잡한 측정치를 얻는다","테스트 진행률, 실패율 같은 테스팅 정보에 더 쉽게 접근할 수 있다","폐업이나 도구 지원 중단 같은 문제가 생길 수 있는 도구 공급업체에 대한 종속성","도구가 테스트를 같은 주기와 같은 순서로 실행해 일관성과 재현성이 높아진다"],"ans":[2],"exp":"6.2: 폐업, 도구 지원 중단, 다른 공급업체로 도구 매각, 열악한 지원(예: 문의, 업그레이드, 결함 수정에 대한 대응) 등의 문제가 생길 수 있는 도구 공급업체에 대한 종속성은 테스트 자동화의 잠재적 리스크다.","why":["6.2의 효과다(보다 객관적인 평가, 사람이 판단하기 어려운 복잡한 측정치의 제공).","6.2의 효과다(테스트 관리 및 테스트 보고를 지원하기 위한 테스팅 정보에 더 쉽게 접근).","정답. 6.2의 리스크 목록에 있는 도구 공급업체에 대한 종속성이다(폐업, 도구 지원 중단, 다른 공급업체로 도구 매각, 열악한 지원 등).","6.2의 효과다(일관성 및 재현성 향상으로 사람의 단순 실수 방지)."],"ref":"6.2"},{"id":"c6-009","ch":6,"lo":"FL-6.2.1","k":1,"q":"한 팀이 무료 오픈소스 테스트 자동화 프레임워크를 도입했다. 그런데 1년 전부터 개발이 멈춰 더 이상 업데이트가 나오지 않는다.\n이 상황은 실라버스의 어떤 테스트 자동화 리스크에 해당하는가?","opts":["지원이 중단될 수 있는 오픈소스 소프트웨어의 사용","수동 테스팅이 더 적합한 곳에 테스트 도구 사용","도구의 효과(기능 및 사용 편의성 포함)에 대한 비현실적인 기대","규제 요건이나 안전 표준을 준수하지 않는 부적합한 도구의 선택"],"ans":[0],"exp":"6.2: 지원이 중단되거나(더는 업데이트되지 않거나) 내부 컴포넌트를 빈번하게 업데이트해야 할 수 있는 오픈소스 소프트웨어의 사용은 테스트 자동화의 잠재적 리스크다.","why":["정답. 6.2의 오픈소스 소프트웨어 사용 리스크(지원이 중단되어 더는 업데이트되지 않을 수 있음)와 상황이 일치한다.","도구를 쓸 영역을 잘못 고른 상황이 아니다.","도구의 기능이나 사용 편의성을 과대평가한 상황이 아니다.","규제 요건이나 안전 표준 준수 여부와 관련된 상황이 아니다."],"ref":"6.2"},{"id":"c6-010","ch":6,"lo":"FL-6.2.1","k":1,"q":"자동화 도입 계획에서는 도구 도입에 2주면 충분하다고 봤다. 실제로는 기존 수동 테스트 프로세스를 바꾸고 테스트 스크립트를 유지 관리하는 데 몇 달이 걸렸고 예산도 초과했다.\n이 상황에 해당하는 테스트 자동화 리스크는?","opts":["도구에 지나치게 의존(예: 사람의 비판적 사고의 필요성 무시)","도구 도입 등에 필요한 시간, 비용, 노력에 대한 부정확한 추정","자동화 도구가 개발 플랫폼과 호환되지 않을 수 있음","폐업, 도구 지원 중단 등이 생길 수 있는 도구 공급업체에 대한 종속성"],"ans":[1],"exp":"6.2: 도구 도입, 테스트 스크립트 유지 관리, 기존 수동 테스트 프로세스 변경에 필요한 시간, 비용, 노력에 대한 부정확한 추정은 테스트 자동화의 잠재적 리스크다.","why":["사람의 비판적 사고를 무시한 상황이 아니다.","정답. 6.2: 도구 도입, 테스트 스크립트 유지 관리, 기존 수동 테스트 프로세스 변경에 필요한 시간, 비용, 노력을 잘못 추정한 상황과 일치한다.","도구와 개발 플랫폼의 호환성 문제가 아니다.","도구 공급업체에 대한 종속성(6.2) 리스크다. 이 상황은 공급업체의 폐업, 지원 중단, 매각, 열악한 지원과 관계없다."],"ref":"6.2"},{"id":"c6-011","ch":6,"lo":"FL-6.2.1","k":1,"q":"테스트 자동화의 효과에 대한 설명으로 실라버스와 일치하는 것은?","opts":["테스트 자동화를 도입하면 테스터가 새로운 테스트를 설계할 시간은 줄어든다","테스트 실행 시간이 단축되어 결함 조기 식별, 빠른 피드백, 출시 시간 단축이 가능해진다","커버리지 같은 평가는 사람의 주관적 판단에 더 의존하게 된다","사람이 판단하기 어려운 복잡한 측정치는 자동화 도구로도 제공할 수 없다"],"ans":[1],"exp":"6.2: 결함 조기 식별, 빠른 피드백, 출시 시간 단축을 가능하게 하는 테스트 실행 시간 단축은 테스트 자동화의 효과다.","why":["6.2: 테스터가 새로운, 더 심층적이며 효과적인 테스트를 설계할 시간을 확보하는 것이 효과로 나온다.","정답. 6.2에 나오는 효과다.","6.2: 커버리지 같은 보다 객관적인 평가가 효과로 나온다.","6.2: 사람이 판단하기 어려운 복잡한 측정치의 제공이 효과로 나온다."],"ref":"6.2"},{"id":"c6-012","ch":6,"lo":"FL-6.2.1","k":1,"q":"경영진이 ‘업계에서 많이 쓰는 자동화 도구를 구매하면 테스트 자동화는 성공한다’고 말했다.\n실라버스에 따른 설명으로 옳은 것은?","opts":["도구 도입만으로 성공이 보장되지 않으며, 도입, 유지보수, 교육 등에 노력이 든다","널리 쓰이는 도구라면 도입 리스크가 없으므로 별도의 리스크 분석과 완화가 필요 없다","사용 편의성이 높은 도구라면 별도의 교육 없이도 실질적인 효과가 보장된다","도구를 구매한 직후부터 효과가 나타나므로 수동 테스팅은 모두 자동화로 바꿔야 한다"],"ans":[0],"exp":"6.2: 도구를 도입한다고 성공이 보장되는 것은 아니다. 실질적이고 지속적인 효과를 얻으려면 새로운 도구를 도입할 때마다 노력을 들여야 한다(예: 도구의 도입, 유지보수, 교육 등). 또한 분석과 완화가 필요한 리스크도 있다.","why":["정답. 6.2 첫 문단: 도구를 도입한다고 성공이 보장되지 않으며, 실질적이고 지속적인 효과를 얻으려면 도구의 도입, 유지보수, 교육 등을 위한 노력을 들여야 한다.","6.2: 널리 쓰이는 도구라도 도입만으로 성공이 보장되지 않고, 테스트 자동화에는 분석과 완화가 필요한 리스크가 있다.","6.2: 새 도구마다 도입, 유지보수, 교육 등을 위한 노력이 든다. 도구의 사용 편의성에 대한 비현실적인 기대는 리스크로 나온다.","6.2: 수동 테스팅이 더 적합한 곳에 테스트 도구를 쓰는 것은 리스크로 나온다."],"ref":"6.2"},{"id":"h1-001","ch":1,"lo":"FL-1.1.1","k":1,"q":"온라인 보험 가입 시스템의 테스트 관리자가 테스트 계획서 초안에 이번 릴리스의 테스트 목적(test objective)을 다음과 같이 적었다.\n\ni. 사용자 스토리와 설계 문서 같은 작업 산출물을 평가한다\nii. 테스트 대상(test object)이 보험업 규제 요구사항을 준수하는지 확인하는 베리피케이션(verification)을 수행한다\niii. 결함(defect)을 식별함으로써 테스트 대상의 품질을 직접 향상시킨다\niv. 테스트 대상에 대해 요구된 커버리지(coverage)를 보장한다\nv. 테스트 결과를 근거로 운영위원회 대신 테스터가 출시 여부를 결정한다\n\n실라버스에 제시된 일반적인 테스트 목적에 해당하는 것만 모두 고른 것은?","opts":["i, iii, v","i, ii, iv","ii, iii","iv, v"],"ans":[1],"exp":"1.1.1의 일반적인 테스트 목적에는 '요구사항, 사용자 스토리, 설계, 소스 코드 등 작업 산출물 평가'(i), '테스트 대상의 계약, 법률, 규제 요구사항 준수 여부를 확인하는 베리피케이션'(ii), '테스트 대상에 대해 요구된 커버리지 보장'(iv)이 있다. iii은 틀렸다. 식별한 결함은 테스팅이 아닌 디버깅으로 제거되므로, 테스팅은 테스트 대상의 품질 향상에 '간접적으로' 기여한다(1.2.1). v도 틀렸다. 1.1.1의 목적은 '이해관계자가 정보에 입각한 결정을 내리는데 필요한 정보 제공'이고, 결정은 이해관계자가 내린다. 함정 포인트: ii는 규제 준수 확인을 테스트 목적이 아니라고 여기거나 밸리데이션과 헷갈리면 빼기 쉽다. 실라버스는 이것을 베리피케이션으로 분명히 적는다.","why":["iii과 v가 들어 있어 틀렸다. 테스팅은 품질 향상에 간접적으로 기여하고(1.2.1), 테스트 목적은 결정에 필요한 정보 제공이지 테스터의 결정이 아니다(1.1.1).","정답. i, ii, iv는 모두 1.1.1 목록에 있는 테스트 목적이다.","iii이 들어 있어 틀렸다. 결함은 디버깅으로 제거되므로 테스팅은 품질 향상에 간접적으로 기여한다(1.2.1). i과 iv도 빠졌다.","v가 들어 있어 틀렸다. 1.1.1의 목적은 이해관계자가 결정을 내리는 데 필요한 정보 제공이다. i과 ii도 빠졌다."],"ref":"1.1.1","hard":true},{"id":"h1-002","ch":1,"lo":"FL-1.1.1","k":1,"q":"물류 회사의 새 배차 시스템은 시스템 테스팅에서 명세서에 정의된 요구사항(운전기사 법정 휴게시간 규칙 포함)을 모두 테스트해 충족 여부를 확인했다. 출시 전 마지막 테스트로, 운영 환경과 같은 조건에서 현장 배차 담당자들이 명세서에는 없지만 매일 하는 '긴급 주문 끼워 넣기' 같은 실제 업무를 직접 처리해 보기로 했다.\n\n이 마지막 테스트가 주로 달성하려는 테스트 목적(test objective)으로 가장 적절한 것은?","opts":["테스트 대상이 정의된 요구사항을 충족하는지 확인하는 베리피케이션","테스트 대상의 완성 여부와 이해관계자의 기대 충족 여부를 확인하는 밸리데이션","테스트 대상이 관련 계약, 법률, 규제 요구사항을 준수하는지 확인하는 베리피케이션","테스트 대상에 대해 요구된 커버리지를 보장하는 것"],"ans":[1],"exp":"1.1에서 베리피케이션(verification)은 시스템이 주어진 요구사항을 충족하는지 확인하는 것이고, 밸리데이션(validation)은 시스템이 운영 환경에서 사용자 또는 기타 이해관계자가 필요한 바를 만족하는지 확인하는 것이다. 마지막 테스트의 단서는 '운영 환경과 같은 조건', '현장 담당자', '명세서에는 없는 실제 업무'다. 명세서에 없는 업무까지 해낼 수 있는지 보는 것은 요구사항과 대조하는 일이 아니라 사용자가 필요로 하는 바를 확인하는 일이다. 그래서 1.1.1의 '테스트 대상의 완성 여부와 이해관계자의 기대 충족 여부를 확인하는 밸리데이션'에 해당한다. 함정 포인트: 네 보기 모두 1.1.1에 있는 테스트 목적이고, 지문에 법정 휴게시간 규칙이 나와 규제 베리피케이션이 끌린다. 하지만 정의된 요구사항과 법규 관련 요구사항은 시스템 테스팅에서 이미 확인했고, 마지막 테스트의 초점은 명세서 밖의 실제 업무다.","why":["1.1.1의 테스트 목적이 맞지만, 정의된 요구사항의 충족 여부는 시스템 테스팅에서 이미 확인했다. 마지막 테스트는 명세서에 없는 업무를 다룬다(1.1).","정답. 운영 환경과 같은 조건에서 사용자가 실제 업무를 해낼 수 있는지 보는 것은 완성 여부와 기대 충족 여부를 확인하는 밸리데이션이다(1.1, 1.1.1).","1.1.1의 테스트 목적이 맞지만, 법정 휴게시간 같은 법규 관련 요구사항은 시스템 테스팅에서 이미 확인했다. 마지막 테스트의 초점이 아니다.","1.1.1의 테스트 목적이 맞지만, 마지막 테스트는 커버리지 달성이 아니라 명세서 밖의 실제 업무를 사용자가 해낼 수 있는지 확인한다."],"ref":"1.1.1","hard":true},{"id":"h1-003","ch":1,"lo":"FL-1.2.2","k":1,"q":"테스팅과 품질 보증(QA, quality assurance)에 대한 다음 설명을 보자.\n\ni. 테스팅은 제품 지향적이며, 적합한 수준의 품질 달성을 지원하는 활동에 초점을 맞춘 교정 접근법(corrective approach)이다\nii. 품질 보증은 좋은 프로세스를 올바르게 준수하면 좋은 제품이 만들어진다는 가정을 기반으로 한다\niii. 품질 보증은 개발 프로세스에 적용되며, 테스팅 프로세스는 품질 보증의 적용 대상이 아니다\niv. 정형 기법, 시뮬레이션, 프로토타이핑은 테스팅과 함께 품질 보증에 속하는 활동이다\nv. 품질 보증에서 테스트 결과는 개발 및 테스트 프로세스가 잘 동작하고 있는지 확인하기 위한 피드백으로 사용된다\n\n실라버스에 비추어 옳은 것만 모두 고른 것은?","opts":["ii, iv","i, iii, iv","i, ii, v","iii, v"],"ans":[2],"exp":"1.2.2: 테스팅은 제품 지향적인 교정 접근법이다(i). 품질 보증은 프로세스 중심의 예방 접근법이며, 좋은 프로세스를 올바르게 준수하면 좋은 제품이 만들어진다는 가정을 기반으로 한다(ii). 품질 보증에서 테스트 결과는 개발 및 테스트 프로세스가 잘 동작하는지 확인하는 피드백으로 쓴다(v). iii은 품질 보증이 개발 및 테스팅 프로세스 모두에 적용되므로 틀렸다. iv는 정형 기법, 시뮬레이션, 프로토타이핑이 테스팅과 함께 품질 '제어(quality control)'에 속하므로 틀렸다. 함정 포인트: iv는 '품질 제어'를 '품질 보증'으로 한 단어만 바꿨다. 두 용어를 같은 뜻으로 알고 있으면 옳다고 착각하기 쉽다.","why":["iv가 들어 있어 틀렸다. 정형 기법, 시뮬레이션, 프로토타이핑은 품질 제어에 속한다(1.2.2). i과 v도 빠졌다.","iii과 iv가 들어 있어 틀렸다. 품질 보증은 개발 및 테스팅 프로세스 모두에 적용되고, 정형 기법 등은 품질 제어에 속한다(1.2.2).","정답. i, ii, v는 1.2.2 문장과 일치한다.","iii이 들어 있어 틀렸다. 품질 보증은 개발 및 테스팅 프로세스 모두에 적용된다(1.2.2). i과 ii도 빠졌다."],"ref":"1.2.2","hard":true},{"id":"h1-004","ch":1,"lo":"FL-1.5.2","k":1,"q":"한 개발팀이 전체 팀 접근법(whole team approach)을 도입하고 반복 주기 세 번을 마쳤다. 다음은 회고에서 언급된 변화들이다.\n\n이 중 실라버스가 전체 팀 접근법의 장점으로 제시한 것 두 개를 고르시오.","opts":["팀원들이 서로 자주 상호작용하면서 팀의 활력(team dynamics)이 높아졌다","개발자와 배경과 편향이 다른 테스터가 참여해, 개발자와 다른 유형의 결함을 찾을 가능성이 높아졌다","테스터가 비즈니스 담당자를 대신해 인수 테스트를 작성하게 되어, 비즈니스 담당자의 부담이 줄었다","팀원들이 가진 다양한 기술이 함께 활용되어 프로젝트에 도움이 되는 시너지가 생겼다","개발자는 개발만, 테스터는 테스트만 맡도록 역할이 고정되어 각자의 전문성이 깊어졌다"],"ans":[0,3],"exp":"1.5.2: 전체 팀 접근법은 팀의 활력을 높이고, 팀 내 의사소통과 협업을 강화하며, 팀이 가진 다양한 기술을 활용해 프로젝트 성공을 위한 시너지를 창출한다. 또 필요 지식과 기술을 갖춘 팀원이라면 누구나 어떤 작업이라도 수행할 수 있고, 테스터는 비즈니스 담당자와 협력해 적절한 인수 테스트를 작성한다. 함정 포인트: '배경과 편향이 달라 다른 유형의 결함을 찾는다'는 실라버스에 있는 내용이라 장점처럼 들린다. 하지만 이것은 전체 팀 접근법이 아니라 독립적 테스팅의 이점(1.5.3)이다.","why":["정답. 팀의 활력을 높이는 것은 1.5.2에 제시된 장점이다.","실라버스에 있는 내용이지만 독립적 테스팅의 주요 이점이다(1.5.3). 전체 팀 접근법의 장점으로 제시된 것이 아니다.","1.5.2에서 테스터는 비즈니스 담당자와 협력해 인수 테스트를 작성한다. 비즈니스 담당자를 대신해 작성하는 것은 이 접근법의 장점이 아니다.","정답. 다양한 기술을 활용한 시너지 창출은 1.5.2에 제시된 장점이다.","전체 팀 접근법에서는 필요 지식과 기술을 갖춘 팀원이라면 누구나 어떤 작업이라도 수행할 수 있다(1.5.2). 역할을 고정하는 것은 이 접근법과 반대다."],"ref":"1.5.2","hard":true},{"id":"h1-005","ch":1,"lo":"FL-1.5.2","k":1,"q":"회사가 두 신규 프로젝트에 전체 팀 접근법(whole team approach) 적용을 검토하고 있다.\n\n• 프로젝트 P: 서울과 부산에 나뉘어 있는 팀원들이 가상 작업 공간을 함께 쓰며 개발하는 쇼핑 앱\n• 프로젝트 Q: 철도 신호를 제어하는, 안전이 치명적인(safety-critical) 소프트웨어\n\n실라버스에 비추어 가장 적절한 판단은?","opts":["P는 팀원들이 물리적 공간을 공유하지 않아 적절하지 않을 수 있고, Q는 모든 팀원이 품질에 책임을 지는 접근법이라 오히려 적합하다","P와 Q 모두 적용할 수 있다. Q에 필요한 테스트 독립성은 같은 팀 동료끼리 서로의 작업 산출물을 테스트하면 충분히 확보된다","P와 Q 모두 적절하지 않을 수 있다. P는 가상 공간이라 의사소통이 어렵고, Q는 높은 수준의 테스트 독립성이 필요할 수 있다","P에는 적용할 수 있지만, Q는 높은 수준의 테스트 독립성이 필요할 수 있어 전체 팀 접근법이 적절하지 않을 수 있다"],"ans":[3],"exp":"1.5.2: 같은 공간을 사용하는 것(co-location)은 의사소통과 상호작용을 용이하게 하므로 팀원들은 (물리적 또는 가상의) 작업 공간을 공유한다. 그래서 P처럼 가상 작업 공간을 함께 쓰는 팀도 전체 팀 접근법을 적용할 수 있다. 반면 정황에 따라 전체 팀 접근법이 적절하지 않을 수도 있으며, 안전이 치명적인 경우에는 높은 수준의 테스트 독립성이 필요할 수 있다(Q). 1.5.3에 따르면 같은 팀 동료가 테스트하는 것은 '일정 수준의 독립성'일 뿐이다. 함정 포인트: '같은 공간 사용'을 물리적 사무실로만 이해하면 P를 잘못 배제하게 되고, 팀 동료끼리의 테스트를 높은 독립성으로 착각하면 Q에도 그대로 적용할 수 있다고 판단하게 된다.","why":["작업 공간은 물리적 또는 가상일 수 있어 P를 배제할 이유가 없다. Q는 높은 테스트 독립성이 필요할 수 있어 오히려 적절하지 않을 수 있는 사례다(1.5.2).","같은 팀 동료의 테스트는 일정 수준의 독립성이다(1.5.3). 안전이 치명적인 정황에 필요할 수 있는 높은 수준의 독립성과는 다르다(1.5.2).","Q에 대한 판단은 맞지만, 가상 작업 공간도 공유 작업 공간으로 인정되므로 P를 적절하지 않다고 볼 근거가 없다(1.5.2).","정답. 가상 작업 공간도 공유 작업 공간이고, 안전이 치명적인 정황에서는 높은 테스트 독립성이 필요해 이 접근법이 적절하지 않을 수 있다(1.5.2)."],"ref":"1.5.2","hard":true},{"id":"h1-006","ch":1,"lo":"FL-1.5.2","k":1,"q":"애자일 팀에 새로 합류한 테스터가 전체 팀 접근법(whole team approach)에 대해 다음과 같이 메모했다.\n\ni. 익스트림 프로그래밍에서 시작되었으며, 테스터가 다양한 수준의 독립성에서 테스팅을 수행할 수 있는 능력을 기반으로 한다\nii. 필요 지식과 기술을 갖춘 팀원이라면 누구나 어떤 작업이라도 수행할 수 있다\niii. 테스트 전략과 테스트 자동화 접근법은 개발자가 단독으로 정하고, 테스터는 정해진 방식에 따라 테스트를 수행한다\niv. 테스터는 테스팅 지식을 다른 팀원과 공유하게 되며, 제품 개발에 영향을 주게 된다\nv. 팀 내 의사소통과 협업을 강화하는 장점이 있다\n\n실라버스에 비추어 옳은 것만 모두 고른 것은?","opts":["i, iv","ii, iv, v","iii, v","i, ii, iii"],"ans":[1],"exp":"1.5.2: 익스트림 프로그래밍에서 시작된 전체 팀 접근법은 팀 환경에서 효과적으로 일하고 팀 목표에 긍정적으로 기여하는 능력을 기반으로 한다(i 틀림). 필요 지식과 기술을 갖춘 팀원이라면 누구나 어떤 작업이라도 수행할 수 있다(ii 옳음). 테스터는 개발자와 협력해 테스트 전략을 협의하고 테스트 자동화 접근법을 결정한다(iii 틀림). 따라서 테스터는 테스팅 지식을 다른 팀원과 공유하게 되며, 제품 개발에 영향을 주게 된다(iv 옳음). 이 접근법은 팀의 활력을 높이고 팀 내 의사소통과 협업을 강화한다(v 옳음). 함정 포인트: '다양한 수준의 독립성에서 테스팅을 수행할 수 있어야 한다'는 1.5 도입부에서 '팀플레이' 바로 옆에 나오는 우수한 테스터의 조건이라 i이 그럴듯해 보인다. 하지만 전체 팀 접근법의 기반으로 제시된 능력은 아니다.","why":["i이 들어 있어 틀렸다. 전체 팀 접근법은 팀 환경에서 효과적으로 일하고 팀 목표에 긍정적으로 기여하는 능력을 기반으로 한다(1.5.2). ii와 v도 빠졌다.","정답. ii, iv, v가 1.5.2와 일치한다.","iii이 들어 있어 틀렸다. 테스터는 개발자와 협력해 테스트 전략을 협의하고 테스트 자동화 접근법을 결정한다(1.5.2).","i과 iii이 들어 있어 틀렸다(1.5.2)."],"ref":"1.5.2","hard":true},{"id":"h1-007","ch":1,"lo":"FL-1.1.2","k":2,"q":"모바일 결제 앱 개발 중 다음 일이 순서대로 있었다.\n\n① 요구사항 리뷰에서 테스터가 '환불 한도' 값이 두 문서에 서로 다르게 적힌 결함(defect)을 찾았다.\n② 문서 작성자가 두 문서의 값을 일치하도록 고쳤다.\n③ 시스템 테스팅 중 테스터가 환불 금액이 음수로 표시되는 장애(failure)를 관찰했다.\n④ 개발자가 같은 입력으로 장애를 다시 일으킨 뒤, 코드를 분석해 부호 처리 결함을 찾아 수정했다.\n⑤ ③을 수행한 테스터가 같은 테스트를 다시 실행해 문제가 해결됐는지 확인했다.\n⑥ 수정 사항이 다른 기능에 장애를 일으키지 않았는지 확인하는 테스트를 추가로 수행했다.\n\n테스팅과 디버깅(debugging)을 구별한 설명으로 옳은 것 두 개를 고르시오.","opts":["④에서 개발자가 같은 입력으로 장애를 다시 일으킨 것은 동적 테스팅이므로, 디버깅이 아니라 테스팅에 해당한다","①에서 결함을 찾았으므로, ②를 하기 전에 장애를 재현하고 분석하는 디버깅 단계를 먼저 거쳐야 한다","②는 정적 테스팅으로 식별한 결함을 제거한 것이므로, 문서를 고친 일이지만 디버깅에 해당한다","⑤는 디버깅 프로세스의 마지막 단계이므로, ③을 수행한 테스터보다 결함을 수정한 개발자가 하는 것이 바람직하다","⑤는 확인 테스팅, ⑥은 리그레션 테스팅이며, 둘 다 디버깅이 끝난 뒤 수행하는 테스팅이다"],"ans":[2,4],"exp":"1.1.2: 동적 테스팅이 장애를 유발했을 때 디버깅은 장애의 원인(결함)을 찾고 분석해 제거한다. 일반적인 디버깅 프로세스는 장애 재현, 분석(결함 찾기), 결함 수정이다(④). 정적 테스팅으로 결함을 식별한 경우 디버깅은 장애 재현과 분석 없이 결함 제거에 중점을 둔다(②). 이후 확인 테스팅(confirmation testing)으로 문제가 제대로 수정됐는지 확인하며, 처음 테스트를 수행한 사람이 다시 하는 것이 바람직하다(⑤). 수정 사항이 다른 부분에 장애를 일으키지 않았는지 리그레션 테스팅(regression testing)을 추가로 수행할 수 있다(⑥). ①과 ③은 테스팅이다. 함정 포인트: ②는 코드가 아니라 문서를 고친 일이라 디버깅이 아니라고 생각하기 쉽다. 정적 테스팅으로 찾은 결함을 제거하는 것도 디버깅이다.","why":["장애 재현은 일반적인 디버깅 프로세스의 첫 단계다(1.1.2). 같은 입력으로 장애를 다시 일으킨 것은 디버깅의 일부다.","정적 테스팅은 장애를 유발하지 않고 결함을 직접 찾으므로 장애를 재현하고 분석할 필요가 없다(1.1.2).","정답. 정적 테스팅으로 식별한 결함의 제거는 디버깅이다(1.1.2).","확인 테스팅은 처음 테스트를 수행한 사람이 다시 하는 것이 바람직하다(1.1.2). 또 확인 테스팅은 디버깅 단계가 아니다.","정답. 수정 여부 확인은 확인 테스팅, 다른 부분의 장애 확인은 리그레션 테스팅이며, 둘 다 디버깅 뒤에 이어지는 테스팅이다(1.1.2)."],"ref":"1.1.2","hard":true},{"id":"h1-008","ch":1,"lo":"FL-1.2.1","k":2,"q":"다음은 여러 프로젝트에서 있었던 일이다.\n\n1. 의료기기 회사가 인허가 심사 서류에 첨부할 수 있도록, 심사 기관이 요구하는 테스트를 수행하고 그 기록을 남겼다.\n2. 운영위원회가 시스템 테스팅 결과 요약에 나온 통과율과 미해결 결함 수를 보고 출시 일정을 확정했다.\n3. 농산물 직거래 앱 프로젝트에서, 테스터가 콜센터 상담 기록을 분석해 앱을 쓰는 농민들이 자주 겪는 불편을 파악하고, 이를 테스트 컨디션에 반영했다.\n4. 요구사항 리뷰에서 테스터가 찾은 결함을 작성자가 고친 뒤, 해당 기능의 운영 장애가 이전 버전보다 크게 줄었다.\n\nA. 테스팅은 결함을 식별하는 비용 효율적인 방법이며, 테스트 대상의 품질 향상에 간접적으로 기여한다\nB. 테스팅은 개발 프로젝트에서 사용자를 간접적으로 대변한다\nC. 테스팅은 계약 또는 법적 요구사항을 충족하거나 규제 표준을 준수하기 위해 필요할 수 있다\nD. 테스팅은 테스트 대상의 품질을 직접 평가하는 방법을 제공하며, 그 결과는 다음 단계로 넘어가는 결정에 기여한다\n\n사례 1~4와 테스팅의 기여 A~D를 가장 적절하게 연결한 것은?","opts":["1C, 2A, 3B, 4D","1B, 2D, 3C, 4A","1C, 2D, 3B, 4A","1B, 2A, 3C, 4D"],"ans":[2],"exp":"1.2.1: 계약 또는 법적 요구사항을 충족하거나 규제 표준 준수를 위해 테스팅이 필요할 수 있다(1→C). 테스팅은 테스트 대상의 품질을 직접 평가하는 방법을 제공하고, 그 결과는 릴리스 같은 다음 단계 결정에 기여한다(2→D). 테스팅은 사용자를 간접적으로 대변하며, 테스터는 자신이 이해한 사용자 요구사항이 개발수명주기 전반에 반영되게 한다(3→B). 테스팅은 결함을 식별하는 비용 효율적인 방법이고, 결함은 테스팅이 아닌 디버깅으로 제거되므로 품질 향상에는 간접적으로 기여한다(4→A). 함정 포인트: 2와 4는 모두 품질과 관련된 결과라 헷갈린다. 2는 측정한 품질을 근거로 '결정'한 사례이고, 4는 찾은 결함이 제거된 뒤 품질이 '나아진' 사례다.","why":["2A와 4D가 틀렸다. 테스트 결과로 출시를 결정한 것은 품질의 직접 평가(D), 찾은 결함이 고쳐져 장애가 줄어든 것은 간접 기여(A)다(1.2.1).","1B와 3C가 틀렸다. 인허가용 테스트는 규제 표준 준수(C), 사용자의 불편을 테스트에 반영한 것은 사용자의 간접적 대변(B)이다(1.2.1).","정답. 1C, 2D, 3B, 4A가 모두 1.2.1의 설명과 일치한다.","네 짝이 모두 틀렸다. 1은 C, 2는 D, 3은 B, 4는 A다(1.2.1)."],"ref":"1.2.1","hard":true},{"id":"h1-009","ch":1,"lo":"FL-1.2.3","k":2,"q":"해외 지사 개설을 앞둔 회사에서 다음 일이 있었다.\n\n• 설정 항목 400여 개가 서로 참조하도록 얽혀 있는 배포용 빌드 파일을 수정하던 개발자가, 구조가 복잡해 연관 항목을 놓치는 바람에 날짜 형식 설정 값을 잘못 입력했다.\n• 이 설정 값은 특정 해외 지역 설정을 쓰는 서버에 배포될 때만 날짜를 잘못 표시하게 만든다. 지난 2년간 국내 서버에서는 문제가 한 번도 관찰되지 않았다.\n\n이 사례에 대한 다음 설명을 보자.\n\ni. 빌드 파일은 소스 코드가 아닌 지원 산출물이므로, 그 안의 잘못된 설정 값은 결함(defect)으로 볼 수 없다\nii. 국내 서버에서 2년간 장애(failure)가 관찰되지 않았다고 해서 이 결함이 없다고 볼 수는 없다\niii. 설정 항목이 복잡하게 얽힌 빌드 파일을 다뤄야 했던 상황은 오류(error)로 이어진 상황이므로 근본 원인(root cause)으로 볼 수 있다\niv. 설정 값을 잘못 입력한 개발자의 행위는 결함이고, 빌드 파일에 남은 잘못된 값은 오류다\nv. 이 설정 값을 배포 전 리뷰에서 찾았다면, 장애가 발생하지 않았으므로 근본 원인 분석의 대상이 되지 않는다\n\n옳은 것만 모두 고른 것은?","opts":["ii, iii","i, ii, iv","iii, v","i, iv, v"],"ans":[0],"exp":"1.2.3: 결함은 요구사항 명세서나 테스트 스크립트 같은 문서, 소스 코드, 빌드 파일 같은 지원 산출물에서 나올 수 있다(i 틀림). 실행될 경우 항상 장애를 일으키는 결함도 있지만, 특정 상황에서만 장애를 일으키는 결함도 있다(ii 옳음). 사람은 작업 산출물의 복잡성 등 다양한 이유로 오류를 범하고, 근본 원인은 문제 발생의 근본적인 이유(예: 오류로 이어지는 상황)다(iii 옳음). 사람의 실수가 오류이고, 그 결과 산출물에 생긴 결점이 결함이다(iv는 거꾸로라서 틀림). 근본 원인 분석은 보통 장애가 발생하거나 결함을 식별한 경우 수행한다(v 틀림). 함정 포인트: 결함을 '소스 코드의 버그'로만 알면 i을, 근본 원인 분석을
