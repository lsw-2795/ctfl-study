7","ch":4,"lo":"FL-4.2.3","k":3,"q":"카페 앱의 음료 할인 규칙을 제한-입력(limited-entry) 결정 테이블로 만들었다. 조건은 다음 네 가지다.\n- C1: 앱 회원이다\n- C2: 골드 등급이다(골드 등급은 앱 회원만 받을 수 있다)\n- C3: 텀블러를 가져왔다\n- C4: 주문 시각이 10:00 이전이다(10:00 정각은 포함하지 않는다)\n\n팀은 모든 조건 조합을 담은 전체 결정 테이블을 만든 뒤, 실현 불가능한 조합의 열만 삭제했다(열 병합은 하지 않았다). 그다음 아래 테스트 케이스 6개를 실행했다.\n\n이 테스트 케이스들로 달성한 결정 테이블 테스팅(decision table testing) 커버리지는?","table":{"head":["테스트","회원 구분","텀블러","주문 시각"],"rows":[["T1","골드 회원","가져옴","09:00"],["T2","비회원","가져옴","11:00"],["T3","일반 회원","안 가져옴","08:30"],["T4","골드 회원","가져옴","09:40"],["T5","비회원","안 가져옴","07:50"],["T6","일반 회원","안 가져옴","10:00"]]},"opts":["31.25%","약 41.7%","약 33.3%","50%"],"ans":[1],"exp":"풀이(4.2.3):\n① 조건이 4개이므로 전체 결정 테이블은 2⁴ = 16열이다. 비회원(C1=F)이면서 골드(C2=T)인 조합은 실현 불가능하다. 이때 C3, C4는 아무 값이나 될 수 있으므로 2 × 2 = 4열을 삭제한다. 커버리지 항목(실현 가능한 열)은 12개다.\n② 테스트를 (C1, C2, C3, C4)로 바꾼다. T1 (T,T,T,T), T2 (F,F,T,F), T3 (T,F,F,T), T4 (T,T,T,T), T5 (F,F,F,T), T6 (T,F,F,F). T6는 10:00 정각이라 C4=F다.\n③ 서로 다른 열은 T1(=T4), T2, T3, T5, T6의 5개다.\n④ 커버리지 = 5/12 ≈ 41.7%.\n검산: 실현 가능한 열을 다시 세면 C1=T일 때 8열, C1=F일 때는 C2=F만 가능해 4열, 합계 12열이다.\n함정 포인트: 실현 불가능한 열을 빼지 않으면 5/16 = 31.25%, T4를 T1과 다른 열로 세면 6/12 = 50%, T6를 10시 이전으로 보면 4/12 ≈ 33.3%가 나온다.","why":["틀림. 분모를 전체 16열로 둔 값(5/16)이다. 커버리지 항목은 실현 가능한 조건 조합의 열이므로 분모는 12다(4.2.3).","정답. 실현 가능한 열 12개 중 서로 다른 5개를 실행했다(5/12)(4.2.3).","틀림. T6(10:00)를 10시 이전으로 보면 T3과 같은 열이 되어 4/12가 된다. 조건에서 10:00 정각은 포함하지 않으므로 T6는 새로운 열이다(4.2.3).","틀림. T1과 T4는 같은 조건 조합(T,T,T,T)이라 같은 열을 실행한다. 같은 열을 여러 번 실행해도 한 번만 센다(4.2.3)."],"ref":"4.2.3","hard":true},{"id":"h4k3-008","ch":4,"lo":"FL-4.2.3","k":3,"q":"쇼핑몰 첫 주문 혜택 요구사항을 다음 결정 테이블로 정리했다. '–'는 해당 조건 값이 결과에 영향이 없음을 뜻한다. 동작 칸의 X는 그 동작이 발생해야 함을, 빈칸은 발생하지 않아야 함을 뜻한다.\n\n테스터는 결정 테이블 테스팅(decision table testing)으로 요구사항의 문제를 찾으려 한다. 다음 입력 조합 중 어떤 결정 규칙에도 해당하지 않아 요구사항의 누락을 드러내는 것을 두 개 고르시오.","table":{"head":["조건/동작","R1","R2","R3","R4","R5"],"rows":[["C1 신규 가입 고객","T","T","F","F","–"],["C2 주문 금액 30,000원 이상","T","F","–","F","T"],["C3 추천인 코드 입력","–","T","T","F","T"],["A1 웰컴 쿠폰 5,000원","X","","","",""],["A2 웰컴 쿠폰 2,000원","","X","","",""],["A3 추천 포인트 1,000점","","","X","",""],["A4 무료 배송","","","","","X"]]},"opts":["신규 가입 고객, 주문 금액 40,000원, 추천인 코드 입력","신규 가입 고객, 주문 금액 9,000원, 추천인 코드 미입력","기존 고객, 주문 금액 20,000원, 추천인 코드 입력","기존 고객, 주문 금액 35,000원, 추천인 코드 입력","기존 고객, 주문 금액 45,000원, 추천인 코드 미입력"],"ans":[1,4],"exp":"풀이(4.2.3): 결정 테이블 테스팅은 누락되거나 모순되는 요구사항을 찾는 데 도움이 된다. 조건 3개의 8가지 조합을 규칙과 하나씩 맞춰 본다(C1, C2, C3 순).\n- (T,T,T): R1, R5 → 동작이 서로 달라 모순\n- (T,T,F): R1\n- (T,F,T): R2\n- (T,F,F): 해당 규칙 없음 → 누락\n- (F,T,T): R3, R5 → 동작이 서로 달라 모순\n- (F,T,F): 해당 규칙 없음 → 누락\n- (F,F,T): R3\n- (F,F,F): R4\n검산: 누락인 두 조합을 다시 확인했다. (T,F,F)는 C1=T인 R1·R2와 C2 또는 C3에서 어긋나고, (F,T,F)는 C1=F인 R3·R4와 C3 또는 C2에서 어긋나며, 두 조합 모두 R5(C2=T, C3=T)와도 맞지 않는다.\n함정 포인트: (T,T,T)와 (F,T,T)도 요구사항 문제를 드러내는 조합이지만, 규칙이 없는 '누락'이 아니라 두 규칙이 겹치는 '모순'이다.","why":["틀림. (T, T, T)는 R1과 R5에 동시에 해당하고 두 규칙의 동작이 달라 모순이다. 해당 규칙이 없는 누락과는 다르다(4.2.3).","정답. (T, F, F)는 R1(C2=T 필요), R2(C3=T 필요), R3·R4(C1=F 필요), R5(C2=T 필요) 어느 것과도 맞지 않는다. 기대 결과를 정할 수 없는 누락이다(4.2.3).","틀림. (F, F, T)는 R3 하나에만 해당한다. 누락도 모순도 아니다(4.2.3).","틀림. (F, T, T)는 R3과 R5에 동시에 해당하고 동작이 달라 모순이다. 누락은 아니다(4.2.3).","정답. (F, T, F)는 R1·R2(C1=T 필요), R3(C3=T 필요), R4(C2=F 필요), R5(C3=T 필요) 어느 것과도 맞지 않는 누락이다(4.2.3)."],"ref":"4.2.3","hard":true},{"id":"h4k3-009","ch":4,"lo":"FL-4.2.3","k":3,"q":"도서관 앱의 대출 신청 규칙을 다음 확장-입력(extended-entry) 결정 테이블로 정리했다. '–'는 해당 조건 값이 결과에 영향이 없음을 뜻하고, 동작 칸의 X는 그 동작이 발생해야 함을, 빈칸은 발생하지 않아야 함을 뜻한다.\n- 회원은 종이책을 동시에 최대 5권까지 빌릴 수 있다. 전자책은 이 권수에 들어가지 않는다.\n- C2 '연체 중'은 지금 빌리고 있는 종이책 가운데 반납 기한이 지난 책이 한 권 이상 있다는 뜻이다.\n- 업무 담당자는 C1과 C2의 값을 조합해 열을 만든 뒤, '5권·연체 없음' 열만 C3 값에 따라 둘로 나눴다. 아직 삭제한 열은 없다.\n\n지금까지 다음 테스트 케이스를 실행했다.\n- TC1: 빌린 종이책 0권, 연체 없음, 종이책 신청\n- TC2: 빌린 종이책 4권, 연체 없음, 전자책 신청\n- TC3: 빌린 종이책 5권, 연체 없음, 종이책 신청\n- TC4: 빌린 종이책 5권, 연체 중, 전자책 신청\n- TC5: 빌린 종이책 1권, 연체 없음, 종이책 신청\n\n다음 진술 중 옳은 것을 모두 고른 것은?\ni. TC1~TC5로 달성한 결정 테이블 커버리지는 약 67%다.\nii. TC2와 TC5는 같은 열을 실행한다.\niii. '빌린 종이책 5권, 연체 중, 종이책 신청' 테스트 케이스를 추가하면 결정 테이블 커버리지가 높아진다.\niv. 100% 결정 테이블 커버리지를 달성하려면 테스트 케이스가 최소 3개 더 필요하다.\nv. '빌린 종이책 2권, 연체 중, 종이책 신청' 테스트 케이스 하나를 추가하면 결정 테이블 커버리지는 약 83%가 된다.","table":{"head":["조건/동작","R1","R2","R3","R4","R5","R6","R7"],"rows":[["C1 빌린 종이책 권수","0권","0권","1~4권","1~4권","5권","5권","5권"],["C2 연체 중","F","T","F","T","F","F","T"],["C3 신청한 책이 전자책","–","–","–","–","F","T","–"],["A1 대출 승인","X","","X","","","X",""],["A2 '연체 도서를 먼저 반납하세요' 안내","","X","","X","","","X"],["A3 '대출 한도 초과' 안내","","","","","X","",""]]},"opts":["ii, iv","i, ii, v","ii, iii, iv","i, iii, v"],"ans":[1],"exp":"풀이(4.2.3): 커버리지 항목은 실현 가능한 조건 조합을 가진 열이다.\n① R2는 빌린 종이책이 0권인데 연체 중인 조합이다. '연체 중'은 지금 빌린 종이책 가운데 기한이 지난 책이 있다는 뜻이므로 0권이면 성립할 수 없다. 실현 불가능한 열이라 커버리지 항목에서 빠지고, 항목은 R1, R3, R4, R5, R6, R7의 6개다.\n② 테스트를 열에 대응시킨다. TC1→R1, TC2→R3(4권은 1~4권, C3는 '–'), TC3→R5, TC4→R7(C3는 '–'), TC5→R3.\n③ 실행한 열은 R1, R3, R5, R7의 4개 → 4/6 ≈ 67%(i 옳음). TC2와 TC5는 둘 다 R3이다(ii 옳음).\n④ '5권·연체 중·종이책 신청'은 R7이라 TC4가 이미 실행한 열이다(iii 틀림). 남은 열은 R4, R6의 2개라 최소 2개면 된다(iv 틀림). '2권·연체 중·종이책 신청'은 R4라 5/6 ≈ 83%가 된다(v 옳음).\n검산: 열마다 테스트를 다시 대조했다. R1 TC1, R3 TC2·TC5, R5 TC3, R7 TC4. R4·R6은 아직 실행하지 않았고 R2는 실현 불가능하다.\n함정 포인트: R2를 커버리지 항목으로 세면 4/7 ≈ 57%와 '3개 더 필요'가 나오고, '–'를 놓치면 TC4와 '5권·연체 중·종이책 신청'을 다른 열로 보게 된다.","why":["틀림. iv가 틀렸고 i, v가 빠졌다. 실현 불가능한 R2는 커버리지 항목이 아니므로 분모는 6이고, 남은 열은 R4, R6의 2개다(4.2.3).","정답. i(4/6), ii(둘 다 R3), v(R4 추가로 5/6)가 옳다(4.2.3).","틀림. iii과 iv가 틀렸다. R7은 C3가 '–'라 '5권·연체 중·종이책 신청'은 TC4와 같은 열이고, R2를 빼면 남은 열은 2개다(4.2.3).","틀림. iii이 틀렸고 ii가 빠졌다. R3과 R7은 C3가 '–'라 신청한 책의 종류와 관계없이 열 하나로 실행된다(4.2.3)."],"ref":"4.2.3","hard":true},{"id":"h4k3-010","ch":4,"lo":"FL-4.2.4","k":3,"q":"주차장 출구 차단기를 상태 전이 테스팅(state transition testing)으로 테스트한다. 상태 테이블(state table)은 아래와 같다. 열은 이벤트이고 대괄호 안은 가드(guard) 조건이다([정기권]은 정기권 차량, [일반]은 일반 차량). 셀에는 다음 상태가 적혀 있고, 빈 셀은 비유효 전이다.\n\n팀 규칙: 결함 마스킹(defect masking)을 피하려고 테스트 케이스 하나에는 비유효 전이를 최대 하나만 넣는다. 비유효 전이를 시도하면 상태는 바뀌지 않고 그 테스트 케이스는 끝난다. 모든 테스트 케이스는 '닫힘'에서 시작한다.\n\n지금까지 실행한 테스트 케이스는 다음과 같다. [ ]는 비유효 전이를 시도한 이벤트다.\n- TC1: 차량 감지[일반] → 정산 완료 → 차량 이탈\n- TC2: 차량 감지[정기권] → 차량 이탈 → 차량 감지[일반] → [차량 감지[정기권]]\n- TC3: [차량 이탈]\n- TC4: 차량 감지[정기권] → [정산 완료]\n\n현재 달성한 모든 전이 커버리지(all transitions coverage)와, 이를 100%로 만들려고 추가해야 하는 최소 테스트 케이스 수로 옳은 것은?","table":{"head":["상태 \\ 이벤트","차량 감지[정기권]","차량 감지[일반]","정산 완료","차량 이탈"],"rows":[["닫힘","열림","정산 대기","",""],["정산 대기","","","열림","닫힘"],["열림","","","","닫힘"]]},"opts":["약 43%, 4개","약 58%, 4개","약 58%, 5개","약 67%, 4개"],"ans":[1],"exp":"풀이(4.2.4):\n① 모든 전이 커버리지의 커버리지 항목은 상태 테이블에 표시된 모든 전이, 즉 셀 3 × 4 = 12개다. 유효 전이는 5개(닫힘-[정기권], 닫힘-[일반], 정산 대기-정산 완료, 정산 대기-차량 이탈, 열림-차량 이탈), 비유효 전이는 빈 셀 7개다.\n② 실행한 유효 전이: TC1이 닫힘-[일반], 정산 대기-정산 완료, 열림-차량 이탈을, TC2가 닫힘-[정기권]을 새로 실행한다(나머지는 중복). 서로 다른 유효 전이는 4개이고 정산 대기-차량 이탈은 아직 없다.\n③ 시도한 비유효 전이: 정산 대기-[정기권](TC2), 닫힘-차량 이탈(TC3), 열림-정산 완료(TC4)의 3개.\n④ 모든 전이 커버리지 = (4 + 3) / 12 = 7/12 ≈ 58%.\n⑤ 남은 비유효 전이는 닫힘-정산 완료, 정산 대기-[일반], 열림-[정기권], 열림-[일반]의 4개다. 테스트 케이스 하나에 비유효 전이는 하나뿐이므로 최소 4개가 필요하다. 남은 유효 전이는 그중 하나에 넣을 수 있다. 예: 차량 감지[일반] → 차량 이탈 → [정산 완료].\n검산: 비유효 전이 7개 = 닫힘 2 + 정산 대기 2 + 열림 3. 그중 3개를 시도했으니 4개가 남는다.\n함정 포인트: 남은 유효 전이를 위해 테스트 케이스를 따로 만들면 5개가 되고, 비유효 전이 수만 분모로 쓰면 3/7 ≈ 43%가 나온다.","why":["틀림. 시도한 비유효 전이 3개를 비유효 전이 수 7로만 나눈 값이다. 모든 전이 커버리지는 유효·비유효 전이를 함께 세어 전체 12로 나눈다(4.2.4).","정답. 유효 4개 + 비유효 3개 = 7/12 ≈ 58%다. 남은 비유효 전이 4개는 테스트 케이스가 하나씩 필요하고, 남은 유효 전이는 그중 하나에 넣을 수 있다(4.2.4).","틀림. 남은 유효 전이(정산 대기에서 차량 이탈)는 비유효 전이를 시도하기 전에 같은 테스트 케이스 안에서 실행할 수 있어 별도 테스트 케이스가 필요 없다(4.2.4).","틀림. 유효 전이 5개를 모두 실행했다고 보고 (5 + 3)/12로 계산한 값이다. 정산 대기에서 차량 이탈하는 전이는 아직 실행하지 않았다(4.2.4)."],"ref":"4.2.4","hard":true},{"id":"h4k3-011","ch":4,"lo":"FL-4.2.4","k":3,"q":"쇼핑 앱의 상태 전이 모델은 아래 표와 같다(유효 전이 8개). 모든 테스트 케이스는 '로그아웃' 상태에서 시작하고, 어느 상태에서 끝나도 된다.\n\n다음 이벤트 순서(테스트 케이스) 중 두 개를 함께 실행해 100% 유효 전이 커버리지(valid transitions coverage)를 달성하려고 한다. 이 조건을 만족하는 두 테스트 케이스를 고르시오.","table":{"head":["번호","현재 상태","이벤트","다음 상태"],"rows":[["T1","로그아웃","로그인","로그인됨"],["T2","로그인됨","상품 담기","장바구니"],["T3","장바구니","상품 담기","장바구니"],["T4","장바구니","결제 시작","결제 중"],["T5","결제 중","결제 취소","장바구니"],["T6","결제 중","결제 완료","로그인됨"],["T7","로그인됨","로그아웃","로그아웃"],["T8","장바구니","비우기","로그인됨"]]},"opts":["로그인 → 상품 담기 → 상품 담기 → 결제 시작 → 결제 완료 → 로그아웃","로그인 → 상품 담기 → 비우기 → 로그아웃","로그인 → 상품 담기 → 결제 시작 → 결제 취소 → 결제 시작 → 결제 완료","로그인 → 상품 담기 → 결제 시작 → 결제 취소 → 비우기","로그인 → 상품 담기 → 상품 담기 → 비우기 → 상품 담기 → 비우기"],"ans":[0,3],"exp":"풀이(4.2.4): 각 이벤트 순서를 따라가며 실행한 전이를 적는다.\n- '…상품 담기 → 상품 담기 → 결제 시작 → 결제 완료 → 로그아웃': T1, T2, T3, T4, T6, T7\n- '…결제 시작 → 결제 취소 → 비우기': T1, T2, T4, T5, T8\n- '…비우기 → 로그아웃': T1, T2, T8, T7\n- '…결제 취소 → 결제 시작 → 결제 완료': T1, T2, T4, T5, T4, T6 → {T1, T2, T4, T5, T6}\n- '…상품 담기 → 비우기 → 상품 담기 → 비우기': T1, T2, T3, T8, T2, T8 → {T1, T2, T3, T8}\n처음 두 순서를 합치면 T1~T8이 모두 실행된다.\n검산: 나머지 9개 짝은 모두 하나 이상 빠진다. 예를 들어 첫 순서와 '결제 취소 → 결제 시작 → 결제 완료' 순서를 합치면 T8이, '결제 취소 → 결제 시작 → 결제 완료'와 '상품 담기 → 비우기' 반복 순서를 합치면 T7이 빠진다.\n함정 포인트: '상품 담기'는 로그인됨 상태에서 하면 T2, 장바구니 상태에서 하면 T3이다. 같은 이벤트라도 출발 상태가 다르면 다른 전이다.","why":["정답. T1, T2, T3, T4, T6, T7을 실행한다. 빠진 T5(결제 취소)와 T8(비우기)은 '결제 시작 → 결제 취소 → 비우기' 순서가 채운다(4.2.4).","틀림. T1, T2, T8, T7만 실행한다. 남은 T3, T4, T5, T6을 모두 가진 보기가 없다. 예를 들어 '…결제 완료 → 로그아웃' 순서와 합쳐도 T5가 빠진다(4.2.4).","틀림. T1, T2, T4, T5, T6을 실행한다. 남은 T3, T7, T8을 모두 가진 보기가 없다. '…결제 완료 → 로그아웃' 순서와 합치면 T8이, '상품 담기 → 비우기' 반복 순서와 합치면 T7이 빠진다(4.2.4).","정답. T1, T2, T4, T5, T8을 실행해, '…상품 담기 → 상품 담기 → 결제 시작 → 결제 완료 → 로그아웃' 순서에 없는 T5와 T8을 채운다(4.2.4).","틀림. T1, T2, T3, T8만 실행한다. 남은 T4, T5, T6, T7을 모두 가진 보기가 없다. '…결제 완료 → 로그아웃' 순서와 합치면 T5가, '결제 취소 → 결제 시작 → 결제 완료' 순서와 합치면 T7이 빠진다(4.2.4)."],"ref":"4.2.4","hard":true},{"id":"h4k3-012","ch":4,"lo":"FL-4.2.4","k":3,"q":"세탁기 제어 소프트웨어의 상태 테이블(state table)은 아래와 같다. 셀에는 다음 상태가 적혀 있고, 빈 셀은 비유효 전이다. 모든 테스트 케이스는 '대기'에서 시작한다.\n팀 규칙: 결함 마스킹(defect masking)을 피하려고 테스트 케이스 하나에는 비유효 전이를 최대 하나만 넣는다. 비유효 전이를 시도하면 상태는 바뀌지 않고 그 테스트 케이스는 끝난다.\n\n지금까지 실행한 테스트 케이스는 다음과 같다. [ ]는 비유효 전이를 시도한 이벤트다.\n- TC1: 시작 → 종료 신호 → 문 열기\n- TC2: 시작 → 일시정지 → 시작 → 일시정지 → 문 열기\n- TC3: [일시정지]\n\n다음 진술 중 옳은 것을 모두 고른 것은?\ni. TC2만으로 달성한 유효 전이 커버리지(valid transitions coverage)는 50%다.\nii. TC1과 TC2를 함께 실행하면 유효 전이 커버리지 100%를 달성한다.\niii. TC1~TC3을 모두 실행했을 때 모든 전이 커버리지(all transitions coverage)는 43.75%다.\niv. TC1~TC3은 그대로 두고 새 테스트 케이스만 추가한다면, 팀 규칙을 지키면서 모든 전이 커버리지를 100%로 만드는 데 최소 9개가 필요하다.\nv. TC2의 마지막 단계 뒤에 '시작' 이벤트를 하나 더 넣으면 비유효 전이를 하나 더 시도하게 되어, TC1~TC3의 모든 전이 커버리지는 50%가 된다.","table":{"head":["상태 \\ 이벤트","시작","일시정지","종료 신호","문 열기"],"rows":[["대기","동작 중","","",""],["동작 중","","일시정지됨","완료",""],["일시정지됨","동작 중","","","대기"],["완료","","","","대기"]]},"opts":["i, iii, iv","ii, iii, v","i, ii, iii, iv","ii, iii, iv"],"ans":[3],"exp":"풀이(4.2.4):\n① 유효 전이(값이 있는 셀)는 6개다. 대기-시작, 동작 중-일시정지, 동작 중-종료 신호, 일시정지됨-시작, 일시정지됨-문 열기, 완료-문 열기. 셀은 4 × 4 = 16개이므로 비유효 전이는 10개다.\n② TC2의 전이는 대기-시작, 동작 중-일시정지, 일시정지됨-시작, 동작 중-일시정지(중복), 일시정지됨-문 열기다. 서로 다른 유효 전이는 4개 → 4/6 ≈ 67%(i 틀림).\n③ TC1은 대기-시작, 동작 중-종료 신호, 완료-문 열기를 실행한다. TC2와 합치면 6개 모두다(ii 옳음).\n④ TC3은 대기-일시정지 비유효 전이 1개를 시도한다. 모든 전이 커버리지 = (6 + 1) / 16 = 43.75%(iii 옳음).\n⑤ 남은 비유효 전이는 10 - 1 = 9개다. iv는 TC1~TC3을 바꾸지 않는다고 했으므로 새 테스트 케이스 하나에 비유효 전이를 하나씩 넣어야 하고, 최소 9개가 필요하다. 유효 전이는 이미 모두 실행했고 네 상태 모두 '대기'에서 유효 전이로 갈 수 있으므로 9개면 충분하다(iv 옳음).\n⑥ TC2는 일시정지됨-문 열기로 '대기'에서 끝난다. 대기에서 '시작'은 유효 전이이고 이미 실행한 전이라 커버리지는 43.75% 그대로다(v 틀림).\n검산: 비유효 셀을 행별로 세면 대기 3, 동작 중 2, 일시정지됨 2, 완료 3으로 10개다.\n함정 포인트: 이벤트 이름만 세면 TC2는 시작·일시정지·문 열기 3개라 50%처럼 보이지만, 같은 '시작'도 대기에서와 일시정지됨에서는 서로 다른 전이다.","why":["틀림. i이 틀렸고 ii가 빠졌다. TC2는 서로 다른 유효 전이 4개를 실행해 약 67%이고, TC1과 합치면 유효 전이 6개를 모두 실행한다(4.2.4).","틀림. v가 틀렸고 iv가 빠졌다. TC2는 '대기'에서 끝나므로 '시작'은 유효 전이다. 남은 비유효 전이 9개는 테스트 케이스가 하나씩 필요하다(4.2.4).","틀림. i이 틀렸다. TC2만의 유효 전이 커버리지는 4/6 ≈ 67%다. 같은 이벤트라도 출발 상태가 다르면 다른 전이로 센다(4.2.4).","정답. ii(유효 전이 6개 모두), iii(7/16), iv(남은 비유효 전이 9개)가 옳다(4.2.4)."],"ref":"4.2.4","hard":true},{"id":"h4k3-013","ch":4,"lo":"FL-4.5.3","k":3,"q":"팀은 인수 테스트 주도 개발(ATDD, acceptance test-driven development)로 다음 사용자 스토리를 개발하고 있다.\n\n사용자 스토리: '정기 배송 구독 고객으로서 앱에서 배송 주기를 바꾸고 싶다. 그래서 내 소비 속도에 맞춰 상품을 받을 수 있다.'\n인수 조건(acceptance criteria):\n- AC1: 배송 주기는 1주, 2주, 4주 중에서 고른다.\n- AC2: 다음 배송 예정일 3일 전까지 변경하면 다음 배송부터 새 주기가 적용된다.\n- AC3: 다음 배송 예정일 3일 전이 지난 뒤 변경하면 다음 배송은 기존 주기대로 나가고, 그 다음 배송부터 새 주기가 적용된다.\n\n팀은 첫 테스트 케이스로 다음을 만들었다.\n- TC1: 2주 주기 구독자가 다음 배송 예정일 10일 전에 4주로 바꾸면, 다음 배송부터 4주 주기가 적용된다.\n\n이어서 추가할 테스트 케이스로 가장 적절한 것은?","opts":["2주 주기 구독자가 다음 배송 예정일 1일 전에 4주로 바꾸면, 다음 배송은 2주 주기로 나가고 그 다음 배송부터 4주가 적용된다.","2주 주기 구독자가 다음 배송 예정일 1일 전에 4주로 바꾸려 하면, 변경이 거부되고 '변경 기한이 지났습니다' 메시지가 표시된다.","2주 주기 구독자가 다음 배송 예정일 5일 전에 4주로 바꾸면, 변경 내용이 저장되고 다음 배송부터 4주 주기가 적용된다.","4주 주기 구독자가 배송 주기를 바꾸면서 구독 상품도 다른 상품으로 바꾸면, 상품 가격 차액이 다음 결제에 반영된다."],"ans":[0],"exp":"풀이(4.5.3):\n① ATDD의 테스트 케이스는 인수 조건을 기반으로 하므로 기대 결과가 인수 조건과 맞아야 한다. 배송 예정일 1일 전 변경은 '3일 전이 지난 뒤'이므로 AC3이 적용된다. 다음 배송은 기존 2주 주기로 나가고, 그 다음부터 4주다.\n② TC1은 AC2(기한 전 변경)를 다룬다. 1일 전 변경 테스트는 AC3이라는 다른 특성을 다루므로 TC1과 겹치지 않는다.\n③ 5일 전 변경은 여전히 3일 전보다 앞이라 TC1과 같은 특성(AC2)을 다시 설명한다. 두 개 이상의 테스트 케이스가 사용자 스토리의 같은 특성을 설명해서는 안 된다.\n④ 상품 변경과 차액 결제는 스토리에 없다. 테스트 케이스는 스토리를 벗어나면 안 된다.\n검산: AC3의 기대 결과는 '거부'가 아니라 '새 주기 적용이 한 번 늦어짐'이다.\n함정 포인트: 5일 전 변경 테스트는 기대 결과까지 맞는 문장이라 끌리지만, TC1과 같은 특성을 다시 다루므로 답이 아니다.","why":["정답. TC1과 다른 특성(AC3, 기한이 지난 뒤 변경)을 다루고, 기대 결과가 AC3과 일치한다(4.5.3).","틀림. AC3에 따르면 기한이 지난 뒤의 변경도 거부되지 않고 그 다음 배송부터 적용된다. 기대 결과가 인수 조건과 맞지 않는다(4.5.3).","틀림. 기대 결과는 맞지만 TC1과 같은 특성(AC2, 기한 전 변경)을 다시 설명한다. 두 개 이상의 테스트 케이스가 같은 특성을 설명해서는 안 된다(4.5.3).","틀림. 구독 상품 변경과 차액 결제는 사용자 스토리에 없는 내용이다. 테스트 케이스는 스토리를 벗어나면 안 된다(4.5.3)."],"ref":"4.5.3","hard":true},{"id":"h4k3-014","ch":4,"lo":"FL-4.5.3","k":3,"q":"팀은 인수 테스트 주도 개발(ATDD)로 다음 사용자 스토리의 테스트 케이스를 도출했다.\n\n사용자 스토리: '모바일 뱅킹 고객으로서 자주 쓰는 계좌를 즐겨찾기로 등록하고 싶다. 그래서 송금할 때 계좌번호를 다시 입력하지 않아도 된다.'\n인수 조건(acceptance criteria):\n- AC1: 즐겨찾기는 최대 20개까지 등록할 수 있고, 21번째를 등록하려 하면 '최대 20개까지 등록할 수 있습니다' 메시지가 표시된다.\n- AC2: 즐겨찾기를 선택하면 송금 화면에 계좌번호가 자동으로 입력된다.\n- AC3: 즐겨찾기 목록 화면은 1초 이내에 표시된다.\n\n테스트 케이스 후보:\n1. 즐겨찾기 20개가 있는 상태에서 새 계좌를 등록하려 하면 안내 메시지가 표시되고 목록은 20개 그대로다.\n2. 즐겨찾기 20개가 있는 상태에서 목록 화면을 열면 1초 이내에 표시된다.\n3. 즐겨찾기 계좌로 송금하면 송금 수수료가 면제된다.\n4. 즐겨찾기 19개가 있는 상태에서 새 계좌를 등록한 뒤 그 계좌를 선택하면 송금 화면에 계좌번호가 자동으로 입력된다.\n\n분류:\nA. 긍정(유효) 테스트 케이스\nB. 부정(비유효) 테스트 케이스\nC. 비기능 품질 특성을 다루는 테스트 케이스\nD. 스토리를 벗어나므로 포함하지 않아야 하는 테스트 케이스\n\n테스트 케이스(1~4)와 분류(A~D)를 올바르게 연결한 것은?","opts":["1B, 2A, 3D, 4C","1A, 2C, 3D, 4B","1B, 2C, 3D, 4A","1B, 2C, 3A, 4D"],"ans":[2],"exp":"풀이(4.5.3): ATDD에서는 보통 긍정 테스트 케이스를 먼저 만들고, 이어서 부정 테스트, 마지막으로 비기능 품질 특성(예: 성능 효율성, 사용성)을 다룬다. 테스트 케이스는 스토리의 모든 특성을 다루되 스토리를 벗어나면 안 된다.\n① 1은 21번째 등록이라는 오류 조건을 확인한다 → 부정(B).\n② 2는 목록 화면이 표시되는 시간, 즉 성능 효율성을 확인한다. 즐겨찾기 20개는 사전 조건일 뿐 오류 조건이 아니다 → 비기능(C).\n③ 3의 수수료 면제는 스토리와 인수 조건 어디에도 없다 → 스토리 밖(D).\n④ 4는 20번째(허용 최댓값) 등록과 계좌번호 자동 입력이 예외 없이 정상 동작하는지 확인한다 → 긍정(A).\n검산: 1~4가 A~D에 하나씩 겹치지 않게 대응하는지 다시 확인했다.\n함정 포인트: 4는 경계값(20번째)을 쓰므로 부정 테스트처럼 보이지만, 20개까지는 허용되므로 오류 조건이 없는 긍정 테스트다.","why":["틀림. 2와 4가 바뀌었다. 2는 목록 표시 시간(성능 효율성)을 보는 비기능 테스트이고, 4는 오류 조건이 없는 긍정 테스트다(4.5.3).","틀림. 1과 4가 바뀌었다. 21번째 등록 시도는 오류 조건을 확인하는 부정 테스트이고, 20번째 등록은 허용 범위 안의 긍정 테스트다(4.5.3).","정답. 1은 부정, 2는 비기능(성능 효율성), 3은 스토리 밖, 4는 긍정 테스트다(4.5.3).","틀림. 3과 4가 바뀌었다. 수수료 면제는 스토리에 없어 포함하지 않아야 하고, 4는 스토리 범위 안의 긍정 테스트다(4.5.3)."],"ref":"4.5.3","hard":true},{"id":"h4k3-015","ch":4,"lo":"FL-4.5.3","k":3,"q":"팀은 인수 테스트 주도 개발(ATDD)로 다음 사용자 스토리의 테스트 케이스를 만들고 있다.\n\n사용자 스토리: '도서관 회원으로서 스터디룸을 앱으로 예약하고 싶다. 그래서 현장에 가지 않고도 자리를 확보할 수 있다.'\n인수 조건(acceptance criteria):\n- AC1: 예약은 1시간 단위로 1~3시간까지 할 수 있다.\n- AC2: 같은 날 이미 예약이 있는 회원은 추가로 예약할 수 없다.\n- AC3: 예약이 확정되면 예약 번호가 화면에 표시된다.\n\n명세 워크숍(specification workshop)에서 AC2의 '같은 날'은 예약 버튼을 누른 날이 아니라 스터디룸을 이용하는 날로 정했다. 팀이 이미 만든 테스트 케이스는 다음과 같다.\n- TC1: 예약이 없는 회원이 내일 2시간 이용을 예약하면 예약이 확정되고 예약 번호가 표시된다.\n- TC2: 내일 이용 예약이 있는 회원이 내일 1시간 이용을 더 예약하려 하면 예약되지 않는다.\n\n다음 중 이 스토리의 테스트 케이스로 추가하기에 적절한 것을 모두 고른 것은?\ni. 내일 이용 예약이 있는 회원이 모레 3시간 이용을 예약하면 예약이 확정되고 예약 번호가 표시된다.\nii. 오늘 앱에서 내일 이용 예약을 만든 회원이 이어서 오늘 1시간 이용을 예약하려 하면 예약되지 않는다.\niii. 예약이 없는 회원이 4시간 이용을 예약하려 하면 예약되지 않는다.\niv. 내일 이용 예약이 있는 회원이 내일 2시간 이용을 더 예약하려 하면 예약되지 않는다.\nv. 예약한 회원은 이용 시작 10분 전에 앱 알림을 받는다.","opts":["ii, iii","i, iii","iii, iv","i, iv, v"],"ans":[1],"exp":"풀이(4.5.3): ATDD의 테스트 케이스는 인수 조건을 기반으로 한다. 사용자 스토리의 모든 특성을 다루되 스토리를 벗어나면 안 되고, 두 개 이상의 테스트 케이스가 같은 특성을 설명해서는 안 된다. 테스트 설계에는 4.2의 테스트 기법도 적용할 수 있다. 워크숍에서 정한 대로 '같은 날'은 이용하는 날이다.\n① i 적절. 기존 예약은 내일 이용, 새 예약은 모레 이용이라 AC2에 걸리지 않고, 3시간은 AC1 범위 안이다. 기대 결과가 인수 조건과 맞고, '다른 날 이용이면 예약할 수 있다'는 TC1·TC2에 없는 특성이다.\n② ii 부적절. 기존 예약의 이용일은 내일, 새 예약의 이용일은 오늘이라 AC2에 걸리지 않는다. 기대 결과는 '예약 확정'이어야 한다.\n③ iii 적절. AC1의 최댓값 3시간 바로 바깥 값 4시간을 경계값 분석으로 고른 부정 테스트이고, 기존 테스트 케이스에 없는 특성이다.\n④ iv 부적절. 같은 이용일의 추가 예약이 거부된다는 특성은 TC2가 이미 설명한다. 이용 시간만 1시간에서 2시간으로 바뀌었는데, 둘 다 AC1의 유효 범위(1~3시간) 안이라 새 특성이 아니다.\n⑤ v 부적절. 이용 전 알림은 스토리와 인수 조건 어디에도 없어 스토리를 벗어난다.\n검산: 적절한 것은 i, iii이고, 이 둘만 담은 보기는 하나다.\n함정 포인트: ii는 '예약 버튼을 누른 날'로 읽으면 두 예약이 모두 오늘 만든 것이라 맞아 보이지만, 워크숍에서 '이용하는 날'로 정했으므로 기대 결과가 틀렸다.","why":["틀림. ii는 기대 결과가 틀렸다. 두 예약의 이용일(내일, 오늘)이 달라 AC2에 걸리지 않으므로 예약이 확정되어야 한다. i도 빠졌다(4.5.3).","정답. i(다른 날 이용 예약 확정)과 iii(경계값 분석으로 고른 4시간 부정 테스트)은 인수 조건과 맞고 기존 테스트 케이스와 특성이 겹치지 않는다(4.5.3).","틀림. iv는 같은 이용일 추가 예약 거부라는, TC2와 같은 특성을 다시 설명한다(2시간도 TC2의 1시간과 같은 AC1 유효 범위). i도 빠졌다(4.5.3).","틀림. iv는 TC2와 같은 특성을 다시 설명하고, v는 스토리를 벗어난다. iii도 빠졌다(4.5.3)."],"ref":"4.5.3","hard":true},{"id":"h5k3-001","ch":5,"lo":"FL-5.1.4","k":3,"q":"PG(결제 대행) 연동 모듈의 테스트 노력을 3점 추정(three-point estimation)으로 산정해 '최종 추정치 ± 표준 편차(standard deviation)' 범위로 이해관계자에게 보고했다. 처음 받은 전문가 추정치는 가장 낙관적인 추정치(a) 8맨아워(MH), 확률적으로 가장 높은 추정치(m) 14MH, 가장 비관적인 추정치(b) 26MH였다.\n그 뒤 'PG사 테스트 서버가 자주 중단된다'는 정보가 새로 확인돼, 전문가가 가장 비관적인 추정치만 38MH로 고쳤다(a와 m은 그대로).\n실라버스의 계산식으로 다시 계산했을 때, 보고 범위가 어떻게 바뀌는지 바르게 설명한 것은?","opts":["m이 그대로이므로 최종 추정치는 15MH로 같고, 표준 편차만 3MH에서 5MH로 커져 범위가 10~20MH가 된다.","최종 추정치는 15MH에서 17MH로 늘지만, 표준 편차는 3MH 그대로라 범위는 12~18MH에서 14~20MH로 바뀐다.","최종 추정치는 15MH에서 17MH로 늘고, 범위는 12~18MH에서 12~22MH로 바뀌어 하한은 그대로다.","최종 추정치는 세 값의 평균인 20MH가 되고, 표준 편차는 5MH가 되어 범위가 15~25MH로 바뀐다."],"ans":[2],"exp":"5.1.4의 3점 추정 계산식은 E=(a+4×m+b)/6, SD=(b−a)/6이다.\n① 수정 전: E=(8+4×14+26)/6=90/6=15, SD=(26−8)/6=18/6=3 → 15±3, 즉 12~18MH\n② 수정 후: E=(8+4×14+38)/6=102/6=17, SD=(38−8)/6=30/6=5 → 17±5, 즉 12~22MH\n③ 변화: E는 2MH 늘고(b 증가분 12MH의 1/6), SD는 2MH 늘어(b 증가분 12MH의 1/6) 하한 12MH는 같고 상한만 18MH에서 22MH로 올라간다.\n검산: 하한 E−SD를 식으로 정리하면 (a+4m+b)/6−(b−a)/6=(2a+4m)/6이라 b와 상관없다. (16+56)/6=12로 두 경우 모두 12MH다.\n함정 포인트: m이 그대로라서 E도 그대로라고 보기 쉽고, E를 17MH로 맞게 고쳐도 SD를 3MH로 두면 14~20MH를 고르게 된다. b는 E와 SD 계산식 모두에 들어간다.","why":["5.1.4의 E=(a+4×m+b)/6에는 b도 들어간다. b가 12MH 늘면 E는 12/6=2MH 늘어 17MH가 된다.","SD=(b−a)/6에는 b가 들어가므로 b가 38MH가 되면 SD는 (38−8)/6=5MH가 된다(5.1.4). 범위는 14~20MH가 아니라 17±5, 즉 12~22MH다.","정답. 5.1.4 계산식으로 수정 전은 15±3(12~18MH), 수정 후는 17±5(12~22MH)다.","세 값의 단순 평균((8+14+38)/3=20)을 쓴 것이다. 5.1.4의 3점 추정은 m에 4배 가중치를 주는 가중 산술 평균이다."],"ref":"5.1.4","hard":true},{"id":"h5k3-002","ch":5,"lo":"FL-5.1.4","k":3,"q":"모바일 뱅킹 앱 2차 개편 프로젝트의 테스트 노력을 비율 기반 추정(estimation based on ratios)으로 구하려 한다. 이번 프로젝트의 개발 노력은 900MD(person-day)로 예상된다. 테스트 리더가 모은 자료는 표와 같다. '뱅킹 앱 1차'와 '증권 앱'은 이번 프로젝트와 유형이 비슷한 자사 프로젝트이고, '회계 배치'는 가장 최근에 끝났지만 유형이 전혀 다른 자사 사내 시스템이며, '업계 보고서'는 외부 기관이 낸 금융 앱 평균값이다.\n실라버스가 설명하는 비율 기반 추정 방법에 맞는 자료만 골라 '표준' 비율(개발 노력 대비 테스트 노력)을 도출해 적용할 때, 이번 프로젝트의 테스트 노력 추정치는?","table":{"head":["자료","출처와 유형","개발 노력","테스트 노력"],"rows":[["뱅킹 앱 1차","자사, 모바일 뱅킹 앱 1차 구축(유사)","600MD","150MD"],["증권 앱","자사, 모바일 증권 앱 구축(유사)","600MD","210MD"],["회계 배치","자사, 사내 회계 배치 시스템(유형 다름, 가장 최근)","600MD","60MD"],["업계 보고서","외부 기관, 금융 앱 평균","-","개발 노력의 40%"]]},"opts":["270MD","210MD","360MD","90MD"],"ans":[0],"exp":"5.1.4: 비율 기반 추정은 조직에서 수행한 이전 프로젝트 수치를 수집해 유사 프로젝트를 위한 '표준' 비율을 도출하는 메트릭 기반 기법이다. 보통 조직에서 직접 수행한 프로젝트에서 수집한 비율이 가장 좋은 자료다.\n① 쓸 자료: 자사이면서 유형이 비슷한 뱅킹 앱 1차와 증권 앱. 업계 보고서는 조직 자체 자료가 아니고, 회계 배치는 자사 자료지만 유형이 달라 유사 프로젝트를 위한 비율이 아니다.\n② 프로젝트별 비율: 뱅킹 앱 1차 150/600=25%, 증권 앱 210/600=35%\n③ 표준 비율: 두 프로젝트의 개발 노력이 같아서 비율 평균과 합계 비율이 같다. (25%+35%)/2=30%, 합계로 계산해도 360/1,200=30%\n④ 추정: 900×0.3=270MD\n검산: 270/900=0.3이고, 합계 비율 360:1,200=3:10과 같다.\n함정 포인트: 실라버스는 조직이 직접 수행한 프로젝트의 비율이 가장 좋은 자료라고 하면서, '표준' 비율은 유사 프로젝트를 위한 것이라고 설명한다. 가장 최근인 회계 배치도 자사 자료지만 유형이 달라 빠지고, 그럴듯한 업계 평균은 조직 자체 자료가 아니다.","why":["정답. 유사한 자사 프로젝트 두 개의 비율(25%, 35%)로 표준 비율 30%를 도출하면 900×0.3=270MD다(5.1.4).","유형이 다른 회계 배치까지 넣어 계산(합계 420/1,800, 비율 평균 (25+35+10)/3 모두 약 23.3%)한 값이다. 5.1.4의 '표준' 비율은 유사 프로젝트를 위한 것이다.","외부 업계 평균(40%)을 쓴 값이다. 5.1.4는 조직에서 직접 수행한 프로젝트의 비율이 가장 좋은 자료라고 설명한다.","가장 최근이지만 유형이 다른 회계 배치(10%)만 쓴 값이다. 5.1.4의 '표준' 비율은 유사 프로젝트를 위한 것이다."],"ref":"5.1.4","hard":true},{"id":"h5k3-003","ch":5,"lo":"FL-5.1.4","k":3,"q":"애자일 팀이 7번째 반복 주기의 테스트 노력을 추정한다.\n① 기존 기능의 리그레션 테스팅 노력은 외삽법(extrapolation)으로 추정한다. 팀 규칙은 '직전 세 번의 반복 주기에 실제로 들인 노력의 평균'이며, 1~6번째 반복 주기의 실제 노력은 표와 같다.\n② 이번에 처음 다루는 외부 본인인증 연동 스토리는 과거 데이터가 없어 전문가에게 3점 추정(three-point estimation)을 받았다. 가장 낙관적인 추정치 4MH, 확률적으로 가장 높은 추정치 7MH, 가장 비관적인 추정치 22MH다.\n다음 진술 중 옳은 것만 모두 고른 것은?\ni. ①의 추정치는 45MD다.\nii. ①과 ②에 쓴 기법은 둘 다 메트릭 기반 기법이다.\niii. ②의 최종 추정치(E)는 11MH다.\niv. ②를 '최종 추정치 ± 표준 편차'로 나타내면 6~12MH 범위다.\nv. ②에서 전문가가 확률적으로 가장 높은 추정치(m)만 고쳐 다시 계산해도 표준 편차(SD)는 바뀌지 않는다.","table":{"head":["반복 주기","1","2","3","4","5","6"],"rows":[["리그레션 테스팅 실제 노력(MD)","34","41","38","45","42","48"]]},"opts":["i, iii, v","ii, iv, v","i, iv","i, iv, v"],"ans":[3],"exp":"① 외삽법(5.1.4, 메트릭 기반): 직전 세 번(4, 5, 6번째)의 평균 = (45+42+48)/3 = 135/3 = 45MD → i 옳음\n② 3점 추정(5.1.4, 전문가 기반): E=(4+4×7+22)/6=54/6=9MH, SD=(22−4)/6=18/6=3MH → 9±3, 즉 6~12MH → iii 틀림, iv 옳음\n③ SD=(b−a)/6에는 m이 없으므로 m만 바꾸면 SD는 그대로다 → v 옳음\n④ 외삽법은 메트릭 기반, 3점 추정은 전문가 기반이다 → ii 틀림\n정답: i, iv, v\n검산: i은 3×45=135가 45+42+48과 같고, ②는 6×9=54가 4+28+22와 같다.\n함정 포인트: iii의 11MH는 세 값의 단순 평균((4+7+22)/3)이라 그럴듯하지만, 3점 추정은 m에 4배 가중치를 준다.","why":["iii의 11MH는 단순 평균이다. 5.1.4 계산식으로는 E=9MH이고, 그러면 범위 6~12MH인 iv도 옳다.","5.1.4에서 3점 추정은 전문가 기반 기법이므로 ii는 틀리고, i은 직전 세 번의 평균 45MD로 옳다.","5.1.4의 SD=(b−a)/6에는 m이 들어가지 않으므로 v도 옳다.","정답. i(45MD), iv(9±3MH), v(SD 식에 m 없음)가 옳다(5.1.4)."],"ref":"5.1.4","hard":true},{"id":"h5k3-004","ch":5,"lo":"FL-5.1.5","k":3,"q":"주문 관리 시스템의 요구사항 R1~R11을 커버하는 테스트 케이스 다섯 개가 있다. 팀은 요구사항 커버리지를 기준으로 추가 커버리지 우선순위지정(additional coverage prioritization)을 적용한다. 다만 TC-D는 TC-A가 만든 주문 데이터를 써야 해서 TC-A 이후에만 실행할 수 있다.\n추가 커버리지가 가장 높은 테스트 케이스를 가능한 한 먼저 실행하되, 종속성이 있으면 선행 테스트 케이스를 먼저 실행한다. 실행 순서로 옳은 것은?","table":{"head":["테스트 케이스","커버하는 요구사항","종속성"],"rows":[["TC-A","R5, R8, R10","없음"],["TC-B","R1, R2, R3, R4, R5, R6","없음"],["TC-C","R1, R11","없음"],["TC-D","R6, R7, R8, R9","TC-A 이후 실행"],["TC-E","R1, R2, R3, R4, R7","없음"]]},"opts":["TC-B → TC-E → TC-A → TC-D → TC-C","TC-B → TC-A → TC-D → TC-C → TC-E","TC-B → TC-D → TC-A → TC-C → TC-E","TC-B → TC-A → TC-D → TC-E → TC-C"],"ans":[1],"exp":"5.1.5: 추가 커버리지 우선순위지정은 커버리지가 가장 높은 테스트 케이스를 먼저 실행하고, 그 뒤로는 추가 커버리지가 가장 높은 것을 실행한다. 우선순위가 높은 테스트 케이스가 낮은 테스트 케이스에 종속되면 낮은 쪽을 먼저 실행한다.\n① 1번째: 커버리지가 가장 높은 TC-B(6개). 커버됨: R1~R6\n② 남은 추가 커버리지: TC-D 3개(R7, R8, R9), TC-A 2개(R8, R10), TC-C 1개(R11), TC-E 1개(R7). 가장 높은 TC-D는 TC-A에 종속되므로 TC-A를 2번째로 실행한다. 커버됨: R1~R6, R8, R10\n③ 3번째: TC-D의 추가 커버리지는 이제 2개(R7, R9)로 여전히 가장 높다(TC-C 1개, TC-E 1개). 커버됨: R1~R10\n④ 4번째: TC-C는 R11을 추가하고(1개) TC-E는 0개다. TC-C 다음 TC-E가 마지막이다.\n결과: TC-B → TC-A → TC-D → TC-C → TC-E\n검산: '지금 실행할 수 있는 것 중 추가 커버리지가 가장 높은 것'으로 풀어도 2번째 후보는 TC-A(2), TC-C(1), TC-E(1)라 TC-A이고, 이후 순서도 같다.\n함정 포인트: 4번째에서 전체 커버리지가 큰 TC-E(5개)를 고르기 쉽지만, 그 시점의 추가 커버리지는 0개다.","why":["전체 커버리지 순서(6, 5, 4, 3, 2개)에 종속성만 반영한 것이다. 5.1.5의 추가 커버리지 변형에서 TC-E는 2번째 시점에 R7 하나만 추가한다.","정답. TC-D의 선행인 TC-A를 먼저 실행하고, 마지막에는 R11을 추가하는 TC-C가 추가 0개인 TC-E보다 앞선다(5.1.5).","TC-D를 TC-A보다 먼저 실행해 종속성을 어겼다. 5.1.5에 따라 선행 테스트 케이스인 TC-A를 먼저 실행해야 한다.","3번째까지는 맞다. 하지만 4번째 시점에 TC-E의 추가 커버리지는 0개, TC-C는 1개다(5.1.5)."],"ref":"5.1.5","hard":true},{"id":"h5k3-005","ch":5,"lo":"FL-5.1.5","k":3,"q":"결제 서비스 컴포넌트의 테스트 케이스 T1~T4에 대한 정보가 표와 같다. 리스크 수준은 정량적 접근법(리스크 발생 가능성 × 리스크 영향)으로 계산하고, 요구사항 우선순위는 이해관계자가 정했다(1이 가장 높음). 이 컴포넌트의 구문은 S1~S10이며, 테스트 케이스 사이에 종속성은 없다.\n우선순위지정 전략 1~4와 그 전략을 적용한 실행 순서를 A~E에서 골라 바르게 연결한 것은? (A~E 중 한 순서는 어느 전략에도 해당하지 않는다)\n1. 리스크 기반 우선순위지정(risk-based prioritization)\n2. 커버리지 기반 우선순위지정(coverage-based prioritization), 구문 커버리지(statement coverage) 기준\n3. 추가 커버리지 우선순위지정(additional coverage prioritization), 구문 커버리지 기준\n4. 요구사항 기반 우선순위지정(requirements-based prioritization)\nA. T3 → T4 → T2 → T1\nB. T2 → T4 → T3 → T1\nC. T4 → T1 → T3 → T2\nD. T3 → T1 → T4 → T2\nE. T3 → T4 → T1 → T2","table":{"head":["테스트 케이스","리스크 발생 가능성","리스크 영향(점수)","요구사항 우선순위","실행하는 구문"],"rows":[["T1","0.6","4","4","S1, S2, S3, S4, S7"],["T2","0.7","2","1","S9, S10"],["T3","0.2","9","3","S1, S2, S3, S4, S5, S6"],["T4","0.5","6","2","S7, S8, S9"]]},"opts":["1E, 2D, 3A, 4B","1C, 2D, 3E, 4B","1C, 2D, 3A, 4B","1E, 2A, 3D, 4B"],"ans":[2],"exp":"5.1.5의 세 가지 전략과 추가 커버리지 변형을 하나씩 적용한다.\n① 리스크 기반: 리스크 수준(5.2.3 정량적 접근법) T1=0.6×4=2.4, T2=0.7×2=1.4, T3=0.2×9=1.8, T4=0.5×6=3.0 → T4, T1, T3, T2 = C\n② 커버리지 기반: 구문 수 T3 6개, T1 5개, T4 3개, T2 2개 → T3, T1, T4, T2 = D\n③ 추가 커버리지: 첫 번째는 커버리지가 가장 높은 T3(S1~S6). 그다음 추가분은 T4 3개(S7, S8, S9), T2 2개(S9, S10), T1 1개(S7) → T4. 이제 S1~S9가 커버됐고 추가분은 T2 1개(S10), T1 0개 → T2, T1. 결과 T3, T4, T2, T1 = A\n④ 요구사항 기반: 요구사항 우선순위 1, 2, 3, 4 순 → T2, T4, T3, T1 = B\nE(T3, T4, T1, T2)는 어느 전략에도 해당하지 않는다.\n정답: 1C, 2D, 3A, 4B\n검산: 리스크 수준을 다시 곱해도 3.0 > 2.4 > 1.8 > 1.4이고, A 순서로 실행하면 세 번째(T2)에서 S1~S10이 모두 커버된다.\n함정 포인트: E는 리스크 영향 점수만으로 정렬한 순서(9, 6, 4, 2)이면서, 추가 커버리지에서 세 번째부터 전체 구문 수(T1 5개 > T2 2개)로 고른 순서와도 같아 1번과 3번 자리 모두에서 끌린다.","why":["E는 리스크 영향 점수만으로 정렬한 순서(T3 9, T4 6, T1 4, T2 2)다. 5.2.3 정량적 접근법의 리스크 수준(발생 가능성×영향)은 T4 3.0, T1 2.4, T3 1.8, T2 1.4라 리스크 기반은 C다.","E는 세 번째부터 전체 구문 수(T1 5개 > T2 2개)로 고른 순서다. 5.1.5의 추가 커버리지로는 T3, T4 뒤에 S10을 새로 커버하는 T2(추가 1개)가 추가 0개인 T1보다 먼저라 A다.","정답. 리스크 수준, 구문 수, 추가 구문 수, 요구사항 우선순위로 각각 정렬한 결과다(5.1.5, 5.2.3).","리스크 영향 점수만 본 데다 커버리지 기반과 추가 커버리지를 바꿨다. 5.1.5의 커버리지 기반은 구문 수 순서(6, 5, 3, 2개)인 D다."],"ref":"5.1.5","hard":true},{"id":"h5k3-006","ch":5,"lo":"FL-5.1.5","k":3,"q":"다음 일곱 개 테스트 케이스로 오늘의 테스트 실행 일정을 짠다. 우선순위는 1이 가장 높다. 테스트 케이스는 각각 1시간이 걸리고, 09:00부터 한 번에 하나씩 쉬지 않고 실행한다(1번째 09:00, 2번째 10:00, … 7번째 15:00 시작). TC-6은 외부 결제 샌드박스가 필요한데, 이 샌드박스는 13:00부터 쓸 수 있다.\n우선순위가 높은 테스트 케이스를 가능한 한 먼저 실행하되, 종속성이 있으면 선행 테스트 케이스를 먼저 실행하고 자원 가용성도 지켜야 한다. 네 번째와 여섯 번째로 실행하는 테스트 케이스를 바르게 짝지은 것은?","table":{"head":["테스트 케이스","우선순위","종속성","필요 자원"],"rows":[["TC-1","3","없음","없음"],["TC-2","1","TC-5 이후 실행","없음"],["TC-3","2","TC-6 이후 실행","없음"],["TC-4","4","없음","없음"],["TC-5","6","TC-7 이후 실행","없음"],["TC-6","5","없음","결제 샌드박스(13:00부터 사용 가능)"],["TC-7","7","없음","없음"]]},"opts":["4번째 TC-1, 6번째 TC-3","4번째 TC-6, 6번째 TC-1","4번째 TC-1, 6번째 TC-6","4번째 TC-5, 6번째 TC-6"],"ans":[0],"exp":"5.1.5: 우선순위가 높은 테스트 케이스가 낮은 테스트 케이스에 종속되면 낮은 쪽을 먼저 실행해야 하고, 실행 순서는 자원 가용성도 고려해야 한다.\n① 우선순위 1인 TC-2는 TC-5에, TC-5는 TC-7에 종속된다 → 09:00 TC-7, 10:00 TC-5, 11:00 TC-2\n② 다음은 우선순위 2인 TC-3인데, 선행인 TC-6은 13:00부터 실행할 수 있다. 12:00에는 TC-6도 TC-3도 실행할 수 없으므로, 실행 가능한 것 중 우선순위가 가장 높은 TC-1(3)을 실행한다.\n③ 13:00 TC-6, 14:00 TC-3. TC-6을 먼저 해야 우선순위 2인 TC-3을 가장 빨리 실행할 수 있다.\n④ 15:00 TC-4\n결과: TC-7 → TC-5 → TC-2 → TC-1 → TC-6 → TC-3 → TC-4. 네 번째는 TC-1, 여섯 번째는 TC-3\n검산: 13:00에 TC-4를 넣으면 TC-3이 15:00으로 밀려 우선순위 2를 가능한 한 먼저 실행한다는 규칙에 어긋난다. 종속성(TC-7→TC-5→TC-2, TC-6→TC-3)과 TC-6의 13:00 조건도 모두 지켜진다.\n함정 포인트: 샌드박스 조건을 놓치면 TC-6, TC-3을 4~5번째에 넣게 되고, 우선순위 숫자만 보면 13:00에 TC-4(4)가 TC-6(5)보다 앞서 보인다.","why":["정답. TC-7 → TC-5 → TC-2 → TC-1 → TC-6 → TC-3 → TC-4 순이다(5.1.5).","자원 가용성을 무시한 순서다. 5.1.5에 따라 TC-6은 샌드박스를 쓸 수 있는 13:00(5번째)부터 실행할 수 있다.","13:00에 TC-4를 실행한 순서다. 우선순위 2인 TC-3이 TC-6에 종속되므로 5.1.5에 따라 TC-6을 먼저 실행해야 한다.","지금 실행할 수 있는 것 중 우선순위만 보고 TC-1, TC-4부터 실행한 순서다. 5.1.5에 따라 우선순위 1인 TC-2를 위해 선행인 TC-7, TC-5를 먼저 실행해야 한다."],"ref":"5.1.5","hard":true},{"id":"h5k3-007","ch":5,"lo":"FL-5.5.1","k":3,"q":"호텔 예약 앱의 결함 분석·분류 회의가 끝난 뒤, 결함 관리 도구에 기록된 결함 보고서(defect report)의 내용이 표와 같다.\n실라버스가 설명하는 결함 보고서 항목에 비추어, 항목에 맞지 않는 내용이 들어간 것만 모두 고른 것은?","table":{"head":["번호","항목","기록된 내용"],"rows":[["-","고유 식별자","DEF-2291"],["i","제목","체크인과 체크아웃을 같은 날짜로 골라도 예약이 완료됨"],["ii","결함의 정황(context)","안드로이드 15, 예약 앱 v4.1.0(빌드 410), 스테이징 서버"],["iii","기대 결과와 실제 결과","기대: '체크아웃은 체크인 다음 날 이후여야 합니다' 안내 / 실제: 예약 완료 화면 표시"],["iv","심각도(severity)","분류 회의 결정에 따라 다음 릴리스에서 수정"],["v","결함 상태(status)","연기"],["-","참조 사항","TC-BK-14, REQ-BK-02"]]},"opts":["iv, v","ii, iv, v","ii","ii, iv"],"ans":[3],"exp":"5.5의 결함 보고서 내용과 항목별로 대조한다.\n① i 제목: 보고하는 이상 사항을 요약하고 있다 → 맞음\n② ii 결함의 정황: 정황은 실행 중인 테스트 케이스, 수행 중인 테스트 활동, SDLC 단계, 사용 중인 테스트 기법·체크리스트·테스트 데이터 같은 정보다. OS, 앱 버전, 서버는 '테스트 대상 및 테스트 환경 식별 정보'에 들어갈 내용이다 → 맞지 않음\n③ iii 기대 결과와 실제 결과: 둘 다 적혀 있다 → 맞음\n④ iv 심각도: 결함이 이해관계자의 이익이나 요구사항에 끼치는 영향의 정도다. '다음 릴리스에서 수정'은 언제 고칠지에 대한 결정이라 '수정 우선순위' 쪽 내용이다 → 맞지 않음\n⑤ v 결함 상태: '연기'는 실라버스가 예로 든 결함 상태(신규, 연기, 중복, 수정 대기, 확인 테스트 대기, 재-오픈, 완료, 거부) 중 하나다 → 맞음\n정답: ii, iv\n함정 포인트: '정황'이라는 말 때문에 실행 환경도 정황으로 여기기 쉽지만 5.5는 테스트 환경 식별 정보를 별도 항목으로 둔다. iv도 결함이 급하지 않다는 뜻으로 읽혀 심각도처럼 보이지만, 언제 고칠지에 대한 결정이다.","why":["'연기'는 5.5가 예로 든 결함 상태라 v는 맞게 들어갔다. 또 OS·앱 버전·서버는 '테스트 대상 및 테스트 환경 식별 정보'에 들어갈 내용이라 정황 칸의 ii도 골라야 한다.","'연기'는 5.5가 예로 든 결함 상태(신규, 연기, 중복, 수정 대기 등) 중 하나라 v는 맞게 들어갔다.","ii는 맞게 골랐지만 iv가 빠졌다. 심각도는 결함이 이해관계자의 이익이나 요구사항에 끼치는 영향의 정도이고, '다음 릴리스에서 수정'은 수정 우선순위 쪽 내용이다(5.5).","정답. ii는 테스트 대상 및 테스트 환경 식별 정보, iv는 수정 우선순위에 해당하는 내용이다(5.5)."],"ref":"5.5","hard":true},{"id":"h5k3-008","ch":5,"lo":"FL-5.5.1","k":3,"q":"회원 가입 기능의 요구사항 REQ-SU-03은 '생년월일 기준 만 14세 미만이면 가입을 완료하기 전에 보호자 동의 화면으로 이동해야 한다'이다. 테스터는 2026-10-12에 TC-SU-21을 실행하면서 생년월일 2013-05-01(만 13세)을 입력했는데, 보호자 동의 화면 없이 곧바로 가입 완료 화면이 나타났다.\n테스터가 쓴 결함 보고서(defect report) 초안 네 개에서 서로 다른 항목만 표에 정리했다. 식별자, 제목, 재현 절차(가입 화면에서 생년월일 2013-05-01 입력 후 가입 버튼 누름, 화면 녹화 첨부) 등 나머지 항목은 네 초안이 같다.\n결함을 처리·해결할 담당자에게 충분한 정보를 제공한다는 결함 보고서의 목적에 가장 잘 맞는 초안은?","table":{"head":["초안","테스트 대상 및 테스트 환경","기대 결과","실제 결과"],"rows":[["초안 1","회원 앱 최신 빌드, 테스트용 아이폰","가입 완료 후 보호자에게 동의 요청 문자가 발송됨","동의 화면 없이 곧바로 '가입 완료' 화면이 나타남"],["초안 2","회원 앱 v5.2.0(빌드 520), iOS 18, 스테이징 서버","가입이 완료되기 전에 보호자 동의 화면이 표시됨","가입 버튼을 누르자 보호자 동의 화면 없이 가입 완료 화면이 표시됨"],["초안 3","회원 앱 이번 주 빌드, 사내 테스트 단말기","가입 버튼을 누르면 보호자 동의 화면으로 넘어감","만 나이 계산 로직 오류로 추정됨"],["초안 4","iOS 18 단말, 회원 앱 5.2.0 build 520, 스테이징 환경","만 14세 미만이므로 가입 불가 안내가 표시됨","보호자 동의 분기 조건이 잘못 구현된 것으로 보임"]]},"opts":["초안 1","초안 2","초안 3","초안 4"],"ans":[1],"exp":"5.5: 결함 보고서의 목적 중 하나는 결함을 처리·해결할 책임자에게 충분한 정보를 주는 것이다. 동적 테스팅 중 쓰는 보고서에는 테스트 대상 및 테스트 환경 식별 정보, 장애 재현에 필요한 정보, 기대 결과와 실제 결과 등이 들어간다. 세 칸을 하나씩 판정한다.\n① 테스트 대상 및 테스트 환경: 초안 2와 초안 4는 버전·빌드·OS·서버를 특정한다. 초안 1('최신 빌드', '테스트용 아이폰')과 초안 3('이번 주 빌드', '사내 테스트 단말기')으로는 어느 빌드·OS인지 식별할 수 없다.\n② 기대 결과: REQ-SU-03에 따르면 만 14세 미만은 가입 완료 전에 보호자 동의 화면으로 이동해야 한다. 초안 2와 초안 3은 이와 같고, 초안 1(가입 완료 후 문자 발송)과 초안 4(가입 불가 안내)는 요구사항과 다르다.\n③ 실제 결과: 초안 1과 초안 2는 관찰한 동작을 적었고, 초안 3과 초안 4는 관찰한 동작 대신 원인 추정을 적었다.\n세 칸이 모두 맞는 것은 초안 2뿐이다.\n함정 포인트: 초안 4는 환경 정보가 자세하고 기술적인 원인까지 적어 성의 있어 보이지만, 기대 결과가 요구사항과 다르고 실제로 무엇이 일어났는지가 빠져 있다.","why":["'최신 빌드', '테스트용 아이폰'으로는 빌드·OS를 특정할 수 없고, 기대 결과도 REQ-SU-03(가입 완료 전 보호자 동의 화면 이동)과 다르다(5.5).","정답. 5.5의 테스트 대상 및 테스트 환경 식별 정보가 구체적이고, 기대 결과는 REQ-SU-03과 같으며, 실제 결과는 관찰한 동작이다.","'이번 주 빌드', '사내 테스트 단말기'로는 테스트 대상과 환경을 식별할 수 없고, 실제 결과 칸에 관찰한 동작 대신 원인 추정을 적었다(5.5).","환경 정보는 구체적이지만 기대 결과가 REQ-SU-03과 다르고(가입 불가 안내가 아니라 보호자 동의 화면), 실제 결과 칸에 관찰한 동작 대신 원인 추정을 적었다(5.5)."],"ref":"5.5","hard":true},{"id":"h5k3-009","ch":5,"lo":"FL-5.5.1","k":3,"q":"택배 배송비 계산 기능의 명세는 다음과 같다. 무게 w(kg)가 0 < w ≤ 2이면 3,000원, 2 < w ≤ 5이면 4,500원, 5 < w ≤ 20이면 7,000원이고, w > 20이면 '배송 불가' 메시지를 표시한다.\n빌드 3.4.2를 스테이징 서버에서 테스트한 실행 로그(입력과 실제 출력)는 표와 같다. 테스터는 이 로그에 나타난 장애(failure)를 하나의 결함 보고서(defect report)로 작성하려 한다.\n이 결함 보고서 작성에 관한 다음 내용 중 적절한 것은? (두 개를 고르시오)","table":{"head":["테스트 케이스","입력 무게(kg)","실제 출력"],"rows":[["TC-01","1.0","3,000원"],["TC-02","2.0","4,500원"],["TC-03","2.1","4,500원"],["TC-04","5.0","7,000원"],["TC-05","5.1","7,000원"],["TC-06","20.0","'배송 불가' 메시지"]]},"opts":["제목: 무게가 2.0kg 또는 5.0kg일 때만 기대 결과와 다른 출력이 나옴","제목: 무게가 구간 상한값(2.0, 5.0, 20.0kg)이면 다음 구간으로 처리됨","결함 상태: 장애가 난 테스트 케이스를 다시 실행해야 하므로 '확인 테스트 대기'","TC-04의 기대 결과와 실제 결과: 기대 결과 4,500원, 실제 결과 7,000원","TC-06은 기대 결과도 '배송 불가'라 장애가 아니므로 보고서에서 뺀다"],"ans":[1,3],"exp":"로그를 명세와 대조해 입력마다 기대 결과를 먼저 구한다.\n① TC-01 1.0kg: 0 < w ≤ 2 → 기대 3,000원, 실제 3,000원(같음)\n② TC-02 2.0kg: 0 < w ≤ 2 → 기대 3,000원, 실제 4,500원(다음 구간 요금)\n③ TC-03 2.1kg: 2 < w ≤ 5 → 기대 4,500원, 실제 4,500원(같음)\n④ TC-04 5.0kg: 2 < w ≤ 5 → 기대 4,500원, 실제 7,000원(다음 구간 요금)\n⑤ TC-05 5.1kg: 5 < w ≤ 20 → 기대 7,000원, 실제 7,000원(같음)\n⑥ TC-06 20.0kg: 5 < w ≤ 20 → 기대 7,000원, 실제 '배송 불가'(다음 구간 처리)\n기대 결과와 다른 것은 TC-02, TC-04, TC-06이고, 세 입력 모두 구간 상한값이다. 5.5에 따라 제목은 보고하는 이상 사항을 요약해야 하고, 기대 결과와 실제 결과는 정확해야 한다.\n검산: 상한값보다 조금 큰 2.1kg, 5.1kg은 명세대로 나왔으므로 장애는 상한값과 정확히 같을 때 나타난다.\n함정 포인트: 20.0kg을 w > 20 구간으로 착각하면 '배송 불가'가 정상으로 보여 '2.0kg 또는 5.0kg일 때만'이라는 제목과 TC-06 제외에 함께 끌린다. 20.0kg은 5 < w ≤ 20 구간이다.","why":["20.0kg은 5 < w ≤ 20 구간이라 기대 결과는 7,000원인데 실제 출력은 '배송 불가'다. 20.0kg에서도 기대 결과와 다르므로 '2.0kg 또는 5.0kg일 때만'은 로그와 맞지 않는다(5.5 제목은 이상 사항을 요약).","정답. 기대 결과와 다른 세 입력(2.0, 5.0, 20.0kg)이 모두 구간 상한값이고 모두 다음 구간으로 처리됐다. 상한값이 아닌 1.0, 2.1, 5.1kg은 명세대로 나왔다(5.5 이상 사항을 요약하는 제목).","다시 실행할 예정이라는 이유만으로 '확인 테스트 대기'가 되지 않는다. 확인 테스팅은 원래 결함이 성공적으로 수정됐는지 확인하는 것이고(2.2.3), 이제 막 보고하는 결함은 아직 수정되지 않았다(5.5 결함 상태).","정답. 5.0kg은 2 < w ≤ 5 구간이라 기대 결과는 4,500원이고, 로그의 실제 출력은 7,000원이다(5.5 기대 결과와 실제 결과).","20.0kg은 w > 20이 아니라 5 < w ≤ 20 구간이라 기대 결과는 7,000원이다. 실제 출력 '배송 불가'와 다르므로 TC-06도 장애이고 보고서에 포함해야 한다(5.5)."],"ref":"5.5","hard":true}],"notes":[{"ch":1,"title":"테스팅의 기초","titleEn":"Fundamentals of Testing","minutes":180,"examCount":8,"keywords":[{"ko":"커버리지","en":"coverage","def":"테스트가 확인해야 할 항목(커버리지 항목)을 얼마나 실행했는지 나타내는 정도. 4장 기법에서는 '실행한 커버리지 항목 수 ÷ 식별한 전체 커버리지 항목 수'를 백분율로 표시한다. 1장에서는 '테스트 대상에 대해 요구된 커버리지 보장'이 테스트 목적 중 하나다."},{"ko":"디버깅","en":"debugging","def":"동적 테스팅이 장애를 유발했을 때 장애의 원인(결함)을 찾고, 분석하고, 제거하는 활동. 이때 일반적인 디버깅 프로세스는 장애 재현 → 분석(결함 찾기) → 결함 수정이다. 정적 테스팅으로 결함을 찾은 경우 디버깅은 장애를 재현·분석할 필요 없이 결함 제거에 중점을 둔다. 테스팅과는 별개의 활동이다."},{"ko":"결함","en":"defect","def":"작업 산출물에 있는 잘못. 결점, 버그라고도 한다. 사람의 오류(실수)로 생기는 것이 대표적이다. 요구사항 명세서·테스트 스크립트 같은 문서, 소스 코드, 빌드 파일 같은 지원 산출물에 있을 수 있다."},{"ko":"오류","en":"error","def":"사람이 저지르는 실수. 시간적인 압박, 작업 산출물의 복잡성, 피로, 훈련 부족 같은 이유로 생기며, 결함을 만들어 낸다."},{"ko":"장애","en":"failure","def":"결함이 있는 코드가 실행되어 시스템이 해야 할 일을 못 하거나 하지 말아야 할 일을 하는 것. 방사선·전자기장 같은 환경 조건 때문에 생기기도 한다."},{"ko":"품질","en":"quality","def":"1장에는 따로 정의 문장이 없다. 1장에서 테스팅은 소프트웨어 품질을 평가하고, 적합한 수준의 품질 달성을 지원하는 활동으로 설명된다."},{"ko":"품질 보증","en":"quality assurance","def":"프로세스의 구현과 개선에 초점을 둔 프로세스 중심의 예방 접근법. '좋은 프로세스를 올바르게 따르면 좋은 제품이 나온다'는 가정에 기반하며, 프로젝트 참여자 모두의 책임이다."},{"ko":"근본 원인","en":"root cause","def":"문제가 생긴 근본적인 이유(예: 오류로 이어지는 상황). 근본 원인 분석으로 찾고, 이를 처리하면 비슷한 장애와 결함을 예방하거나 빈도를 줄일 수 있다."},{"ko":"테스트 분석","en":"test analysis","def":"테스트 베이시스를 분석해 테스트 가능한 기능을 찾고, 리스크를 고려해 테스트 컨디션을 정의하고 우선순위를 매기는 활동. '무엇을 테스트할 것인가?'에 답한다."},{"ko":"테스트 베이시스","en":"test basis","def":"테스트 분석에서 분석하는 근거 자료. 이를 바탕으로 테스트 가능한 기능과 테스트 컨디션을 정한다. 요구사항이 그 예이며(1.4.4, 2.1.6), 테스트 베이시스 자체에도 결함이 있을 수 있다."},{"ko":"테스트 케이스","en":"test case","def":"테스트 설계에서 테스트 컨디션을 구체화해 만드는 테스트웨어. 커버리지 항목이 테스트 케이스 입력값을 정하는 길잡이가 되며, 여러 테스트 케이스를 테스트 절차로 묶을 수 있다."},{"ko":"테스트 완료","en":"test completion","def":"보통 프로젝트 마일스톤(릴리스, 반복 주기 완료, 테스트 레벨 완료 등)에서 하는 마무리 활동. 미해결 결함에 대한 변경 요청서나 제품 백로그 항목 작성, 향후 유용할 수 있는 테스트웨어 보관·인계, 테스트 환경을 합의된 상태로 종료, 교훈 파악, 테스트 완료 보고서 작성·전달을 한다."},{"ko":"테스트 컨디션","en":"test condition","def":"테스트 분석에서 테스트 베이시스를 분석해 정의하는 '무엇을 테스트할지'에 대한 항목. 관련 리스크 수준을 고려해 우선순위를 매긴다. 예: 인수 기준(4.5.2에서는 '인수 조건'으로 표기)."},{"ko":"테스트 제어","en":"test control","def":"테스트 목적을 달성하는 데 필요한 조치를 하는 활동. 진행 상황을 점검하는 테스트 모니터링과 짝을 이룬다."},{"ko":"테스트 데이터","en":"test data","def":"테스트 실행에 필요한 데이터. 테스트 설계에서 테스트 데이터 요구사항을 정의하고, 테스트 구현에서 실제 테스트 데이터를 만들거나 획득한다."},{"ko":"테스트 설계","en":"test design","def":"테스트 컨디션을 테스트 케이스와 기타 테스트웨어(예: 테스트 차터)로 구체화하는 활동. 커버리지 항목 식별, 테스트 데이터 요구사항 정의, 테스트 환경 설계도 포함한다. '어떻게 테스트할 것인가?'에 답한다."},{"ko":"테스트 실행","en":"test execution","def":"테스트 실행 일정에 따라 테스트를 수행하는 활동(테스트 런). 수동이나 자동으로 하며, 실제 결과를 기대 결과와 비교하고 결과를 기록하며, 이상 사항을 분석해 가능한 원인을 파악하고 관찰한 장애를 기반으로 이상 사항을 보고할 수 있다."},{"ko":"테스트 구현","en":"test implementation","def":"테스트 실행에 필요한 테스트웨어(예: 테스트 데이터)를 만들거나 획득하는 활동. 테스트 절차·테스트 스위트·테스트 스크립트·테스트 실행 일정을 만들고, 테스트 환경을 구축해 설정을 확인한다."},{"ko":"테스트 모니터링","en":"test monitoring","def":"모든 테스트 활동을 계속 점검하고, 실제 진행 상황을 계획과 비교하는 활동."},{"ko":"테스트 대상","en":"test object","def":"테스트되는 작업 산출물. 컴포넌트, 시스템, 관련 산출물(예: 문서)이 테스트 대상이 될 수 있다."},{"ko":"테스트 목적","en":"test objective","def":"테스팅으로 이루려는 목적. 예: 작업 산출물 평가, 장애 유발 및 결함 식별, 리스크 수준 완화, 이해관계자에게 결정에 필요한 정보 제공. 정황에 따라 달라진다."},{"ko":"테스트 계획","en":"test planning","def":"테스트 목적을 정의하고, 전반적인 상황에 따른 제약 조건 안에서 그 목적을 가장 잘 달성할 접근법을 선택하는 활동."},{"ko":"테스트 절차","en":"test procedure","def":"테스트 케이스를 묶어 만든 것. 테스트 구현에서 만들며, 여러 테스트 절차를 테스트 스위트로 조합하는 경우가 많다. 우선순위를 반영해 테스트 실행 일정에 배치한다."},{"ko":"테스트 프로세스","en":"test process","def":"테스트 목적 달성에 필요한 테스트 활동들의 묶음(계획, 모니터링과 제어, 분석, 설계, 구현, 실행, 완료). 상황에 맞게 조정할 수 있고, 어떤 활동을 언제 어떻게 할지는 보통 테스트 계획 때 정한다. 영문 키워드에는 있지만 한글판 1장 용어 목록에는 빠져 있다."},{"ko":"테스트 결과","en":"test result","def":"테스트를 실행해 얻은 결과. 실제 결과를 기대 결과와 비교해 기록한다. 테스팅에서는 결함 수정에, 품질 보증에서는 개발·테스트 프로세스가 잘 동작하는지에 대한 피드백으로 쓰인다."},{"ko":"테스팅","en":"testing","def":"결함을 식별하고 소프트웨어 산출물의 품질을 평가하는 일련의 활동. 소프트웨어를 실행하는 동적 테스팅과 실행하지 않는 정적 테스팅(리뷰, 정적 분석)이 있다."},{"ko":"테스트웨어","en":"testware","def":"테스트 활동의 결과물로 만들어지는 작업 산출물. 예: 테스트 계획, 테스트 케이스, 테스트 스크립트, 테스트 로그, 테스트 완료 보고서."},{"ko":"추적성","en":"traceability","def":"테스트 베이시스 요소, 관련 테스트웨어(테스트 컨디션, 리스크, 테스트 케이스), 테스트 결과, 결함을 서로 연결해 두는 것. 커버리지 평가, 변경 영향 파악, 감사 등에 도움이 된다."},{"ko":"밸리데이션","en":"validation","def":"시스템이 운영 환경에서 사용자와 기타 이해관계자가 필요한 바를 만족하는지 확인하는 것."},{"ko":"베리피케이션","en":"verification","def":"시스템이 주어진(명시된) 요구사항을 충족하는지 확인하는 것."}],"sections":[{"id":"1.1","title":"테스팅이란 무엇인가?","points":["소프트웨어 테스팅은 결함을 식별하고 소프트웨어 산출물의 품질을 평가하는 일련의 활동이다. 테스트되는 산출물을 테스트 대상(test object)이라고 한다.","올바르게 동작하지 않는 소프트웨어는 금전·시간·비즈니스 평판 손실, 심하면 부상이나 사망까지 일으킬 수 있다. 테스팅은 소프트웨어 품질을 평가하고, 소프트웨어 사용 시 나타날 수 있는 장애의 위험을 줄여줄 수 있다.","테스팅은 테스트 실행만이 아니다. 여러 활동을 포함하며, 그 활동은 소프트웨어 개발수명주기(SDLC)에 따라 달라진다.","테스팅은 베리피케이션(verification, 주어진 요구사항 충족 확인)뿐 아니라 밸리데이션(validation, 운영 환경에서 사용자·이해관계자의 필요 충족 확인)도 포함한다.","동적 테스팅은 소프트웨어를 실행하고, 정적 테스팅은 실행하지 않는다. 정적 테스팅에는 리뷰와 정적 분석이 있고, 동적 테스팅은 테스트 기법과 테스트 접근법으로 테스트 케이스를 도출한다.","테스팅은 기술적인 활동에 그치지 않으며, 계획·관리·추정·모니터링·제어가 필요하다.","테스터는 도구를 쓰지만, 테스팅은 주로 전문 지식, 분석 기술, 비판적 사고, 시스템적 사고가 필요한 지적인 활동이다."],"traps":["'테스팅 = 테스트 실행'은 흔한 오해다. 실행 외의 여러 활동도 테스팅에 포함된다.","'테스팅 = 베리피케이션'도 오해다. 밸리데이션도 포함한다.","정적 테스팅도 테스팅이다. 소프트웨어를 실행하지 않을 뿐이다."]},{"id":"1.1.1","title":"테스트 목적","points":["일반적인 테스트 목적 9가지: ① 요구사항, 사용자 스토리, 설계, 소스 코드 등 작업 산출물 평가 ② 장애 유발 및 결함 식별 ③ 테스트 대상에 대해 요구된 커버리지 보장 ④ 소프트웨어 품질 부족으로 인한 리스크 수준의 완화 ⑤ 정의된 요구사항의 충족 여부를 확인하는 베리피케이션 ⑥ 테스트 대상의 계약, 법률, 규제 요구사항 준수 여부를 확인하는 베리피케이션 ⑦ 이해관계자가 정보에 입각한 결정을 내리는 데 필요한 정보 제공 ⑧ 테스트 대상의 품질에 대한 자신감 획득 ⑨ 테스트 대상의 완성 여부와 이해관계자의 기대 충족 여부를 확인하는 밸리데이션","테스트 목적은 정황(context)에 따라 달라진다. 정황에는 테스트 대상 작업 산출물, 테스트 레벨, 리스크, 사용하는 SDLC, 그리고 기업 구조·경쟁사 구도·시장 출시 시기 같은 비즈니스 정황이 포함된다.","목적 목록에는 베리피케이션(⑤⑥)과 밸리데이션(⑨)이 모두 들어 있다."],"traps":["결함 '수정'은 테스트 목적이 아니다. 결함 수정은 디버깅이 한다.","'결함이 없음을 증명'은 테스트 목적이 될 수 없다(1.3 원리 1).","테스팅은 이해관계자에게 정보를 '제공'한다. 결정은 이해관계자가 내린다."]},{"id":"1.1.2","title":"테스팅과 디버깅","points":["테스팅과 디버깅은 별개의 활동이다.","테스팅은 결함 때문에 생기는 장애를 유발하거나(동적 테스팅), 테스트 대상의 결함을 직접 찾아낸다(정적 테스팅).","동적 테스팅이 장애를 유발했을 때 디버깅은 장애의 원인(결함)을 찾고, 그 원인을 분석하고 제거한다.","이때(동적 테스팅이 장애를 유발한 경우) 일반적인 디버깅 프로세스: ① 장애 재현 ② 분석(결함 찾기) ③ 결함 수정","디버깅 뒤 확인 테스팅(confirmation testing)으로 문제가 제대로 수정됐는지 확인한다. 처음 테스트를 수행한 사람이 다시 하는 것이 바람직하다.","수정 사항이 테스트 대상의 다른 부분에 장애를 일으키지 않았는지 보려고 리그레션 테스팅(regression testing)을 추가로 수행할 수 있다.","정적 테스팅으로 결함을 찾은 경우 디버깅은 결함 제거에 중점을 둔다. 장애 없이 결함을 직접 찾았으므로 장애 재현과 분석이 필요 없다."],"traps":["확인 테스팅은 '그 결함이 제대로 고쳐졌나?', 리그레션 테스팅은 '고친 것 때문에 다른 곳에 장애가 생기지 않았나?'를 본다.","확인 테스팅은 디버깅 단계(재현·분석·수정)에 들어가지 않는다. 디버깅 '이후'에 하는 테스팅이다.","정적 테스팅에서 찾은 결함도 디버깅으로 제거한다. 다만 재현과 분석 단계가 없다."]},{"id":"1.2","title":"테스팅이 왜 필요한가?","points":["테스팅은 품질 제어 활동의 하나로, 정해진 범위·시간·품질·예산 안에서 합의된 테스트 목표를 달성하도록 돕는다.","성공에 기여하는 테스팅은 테스트팀의 활동에 국한되지 않는다. 모든 이해관계자가 자신의 테스트 기술로 프로젝트 성공에 기여할 수 있다.","컴포넌트, 시스템, 관련 산출물(예: 문서)을 테스트하면 소프트웨어 결함을 식별하는 데 도움이 된다."],"traps":[]},{"id":"1.2.1","title":"테스팅이 성공에 기여하는 방법","points":["테스팅은 결함을 식별하는 비용 효율적인 방법이다.","식별한 결함은 테스팅이 아닌 디버깅으로 제거하므로, 테스팅은 테스트 대상의 품질 향상에 '간접적으로' 기여한다.","테스팅은 SDLC 여러 단계에서 테스트 대상의 품질을 '직접' 평가하는 방법이다. 평가 결과는 프로젝트 관리 활동에 쓰여 다음 단계 진행(예: 릴리스) 결정에 기여한다.","테스팅은 개발 프로젝트에서 사용자를 간접적으로 대변한다. 사용자 대표 집단을 직접 참여시키는 방법은 비용이 많이 들고 적합한 사용자를 구하기 어려워 힘든 경우가 많다.","계약 또는 법적 요구사항을 충족하거나 규제 표준을 준수하기 위해 테스팅이 필요할 수도 있다."],"traps":["품질 '평가'는 직접, 품질 '향상'은 간접이다. 결함 제거는 디버깅이 하기 때문이다."]},{"id":"1.2.2","title":"테스팅과 품질 보증(QA)","points":["테스팅과 품질 보증(QA)은 혼용되는 경우가 많지만 같지 않다.","테스팅은 제품 지향적이고, 적합한 수준의 품질 달성을 지원하는 교정 접근법(corrective approach)이다. 테스팅은 품질 제어의 주요 활동이다.","품질 제어에는 테스팅 외에 정형 기법(모델 확인, 정확성의 증명), 시뮬레이션, 프로토타이핑도 속한다.","품질 보증은 프로세스의 구현과 개선에 초점을 맞춘 프로세스 중심의 예방 접근법이다. '좋은 프로세스를 올바르게 준수하면 좋은 제품이 만들어진다'는 가정에 기반한다.","품질 보증은 개발 및 테스팅 프로세스 모두에 적용되며, 프로젝트에 참여하는 모두의 책임이다.","테스트 결과는 둘 다 사용한다. 테스팅은 결함 수정에, 품질 보증은 개발·테스트 프로세스가 잘 동작하는지 확인하는 피드백에 쓴다."],"traps":["'제품 지향·교정 = 테스팅', '프로세스 중심·예방 = 품질 보증'. 짝을 뒤바꾼 보기를 조심한다.","실라버스는 테스팅을 품질 '제어'의 주요 활동으로 설명한다. 품질 보증과 이름이 비슷하니 구분해서 기억한다.","품질 보증은 테스트팀만의 책임이 아니라 프로젝트 참여자 모두의 책임이다."]},{"id":"1.2.3","title":"오류, 결함, 장애, 근본 원인","points":["사람은 오류(실수)를 저지르고, 그 때문에 결함(결점, 버그)이 생기며, 결함은 장애로 이어질 수 있다.","사람은 시간적인 압박, 작업 산출물의 복잡성, 프로세스, 인프라, 상호작용 등 다양한 이유로, 또 피로하거나 훈련이 부족해서 오류를 범한다.","결함은 요구사항 명세서·테스트 스크립트 같은 문서, 소스 코드, 빌드 파일 같은 지원 산출물에 있을 수 있다. SDLC 초기 산출물의 결함을 놓치면 후반 산출물의 결함으로 이어지는 경우가 많다.","코드의 결함이 실행되면 시스템이 해야 할 일을 못 하거나 하지 말아야 할 일을 해서 장애가 날 수 있다.","실행되면 항상 장애를 일으키는 결함도 있고, 특정 상황에서만 장애를 일으키거나 장애로 이어지지 않는 결함도 있다.","장애의 원인은 오류와 결함만이 아니다. 방사선이나 전자기장이 펌웨어에 문제를 일으키는 경우처럼 환경 조건으로도 생긴다.","근본 원인은 문제 발생의 근본적인 이유(예: 오류로 이어지는 상황)다. 근본 원인 분석으로 찾으며, 보통 장애가 발생하거나 결함을 식별했을 때 수행한다.","근본 원인을 처리(예: 제거)하면 유사한 장애와 결함을 예방하거나 그 빈도를 줄일 수 있다."],"traps":["대표적인 흐름은 근본 원인(예: 오류로 이어지는 상황) → 오류(사람의 실수) → 결함(산출물의 잘못) → 장애(실행 시 잘못된 동작)이다. 다만 결함이 장애로 이어지지 않을 수도 있다. 사례 문제에서는 문장마다 어느 단계인지 구분한다.","결함이 있다고 항상 장애가 나는 것은 아니다.","장애의 원인이 항상 사람의 오류인 것은 아니다(환경 조건)."]},{"id":"1.3","title":"테스팅의 원리","points":["원리 1. 테스팅은 결함의 존재를 밝히는 활동이지, 결함이 없음을 증명하지는 않는다. 결함이 남아 있을 확률은 줄이지만, 결함을 못 찾았다고 소프트웨어가 완벽하다는 뜻은 아니다.","원리 2. 완벽한 테스팅은 불가능하다. 매우 간단한 소프트웨어를 빼면 모든 것을 테스트할 수 없다. 테스트 기법, 테스트 케이스 우선순위 지정, 리스크 기반 테스팅으로 테스트 노력을 집중한다.","원리 3. 조기 테스팅으로 시간과 비용을 절약할 수 있다. 초기에 제거한 결함은 연관된 다른 산출물의 후속 결함으로 이어지지 않고, SDLC 후반 장애가 줄어 품질 비용이 절감된다. 정적 테스팅과 동적 테스팅 모두 최대한 일찍 시작한다.","원리 4. 결함은 집중된다. 보통 대부분의 결함은 소수의 시스템 컴포넌트에 집중되는 경향이 있고, 운영 장애의 대부분도 소수의 컴포넌트에서 발생한다(파레토 원리의 예). 예상·실제 결함 집중 영역은 리스크 기반 테스팅에서 중요하게 고려된다.","원리 5. 테스트 효과는 줄어든다. 같은 테스트를 계속 반복하면 신규 결함 식별 효과가 줄어든다. 기존 테스트 케이스·테스트 데이터 수정과 새 테스트 작성이 필요할 수 있다. 단, 자동 리그레션 테스팅처럼 반복이 유익한 경우도 있다.","원리 6. 테스팅은 정황에 의존적이다. 모든 상황에 적용할 수 있는 하나의 테스팅 접근법은 없으며, 정황에 따라 다르게 진행한다.","원리 7. 결함-부재는 궤변이다. 베리피케이션이 시스템의 성공을 보장한다고 기대하는 것은 잘못이다. 모든 요구사항을 테스트하고 발견한 결함을 다 고쳐도 사용자 요구·비즈니스 목표에 못 미치거나 경쟁 시스템보다 부족할 수 있으므로, 밸리데이션도 수행한다."],"traps":["원리 1은 '결함이 남아 있을 수 있다', 원리 7은 '결함을 다 고쳐도 사용자 필요를 못 채울 수 있다'는 이야기다. 둘을 구분한다.","원리 5는 반복이 항상 나쁘다는 뜻이 아니다. 자동 리그레션 테스팅처럼 유익한 반복도 있다.","원리 3의 조기 테스팅은 정적 테스팅만이 아니라 동적 테스팅도 포함한다.","원리 2의 대응은 테스트를 포기하는 것이 아니라 테스트 노력을 집중하는 것이다."]},{"id":"1.4","title":"테스트 활동, 테스트웨어, 테스트 역할","points":["테스팅은 정황에 의존적이지만, 테스트 목적 달성에 필요한 보편적인 테스트 활동들이 있다. 이 활동들이 테스트 프로세스(test process)를 구성한다.","테스트 프로세스는 여러 요인에 따라 주어진 상황에 맞게 조정될 수 있다.","어떤 테스트 활동을 넣을지, 구체적으로 어떻게, 언제 할지는 보통 그 상황에 필요한 테스트 계획을 짤 때 정한다."],"traps":[]},{"id":"1.4.1","title":"테스트 활동과 업무","points":["주요 활동 대부분은 순차적으로 수행되는 것처럼 보일 수 있지만, 실제로는 반복적 또는 병렬로 구현되는 경우가 많다. 테스팅 활동은 보통 시스템과 프로젝트에 맞게 조정한다.","① 테스트 계획(Test planning): 테스트 목적을 정의하고, 전반적인 상황에 따른 제약 조건 안에서 목적을 가장 잘 달성할 접근법을 선택한다.","② 테스트 모니터링과 제어(Test monitoring and test control): 테스트 모니터링은 모든 테스트 활동을 지속적으로 점검하고 실제 진행 상황을 계획과 비교한다. 테스트 제어는 테스트 목적 달성에 필요한 조치를 한다.","③ 테스트 분석(Test analysis): 테스트 베이시스를 분석해 테스트 가능한 기능을 식별하고, 리스크와 리스크 수준을 고려해 테스트 컨디션을 정의하고 우선순위를 매긴다. 테스트 베이시스와 테스트 대상의 결함 식별과 테스트 용이성 평가도 한다. 테스트 분석을 지원하려고 테스트 기법을 사용하는 경우가 많다. '무엇을 테스트할 것인가?'에 측정 가능한 커버리지 조건으로 답한다.","④ 테스트 설계(Test design): 테스트 컨디션을 테스트 케이스와 기타 테스트웨어(예: 테스트 차터)로 구체화한다. 테스트 케이스 입력값을 구체화하는 데 도움이 되는 커버리지 항목 식별을 포함하는 경우가 많고, 테스트 데이터 요구사항 정의, 테스트 환경 설계, 필요한 인프라와 도구 식별도 포함한다. 테스트 기법을 활용해 이 활동을 지원할 수 있다. '어떻게 테스트할 것인가?'에 답한다.","⑤ 테스트 구현(Test implementation): 테스트 실행에 필요한 테스트웨어(예: 테스트 데이터)를 만들거나 획득한다. 테스트 케이스는 테스트 절차로 묶을 수 있으며, 테스트 절차는 테스트 스위트로 조합하는 경우가 많다. 수동·자동 테스트 스크립트를 만든다. 우선순위를 반영한 테스트 실행 일정으로 테스트 절차를 정리하고, 테스트 환경을 구축해 올바르게 설정되었는지 확인한다.","⑥ 테스트 실행(Test execution): 테스트 실행 일정에 따라 테스트를 수행한다(테스트 런). 수동·자동 실행, 지속적 테스팅·페어 테스팅 세션 등 여러 형태가 있다. 실제 결과를 기대 결과와 비교하고, 결과를 기록하고, 이상 사항을 분석해 가능한 원인을 파악하며, 관찰한 장애를 기반으로 이상 사항을 보고할 수 있다.","⑦ 테스트 완료(Test completion): 보통 프로젝트 마일스톤(예: 릴리스, 반복 주기 완료, 테스트 레벨 완료)에서 한다. 미해결 결함에 대한 변경 요청서나 제품 백로그 항목 작성, 향후 유용할 수 있는 테스트웨어를 식별해 보관하거나 적절한 팀에 인계, 테스트 환경을 합의된 상태로 종료, 교훈과 개선 사항 파악, 테스트 완료 보고서 작성·전달."],"traps":["분석은 '무엇을', 설계는 '어떻게'에 답한다.","테스트 환경을 '설계'하는 것은 테스트 설계, '구축하고 설정을 확인'하는 것은 테스트 구현이다.","테스트 데이터 '요구사항 정의'는 설계, 테스트 데이터 '생성·획득'은 구현이다.","모니터링은 점검·비교, 제어는 조치다.","테스트 절차를 테스트 실행 일정으로 '정리'하는 것은 구현, 그 일정에 '따라 수행'하는 것은 실행이다.","테스트 기법은 테스트 설계에서만 쓰이는 것이 아니다. 테스트 분석을 지원하는 데도 자주 쓰인다."]},{"id":"1.4.2","title":"정황에 따른 테스트 프로세스","points":["테스팅은 단독으로 수행되지 않으며, 조직이 수행하는 개발 프로세스의 필수적인 부분이다.","테스팅 비용은 이해관계자가 부담하고, 테스팅의 최종 목표는 이해관계자의 비즈니스 목표 달성을 지원하는 것이다.","테스팅 수행 방식에 영향을 주는 정황 요소: ① 이해관계자(필요, 기대, 요구사항, 협력 의지 등) ② 팀원(기술, 지식, 경험 수준, 가용성, 훈련 필요성 등) ③ 비즈니스 도메인(테스트 대상의 중요도, 식별된 리스크, 시장 요구사항, 구체적인 법적 규제 등) ④ 기술적 요인(소프트웨어 유형, 제품 아키텍처, 사용된 기술 등) ⑤ 프로젝트 제약 조건(범위, 시간, 예산, 자원 등) ⑥ 조직적 요인(조직 구조, 기존 정책, 적용한 프랙티스 등) ⑦ 소프트웨어 개발수명주기(공학적 프랙티스, 개발 방법론 등) ⑧ 도구(가용성, 사용성, 규정 준수 등)","이 요소들은 테스트 전략, 적용된 테스트 기법, 테스트 자동화 수준, 필요 커버리지 수준, 테스트웨어의 상세화 수준, 테스트 보고 등에 영향을 미친다."],"traps":["테스트 대상의 중요도와 법적 규제는 '비즈니스 도메인' 요소다. '규정 준수'는 '도구' 요소의 항목이다.","경험 수준·훈련 필요성은 '팀원' 요소, 기존 정책·적용한 프랙티스는 '조직적 요인'이다."]},{"id":"1.4.3","title":"테스트웨어","points":["테스트웨어는 1.4.1의 테스트 활동 결과물로 만들어진다. 조직마다 만들고 이름 붙이고 관리하는 방식이 크게 다르며, 적절한 형상관리가 작업 산출물의 일관성과 무결성을 보장한다. 아래 목록은 일부만 나열한 것이다.","테스트 계획: 테스트 계획, 테스트 일정, 리스크 관리 대장(risk register), 시작 및 완료 조건. 리스크 관리 대장은 리스크 발생 가능성·영향도·완화 정보가 담긴 리스크 목록이다. 일정·리스크 관리 대장·시작 및 완료 조건은 종종 테스트 계획서에 포함된다.","테스트 모니터링과 테스트 제어: 테스트 진행 상황 보고서, 제어 지침 문서, 리스크 정보","테스트 분석: (우선순위가 지정된) 테스트 컨디션(예: 인수 기준), (바로 수정하지 않았다면) 테스트 베이시스의 결함에 관한 결함 보고서","테스트 설계: (우선순위가 지정된) 테스트 케이스, 테스트 차터, 커버리지 항목, 테스트 데이터 요구사항, 테스트 환경 요구사항","테스트 구현: 테스트 절차, 수동 및 자동 테스트 스크립트, 테스트 스위트, 테스트 데이터, 테스트 실행 일정, 테스트 환경 요소(예: 스텁, 드라이버, 시뮬레이터, 서비스 가상화)","테스트 실행: 테스트 로그, 결함 보고서","테스트 완료: 테스트 완료 보고서, 향후 프로젝트나 반복 주기 때 개선할 실천 항목, 문서로 기록한 교훈, 변경 요청서(예: 제품 백로그 항목)"],"traps":["1.4.3 목록에서 결함 보고서는 테스트 분석(바로 수정하지 않은 테스트 베이시스의 결함)과 테스트 실행 두 활동의 산출물로 나온다.","테스트 데이터 '요구사항'과 테스트 환경 '요구사항'은 설계 산출물, 테스트 '데이터'와 테스트 '환경 요소'는 구현 산출물이다.","우선순위가 지정된 테스트 '컨디션'은 분석, 우선순위가 지정된 테스트 '케이스'는 설계 산출물이다.","테스트 실행 '일정'은 실행이 아니라 구현 산출물이다."]},{"id":"1.4.4","title":"테스트 베이시스와 테스트웨어 간의 추적성","points":["효과적인 테스트 모니터링과 제어를 위해 테스트 프로세스 전반에 걸쳐 테스트 베이시스 요소, 관련 테스트웨어(예: 테스트 컨디션, 리스크, 테스트 케이스), 테스트 결과, 결함 사이의 추적성을 구축하고 유지해야 한다.","정확한 추적성은 커버리지 평가를 지원한다. 측정 가능한 커버리지 조건이 테스트 베이시스에 정의되어 있으면 특히 유용하다. 커버리지 조건은 테스트 목적을 어느 정도 달성했는지 나타내는 활동들을 촉진하는 핵심 성과 지표로 사용될 수 있다.","테스트 케이스 → 요구사항 추적성: 테스트 케이스가 요구사항을 커버하는지 확인할 수 있다.","테스트 결과 → 리스크 추적성: 테스트 대상의 잔존 리스크 수준을 평가할 수 있다.","좋은 추적성은 변경사항의 영향 파악, 테스트 감사 용이, IT 운영 및 관리(IT governance) 기준 충족에 도움이 된다.","좋은 추적성은 테스트 베이시스 요소의 상태를 명시해 테스트 진행 상황 보고서와 테스트 완료 보고서를 이해하기 쉽게 하고, 테스팅의 기술적 측면을 이해관계자에게 쉽게 전달하도록 돕는다.","추적성은 비즈니스 목표 대비 제품 품질, 프로세스 역량, 프로젝트 진행 상황을 평가할 정보를 제공한다."],"traps":["'요구사항 커버 여부'는 테스트 케이스↔요구사항, '잔존 리스크 수준'은 테스트 결과↔리스크 추적성이다. 짝을 바꾼 보기를 조심한다."]},{"id":"1.4.5","title":"테스팅에서의 역할","points":["실라버스는 두 가지 주요 역할, 테스트 관리 역할과 테스팅 역할을 다룬다. 두 역할에 할당되는 활동과 업무는 프로젝트·제품의 정황, 담당자의 기술 수준, 조직 상황 등에 따라 달라진다.","테스트 관리 역할: 테스트 프로세스, 테스트팀, 테스트 활동 리더십에 대한 전반적인 책임을 진다. 주요 관심 영역은 테스트 계획, 테스트 모니터링, 테스트 제어, 테스트 완료다.","테스트 관리 역할의 수행 방식은 정황에 따라 다르다. 애자일 소프트웨어 개발에서는 테스트 관리 업무의 일부를 애자일팀이 처리할 수 있고, 여러 팀이나 조직 전체에 걸친 과업은 개발팀 외부의 테스트 관리자가 수행할 수도 있다.","테스팅 역할: 테스팅의 공학(기술)적 측면에 대한 전반적인 책임을 진다. 주로 테스트 분석, 테스트 설계, 테스트 구현, 테스트 실행에 초점을 둔다.","역할을 맡는 사람은 상황에 따라 다르다. 테스트 관리 역할은 팀 리더, 테스트 관리자, 개발 관리자 등이 수행할 수 있고, 한 사람이 두 역할을 동시에 맡을 수도 있다."],"traps":["관리 역할의 4개 활동(계획·모니터링·제어·완료)과 테스팅 역할의 4개 활동(분석·설계·구현·실행)을 섞은 보기를 조심한다.","역할은 직함이 아니다. 개발 관리자나 팀 리더도 테스트 관리 역할을 맡을 수 있다."]},{"id":"1.5","title":"테스팅의 필수 기술 및 모범 사례","points":["기술(skill)은 어떤 일을 잘 해내는 능력으로, 그 사람이 가진 지식, 경험, 적성에서 나온다.","우수한 테스터는 업무를 잘하기 위한 몇 가지 필수 기술을 갖춰야 한다.","우수한 테스터는 팀플레이, 즉 협업에 능해야 하며 다양한 수준의 독립성에서 테스팅을 수행할 수 있어야 한다."],"traps":[]},{"id":"1.5.1","title":"테스팅에 보편적으로 필요한 기술","points":["테스팅 지식: 테스팅 효과를 높이기 위해(예: 테스트 기법 활용)","철저함, 신중함, 호기심, 세부사항에 대한 주의력, 체계적인 접근: 결함, 특히 찾기 어려운 결함을 식별하기 위해","우수한 의사소통 기술, 경청하는 자세, 팀플레이: 모든 이해관계자와 효과적으로 상호작용하고, 정보를 전달하고, 상대의 이해를 구하고, 결함을 보고하고 논의하기 위해","분석적 사고, 비판적 사고, 창의성: 테스팅 효과를 높이기 위해","기술 지식: 적절한 테스트 도구 사용 등으로 테스팅을 개선하기 위해(영문 실라버스는 '효율성(efficiency)', 한글 실라버스는 '테스팅 효과를 높이기 위해'로 표기)","도메인 지식: 최종 사용자/비즈니스 대표자를 이해하고 그들과 소통하기 위해","테스터는 나쁜 소식을 전하는 경우가 많고, 사람은 나쁜 소식을 전하는 사람을 탓하는 성향이 있다. 그래서 테스터에게 의사소통 기술이 매우 중요하다.","테스트 결과 전달은 제품이나 작성자에 대한 비판으로 오해될 수 있고, 확증 편향(confirmation bias)은 현재 믿음과 맞지 않는 정보를 받아들이기 어렵게 한다. 테스팅을 파괴적 활동으로 보는 인식을 개선하려면 결함과 장애 정보를 건설적으로 전달해야 한다."],"traps":["기술과 목적의 짝을 섞은 보기를 조심한다. 도구 사용은 기술 지식, 사용자·비즈니스 대표자와의 소통은 도메인 지식, 테스트 기법 활용은 테스팅 지식이다.","확증 편향은 맞지 않는 정보를 받아들이기 '어렵게' 만든다."]},{"id":"1.5.2","title":"전체 팀 접근법","points":["전체 팀 접근법(whole team approach)은 익스트림 프로그래밍에서 시작된 프랙티스로, 팀 환경에서 효과적으로 일하고 팀 목표에 긍정적으로 기여하는 능력을 바탕으로 한다.","필요 지식과 기술을 갖춘 팀원이라면 누구나 어떤 작업이라도 수행할 수 있고, 모든 팀원이 품질에 대한 책임을 진다.","같은 공간을 사용하는 것(co-location)은 의사소통과 상호작용을 쉽게 하므로, 팀원들은 (물리적 또는 가상의) 작업 공간을 공유한다.","장점: 팀의 활력을 높이고, 팀 내 의사소통과 협업을 강화하며, 팀이 가진 다양한 기술을 활용해 프로젝트 성공을 위한 시너지를 만든다.","테스터는 비즈니스 담당자와 협력해 적절한 인수 테스트를 작성하고, 개발자와 협력해 테스트 전략을 협의하고 테스트 자동화 접근법을 결정한다.","그래서 테스터는 테스팅 지식을 다른 팀원과 공유하고 제품 개발에 영향을 준다.","정황에 따라 적절하지 않을 수도 있다. 예를 들어 안전이 치명적인 경우에는 높은 수준의 테스트 독립성이 필요할 수 있다."],"traps":["'품질 책임은 테스터에게 있다'는 보기는 틀렸다. 모든 팀원의 책임이다.","작업 공간은 물리적일 수도 가상일 수도 있다.","전체 팀 접근법이 항상 맞는 것은 아니다(예: 안전이 치명적인 경우)."]},{"id":"1.5.3","title":"테스팅의 독립성","points":["일정 수준의 독립성은 저자와 테스터의 인지 편향(cognitive biases) 차이 덕분에 테스터가 결함을 더 효과적으로 식별하게 한다.","독립성이 친숙함을 대체하지는 않는다. 예를 들어 개발자는 자신이 작성한 코드에서 많은 결함을 효율적으로 찾아낼 수 있다.","독립성 수준: 저자 본인(독립성 없음), 저자의 같은 팀 동료(일정 수준의 독립성), 저자의 팀 외부지만 조직 내 테스터(높은 독립성), 조직 외부 테스터(매우 높은 독립성)","대부분의 프로젝트는 여러 수준의 독립성으로 테스팅하는 것이 가장 좋다. 예: 개발자는 컴포넌트·컴포넌트 통합 테스팅, 테스트팀은 시스템·시스템 통합 테스팅, 비즈니스 담당자는 인수 테스팅.","장점: 독립적인 테스터는 배경, 기술적 관점, 편향이 달라 개발자와 다른 유형의 장애와 결함을 식별할 가능성이 높다. 또 독립적인 테스터는 이해관계자가 시스템 명세·구현 과정에서 한 가정을 검증하고 이의를 제기하거나 반증할 수 있다.","단점: 독립적인 테스터는 개발팀과 차단되어 협업과 의사소통이 어렵거나 개발팀과 적대적인 관계가 될 수 있다. 개발자가 품질에 대한 책임감을 잃을 수 있다. 독립적인 테스터가 병목으로 인식되거나 출시 지연의 원인으로 비난받을 수 있다."],"traps":["같은 팀 동료는 '일정 수준', 팀 밖·조직 안은 '높음', 조직 밖은 '매우 높음'이다.","독립성이 높을수록 무조건 좋은 것은 아니다. 대부분은 여러 수준을 섞는 것이 가장 좋다.","'개발자의 품질 책임감 상실', '협업·의사소통 어려움'은 단점이다. 장점처럼 바꿔 쓴 보기를 조심한다."]}]},{"ch":2,"title":"소프트웨어 개발수명주기(SDLC)와 테스팅","titleEn":"Testing Throughout the Software Development Lifecycle","minutes":130,"examCount":6,"keywords":[{"ko":"인수 테스팅","en":"acceptance testing","def":"시스템이 사용자의 비즈니스에 필요한 사항을 충족해 배포할 준비가 됐는지 확인(밸리데이션)하는 데 중점을 둔 테스트 레벨이다. 실제 사용자가 수행하는 것이 이상적이다."},{"ko":"블랙박스 테스팅","en":"black-box testing","def":"명세 기반 테스트 유형이다. 테스트 대상의 속(내부 구조)은 보지 않고 명세 같은 문서에서 테스트를 만들어, 명세대로 동작하는지 확인한다."},{"ko":"컴포넌트 통합 테스팅","en":"component integration testing","def":"컴포넌트끼리 맞물리는 부분(인터페이스와 상호 작용)을 테스트하는 레벨이다. 단위 통합 테스팅이라고도 하며, 상향식·하향식·빅뱅 같은 통합 전략에 따라 크게 달라진다."},{"ko":"컴포넌트 테스팅","en":"component testing","def":"컴포넌트 하나를 따로 떼어 테스트하는 레벨이다. 단위 테스팅이라고도 하며, 보통 개발자가 자신의 개발 환경에서 테스트 하네스나 단위 테스트 프레임워크를 써서 수행한다."},{"ko":"확인 테스팅","en":"confirmation testing","def":"원래 결함이 제대로 고쳐졌는지 확인하는 테스팅이다. 예: 그 결함 때문에 실패했던 테스트를 다시 실행한다."},{"ko":"기능 테스팅","en":"functional testing","def":"컴포넌트나 시스템이 무엇을 해야 하는지(기능)를 평가하는 테스트 유형이다. 기능 성숙도(완전성), 기능 정확성, 기능 타당성(적합성)을 확인하는 것이 주요 목적이다."},{"ko":"통합 테스팅","en":"integration testing","def":"2장 본문에 따로 정의한 문장은 없다. 2.2.1의 다섯 테스트 레벨 중 통합을 다루는 것은 컴포넌트 통합 테스팅과 시스템 통합 테스팅 두 가지이고, 둘 다 인터페이스를 테스트하는 데 중점을 둔다."},{"ko":"유지보수 테스팅","en":"maintenance testing","def":"운영 중인 시스템을 유지보수할 때 하는 테스팅으로, 계기는 수정사항(계획된 개선사항, 수정을 위한 변경, 핫픽스), 운영 환경의 업그레이드나 마이그레이션, 단종으로 나뉜다. 운영 중인 시스템의 변경을 테스트할 때는 변경이 성공적으로 구현됐는지와, 변경되지 않은 영역에서 생길 수 있는 리그레션을 함께 확인한다."},{"ko":"비기능 테스팅","en":"non-functional testing","def":"기능 특성 이외의 속성, 즉 시스템이 얼마나 잘 동작하는지를 평가하는 테스트 유형이다. 수행 효율성, 보안 같은 비기능 품질 특성을 확인한다."},{"ko":"리그레션 테스팅","en":"regression testing","def":"변경으로 인해 부정적인 영향이 없었는지 확인하는 테스팅이다. 영향은 변경한 컴포넌트 자체, 같은 시스템의 다른 컴포넌트, 연결된 다른 시스템에 생길 수 있고, 이미 확인 테스팅을 마친 결함 수정도 여기서 말하는 변경에 들어간다."},{"ko":"시프트 레프트","en":"shift left","def":"테스트를 SDLC의 더 이른 시점에 하는 접근법이다. 조기 테스팅 원리를 이렇게 부르기도 한다. 일찍 하라는 뜻이지, 후반 테스트를 무시해도 된다는 뜻은 아니다."},{"ko":"시스템 통합 테스팅","en":"system integration testing","def":"테스트 대상 시스템과 다른 시스템 또는 외부 서비스 사이의 인터페이스를 테스트하는 레벨이다. 가급적 운영 환경과 비슷한 테스트 환경을 쓴다."},{"ko":"시스템 테스팅","en":"system testing","def":"전체 시스템이나 제품의 전반적인 동작과 기능을 테스트하는 레벨이다. 엔드투엔드 기능 테스팅과 비기능 테스팅을 포함하는 경우가 많고, 시스템 명세와 관련이 있다."},{"ko":"테스트 레벨","en":"test level","def":"함께 구성하고 관리하는 테스트 활동의 묶음이다. 개별 컴포넌트부터 완성된 시스템까지, 특정 개발 단계의 소프트웨어에 대해 수행하는 테스트 프로세스의 인스턴스다."},{"ko":"테스트 대상","en":"test object","def":"테스트의 대상이 되는 소프트웨어 산출물이다(1.1). 2장에서는 테스트하는 컴포넌트나 시스템을 가리킬 때 쓰인다(예: 2.2.2의 기능 테스팅 설명)."},{"ko":"테스트 유형","en":"test type","def":"특정 품질 특성과 관련된 테스트 활동의 묶음이다. 대부분 모든 테스트 레벨에서 수행할 수 있다. 실라버스는 기능, 비기능, 블랙박스, 화이트박스 네 가지를 다룬다."},{"ko":"화이트박스 테스팅","en":"white-box testing","def":"구조 기반 테스트 유형이다. 코드, 아키텍처, 워크플로우, 데이터 플로우 같은 내부 구조에서 테스트를 만들고, 그 구조를 인수에 필요한 수준까지 충분히 커버하는 것이 목적이다."}],"sections":[{"id":"2.1","title":"소프트웨어 개발수명주기(SDLC)에서의 테스팅","points":["SDLC 모델은 소프트웨어 개발 프로세스를 상위 수준에서 추상적으로 표현한 것이다. 개발 단계와 활동 유형이 논리적·시간상으로 서로 어떻게 연관되는지 정의한다.","순차적 개발 모델의 예: 폭포수 모델, V-모델.","반복적 개발 모델의 예: 나선형 모델, 프로토타이핑.","점진적 개발 모델의 예: 통합 프로세스(Unified Process).","개발 프로세스 내 일부 활동은 구체적인 개발 방법과 애자일 프랙티스로 설명하기도 한다. 예: 인수 테스트 주도 개발(ATDD), 행위 주도 개발(BDD), 도메인 주도 설계(DDD), 익스트림 프로그래밍(XP), 기능 주도 개발(FDD), 칸반(Kanban), 린(lean) IT, 스크럼(Scrum), 테스트 주도 개발(TDD)."],"traps":["통합 프로세스(Unified Process)는 이름 때문에 헷갈리지만 점진적 개발 모델의 예다.","프로토타이핑은 반복적 개발 모델의 예로 나온다."]},{"id":"2.1.1","title":"소프트웨어 개발수명주기(SDLC)가 테스팅에 미치는 영향","points":["테스팅이 성공하려면 SDLC에 맞게 조정해야 한다.","SDLC 모델의 선택이 영향을 미치는 것 5가지: ① 테스트 활동 범위 및 시기(예: 테스트 레벨 및 테스트 유형) ② 테스트 문서 상세화 수준 ③ 테스트 기법 및 테스트 접근법 선택 ④ 테스트 자동화 범위 ⑤ 테스터의 역할과 책임.","순차적 개발 모델: 테스터는 초기 단계에서 요구사항 리뷰, 테스트 분석과 설계에 참여한다.","순차적 개발 모델: 실행 가능한 코드가 보통 개발 후반에 생기므로 동적 테스팅은 SDLC 초기에 하기 어려운 경우가 많다.","일부 반복적·점진적 개발 모델: 반복 주기마다 동작하는 프로토타입이나 제품 증분이 나온다고 가정한다. 그래서 반복 주기마다 모든 테스트 레벨에서 정적 테스팅과 동적 테스팅을 할 수 있다.","증분을 자주 전달하려면 빠른 피드백과 광범위한 리그레션 테스팅이 필요하다.","애자일 소프트웨어 개발: 프로젝트 어느 시점에도 변화가 생길 수 있다고 가정한다. 그래서 가벼운 작업 산출물 문서와, 리그레션 테스팅을 쉽게 해 주는 테스트 자동화를 선호한다.","애자일의 수동 테스팅은 사전 테스트 분석과 설계가 많이 필요하지 않은 경험 기반 테스트 기법(4.4)으로 하는 경향이 있다."],"traps":["순차적 모델에서도 테스터는 초기부터 참여한다(요구사항 리뷰, 테스트 분석·설계). 초기에 하기 어려운 것은 동적 테스팅이다.","반복 주기마다 모든 테스트 레벨에서 정적·동적 테스팅을 할 수 있다는 설명은 반복적·점진적 모델의 것이다. 순차적 모델 설명과 섞어 내는 보기를 조심한다."]},{"id":"2.1.2","title":"소프트웨어 개발수명주기(SDLC)와 좋은 테스팅 프랙티스","points":["선택한 SDLC 모델에 상관없이 적용되는 좋은 테스팅 프랙티스는 4가지다.","① 모든 소프트웨어 개발 활동에 상응하는 테스트 활동을 둔다 → 모든 개발 활동이 품질 제어의 대상이 된다.","② 테스트 레벨(2.2.1)마다 구체적이면서 독립적인 테스트 목적을 설정한다 → 중복은 피하고, 적절하면서 포괄적인 테스팅이 가능하다.","③ 특정 테스트 레벨의 테스트 분석과 설계를 SDLC의 상응하는 개발 단계에서 시작한다 → 조기 테스팅 원리(1.3)를 준수할 수 있다.","④ 테스터가 작업 산출물의 문서 초안이 가용한 즉시 리뷰에 참여한다 → 이 조기 테스팅과 결함 발견이 시프트 레프트(2.1.5)를 지원한다."],"traps":["프랙티스와 효과의 짝을 바꿔 내는 보기가 나오기 쉽다. 품질 제어 대상은 ①, 중복 회피는 ②, 조기 테스팅 원리 준수는 ③, 시프트 레프트 지원은 ④에 적혀 있다.","리뷰 참여 시점은 문서가 최종 승인된 뒤가 아니라 초안이 가용한 즉시다.","레벨 간 완료 조건·시작 조건 연결(순차적 모델), 증분마다 광범위한 리그레션 테스팅(반복적·점진적 모델)은 특정 SDLC의 특징이지 2.1.2의 공통 프랙티스가 아니다."]},{"id":"2.1.3","title":"소프트웨어 개발 주도를 위한 테스팅","points":["테스트 주도 개발(TDD), 인수 테스트 주도 개발(ATDD), 행위 주도 개발(BDD)은 서로 비슷한 개발 접근법이다. 개발 방향을 정하는 수단으로 테스트를 정의한다.","코드 작성 전에 테스트를 정의하므로 조기 테스팅 원리(1.3)와 시프트 레프트(2.1.5)를 따른다. 반복적 개발 모델을 지원한다.","TDD: (광범위한 소프트웨어 설계 대신) 테스트 케이스로 코딩을 이끈다. 테스트를 먼저 쓰고 → 테스트를 충족하도록 코드를 쓰고 → 테스트와 코드를 리팩토링한다.","ATDD(4.5.3): 시스템 설계 프로세스 중 인수 조건에서 테스트를 도출한다. 테스트는 그 테스트를 만족해야 할 애플리케이션 영역을 개발하기 전에 작성한다.","BDD: 애플리케이션의 기대 동작을 이해관계자가 이해하기 쉬운 간단한 자연어 테스트 케이스로 표현한다. 보통 Given/When/Then 형태를 쓴다. 이후 테스트 케이스는 자동으로 실행 가능한 테스트로 변환된다.","세 접근법 모두, 작성한 테스트를 향후 구현/리팩토링 때 코드 품질을 보장하는 자동화 테스트로 유지할 수 있다."],"traps":["실라버스는 세 접근법이 반복적 개발 모델을 지원한다고만 쓴다. 순차적 모델과 함께 쓸 수 없다는 문장은 없다.","TDD에서 리팩토링하는 대상은 코드만이 아니라 테스트와 코드 둘 다다.","2.1.3 기준으로 인수 조건에서 테스트를 도출하는 것은 ATDD, 이해관계자용 자연어(Given/When/Then)는 BDD의 특징으로 정리돼 있다."]},{"id":"2.1.4","title":"데브옵스(DevOps)와 테스팅","points":["데브옵스: 개발(테스팅 포함)과 운영이 협력해 공통 목표를 달성하도록 시너지를 만드는 조직 차원의 접근법이다.","개발(테스팅 포함)과 운영의 생각 차이를 줄이고, 각자 하는 일의 가치를 동등하게 보도록 하는 조직문화의 변화가 필요하다.","팀의 자율성, 빠른 피드백, 통합된 도구 체인, 지속적 통합(CI)과 지속적 배포(CD) 같은 기술 프랙티스를 장려한다. 팀은 데브옵스 배포 파이프라인으로 높은 품질의 코드를 더 빠르게 빌드/테스트/릴리스할 수 있다.","테스팅 관점의 이점 6가지: ① 코드 품질, 그리고 변경이 기존 코드에 악영향을 주는지에 대한 빠른 피드백 ② CI가 개발자에게 컴포넌트 테스트 및 정적 분석과 함께 높은 품질의 코드를 제출하도록 장려해 시프트 레프트를 장려 ③ 안정적인 테스트 환경 구축을 촉진하는 CI/CD 같은 자동화 프로세스 장려 ④ 비기능 품질 특성(예: 성능 효율성, 신뢰성)에 대한 가시성 향상 ⑤ 배포 파이프라인을 통한 자동화로 반복적인 수동 테스팅 필요성 감소 ⑥ 자동 리그레션 테스트의 규모와 범위가 늘어 리그레션 발생 리스크 최소화.","리스크와 어려움 3가지: ① 데브옵스 배포 파이프라인을 정의하고 설정해야 한다 ② CI/CD 도구를 도입하고 유지보수해야 한다 ③ 테스트 자동화를 위한 추가 자원이 필요하고, 설정·유지보수가 어려울 수 있다.","데브옵스는 높은 수준의 테스트 자동화를 동반하지만, 수동 테스팅(특히 사용자 관점)은 여전히 필요하다."],"traps":["데브옵스라서 수동 테스팅이 필요 없다는 보기는 틀리다. 사용자 관점의 수동 테스팅은 여전히 필요하다.","테스트 자동화는 이점(수동 테스팅 감소, 리그레션 리스크 최소화)이면서, 추가 자원과 설정·유지보수 부담이라는 어려움이기도 하다.","데브옵스에서 말하는 개발에는 테스팅이 포함된다."]},{"id":"2.1.5","title":"시프트 레프트 접근법(Shift Left)","points":["조기 테스팅 원리(1.3)는 테스트를 SDLC 초기에 하는 접근법이라서 시프트 레프트라고 부르기도 한다.","시프트 레프트는 테스트를 더 일찍(예: 코드 구현이나 컴포넌트 통합을 기다리지 않고) 하라는 뜻이다. SDLC 후반의 테스트를 무시해도 된다는 뜻은 아니다.","시프트 레프트를 달성하는 좋은 프랙티스(실라버스가 든 일부): ① 테스터 관점에서 명세를 리뷰한다. 모호성, 불완전성, 불일치 같은 잠재 결함을 찾는 경우가 많다. ② 코드를 쓰기 전에 테스트 케이스를 쓰고, 구현 중 코드를 테스트 하네스에서 실행한다. ③ 빠른 피드백을 주고 코드 저장소에 소스 코드를 넣을 때 자동 컴포넌트 테스트를 함께 제출하게 하는 지속적 통합(CI), 가능하면 지속적 배포(CD)까지 적용한다. ④ 동적 테스팅 전 또는 자동화된 프로세스의 일부로 소스 코드의 정적 분석을 완료한다. ⑤ 가능한 한 컴포넌트 테스트에서부터 비기능 테스팅을 한다.","비기능 테스트는 완성 시스템과 실제 환경을 대변하는 테스트 환경이 생기는 SDLC 후반에 하는 경향이 있다. 그래서 컴포넌트 테스트부터 하는 것이 일종의 시프트 레프트가 된다.","시프트 레프트는 프로세스 초기에 훈련, 공수, 비용이 추가로 들 수 있지만 후반의 공수와 비용 절감을 기대할 수 있다.","시프트 레프트를 하려면 이해관계자들이 개념을 이해하고 받아들이는 것이 중요하다."],"traps":["시프트 레프트는 SDLC 후반의 테스트를 무시해도 된다는 뜻이 아니다.","프로세스 초기에는 훈련·공수·비용이 추가로 들 수 있다. 기대 효과는 초기 비용 절감이 아니라 프로세스 후반의 공수·비용 절감이다."]},{"id":"2.1.6","title":"회고 및 프로세스 개선","points":["회고 시기: 프로젝트나 반복 주기가 끝날 때, 릴리스 마일스톤에서, 또는 필요할 때. 시기와 구성은 사용 중인 SDLC 모델에 따라 달라진다.","참가자: 테스터뿐 아니라 개발자, 설계자, 제품 소유자, 비즈니스 분석가 등.","논의 내용 3가지: ① 무엇이 성공적이었고, 유지해야 할 것은 무엇인가? ② 무엇이 부족했고, 개선할 수 있는 점은 무엇인가? ③ 향후 개선 사항을 도입하고 성공 요소를 유지하려면 어떻게 해야 하는가?","결과는 기록해야 하며, 테스트 완료 보고서(5.3.2)에 포함하는 경우가 많다.","회고는 지속적인 개선을 성공적으로 구현하는 데 반드시 필요하다. 권장된 모든 개선 사항에 후속 조치가 이루어지는 것이 중요하다.","테스팅 관점의 일반적인 이점 5가지: ① 테스트 효과성/효율성 향상(예: 프로세스 개선 권고 사항 구현) ② 테스트웨어 품질 향상(예: 테스트 프로세스를 함께 검토) ③ 팀의 결속 및 학습 향상(예: 문제를 제기하고 개선점을 제안할 기회) ④ 테스트 베이시스 품질 개선(예: 요구사항의 범위나 품질에서 부족한 점을 발견하고 수정) ⑤ 개발과 테스팅 간의 협업 개선(예: 정기적으로 협업 과정을 검토하고 최적화)."],"traps":["회고는 프로젝트가 끝날 때 한 번만 하는 것이 아니다. 반복 주기 종료, 릴리스 마일스톤, 필요할 때도 한다.","이점과 예의 짝이 헷갈리기 쉽다. 요구사항 부족 보완은 테스트 베이시스 품질 개선, 테스트 프로세스를 함께 검토하는 것은 테스트웨어 품질 향상의 예다.","회고 참가자는 테스터만이 아니다."]},{"id":"2.2","title":"테스트 레벨과 테스트 유형","points":["테스트 레벨: 함께 구성하고 관리하는 테스트 활동 집합이다. 특정 개발 단계의 소프트웨어(개별 컴포넌트부터 완성된 시스템, 경우에 따라 시스템의 시스템까지)에 대해 수행하는 테스트 프로세스의 인스턴스다.","테스트 레벨은 SDLC 안의 다른 활동과 연관된다.","순차적 SDLC 모델은 한 레벨의 완료 조건이 다음 레벨의 시작 조건에 포함되도록 테스트 레벨을 정의하는 경우가 많다. 일부 반복적 모델에서는 그렇지 않을 수 있다.","개발 활동이 여러 테스트 레벨에 걸쳐 진행될 수 있고, 테스트 레벨이 시간상 서로 겹칠 수 있다.","테스트 유형: 특정 품질 특성과 관련된 테스트 활동 집합이다. 그 테스트 활동 대부분은 모든 테스트 레벨에서 수행할 수 있다."],"traps":["테스트 레벨은 개발 단계(컴포넌트부터 시스템까지)에 따른 묶음이고, 테스트 유형은 품질 특성에 따른 묶음이다.","테스트 레벨이 항상 차례대로만 진행되는 것은 아니다. 시간상 겹칠 수 있다."]},{"id":"2.2.1","title":"테스트 레벨","points":["컴포넌트 테스팅(단위 테스팅이라고도 함): 컴포넌트를 개별적으로 테스트한다. 테스트 하네스나 단위 테스트 프레임워크 같은 구체적인 지원 수단이 필요한 경우가 많다. 보통 개발자가 자신의 개발 환경에서 수행한다.","컴포넌트 통합 테스팅(단위 통합 테스팅이라고도 함): 컴포넌트 간의 인터페이스와 상호 작용을 테스트한다. 상향식, 하향식, 빅뱅 등 통합 전략에 따라 크게 달라진다.","시스템 테스팅: 전체 시스템이나 제품의 전반적인 동작과 기능에 중점을 둔다. 엔드투엔드 기능 테스팅과 품질 특성에 대한 비기능 테스팅을 포함하는 경우가 많다. 일부 비기능 품질 특성(예: 사용성)은 실제 환경을 대변하는 테스트 환경에서 완성된 시스템으로 테스트하는 것이 좋다. 서브-시스템 시뮬레이션을 쓸 수 있다. 독립된 테스트팀이 수행할 수 있으며, 시스템 명세와 관련이 있다.","시스템 통합 테스팅: 테스트 대상 시스템과 다른 시스템 또는 외부 서비스 간의 인터페이스를 테스트한다. 가급적 운영 환경과 유사한 적절한 테스트 환경을 쓴다.","인수 테스팅: 밸리데이션과 배포할 준비, 즉 시스템이 사용자의 비즈니스에 필요한 사항을 충족하는지 확인하는 데 중점을 둔다. 실제 사용자가 수행하는 것이 이상적이다. 주요 유형: 사용자 인수 테스팅(UAT), 운영 인수 테스팅, 계약 인수 테스팅과 규제 인수 테스팅, 알파 테스팅, 베타 테스팅.","테스트 활동의 중복을 피하려고 테스트 레벨을 구분하는 속성: 테스트 대상, 테스트 목적, 테스트 베이시스, 결함과 장애, 접근법과 역할. (영문 실라버스는 이 목록이 전부가 아니라고(non-exhaustive) 밝힌다.)"],"traps":["같은 시스템 안의 컴포넌트끼리 인터페이스면 컴포넌트 통합 테스팅, 다른 시스템이나 외부 서비스와의 인터페이스면 시스템 통합 테스팅이다.","시스템 테스팅은 시스템 명세와 관련되고, 인수 테스팅은 사용자의 비즈니스 필요(밸리데이션)와 배포 준비에 중점을 둔다.","수행 주체: 컴포넌트 테스팅은 보통 개발자, 시스템 테스팅은 독립된 테스트팀이 수행할 수 있고, 인수 테스팅은 실제 사용자가 하는 것이 이상적이다."]},{"id":"2.2.2","title":"테스트 유형","points":["실라버스가 다루는 테스트 유형은 4가지다: 기능 테스팅, 비기능 테스팅, 블랙박스 테스팅, 화이트박스 테스팅.","기능 테스팅: 컴포넌트나 시스템이 수행해야 하는 기능, 즉 테스트 대상이 무엇을 해야 하는지를 평가한다. 주요 목적은 기능 성숙도(완전성), 기능 정확성, 기능 타당성(적합성) 확인이다.","비기능 테스팅: 기능 특성 이외의 속성, 즉 시스템이 얼마나 잘 동작하는지를 평가한다. 주요 목적은 비기능 품질 특성 확인이다.","ISO/IEC 25010의 비기능 품질 특성 8가지: 수행 효율성(Performance efficiency), 호환성(Compatibility), 유용성(Usability, 상호작용 능력이라고도 함), 신뢰도(Reliability), 보안(Security), 유지 가능성(유지 관리성)(Maintainability), 이동성(Portability, 유연성이라고도 함), 안전성(Safety).","비기능 테스팅은 SDLC 초기(예: 리뷰나 컴포넌트 테스팅 중)에 시작하는 것이 바람직할 때가 있다. 많은 비기능 테스트는 기능 테스트에서 도출되며, 기능이 수행되는 동안 비기능 제약 조건이 충족되는지 확인한다(예: 특정 시간 내에 수행되는지, 새 플랫폼으로 이식될 수 있는지). 비기능 결함을 늦게 발견하면 프로젝트 성공에 심각한 위협이 될 수 있다. 매우 특수한 테스트 환경이 필요할 때도 있다(예: 유용성 테스팅의 유용성 랩).","블랙박스 테스팅(4.2): 명세 기반이다. 테스트 대상의 내부 구조와 관련 없는 문서에서 테스트를 도출한다. 주요 목적은 명세와 비교해 시스템의 동작을 확인하는 것이다.","화이트박스 테스팅(4.3): 구조 기반이다. 시스템의 구현이나 내부 구조(예: 코드, 아키텍처, 워크플로우, 데이터 플로우)에서 테스트를 도출한다. 주요 목적은 테스트로 내부 구조를 인수에 필요한 수준까지 충분히 커버하는 것이다.","네 가지 테스트 유형 모두 모든 테스트 레벨에 쓸 수 있지만, 레벨마다 관심의 대상은 다를 수 있다. 어느 유형이든 다양한 테스트 기법으로 테스트 컨디션과 테스트 케이스를 도출할 수 있다."],"traps":["기능 성숙도(완전성), 기능 정확성, 기능 타당성(적합성)은 기능 테스팅의 목적이다. ISO/IEC 25010 비기능 품질 특성 8가지에 들어 있지 않다.","한글 번역이 절마다 다르다. 2.2.2 목록은 수행 효율성·유용성·신뢰도·유지 가능성(유지 관리성)이지만, 2.1.4에는 성능 효율성·신뢰성, 2.2.1에는 사용성, 2.3에는 유지보수성으로 쓰였다. 영어 원어로 같은 특성인지 확인한다.","화이트박스 테스팅은 컴포넌트 레벨 전용이 아니고, 비기능 테스팅은 시스템 테스팅 전용이 아니다. 네 유형 모두 모든 레벨에 쓸 수 있다."]},{"id":"2.2.3","title":"확인 테스팅 및 리그레션 테스팅","points":["컴포넌트나 시스템을 바꾸는 이유는 보통 새 기능을 추가해 개선하거나, 결함을 제거해 수정하기 위해서다. 이때 확인 테스팅과 리그레션 테스팅이 필요하다.","확인 테스팅: 원래 결함이 성공적으로 수정됐는지 확인한다. 리스크에 따라 ① 그 결함 때문에 이전에 실패했던 모든 테스트 케이스를 실행하거나 ② 결함 수정을 위해 바꾼 사항을 확인하는 새 테스트를 추가한다.","결함 수정에 시간이나 비용이 부족하면, 확인 테스팅은 그 결함으로 생긴 장애를 재현하는 테스트 절차를 실행해 장애가 다시 발생하지 않는지만 확인하는 수준으로 제한될 수 있다.","리그레션 테스팅: 변경으로 부정적인 영향이 없었는지 확인한다. 이미 확인 테스팅이 끝난 수정 사항도 변경에 포함된다.","부정적인 영향은 변경된 컴포넌트 자체, 같은 시스템의 다른 컴포넌트, 연결된 다른 시스템에 미칠 수 있다. 리그레션 테스팅은 테스트 대상에만 국한되지 않고 환경과도 관련될 수 있다.","리그레션 테스팅 범위를 파악하려면 먼저 영향도 분석을 하는 것이 좋다. 영향도 분석은 소프트웨어의 어느 부분이 영향을 받을 수 있는지 보여 준다.","리그레션 테스트 스위트는 반복적으로 실행되고 반복 주기나 릴리스마다 케이스 수가 늘어나므로 자동화하기 매우 적합하다. 자동화는 프로젝트 초기에 시작해야 한다. 데브옵스처럼 지속적 통합을 쓰면 자동 리그레션 테스트를 포함하는 것이 좋은 프랙티스이며, 여러 테스트 레벨의 리그레션 테스트가 포함될 수 있다.","어떤 테스트 레벨이든 그 레벨에서 결함을 수정하거나 변경을 적용했다면 테스트 대상에 대한 확인 테스팅과 리그레션 테스팅이 필요하다. 영문은 'and/or'라서 상황에 따라 둘 중 하나 또는 둘 다를 뜻한다."],"traps":["확인 테스팅은 원래 결함이 성공적으로 수정됐는지, 리그레션 테스팅은 변경으로 부정적인 영향이 없었는지를 본다. 부정적인 영향은 변경한 컴포넌트 자체에도 생길 수 있다.","확인 테스팅을 통과한 수정 사항도 리그레션 테스팅에서 말하는 변경에 들어간다.","리그레션 테스팅이 필요한 변경에는 결함 수정뿐 아니라 새 기능 추가도 포함된다."]},{"id":"2.3","title":"유지보수 테스팅","points":["유지보수 범주: 문제 수정, 환경 변화에 적응, 성능 또는 유지보수성 개선(ISO/IEC 14764 참조). 그래서 유지보수는 계획된 릴리스/배포와 계획되지 않은 릴리스/배포(핫픽스) 모두와 연관된다.","변경하기 전에 영향도 분석을 해서, 시스템의 다른 영역에 미칠 잠재적 영향을 보고 변경 여부를 정하는 데 참고할 수 있다.","운영 중인 시스템의 변경을 테스트할 때는 변경이 성공적으로 구현됐는지 검증하는 것과, 변경되지 않은 영역(보통 시스템의 대부분)에서 생길 수 있는 리그레션을 확인하는 것을 모두 한다.","유지보수 테스팅의 범위는 보통 3가지에 따라 달라진다: 변경의 리스크 수준, 기존 시스템의 크기, 변경사항의 크기.","계기 ① 수정사항: 계획된 개선사항(즉, 릴리스 기반), 수정을 위한 변경, 핫픽스.","계기 ② 운영 환경의 업그레이드나 마이그레이션(예: 한 플랫폼에서 다른 플랫폼으로): 변경된 소프트웨어뿐 아니라 새 환경 관련 테스트가 필요할 수 있다. 다른 애플리케이션의 데이터를 유지보수 중인 시스템으로 옮길 때는 데이터 변환 테스트가 필요할 수 있다.","계기 ③ 단종(예: 애플리케이션의 수명이 다함): 데이터 보존 기간이 길면 데이터 보관(archiving) 테스팅이 필요할 수 있다. 보관 기간 중 데이터가 필요할 때를 대비해 보관 이후 복원 및 복구 절차 테스팅이 필요할 수 있다."],"traps":["데이터 변환 테스트는 마이그레이션 계기, 데이터 보관 테스팅과 보관 이후 복원·복구 절차 테스팅은 단종 계기에 붙는다.","유지보수 테스팅 범위는 변경 크기 하나로 정해지지 않는다. 리스크 수준과 기존 시스템 크기도 본다.","핫픽스처럼 계획되지 않은 배포도 유지보수에 포함된다."]}]},{"ch":3,"title":"정적 테스팅","titleEn":"Static Testing","minutes":80,"examCount":4,"keywords":[{"ko":"이상 사항","en":"anomaly","def":"실라버스에 별도 정의 문장은 없다. 리뷰나 테스트 실행 중에 식별해 기록·보고하는 대상이며(1.4.1, 3.2.2), SDLC 모든 단계에서 보고될 수 있다(5.5). 리뷰 중 확인한 이상 사항이 반드시 결함은 아니므로, 모든 이상 사항을 분석·논의해 상태, 담당자, 필요 조치를 판단한다(3.2.2). 보고된 이상 사항은 실제 결함일 수도, 거짓-양성 결과나 변경 요청일 수도 있다(5.5)."},{"ko":"동적 테스팅","en":"dynamic testing","def":"소프트웨어를 실행하는 테스팅이다(1.1). 장애를 일으킨 뒤 후속 분석으로 연관된 결함을 찾아내며, 실행 가능한 작업 산출물에만 적용할 수 있다(3.1.3)."},{"ko":"공식 리뷰","en":"formal review","def":"실라버스에 별도 정의 문장은 없다. 리뷰 유형은 비공식 리뷰부터 공식 리뷰까지 있고(3.2.4), 리뷰가 공식적일수록 리뷰 프로세스 각 활동에서 수행할 작업이 많아진다(3.2.2). 가장 공식적인 리뷰 유형은 인스펙션이다."},{"ko":"비공식 리뷰","en":"informal review","def":"정의된 프로세스를 따르지 않고 공식적인 결과 문서도 요구하지 않는 리뷰다. 주요 목적은 이상 사항 식별이다(3.2.4)."},{"ko":"인스펙션","en":"inspection","def":"가장 공식적인 리뷰 유형으로, 보편적 리뷰 프로세스를 철저히 따른다. 주요 목적은 이상 사항을 최대한 많이 찾는 것이고, 저자는 리뷰 리더나 서기가 될 수 없다(3.2.4)."},{"ko":"리뷰","en":"review","def":"작업 산출물을 사람이 직접(수동으로) 살펴보며 평가하는 정적 테스팅이다(3.1). 읽고 이해할 수 있는 작업 산출물이면 무엇이든 리뷰 대상이 될 수 있다(3.1.1)."},{"ko":"정적 분석","en":"static analysis","def":"도구를 사용해 작업 산출물을 실행하지 않고 평가하는 정적 테스팅이다(3.1). 검사 기준이 되는 구조(예: 모델, 공식 문법이 정해진 코드나 텍스트)가 필요하며(3.1.1), 맞춤법 검사기나 가독성 도구도 정적 분석 도구의 예다."},{"ko":"정적 테스팅","en":"static testing","def":"테스트 대상 소프트웨어를 실행하지 않고 하는 테스팅이다. 리뷰와 정적 분석을 포함한다(1.1, 3.1)."},{"ko":"기술 리뷰","en":"technical review","def":"기술적인 자격을 갖춘 리뷰어가 수행하고 중재자가 리더가 되는 리뷰다. 목적은 기술 문제에 대한 합의를 도출하고 결정을 내리는 것과 함께 이상 사항 식별 등이다(3.2.4)."},{"ko":"워크쓰루","en":"walkthrough","def":"저자가 리더가 되는 리뷰다. 리뷰어 교육, 합의 도출, 새로운 아이디어 창출 등 여러 목적을 가지며, 사전 개별 리뷰는 필수가 아니다(3.2.4)."}],"sections":[{"id":"3.1","title":"정적 테스팅의 기초","points":["동적 테스팅과 달리 정적 테스팅은 테스트 대상 소프트웨어를 실행하지 않아도 된다.","코드, 프로세스 명세, 시스템 아키텍처 명세, 기타 작업 산출물을 수동으로(예: 리뷰) 또는 도구를 사용해(예: 정적 분석) 평가한다.","테스팅 목표: 품질 개선, 결함 식별, 가독성·완전성·정확성·테스트 용이성·일관성 같은 특성 평가.","정적 테스팅은 베리피케이션(verification)과 밸리데이션(validation) 모두에 적용할 수 있다.","예제 매핑, 사용자 스토리 공동 작성, 백로그 개선 작업 때 테스터, 비즈니스 담당자(제품 소유자, 비즈니스 분석가 등), 개발자가 함께 사용자 스토리와 관련된 작업 산출물이 정의된 기준(예: ‘준비’의 정의(Definition of Ready))을 충족하는지 확인한다.","리뷰 기법을 적용해 사용자 스토리가 완전하고 이해하기 쉬우며 테스트 가능한 인수 조건을 가졌는지 확인할 수 있다. 테스터는 적절한 질문으로 사용자 스토리를 탐색하고, 문제를 제기하며, 개선을 돕는다.","정적 분석은 테스트 케이스가 필요 없고 보통 도구를 쓰기 때문에, 비교적 적은 노력으로 동적 테스팅 전에 문제를 식별할 수 있다. 지속적 통합(CI) 프레임워크에 통합하는 경우가 많다.","정적 분석은 주로 구체적인 코드 결함 식별에 쓰지만 유지보수성과 보안 평가에도 쓴다. 맞춤법 검사기나 가독성 도구도 정적 분석 도구의 예다."],"traps":["정적 테스팅은 베리피케이션에만 쓰는 것이 아니다. 베리피케이션과 밸리데이션 모두에 적용할 수 있다.","정적 분석에는 테스트 케이스가 필요 없다.","정적 테스팅은 리뷰(사람이 직접)와 정적 분석(도구 사용)을 모두 포함한다(1.1)."]},{"id":"3.1.1","title":"정적 테스팅으로 검사 가능한 작업 산출물","points":["거의 모든 작업 산출물을 정적 테스팅으로 검토할 수 있다.","예: 요구사항 명세서, 소스 코드, 테스트 계획서, 테스트 케이스, 제품 백로그 항목, 테스트 차터, 프로젝트 문서, 계약서, 모델.","리뷰: 읽고 이해할 수 있는 모든 작업 산출물이 리뷰 대상이 될 수 있다.","정적 분석: 검사 기준이 되는 구조가 필요하다(예: 모델, 공식 문법이 정해진 코드나 텍스트).","정적 테스팅에 적합하지 않은 것: 사람이 해석하기 어렵고, 도구로 분석해서는 안 되는 작업 산출물(예: 법적으로 문제가 되는 타사의 실행 코드)."],"traps":["‘읽고 이해할 수 있으면 대상’은 리뷰의 기준이고, ‘구조가 필요’는 정적 분석의 기준이다. 둘을 바꿔 쓴 보기에 주의한다.","테스트 계획서, 테스트 케이스, 테스트 차터 같은 테스트 작업 산출물도 정적 테스팅 대상이다."]},{"id":"3.1.2","title":"정적 테스팅의 가치","points":["SDLC 초기 단계에서 결함을 식별하므로 조기 테스팅 원리(1.3)를 지킬 수 있게 한다.","동적 테스팅으로 식별할 수 없는 결함도 찾을 수 있다(예: 도달 불가능한 코드, 원하는 대로 구현되지 않은 설계 패턴, 비-실행 작업 산출물의 결함).","작업 산출물의 품질을 평가하고 신뢰를 쌓을 방법을 제공한다.","문서화된 요구사항을 확인하면서, 이해관계자는 요구사항이 실제로 자기가 필요한 것을 묘사하는지 확인할 수 있다.","SDLC 초기에 할 수 있으므로 관련 이해관계자 간 공통된 이해를 형성하고 의사소통도 개선된다. 그래서 정적 테스팅에 다양한 이해관계자가 참여하는 것이 권장된다.","리뷰를 구축하는 비용은 클 수 있다. 그래도 프로젝트 후반에 결함을 수정하는 시간과 노력이 줄어, 리뷰를 하지 않을 때보다 전체 프로젝트 비용이 훨씬 낮아지는 경우가 많다.","일부 코드 결함은 동적 테스팅보다 정적 분석으로 더 효율적으로 식별할 수 있다. 그 결과 보통(usually) 코드 결함이 줄고 전반적인 개발 노력도 감소한다."],"traps":["‘리뷰는 비용이 들지 않는다’는 뜻이 아니다. 구축 비용은 클 수 있지만 전체 프로젝트 비용은 낮아지는 경우가 많다는 뜻이다.","정적 분석이 ‘모든’ 코드 결함을 더 효율적으로 찾는다는 말이 아니다. ‘일부’ 코드 결함이다."]},{"id":"3.1.3","title":"정적 테스팅과 동적 테스팅의 차이","points":["정적 테스팅과 동적 테스팅은 서로를 보완한다. 작업 산출물 결함의 식별을 지원하는 등 목적은 비슷하다(1.1.1).","차이 ①: 둘 다 결함을 식별한다(동적 테스팅은 장애 분석을 통해). 하지만 정적 테스팅이나 동적 테스팅 중 한 가지로만 식별할 수 있는 결함 유형도 있다.","차이 ②: 정적 테스팅은 결함을 직접 식별한다. 동적 테스팅은 장애를 일으킨 후 연관된 결함을 후속 분석으로 찾아낸다.","차이 ③: 정적 테스팅은 거의 실행되지 않거나 동적 테스팅으로 도달하기 어려운 코드 경로에 있는 결함을 더 쉽게 발견할 수 있다.","차이 ④: 정적 테스팅은 비-실행 작업 산출물에도 적용할 수 있다. 동적 테스팅은 실행 가능한 작업 산출물에만 적용할 수 있다.","차이 ⑤: 정적 테스팅은 코드 실행에 의존하지 않는 품질 특성(예: 유지보수성)을, 동적 테스팅은 코드 실행에 의존적인 품질 특성(예: 성능 효율성)을 측정하는 데 쓸 수 있다.","정적 테스팅으로 더 쉽게, 적은 비용으로 식별할 수 있는 대표 결함 ①: 요구사항 결함(예: 불일치, 모호성, 모순, 누락, 부정확성, 중복)","대표 결함 ②: 설계 결함(예: 비효율적인 데이터베이스 구조, 모듈화 불량)","대표 결함 ③: 특정 유형의 코딩 결함(예: 정의되지 않은 값을 가진 변수, 선언되지 않은 변수, 도달할 수 없거나 중복된 코드, 과도한 코드 복잡성)","대표 결함 ④: 표준 위반(예: 코딩 표준 명명 규칙을 준수하지 않는 경우)","대표 결함 ⑤: 잘못된 인터페이스 명세(예: 매개변수의 개수, 유형, 순서 불일치)","대표 결함 ⑥: 특정 유형의 보안 취약성(예: 버퍼 오버플로우)","대표 결함 ⑦: 테스트 베이시스 커버리지의 차이 또는 부정확성(예: 인수 조건 하나에 대한 테스트 누락)"],"traps":["결함을 ‘직접’ 찾는 것은 정적 테스팅, ‘장애를 일으킨 뒤 분석’해서 찾는 것은 동적 테스팅이다. 거꾸로 바꾼 보기가 자주 나온다.","유지보수성은 정적 테스팅(실행 불필요), 성능 효율성은 동적 테스팅(실행 필요)으로 측정하는 예다.","비-실행 작업 산출물에 ‘도’ 적용할 수 있는 것은 정적 테스팅이다. 정적 테스팅은 소스 코드에도 적용한다.","정적 테스팅이 동적 테스팅을 대체하지 않는다. 서로 보완한다."]},{"id":"3.2","title":"피드백과 리뷰 프로세스","points":["3.2절은 이해관계자 피드백의 이점(3.2.1), 리뷰 프로세스 활동(3.2.2), 리뷰에서의 역할과 책임(3.2.3), 리뷰 유형(3.2.4), 리뷰의 성공 요소(3.2.5)로 구성된다.","학습 목표 수준: 3.2.1 피드백 이점, 3.2.3 역할별 책임, 3.2.5 성공 요소는 K1(기억). 3.2.2 리뷰 프로세스 활동, 3.2.4 리뷰 유형 비교는 K2(이해).","3장 시험은 4문제다(K1 2문제, K2 2문제). K1 2문제는 3.1.1·3.2.1·3.2.3·3.2.5 묶음에서, K2는 3.1.2·3.1.3 묶음과 3.2.2·3.2.4 묶음에서 각 1문제가 나온다."],"traps":[]},{"id":"3.2.1","title":"이해관계자 피드백을 조기에 자주 받을 때의 이점","points":["피드백을 조기에 자주 받으면 잠재적인 품질 문제를 조기에 파악할 수 있다.","SDLC 동안 이해관계자의 참여가 적으면, 개발 중인 제품이 이해관계자의 초기 및 현재 요구를 충족하지 못할 수 있다.","이해관계자가 원하는 것을 전달하지 못하면 큰 비용이 드는 재작업, 납기일 지연, 서로 간의 비난 등이 생길 수 있고, 심하면 프로젝트가 완전히 실패할 수도 있다.","SDLC 전반에 걸쳐 피드백을 자주 받으면 요구사항에 대한 오해를 방지하고, 요구사항 변경을 조기에 이해하고 구현할 수 있다.","그 결과 개발팀은 구현 중인 제품에 대한 이해도를 높일 수 있다.","개발팀은 이해관계자에게 가장 중요하고, 식별한 리스크에 가장 긍정적인 영향을 미치는 기능에 집중할 수 있다."],"traps":["피드백은 요구사항 변경을 ‘막는’ 것이 아니다. 변경을 ‘조기에 이해하고 구현’하게 한다."]},{"id":"3.2.2","title":"리뷰 프로세스 활동","points":["ISO/IEC 20246 표준은 보편적인 리뷰 프로세스를 정의한다. 체계적이면서 유연한 프레임워크라서 특정 상황에 맞게 리뷰 프로세스를 조정할 수 있다.","필요한 리뷰가 공식적일수록 각 활동에 대해 설명된 작업 중 수행할 것이 더 많아진다.","작업 산출물이 너무 커서 한 번의 리뷰로 다룰 수 없으면, 리뷰 프로세스를 여러 번 수행해 전체 작업 산출물의 리뷰를 끝낼 수 있다.","① 계획(planning): 리뷰의 범위를 정의한다. 범위는 목적, 리뷰 대상 작업 산출물, 평가할 품질 특성, 집중할 영역, 완료 조건, 적용 표준과 같은 추가 정보, 공수, 리뷰 일정으로 구성된다.","② 리뷰 착수(review initiation): 관련된 모든 사람과 사항이 리뷰를 시작할 준비가 되었는지 확인한다. 모든 참여자가 리뷰 대상 작업 산출물에 접근할 수 있는지, 자기 역할과 책임을 이해하는지, 리뷰에 필요한 것들을 받았는지 확인한다.","③ 개별 리뷰(individual review): 모든 리뷰어가 하나 이상의 리뷰 기법(예: 체크리스트 기반 리뷰, 시나리오 기반 리뷰)을 적용해 작업 산출물의 품질을 평가하고 이상 사항, 권장 사항, 의문 사항을 식별한다. 식별한 것은 모두 기록한다. 리뷰 기법의 심층 내용은 ISO/IEC 20246 표준에 있다.","④ 논의 및 분석(communication and analysis): 이상 사항이 반드시 결함은 아니므로 모두 분석하고 논의한다. 각 이상 사항의 상태, 담당자, 필요 조치를 판단한다. 보통 리뷰 회의에서 하며, 작업 산출물의 품질 수준과 필요한 후속 조치도 결정한다. 조치를 완료하기 위해 후속 리뷰가 필요할 수 있다.","⑤ 수정 및 보고(fixing and reporting): 모든 결함에 대해 결함 보고서를 작성해 후속 조치를 추적할 수 있게 한다. 완료 조건을 충족하면 작업 산출물을 승인할 수 있다. 리뷰 결과를 보고한다."],"traps":["리뷰 범위(목적, 완료 조건 등)를 ‘정의’하는 것은 계획, 참여자가 시작할 ‘준비가 됐는지 확인’하는 것은 리뷰 착수다.","이상 사항을 ‘식별하고 기록’하는 것은 개별 리뷰, 이상 사항의 상태·담당자·필요 조치를 ‘판단’하는 것은 논의 및 분석이다.","결함 보고서 작성과 작업 산출물 승인은 수정 및 보고 활동이다.","리뷰가 공식적일수록 수행할 작업이 ‘많아진다’. 거꾸로 쓴 보기에 주의한다."]},{"id":"3.2.3","title":"리뷰에서의 역할과 책임","points":["리뷰에는 다양한 이해관계자가 참여하며, 한 명이 여러 역할을 동시에 맡을 수도 있다.","관리자(manager): 리뷰할 내용을 결정하고, 리뷰에 필요한 사람과 시간 등 자원을 제공한다.","저자(author): 리뷰 대상 작업 산출물을 작성하고 수정한다.","중재자(moderator, 퍼실리테이터라고도 함): 중재, 시간 관리, 모든 사람이 자유롭게 발언할 수 있는 안전한 리뷰 환경 조성 등 리뷰 회의의 효과적인 운영을 담당한다.","서기(scribe, 기록자라고도 함): 리뷰어로부터 이상 사항을 수집하고, 결정 사항이나 리뷰 회의 중에 발견한 새로운 이상 사항 등 리뷰 정보를 기록한다.","리뷰어(reviewer, 검토자): 리뷰를 수행한다. 프로젝트에 참여하는 사람, 주제 전문가, 기타 이해관계자가 리뷰어가 될 수 있다.","리뷰 리더(review leader): 리뷰에 참여할 사람을 결정하고 리뷰 시간과 장소를 협의하는 등 리뷰에 대한 전반적인 책임을 진다.","이 밖의 더 세부적인 역할은 ISO/IEC 20246 표준에서 설명한다."],"traps":["관리자는 ‘무엇을’ 리뷰할지 결정하고 자원(사람, 시간)을 제공한다. 리뷰 리더는 ‘누가’ 참여할지 결정하고 시간·장소를 협의하며 전반적인 책임을 진다.","리뷰 회의 운영(중재, 시간 관리, 안전한 환경 조성)은 중재자의 책임이다. 리뷰 리더와 헷갈리지 않는다.","서기는 이상 사항을 수집하고 기록하는 역할이다. 리뷰를 수행하는 역할은 리뷰어다."]},{"id":"3.2.4","title":"리뷰 유형","points":["리뷰 유형은 비공식 리뷰부터 공식 리뷰까지 다양하다.","공식성 수준을 좌우하는 요소: 사용 중인 SDLC, 개발 프로세스의 성숙도, 리뷰 대상 작업 산출물의 중요도와 복잡성, 법적 또는 규제 요구사항, 감사용 기록의 필요성 등.","같은 작업 산출물도 여러 형태로 리뷰할 수 있다(예: 처음에는 비공식적으로, 나중에는 보다 공식적으로).","리뷰 목적을 달성하려면 적절한 리뷰 유형을 선택하는 것이 중요하다(3.2.5). 목적 외에도 프로젝트 요구사항, 가용 자원, 작업 산출물 유형과 리스크, 비즈니스 영역, 사내 문화와 같은 요소도 선택에 반영된다.","비공식 리뷰(informal review): 정의된 프로세스를 따르지 않으며, 공식적인 결과 문서도 요구하지 않는다. 주요 목적은 이상 사항 식별이다.","워크쓰루(walkthrough): 저자가 리더가 된다. 목적은 품질 평가 및 작업 산출물에 대한 신뢰 구축, 리뷰어 교육, 합의 도출, 새로운 아이디어 창출, 저자가 개선할 수 있도록 동기 부여 및 지원, 이상 사항 발견 등이다. 리뷰어는 워크쓰루 전에 개별 리뷰를 할 수도 있지만 반드시 해야 하는 것은 아니다.","기술 리뷰(technical review): 기술적인 자격을 갖춘 리뷰어가 수행하고 중재자가 리더가 된다. 목적은 기술 문제에 대한 합의 도출과 결정, 그리고 이상 사항 식별, 품질 평가 및 작업 산출물에 대한 신뢰 구축, 새로운 아이디어 창출, 저자가 개선할 수 있도록 동기 부여 및 지원이다.","인스펙션(inspection): 가장 공식적인 리뷰 유형이라 보편적 프로세스(3.2.2)를 철저히 따른다. 주요 목적은 이상 사항을 최대한 많이 찾는 것이고, 기타 목적은 품질 평가, 작업 산출물에 대한 신뢰 구축, 저자가 개선할 수 있도록 동기 부여 및 지원이다. 메트릭을 수집해 리뷰 프로세스를 포함한 전체 SDLC 개선에 사용한다. 저자는 리뷰 리더나 서기가 될 수 없다."],"traps":["리더: 워크쓰루는 저자, 기술 리뷰는 중재자. 인스펙션에서는 저자가 리뷰 리더와 서기를 맡을 수 없다.","주요 목적: 비공식 리뷰는 이상 사항 식별, 인스펙션은 이상 사항을 ‘최대한 많이’ 찾기. 기술 리뷰의 목적에는 기술 문제에 대한 합의 도출과 결정이 들어간다.","워크쓰루 전 개별 리뷰는 할 수도 있지만 필수가 아니다.","메트릭 수집과 보편적 프로세스를 ‘철저히’ 따르는 것은 인스펙션의 특징이다."]},{"id":"3.2.5","title":"리뷰의 성공 요소","points":["명확한 목표와 측정 가능한 완료 조건을 정의한다. 참가자의 평가가 목적이 되어서는 절대 안 된다.","주어진 목표를 달성할 수 있으면서 작업 산출물 유형, 리뷰 참여자, 프로젝트 요구사항 및 정황에 맞는 리뷰 유형을 선택한다.","리뷰어가 개별 리뷰 또는 리뷰 회의(개최 시)에서 집중력을 잃지 않도록 작은 단위로 리뷰를 진행한다.","이해관계자와 저자에게 리뷰 피드백을 제공해 제품 및 활동을 개선할 수 있게 한다(3.2.1).","참가자가 리뷰를 준비할 수 있는 충분한 시간을 제공한다.","리뷰 프로세스를 관리층이 지원한다.","학습 및 프로세스 개선 촉진을 위해 리뷰가 조직 문화의 일부가 되도록 한다.","모든 참가자가 자신의 역할을 어떻게 충족해야 하는지 알 수 있도록 적절한 교육을 제공한다.","회의에 퍼실리테이션(facilitation)을 적용한다."],"traps":["참가자 평가는 리뷰 목표가 되어서는 절대 안 된다. 그러니 ‘참가자 평가를 리뷰 목표로 삼는다’는 성공 요소가 아니다.","리뷰는 큰 덩어리가 아니라 작은 단위로 진행한다.","리뷰 피드백은 저자뿐 아니라 이해관계자에게도 제공한다."]}]},{"ch":4,"title":"테스트 분석과 설계","titleEn":"Test Analysis and Design","minutes":390,"examCount":11,"keywords":[{"ko":"인수 조건","en":"acceptance criteria","def":"사용자 스토리 구현 결과를 이해관계자가 승인하려면 충족해야 하는 조건이다. 테스트로 확인해야 할 테스트 컨디션으로 볼 수 있다(4.5.2)."},{"ko":"인수 테스트 주도 개발","en":"acceptance test-driven development","def":"사용자 스토리를 구현하기 전에, 고객·개발자·테스터처럼 관점이 다른 팀원들이 인수 조건을 바탕으로 테스트 케이스를 먼저 만드는 테스트 우선 접근법(ATDD)이다(4.5.3)."},{"ko":"블랙박스 테스트 기법","en":"black-box test technique","def":"내부 구조를 보지 않고 테스트 대상의 명시된 동작을 분석해 테스트를 만드는 기법이다. 명세 기반 기법이라고도 한다(4.1)."},{"ko":"경계값 분석","en":"boundary value analysis","def":"동등 분할의 경계(분할의 최솟값·최댓값)를 실행하는 블랙박스 기법(BVA)이다. 정렬된 분할에만 쓸 수 있고, 두 개 선택·세 개 선택 방식이 있다(4.2.2)."},{"ko":"분기 커버리지","en":"branch coverage","def":"테스트 케이스가 실행한 분기 수를 분기 총수로 나눈 백분율이다. 분기는 제어 흐름 그래프에서 두 노드 간 제어의 이동이다(4.3.2)."},{"ko":"체크리스트 기반 테스팅","en":"checklist-based testing","def":"체크리스트에 있는 테스트 컨디션을 확인하는 테스트를 설계·구현·실행하는 경험 기반 기법이다(4.4.3)."},{"ko":"협업 기반 테스트 접근법","en":"collaboration-based test approach","def":"협업과 커뮤니케이션으로 결함 예방에도 초점을 두는 접근법이다. 협업 기반 사용자 스토리 작성, 인수 조건, ATDD가 여기에 속한다(4.5)."},{"ko":"커버리지","en":"coverage","def":"커버리지 항목 가운데 테스트로 실행한 정도를 백분율로 나타낸 것이다. 4.2·4.3 기법은 대부분 '실행한 커버리지 항목 수 ÷ 전체 커버리지 항목 수'로 잰다. 단, 모든 전이 커버리지는 비유효 전이의 '실행 시도'도 센다(4.2.4)."},{"ko":"커버리지 항목","en":"coverage item","def":"커버리지를 잴 때 하나씩 세는 대상이다. 기법마다 다르다. 예: 동등 분할은 분할, 결정 테이블 테스팅은 실현 가능한 열, 구문 테스팅은 실행 가능한 구문, 분기 테스팅은 분기(4.2, 4.3)."},{"ko":"결정 테이블 테스팅","en":"decision table testing","def":"조건 조합에 따라 결과가 달라지는 요구사항을 결정 테이블로 정리하고, 실현 가능한 조건 조합 열을 테스트하는 블랙박스 기법이다(4.2.3)."},{"ko":"동등 분할","en":"equivalence partitioning","def":"테스트 대상이 같은 방식으로 처리할 것으로 기대되는 값끼리 분할로 묶고, 분할마다 하나씩 테스트하는 블랙박스 기법(EP)이다(4.2.1)."},{"ko":"오류 추정","en":"error guessing","def":"테스터의 지식(과거 동작, 개발자가 범하기 쉬운 오류, 유사 애플리케이션의 장애)을 바탕으로 오류·결함·장애의 발생을 예측하는 경험 기반 기법이다(4.4.1)."},{"ko":"경험 기반 테스트 기법","en":"experience-based test technique","def":"테스터의 지식과 경험을 테스트 케이스 설계·구현에 활용하는 기법이다. 효과가 테스터 능력에 크게 좌우되며, 블랙박스·화이트박스 기법을 보완한다(4.1)."},{"ko":"탐색적 테스팅","en":"exploratory testing","def":"테스터가 테스트 대상을 배워가면서 테스트의 설계, 실행, 평가를 동시에 하는 경험 기반 기법이다(4.4.2)."},{"ko":"상태 전이 테스팅","en":"state transition testing","def":"상태 다이어그램이나 상태 테이블로 시스템의 상태와 전이를 모델링하고, 상태나 전이를 커버리지 항목으로 삼아 테스트하는 블랙박스 기법이다(4.2.4)."},{"ko":"구문 커버리지","en":"statement coverage","def":"테스트 케이스가 실행한 구문 수를 코드의 실행 가능한 구문 총수로 나눈 백분율이다(4.3.1)."},{"ko":"테스트 기법","en":"test technique","def":"테스트 분석(무엇을 테스트할지)과 테스트 설계(어떻게 테스트할지)를 돕는 방법이다. 적은 수이지만 충분한 테스트 케이스를 체계적으로 만들게 해 주며, 블랙박스·화이트박스·경험 기반으로 나뉜다(4.1)."},{"ko":"화이트박스 테스트 기법","en":"white-box test technique","def":"테스트 대상의 내부 구조와 처리를 분석해 테스트를 만드는 기법이다. 구조 기반 기법이라고도 하며, 설계나 구현이 끝난 후에 테스트 케이스를 만들 수 있다(4.1)."}],"sections":[{"id":"4.1","title":"테스트 기법 개요","points":["테스트 기법은 테스트 분석(무엇을 테스트할지)과 테스트 설계(어떻게 테스트할지)를 돕는다.","테스트 기법을 쓰면 적은 수이지만 충분한 테스트 케이스를 체계적으로 만들 수 있다. 테스트 컨디션 정의, 커버리지 항목과 테스트 데이터 식별에도 도움이 된다.","실라버스는 테스트 기법을 세 가지로 나눈다: 블랙박스, 화이트박스, 경험 기반.","블랙박스 테스트 기법(명세 기반 기법): 내부 구조를 보지 않고 테스트 대상의 명시된 동작을 분석한다. 테스트 케이스가 구현 방식에 의존하지 않으므로, 구현이 바뀌어도 필요한 동작이 같으면 테스트 케이스는 여전히 유효하다.","화이트박스 테스트 기법(구조 기반 기법): 테스트 대상의 내부 구조와 처리를 분석한다. 테스트 케이스가 설계 방식에 의존하므로 설계나 구현이 끝난 후에 만들 수 있다.","경험 기반 테스트 기법: 테스터의 지식과 경험을 활용한다. 효과성은 테스터의 능력에 따라 크게 달라진다. 블랙박스·화이트박스 기법으로 놓칠 수 있는 결함을 찾을 수 있어서 두 기법을 보완한다.","비유: 블랙박스는 자판기를 열지 않고 '이 버튼을 누르면 이 음료가 나와야 한다'만 보고 시험하는 것, 화이트박스는 자판기 안 배선도를 펴 놓고 시험하는 것이다. 여기까지만 맞는 비유다."],"traps":["명세 기반 기법 = 블랙박스, 구조 기반 기법 = 화이트박스다. 다른 이름으로 출제돼도 같은 뜻이다.","경험 기반 기법은 블랙박스·화이트박스 기법을 '보완'한다. '대체'한다는 보기는 틀린다.","구현이 바뀌어도 필요한 동작이 같다면 여전히 유효한 쪽은 블랙박스 테스트 케이스다. 화이트박스 테스트 케이스는 설계 방식에 의존한다.","경험 기반 기법의 효과성은 테스터 능력에 '크게' 좌우된다. 능력과 무관하다는 보기는 틀린다."]},{"id":"4.2","title":"블랙박스 테스트 기법","points":["많이 쓰는 블랙박스 기법 네 가지: 동등 분할, 경계값 분석, 결정 테이블 테스팅, 상태 전이 테스팅.","네 기법 모두 커버리지 항목이 정해져 있고, 커버리지는 대부분 '실행한 커버리지 항목 수 ÷ 전체 커버리지 항목 수'를 백분율로 나타낸다. 단, 모든 전이 커버리지는 비유효 전이의 '실행 시도'도 센다(4.2.4).","커버리지 항목 정리: 동등 분할 = 분할, 경계값 분석 = 경계값(세 개 선택은 경계값과 이웃 값), 결정 테이블 = 실현 가능한 조건 조합 열, 상태 전이 = 상태 또는 전이(기준에 따라 다름).","시험에서는 4.2.1~4.2.4와 4.5.3(ATDD)을 묶어 K3(적용) 문제 5개가 나온다. 4장 전체 11문제 중 5문제다."],"traps":[]},{"id":"4.2.1","title":"동등 분할","points":["동등 분할(EP)은 테스트 대상이 한 분할 안의 모든 값을 같은 방식으로 처리할 것이라는 가정으로 데이터를 분할로 나눈다. 한 값으로 결함을 찾을 수 있다면 같은 분할의 다른 값으로도 찾을 수 있어야 한다는 것이 근거다. 그래서 분할마다 테스트 하나면 충분하다.","입력, 출력, 형상 항목, 내부 값, 시간 관련 값, 인터페이스 매개변수 등 테스트 대상과 관련된 모든 데이터 요소에 분할을 만들 수 있다.","분할은 연속적이거나 아닐 수 있고, 정렬돼 있거나 아닐 수 있고, 유한하거나 무한할 수 있다. 단, 분할끼리 겹치면 안 되고 빈 집합이면 안 된다. 단순한 테스트 항목은 분할이 쉬울 수 있지만, 실제로는 테스트 대상이 여러 값을 어떻게 처리하는지 이해하기 어려울 때가 많다. 그래서 분할 식별은 신중하게 해야 한다.","유효 분할 = 유효한 값의 분할, 비유효 분할 = 유효하지 않은 값의 분할. 무엇을 유효로 볼지는 팀·조직마다 다를 수 있다(예: 유효 = 처리해야 하는 값 또는 명세에 처리가 정의된 값, 비유효 = 무시·거부해야 하는 값 또는 명세에 처리 방법이 없는 값).","커버리지 항목 = 분할. 100% 커버리지를 달성하려면 비유효 분할을 포함한 모든 분할을 최소 한 번씩 실행해야 한다. 커버리지 = 하나 이상의 테스트 케이스로 실행한 분할 수 ÷ 식별한 총 분할 수.","분할 집합이 여러 개(예: 입력 변수가 2개 이상)일 때 가장 간단한 기준은 이치 초이스 커버리지(Each Choice coverage)다. 모든 분할 집합의 각 분할을 최소 한 번 실행하면 되고, 분할의 조합은 고려하지 않는다.","예제 1: 정수 '주문 수량'은 1~99가 유효. 분할은 0 이하(비유효), 1~99(유효), 100 이상(비유효)의 3개다. 100% 커버리지에는 테스트 케이스 3개(예: -5, 50, 150)가 필요하다. 50과 150만 실행하면 커버리지는 2 ÷ 3 ≈ 66.7%.","예제 2(이치 초이스): 결제수단 {카드, 계좌이체, 포인트}, 회원 {일반, VIP}. TC1(카드, 일반), TC2(계좌이체, VIP), TC3(포인트, 일반)이면 다섯 분할이 모두 한 번 이상 나오므로 이치 초이스 100%다. 결제수단 분할이 3개라서 테스트 케이스를 3개보다 줄일 수는 없다."],"traps":["비유효 분할도 커버리지 항목이다. 유효 분할만 세면 틀린다.","같은 분할의 값을 여러 개 테스트해도 실행한 분할 수는 늘지 않으므로 커버리지는 오르지 않는다.","이치 초이스 커버리지는 분할의 '조합'을 고려하지 않는다. 모든 조합을 테스트하라는 기준이 아니다.","분할은 겹치거나 비어 있으면 안 된다. 하지만 불연속, 정렬되지 않음, 무한은 모두 허용된다."]},{"id":"4.2.2","title":"경계값 분석","points":["경계값 분석(BVA)은 동등 분할의 경계를 실행하는 기법이라서 정렬된 분할에만 쓸 수 있다. 분할의 최솟값과 최댓값이 경계값이다. 두 값이 같은 분할에 속하면 그 사이의 모든 값도 그 분할에 속해야 한다.","개발자가 경계값에서 오류를 범하기 쉬워서 경계에 집중한다. 많이 찾는 결함은 구현된 경계가 의도보다 위나 아래에 잘못 놓였거나 아예 누락된 결함이다.","두 개 선택(2-value) BVA: 경계값마다 커버리지 항목 2개 = 그 경계값 + 인접 분할에 속한 가장 가까운 값. 커버리지 = 실행한 경계값 수 ÷ 식별한 경계값 총수.","세 개 선택(3-value) BVA: 경계값마다 커버리지 항목 3개 = 그 경계값 + 양쪽 이웃 값. 그래서 경계값이 아닌 커버리지 항목도 생길 수 있다. 커버리지 = 실행한 경계값과 이웃 값의 수 ÷ 식별한 경계값과 이웃 값의 총수.","세 개 선택은 두 개 선택이 놓친 결함을 찾을 수 있어 더 엄격하다. 실라버스 예: 'x ≤ 10'이 'x = 10'으로 잘못 구현되면 두 개 선택의 x = 10, x = 11로는 찾지 못하지만, 세 개 선택에서 나오는 x = 9로는 찾을 가능성이 크다.","예제(정수, 음수도 입력 가능, 1~99 유효): 분할은 0 이하 / 1~99 / 100 이상. 경계값은 각 분할의 최솟값·최댓값인 0, 1, 99, 100이다(0 이하 분할과 100 이상 분할은 한쪽 끝만 있다).","두 개 선택: 0→{0, 1}, 1→{1, 0}, 99→{99, 100}, 100→{100, 99}. 겹치는 값을 합치면 {0, 1, 99, 100}의 4개다.","세 개 선택: 0→{-1, 0, 1}, 1→{0, 1, 2}, 99→{98, 99, 100}, 100→{99, 100, 101}. 겹치는 값을 합치면 {-1, 0, 1, 2, 98, 99, 100, 101}의 8개다."],"traps":["BVA는 정렬된 분할에만 쓸 수 있다. 동등 분할은 정렬되지 않은 분할에도 쓸 수 있다.","두 개 선택의 이웃은 '인접 분할에 속한 가장 가까운 값' 하나다. 세 개 선택은 양쪽 이웃 두 개라서, 같은 분할 안쪽 값(예: 경계값 1의 이웃 2)도 커버리지 항목이 된다.","커버리지 분모가 다르다. 두 개 선택은 '경계값 총수', 세 개 선택은 '경계값과 이웃 값의 총수'다.","더 엄격한 쪽은 세 개 선택이다. 반대로 낸 보기에 주의한다.","경계값은 유효 분할에만 있는 게 아니다. 비유효 분할의 최솟값·최댓값(예제의 0, 100)도 경계값이다."]},{"id":"4.2.3","title":"결정 테이블 테스팅","points":["결정 테이블은 조건 조합에 따라 결과가 달라지는 요구사항의 구현을 테스트하는 데 쓴다. 비즈니스 규칙 같은 복잡한 논리를 기록하는 효과적인 방법이다.","행 = 조건과 그에 따른 시스템 동작. 열 = 결정 규칙 하나(고유한 조건 조합 + 연관 동작).","제한-입력(limited-entry) 결정 테이블: 조건과 동작 값을 모두 부울값(참/거짓)으로 표시한다(관련 없거나 실행 불가능한 값 제외). 확장-입력(extended-entry) 결정 테이블: 일부 또는 전부가 숫자 범위, 동등 분할, 불연속 값 같은 복수의 값을 가질
