팅을 수행할 수 있다. 증분을 자주 전달하려면 빠른 피드백과 광범위한 리그레션 테스팅이 필요하다.","why":["실행 가능한 코드가 후반에 생기는 것은 순차적 개발 모델의 설명이다.","반복 주기마다 정적 테스팅과 동적 테스팅을 모두 수행할 수 있다.","2.1.1: 반복 주기마다 모든 테스트 레벨에서 정적 테스팅과 동적 테스팅을 수행할 수 있고, 증분을 자주 전달하려면 빠른 피드백과 광범위한 리그레션 테스팅이 필요하다.","2.1.1은 증분을 자주 전달하려면 빠른 피드백과 광범위한 리그레션 테스팅이 필요하다고 한다."],"ref":"2.1.1"},{"id":"c2-029","ch":2,"lo":"FL-2.1.1","k":2,"q":"애자일 소프트웨어 개발 프로젝트에서 테스팅이 일반적으로 어떻게 조정되는지에 대해 실라버스 2.1.1과 일치하는 것은?","opts":["요구사항 변경이 드물다고 가정하므로 상세한 테스트 문서를 프로젝트 초기에 미리 작성해 두는 것을 선호한다.","수동 테스팅은 사전 테스트 분석과 설계가 많이 필요 없는 경험 기반 테스트 기법을 쓰는 경향이 있다.","변경이 잦아 테스트가 자주 바뀌므로 리그레션 테스팅은 자동화보다 수동 실행을 선호한다.","수동 테스팅은 상세한 사전 테스트 분석과 설계를 모두 문서로 마친 뒤에 진행하는 경향이 있다."],"ans":[1],"exp":"2.1.1: 애자일 소프트웨어 개발은 프로젝트의 어느 시점에도 변화가 생길 수 있다고 가정한다. 그래서 가벼운 작업 산출물과, 리그레션 테스팅을 수월하게 하는 테스트 자동화를 선호한다. 수동 테스팅도 사전 테스트 분석과 설계가 많이 필요하지 않은 경험 기반 테스트 기법(4.4)으로 진행하는 경향이 있다.","why":["애자일은 어느 시점에도 변화가 생길 수 있다고 가정하고, 가벼운 작업 산출물을 선호한다.","2.1.1의 애자일 설명(수동 테스팅은 사전 테스트 분석과 설계가 많이 필요하지 않은 경험 기반 테스트 기법으로 진행하는 경향)과 일치한다.","애자일 프로젝트는 변화를 전제로 하기 때문에 리그레션 테스팅을 수월하게 하는 테스트 자동화를 선호한다.","2.1.1은 애자일의 수동 테스팅이 사전 테스트 분석과 설계가 많이 필요하지 않은 경험 기반 테스트 기법으로 진행되는 경향이 있다고 한다."],"ref":"2.1.1"},{"id":"c2-030","ch":2,"lo":"FL-2.1.1","k":2,"q":"같은 회사의 두 프로젝트를 비교했다.\n프로젝트 X(순차적 개발 모델): 테스트 케이스와 테스트 절차를 정해진 양식에 따라 자세히 문서화하고 승인을 받는다.\n프로젝트 Y(애자일 개발): 같은 종류의 정보를 팀 위키에 핵심만 짧게 기록한다.\n실라버스 2.1.1에서 SDLC 모델의 선택이 영향을 미친다고 한 항목 중, 이 차이에 해당하는 것은?","opts":["테스트 자동화 범위","테스터의 역할과 책임","테스트 활동 범위 및 시기","테스트 문서 상세화 수준"],"ans":[3],"exp":"2.1.1: SDLC 모델의 선택은 테스트 활동 범위 및 시기, 테스트 문서 상세화 수준, 테스트 기법 및 테스트 접근법 선택, 테스트 자동화 범위, 테스터의 역할과 책임에 영향을 미친다. 두 프로젝트는 같은 정보를 얼마나 자세히 문서로 남기는지가 다르다.","why":["시나리오에는 자동화 범위의 차이가 나오지 않는다.","시나리오에는 테스터가 맡는 역할의 차이가 나오지 않는다.","시나리오에는 테스트 레벨, 테스트 유형, 테스트 시기의 차이가 나오지 않는다.","문서를 얼마나 자세히 쓰는지의 차이이므로 테스트 문서 상세화 수준에 해당한다."],"ref":"2.1.1"},{"id":"c2-031","ch":2,"lo":"FL-2.1.6","k":2,"q":"실라버스 2.1.6은 테스팅 관점에서 회고(retrospective)의 일반적인 이점마다 예를 함께 들고 있다.\n이점과 그 예를 바르게 연결한 것은?","opts":["테스트웨어 품질 향상 — 문제를 제기하고 개선점을 제안할 기회를 제공함으로써","팀의 결속 및 학습 향상 — 정기적으로 협업 과정을 검토하고 최적화함으로써","테스트 베이시스 품질 개선 — 요구사항의 범위나 품질에서 부족한 점을 발견하고 수정함으로써","개발과 테스팅 간의 협업 개선 — 테스트 프로세스를 함께 검토함으로써"],"ans":[2],"exp":"2.1.6의 이점과 예: 테스트 효과성/효율성 향상(프로세스 개선 권고 사항 구현), 테스트웨어 품질 향상(테스트 프로세스를 함께 검토), 팀의 결속 및 학습 향상(문제를 제기하고 개선점을 제안할 기회), 테스트 베이시스 품질 개선(요구사항의 범위나 품질에서 부족한 점을 발견하고 수정), 개발과 테스팅 간의 협업 개선(정기적으로 협업 과정을 검토하고 최적화).","why":["이 예는 팀의 결속 및 학습 향상의 예다. 테스트웨어 품질 향상의 예는 테스트 프로세스를 함께 검토하는 것이다.","팀의 결속 및 학습 향상의 예는 문제를 제기하고 개선점을 제안할 기회를 주는 것이다.","2.1.6에 적힌 연결 그대로다.","개발과 테스팅 간의 협업 개선의 예는 정기적으로 협업 과정을 검토하고 최적화하는 것이다."],"ref":"2.1.6"},{"id":"c2-032","ch":2,"lo":"FL-2.1.6","k":2,"q":"회고(retrospective)에 대한 설명으로 실라버스 2.1.6과 일치하는 것은?","opts":["회고의 시기와 구성은 사용하는 소프트웨어 개발수명주기(SDLC) 모델에 따라 달라진다.","회고는 반복 주기나 릴리스 마일스톤이 아니라 프로젝트가 모두 끝난 뒤 한 번만 진행한다.","회고는 테스트 프로세스를 다루므로 개발자나 제품 소유자 없이 테스터만 참여한다.","회고 결과는 솔직한 논의를 위해 기록하지 않고, 테스트 완료 보고서에도 넣지 않는다."],"ans":[0],"exp":"2.1.6: 회고는 프로젝트나 반복 주기가 끝날 때, 릴리스 마일스톤에서, 또는 필요시 진행할 수 있으며, 시기와 구성은 사용 중인 SDLC 모델에 따라 달라진다. 결과는 기록해야 하며 테스트 완료 보고서(5.3.2)에 포함하는 경우가 많다.","why":["2.1.6: 회고의 시기와 구성은 사용 중인 SDLC 모델에 따라 달라진다.","회고는 프로젝트나 반복 주기가 끝날 때, 릴리스 마일스톤에서, 또는 필요할 때 진행할 수 있다.","참가자에는 테스터 외에도 개발자, 설계자, 제품 소유자, 비즈니스 분석가 등이 있다.","2.1.6은 결과를 기록해야 하며, 이를 테스트 완료 보고서에 포함하는 경우가 많다고 한다."],"ref":"2.1.6"},{"id":"c2-033","ch":2,"lo":"FL-2.1.6","k":2,"q":"한 팀은 반복 주기가 끝날 때마다 회고를 열고 개선 항목을 기록한다. 그런데 기록한 개선 항목을 아무도 실행하지 않아, 같은 문제가 다음 반복 주기에도 계속 나온다.\n실라버스 2.1.6에 비추어 이 팀에 필요한 것은?","opts":["회고를 반복 주기마다 하지 말고 프로젝트 종료 시점에만 연다.","권장된 개선 사항에 대한 후속 조치가 이루어지도록 한다.","같은 문제가 반복되면 그 문제는 회고 논의 대상에서 제외한다.","회고 참가자를 테스터로 한정해 테스트 관련 논의에 집중한다."],"ans":[1],"exp":"2.1.6: 회고는 지속적인 개선을 성공적으로 구현하기 위해 반드시 필요하며, 권장된 모든 개선 사항에 대한 후속 조치가 이루어지는 것이 중요하다.","why":["회고 횟수를 줄이라는 내용은 실라버스에 없고, 문제의 원인인 후속 조치 부족도 해결하지 못한다.","2.1.6: 회고는 지속적인 개선을 성공적으로 구현하기 위해 반드시 필요하며, 권장된 모든 개선 사항에 대한 후속 조치가 이루어지는 것이 중요하다.","실라버스는 부족했던 점과 개선할 점을 논의하라고 하며, 반복되는 문제를 논의에서 빼라는 내용은 없다.","회고에는 테스터 외에도 개발자, 설계자, 제품 소유자, 비즈니스 분석가 등이 참여하며, 참가자를 테스터로 한정하라는 내용은 없다."],"ref":"2.1.6"},{"id":"c2-034","ch":2,"lo":"FL-2.1.4","k":2,"q":"한 회사가 데브옵스(DevOps)를 도입해 배포 파이프라인과 지속적 통합(CI)/지속적 배포(CD)를 운영하기 시작했다.\n테스팅 관점에서 데브옵스의 이점으로 실라버스 2.1.4와 일치하는 것은?","opts":["테스트 자동화 수준이 높아지므로 수동 테스팅은 더 이상 필요하지 않다.","운영팀이 비기능 품질 특성을 전담하게 되어 테스터는 기능 테스팅에만 집중할 수 있다.","자동 리그레션 테스트의 규모와 범위가 늘어나 리그레션 발생 리스크가 최소화된다.","테스트 자동화에 추가 자원이 들지 않는다."],"ans":[2],"exp":"2.1.4의 테스팅 관점 이점: 코드 품질과 변경의 악영향에 대한 빠른 피드백, CI를 통한 시프트 레프트 장려, 안정적인 테스트 환경 구축을 촉진하는 CI/CD 같은 자동화 프로세스, 비기능 품질 특성에 대한 가시성 향상, 반복적인 수동 테스팅 필요성 감소, 자동 리그레션 테스트의 규모와 범위 증가로 리그레션 리스크 최소화.","why":["2.1.4는 데브옵스에서도 수동 테스팅이 (특히 사용자 관점에서) 여전히 필요하다고 한다.","2.1.4는 비기능 품질 특성(예: 성능 효율성, 신뢰성)에 대한 가시성이 향상된다고 할 뿐, 운영팀 전담은 언급하지 않는다.","2.1.4에 적힌 이점 그대로다.","2.1.4는 테스트 자동화에 추가 자원이 필요하다는 점을 리스크와 어려움으로 든다."],"ref":"2.1.4"},{"id":"c2-035","ch":2,"lo":"FL-2.1.4","k":2,"q":"데브옵스(DevOps)를 도입하려는 조직이 미리 대비해야 할 리스크와 어려움으로 실라버스 2.1.4가 제시한 것은? (두 개를 고르시오)","opts":["코드 품질에 대한 피드백이 느려진다.","자동 리그레션 테스트 때문에 리그레션 발생 리스크가 커진다.","데브옵스 배포 파이프라인을 정의하고 설정해야 한다.","개발과 운영이 각자 하는 일의 가치를 동등하게 볼 수 없게 된다.","테스트 자동화를 위한 추가 자원이 필요하며, 이를 설정하고 유지보수하기 어려울 수 있다."],"ans":[2,4],"exp":"2.1.4의 리스크와 어려움: 데브옵스 배포 파이프라인을 정의하고 설정해야 한다. 지속적 통합/지속적 배포 도구를 도입하고 유지보수해야 한다. 테스트 자동화를 위한 추가 자원이 필요하며, 설정 및 유지보수가 어려울 수 있다.","why":["2.1.4는 코드 품질에 대한 빠른 피드백을 이점으로 든다.","2.1.4는 자동 리그레션 테스트의 규모와 범위가 늘어 리그레션 발생 리스크가 최소화된다고 한다.","2.1.4의 첫 번째 리스크와 어려움이다.","데브옵스는 개발과 운영이 각자 하는 일의 가치를 동등하게 보도록 하는 조직문화의 변화를 요구한다.","2.1.4의 세 번째 리스크와 어려움이다."],"ref":"2.1.4"},{"id":"c2-036","ch":2,"lo":"FL-2.1.4","k":2,"q":"데브옵스(DevOps) 환경에서 지속적 통합(CI)과 시프트 레프트(shift left)의 관계를 실라버스 2.1.4에 맞게 설명한 것은?","opts":["CI는 테스트를 운영 단계로 미루게 하므로 시프트 레프트 테스팅 접근법과 상충한다.","CI는 컴포넌트 테스트를 운영팀이 맡게 해, 개발자가 코드 제출에만 집중하도록 함으로써 시프트 레프트를 장려한다.","CI는 코드 품질에 대한 피드백을 릴리스 직전에 한 번에 받게 해 테스트 공수를 줄임으로써 시프트 레프트를 장려한다.","CI는 개발자가 컴포넌트 테스트 및 정적 분석과 함께 높은 품질의 코드를 제출하도록 장려해 시프트 레프트를 장려한다."],"ans":[3],"exp":"2.1.4: 지속적 통합은 개발자가 컴포넌트 테스트 및 정적 분석과 함께 높은 품질의 코드를 제출하도록 장려함으로써 시프트 레프트 테스팅 접근법(2.1.5)을 장려한다.","why":["2.1.4는 CI가 시프트 레프트를 장려한다고 한다. 상충하지 않는다.","2.1.4는 CI가 개발자에게 컴포넌트 테스트와 함께 코드를 제출하도록 장려한다고 한다. 운영팀이 컴포넌트 테스트를 맡는다는 내용은 없다.","2.1.4는 코드 품질에 대한 빠른 피드백을 데브옵스의 이점으로 들고, 2.1.5도 CI가 빠른 피드백을 준다고 한다.","2.1.4에 적힌 내용 그대로다."],"ref":"2.1.4"},{"id":"c2-037","ch":2,"lo":"FL-2.1.5","k":2,"q":"테스트 매니저가 「이제 시프트 레프트(shift left)를 하니, 시스템 테스팅과 인수 테스팅은 생략해도 된다」고 말했다.\n실라버스 2.1.5에 비추어 옳은 설명은?","opts":["맞다. 시프트 레프트는 테스트를 소프트웨어 개발수명주기(SDLC) 초기로 옮기는 것이므로 후반 테스트는 생략하는 것이 원칙이다.","틀리다. 시프트 레프트는 테스트를 더 일찍 수행하라는 뜻이지만, SDLC 후반의 테스트를 무시해도 된다는 뜻은 아니다.","맞다. 시프트 레프트를 하면 결함이 모두 초기에 발견되므로 후반 테스트 레벨은 필요 없다.","틀리다. 시프트 레프트는 코드 구현과 컴포넌트 통합이 끝날 때까지 기다렸다가 테스트하는 것이다."],"ans":[1],"exp":"2.1.5: 시프트 레프트는 기본적으로 테스트를 더 일찍 수행해야 한다는 것(예: 코드가 구현되거나 컴포넌트가 통합될 때까지 기다리지 않고)을 의미하지만, SDLC 후반의 테스트를 무시해도 된다는 의미는 아니다. 후반의 공수와 비용 절감은 기대 효과일 뿐, 후반 테스트를 빼도 된다는 뜻은 아니다(2.1.5).","why":["2.1.5는 프로세스 후반의 공수와 비용 절감을 기대할 수 있다고 하지만, 후반 테스트를 무시해도 된다는 의미는 아니라고 분명히 한다.","2.1.5의 설명과 일치한다.","결함이 모두 초기에 발견된다는 내용은 실라버스에 없으며, 2.1.5는 후반 테스트를 무시해도 된다는 뜻이 아니라고 한다.","시프트 레프트는 코드 구현이나 컴포넌트 통합을 기다리지 않고 더 일찍 테스트하는 것이다."],"ref":"2.1.5"},{"id":"c2-038","ch":2,"lo":"FL-2.1.5","k":2,"q":"테스팅에서 시프트 레프트(shift left)를 달성하는 좋은 프랙티스의 예로 실라버스 2.1.5와 일치하는 것은?","opts":["비기능 테스팅은 완성 시스템과 실제 환경을 대변하는 테스트 환경이 갖춰질 때까지 미룬다.","소스 코드의 정적 분석은 동적 테스팅이 모두 끝난 뒤에 수행한다.","명세 리뷰는 시스템 테스팅 단계에서 실행 결과와 비교하며 수행한다.","가능한 한 컴포넌트 테스트에서부터 비기능 테스팅을 수행한다."],"ans":[3],"exp":"2.1.5의 시프트 레프트 좋은 프랙티스: 테스터 관점에서 명세 리뷰, 코드 작성 전에 테스트 케이스를 작성하고 구현 중 테스트 하네스에서 실행, CI(가능하면 CD까지) 적용, 동적 테스팅 전 또는 자동화 프로세스의 일부로 정적 분석 완료, 가능한 한 컴포넌트 테스트에서부터 비기능 테스팅 수행.","why":["비기능 테스트는 원래 후반에 수행하는 경향이 있어서, 컴포넌트 테스트부터 시작하는 것이 시프트 레프트라고 2.1.5는 설명한다.","2.1.5는 정적 분석을 동적 테스팅 전 또는 자동화된 프로세스의 일부로 완료하라고 한다.","명세 리뷰를 시스템 테스팅 단계까지 미루는 것은 테스트를 더 일찍 하라는 시프트 레프트와 반대다.","2.1.5에 적힌 프랙티스 그대로다."],"ref":"2.1.5"},{"id":"c2-039","ch":2,"lo":"FL-2.1.5","k":2,"q":"시프트 레프트(shift left)를 도입한 첫 분기에, 프로젝트 초기의 훈련과 공수가 늘었다는 보고가 올라왔다.\n실라버스 2.1.5에 비추어 옳은 설명은?","opts":["시프트 레프트는 프로세스 초기에 훈련, 공수, 비용이 추가로 들 수 있지만, 프로세스 후반의 공수와 비용 절감을 기대할 수 있다.","초기 비용이 늘었다면 시프트 레프트를 잘못 적용한 것이다. 올바르게 적용하면 초기 비용은 늘지 않고 후반 비용만 줄어든다.","시프트 레프트의 목적은 비용과 무관하게 테스트 레벨 수를 줄이는 것이다. 초기 공수가 늘어도 레벨 수가 줄면 성공이다.","시프트 레프트는 테스트팀 내부 활동이다. 그래서 이해관계자가 개념을 이해하고 받아들일 필요는 없다."],"ans":[0],"exp":"2.1.5: 시프트 레프트 접근법은 프로세스 초기에 훈련, 공수, 비용이 추가로 들지만, 프로세스 후반의 공수와 비용 절감을 기대할 수 있다. 시프트 레프트를 위해서는 이해관계자들이 개념을 이해하고 받아들이는 것이 중요하다.","why":["2.1.5의 설명과 일치한다.","2.1.5는 시프트 레프트 접근법이 프로세스 초기에 훈련, 공수, 비용이 추가로 든다고 설명한다. 초기 비용 증가만으로 잘못 적용했다고 볼 근거는 없다.","테스트 레벨 수를 줄이는 것은 시프트 레프트의 목적으로 제시되지 않았고, 2.1.5는 후반 테스트를 무시해도 된다는 뜻이 아니라고 한다.","2.1.5는 이해관계자들이 개념을 이해하고 받아들이는 것이 중요하다고 한다."],"ref":"2.1.5"},{"id":"c3-001","ch":3,"lo":"FL-3.1.1","k":1,"q":"한 테스트 팀이 다음 프로젝트에서 정적 테스팅(static testing)으로 검토할 작업 산출물(work product) 목록을 정리하고 있다.\n다음 중 정적 테스팅에 적합하지 **않은** 작업 산출물은?","opts":["다음 스프린트에서 사용할 테스트 차터(test charter)","고객사와 체결한 소프트웨어 개발 계약서","법적 이유로 도구 분석이 금지된 타사의 실행 코드","공식 문법으로 작성된 시스템 설계 모델"],"ans":[2],"exp":"3.1.1에 따르면 거의 모든 작업 산출물을 정적 테스팅으로 검토할 수 있다. 다만 사람이 해석하기 어렵고 도구로 분석해서는 안 되는 작업 산출물(예: 법적으로 문제가 되는 타사의 실행 코드)은 정적 테스팅에 적합하지 않다.","why":["테스트 차터는 3.1.1에서 정적 테스팅으로 검토할 수 있는 작업 산출물의 예로 나온다.","계약서도 3.1.1에 정적 테스팅 대상의 예로 나온다.","정답. 실행 코드라 사람이 해석하기 어렵고, 법적 이유로 도구 분석도 할 수 없으므로 정적 테스팅에 적합하지 않다.","모델은 3.1.1의 검토 대상 예이며, 공식 문법 같은 구조가 있으면 정적 분석에도 쓸 수 있다."],"ref":"3.1.1"},{"id":"c3-002","ch":3,"lo":"FL-3.1.1","k":1,"q":"개발팀이 정적 분석(static analysis) 도구를 여러 작업 산출물에 적용하려고 한다.\n실라버스에 따르면 작업 산출물을 정적 분석으로 검사하려면 무엇이 필요한가?","opts":["작업 산출물이 실행 가능한 형태로 빌드되어 있어 도구가 직접 실행해 볼 수 있어야 한다","작업 산출물에 대한 테스트 케이스와 기대 결과가 먼저 작성되어 있어야 한다","사람이 읽고 이해할 수 있는 문서이기만 하면 되고 특별한 형식은 필요 없다","검사 기준이 되는 구조(예: 모델, 공식 문법이 정해진 코드나 텍스트)가 필요하다"],"ans":[3],"exp":"3.1.1: 정적 분석의 경우 작업 산출물을 검토할 수 있는 기준이 되는 어떤 구조가 필요하다(예: 모델, 공식 문법이 정해진 코드나 텍스트).","why":["정적 분석도 정적 테스팅이라 테스트 대상 소프트웨어를 실행하지 않아도 된다(3.1). 실행 가능한 형태로 빌드되어 있을 필요가 없다.","3.1: 정적 분석은 테스트 케이스가 필요 없다. 테스트 케이스와 기대 결과를 먼저 작성해 둘 필요가 없다.","읽고 이해할 수 있으면 대상이 되는 것은 리뷰의 조건이다. 정적 분석에는 검사 기준이 되는 구조가 필요하다(3.1.1).","정답. 3.1.1에 나오는 정적 분석의 조건이다."],"ref":"3.1.1"},{"id":"c3-003","ch":3,"lo":"FL-3.1.1","k":1,"q":"애자일 팀의 테스터가 다음 스프린트의 제품 백로그 항목과 테스트 차터를 리뷰(review)하자고 제안했다. 한 팀원은 ‘공식 문법이 없는 문서는 리뷰할 수 없다’며 반대했다.\n실라버스에 비추어 옳은 설명은?","opts":["리뷰는 요구사항 명세서와 소스 코드에만 적용할 수 있으므로 두 작업 산출물 모두 리뷰 대상이 아니다","읽고 이해할 수 있는 작업 산출물은 리뷰 대상이 될 수 있으므로 두 작업 산출물 모두 리뷰할 수 있다","제품 백로그 항목은 리뷰할 수 있지만, 테스트 차터는 테스트 작업 산출물이므로 정적 테스팅 대상이 아니다","공식 문법이 없으므로 리뷰 대신 정적 분석 도구로만 검사해야 한다"],"ans":[1],"exp":"3.1.1: 읽고 이해할 수 있는 모든 작업 산출물은 리뷰 대상이 될 수 있다. 제품 백로그 항목과 테스트 차터는 모두 정적 테스팅으로 검토할 수 있는 작업 산출물의 예로 나온다. 공식 문법 같은 구조가 필요한 것은 리뷰가 아니라 정적 분석이다.","why":["3.1.1은 테스트 계획서, 테스트 케이스, 제품 백로그 항목, 테스트 차터, 계약서 등도 대상으로 든다.","정답. 3.1.1의 리뷰 대상 기준과 일치한다.","테스트 차터도 3.1.1에서 정적 테스팅으로 검토할 수 있는 작업 산출물의 예로 나온다.","구조가 필요한 것은 정적 분석 쪽이다. 구조가 없는 문서는 오히려 정적 분석이 어렵고, 리뷰는 읽고 이해할 수 있으면 된다(3.1.1)."],"ref":"3.1.1"},{"id":"c3-004","ch":3,"lo":"FL-3.2.1","k":1,"q":"한 프로젝트가 스프린트마다 이해관계자에게 결과물을 시연하고 피드백을 받기로 했다.\n이해관계자 피드백을 조기에 자주 받을 때의 이점으로 실라버스에 제시된 것은?","opts":["요구사항이 프로젝트 도중 바뀌지 않도록 초기에 고정할 수 있다","요구사항에 대한 오해를 방지하고, 요구사항 변경을 조기에 이해하고 구현할 수 있다","개발팀이 모든 기능을 같은 우선순위로 균등하게 구현할 수 있다","이해관계자가 시연에서 직접 확인하므로 별도의 리뷰나 테스팅이 필요 없어진다"],"ans":[1],"exp":"3.2.1: 소프트웨어 개발수명주기(SDLC) 전반에 걸쳐 이해관계자의 피드백을 자주 받으면 요구사항에 대한 오해를 방지하고 요구사항 변경을 조기에 이해하고 구현할 수 있다.","why":["3.2.1은 변경을 막는다고 하지 않는다. 변경을 조기에 이해하고 구현할 수 있게 한다고 설명한다.","정답. 3.2.1에 그대로 나오는 이점이다.","3.2.1은 이해관계자에게 가장 중요하고 식별한 리스크에 가장 긍정적인 영향을 미치는 기능에 집중할 수 있다고 한다. 균등하게 구현한다는 내용이 아니다.","3.2.1에 그런 이점은 없다. 이해관계자 피드백이 리뷰나 테스팅을 대신한다는 내용은 실라버스에 나오지 않는다."],"ref":"3.2.1"},{"id":"c3-005","ch":3,"lo":"FL-3.2.1","k":1,"q":"어떤 프로젝트에서 이해관계자는 요구사항 문서를 넘겨준 뒤 출시 직전까지 한 번도 개발 과정에 참여하지 않았다.\n실라버스에 따르면 이런 상황에서 생길 수 있는 결과로 옳은 것은?","opts":["제품이 이해관계자의 초기 및 현재 요구를 충족하지 못해 큰 비용이 드는 재작업이 생길 수 있다","이해관계자가 중간에 개입하지 않으므로 요구사항 변경 요청이 줄어들어 재작업 비용이 낮아진다","개발팀이 요구사항을 독자적으로 해석해야 하므로 구현 중인 제품에 대한 이해도가 오히려 높아진다","피드백 회의가 없어지므로 전체 프로젝트 비용과 납기일 지연 리스크가 함께 줄어든다"],"ans":[0],"exp":"3.2.1: SDLC 동안 이해관계자의 참여가 적으면 개발 중인 제품이 이해관계자의 초기 및 현재 요구를 충족하지 못할 수 있다. 이해관계자가 원하는 것을 전달하지 못하면 큰 비용이 드는 재작업, 납기일 지연, 서로 간의 비난 등이 발생할 수 있고, 심하면 프로젝트가 완전히 실패할 수도 있다.","why":["정답. 3.2.1에 나오는 결과다. 실라버스는 재작업 외에 납기일 지연, 서로 간의 비난, 심하면 프로젝트의 완전한 실패도 든다.","3.2.1은 참여가 적을 때 오히려 큰 비용이 드는 재작업이 생길 수 있다고 한다.","3.2.1에 따르면 개발팀의 이해도가 높아지는 것은 이해관계자 피드백을 자주 받을 때다.","3.2.1은 참여가 적을 때 납기일 지연과 프로젝트 실패 가능성을 언급한다."],"ref":"3.2.1"},{"id":"c3-006","ch":3,"lo":"FL-3.2.1","k":1,"q":"이해관계자 피드백을 조기에 자주 받을 때의 이점으로 실라버스에 제시된 것 두 개를 고르시오.","opts":["잠재적인 품질 문제를 조기에 파악할 수 있다","요구사항 변경 요청을 프로젝트 후반으로 미뤄 일정 변동을 줄일 수 있다","개발팀이 이해관계자에게 가장 중요하고, 식별한 리스크에 가장 긍정적인 영향을 미치는 기능에 집중할 수 있다","이해관계자가 직접 결함 보고서를 작성하므로 결함 관리 프로세스를 생략할 수 있다","피드백 내용을 테스트 자동화 도구가 그대로 테스트 케이스로 바꿔 준다"],"ans":[0,2],"exp":"3.2.1: 피드백을 조기에 자주 받으면 잠재적인 품질 문제를 조기에 파악할 수 있다. 또 개발팀은 이해관계자에게 가장 중요하고 식별한 리스크에 가장 긍정적인 영향을 미치는 기능에 집중할 수 있다.","why":["정답. 3.2.1 첫 문장의 이점이다.","3.2.1은 요구사항 변경을 조기에 이해하고 구현할 수 있다고 한다. 변경을 미루는 것이 아니다.","정답. 3.2.1에 그대로 나오는 이점이다.","3.2.1에 없는 내용이다. 결함 관리 프로세스는 관련된 모든 이해관계자가 따라야 한다(5.5).","3.2.1에 없는 내용이다. 피드백의 이점과 관계없다."],"ref":"3.2.1"},{"id":"c3-007","ch":3,"lo":"FL-3.2.3","k":1,"q":"리뷰를 준비하면서 어떤 사람이 ‘이번 분기에는 결제 모듈 설계서를 리뷰한다’고 정하고, 리뷰에 필요한 인력과 시간 등 자원을 제공했다.\n이 사람이 수행한 책임은 어떤 역할에 해당하는가?","opts":["리뷰 리더(review leader)","중재자(moderator)","관리자(manager)","저자(author)"],"ans":[2],"exp":"3.2.3: 관리자는 리뷰할 내용을 결정하고, 리뷰에 필요한 사람과 시간 등 자원을 제공한다.","why":["리뷰 리더는 리뷰에 참여할 사람을 결정하고 리뷰 시간과 장소를 협의하는 등 리뷰 전반의 책임을 진다(3.2.3). 무엇을 리뷰할지 정하고 자원을 제공하는 역할은 아니다.","중재자는 중재, 시간 관리, 안전한 리뷰 환경 조성 등 리뷰 회의의 효과적인 운영을 담당한다.","정답. 3.2.3의 관리자 책임과 일치한다.","저자는 리뷰 대상 작업 산출물을 작성하고 수정한다."],"ref":"3.2.3"},{"id":"c3-008","ch":3,"lo":"FL-3.2.3","k":1,"q":"리뷰 회의에서 한 참가자가 리뷰어들이 개별 리뷰에서 찾은 이상 사항(anomaly)을 모으고, 회의 중에 내린 결정과 새로 발견된 이상 사항을 기록했다.\n이 참가자의 역할은?","opts":["중재자(moderator)","리뷰어(reviewer)","리뷰 리더(review leader)","서기(scribe)"],"ans":[3],"exp":"3.2.3: 서기(기록자라고도 함)는 리뷰어로부터 이상 사항을 수집하고, 결정 사항이나 리뷰 회의 중에 발견한 새로운 이상 사항 등 리뷰 정보를 기록한다.","why":["중재자는 중재, 시간 관리, 안전한 리뷰 환경 조성 등 리뷰 회의 운영을 담당한다(3.2.3).","리뷰어는 리뷰를 수행한다. 이상 사항을 모아 기록하는 일은 서기의 책임이다.","리뷰 리더는 참여자 결정, 시간과 장소 협의 등 리뷰 전반의 책임을 진다.","정답. 3.2.3의 서기 책임과 일치한다."],"ref":"3.2.3"},{"id":"c3-009","ch":3,"lo":"FL-3.2.3","k":1,"q":"리뷰 회의 도중 두 리뷰어의 의견이 부딪혀 회의가 길어지자, 한 사람이 의견을 조율하고 남은 시간을 관리했다. 또 신입 리뷰어도 부담 없이 발언할 수 있는 분위기를 만들었다.\n이 사람이 맡은 역할은?","opts":["중재자(moderator)","관리자(manager)","리뷰 리더(review leader)","서기(scribe)"],"ans":[0],"exp":"3.2.3: 중재자(퍼실리테이터라고도 함)는 중재, 시간 관리, 모든 사람이 자유롭게 발언할 수 있는 안전한 리뷰 환경 조성 등 리뷰 회의의 효과적인 운영을 담당한다.","why":["정답. 3.2.3의 중재자 책임과 일치한다.","관리자는 리뷰할 내용을 결정하고 사람과 시간 등 자원을 제공한다(3.2.3).","리뷰 리더는 리뷰 전반의 책임을 지지만, 회의 중 중재·시간 관리·안전한 환경 조성은 3.2.3에서 중재자의 책임으로 나온다.","서기는 이상 사항을 수집하고 리뷰 정보를 기록한다."],"ref":"3.2.3"},{"id":"c3-010","ch":3,"lo":"FL-3.2.3","k":1,"q":"리뷰의 주요 역할과 책임을 짝지은 것 중 실라버스와 일치하는 것은?","opts":["리뷰 리더(review leader) - 참여자를 정하고 리뷰 시간과 장소를 협의하는 등 리뷰 전반을 책임진다","저자(author) - 리뷰 회의에서 중재와 시간 관리를 맡고 모두가 자유롭게 발언할 수 있는 안전한 환경을 만든다","리뷰어(reviewer) - 리뷰할 내용을 결정하고 리뷰에 필요한 사람과 시간 등 자원을 제공한다","중재자(moderator) - 리뷰 대상 작업 산출물을 작성하고, 리뷰 결과에 따라 직접 수정한다"],"ans":[0],"exp":"3.2.3: 리뷰 리더는 리뷰에 참여할 사람을 결정하고, 리뷰 시간과 장소를 협의하는 등 리뷰에 대한 전반적인 책임을 진다.","why":["정답. 3.2.3의 리뷰 리더 설명과 일치한다.","중재, 시간 관리, 모든 사람이 자유롭게 발언할 수 있는 안전한 리뷰 환경 조성은 중재자의 책임이다. 저자는 작업 산출물을 작성하고 수정한다(3.2.3).","리뷰할 내용 결정과 사람·시간 등 자원 제공은 관리자(manager)의 책임이다. 리뷰어는 리뷰를 수행한다(3.2.3).","작업 산출물을 작성하고 수정하는 것은 저자다. 중재자는 리뷰 회의의 효과적인 운영을 담당한다(3.2.3)."],"ref":"3.2.3"},{"id":"c3-011","ch":3,"lo":"FL-3.2.5","k":1,"q":"다음 중 리뷰의 성공 요소로 실라버스에 제시된 것은?","opts":["리뷰 결과를 참가자 개인의 성과 평가에 활용하도록 리뷰 목표에 포함한다","리뷰 유형은 작업 산출물과 관계없이 조직 표준 한 가지로 고정한다","리뷰어가 개별 리뷰나 리뷰 회의에서 집중력을 잃지 않도록 작은 단위로 리뷰를 진행한다","리뷰 피드백은 저자에게만 전달하고 다른 이해관계자에게는 공유하지 않는다"],"ans":[2],"exp":"3.2.5: 리뷰어가 개별 리뷰 또는 리뷰 회의(개최 시)에서 집중력을 잃지 않도록 작은 단위로 리뷰를 진행하는 것은 리뷰의 성공 요소다.","why":["3.2.5: 참가자의 평가가 목적이 되어서는 절대 안 된다.","3.2.5: 목표를 달성할 수 있으면서 작업 산출물 유형, 리뷰 참여자, 프로젝트 요구사항 및 정황에 맞는 리뷰 유형을 선택해야 한다.","정답. 3.2.5에 그대로 나오는 성공 요소다.","3.2.5: 이해관계자와 저자 모두에게 리뷰 피드백을 제공해 제품과 활동을 개선할 수 있게 한다."],"ref":"3.2.5"},{"id":"c3-012","ch":3,"lo":"FL-3.2.5","k":1,"q":"한 조직이 리뷰를 도입하면서 운영 원칙을 정하고 있다.\n다음 중 실라버스에 제시된 리뷰의 성공 요소에 해당하는 것은?","opts":["리뷰 프로세스는 관리층의 개입 없이 개발팀이 자율적으로만 운영한다","일정 부담을 줄이기 위해 참가자의 리뷰 준비 시간을 최소화한다","리뷰를 조직 문화와 분리된 별도의 감사 활동으로 운영한다","명확한 목표와 측정 가능한 완료 조건을 정의한다"],"ans":[3],"exp":"3.2.5의 첫 번째 성공 요소는 명확한 목표와 측정 가능한 완료 조건을 정의하는 것이다.","why":["3.2.5: 리뷰 프로세스를 관리층이 지원하는 것이 성공 요소다.","3.2.5: 참가자가 리뷰를 준비할 수 있는 충분한 시간을 제공해야 한다.","3.2.5: 학습 및 프로세스 개선 촉진을 위해 리뷰가 조직 문화의 일부가 되도록 한다.","정답. 3.2.5에 그대로 나오는 성공 요소다."],"ref":"3.2.5"},{"id":"c3-013","ch":3,"lo":"FL-3.2.5","k":1,"q":"리뷰를 처음 도입한 팀에서 ‘리뷰 회의가 자주 산만해진다’, ‘참가자들이 자기 역할에서 무엇을 해야 하는지 모른다’는 의견이 나왔다.\n다음 중 실라버스에 제시된 리뷰의 성공 요소 두 개를 고르시오.","opts":["작업 산출물 전체를 한 번에 리뷰해 맥락을 놓치지 않게 한다","회의에 퍼실리테이션(facilitation)을 적용한다","리뷰 목적과 관계없이 가장 공식적인 리뷰 유형인 인스펙션을 항상 선택한다","모든 참가자가 자신의 역할을 어떻게 충족해야 하는지 알 수 있도록 적절한 교육을 제공한다","리뷰 회의는 반드시 저자가 진행해 작성 의도를 설명하게 한다"],"ans":[1,3],"exp":"3.2.5의 성공 요소에는 ‘모든 참가자가 자신의 역할을 어떻게 충족해야 하는지 알 수 있도록 적절한 교육을 제공한다’와 ‘회의에 퍼실리테이션을 적용한다’가 있다.","why":["3.2.5는 집중력을 잃지 않도록 작은 단위로 리뷰를 진행하라고 한다.","정답. 3.2.5에 그대로 나오는 성공 요소다.","3.2.5는 목표를 달성할 수 있으면서 작업 산출물 유형, 참여자, 프로젝트 요구사항 및 정황에 맞는 리뷰 유형을 선택하라고 한다.","정답. 3.2.5에 그대로 나오는 성공 요소다.","3.2.5의 성공 요소에 없다. 저자가 리더가 되는 것은 워크쓰루의 특징이고, 인스펙션에서는 저자가 리뷰 리더가 될 수 없다(3.2.4)."],"ref":"3.2.5"},{"id":"c3-014","ch":3,"lo":"FL-3.1.2","k":2,"q":"프로젝트 관리자가 ‘요구사항 리뷰를 하려면 여러 사람이 시간을 내야 해서 비용이 크다. 리뷰는 생략하고 동적 테스팅에 집중하자’고 제안했다.\n실라버스에 근거한 반론으로 가장 적절한 것은?","opts":["리뷰는 구축 비용이 거의 들지 않고, 프로젝트 후반의 결함 수정 시간과 노력도 줄여 주므로 생략할 이유가 없다","리뷰 비용은 클 수 있지만, 후반의 결함 수정 노력이 줄어 리뷰를 안 할 때보다 전체 프로젝트 비용이 훨씬 낮은 경우가 많다","리뷰를 하면 동적 테스팅으로 찾을 결함까지 모두 찾을 수 있으므로 동적 테스팅 자체를 크게 줄일 수 있다","리뷰는 작업 산출물이 모두 완성된 프로젝트 후반에 할수록 결함 수정 비용이 낮아지므로, 출시 직전에 한 번에 몰아서 하면 된다"],"ans":[1],"exp":"3.1.2: 리뷰를 구축하는 비용은 클 수 있지만, 프로젝트 후반에 결함을 수정하는 시간과 노력이 줄어들어 리뷰를 수행하지 않을 때보다 전체 프로젝트 비용이 훨씬 낮아지는 경우가 많다.","why":["3.1.2는 리뷰를 구축하는 비용이 클 수 있다고 분명히 말한다. 후반의 결함 수정 시간과 노력이 준다는 부분만 맞다.","정답. 3.1.2의 리뷰 비용 설명과 같다.","3.1.3: 정적 테스팅과 동적 테스팅은 서로 보완하며, 한쪽으로만 식별할 수 있는 결함 유형도 있다.","3.1.2: 정적 테스팅은 SDLC 초기 단계에서 결함을 식별해 조기 테스팅 원리(1.3)를 지킬 수 있게 하고, 리뷰를 하면 프로젝트 후반에 결함을 수정하는 시간과 노력이 줄어든다. 출시 직전에 몰아서 하는 것은 이와 반대다."],"ref":"3.1.2"},{"id":"c3-015","ch":3,"lo":"FL-3.1.2","k":2,"q":"정적 테스팅(static testing)의 가치에 대한 설명으로 옳은 것은?","opts":["정적 테스팅은 실행 가능한 코드가 준비된 뒤에만 수행할 수 있으므로 소프트웨어 개발수명주기(SDLC) 후반에 가치가 크다","정적 테스팅은 결함 식별에만 쓰이며, 작업 산출물에 대한 신뢰를 쌓는 데는 기여하지 않는다","정적 테스팅은 도달 불가능한 코드처럼 동적 테스팅으로는 식별할 수 없는 결함도 찾을 수 있다","정적 분석은 모든 코드 결함을 동적 테스팅보다 더 효율적으로 찾으므로 동적 테스팅을 대체한다"],"ans":[2],"exp":"3.1.2: 정적 테스팅은 동적 테스팅으로 식별할 수 없는 결함(예: 도달 불가능한 코드, 원하는 대로 구현되지 않은 설계 패턴, 비-실행 작업 산출물의 결함)도 찾을 수 있다.","why":["3.1.2: 정적 테스팅은 SDLC 초기 단계에서 결함을 식별해 조기 테스팅 원리를 지킬 수 있게 한다. 또 정적 테스팅은 테스트 대상 소프트웨어를 실행하지 않아도 된다(3.1).","3.1.2: 정적 테스팅은 작업 산출물의 품질을 평가하고 신뢰를 쌓을 방법을 제공한다.","정답. 3.1.2에 나오는 정적 테스팅의 가치다.","3.1.2는 ‘일부’ 코드 결함을 정적 분석으로 더 효율적으로 식별할 수 있다고 한다. 3.1.3에 따르면 두 활동은 서로 보완한다."],"ref":"3.1.2"},{"id":"c3-016","ch":3,"lo":"FL-3.1.2","k":2,"q":"요구사항 명세서를 리뷰하려는데, 일정 압박 때문에 개발자만 참여시키자는 의견이 나왔다.\n실라버스에 따르면 정적 테스팅(static testing)에 다양한 이해관계자를 참여시키는 것이 권장되는 이유로 옳은 것은?","opts":["소프트웨어 개발수명주기(SDLC) 초기에 수행할 수 있어 관련 이해관계자 간 공통된 이해를 형성하고 의사소통을 개선하기 때문이다","참여하는 이해관계자가 많을수록 리뷰가 자동으로 인스펙션이 되어, 메트릭을 수집해 SDLC를 개선하는 데 쓸 수 있기 때문이다","요구사항이 실제 필요를 묘사하는지는 동적 테스팅 결과로만 확인할 수 있으므로, 테스트 실행 전에 미리 이해관계자를 모아 두어야 하기 때문이다","이해관계자가 참여하면 리뷰를 구축하는 비용이 들지 않아 전체 프로젝트 비용을 바로 줄일 수 있기 때문이다"],"ans":[0],"exp":"3.1.2: 정적 테스팅은 SDLC 초기에 수행할 수 있으므로 관련된 이해관계자 간 공통된 이해를 형성할 수 있고 의사소통도 개선된다. 그래서 다양한 이해관계자의 참여가 권장된다.","why":["정답. 3.1.2에 나오는 이유다.","3.1.2가 드는 이유가 아니다. 참여자가 많다고 리뷰가 자동으로 인스펙션이 되지 않는다. 리뷰 유형은 목표, 작업 산출물 유형, 리뷰 참여자, 프로젝트 요구사항 및 정황 등에 맞게 선택한다(3.2.4, 3.2.5).","3.1.2: 문서화된 요구사항을 확인하는 정적 테스팅으로도 이해관계자는 요구사항이 실제로 자기가 필요한 것을 묘사하는지 확인할 수 있다.","3.1.2: 리뷰를 구축하는 비용은 클 수 있다. 전체 프로젝트 비용이 낮아지는 경우가 많은 것은 프로젝트 후반에 결함을 수정하는 시간과 노력이 줄기 때문이다."],"ref":"3.1.2"},{"id":"c3-017","ch":3,"lo":"FL-3.1.3","k":2,"q":"정적 테스팅(static testing)과 동적 테스팅(dynamic testing)의 차이를 설명한 것으로 옳은 것은?","opts":["정적 테스팅은 장애를 일으킨 뒤 분석해 결함을 찾고, 동적 테스팅은 결함을 직접 식별한다","두 활동은 같은 유형의 결함만 식별하므로 어느 한쪽만 수행해도 충분하다","동적 테스팅은 실행 가능한 작업 산출물뿐 아니라 비-실행 작업 산출물에도 적용할 수 있다","정적 테스팅은 결함을 직접 식별하고, 동적 테스팅은 장애를 일으킨 뒤 후속 분석으로 연관된 결함을 찾아낸다"],"ans":[3],"exp":"3.1.3: 정적 테스팅은 결함을 직접 식별하는 반면, 동적 테스팅은 장애(failure)를 일으킨 후 연관된 결함(defect)을 후속 분석을 통해 찾아낸다.","why":["설명이 거꾸로다(3.1.3).","3.1.3: 두 활동은 서로 보완하며, 정적 테스팅이나 동적 테스팅 중 한 가지로만 식별할 수 있는 결함 유형도 있다.","3.1.3: 비-실행 작업 산출물에도 적용할 수 있는 것은 정적 테스팅이다. 동적 테스팅은 실행 가능한 작업 산출물에만 적용할 수 있다.","정답. 3.1.3에 나오는 차이점이다."],"ref":"3.1.3"},{"id":"c3-018","ch":3,"lo":"FL-3.1.3","k":2,"q":"한 팀이 다음 두 가지를 측정하려고 한다.\n(가) 주문 모듈 소스 코드의 유지보수성(maintainability)\n(나) 사용자가 몰릴 때의 주문 처리 응답 시간, 즉 성능 효율성(performance efficiency)\n실라버스에 따른 설명으로 옳은 것은?","opts":["(가)는 코드 실행에 의존하지 않아 정적 테스팅으로, (나)는 실행에 의존해 동적 테스팅으로 측정할 수 있다","(가)와 (나) 모두 코드를 실행해야 측정할 수 있는 품질 특성이므로 동적 테스팅으로만 측정할 수 있다","(가)는 코드 실행에 의존하므로 동적 테스팅으로, (나)는 의존하지 않으므로 정적 테스팅으로 측정한다","(가)와 (나) 모두 코드 실행에 의존하지 않는 품질 특성이므로 코드를 실행하지 않는 정적 분석으로 측정할 수 있다"],"ans":[0],"exp":"3.1.3: 정적 테스팅은 코드 실행에 의존하지 않는 품질 특성(예: 유지보수성)을 측정하는 데 쓸 수 있고, 동적 테스팅은 코드 실행에 의존적인 품질 특성(예: 성능 효율성)을 측정하는 데 쓸 수 있다.","why":["정답. 3.1.3의 설명과 일치한다.","유지보수성은 3.1.3에서 코드 실행에 의존하지 않는 품질 특성의 예로 나오므로 정적 테스팅으로 측정할 수 있다.","짝이 거꾸로다. 3.1.3에서 유지보수성은 코드 실행에 의존하지 않는 품질 특성, 성능 효율성은 코드 실행에 의존하는 품질 특성의 예다.","성능 효율성은 3.1.3에서 코드 실행에 의존하는 품질 특성의 예로 나오므로 동적 테스팅으로 측정한다."],"ref":"3.1.3"},{"id":"c3-019","ch":3,"lo":"FL-3.1.3","k":2,"q":"어떤 팀이 코드를 실행하기 전에 리뷰와 정적 분석을 수행했고, 이후 시스템 테스팅도 수행했다. 다음 표는 프로젝트에서 발견된 문제다.\n실라버스에 따르면 정적 테스팅으로 더 쉽게, 또는 더 적은 비용으로 식별할 수 있는 대표적인 결함으로만 묶은 것은?","table":{"head":["번호","발견된 문제"],"rows":[["A","요구사항 명세서의 두 조항이 서로 모순된다"],["B","소스 코드에서 선언되지 않은 변수를 사용한다"],["C","모듈 간 인터페이스 명세에서 매개변수 순서가 서로 다르다"],["D","동시 사용자가 최대일 때 응답 시간이 목표를 넘는다"]]},"opts":["A, B, D","A, B, C","B, C, D","A, C, D"],"ans":[1],"exp":"3.1.3의 ‘정적 테스팅을 통해 더 쉽게 적은 비용으로 식별할 수 있는 대표적인 결함’ 목록과 대조한다.\nA: 요구사항 결함(모순) - 목록에 있음\nB: 특정 유형의 코딩 결함(선언되지 않은 변수) - 목록에 있음\nC: 잘못된 인터페이스 명세(매개변수 순서 불일치) - 목록에 있음\nD: 응답 시간은 코드 실행에 의존하는 성능 효율성 문제라 동적 테스팅으로 측정한다(3.1.3) - 해당 없음\n따라서 A, B, C.","why":["D는 코드 실행에 의존하는 성능 효율성 문제이고, C가 빠졌다.","정답. A, B, C 모두 3.1.3의 대표 결함 목록에 있다.","A가 빠졌고, 성능 효율성 문제인 D가 들어갔다.","B가 빠졌고, 성능 효율성 문제인 D가 들어갔다."],"ref":"3.1.3"},{"id":"c3-020","ch":3,"lo":"FL-3.1.3","k":2,"q":"결제 모듈에는 외부 하드웨어 오류가 날 때만 실행되는 예외 처리 코드가 있다. 테스트 환경에서는 이 오류를 일으키기가 매우 어렵다.\n이 코드의 결함을 찾는 방법에 대해 실라버스에 맞는 설명은?","opts":["코드 경로의 결함은 실행해야만 찾을 수 있으므로, 하드웨어 오류를 실제로 일으키는 동적 테스팅만 가능하다","정적 테스팅은 비-실행 작업 산출물에만 적용할 수 있으므로 이 코드에는 적용할 수 없다","정적 테스팅은 거의 실행되지 않거나 동적 테스팅으로 도달하기 어려운 코드 경로에 있는 결함을 더 쉽게 발견할 수 있다","정적 테스팅으로 이 코드에서 장애를 일으킨 뒤 후속 분석으로 결함을 찾아야 한다"],"ans":[2],"exp":"3.1.3: 정적 테스팅은 거의 실행되지 않거나, 동적 테스팅으로 도달하기 어려운 코드 경로에 있는 결함을 더 쉽게 발견할 수 있다.","why":["3.1.3에 따르면 정적 테스팅은 코드를 실행하지 않고도 이런 경로의 결함을 더 쉽게 발견할 수 있다.","3.1.3은 정적 테스팅을 비-실행 작업 산출물에‘도’ 적용할 수 있다고 한다. 소스 코드도 정적 테스팅 대상이다(3.1.1).","정답. 3.1.3에 나오는 차이점이다.","장애를 일으키는 것은 동적 테스팅이다. 정적 테스팅은 결함을 직접 식별한다(3.1.3)."],"ref":"3.1.3"},{"id":"c3-021","ch":3,"lo":"FL-3.2.2","k":2,"q":"리뷰를 시작하기 전에 담당자가 다음을 확인했다.\n- 모든 참여자가 리뷰 대상 설계서에 접근할 수 있는가\n- 각자 자신의 역할과 책임을 이해하고 있는가\n- 리뷰에 필요한 자료를 모두 받았는가\n이 확인 작업은 리뷰 프로세스의 어떤 활동에 해당하는가?","opts":["계획(planning)","개별 리뷰(individual review)","리뷰 착수(review initiation)","논의 및 분석(communication and analysis)"],"ans":[2],"exp":"3.2.2: 리뷰 착수의 목표는 관련된 모든 사람과 사항이 리뷰를 시작할 준비가 되었는지 확인하는 것이다. 모든 참여자가 작업 산출물에 접근할 수 있는지, 자신의 역할과 책임을 이해하는지, 리뷰에 필요한 것들을 받았는지 확인하는 과정이 포함된다.","why":["계획에서는 목적, 리뷰 대상 작업 산출물, 평가할 품질 특성, 집중할 영역, 완료 조건, 적용 표준 같은 추가 정보, 공수, 일정 등 리뷰의 범위를 정의한다(3.2.2).","개별 리뷰에서는 각 리뷰어가 리뷰 기법을 적용해 이상 사항, 권장 사항, 의문 사항을 식별하고 기록한다.","정답. 3.2.2의 리뷰 착수 설명과 일치한다.","논의 및 분석에서는 식별한 이상 사항을 분석하고 논의해 상태, 담당자, 필요 조치를 판단한다."],"ref":"3.2.2"},{"id":"c3-022","ch":3,"lo":"FL-3.2.2","k":2,"q":"리뷰를 준비하면서 다음 내용을 정했다.\n- 리뷰 목적과 리뷰 대상 작업 산출물\n- 평가할 품질 특성과 집중할 영역\n- 완료 조건과 적용할 코딩 표준\n- 공수와 리뷰 일정\n이 작업이 이루어지는 리뷰 프로세스 활동은?","opts":["리뷰 착수(review initiation)","계획(planning)","수정 및 보고(fixing and reporting)","개별 리뷰(individual review)"],"ans":[1],"exp":"3.2.2: 계획 단계에서 목적, 리뷰 대상 작업 산출물, 평가할 품질 특성, 집중할 영역, 완료 조건, 적용 표준과 같은 추가 정보, 공수, 리뷰 일정 등으로 구성되는 리뷰의 범위를 정의해야 한다.","why":["리뷰 착수는 모든 사람과 사항이 리뷰를 시작할 준비가 되었는지 확인하는 활동이다(3.2.2).","정답. 3.2.2의 계획 설명과 일치한다.","수정 및 보고에서는 결함 보고서를 작성하고, 완료 조건을 충족하면 작업 산출물을 승인하며, 리뷰 결과를 보고한다.","개별 리뷰는 리뷰어가 리뷰 기법을 적용해 이상 사항 등을 식별하는 활동이다."],"ref":"3.2.2"},{"id":"c3-023","ch":3,"lo":"FL-3.2.2","k":2,"q":"리뷰 프로세스의 논의 및 분석(communication and analysis) 활동에 대한 설명으로 옳은 것은?","opts":["리뷰 중 식별한 이상 사항(anomaly)은 모두 결함이므로, 논의 없이 곧바로 각각에 대한 결함 보고서를 작성한다","각 리뷰어가 체크리스트 기반 리뷰 같은 리뷰 기법을 적용해 이상 사항, 권장 사항, 의문 사항을 식별하고 기록한다","모든 결함에 대한 결함 보고서를 작성하고, 완료 조건을 충족하면 작업 산출물을 승인한 뒤 리뷰 결과를 보고한다","각 이상 사항의 상태, 담당자, 필요 조치를 판단하고, 리뷰한 작업 산출물의 품질 수준과 후속 조치를 결정한다"],"ans":[3],"exp":"3.2.2: 리뷰 중에 확인한 이상 사항(anomaly)이 반드시 결함은 아니므로 모든 이상 사항을 분석하고 논의해야 한다. 각 이상 사항의 상태, 담당자, 필요 조치를 판단한다. 보통 리뷰 회의에서 이루어지며, 참가자들은 작업 산출물의 품질 수준과 필요한 후속 조치도 결정한다.","why":["3.2.2: 리뷰 중 확인한 이상 사항이 반드시 결함은 아니므로 모두 분석하고 논의해야 한다.","개별 리뷰 활동에 대한 설명이다(3.2.2).","결함 보고서 작성, 작업 산출물 승인, 리뷰 결과 보고는 수정 및 보고 활동에 대한 설명이다(3.2.2).","정답. 3.2.2의 논의 및 분석 설명과 일치한다. 이상 사항이 반드시 결함은 아니어서 이 활동에서 분석하고 논의한다."],"ref":"3.2.2"},{"id":"c3-024","ch":3,"lo":"FL-3.2.2","k":2,"q":"ISO/IEC 20246 표준에 기반한 리뷰 프로세스에 대한 설명으로 옳은 것은?","opts":["작업 산출물이 너무 커서 한 번의 리뷰로 다룰 수 없으면 리뷰 프로세스를 여러 번 수행할 수 있다","보편적 리뷰 프로세스는 표준이 정한 고정된 절차이므로 특정 상황에 맞게 조정할 수 없다","필요한 리뷰가 비공식적일수록 각 활동에 대해 설명된 작업 중 수행할 것이 더 많아진다","수정 및 보고 활동에서는 결함마다 결함 보고서를 쓰지 않고, 저자가 직접 고친 내용만 기록해 둔다"],"ans":[0],"exp":"3.2.2: 작업 산출물이 너무 커서 한 번의 리뷰로 다룰 수 없는 경우가 많으며, 전체 작업 산출물의 리뷰를 끝내기 위해 리뷰 프로세스를 여러 번 수행할 수 있다.","why":["정답. 3.2.2: 전체 작업 산출물의 리뷰를 끝내기 위해 리뷰 프로세스를 여러 번 수행할 수 있다.","3.2.2: ISO/IEC 20246은 특정 상황에 맞게 리뷰 프로세스를 조정할 수 있는 체계적이면서 유연한 프레임워크를 제공한다.","거꾸로다. 리뷰가 공식적일수록 수행할 작업이 더 많아진다(3.2.2).","3.2.2: 모든 결함에 대한 결함 보고서를 작성해 후속 조치가 추적 가능하도록 한다."],"ref":"3.2.2"},{"id":"c3-025","ch":3,"lo":"FL-3.2.4","k":2,"q":"새로 합류한 팀원들에게 결제 흐름 설계를 이해시키고 개선 아이디어도 모으려고, 설계서를 작성한 저자가 직접 이끄는 리뷰를 열었다. 참가자들은 사전에 개별 리뷰를 하지 않고 회의에 참석했다.\n이 리뷰 유형으로 가장 적절한 것은?","opts":["인스펙션(inspection)","워크쓰루(walkthrough)","기술 리뷰(technical review)","비공식 리뷰(informal review)"],"ans":[1],"exp":"3.2.4: 워크쓰루는 저자가 리더가 되며, 품질 평가 및 신뢰 구축, 리뷰어 교육, 합의 도출, 새로운 아이디어 창출, 저자의 개선을 위한 동기 부여 및 지원, 이상 사항 발견 등 여러 목적을 가진다. 리뷰어는 워크쓰루 전에 개별 리뷰를 할 수도 있지만 반드시 해야 하는 것은 아니다.","why":["인스펙션은 보편적 프로세스를 철저히 따르며, 저자는 리뷰 리더가 될 수 없다(3.2.4).","정답. 저자가 이끌고, 리뷰어 교육과 새 아이디어 창출이 목적이며, 사전 개별 리뷰가 필수가 아니라는 점이 워크쓰루와 일치한다.","기술 리뷰는 중재자가 리더가 되고, 기술적인 자격을 갖춘 리뷰어가 수행한다(3.2.4).","비공식 리뷰의 주요 목적은 이상 사항 식별이다. 저자가 리더가 되어 리뷰어 교육 등 여러 목적을 가지는 것은 워크쓰루의 특징이다(3.2.4)."],"ref":"3.2.4"},{"id":"c3-026","ch":3,"lo":"FL-3.2.4","k":2,"q":"아키텍처 팀이 두 가지 데이터베이스 구조 중 무엇을 채택할지 정해야 한다. 기술적인 자격을 갖춘 리뷰어들이 참여하고 중재자(moderator)가 리더가 되어, 이 기술 문제에 대한 합의를 도출하고 결정을 내리는 것을 목적으로 리뷰를 진행한다.\n이 리뷰 유형은?","opts":["기술 리뷰(technical review)","워크쓰루(walkthrough)","비공식 리뷰(informal review)","인스펙션(inspection)"],"ans":[0],"exp":"3.2.4: 기술 리뷰는 기술적인 자격을 갖춘 리뷰어가 수행하고 중재자가 리더가 된다. 목적은 기술 문제에 대한 합의를 도출하고 결정을 내리는 것과 함께 이상 사항 식별, 품질 평가 및 신뢰 구축, 새로운 아이디어 창출, 저자의 개선을 위한 동기 부여 및 지원이다.","why":["정답. 리뷰어 자격, 리더(중재자), 목적이 모두 3.2.4의 기술 리뷰 설명과 일치한다.","워크쓰루는 저자가 리더가 된다(3.2.4).","비공식 리뷰는 정의된 프로세스를 따르지 않으며, 주요 목적은 이상 사항 식별이다(3.2.4).","인스펙션의 주요 목적은 이상 사항을 최대한 많이 찾는 것이다(3.2.4)."],"ref":"3.2.4"},{"id":"c3-027","ch":3,"lo":"FL-3.2.4","k":2,"q":"한 팀이 안전 관련 모듈의 설계서를 인스펙션(inspection)으로 리뷰하려고 한다. 설계서의 저자는 A다.\n다음 역할 배정 중 실라버스에 맞는 것은?","opts":["A가 리뷰 리더를 맡아 참여자를 정하고 일정을 잡는다","A가 서기를 맡아 이상 사항과 결정 사항을 기록한다","B가 리뷰 리더, C가 서기를 맡고, A는 저자로서 설계서를 수정한다","A가 리뷰 리더와 서기를 함께 맡고, 회의 운영은 중재자 B가 맡는다"],"ans":[2],"exp":"3.2.4: 인스펙션에서는 저자가 리뷰 리더나 서기가 될 수 없다. 저자가 아닌 사람이 리뷰 리더와 서기를 맡고, 저자는 작업 산출물을 작성하고 수정하는 책임(3.2.3)을 맡는 배정만 규칙에 맞는다.","why":["3.2.4: 인스펙션에서는 저자가 리뷰 리더가 될 수 없다.","3.2.4: 인스펙션에서는 저자가 서기가 될 수 없다.","정답. 저자가 리뷰 리더도 서기도 맡지 않았다.","인스펙션에서 저자는 리뷰 리더도 서기도 될 수 없다(3.2.4). 한 명이 여러 역할을 맡을 수 있다는 점(3.2.3)이 이 제한을 없애지는 않는다."],"ref":"3.2.4"},{"id":"c3-028","ch":3,"lo":"FL-3.2.4","k":2,"q":"리뷰 유형과 리뷰의 공식성 수준에 대한 설명으로 옳은 것은?","opts":["리뷰의 공식성 수준은 작업 산출물의 중요도와 관계없이 참여하는 리뷰어 수로 정해진다","리뷰 유형은 리뷰 목적만으로 선택하며, 가용 자원이나 사내 문화 같은 요소는 고려하지 않는다","기술 리뷰는 저자가 리더가 되며, 리뷰어에게 기술적인 자격은 요구되지 않는다","같은 작업 산출물을 처음에는 비공식적으로, 나중에는 보다 공식적으로 리뷰할 수 있다"],"ans":[3],"exp":"3.2.4: 처음에는 비공식적으로 리뷰하고 나중에 보다 공식적으로 리뷰하는 등, 같은 작업 산출물도 여러 형태로 리뷰할 수 있다.","why":["3.2.4: 공식성 수준은 사용 중인 SDLC, 개발 프로세스의 성숙도, 작업 산출물의 중요도와 복잡성, 법적 또는 규제 요구사항, 감사용 기록의 필요성 등에 따라 달라진다. 작업 산출물의 중요도와 관계없다는 말은 틀리다.","3.2.4: 목적 외에도 프로젝트 요구사항, 가용 자원, 작업 산출물 유형과 리스크, 비즈니스 영역, 사내 문화 같은 요소가 선택에 반영된다.","3.2.4: 기술 리뷰는 기술적인 자격을 갖춘 리뷰어가 수행하고 중재자가 리더가 된다.","정답. 3.2.4: 처음에는 비공식적으로 리뷰하고 나중에 보다 공식적으로 리뷰하는 등, 같은 작업 산출물도 여러 형태로 리뷰할 수 있다."],"ref":"3.2.4"},{"id":"c3-029","ch":3,"lo":"FL-3.2.4","k":2,"q":"비공식 리뷰(informal review)와 인스펙션(inspection)을 비교한 설명 중 옳은 것 두 개를 고르시오.","opts":["비공식 리뷰의 주요 목적은 리뷰어 교육과 합의 도출이다","비공식 리뷰는 정의된 프로세스를 따르지 않으며, 공식적인 결과 문서도 요구하지 않는다","인스펙션은 보편적 리뷰 프로세스 중 필요한 활동만 골라 수행한다","인스펙션에서는 메트릭을 수집하지 않으므로 리뷰 프로세스 개선에는 활용하지 않는다","인스펙션의 주요 목적은 이상 사항을 최대한 많이 찾는 것이다"],"ans":[1,4],"exp":"3.2.4: 비공식 리뷰는 정의된 프로세스를 따르지 않으며 공식적인 결과 문서도 요구하지 않는다(주요 목적: 이상 사항 식별). 인스펙션은 가장 공식적인 리뷰 유형으로 주요 목적은 이상 사항을 최대한 많이 찾는 것이다.","why":["3.2.4: 비공식 리뷰의 주요 목적은 이상 사항 식별이다. 리뷰어 교육과 합의 도출은 워크쓰루의 목적에 나온다.","정답. 3.2.4의 비공식 리뷰 설명이다.","3.2.4: 인스펙션은 가장 공식적인 리뷰 유형이므로 보편적 프로세스(3.2.2)를 철저히 따라야 한다.","3.2.4: 인스펙션에서는 메트릭을 수집해 리뷰 프로세스를 포함한 전체 SDLC를 개선하는 데 사용한다.","정답. 3.2.4의 인스펙션 설명이다."],"ref":"3.2.4"},{"id":"c4k2-001","ch":4,"lo":"FL-4.1.1","k":2,"q":"온라인 쇼핑몰 팀이 결제 모듈의 내부 코드를 전면 리팩토링했다. 내부 구조는 크게 바뀌었지만, 요구되는 동작(입력에 대한 기대 결과)은 이전과 똑같다.\n기존 테스트 케이스에 대한 설명으로 실라버스와 일치하는 것은?","opts":["구문 테스팅(statement testing)으로 도출한 테스트 케이스는 명세 기반 기법으로 만든 것이므로 수정 없이 그대로 유효하다.","분기 테스팅(branch testing)으로 도출한 테스트 케이스는 소프트웨어 설계 방식에 의존하지 않으므로 그대로 유효하다.","경계값 분석(boundary value analysis)으로 도출한 테스트 케이스는 구현 방식에 의존하지 않으므로 여전히 유효하다.","동등 분할(equivalence partitioning)로 도출한 테스트 케이스는 내부 구조를 참조해 만든 것이므로 다시 설계해야 한다."],"ans":[2],"exp":"4.1: 블랙박스 테스트 기법(black-box test technique, 명세 기반 기법이라고도 함)은 내부 구조를 참조하지 않고 테스트 대상의 명시된 동작을 분석한다. 그래서 테스트 케이스가 구현 방식에 의존하지 않는다. 구현이 바뀌어도 필요한 동작이 같으면 테스트 케이스는 여전히 유효하다. 경계값 분석은 블랙박스 기법이다(4.2).","why":["구문 테스팅은 화이트박스 테스트 기법(구조 기반 기법)이다(4.1, 4.3). 명세 기반 기법이 아니다.","분기 테스팅은 화이트박스 기법이라 테스트 케이스가 소프트웨어 설계 방식에 의존한다(4.1).","정답. 블랙박스 기법의 테스트 케이스는 구현이 바뀌어도 요구 동작이 같으면 유효하다(4.1).","동등 분할은 블랙박스 기법이라 내부 구조를 참조하지 않는다(4.1, 4.2.1)."],"ref":"4.1"},{"id":"c4k2-002","ch":4,"lo":"FL-4.1.1","k":2,"q":"테스터 네 명이 새 회원 등급 기능의 테스트를 각자 다른 방식으로 설계했다.\n다음 중 블랙박스 테스트 기법(black-box test technique)을 적용한 사람은?","opts":["민수: 소스 코드로 그린 제어 흐름 그래프에서 아직 실행되지 않은 분기를 찾아, 그 분기를 지나가는 테스트를 추가했다.","지영: 다른 유사 애플리케이션에서 자주 발생했던 장애 유형을 떠올려, 그런 장애를 일으킬 만한 테스트를 설계했다.","수진: 시간을 정해 놓고 테스트 차터를 지침으로 삼아, 기능을 배워가며 테스트의 설계·실행·평가를 동시에 진행했다.","현우: 요구사항 명세에 정의된 '구매 금액과 가입 기간에 따른 등급 결정 규칙'의 조건 조합을 표로 정리해 테스트를 설계했다."],"ans":[3],"exp":"4.1: 블랙박스 기법은 내부 구조를 보지 않고 테스트 대상의 명시된 동작(명세)을 분석해 테스트를 만든다. 현우는 명세에 있는 비즈니스 규칙의 조건 조합을 표로 정리했다. 이것은 블랙박스 기법인 결정 테이블 테스팅(4.2.3)이다.","why":["제어 흐름 그래프와 분기를 기반으로 한 것은 화이트박스 기법인 분기 테스팅이다(4.3.2).","유사 애플리케이션의 장애 유형에 대한 지식을 쓰는 것은 경험 기반 기법인 오류 추정이다(4.4.1).","시간을 정해 두고 테스트 차터에 따라 설계·실행·평가를 동시에 하는 것은 경험 기반 기법인 탐색적 테스팅이다(4.4.2).","정답. 명세의 조건 조합을 표로 정리하는 결정 테이블 테스팅은 블랙박스 기법이다(4.2.3)."],"ref":"4.1"},{"id":"c4k2-003","ch":4,"lo":"FL-4.1.1","k":2,"q":"실라버스는 어떤 기법 분류에 대해 '테스트 대상의 설계나 구현이 끝난 후에 테스트 케이스를 만들 수 있다'고 설명한다.\n그 기법 분류와 이유를 올바르게 짝지은 것은?","opts":["블랙박스 테스트 기법 – 테스트 대상의 명시된 동작을 분석해야 하기 때문","화이트박스 테스트 기법 – 테스트 케이스가 소프트웨어 설계 방식에 의존하기 때문","경험 기반 테스트 기법 – 기법의 효과성이 테스터의 능력에 따라 크게 달라지기 때문","화이트박스 테스트 기법 – 명세가 모호하거나 불완전해도 결함을 감지할 수 있기 때문"],"ans":[1],"exp":"4.1: 화이트박스 테스트 기법(white-box test technique, 구조 기반 기법이라고도 함)은 테스트 대상의 내부 구조와 처리를 분석한다. 테스트 케이스가 소프트웨어 설계 방식에 의존하므로, 설계나 구현이 끝난 후에 만들 수 있다.","why":["블랙박스 기법의 테스트 케이스는 구현 방식에 의존하지 않는다(4.1). 설계·구현 후에 만들 수 있다고 설명된 분류가 아니다.","정답(4.1).","효과성이 테스터 능력에 좌우되는 것은 경험 기반 기법의 특징이 맞다. 하지만 실라버스는 경험 기반 기법을 설계·구현 후에 만들 수 있다고 설명하지 않는다(4.1).","분류는 맞지만 이유가 틀렸다. 명세가 모호해도 결함을 감지할 수 있다는 것은 화이트박스 테스팅의 강점(4.3.3)이지, 테스트 케이스를 만드는 시점의 이유가 아니다."],"ref":"4.1"},{"id":"c4k2-004","ch":4,"lo":"FL-4.1.1","k":2,"q":"한 팀이 블랙박스 테스트 기법과 화이트박스 테스트 기법으로 테스트를 충분히 설계했다. 그런데 테스트 리더가 숙련 테스터의 경험 기반 테스트 기법(experience-based test technique)도 추가하자고 제안했다.\n이 제안의 근거로 실라버스와 일치하는 것은?","opts":["경험 기반 테스트 기법은 블랙박스·화이트박스 기법으로 식별하지 못할 수 있는 결함을 찾을 수 있어 두 기법을 보완한다.","경험 기반 테스트 기법은 테스터의 능력과 관계없이 늘 같은 효과를 내므로 결과를 예측하기 쉽다.","경험 기반 테스트 기법은 블랙박스·화이트박스 기법을 대체하므로, 추가하면 기존 테스트 케이스를 없앨 수 있다.","경험 기반 테스트 기법은 실제 코드 커버리지를 객관적으로 측정할 수 있게 해 준다."],"ans":[0],"exp":"4.1: 경험 기반 테스트 기법은 블랙박스·화이트박스 기법으로는 식별하지 못할 수 있는 결함을 찾을 수 있게 해 준다. 그래서 경험 기반 기법은 두 기법을 보완한다.","why":["정답(4.1).","실라버스는 경험 기반 기법의 효과성이 테스터의 능력에 따라 크게 달라진다고 한다(4.1).","경험 기반 기법은 블랙박스·화이트박스 기법을 '보완'한다(4.1). 대체한다는 설명은 없다.","객관적인 커버리지 측정값을 주는 것은 화이트박스 커버리지 측정이다(4.3.3)."],"ref":"4.1"},{"id":"c4k2-005","ch":4,"lo":"FL-4.1.1","k":2,"q":"테스트 기법(test technique)에 대한 설명으로 옳은 것을 두 개 고르시오.","opts":["테스트 기법은 가능한 모든 입력 조합을 빠짐없이 테스트하도록 테스트 케이스 수를 최대한 늘려 준다.","테스트 기법은 테스트 분석(무엇을 테스트할지)과 테스트 설계(어떻게 테스트할지)를 지원한다.","테스트 기법은 테스트 실행 단계에서만 쓰이며, 테스트 컨디션 정의와는 관계가 없다.","이 실라버스는 테스트 기법을 블랙박스와 화이트박스 두 가지로만 분류한다.","테스트 기법은 테스터가 커버리지 항목과 테스트 데이터를 식별하는 데 도움을 준다."],"ans":[1,4],"exp":"4.1: 테스트 기법은 테스트 분석(무엇을 테스트할지)과 테스트 설계(어떻게 테스트할지)를 지원한다. 적은 수이지만 충분한 테스트 케이스를 체계적으로 만들게 해 주고, 테스트 컨디션 정의와 커버리지 항목·테스트 데이터 식별을 돕는다.","why":["테스트 기법은 '적은 수이지만 충분한' 테스트 케이스를 체계적으로 만들게 해 준다(4.1). 수를 최대로 늘리는 것이 아니다.","정답(4.1).","테스트 기법은 테스트 분석과 설계에서 테스트 컨디션을 정의하는 데 도움을 준다(4.1).","실라버스는 블랙박스, 화이트박스, 경험 기반의 세 가지로 분류한다(4.1).","정답(4.1)."],"ref":"4.1"},{"id":"c4k2-006","ch":4,"lo":"FL-4.3.1","k":2,"q":"다음 의사코드에서 실행 가능한 구문에는 S1~S8 번호를 붙였다(ENDIF는 구문으로 세지 않는다).\n테스트 케이스 하나(age = 10)만 실행했을 때 달성한 구문 커버리지(statement coverage)는?","code":"S1  READ age\nS2  fee = 10000\nS3  IF age < 13 THEN\nS4      fee = 5000\n    ENDIF\nS5  IF age >= 65 THEN\nS6      fee = 0\nS7      PRINT \"무료 입장\"\n    ENDIF\nS8  PRINT fee","opts":["50%","75%","62.5%","100%"],"ans":[1],"exp":"4.3.1: 구문 커버리지 = 테스트 케이스가 실행한 구문 수 ÷ 실행 가능한 구문 총수 × 100.\n① S1, S2, S3 실행\n② 10 < 13이 참이므로 S4 실행\n③ 조건을 검사하는 S5 실행, 10 >= 65가 거짓이므로 S6, S7은 건너뜀\n④ S8 실행\n실행한 구문은 S1, S2, S3, S4, S5, S8의 6개. 6 ÷ 8 = 75%.\n검산: 실행되지 않은 구문은 S6, S7 두 개뿐이므로 (8 − 2) ÷ 8 = 75%.","why":["50%는 8개 중 4개만 센 값이다. 조건을 검사하는 S3, S5도 실행된 구문이다.","정답. 6 ÷ 8 = 75%.","62.5%(5 ÷ 8)는 실행된 구문 하나를 빠뜨린 값이다. S5는 조건이 거짓이어도 검사하려고 실행된다.","S6, S7은 age >= 65가 참일 때만 실행되므로 100%가 아니다."],"ref":"4.3.1"},{"id":"c4k2-007","ch":4,"lo":"FL-4.3.1","k":2,"q":"주문 모듈의 단위 테스트를 마친 개발자가 구문 커버리지(statement coverage) 100%를 달성했다고 보고했다.\n이 결과만으로 실라버스 기준에서 보장된다고 할 수 있는 것은?","opts":["코드의 모든 분기가 적어도 한 번씩 실행되었다.","실행된 구문에 들어 있던 결함은 입력 데이터와 관계없이 모두 장애로 드러나 식별되었다.","코드의 모든 실행 가능한 구문이 적어도 한 번씩 실행되었다.","구현되지 않고 누락된 요구사항이 없다는 것이 확인되었다."],"ans":[2],"exp":"4.3.1: 100% 구문 커버리지를 달성하면 코드의 모든 실행 가능한 구문을 적어도 한 번은 실행했다는 것이 보장된다. 그렇다고 결함이 반드시 식별되는 것은 아니고(예: 분모가 0일 때만 실패하는 나눗셈), 모든 결정 논리를 테스트했다고 보장하는 것도 아니다(모든 분기가 실행되지 않았을 수 있다).","why":["100% 구문 커버리지가 모든 결정 논리를 테스트했다고 보장하지는 않는다. 코드의 모든 분기가 실행되지 않았을 수 있다(4.3.1).","구문을 실행했다고 결함이 반드시 식별되는 것은 아니다. 분모가 0일 때만 실패하는 나눗셈 같은 데이터 종속 결함은 놓칠 수 있다(4.3.1).","정답(4.3.1).","요구사항이 구현되지 않은 누락 결함은 화이트박스 테스팅으로 식별하지 못할 수 있다(4.3.3)."],"ref":"4.3.1"},{"id":"c4k2-008","ch":4,"lo":"FL-4.3.1","k":2,"q":"다음 코드는 테스트에서 구문 커버리지 100%를 달성했고, 테스트 중 장애도 없었다. 그런데 운영 중 count가 0인 데이터가 들어오자 장애가 발생했다.\n테스트에서 이 결함을 찾지 못한 이유로 가장 적절한 것은?","code":"READ total, count\navg = total / count\nPRINT avg","opts":["구문을 실행했다고 결함이 반드시 식별되지는 않으며, 분모가 0일 때만 실패하는 나눗셈 같은 데이터 종속 결함은 놓칠 수 있다.","나눗셈 구문은 실행 가능한 구문이 아니어서 구문 커버리지 계산에서 빠졌기 때문이다.","구문 커버리지 100%를 달성했다면 이 결함은 반드시 식별됐어야 하므로, 커버리지 측정이 잘못된 것이다.","분기 커버리지 100%를 목표로 했다면 모든 데이터 값이 실행되어 이 결함을 반드시 찾았을 것이다."],"ans":[0],"exp":"4.3.1: 100% 구문 커버리지는 모든 실행 가능한 구문을 한 번 이상 실행했다는 뜻이다. 하지만 구문을 실행해도 결함이 늘 식별되지는 않는다. 실라버스는 분모가 0일 때만 실패하는 나눗셈 같은 데이터 종속 결함을 예로 든다.","why":["정답(4.3.1).","나눗셈 구문도 실행 가능한 구문이며, 테스트에서 실행되었다.","구문을 실행해도 결함이 식별되지 않을 수 있다(4.3.1). 커버리지 100%와 결함 미식별은 함께 일어날 수 있다.","분기를 실행해도 결함이 늘 식별되는 것은 아니다(4.3.2). 분기 커버리지는 분기를 세는 것이지, 모든 데이터 값을 실행하는 것이 아니다."],"ref":"4.3.1"},{"id":"c4k2-009","ch":4,"lo":"FL-4.3.1","k":2,"q":"다음 코드를 테스트 케이스 하나(amount = 70000)로 테스트했다.\n이 테스트에 대한 설명으로 옳은 것은?","code":"READ amount\nshipping = 3000\nIF amount >= 50000 THEN\n    shipping = 0\nENDIF\nPRINT amount + shipping","opts":["모든 구문이 실행되어 구문 커버리지가 100%이므로, 결정 논리도 모두 테스트되었다.","IF 결정의 거짓 결과(amount < 50000)가 실행되지 않았으므로 구문 커버리지는 100%가 아니다.","구문 커버리지는 100%이고, IF 결정의 참·거짓 분기도 이 테스트로 모두 실행되었다.","구문 커버리지는 100%이지만, amount < 50000일 때 지나가는 분기는 실행되지 않았다."],"ans":[3],"exp":"4.3.1: amount = 70000이면 조건이 참이라 shipping = 0까지 포함해 코드의 모든 실행 가능한 구문(READ, 두 대입문, IF, PRINT)이 실행된다. 그래서 구문 커버리지는 100%다. 하지만 100% 구문 커버리지가 모든 결정 논리를 테스트했다고 보장하지는 않는다. 이 예에서는 조건이 거짓일 때(amount < 50000) 지나가는 분기가 실행되지 않았다.","why":["모든 구문이 실행된 것은 맞지만, 100% 구문 커버리지가 모든 결정 논리를 테스트했다는 보장은 아니다(4.3.1). 이 테스트에서도 거짓 쪽 분기는 실행되지 않았다.","거짓 결과(amount < 50000)가 실행되지 않은 것은 맞다. 하지만 거짓일 때만 실행되는 구문이 없어서 모든 구문은 실행되었다. 구문 커버리지는 100%다(4.3.1).","amount = 70000은 조건이 참인 쪽만 실행하므로 거짓 쪽 분기는 실행되지 않았다.","정답. 모든 구문은 실행됐지만 조건이 거짓(amount < 50000)일 때 지나가는 분기는 실행되지 않았다(4.3.1)."],"ref":"4.3.1"},{"id":"c4k2-010","ch":4,"lo":"FL-4.3.2","k":2,"q":"같은 모듈에 대해 두 개의 테스트 세트를 만들었다.\n• 테스트 세트 A: 구문 커버리지 100% 달성\n• 테스트 세트 B: 분기 커버리지(branch coverage) 100% 달성\n실라버스 기준으로 옳은 설명은?","opts":["세트 A는 실행 가능한 구문을 모두 한 번 이상 실행했으므로 분기 커버리지 100%도 함께 달성한다.","세트 B가 구문 커버리지 100%를 달성하는지는 코드의 구조를 직접 분석해 보기 전에는 알 수 없다.","세트 B는 구문 커버리지 100%도 달성하지만, 세트 A는 분기 커버리지 100%가 보장되지 않는다.","두 세트는 같은 커버리지 항목(실행 가능한 구문)을 사용하므로 어느 쪽이든 서로 바꿔 써도 된다."],"ans":[2],"exp":"4.3.2: 분기 커버리지는 구문 커버리지를 포함한다. 100% 분기 커버리지를 달성하는 테스트 케이스 집합은 100% 구문 커버리지도 달성하지만, 그 반대는 성립하지 않는다.","why":["반대 방향은 성립하지 않는다. 모든 구문을 실행해도 모든 분기가 실행된다는 보장은 없다(4.3.1, 4.3.2).","100% 분기 커버리지를 달성하는 테스트 케이스 집합은 100% 구문 커버리지도 달성한다(4.3.2). 코드를 분석하지 않아도 알 수 있다.","정답. 분기 커버리지는 구문 커버리지를 포함하지만, 그 반대는 성립하지 않는다(4.3.2).","커버리지 항목이 다르다. 실행 가능한 구문은 구문 테스팅의 커버리지 항목이고, 분기 테스팅의 커버리지 항목은 분기다(4.3.1, 4.3.2)."],"ref":"4.3.2"},{"id":"c4k2-011","ch":4,"lo":"FL-4.3.2","k":2,"q":"분기 테스팅(branch testing)에서 말하는 분기(branch)에 대한 설명으로 옳은 것은?","opts":["분기는 제어 흐름 그래프에서 두 노드 간 제어의 이동이며, 직선적 코드처럼 조건 없이 이동하는 것도 분기에 포함된다.","분기 커버리지는 조건 분기만 세며, 조건 없이 이동하는 무조건 분기는 분기 총수에 넣지 않는다.","루프에서 계속할지 종료할지를 정하는 결정은 분기가 아니므로 분기 테스팅의 대상이 아니다.","스위치/케이스(switch/case) 구문의 각 결과는 하나의 구문으로 취급되므로 조건 분기에 해당하지 않는다."],"ans":[0],"exp":"4.3.2: 분기는 제어 흐름 그래프에서 두 노드 간 제어의 이동이다. 이동은 조건 없이(직선적 코드) 또는 조건에 따라(결정문 결과) 이루어진다. 100% 분기 커버리지를 달성하면 무조건 분기와 조건 분기를 모두 실행한 것이다.","why":["정답(4.3.2).","100% 분기 커버리지는 무조건 분기와 조건 분기를 모두 실행하는 것이다(4.3.2).","루프의 종료/계속 결정은 실라버스가 드는 조건 분기의 예다(4.3.2).","스위치/케이스 구문의 결과도 실라버스가 드는 조건 분기의 예다(4.3.2)."],"ref":"4.3.2"},{"id":"c4k2-012","ch":4,"lo":"FL-4.3.2","k":2,"q":"다음 코드에 테스트 케이스 두 개(score = 100, score = 75)를 실행했다.\n분기 커버리지 100%를 달성하려면 어떤 테스트 케이스를 추가해야 하는가?","code":"READ score\nIF score >= 60 THEN\n    result = \"합격\"\nELSE\n    result = \"불합격\"\nENDIF\nIF score == 100 THEN\n    PRINT \"만점\"\nENDIF\nPRINT result","opts":["score = 60","score = 59","score = 99","추가할 필요 없다. 두 테스트 케이스로 이미 분기 커버리지 100%다."],"ans":[1],"exp":"4.3.2: 조건 분기는 IF 결정문의 참·거짓 결과다.\n① score = 100: 첫 IF 참, 둘째 IF 참\n② score = 75: 첫 IF 참, 둘째 IF 거짓\n③ 아직 실행되지 않은 것은 첫 IF(score >= 60)의 거짓 결과, 즉 result = \"불합격\"으로 가는 분기다.\n60보다 작은 score = 59를 추가하면 첫 IF 거짓, 둘째 IF 거짓이 실행되어 모든 분기가 실행된다.\n검산: 60, 99는 둘 다 첫 IF 참·둘째 IF 거짓이라 새로 실행하는 분기가 없다.","why":["60은 score >= 60이 참이므로 이미 실행된 분기(첫 IF 참, 둘째 IF 거짓)만 다시 지난다.","정답. 59는 첫 IF의 거짓 분기를 실행한다.","99도 첫 IF 참, 둘째 IF 거짓이라 이미 실행된 분기만 지난다.","첫 IF의 거짓 결과(불합격 쪽 분기)가 아직 실행되지 않았으므로 100%가 아니다."],"ref":"4.3.2"},{"id":"c4k2-013","ch":4,"lo":"FL-4.3.2","k":2,"q":"다음 코드에는 VIP 회원이 쿠폰까지 쓰면 할인율 합이 100을 넘어 결제 금액이 음수가 되는 결함이 있다. 테스트 케이스 두 개로 분기 커버리지 100%를 달성했지만 이 결함은 발견되지 않았다.\n• TC1: isVip = 참, hasCoupon = 거짓\n• TC2: isVip = 거짓, hasCoupon = 참\n결함을 놓친 이유로 가장 적절한 것은?","code":"READ isVip, hasCoupon, price\nrate = 0\nIF isVip THEN\n    rate = rate + 30\nENDIF\nIF hasCoupon THEN\n    rate = rate + 80\nENDIF\nPAY price * (100 - rate) / 100","opts":["두 테스트 케이스로는 두 번째 IF(hasCoupon)의 참 분기, 즉 rate에 80을 더하는 구문이 실행되지 않았기 때문이다.","분기 커버리지 100%는 구문 커버리지 100%를 보장하지 않으므로 PAY 구문이 실행되지 않았기 때문이다.","분기 커버리지는 조건 분기만 커버리지 항목으로 세므로, 무조건 분기에 있는 결함은 찾을 수 없기 때문이다.","분기를 모두 실행해도, 두 IF가 모두 참인 특정 경로를 실행해야 드러나는 결함은 감지하지 못할 수 있기 때문이다."],"ans":[3],"exp":"4.3.2: TC1은 첫 IF 참·둘째 IF 거짓, TC2는 첫 IF 거짓·둘째 IF 참을 실행한다. 두 IF의 참·거짓이 모두 실행되어 분기 커버리지는 100%다. 하지만 결함은 두 IF가 모두 참인 경로(rate = 30 + 80 = 110)에서만 드러난다. 실라버스는 분기를 실행해도 코드의 특정 경로를 실행해야 하는 결함은 감지하지 못할 수 있다고 설명한다.","why":["TC2에서 hasCoupon이 참이므로 두 번째 IF의 참 분기(rate = rate + 80)는 실행되었다.","반대다. 100% 분기 커버리지는 100% 구문 커버리지를 보장한다(4.3.2). PAY 구문도 두 테스트 모두에서 실행되었다.","분기 커버리지의 커버리지 항목은 무조건 분기와 조건 분기 모두다(4.3.2).","정답. 분기를 실행해도 코드의 특정 경로를 실행해야 하는 결함은 감지하지 못할 수 있다(4.3.2)."],"ref":"4.3.2"},{"id":"c4k2-014","ch":4,"lo":"FL-4.3.3","k":2,"q":"레거시 정산 시스템을 테스트하려 한다. 요구사항 명세는 몇 년 전에 작성되어 현재 동작과 맞지 않고 빠진 내용도 많다. 소스 코드는 확보되어 있다.\n이 상황에서 화이트박스 테스팅의 가치에 대한 설명으로 실라버스와 일치하는 것은?","opts":["화이트박스 테스트 기법은 전체 구현을 고려하므로, 명세가 모호하거나 뒤떨어지고 불완전해도 결함 감지에 도움이 된다.","화이트박스 테스트 기법은 명세에 명시된 동작 분석을 기반으로 하므로, 명세를 먼저 최신화하지 않으면 사용할 수 없다.","화이트박스 테스트 기법은 전체 구현을 고려하므로, 명세에 있지만 구현되지 않은 요구사항의 누락 결함도 확실히 찾아낼 수 있다.","화이트박스 테스트 기법은 테스터의 능력에 따라 효과가 크게 달라지므로, 명세가 부실한 레거시 시스템에는 쓰지 않는 것이 좋다."],"ans":[0],"exp":"4.3.3: 모든 화이트박스 테스트 기법이 가진 근본적인 강점은 테스트 중 전체 소프트웨어 구현을 고려한다는 점이다. 그래서 소프트웨어 명세가 모호하거나 뒤떨어지고 불완전해도 결함을 쉽게 감지할 수 있다.","why":["정답. 테스트 중 전체 소프트웨어 구현을 고려한다는 것이 모든 화이트박스 테스트 기법의 근본적인 강점이다(4.3.3).","명시된 동작 분석을 기반으로 하는 명세 기반 기법은 블랙박스 기법이다. 화이트박스 기법은 테스트 대상의 내부 구조와 처리 분석을 기반으로 한다(4.1).","구현 전체를 고려하는 것은 맞지만, 소프트웨어가 요구사항을 구현하지 않은 경우 화이트박스 테스팅은 그 누락 결함을 식별하지 못할 수 있다(4.3.3).","효과성이 테스터의 능력에 크게 좌우되는 것은 경험 기반 기법의 특징이다(4.1). 화이트박스 기법은 오히려 명세가 부실해도 결함 감지에 도움이 된다(4.3.3)."],"ref":"4.3.3"},{"id":"c4k2-015","ch":4,"lo":"FL-4.3.3","k":2,"q":"요구사항에는 '비밀번호를 5회 연속 틀리면 계정을 잠근다'가 있었지만, 개발자가 이 기능을 아예 구현하지 않았다. 팀은 로그인 모듈 코드에 대해 분기 커버리지 100%를 달성했지만 이 문제를 발견하지 못했다.\n실라버스 기준으로 이 상황을 가장 잘 설명하는 것은?","opts":["분기 커버리지보다 엄격한 구문 커버리지를 목표로 했다면 누락된 잠금 기능을 발견했을 것이다.","분기 커버리지 100%를 달성했다면 이 결함은 발견됐어야 하므로 커버리지 측정이 잘못되었다.","요구사항이 구현되지 않은 경우, 화이트박스 테스팅으로는 그 누락 결함을 식별하지 못할 수 있다.","화이트박스 테스팅은 명세가 불완전하거나 뒤떨어지면 쓸 수 없으므로 처음부터 적용 대상이 아니었다."],"ans":[2],"exp":"4.3.3: 화이트박스 테스팅의 단점은, 소프트웨어가 하나 이상의 요구사항을 구현하지 않은 경우 그 누락으로 생긴 결함을 식별하지 못할 수 있다는 점이다. 이 예에서는 잠금 기능 코드 자체가 없으니 실행할 구문이나 분기도 없다.","why":["분기 커버리지가 구문 커버리지를 포함하므로 구문 커버리지가 더 엄격하지 않다(4.3.2). 게다가 코드에 없는 기능은 구문 커버리지로도 실행할 수 없다.","커버리지 100%가 결함 식별을 보장하지는 않는다. 특히 누락 결함은 화이트박스 테스팅으로 식별하지 못할 수 있다(4.3.3).","정답. 소프트웨어가 요구사항을 구현하지 않으면 화이트박스 테스팅으로 그 누락 결함을 식별하지 못할 수 있다(4.3.3).","화이트박스 테스팅은 오히려 명세가 모호하거나 뒤떨어지고 불완전해도 결함 감지에 도움이 된다(4.3.3)."],"ref":"4.3.3"},{"id":"c4k2-016","ch":4,"lo":"FL-4.3.3","k":2,"q":"화이트박스 테스팅의 가치에 대한 설명으로 옳은 것을 두 개 고르시오.","opts":["화이트박스 테스트 기법은 실행할 준비가 된 코드에만 적용할 수 있다.","화이트박스 테스트 기법은 코드 드라이 런 같은 정적 테스팅에도 사용할 수 있다.","블랙박스 테스팅만 수행해도 실제 코드 커버리지 측정치를 얻을 수 있다.","슈도 코드(pseudocode)는 실행할 수 없으므로 화이트박스 테스트 기법으로 검토할 수 없다.","화이트박스 커버리지 측정치는 객관적인 커버리지 측정값과, 커버리지를 높이기 위한 추가 테스트 생성에 필요한 정보를 제공한다."],"ans":[1,4],"exp":"4.3.3: 화이트박스 기법은 정적 테스팅(예: 코드 드라이 런)에 쓸 수 있다. 아직 실행할 준비가 안 된 코드, 슈도 코드, 제어 흐름 그래프로 모델링할 수 있는 상위 수준·하향식 논리를 검토하는 데도 적합하다. 블랙박스 테스팅만으로는 실제 코드 커버리지 측정치를 얻을 수 없고, 화이트박스 커버리지 측정치는 객관적인 측정값과 추가 테스트 생성 정보를 주어 코드 신뢰도를 높인다.","why":["아직 실행할 준비가 되지 않은 코드를 검토하는 데도 적합하다(4.3.3).","정답(4.3.3).","블랙박스 테스팅만 수행해서는 실제 코드 커버리지 측정치를 얻을 수 없다(4.3.3).","슈도 코드 검토에도 적합하다(4.3.3).","정답(4.3.3)."],"ref":"4.3.3"},{"id":"c4k2-017","ch":4,"lo":"FL-4.4.1","k":2,"q":"테스터가 새 송금 앱을 테스트하면서 오류 추정(error guessing)을 적용하려 한다.\n실라버스가 오류 추정의 바탕이 되는 테스터의 지식으로 제시한 것은?","opts":["요구사항 명세에 정의된 송금 한도 값의 동등 분할","소스 코드의 제어 흐름 그래프에서 아직 실행되지 않은 분기","상태 테이블에서 빈 셀로 표시된 비유효 전이","다른 유사 애플리케이션(예: 다른 송금 앱)에서 발생했던 장애 유형"],"ans":[3],"exp":"4.4.1: 오류 추정은 테스터의 지식을 바탕으로 오류, 결함, 장애의 발생을 예측하는 기법이다. 그 지식에는 ① 애플리케이션의 과거 동작 ② 개발자가 범하기 쉬운 오류 유형과 그로 인한 결함 유형 ③ 다른 유사 애플리케이션에서 발생한 장애 유형이 포함된다.","why":["명세의 값을 분할로 나누는 것은 블랙박스 기법인 동등 분할이다(4.2.1).","제어 흐름 그래프의 분기를 기반으로 하는 것은 화이트박스 기법인 분기 테스팅이다(4.3.2).","상태 테이블의 비유효 전이는 블랙박스 기법인 상태 전이 테스팅에서 다룬다(4.2.4).","정답(4.4.1)."],"ref":"4.4.1"},{"id":"c4k2-018","ch":4,"lo":"FL-4.4.1","k":2,"q":"테스터가 오류 추정(error guessing)에 쓰려고 과거에 발견된 문제를 정리하고 있다. 실라버스는 오류, 결함, 장애가 관련될 수 있는 영역을 입력, 출력, 논리, 계산, 인터페이스, 데이터로 나누어 예를 든다.\n문제와 영역을 실라버스의 예에 맞게 짝지은 것은?","opts":["올바른 우편번호를 입력해도 시스템이 받아들이지 않았다 – 출력","할인 여부를 판단하는 조건식에 잘못된 연산자를 썼다 – 계산","합계 변수를 잘못 초기화했다 – 데이터","영수증의 날짜가 잘못된 형식으로 표시되었다 – 인터페이스"],"ans":[2],"exp":"4.4.1의 예: 입력(올바른 입력을 인식하지 못함, 매개변수 오류·누락), 출력(잘못된 형식, 잘못된 결과), 논리(사례 누락, 잘못된 연산자), 계산(잘못된 피연산자, 잘못된 계산), 인터페이스(매개변수 불일치, 호환되지 않는 유형), 데이터(잘못된 초기화, 잘못된 유형). 잘못된 초기화는 데이터 영역의 예다.","why":["올바른 입력을 인식하지 못하는 것은 '입력' 영역의 예다(4.4.1).","잘못된 연산자는 '논리' 영역의 예다. '계산'의 예는 잘못된 피연산자, 잘못된 계산이다(4.4.1).","정답(4.4.1).","잘못된 형식은 '출력' 영역의 예다(4.4.1)."],"ref":"4.4.1"},{"id":"c4k2-019","ch":4,"lo":"FL-4.4.1","k":2,"q":"테스트 팀이 결함 공격(fault attack)을 계획하고 있다.\n결함 공격에 대한 설명으로 실라버스와 일치하는 것은?","opts":["결함 공격은 오류 추정과 별개인 화이트박스 테스트 기법으로, 코드의 분기와 구문을 공격 대상으로 삼아 커버리지를 높이는 테스트를 설계한다.","결함 공격은 오류 추정을 구현하는 방법 중 하나로, 오류·결함·장애 목록을 만들거나 얻어서 결함을 노출하거나 장애를 유발하는 테스트를 설계한다.","결함 공격에 쓰는 목록은 해당 프로젝트에서 직접 겪은 결함으로만 만들어야 하며, 소프트웨어에 문제가 생기는 원인에 관한 일반 지식은 쓸 수 없다.","결함 공격은 시간을 정해 놓은 세션 안에서 테스트 차터를 지침으로 삼아 테스트의 설계, 실행, 평가를 동시에 하는 방법이다."],"ans":[1],"exp":"4.4.1: 결함 공격은 오류 추정을 구현하는 방법 중 하나다. 테스터는 발생 가능한 오류, 결함, 장애 목록을 만들거나 획득해서, 오류와 관련된 결함을 식별·노출하거나 장애를 유발하는 테스트를 설계한다. 목록은 경험, 결함 및 장애 데이터, 소프트웨어에 문제가 생기는 원인에 관한 일반적인 지식으로 만들 수 있다.","why":["결함 공격은 화이트박스 기법이 아니라, 경험 기반 기법인 오류 추정을 구현하는 방법이다(4.4.1).","정답(4.4.1).","목록은 경험, 결함·장애 데이터, 소프트웨어에 문제가 생기는 원인에 관한 일반 지식으로도 만들 수 있다(4.4.1).","시간을 정해 두고 테스트 차터를 지침으로 삼아 설계·실행·평가를 동시에 하는 것은 세션 기반 탐색적 테스팅이다(4.4.2)."],"ref":"4.4.1"},{"id":"c4k2-020","ch":4,"lo":"FL-4.4.2","k":2,"q":"출시가 일주일 남은 모바일 앱이 있다. 명세는 화면 스케치 몇 장뿐이고 일정 압박이 심하다. 팀은 탐색적 테스팅(exploratory testing)을 고려하고 있다.\n이 상황에서 탐색적 테스팅에 대한 설명으로 실라버스와 일치하는 것은?","opts":["탐색적 테스팅은 명세가 부족하거나 시간 압박이 심할 때 유용하며, 경험과 도메인 지식이 풍부한 테스터일수록 더 효과적이다.","탐색적 테스팅은 완전한 명세를 바탕으로 테스트를 미리 설계해야 하므로, 명세가 화면 스케치뿐인 이 상황에는 맞지 않는다.","탐색적 테스팅은 다른 공식 테스트 기법을 대체하는 기법이므로, 탐색적 테스팅 중에는 다른 테스트 기법을 함께 쓸 수 없다.","탐색적 테스팅의 효과는 테스터의 경험이나 분석 기술과 관계없으므로, 경험이 거의 없는 신입 테스터에게 맡겨도 결과가 같다."],"ans":[0],"exp":"4.4.2: 탐색적 테스팅은 명세가 부족하거나 부적합할 때, 테스트에 시간적 압박이 심할 때 유용하다. 테스터가 풍부한 경험과 도메인 지식을 가지고 분석 기술, 호기심, 창의성 같은 필요 기술을 갖추면 더 효과적이다.","why":["정답(4.4.2).","실라버스는 명세가 부족하거나 부적합할 때 탐색적 테스팅이 유용하다고 한다(4.4.2). 테스트를 미리 설계하지 않고, 배워가면서 설계·실행·평가를 동시에 한다.","탐색적 테스팅은 다른 공식 테스트 기법을 '보완'하는 데 유용하고, 탐색적 테스팅 중 다른 테스트 기법(예: 동등 분할)을 사용할 수 있다(4.4.2).","경험, 도메인 지식, 분석 기술 등을 갖춘 테스터일수록 더 효과적이다(4.4.2)."],"ref":"4.4.2"},{"id":"c4k2-021","ch":4,"lo":"FL-4.4.2","k":2,"q":"한 팀이 세션 기반 테스팅(session-based testing)으로 탐색적 테스팅을 구조화하기로 했다.\n세션 기반 접근법에 대한 설명으로 옳은 것은?","opts":["세션 시간은 정해 두지 않으며, 테스터가 대상을 충분히 테스트했다고 스스로 판단할 때까지 계속 진행한다.","커버리지 항목은 세션 시작 전에 모두 식별해 테스트 차터(charter)에 확정해 두고, 세션 중에는 실행만 한다.","세션이 끝나면 이해관계자와의 보고(debriefing) 없이 테스트 세션 시트만 작성해 제출하는 것이 일반적이다.","테스트 목적이 정의된 테스트 차터를 지침으로 쓰며, 이 목적을 상위 수준의 테스트 컨디션으로 취급할 수 있다."],"ans":[3],"exp":"4.4.2: 세션 기반 접근법에서는 탐색적 테스팅을 시간을 정해 놓고 수행한다. 테스터는 테스트 목적이 정의된 테스트 차터를 지침으로 쓰고, 세션이 끝나면 보통 이해관계자와 토론하는 보고가 이어진다. 테스트 목적은 상위 수준의 테스트 컨디션으로 취급할 수 있고, 커버리지 항목은 세션 중에 식별하고 실행한다. 수행 절차와 발견 내용은 테스트 세션 시트에 기록할 수 있다.","why":["세션 기반 접근법에서는 탐색적 테스팅을 시간을 정해 놓고 수행한다(4.4.2).","커버리지 항목은 세션 전에 확정하지 않고, 테스트 세션 중에 식별하고 실행한다(4.4.2).","일반적으로 세션이 끝나면 테스터와 이해관계자가 토론하는 보고가 이어진다(4.4.2).","정답(4.4.2)."],"ref":"4.4.2"},{"id":"c4k2-022","ch":4,"lo":"FL-4.4.2","k":2,"q":"테스트 리더가 새로 들어온 테스터에게 탐색적 테스팅(exploratory testing)을 설명하고 있다.\n탐색적 테스팅의 특징과 쓰임으로 옳은 것은?","opts":["테스트 케이스를 모두 설계하고 검토를 마친 뒤에 실행하며, 목적은 인수 테스트를 실행 가능한 요구사항으로 만드는 것이다.","테스트 대상에 대해 배워가면서 설계·실행·평가를 동시에 하며, 테스트되지 않은 영역의 테스트를 만드는 데에도 쓰인다.","미리 작성한 체크리스트의 항목을 하나씩 확인하는 방식이며, 목적은 테스트의 재현 가능성을 높이는 것이다.","테스트 대상의 코드 구조를 분석해 테스트를 설계하며, 목적은 객관적인 코드 커버리지 측정값을 얻는 것이다."],"ans":[1],"exp":"4.4.2: 탐색적 테스팅에서는 테스터가 테스트 대상에 대해 배워가면서 테스트의 설계, 실행, 평가를 동시에 한다. 테스트 대상에 대해 더 배우고, 집중하는 테스트로 더 깊이 탐색하고, 테스트되지 않은 영역에 대한 테스트를 만들기 위해 사용된다.","why":["탐색적 테스팅은 설계를 미리 끝내지 않고 설계·실행·평가를 동시에 한다(4.4.2). 인수 테스트가 '실행 가능한 요구사항'이 되는 것은 ATDD 설명이다(4.5.3).","정답(4.4.2).","체크리스트 항목을 확인하는 것은 체크리스트 기반 테스팅이다(4.4.3). 게다가 상위 수준 체크리스트는 재현 가능성이 떨어질 수 있다.","테스트 대상의 내부 구조 분석을 기반으로 테스트를 설계하는 것은 화이트박스 테스트 기법이고(4.1), 객관적인 커버리지 측정값을 제공하는 것도 화이트박스 커버리지 측정치다(4.3.3)."],"ref":"4.4.2"},{"id":"c4k2-023","ch":4,"lo":"FL-4.4.2","k":2,"q":"탐색적 테스팅 세션 중에 테스터가 '나이' 입력란을 보고, 동등 분할(equivalence partitioning)로 유효·비유효 분할을 나눈 뒤 분할마다 값을 하나씩 골라 입력해 보았다. 동료가 '탐색적 테스팅 중에는 다른 테스트 기법을 쓰면 안 된다'고 지적했다.\n실라버스 기준으로 옳은 판단은?","opts":["동료가 옳다. 탐색적 테스팅은 경험 기반 기법이므로 블랙박스 기법을 섞으면 더 이상 탐색적 테스팅이 아니다.","동료가 옳다. 동등 분할을 쓰려면 먼저 세션을 끝내고 별도의 공식 테스트 설계 단계를 거쳐야 한다.","테스터가 옳다. 탐색적 테스팅 중에 동등 분할 같은 다른 테스트 기법을 사용할 수 있다.","테스터가 옳다. 다만 동등 분할은 화이트박스 기법이므로 코드를 볼 수 있을 때만 가능하다."],"ans":[2],"exp":"4.4.2: 실라버스는 탐색적 테스팅 중 다른 테스트 기법(예: 동등 분할)을 사용할 수 있다고 명시한다.","why":["탐색적 테스팅 중 다른 테스트 기법(예: 동등 분할)을 사용할 수 있다(4.4.2).","세션을 끝내야 한다는 제약은 없다. 탐색적 테스팅 안에서 동등 분할을 쓸 수 있다(4.4.2).","정답(4.4.2).","판단은 맞지만 이유가 틀렸다. 동등 분할은 블랙박스 기법이다(4.2)."],"ref":"4.4.2"},{"id":"c4k2-024","ch":4,"lo":"FL-4.4.3","k":2,"q":"팀이 웹 서비스 테스트용 체크리스트 초안을 검토하고 있다.\n실라버스 기준으로 체크리스트 기반 테스팅(checklist-based testing)의 항목으로 가장 적절한 것은?","opts":["정적 분석 도구가 자동으로 점검하는 코딩 규칙을 위반하지 않았는가?","시스템 테스트를 시작하기 전에 테스트 환경과 테스트 데이터가 모두 준비되었는가?","웹 서비스 전반의 품질이 사용자가 기대하는 수준만큼 좋은가?","입력 오류 메시지가 사용자에게 무엇을 고쳐야 하는지 알려 주는가?"],"ans":[3],"exp":"4.4.3: 체크리스트에는 자동으로 점검할 수 있는 항목, 시작 조건·종료 조건으로 더 적합한 항목, 너무 일반적인 항목을 넣으면 안 된다. 항목은 질문 형식인 경우가 많고, 각 항목을 개별적이고 직접적으로 확인할 수 있어야 한다.","why":["자동으로 점검할 수 있는 항목은 체크리스트에 넣으면 안 된다(4.4.3).","테스트 환경, 테스트 데이터 같은 자원의 가용성은 많이 쓰는 시작 조건이다(5.1.3). 시작 조건으로 더 적합한 항목은 체크리스트에 넣지 않는다(4.4.3).","너무 일반적이어서 개별적·직접적으로 확인할 수 없다(4.4.3).","정답. 질문 형식이고, 개별적·직접적으로 확인할 수 있다(4.4.3)."],"ref":"4.4.3"},{"id":"c4k2-025","ch":4,"lo":"FL-4.4.3","k":2,"q":"한 팀이 같은 체크리스트를 1년 넘게 쓰고 있다. 일부 항목에서는 몇 달째 결함이 나오지 않았고, 최근에는 체크리스트에 없는 유형의 심각도 높은 결함이 발견되었다.\n실라버스 기준으로 체크리스트를 다루는 방법으로 옳은 것은?","opts":["결함 분석을 기반으로 체크리스트를 정기적으로 업데이트하되, 체크리스트가 너무 길어지지 않도록 주의한다.","일관성을 위해 효과가 떨어진 항목도 그대로 두고, 새 항목은 추가하지 않는다.","발견된 모든 결함을 빠짐없이 항목으로 추가해 체크리스트를 최대한 길게 만든다.","체크리스트는 한 번 확정하면 바꾸지 않아야 재현 가능성이 유지되므로 수정하지 않는다."],"ans":[0],"exp":"4.4.3: 개발자가 같은 오류를 범하지 않게 되면서 일부 항목은 점차 효과가 떨어질 수 있다. 새로 발견한 심각도 높은 결함 때문에 새 항목을 추가해야 할 수도 있다. 그래서 체크리스트는 결함 분석을 기반으로 정기적으로 업데이트해야 하지만, 너무 길어지지 않게 주의해야 한다.","why":["정답(4.4.3).","효과가 떨어진 항목과 새로 필요한 항목을 반영해 정기적으로 업데이트해야 한다(4.4.3).","체크리스트가 너무 길어지지 않도록 주의해야 한다(4.4.3).","체크리스트는 결함 분석을 기반으로 정기적으로 업데이트해야 한다(4.4.3)."],"ref":"4.4.3"},{"id":"c4k2-026","ch":4,"lo":"FL-4.4.3","k":2,"q":"구체적인 테스트 케이스 없이, 상위 수준으로 작성된 체크리스트만으로 테스트를 진행하려 한다.\n실라버스 기준으로 예상되는 결과로 옳은 것은?","opts":["테스터마다 같은 절차로 테스트하게 되어 재현 가능성은 높아지지만 커버리지는 낮아진다.","실제 테스트가 조금씩 달라질 수 있어 커버리지는 높아질 수 있지만 재현 가능성은 떨어질 수 있다.","체크리스트는 기능 테스트만 지원하므로 사용성 같은 비기능 특성은 체크리스트로 테스트할 수 없다.","구체적인 테스트 케이스가 없으면 체크리스트 기반 테스팅은 테스트에 아무런 지침도 제공하지 못한다."],"ans":[1],"exp":"4.4.3: 구체적인 테스트 케이스가 없을 때 체크리스트 기반 테스팅은 지침과 일정 수준의 일관성을 제공할 수 있다. 체크리스트가 상위 수준이면 실제 테스트가 조금씩 달라질 수 있고, 그 결과 커버리지는 높아지지만 재현 가능성은 떨어질 수 있다.","why":["방향이 반대다. 상위 수준 체크리스트는 커버리지는 높아질 수 있지만 재현 가능성은 떨어질 수 있다(4.4.3).","정답(4.4.3).","체크리스트는 기능·비기능 테스트를 포함한 다양한 테스트 유형을 지원할 수 있다. 예: 사용성 테스트를 위한 10가지 휴리스틱 평가 기준(4.4.3).","구체적인 테스트 케이스가 없을 때도 체크리스트는 지침과 일정 수준의 일관성을 제공할 수 있다(4.4.3)."],"ref":"4.4.3"},{"id":"c4k2-027","ch":4,"lo":"FL-4.5.1","k":2,"q":"애자일 팀이 사용자 스토리(user story)를 다음처럼 다루고 있다.\n• 스토리를 전자 게시판에 항목으로 등록한다.\n• 업무 대표자, 개발자, 테스터가 소프트웨어를 어떻게 쓸지 구두로 이야기한다.\n• 이야기한 결과로 인수 조건을 정리한다.\n사용자 스토리의 3C에 대한 설명으로 옳은 것은?","opts":["카드(Card)는 인수 조건을 뜻하며, 전자 게시판에 등록하는 것은 대화(Conversation)에 해당한다.","대화(Conversation)는 반드시 문서로 남겨야 하므로, 구두로 이야기한 것은 3C에 해당하지 않는다.","확인(Confirmation)은 인수 조건이며, 전자 게시판의 항목은 카드(Card)에 해당한다.","확인(Confirmation)은 사용자 스토리를 설명하는 매체이며, 인덱스 카드나 전자 게시판 항목이 그 예다."],"ans":[2],"exp":"4.5.1: 3C는 ① 카드(Card): 사용자 스토리를 설명하는 매체(예: 인덱스 카드, 전자 게시판 항목) ② 대화(Conversation): 소프트웨어 사용 방법에 대한 설명(문서 또는 구두) ③ 확인(Confirmation): 인수 조건이다.","why":["인수 조건은 확인(Confirmation)이고, 전자 게시판 항목은 카드(Card)다(4.5.1).","대화는 문서 또는 구두로 할 수 있다(4.5.1).","정답(4.5.1).","스토리를 설명하는 매체는 카드(Card)다. 확인은 인수 조건이다(4.5.1)."],"ref":"4.5.1"},{"id":"c4k2-028","ch":4,"lo":"FL-4.5.1","k":2,"q":"백로그 개선 작업 회의에서 업무 담당 이해관계자가 '이 사용자 스토리는 어떻게 테스트해야 할지 모르겠다'고 말했다.\n실라버스에 따르면 이것이 의미할 수 있는 것은?","opts":["사용자 스토리가 불명확하거나, 사용자에게 중요한 내용이 반영되지 않았거나, 이해관계자가 테스트에 도움이 필요하다는 것","사용자 스토리가 INVEST의 '작은(Small)' 조건을 이미 충족해 더 작은 스토리로 나눌 필요가 없다는 것","사용자 스토리의 테스트 방법은 테스터만 알면 되므로, 업무 담당 이해관계자가 모르는 것은 특별한 의미가 없다는 것","사용자 스토리가 이미 테스트 가능(Testable)하므로 인수 조건을 더 정하지 않고 바로 구현에 들어가도 된다는 것"],"ans":[0],"exp":"4.5.1: 이해관계자가 사용자 스토리를 테스트하는 방법을 모른다면, 스토리가 명확하지 않거나, 사용자에게 중요한 내용이 반영되지 않았거나, 이해관계자가 테스트하는 데 도움이 필요하다는 뜻일 수 있다. 좋은 사용자 스토리는 INVEST(독립적, 협상 가능, 가치 있음, 추정 가능, 작음, 테스트 가능)해야 한다.","why":["정답(4.5.1).","실라버스는 이 상황을 스토리의 명확성, 중요 내용 반영, 테스트 도움 필요와 연결한다(4.5.1). 크기가 적절하다는 뜻이 아니다.","협업 기반 스토리 작성은 비즈니스, 개발, 테스팅의 세 관점을 함께 고려한다(4.5.1). 이해관계자가 테스트 방법을 모르는 것은 문제의 신호일 수 있다.","이해관계자가 테스트 방법을 모르는 것은 스토리가 명확하지 않을 수 있다는 신호다(4.5.1). 테스트 가능하다는 근거도, 인수 조건 없이 구현해도 된다는 근거도 아니다."],"ref":"4.5.1"},{"id":"c4k2-029","ch":4,"lo":"FL-4.5.1","k":2,"q":"업무 대표자, 개발자, 테스터가 함께 사용자 스토리를 작성하는 협업 기반 사용자 스토리 작성에 대한 설명으로 옳은 것을 두 개 고르시오.","opts":["브레인스토밍, 마인드 매핑 같은 기법을 사용할 수 있다.","업무 대표자가 혼자 스토리를 완성한 뒤 개발자와 테스터에게 전달하는 것이 협업의 핵심이다.","비즈니스, 개발, 테스팅의 세 가지 관점을 고려해, 만들어서 전달할 것에 대한 공유된 비전을 얻을 수 있다.","협업 기반 테스트 접근법은 결함 식별에만 초점을 두며 결함 예방과는 관계가 없다.","가장 일반적인 형식은 인수 조건을 먼저 쓰고, 그 뒤에 역할·목표·비즈니스 가치를 쓰는 것이다."],"ans":[0,2],"exp":"4.5.1: 협업 기반 사용자 스토리 작성은 브레인스토밍, 마인드 매핑 같은 기법을 사용한다. 협업을 통해 팀원들은 비즈니스, 개발, 테스팅의 세 관점을 고려해 만들어서 전달할 것에 대한 공유된 비전을 얻는다.","why":["정답(4.5.1).","협업은 비즈니스, 개발, 테스팅의 세 관점을 함께 고려하는 것이다(4.5.1). 한 사람이 혼자 완성하는 방식이 아니다.","정답(4.5.1).","협업 기반 접근법은 협업과 커뮤니케이션을 통한 결함 예방에도 초점을 둔다(4.5).","가장 일반적인 형식은 '[역할]로서 [목표]를 달성해 [비즈니스 가치]를 얻기를 원한다' 뒤에 인수 조건이 따라오는 형식이다(4.5.1)."],"ref":"4.5.1"},{"id":"c4k2-030","ch":4,"lo":"FL-4.5.2","k":2,"q":"어떤 사용자 스토리에 인수 조건(acceptance criteria)이 다음 두 가지 방식으로 작성되어 있다.\n① Given 장바구니에 상품이 1개 있고, When 사용자가 수량을 0으로 바꾸면, Then 상품이 장바구니에서 삭제된다.\n② 확인 목록: 수량은 최대 10개까지 담을 수 있다 / 품절 상품은 담을 수 없다 / 합계 금액은 수량을 바꾸면 즉시 다시 계산된다.\n①, ②의 작성 형식을 올바르게 분류한 것은?","opts":["① 규칙 기반, ② 시나리오 기반","①, ② 모두 시나리오 기반","① 시나리오 기반, ② 두 형식 어디에도 속하지 않으므로 인수 조건으로 쓸 수 없다","① 시나리오 기반, ② 규칙 기반"],"ans":[3],"exp":"4.5.2: 가장 일반적인 인수 조건 작성 형식은 두 가지다. ① 시나리오 기반(scenario-oriented): 예) 행위 주도 개발(BDD)에서 쓰는 Given/When/Then 형식 ② 규칙 기반(rule-oriented): 예) 베리피케이션이 필요한 목록, 표로 표현된 입력-출력 매핑. ①은 Given/When/Then이므로 시나리오 기반, ②는 확인 목록이므로 규칙 기반이다.","why":["Given/When/Then은 시나리오 기반, 확인 목록은 규칙 기반이다. 두 개가 뒤바뀌었다(4.5.2).","②는 목록 형식이므로 규칙 기반이다(4.5.2).","목록 형식은 규칙 기반에 속한다. 게다가 잘 정의되고 모호하지 않다면 팀의 자체 형식도 쓸 수 있다(4.5.2).","정답(4.5.2)."],"ref":"4.5.2"},{"id":"c4k2-031","ch":4,"lo":"FL-4.5.2","k":2,"q":"제품 소유자가 '인수 조건은 개발이 끝난 뒤 테스터가 확인할 때만 쓰는 것이니, 지금은 작성하지 말고 바로 개발을 시작하자'고 했다.\n이 의견에 반대할 근거로 실라버스에 제시된 인수 조건의 용도는?","opts":["인수 조건은 화이트박스 테스트의 커버리지 항목이 되므로 코드를 작성하기 전에 있어야 한다.","인수 조건은 사용자 스토리의 범위를 정의하고, 정확한 계획 및 추정을 가능하게 한다.","인수 조건은 3C 중 카드(Card)에 해당하므로 스토리를 등록하는 순간 함께 있어야 한다.","인수 조건은 개발자가 코드에서 추출하는 것이므로 개발과 동시에 작성해야 한다."],"ans":[1],"exp":"4.5.2: 인수 조건의 용도는 ① 사용자 스토리 범위 정의 ② 이해관계자 간 합의 도출 ③ 긍정과 부정 시나리오 설명 ④ 사용자 스토리 인수 테스팅의 베이시스 제공 ⑤ 정확한 계획 및 추정이다. 범위 정의와 계획·추정에도 쓰이므로, 테스터의 확인용으로만 쓴다는 의견은 실라버스와 맞지 않는다.","why":["인수 조건은 테스트로 실행해야 할 테스트 컨디션으로 볼 수 있다(4.5.2). 화이트박스 기법의 커버리지 항목은 실행 가능한 구문, 분기 같은 코드 요소다(4.3).","정답(4.5.2).","인수 조건은 3C 중 확인(Confirmation)에 해당한다(4.5.1).","인수 조건은 보통 3C 중 대화(Conversation)를 통해 결정된다(4.5.2)."],"ref":"4.5.2"},{"id":"c4k2-032","ch":4,"lo":"FL-4.5.2","k":2,"q":"한 팀이 인수 조건을 시나리오 기반이나 규칙 기반이 아닌, 팀에서 정한 자체 형식으로 작성하려 한다.\n실라버스 기준으로 옳은 것은?","opts":["자체 형식을 써도 되지만, 인수 조건이 잘 정의되고 모호하지 않아야 한다.","자체 형식을 쓰는 경우에는 인수 조건이 다소 모호해도 팀 안에서 합의만 되면 된다.","자체 형식으로 작성한 인수 조건은 테스트 컨디션으로 볼 수 없으므로 인수 테스팅의 베이시스가 될 수 없다.","시나리오 기반과 규칙 기반 외의 형식은 실라버스가 금지하므로 두 형식 중 하나로 바꿔야 한다."],"ans":[0],"exp":"4.5.2: 대부분의 인수 조건은 시나리오 기반이나 규칙 기반 중 하나로 문서화할 수 있다. 그러나 팀은 다른 자체 형식을 쓰기로 할 수도 있고, 이때도 인수 조건이 잘 정의되어 모호하지 않아야 한다.","why":["정답(4.5.2).","자체 형식이라도 인수 조건은 잘 정의되어 모호하지 않아야 한다(4.5.2).","실라버스는 형식에 따라 테스트 컨디션 여부가 달라진다고 하지 않는다. 인수 조건은 테스트 컨디션으로 볼 수 있고, 인수 테스팅의 베이시스가 된다(4.5.2).","실라버스는 팀이 자체 형식을 쓸 수도 있다고 한다(4.5.2)."],"ref":"4.5.2"},{"id":"c4k3-001","ch":4,"lo":"FL-4.2.1","k":3,"q":"도서관 시스템에서 대출 기간(일)을 입력한다. 입력 필드는 정수만 받는다.\n- 0 이하: '1일 이상 입력하세요' 오류 메시지\n- 1~7: 일반 대출로 처리\n- 8~14: 연장 대출로 처리(사서 승인 필요)\n- 15 이상: '최대 14일까지 대출할 수 있습니다' 오류 메시지\n\n동등 분할(equivalence partitioning)을 적용할 때 식별해야 하는 분할 수와, 100% 동등 분할 커버리지를 달성하는 최소 테스트 케이스 수로 옳은 것은? (테스트 케이스 하나는 대출 기간 값 하나만 입력한다.)","opts":["분할 2개, 테스트 케이스 2개","분할 3개, 테스트 케이스 3개","분할 4개, 테스트 케이스 2개","분할 4개, 테스트 케이스 4개"],"ans":[3],"exp":"처리 방식이 다른 값끼리 나누면 분할은 4개다.\n① 0 이하: 비유효 분할(오류 메시지 A)\n② 1~7: 유효 분할(일반 대출)\n③ 8~14: 유효 분할(연장 대출)\n④ 15 이상: 비유효 분할(오류 메시지 B)\n①과 ④는 둘 다 비유효지만 오류 메시지가 달라 처리 방식이 다르므로 별개의 분할이다.\n4.2.1절: 100% 커버리지를 달성하려면 비유효 분할을 포함해 식별한 모든 분할을 최소 한 번씩 실행해야 한다. 테스트 케이스 하나가 값 하나만 입력하므로 한 번에 분할 하나만 다룬다. 따라서 최소 4개(예: -3, 5, 10, 20)가 필요하다.","why":["유효 분할 2개만 센 경우다. 4.2.1절은 100% 커버리지에 비유효 분할도 포함한다고 명시한다.","0 이하와 15 이상을 하나의 비유효 분할로 묶은 경우다. 두 범위는 서로 다른 오류 메시지로 처리되므로 다른 분할이다.","분할 수는 맞지만 비유효 분할을 실행하지 않은 경우다. 비유효 분할도 각각 최소 한 번 실행해야 100%가 된다.","정답. 분할 4개(유효 2개, 비유효 2개)를 하나씩 실행하려면 테스트 케이스 4개가 필요하다."],"ref":"4.2.1"},{"id":"c4k3-002","ch":4,"lo":"FL-4.2.1","k":3,"q":"박물관 입장권 발매기는 입력한 나이(정수)로 요금을 정한다.\n- 음수: '나이를 확인하세요' 오류\n- 0~6세: 무료\n- 7~18세: 청소년 3,000원\n- 19~64세: 성인 6,000원\n- 65~120세: 경로 2,000원\n- 121 이상: '입력 가능 범위 초과' 오류\n\n다음 테스트 입력 집합 중 100% 동등 분할(equivalence partitioning) 커버리지를 달성하는 것은?","opts":["-1, 5, 12, 30, 70, 125","0, 6, 18, 64, 120, 121","-3, 10, 25, 66, 130","-5, 3, 15, 19, 64, 200"],"ans":[0],"exp":"분할은 6개다: ① 음수(비유효) ② 0~6 ③ 7~18 ④ 19~64 ⑤ 65~120 ⑥ 121 이상(비유효). 4.2.1절에 따라 비유효 분할을 포함한 6개 분할을 모두 한 번 이상 실행해야 100%다.\n보기별로 값이 속한 분할을 적으면:\n- -1, 5, 12, 30, 70, 125 → ①②③④⑤⑥ → 6/6 = 100%\n- 0, 6, 18, 64, 120, 121 → ②②③④⑤⑥ → ① 누락, 5/6\n- -3, 10, 25, 66, 130 → ①③④⑤⑥ → ② 누락, 5/6\n- -5, 3, 15, 19, 64, 200 → ①②③④④⑥ → ⑤ 누락, 5/6","why":["정답. 6개 분할에서 값을 하나씩 골랐다.","경계값 위주로 골랐지만 0과 6이 같은 분할(0~6세)이고 음수 분할을 실행하지 않았다. 커버리지 5/6이다.","값이 5개뿐이고 0~6세 분할을 실행하지 않았다. 커버리지 5/6이다.","19와 64가 같은 분할(19~64세)이고 65~120세 분할을 실행하지 않았다. 커버리지 5/6이다."],"ref":"4.2.1"},{"id":"c4k3-003","ch":4,"lo":"FL-4.2.1","k":3,"q":"택배 접수 시스템은 무게(kg, 정수)에 따라 다음과 같이 처리한다.\n- 0 이하: '무게를 입력하세요' 오류\n- 1~5: 기본 요금\n- 6~20: 중량 요금\n- 21~30: 특수 화물 요금\n- 31 이상: '접수 불가' 오류\n\n테스터가 무게 3, 5, 18, 31, 45로 테스트 케이스 5개를 실행했다. 달성한 동등 분할(equivalence partitioning) 커버리지는?","opts":["60%","약 67%","75%","100%"],"ans":[0],"exp":"① 분할 식별: 0 이하(비유효), 1~5, 6~20, 21~30, 31 이상(비유효) → 5개. 두 비유효 분할은 오류 메시지가 달라 별개다.\n② 실행한 분할: 3·5 → 1~5, 18 → 6~20, 31·45 → 31 이상 → 3개. 0 이하와 21~30은 실행하지 않았다.\n③ 4.2.1절: 커버리지 = 하나 이상의 테스트 케이스로 실행한 분할 수 ÷ 식별한 총 분할 수(비유효 포함) = 3 ÷ 5 = 60%.","why":["정답. 5개 분할 중 3개를 실행했다.","유효 분할 3개만 분모로 써서 2/3으로 계산한 경우다. 비유효 분할도 분모에 포함해야 한다.","두 비유효 분할을 하나로 묶어 3/4로 계산한 경우다. 오류 메시지가 다르므로 다른 분할이다.","테스트 케이스 수(5)와 분할 수(5)가 같으니 100%라고 본 경우다. 같은 분할을 두 번 실행해도 1개로 센다."],"ref":"4.2.1"},{"id":"c4k3-004","ch":4,"lo":"FL-4.2.1","k":3,"q":"영화 예매 화면에는 서로 독립적인 입력 항목 3개가 있다.\n- 관람객 유형: 일반, 청소년, 경로 (분할 3개)\n- 좌석 유형: 일반석, 프리미엄석 (분할 2개)\n- 결제 수단: 신용카드, 간편결제, 상품권, 포인트, 계좌이체 (분할 5개)\n모든 분할은 유효 분할이고, 어떤 조합이든 입력할 수 있다. 테스트 케이스 하나는 세 항목에 값을 하나씩 입력한다.\n\n이치 초이스 커버리지(Each Choice coverage) 100%를 달성하는 최소 테스트 케이스 수는?","opts":["3","5","10","30"],"ans":[1],"exp":"4.2.1절: 이치 초이스 커버리지는 모든 분할 집합의 각 분할을 최소 한 번 실행하면 되고, 분할의 조합은 고려하지 않는다.\n① 분할이 가장 많은 항목은 결제 수단(5개)이다. 결제 수단 5개를 모두 실행하려면 테스트 케이스가 최소 5개 필요하다.\n② 이 5개 안에서 관람객 유형 3개와 좌석 유형 2개도 함께 실행할 수 있다. 예: (일반, 일반석, 신용카드), (청소년, 프리미엄석, 간편결제), (경로, 일반석, 상품권), (일반, 프리미엄석, 포인트), (청소년, 일반석, 계좌이체).\n따라서 최소 5개다.","why":["입력 항목 수(3)를 센 경우다. 테스트 케이스 3개로는 결제 수단 5개를 모두 실행할 수 없다.","정답. 분할이 가장 많은 항목(결제 수단 5개)이 최소 테스트 케이스 수를 정한다.","세 항목의 분할 수를 더한 경우(3+2+5)다. 테스트 케이스 하나가 세 항목의 분할을 동시에 다루므로 더할 필요가 없다.","모든 조합(3×2×5)을 센 경우다. 이치 초이스 커버리지는 분할의 조합을 고려하지 않는다."],"ref":"4.2.1"},{"id":"c4k3-005","ch":4,"lo":"FL-4.2.1","k":3,"q":"주차장 정산기는 주차 시간(분, 정수)에 따라 요금을 계산한다. 입력은 0 이상의 정수만 들어온다.\n- 0~30분: 무료\n- 31~120분: 기본 요금 2,000원\n- 121~1,440분: 기본 요금에 시간당 1,000원 추가\n- 1,441분 이상: '장기 주차 - 관리실 문의' 메시지\n\n이미 15, 30, 90, 2,000(분)으로 테스트했다. 값 하나를 더 추가해 100% 동등 분할(equivalence partitioning) 커버리지를 달성하려면 어떤 값을 추가해야 하는가?","opts":["0","120","1,441","720"],"ans":[3],"exp":"① 분할: 0~30, 31~120, 121~1,440, 1,441 이상 → 4개. 음수는 입력될 수 없으므로 분할을 만들지 않는다.\n② 기존 테스트: 15·30 → 0~30, 90 → 31~120, 2,000 → 1,441 이상. 현재 3/4 = 75%.\n③ 실행하지 않은 분할은 121~1,440 하나다. 이 분할에 속한 값(예: 720)을 추가하면 4/4 = 100%가 된다(4.2.1절).","why":["0은 이미 실행한 0~30 분할에 속한다. 커버리지는 75% 그대로다.","120은 이미 실행한 31~120 분할에 속한다. 경계값이라도 새 분할을 실행하지는 않는다.","1,441은 이미 2,000으로 실행한 1,441 이상 분할에 속한다.","정답. 720은 아직 실행하지 않은 121~1,440 분할에 속한다."],"ref":"4.2.1"},{"id":"c4k3-006","ch":4,"lo":"FL-4.2.1","k":3,"q":"쇼핑몰 쿠폰 규칙은 다음과 같다. 주문 금액이 10,000원 미만이면 쿠폰을 쓸 수 없다. 10,000원 이상 50,000원 미만이면 2,000원, 50,000원 이상이면 5,000원을 할인한다.\n주문 금액은 시스템이 계산해서 넘기는 값이라 항상 1원 이상의 정수다(0원 이하는 발생하지 않는다).\n\n주문 금액에 대해 동등 분할(equivalence partitioning)을 올바르게 식별한 것은?","opts":["{1~9,999}, {10,000~49,999}, {50,000 이상}","{1~10,000}, {10,000~50,000}, {50,000 이상}","{1~9,999}, {10,000 이상}","{0 이하}, {1~9,999}, {10,000~49,999}, {50,000 이상}"],"ans":[0],"exp":"4.2.1절: 동등 분할은 테스트 대상이 같은 방식으로 처리할 값끼리 묶는다. 분할은 서로 겹치지 않아야 하며, 값이 없는 공집합일 수 없다.\n처리 방식은 세 가지다: 쿠폰 사용 불가(1~9,999), 2,000원 할인(10,000~49,999), 5,000원 할인(50,000 이상). 세 분할은 겹치지 않고, 모두 실제로 발생하는 값을 포함한다.","why":["정답. 처리 방식별로 나눈 세 분할이 겹치지 않고 모두 값이 있다.","10,000과 50,000이 두 분할에 동시에 들어가 분할이 겹친다. 분할은 서로 겹치지 않아야 한다.","2,000원 할인과 5,000원 할인은 처리 방식이 다른데 한 분할로 묶었다.","주문 금액은 항상 1원 이상이므로 '0 이하' 분할에는 값이 하나도 없다. 분할은 공집합일 수 없다."],"ref":"4.2.1"},{"id":"c4k3-007","ch":4,"lo":"FL-4.2.1","k":3,"q":"사진 공유 앱의 파일 업로드 기능을 테스트한다. 테스터는 파일 확장자에 대해 다음 동등 분할(equivalence partitioning)을 식별했다.\n- P1 {jpg, png}: 이미지 편집 화면으로 이동\n- P2 {pdf}: 문서 미리보기 화면으로 이동\n- P3 {그 밖의 모든 확장자}: '지원하지 않는 형식' 오류\n\n가장 적은 수의 테스트 케이스로 100% 동등 분할 커버리지를 달성하는 업로드 파일 집합은?","opts":["a.jpg, b.png, c.pdf, d.exe","a.png, b.pdf, c.zip","a.jpg, b.png, c.exe","a.pdf, b.exe, c.gif"],"ans":[1],"exp":"분할은 3개(P1, P2, P3)이고, 분할마다 테스트 하나면 충분하다(4.2.1절). 확장자처럼 순서가 없는 값에도 동등 분할을 적용할 수 있다. 따라서 최소 3개다.\n- a.png(P1), b.pdf(P2), c.zip(P3) → 3개로 3/3 = 100%\n- a.jpg, b.png, c.pdf, d.exe → 100%지만 jpg와 png가 같은 P1이라 4개를 썼다\n- a.jpg, b.png, c.exe → P1, P1, P3 → P2 누락(2/3)\n- a.pdf, b.exe, c.gif → P2, P3, P3 → P1 누락(2/3). gif는 P1에 없으므로 P3에 속한다","why":["100%는 달성하지만 jpg와 png가 같은 분할(P1)이라 테스트 하나가 남는다. 가장 적은 수가 아니다.","정답. 세 분할에서 하나씩 골라 3개로 100%를 달성한다.","jpg와 png가 모두 P1이라 P2(pdf)를 실행하지 않았다.","gif는 이미지지만 P1에 없는 확장자라 P3에 속한다. P1을 실행하지 않았다."],"ref":"4.2.1"},{"id":"c4k3-008","ch":4,"lo":"FL-4.2.2","k":3,"q":"쇼핑몰 포인트 적립 규칙은 다음과 같다(구매 금액은 원 단위 정수).\n- 30,000원 이하: 적립 없음\n- 30,000원 초과 100,000원 미만: 1% 적립\n- 100,000원 이상: 2% 적립\n가장 작은 분할의 최솟값과 가장 큰 분할의 최댓값은 정해져 있지 않다고 가정한다.\n\n테스터가 구매 금액 30,001원, 50,000원, 99,999원, 100,001원으로 테스트했다. 달성한 두 개 선택 경계값 분석(2-value BVA) 커버리지는?","opts":["25%","50%","75%","100%"],"ans":[1],"exp":"① 분할: 30,000 이하 / 30,001~99,999 / 100,000 이상. '초과'는 30,000을 포함하지 않고, '미만'은 100,000을 포함하지 않는다.\n② 경계값(각 분할의 최솟값과 최댓값): 30,000, 30,001, 99,999, 100,000.\n③ 4.2.2절: 두 개 선택 경계값 분석의 커버리지 항목은 식별한 모든 경계값이다 → 4개.\n④ 실행한 경계값: 30,001, 99,999 → 2개. 50,000은 경계값이 아니고, 100,001은 경계값 100,000의 이웃일 뿐 경계값이 아니다.\n⑤ 커버리지 = 2 ÷ 4 = 50%.","why":["30,000과 100,000을 가운데 분할(1% 적립)에 넣어 분할을 29,999 이하 / 30,000~100,000 / 100,001 이상으로 잘못 나눈 경우다. 이러면 경계값이 29,999 / 30,000 / 100,000 / 100,001이 되어 100,001 하나만 실행한 1/4로 계산된다.","정답. 경계값 4개 중 30,001과 99,999를 실행했다.","100,001이 경계값 100,000 근처라 실행했다고 본 경우다. 경계값 자체를 실행해야 한다.","테스트 4개가 모두 경계 근처라 100%로 본 경우다. 30,000과 100,000은 실행하지 않았다."],"ref":"4.2.2"},{"id":"c4k3-009","ch":4,"lo":"FL-4.2.2","k":3,"q":"놀이기구 탑승 기준은 다음과 같다(키는 cm 단위 정수로 측정한다).\n- 110cm 미만: 탑승 불가\n- 110cm 이상 140cm 미만: 보호자 동반 탑승\n- 140cm 이상: 혼자 탑승\n가장 작은 분할의 최솟값과 가장 큰 분할의 최댓값은 정해져 있지 않다고 가정한다.\n\n가장 적은 수의 값으로 100% 두 개 선택 경계값 분석(2-value BVA) 커버리지를 달성하는 테스트 입력 집합은?","opts":["109, 110, 139, 140","110, 140","109, 110, 140, 141","109, 110, 111, 138, 139, 140"],"ans":[0],"exp":"① 분할: 109 이하 / 110~139 / 140 이상.\n② 경계값(각 분할의 최솟값과 최댓값): 109(첫 분할의 최댓값), 110과 139(둘째 분할의 최솟값·최댓값), 140(셋째 분할의 최솟값).\n③ 4.2.2절: 두 개 선택 경계값 분석은 경계값마다 '그 경계값'과 '인접 분할에서 가장 가까운 값'이 커버리지 항목이다. 110의 짝은 109, 139의 짝은 140이므로 항목은 109, 110, 139, 140의 4개다.\n④ 값 하나가 항목 하나를 실행하므로 최소 4개가 필요하다.","why":["정답. 경계값 4개를 한 번씩 실행한다.","명세에 적힌 숫자만 고른 경우다. 109와 139를 실행하지 않아 커버리지는 50%다.","'140cm 미만'을 '140cm 이하'로 읽은 경우다. 139를 빠뜨려 75%이고, 141은 경계값이 아니다.","세 개 선택 경계값 분석처럼 이웃 값 111과 138을 더했다. 100%는 되지만 가장 적은 수가 아니다."],"ref":"4.2.2"},{"id":"c4k3-010","ch":4,"lo":"FL-4.2.2","k":3,"q":"온실 제어 시스템은 온도(℃, 정수)에 따라 다음과 같이 동작한다. 세 분할 모두 유효 분할이다.\n- 14℃ 이하: 히터 가동\n- 15~26℃: 현재 상태 유지\n- 27℃ 이상: 환기팬 가동\n가장 작은 분할의 최솟값과 가장 큰 분할의 최댓값은 정해져 있지 않다고 가정한다.\n\n가장 적은 수의 값으로 100% 세 개 선택 경계값 분석(3-value BVA) 커버리지를 달성하는 테스트 입력 집합은?","opts":["12, 13, 14, 15, 26, 27, 28, 29","14, 15, 16, 25, 26, 27","13, 14, 15, 16, 26, 27, 28, 29","13, 14, 15, 16, 25, 26, 27, 28"],"ans":[3],"exp":"① 분할: 14 이하 / 15~26 / 27 이상.\n② 경계값(각 분할의 최솟값과 최댓값): 14, 15, 26, 27.\n③ 4.2.2절: 세 개 선택 경계값 분석은 경계값마다 '그 경계값과 양쪽 이웃 값'이 커버리지 항목이다.\n- 14 → 13, 14, 15\n- 15 → 14, 15, 16\n- 26 → 25, 26, 27\n- 27 → 26, 27, 28\n④ 겹치는 값을 하나로 합치면 13, 14, 15, 16, 25, 26, 27, 28의 8개다. 값 하나가 항목 하나를 실행하므로 최소 8개가 필요하다.","why":["14와 27을 가운데 분할에 넣어 13 이하 / 14~27 / 28 이상으로 나눈 경우다(경계값 13, 14, 27, 28). 실제 경계값은 14, 15, 26, 27이라 커버리지 항목 16과 25가 빠지고, 8개 중 6개만 실행해 75%다.","15와 26의 이웃만 넣은 경우다. 14는 '14 이하' 분할의 최댓값, 27은 '27 이상' 분할의 최솟값이라 이들도 경계값이다. 따라서 13과 28도 필요하다.","27을 가운데 분할에 넣어 14 이하 / 15~27 / 28 이상으로 나눈 경우다(경계값 14, 15, 27, 28). 실제로는 26이 가운데 분할의 최댓값이라 그 아래 이웃 25가 빠지고, 8개 중 7개만 실행해 87.5%다.","정답. 경계값 4개와 그 양쪽 이웃을 합친 8개 값이다."],"ref":"4.2.2"},{"id":"c4k3-011","ch":4,"lo":"FL-4.2.2","k":3,"q":"주식 앱은 전일 대비 등락률(%, 정수)에 따라 알림을 보낸다.\n- -3% 이하: 하락 경고\n- -2% ~ 2%: 알림 없음\n- 3% 이상: 상승 알림\n가장 작은 분할의 최솟값과 가장 큰 분할의 최댓값은 정해져 있지 않다고 가정한다.\n\n테스터가 등락률 -4, -1, 2, 4, 10으로 테스트했다. 달성한 세 개 선택 경계값 분석(3-value BVA) 커버리지는?","opts":["25%","약 33%","50%","62.5%"],"ans":[2],"exp":"① 분할: -3 이하 / -2~2 / 3 이상.\n② 경계값(각 분할의 최솟값과 최댓값): -3, -2, 2, 3.\n③ 세 개 선택 커버리지 항목(경계값과 양쪽 이웃, 4.2.2절):\n- -3 → -4, -3, -2\n- -2 → -3, -2, -1\n- 2 → 1, 2, 3\n- 3 → 2, 3, 4\n겹침을 합치면 -4, -3, -2, -1, 1, 2, 3, 4의 8개다(0은 항목이 아니다).\n④ 실행한 항목: -4, -1, 2, 4 → 4개. 10은 항목이 아니다.\n⑤ 커버리지 = 4 ÷ 8 = 50%.","why":["두 개 선택 경계값 분석 기준(항목 -3, -2, 2, 3)으로 계산한 경우다. 이때는 2만 실행해 1/4이 된다.","-2와 2의 이웃만 항목으로 잡아 6개 중 2개(-1, 2)로 계산한 경우다. -3과 3도 각 분할의 경계값이므로 -4와 4도 항목이다.","정답. 커버리지 항목 8개 중 4개를 실행했다.","실행한 테스트 수 5를 항목 수 8로 나눈 경우다. 10은 커버리지 항목이 아니다."],"ref":"4.2.2"},{"id":"c4k3-012","ch":4,"lo":"FL-4.2.2","k":3,"q":"명세: '한 번에 5개 이상 주문하면 10% 묶음 할인을 적용한다. 4개 이하는 할인하지 않는다.'(주문 수량은 정수)\n그런데 개발자가 조건을 'if (수량 == 5) 할인 적용'으로 잘못 구현했다.\n\n다음 테스트 입력 중 이 결함으로 인한 장애(failure)를 드러낼 수 있는 것은?","opts":["수량 3","수량 4","수량 5","수량 6"],"ans":[3],"exp":"명세대로라면 4 이하는 할인 없음, 5 이상은 할인이다. 값마다 명세와 실제 구현을 비교하면:\n- 3: 명세 할인 없음 / 구현 할인 없음 → 같음\n- 4: 명세 할인 없음 / 구현 할인 없음 → 같음\n- 5: 명세 할인 / 구현 할인 → 같음\n- 6: 명세 할인 / 구현 할인 없음 → 다름(장애 발생)\n이 경계의 경계값은 4와 5다. 두 개 선택 경계값 분석의 값(4, 5)으로는 결함을 찾지 못하고, 세 개 선택 경계값 분석이 추가하는 이웃 값(3, 6) 중 6이 찾아낸다. 4.2.2절이 세 개 선택이 두 개 선택보다 더 엄격하다고 설명하는 이유가 이것이다.","why":["명세와 구현 모두 할인하지 않으므로 결과가 같다.","경계값이지만 명세와 구현 모두 할인하지 않아 결과가 같다.","경계값이지만 '== 5'가 참이라 구현도 할인을 적용한다. 결과가 같다.","정답. 명세는 할인을 요구하지만 '== 5'가 거짓이라 할인이 적용되지 않는다."],"ref":"4.2.2"},{"id":"c4k3-013","ch":4,"lo":"FL-4.2.2","k":3,"q":"영화 예매 앱에서 관람 인원은 드롭다운으로 1~10명 중에서만 고를 수 있다(다른 값은 입력할 수 없다).\n- 1명: 일반 예매\n- 2~5명: 소그룹 할인\n- 6~10명: 단체 할인\n\n100% 두 개 선택 경계값 분석(2-value BVA) 커버리지를 달성하는 데 필요한 최소 테스트 케이스 수는? (테스트 케이스 하나는 인원 값 하나를 고른다.)","opts":["4","5","6","7"],"ans":[1],"exp":"① 분할: {1}, {2~5}, {6~10}. 입력할 수 있는 값이 1~10뿐이므로 분할은 이 세 개다.\n② 4.2.2절: 분할의 최솟값과 최댓값이 경계값이다.\n- {1}: 최솟값과 최댓값이 모두 1 → 경계값 1\n- {2~5}: 2, 5\n- {6~10}: 6, 10\n③ 두 개 선택 경계값 분석의 커버리지 항목은 식별한 모든 경계값이다: 1, 2, 5, 6, 10 → 5개. 10 위에는 인접 분할이 없으므로 10과 짝지을 값은 없다.\n④ 따라서 최소 5개다.","why":["분할 사이의 값(1, 2, 5, 6)만 센 경우다. 10도 마지막 분할의 최댓값이므로 경계값이다.","정답. 경계값 1, 2, 5, 6, 10을 하나씩 실행한다.","1을 최솟값과 최댓값으로 두 번 센 경우다. 같은 값이므로 커버리지 항목은 하나다.","고를 수 없는 0과 11까지 넣은 경우다. 드롭다운으로 입력할 수 없는 값은 어느 분할에도 속하지 않는다."],"ref":"4.2.2"},{"id":"c4k3-014","ch":4,"lo":"FL-4.2.2","k":3,"q":"냉동 창고 모니터링 시스템은 온도(℃, 정수)에 따라 다음과 같이 동작한다.\n- -25℃ 이하: 과냉각 경고\n- -24℃ ~ -18℃: 정상\n- -17℃ ~ -10℃: 주의 알림\n- -9℃ 이상: 위험 경보\n가장 작은 분할의 최솟값과 가장 큰 분할의 최댓값은 정해져 있지 않다고 가정한다.\n\n두 개 선택 경계값 분석(2-value BVA)과 세 개 선택 경계값 분석(3-value BVA)으로 각각 100% 커버리지를 달성하려면 서로 다른 값을 몇 개씩 실행해야 하는가?","opts":["2-value 3개, 3-value 9개","2-value 6개, 3-value 9개","2-value 6개, 3-value 12개","2-value 6개, 3-value 18개"],"ans":[2],"exp":"① 분할 4개: -25 이하 / -24~-18 / -17~-10 / -9 이상.\n② 경계값(각 분할의 최솟값과 최댓값): -25, -24, -18, -17, -10, -9 → 6개. 두 개 선택의 커버리지 항목은 식별한 모든 경계값이므로 6개다.\n③ 세 개 선택은 경계값마다 그 값과 양쪽 이웃이 항목이다(4.2.2절).\n- -25 → -26, -25, -24 / -24 → -25, -24, -23\n- -18 → -19, -18, -17 / -17 → -18, -17, -16\n- -10 → -11, -10, -9 / -9 → -10, -9, -8\n④ 겹치는 값을 합치면 -26, -25, -24, -23, -19, -18, -17, -16, -11, -10, -9, -8의 12개다.","why":["분할이 만나는 곳 3군데를 하나씩만 세고, 그곳마다 3개로 계산한 경우다. 경계값은 분할마다 최솟값과 최댓값이므로 6개다.","세 개 선택을 '분할이 만나는 곳 3군데 × 3개'로 계산한 경우다. 만나는 곳마다 경계값이 2개(예: -25와 -24)이고 각각의 이웃까지 포함하므로 한 곳에서 4개 값이 나온다.","정답. 경계값 6개, 경계값과 이웃을 합친 서로 다른 값 12개다.","경계값 6개 × 3으로 계산해 겹치는 값을 중복으로 센 경우다. 예를 들어 -25와 -24는 두 경계값의 항목에 모두 들어 있다."],"ref":"4.2.2"},{"id":"c4k3-015","ch":4,"lo":"FL-4.2.2","k":3,"q":"출입 관리 키오스크는 체온(℃)을 소수점 첫째 자리까지 측정한다.\n- 37.4℃ 이하: 통과\n- 37.5℃ ~ 37.9℃: 재측정 안내\n- 38.0℃ 이상: 출입 제한\n가장 작은 분할의 최솟값과 가장 큰 분할의 최댓값은 정해져 있지 않다고 가정한다.\n\n가장 적은 수의 값으로 100% 두 개 선택 경계값 분석(2-value BVA) 커버리지를 달성하는 테스트 입력 집합은?","opts":["37.5, 38.0","37.4, 37.5, 38.0, 38.1","37.4, 37.5, 37.9, 38.0","37.49, 37.5, 37.99, 38.0"],"ans":[2],"exp":"① 측정 단위가 0.1℃이므로 바로 이웃한 두 값의 차이는 0.1이다.\n② 분할: 37.4 이하 / 37.5~37.9 / 38.0 이상.\n③ 경계값(각 분할의 최솟값과 최댓값): 37.4, 37.5, 37.9, 38.0 → 두 개 선택의 커버리지 항목 4개(4.2.2절).\n④ 값 하나가 항목 하나를 실행하므로 최소 4개: 37.4, 37.5, 37.9, 38.0.","why":["명세에 적힌 분할 시작값만 고른 경우다. 37.4와 37.9를 실행하지 않아 50%다.","37.9를 빠뜨리고 경계값이 아닌 38.1을 넣었다. 커버리지는 75%다.","정답. 0.1℃ 단위로 식별한 경계값 4개를 실행한다.","측정 단위를 0.01℃로 잘못 잡은 경우다. 37.49와 37.99는 측정될 수 없는 값이고, 경계값 37.4와 37.9를 실행하지 않았다."],"ref":"4.2.2"},{"id":"c4k3-016","ch":4,"lo":"FL-4.2.3","k":3,"q":"온라인 서점의 배송비 규칙을 다음 결정 테이블로 정리했다. 8개 열은 모두 실현 가능하다. 제주와 울릉도는 도서산간 지역이고, 서울과 광주는 도서산간 지역이 아니다.\n\n테스터가 다음 테스트 케이스 6개를 실행했다.\n- T1: 멤버십 회원, 12,000원, 서울\n- T2: 비회원, 20,000원, 제주\n- T3: 비회원, 15,000원, 서울\n- T4: 비회원, 9,000원, 울릉도\n- T5: 멤버십 회원, 8,000원, 광주\n- T6: 비회원, 14,900원, 서울\n\n달성한 결정 테이블 테스팅(decision table testing) 커버리지는?","table":{"head":["조건/동작","R1","R2","R3","R4","R5","R6","R7","R8"],"rows":[["C1 유료 멤버십 회원","T","T","T","T","F","F","F","F"],["C2 주문 금액 15,000원 이상","T","T","F","F","T","T","F","F"],["C3 도서산간 지역 배송","T","F","T","F","T","F","T","F"],["A1 기본 배송비 면제","X","X","X","X","X","X","",""],["A2 도서산간 추가 배송비 부과","X","","X","","X","","X",""]]},"opts":["50%","62.5%","75%","약 83%"],"ans":[1],"exp":"테스트 케이스마다 (C1, C2, C3) 값을 정해 열을 찾는다.\n- T1: T, F, F → R4\n- T2: F, T, T → R5\n- T3: F, T, F → R6 (15,000원은 '15,000원 이상'에 포함)\n- T4: F, F, T → R7\n- T5: T, F, F → R4 (T1과 같은 열)\n- T6: F, F, F → R8\n실행한 서로 다른 열: R4, R5, R6, R7, R8 → 5개. R1, R2, R3은 실행하지 않았다.\n4.2.3절: 커버리지 = 실행한 열 수 ÷ 실현 가능한 열의 총수 = 5 ÷ 8 = 62.5%.","why":["T3의 15,000원을 '15,000원 이상'이 아니라고 보고 R8로 분류한 경우다(4/8). 15,000원은 '이상' 조건을 만족한다.","정답. 서로 다른 열 5개를 실행했다.","테스트 케이스 수 6을 실행한 열 수로 본 경우다. T1과 T5는 같은 열(R4)을 실행한다.","실행한 열 수 5를 테스트 케이스 수 6으로 나눈 경우다. 분모는 실현 가능한 열의 총수 8이다."],"ref":"4.2.3"},{"id":"c4k3-017","ch":4,"lo":"FL-4.2.3","k":3,"q":"놀이공원 요금 규칙을 제한-입력(limited-entry) 결정 테이블로 만들려고 한다. 조건은 다음 세 가지이고, 각 조건은 T 또는 F 값을 가진다.\n- C1: 만 13세 미만이다\n- C2: 만 65세 이상이다\n- C3: 연간 회원권을 가지고 있다\n실현 불가능한 조건 조합의 열은 삭제한다.\n\n100% 결정 테이블 커버리지를 달성하는 데 필요한 최소 테스트 케이스 수는?","opts":["4","6","7","8"],"ans":[1],"exp":"① 전체 결정 테이블의 열 수: 조건 3개가 각각 T/F이므로 2 × 2 × 2 = 8개.\n② 한 사람이 '13세 미만'이면서 '65세 이상'일 수는 없으므로 C1=T, C2=T인 조합은 실현 불가능하다. 이 조합에서 C3는 T/F 두 가지이므로 삭제할 열은 2개다.\n③ 실현 가능한 열 = 8 - 2 = 6개. 남는 (C1, C2) 조합은 (T, F) 어린이, (F, T) 경로, (F, F) 13~64세이고 각각 C3가 T/F다.\n④ 4.2.3절: 커버리지 항목은 실현 가능한 조건 조합을 가진 열이다. 테스트 케이스 하나는 열 하나를 실행하므로 최소 6개가 필요하다.","why":["C1=F, C2=F(13~64세) 조합까지 삭제한 경우다. 13~64세는 실제로 있으므로 실현 가능한 열이다.","정답. 8개 열 중 실현 불가능한 2개 열을 뺀 6개다.","C1=T, C2=T 조합을 1개 열로만 센 경우다. C3가 T/F 두 가지라 삭제할 열은 2개다.","실현 불가능한 열까지 커버리지 항목으로 센 경우다."],"ref":"4.2.3"},{"id":"c4k3-018","ch":4,"lo":"FL-4.2.3","k":3,"q":"대출 심사 규칙을 다음 확장-입력(extended-entry) 결정 테이블로 정리했다. '–'는 해당 조건 값이 결과에 영향이 없다는 뜻이다.\n\n이미 다음 테스트를 실행했다.\n- (신용등급 A, 재직 3년)\n- (신용등급 B, 재직 6개월)\n- (신용등급 C, 재직 5년)\n\n아직 실행하지 않은 열을 실행하는 테스트 케이스를 두 개 고르시오.","table":{"head":["조건/동작","R1","R2","R3","R4","R5"],"rows":[["C1 신용등급","A","A","B","B","C"],["C2 재직 기간 1년 이상","T","F","T","F","–"],["A1 대출 승인","X","X","X","",""],["A2 우대 금리 적용","X","","","",""],["A3 추가 심사 요청","","","","X",""],["A4 대출 거절","","","","","X"]]},"opts":["신용등급 A, 재직 2년","신용등급 A, 재직 8개월","신용등급 C, 재직 3개월","신용등급 B, 재직 1년 6개월","신용등급 B, 재직 11개월"],"ans":[1,3],"exp":"① 기존 테스트가 실행한 열: (A, 3년) → R1, (B, 6개월) → R4, (C, 5년) → R5. R5는 C2가 '–'이므로 재직 기간과 관계없이 C등급이면 R5다.\n② 실행하지 않은 열: R2(A, 1년 미만), R3(B, 1년 이상). 현재 커버리지는 3/5 = 60%다.\n③ 보기별 열: A·2년 → R1, A·8개월 → R2, C·3개월 → R5, B·1년 6개월 → R3, B·11개월 → R4.\n따라서 새 열을 실행하는 것은 'A·8개월'(R2)과 'B·1년 6개월'(R3)이다. 두 테스트를 추가하면 5개 열을 모두 실행해 100%가 된다(4.2.3절).","why":["R1(A, 1년 이상)은 (A, 3년)으로 이미 실행했다.","정답. R2(A, 1년 미만)를 실행한다.","C등급은 재직 기간과 관계없이 R5이고, (C, 5년)으로 이미 실행했다.","정답. 1년 6개월은 '1년 이상'이므로 R3(B, 1년 이상)를 실행한다.","11개월은 '1년 이상'이 아니므로 R4이고, (B, 6개월)로 이미 실행했다."],"ref":"4.2.3"},{"id":"c4k3-019","ch":4,"lo":"FL-4.2.3","k":3,"q":"카드 결제 승인 규칙을 다음과 같은 전체 결정 테이블로 만들었다. 이제 테이블을 최소화하려고 한다.\n\n어떤 조건이 결과에 영향을 주지 않아 그 조건을 '–'로 바꾸고 하나의 열로 병합할 수 있는 두 열은?","table":{"head":["조건/동작","R1","R2","R3","R4","R5","R6","R7","R8"],"rows":[["C1 카드 유효","T","T","T","T","F","F","F","F"],["C2 한도 충분","T","T","F","F","T","T","F","F"],["C3 해외 결제","T","F","T","F","T","F","T","F"],["A1 결제 승인","X","X","","","","","",""],["A2 본인 확인 문자 발송","X","","","","","","",""],["A3 결제 거절","","","X","X","X","X","X","X"]]},"opts":["R3과 R4","R1과 R2","R2와 R4","R2와 R6"],"ans":[0],"exp":"4.2.3절: 일부 조건이 결과에 영향을 미치지 않는 열들은 하나로 병합해 테이블을 최소화할 수 있다. 두 열이 조건 하나만 다르고 동작이 똑같다면, 그 조건은 결과에 영향이 없으므로 '–'로 병합할 수 있다.\n- R3(T, F, T)과 R4(T, F, F): C3만 다르고 둘 다 '결제 거절'만 발생 → (T, F, –)로 병합 가능\n- R1(T, T, T)과 R2(T, T, F): C3만 다르지만 R1에만 본인 확인 문자 발송이 있다 → 병합 불가\n- R2(T, T, F)와 R4(T, F, F): C2만 다르지만 승인과 거절로 동작이 다르다 → 병합 불가\n- R2(T, T, F)와 R6(F, T, F): C1만 다르지만 승인과 거절로 동작이 다르다 → 병합 불가","why":["정답. 카드가 유효하고 한도가 부족하면 해외 결제 여부와 관계없이 거절이므로 C3를 '–'로 두고 병합할 수 있다.","해외 결제 여부(C3)에 따라 본인 확인 문자 발송이 달라지므로 C3가 결과에 영향을 준다.","한도 충분 여부(C2)에 따라 승인과 거절이 갈리므로 병합할 수 없다.","카드 유효 여부(C1)에 따라 승인과 거절이 갈리므로 병합할 수 없다."],"ref":"4.2.3"},{"id":"c4k3-020","ch":4,"lo":"FL-4.2.3","k":3,"q":"공영 주차장 요금 감면 규칙을 다음 결정 테이블로 정리했다. '–'는 해당 조건 값이 결과에 영향이 없다는 뜻이다.\n각 테스트는 (C1 값, C2 값, 주차 시간)으로 쓴다. 예를 들어 (T, F, 3시간)은 장애인 차량이고 경차가 아니며 3시간 주차한 경우다.\n\n가장 적은 수의 테스트 케이스로 100% 결정 테이블 커버리지를 달성하는 테스트 집합은?","table":{"head":["조건/동작","R1","R2","R3","R4"],"rows":[["C1 장애인 차량","T","F","F","F"],["C2 경차","–","T","F","F"],["C3 주차 시간 2시간 이하","–","–","T","F"],["A1 요금 전액 면제","X","","",""],["A2 요금 50% 감면","","X","",""],["A3 기본 요금","","","X",""],["A4 기본 요금 + 초과 요금","","","","X"]]},"opts":["(T, F, 3시간), (T, T, 1시간), (F, T, 1시간), (F, F, 1시간)","(F, T, 1시간), (F, F, 2시간), (F, F, 3시간)","(T, T, 1시간), (F, T, 3시간), (F, F, 1시간), (F, F, 5시간)","(T, T, 3시간), (F, T, 4시간), (F, F, 2시간), (F, T, 1시간), (F, F, 2시간 30분)"],"ans":[2],"exp":"결정 테이블의 열은 4개(R1~R4)이고 모두 실행해야 100%다(4.2.3절). 테스트 하나는 열 하나만 실행하므로 최소 4개가 필요하다.\n보기별로 열을 찾으면:\n- (T, F, 3시간) R1, (T, T, 1시간) R1, (F, T, 1시간) R2, (F, F, 1시간) R3 → R4 누락(3/4)\n- (F, T, 1시간) R2, (F, F, 2시간) R3, (F, F, 3시간) R4 → R1 누락(3/4)\n- (T, T, 1시간) R1, (F, T, 3시간) R2, (F, F, 1시간) R3, (F, F, 5시간) R4 → 테스트 4개로 100%\n- R1, R2, R3(2시간은 '2시간 이하'), R2, R4 → 100%지만 R2를 두 번 실행해 테스트가 5개다","why":["장애인 차량 테스트 2개가 모두 R1이고, R4(비장애인·경차 아님·2시간 초과)를 실행하지 않았다.","장애인 차량(C1=T) 테스트가 없어 R1을 실행하지 않았다.","정답. 4개 열을 테스트 4개로 하나씩 실행한다.","100%는 달성하지만 R2를 두 번 실행해 테스트가 5개다. 가장 적은 수가 아니다."],"ref":"4.2.3"},{"id":"c4k3-021","ch":4,"lo":"FL-4.2.3","k":3,"q":"쇼핑몰 회원 혜택 규칙을 다음 결정 테이블로 정리했다. '–'는 해당 조건 값이 결과에 영향이 없다는 뜻이고, 'N/A'는 해당 규칙에서 조건이 실행 불가능(infeasible)하다는 뜻이다(비회원에게는 등급이 없다). 동작 칸이 모두 비어 있으면 혜택이 없다.\n\n이 결정 테이블에서 도출한 테스트 케이스 중 기대 결과가 올바른 것은?","table":{"head":["조건/동작","R1","R2","R3","R4"],"rows":[["C1 회원 가입","T","T","T","F"],["C2 VIP 등급","T","F","F","N/A"],["C3 생일이 있는 달","–","T","F","–"],["A1 20% 할인 쿠폰","X","","",""],["A2 10% 할인 쿠폰","","X","",""],["A3 포인트 2배 적립","X","","",""]]},"opts":["일반(VIP 아님) 회원, 생일이 없는 달 → 10% 할인 쿠폰","비회원, 생일이 있는 달 → 10% 할인 쿠폰","VIP 회원, 생일이 없는 달 → 20% 할인 쿠폰과 포인트 2배 적립","일반(VIP 아님) 회원, 생일이 있는 달 → 20% 할인 쿠폰과 포인트 2배 적립"],"ans":[2],"exp":"입력을 조건 값으로 바꿔 열을 찾고, 그 열의 동작을 기대 결과로 쓴다(4.2.3절 표기법: X는 동작 발생, 빈칸은 동작 없음).\n- 일반 회원, 생일 없는 달: C1=T, C2=F, C3=F → R3 → 혜택 없음\n- 비회원, 생일 있는 달: C1=F → R4(C2는 N/A, C3는 –) → 혜택 없음\n- VIP 회원, 생일 없는 달: C1=T, C2=T → R1(C3는 – 이라 생일 여부와 무관) → 20% 할인 쿠폰 + 포인트 2배 적립\n- 일반 회원, 생일 있는 달: T, F, T → R2 → 10% 할인 쿠폰","why":["R3에 해당한다. R3의 동작 칸은 모두 비어 있으므로 혜택이 없다.","비회원은 R4다. 생일 여부는 '–'라 결과에 영향이 없고, 혜택이 없다.","정답. VIP 회원은 C3가 '–'인 R1에 해당하므로 생일 달이 아니어도 20% 쿠폰과 포인트 2배 적립을 받는다.","R2에 해당하므로 10% 할인 쿠폰만 받는다. 20% 쿠폰과 포인트 2배는 R1(VIP)의 동작이다."],"ref":"4.2.3"},{"id":"c4k3-022","ch":4,"lo":"FL-4.2.4","k":3,"q":"음악 플레이어의 상태 전이 모델은 다음 표와 같다. 표에 없는 상태와 이벤트 조합은 비유효 전이다.\n모든 테스트 케이스는 '멈춤' 상태에서 시작한다. 보기의 '재생', '일시정지', '정지'는 각각 재생 버튼, 일시정지 버튼, 정지 버튼 이벤트다.\n\n다음 이벤트 순서 중 테스트 케이스 하나만으로 100% 유효 전이 커버리지(valid transitions coverage, 0-스위치 커버리지)를 달성하는 것은?","table":{"head":["현재 상태","이벤트","다음 상태"],"rows":[["멈춤","재생 버튼","재생 중"],["재생 중","일시정지 버튼","일시정지됨"],["일시정지됨","재생 버튼","재생 중"],["재생 중","정지 버튼","멈춤"],["일시정지됨","정지 버튼","멈춤"]]},"opts":["재생 → 일시정지 → 재생 → 정지 → 재생 → 일시정지 → 정지","재생 → 일시정지 → 재생 → 정지 → 재생 → 일시정지 → 재생","재생 → 일시정지 → 재생 → 일시정지 → 정지 → 재생 → 일시정지","재생 → 일시정지 → 정지 → 재생 → 정지 → 일시정지"],"ans":[0],"exp":"유효 전이는 5개다: ① 멈춤→재생 중 ② 재생 중→일시정지됨 ③ 일시정지됨→재생 중 ④ 재생 중→멈춤 ⑤ 일시정지됨→멈춤.\n보기별로 상태를 따라가면:\n- 재생→일시정지→재생→정지→재생→일시정지→정지: ①②③④①②⑤ → 5개 모두(100%)\n- 재생→일시정지→재생→정지→재생→일시정지→재생: ①②③④①②③ → ⑤ 누락(4/5 = 80%)\n- 재생→일시정지→재생→일시정지→정지→재생→일시정지: ①②③②⑤①② → ④ 누락(80%)\n- 재생→일시정지→정지→재생→정지→일시정지: ①②⑤①④ 다음, '멈춤' 상태에서 '일시정지 버튼'은 정의되지 않은 비유효 전이. 유효 전이는 ③ 누락(80%)\n4.2.4절: 유효 전이 커버리지 100%를 달성하려면 테스트 케이스가 모든 유효 전이를 실행해야 한다.","why":["정답. 유효 전이 5개를 모두 실행한다.","일시정지됨에서 정지 버튼을 누르는 전이(⑤)를 실행하지 않았다. 마지막 '일시정지 → 재생'은 ②③을 다시 실행할 뿐이다.","재생 중에서 정지 버튼을 누르는 전이(④)를 실행하지 않았다. 정지 버튼은 일시정지됨에서 한 번만 눌렀다(⑤).","일시정지됨에서 재생 버튼을 누르는 전이(③)를 실행하지 않았다. 마지막 '일시정지'는 멈춤 상태에서 누른 것이라 표에 없는 비유효 전이다."],"ref":"4.2.4"},{"id":"c4k3-023","ch":4,"lo":"FL-4.2.4","k":3,"q":"스마트 조명의 상태 전이 모델은 다음 표와 같다(초기 상태: 꺼짐). 이벤트는 전원 버튼, 절전 버튼, 타이머 설정, 시간 만료의 4가지다.\n\n다음 두 테스트 케이스를 실행했다.\n- TC1: 전원 버튼 → 절전 버튼 → 전원 버튼\n- TC2: 전원 버튼 → 타이머 설정 → 시간 만료\n\n달성한 유효 전이 커버리지(valid transitions coverage)와 모든 상태 커버리지(all states coverage)는?","table":{"head":["현재 상태","이벤트","다음 상태"],"rows":[["꺼짐","전원 버튼","켜짐"],["켜짐","전원 버튼","꺼짐"],["켜짐","절전 버튼","절전"],["절전","절전 버튼","켜짐"],["절전","전원 버튼","꺼짐"],["켜짐","타이머 설정","타이머 동작"],["타이머 동작","시간 만료","꺼짐"],["타이머 동작","전원 버튼","꺼짐"]]},"opts":["유효 전이 75%, 모든 상태 100%","유효 전이 31.25%, 모든 상태 100%","유효 전이 100%, 모든 상태 100%","유효 전이 62.5%, 모든 상태 100%"],"ans":[3],"exp":"① 유효 전이는 표에 있는 8개다.\n② TC1: 꺼짐→켜짐(전원 버튼), 켜짐→절전(절전 버튼), 절전→꺼짐(전원 버튼)\nTC2: 꺼짐→켜짐(전원 버튼), 켜짐→타이머 동작(타이머 설정), 타이머 동작→꺼짐(시간 만료)\n③ 서로 다른 유효 전이: 꺼짐→켜짐(두 번 실행했지만 1개), 켜짐→절전, 절전→꺼짐, 켜짐→타이머 동작, 타이머 동작→꺼짐(시간 만료) → 5개. 실행하지 않은 것은 켜짐→꺼짐, 절전→켜짐, 타이머 동작→꺼짐(전원 버튼)이다.\n④ 유효 전이 커버리지 = 5 ÷ 8 = 62.5%. 상태는 꺼짐, 켜짐, 절전, 타이머 동작 4개를 모두 거쳤으므로 모든 상태 커버리지 = 4 ÷ 4 = 100%(4.2.4절).\n모든 상태 커버리지가 100%여도 유효 전이 커버리지는 100%가 아닐 수 있다.","why":["두 테스트에서 실행한 전이 6번을 중복 없이 세지 않아 6/8로 계산한 경우다. 꺼짐→켜짐은 두 번 실행했어도 1개다.","분모를 상태 테이블의 모든 셀(상태 4 × 이벤트 4 = 16)로 잡은 경우다. 유효 전이 커버리지의 분모는 유효 전이 수 8이다.","모든 상태 커버리지 100%가 유효 전이 커버리지 100%를 보장한다고 본 경우다. 4.2.4절의 보장 관계는 그 반대다.","정답. 유효 전이 8개 중 5개, 상태 4개 중 4개를 실행했다."],"ref":"4.2.4"},{"id":"c4k3-024","ch":4,"lo":"FL-4.2.4","k":3,"q":"자판기의 상태 테이블(state table)은 다음과 같다. 셀에는 다음 상태가 적혀 있고, 빈 셀은 비유효 전이다(초기 상태: 대기).\n\n다음 테스트 케이스 6개를 실행했다. [ ] 안의 이벤트는 비유효 전이를 시도한 것이며, 시도 후 그 테스트 케이스는 끝난다.\n- TC1: 동전 투입 → 상품 선택 → 배출 완료\n- TC2: 동전 투입 → 동전 투입 → 반환 버튼\n- TC3: [상품 선택]\n- TC4: [배출 완료]\n- TC5: 동전 투입 → [배출 완료]\n- TC6: 동전 투입 → 상품 선택 → [반환 버튼]\n\n달성한 모든 전이 커버리지(all transitions coverage)는?","table":{"head":["상태 \\ 이벤트","동전 투입","상품 선택","반환 버튼","배출 완료"],"rows":[["대기","금액 투입됨","","",""],["금액 투입됨","금액 투입됨","상품 배출 중","대기",""],["상품 배출 중","","","","대기"]]},"opts":["약 42%","약 57%","75%","100%"],"ans":[2],"exp":"① 4.2.4절: 모든 전이 커버리지의 커버리지 항목은 상태 테이블에 표시된 모든 전이(유효와 비유효)다. 셀 수 = 상태 3 × 이벤트 4 = 12개. 채워진 셀(유효 전이) 5개, 빈 셀(비유효 전이) 7개.\n② 실행한 유효 전이: TC1 → 대기→금액 투입됨, 금액 투입됨→상품 배출 중, 상품 배출 중→대기 / TC2 → 금액 투입됨→금액 투입됨, 금액 투입됨→대기 → 5개 모두.\n③ 시도한 비유효 전이: 대기+상품 선택(TC3), 대기+배출 완료(TC4), 금액 투입됨+배출 완료(TC5), 상품 배출 중+반환 버튼(TC6) → 4개. 시도하지 않은 비유효 전이는 대기+반환 버튼, 상품 배출 중+동전 투입, 상품 배출 중+상품 선택이다.\n④ 커버리지 = (5 + 4) ÷ 12 = 75%.","why":["유효 전이 5개만 분자로 세어 5/12로 계산한 경우다. 시도한 비유효 전이도 분자에 들어간다.","비유효 전이만 따로 4/7로 계산한 경우다. 모든 전이 커버리지는 유효와 비유효 전이를 합쳐 계산한다.","정답. 전이 12개 중 9개를 실행하거나 시도했다.","유효 전이 커버리지(5/5 = 100%)와 혼동한 경우다."],"ref":"4.2.4"},{"id":"c4k3-025","ch":4,"lo":"FL-4.2.4"
