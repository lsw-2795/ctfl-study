 수 있다.","표기법: 조건 'T' = 충족, 'F' = 미충족, '–' = 결과에 영향 없음, 'N/A' = 그 규칙에서 조건이 실행 불가능. 동작 'X' = 발생해야 함, 공백 = 발생하지 않아야 함. 다른 표기법도 쓸 수 있다.","전체 결정 테이블은 모든 조건 조합을 담을 만큼 열이 있다. 실현 불가능한 조합의 열을 지워 단순화하고, 결과에 영향 없는 조건이 있는 열들을 하나로 합쳐 최소화할 수 있다. 최소화 알고리즘은 실라버스 범위 밖이다.","커버리지 항목 = 실현 가능한 조건 조합을 가진 열. 100% 커버리지는 이 열을 모두 실행하는 것이다. 커버리지 = 실행한 열 수 ÷ 실행 가능한(실현 가능한) 열 총수.","강점: 놓치기 쉬운 조합까지 모든 조건 조합을 체계적으로 찾고, 누락되거나 모순된 요구사항을 찾는 데 도움이 된다. 약점: 규칙 수가 조건 수에 따라 기하급수적으로 늘어 시간이 오래 걸릴 수 있다. 이때는 최소화한 결정 테이블이나 리스크 기반 접근법을 써서 실행할 규칙 수를 줄일 수 있다.","예제: 조건 C1 '나이 < 13', C2 '나이 ≥ 65'(부울 조건 2개라 조합은 2 × 2 = 4개). C1 = T이면서 C2 = T인 나이는 없으므로 이 열은 실현 불가능해 지운다. 실현 가능한 열은 (T, F), (F, T), (F, F)의 3개라서 100% 커버리지에 테스트 케이스 3개가 필요하다. 2개 열만 실행하면 2 ÷ 3 ≈ 66.7%."],"traps":["커버리지 분모는 '실현 가능한' 열 수다. 실현 불가능한 조합의 열은 세지 않는다.","'–'(결과에 영향 없음)와 'N/A'(그 규칙에서 실행 불가능)는 뜻이 다르다.","동작 행의 공백은 '모름'이 아니라 '발생하지 않아야 함'이다.","결정 테이블 최소화 알고리즘은 실라버스 범위 밖이다."]},{"id":"4.2.4","title":"상태 전이 테스팅","points":["상태 다이어그램은 가능한 상태와 유효한 상태 전이를 보여 줘 시스템 동작을 모델링한다. 전이는 이벤트로 시작되고 가드(guard) 조건이 붙을 수 있다. 전이는 즉각적이라고 보며, 가끔 소프트웨어 동작으로 이어진다. 표기는 보통 '이벤트 [가드 조건] / 동작'이고, 없거나 테스터와 관련 없으면 가드 조건과 동작은 생략할 수 있다.","상태 테이블은 상태 다이어그램과 같은 내용을 다르게 표현한 모델이다. 행 = 상태, 열 = 이벤트(가드 조건이 있으면 함께), 셀 = 전이(목표 상태와 결과 동작). 다이어그램과 달리 유효하지 않은 전이를 빈 셀로 명확하게 보여 준다.","테스트 케이스는 보통 이벤트 순서와 그 결과 생기는 상태 변화(필요하면 동작)로 표현한다. 테스트 케이스 하나가 대부분 여러 전이를 포함한다.","모든 상태 커버리지(all states coverage): 커버리지 항목 = 상태. 커버리지 = 실행된 상태 수 ÷ 전체 상태 수.","유효 전이 커버리지(valid transitions coverage, 0-스위치 커버리지): 커버리지 항목 = 각 유효 전이. 커버리지 = 실행된 유효 전이 수 ÷ 총 유효 전이 수. 가장 널리 쓰는 기준이다.","모든 전이 커버리지(all transitions coverage): 커버리지 항목 = 상태 테이블에 표시된 모든 전이(유효 + 비유효). 모든 유효 전이를 실행하고 비유효 전이의 실행을 시도해야 한다. 커버리지 = 실행하거나 시도한 유효·비유효 전이 수 ÷ 총 유효·비유효 전이 수. 테스트 케이스 하나에 비유효 전이를 하나만 넣으면 결함 마스킹(한 결함이 다른 결함의 탐지를 막는 상황)을 막는 데 도움이 된다.","강도 순서: 모든 상태 < 유효 전이 < 모든 전이. 유효 전이 100%면 모든 상태 100%도 달성된다. 모든 전이 100%면 모든 상태와 유효 전이 100%가 모두 보장된다. 미션·안전에 치명적인 소프트웨어는 모든 전이 커버리지를 최소 기준으로 삼아야 한다.","예제(음악 플레이어): 상태 3개(대기, 재생 중, 일시정지, 초기 상태는 대기), 이벤트 3개(재생 버튼, 일시정지 버튼, 정지 버튼). 유효 전이 5개: 대기-재생 버튼→재생 중, 재생 중-일시정지 버튼→일시정지, 일시정지-재생 버튼→재생 중, 재생 중-정지 버튼→대기, 일시정지-정지 버튼→대기. 상태 테이블 셀은 3 × 3 = 9개라서 비유효 전이(빈 셀)는 4개, 모든 전이 커버리지의 커버리지 항목은 9개다. 대기에서 시작해 이벤트 '재생, 일시정지' 순서로 진행하는 테스트 하나는 모든 상태 3 ÷ 3 = 100%지만 유효 전이는 2 ÷ 5 = 40%다. 대기에서 시작해 '재생, 일시정지, 재생, 정지, 재생, 일시정지, 정지' 순서로 진행하는 테스트 하나면 유효 전이 5 ÷ 5 = 100%다."],"traps":["비유효 전이를 빈 셀로 명확히 보여 주는 것은 상태 테이블이다. 상태 다이어그램은 유효한 전이를 보여 준다.","0-스위치 커버리지 = 유효 전이 커버리지다. 모든 전이 커버리지와 헷갈리지 않는다.","가장 널리 쓰는 기준은 유효 전이 커버리지, 미션·안전에 치명적인 소프트웨어의 최소 기준은 모든 전이 커버리지다.","모든 상태 100%라도 유효 전이 100%는 보장되지 않는다. 반대 방향(유효 전이 100% → 모든 상태 100%)만 성립한다.","모든 전이 커버리지에서 비유효 전이는 '실행'이 아니라 '실행 시도'를 센다."]},{"id":"4.3","title":"화이트박스 테스트 기법","points":["코드를 대상으로 한 화이트박스 기법 중 간단하고 널리 쓰는 두 가지를 다룬다: 구문 테스팅, 분기 테스팅.","안전이나 미션에 치명적이거나 무결성이 높아야 하는 환경에서는 더 철저한 코드 커버리지를 위해 더 엄격한 화이트박스 기법을 쓴다. 이런 기법은 실라버스에서 다루지 않는다.","상위 테스트 레벨(예: API 테스트)에서 쓰는 화이트박스 기법, 코드와 관련 없는 커버리지(예: 신경망 테스트의 뉴런 커버리지)를 쓰는 기법도 있지만 실라버스에서 다루지 않는다.","4.3.1~4.3.3은 모두 K2(설명) 학습 목표이고, 시험에서는 이 묶음에서 2문제가 나온다."],"traps":[]},{"id":"4.3.1","title":"구문 테스팅과 구문 커버리지","points":["구문 테스팅에서 커버리지 항목은 실행 가능한 구문이다. 목적은 허용할 수 있는 수준의 커버리지가 될 때까지 구문을 실행하는 테스트 케이스를 설계하는 것이다.","구문 커버리지 = 테스트 케이스가 실행한 구문 수 ÷ 코드의 실행 가능한 구문 총수(백분율).","100% 구문 커버리지는 코드의 모든 실행 가능한 구문이 적어도 한 번 실행됐음을 보장한다. 그래서 결함이 있는 구문도 실행되고, 결함을 드러내는 장애가 생길 수 있다.","하지만 구문을 실행해도 결함이 늘 식별되지는 않는다. 예: 분모가 0일 때만 실패하는 나눗셈 같은 데이터 종속 결함.","100% 구문 커버리지가 모든 결정 논리를 테스트했다는 보장은 아니다. 예: 코드의 모든 분기가 실행되지 않았을 수 있다.","예제: 'READ x / IF x > 0 THEN x = x * 2 ENDIF / PRINT x'. x = 5 하나로 모든 실행 가능한 구문이 실행되어 구문 커버리지는 100%다. 하지만 x > 0이 거짓일 때 지나가는 분기는 실행되지 않았다."],"traps":["100% 구문 커버리지가 모든 결함 식별을 뜻하지 않는다. 데이터 종속 결함(0으로 나누기)은 놓칠 수 있다.","100% 구문 커버리지가 100% 분기 커버리지를 뜻하지 않는다. ELSE 없는 IF의 거짓 쪽처럼 실행할 구문이 없는 분기는 빠질 수 있다.","분모는 코드 줄 수가 아니라 '실행 가능한' 구문 총수다."]},{"id":"4.3.2","title":"분기 테스팅과 분기 커버리지","points":["분기는 제어 흐름 그래프에서 두 노드 간 제어의 이동이다. 제어 흐름 그래프는 테스트 대상에서 소스 코드 구문이 실행될 수 있는 순서를 보여 준다.","제어의 이동은 조건 없이(직선적 코드) 또는 조건에 따라(결정문 결과) 일어난다. 그래서 분기에는 무조건 분기와 조건 분기가 있다.","분기 테스팅에서 커버리지 항목은 분기다. 분기 커버리지 = 테스트 케이스가 실행한 분기 수 ÷ 분기 총수(백분율).","100% 분기 커버리지면 무조건 분기와 조건 분기를 모두 실행한 것이다. 조건 분기의 예: 'if...then' 결정문의 참 또는 거짓 결과, 스위치/케이스 구문의 결과, 루프에서 종료 또는 계속 여부의 결정.","분기를 실행해도 결함이 늘 식별되지는 않는다. 예: 코드의 특정 경로를 실행해야 드러나는 결함은 감지하지 못할 수 있다.","분기 커버리지는 구문 커버리지를 포함한다. 100% 분기 커버리지를 달성한 테스트 케이스 집합은 100% 구문 커버리지도 달성하지만, 반대는 성립하지 않는다.","예제(4.3.1 예제에 이어서): x = 5에 x = -1을 더하면 IF의 참·거짓 분기가 모두 실행되어 분기 커버리지 100%가 된다."],"traps":["분기 총수에는 무조건 분기도 들어간다. 조건 분기(참/거짓)만 센다는 보기는 틀린다.","포함 관계의 방향: 분기 100% → 구문 100%. 구문 100% → 분기 100%는 성립하지 않는다.","분기 커버리지 100%여도 특정 경로에서만 드러나는 결함은 놓칠 수 있다."]},{"id":"4.3.3","title":"화이트박스 테스팅의 가치","points":["강점: 테스트 중 전체 소프트웨어 구현을 고려하므로, 명세가 모호하거나 뒤떨어지고 불완전해도 결함을 쉽게 감지할 수 있다.","약점: 소프트웨어가 요구사항을 하나 이상 구현하지 않았다면, 그 누락으로 생긴 결함은 화이트박스 테스팅으로 식별하지 못할 수 있다.","화이트박스 기법은 정적 테스팅(예: 코드 드라이 런)에도 쓸 수 있다. 아직 실행할 준비가 안 된 코드, 슈도 코드(pseudocode), 제어 흐름 그래프로 모델링할 수 있는 상위 수준·하향식(top-down) 논리를 검토하는 데 적합하다.","블랙박스 테스팅만 해서는 실제 코드 커버리지 측정치를 얻을 수 없다.","화이트박스 커버리지 측정치는 객관적인 커버리지 측정값과, 커버리지를 높일 추가 테스트를 만드는 데 필요한 정보를 준다. 그 결과 코드 신뢰도를 높일 수 있다."],"traps":["명세가 모호하거나 뒤떨어지고 불완전해도 결함을 쉽게 감지할 수 있다는 것은 모든 화이트박스 기법이 가진 근본적인 강점이다(전체 구현을 고려하기 때문). 명세가 부족할 때 유용한 기법으로는 탐색적 테스팅도 있다(4.4.2). 반대로 구현되지 않은 요구사항(누락)으로 생긴 결함은 화이트박스로 식별하지 못할 수 있다.","화이트박스 기법은 코드를 실행하는 테스트에만 쓰는 것이 아니다. 정적 테스팅(예: 코드 드라이 런)에도 쓸 수 있고, 아직 실행할 준비가 안 된 코드나 슈도 코드를 검토하는 데도 적합하다.","실제 코드 커버리지 측정치는 블랙박스 테스팅만으로는 얻을 수 없다."]},{"id":"4.4","title":"경험 기반 테스트 기법","points":["널리 쓰는 경험 기반 기법 세 가지: 오류 추정, 탐색적 테스팅, 체크리스트 기반 테스팅.","세 기법 모두 테스터의 지식과 경험을 활용하므로, 효과가 테스터의 능력에 크게 좌우된다(4.1).","4.4.1~4.4.3은 모두 K2(설명) 학습 목표이고, 시험에서는 이 묶음에서 2문제가 나온다."],"traps":[]},{"id":"4.4.1","title":"오류 추정","points":["오류 추정은 테스터의 지식을 바탕으로 오류, 결함, 장애의 발생을 예측하는 테스트 기법이다.","테스터의 지식 세 가지: ① 애플리케이션의 과거 동작 ② 개발자가 범하기 쉬운 오류 유형과 그 오류로 생기는 결함 유형 ③ 다른 유사 애플리케이션에서 발생한 장애 유형.","오류·결함·장애가 관련될 수 있는 영역 여섯 가지: 입력(올바른 입력을 인식하지 못함, 매개변수 오류 또는 누락), 출력(잘못된 형식, 잘못된 결과), 논리(사례 누락, 잘못된 연산자), 계산(잘못된 피연산자, 잘못된 계산), 인터페이스(매개변수 불일치, 호환되지 않는 유형), 데이터(잘못된 초기화, 잘못된 유형).","결함 공격(fault attack)은 오류 추정을 구현하는 방법 중 하나다. 테스터가 발생 가능한 오류, 결함, 장애 목록을 만들거나 얻어서, 오류와 관련된 결함을 식별·노출하거나 장애를 일으키는 테스트를 설계한다.","결함 공격 목록은 경험, 결함 및 장애 데이터, 소프트웨어에 문제가 생기는 원인에 관한 일반적인 지식으로 만들 수 있다."],"traps":["'잘못된 연산자'는 논리, '잘못된 피연산자'는 계산 영역이다.","'호환되지 않는 유형'은 인터페이스, '잘못된 유형'은 데이터 영역이다.","'매개변수 오류 또는 누락'은 입력, '매개변수 불일치'는 인터페이스 영역이다.","결함 공격은 오류 추정을 구현하는 방법 중 하나다. 4.4에서 널리 쓰는 경험 기반 기법으로 꼽은 세 가지(오류 추정, 탐색적 테스팅, 체크리스트 기반 테스팅)에는 따로 들어 있지 않다. 결함 공격을 오류 추정과 무관한 별개 기법이라고 한 보기에 주의한다."]},{"id":"4.4.2","title":"탐색적 테스팅","points":["탐색적 테스팅에서는 테스터가 테스트 대상에 대해 배워가면서 테스트의 설계, 실행, 평가를 동시에 한다.","쓰임: 테스트 대상에 대해 더 배우기, 집중하는 테스트로 더 깊이 탐색하기, 테스트되지 않은 영역에 대한 테스트 만들기.","세션 기반 테스팅으로 구조화하기도 한다. 시간을 정해 놓고 수행하고, 테스트 목적이 정의된 테스트 차터(charter)를 지침으로 쓴다. 세션이 끝나면 보통 보고(debriefing)가 이어져 테스터와 결과에 관심 있는 이해관계자가 토론한다.","세션 기반 접근법에서 테스트 목적은 상위 수준의 테스트 컨디션으로 취급할 수 있다. 커버리지 항목은 세션 중에 식별하고 실행한다. 테스터는 테스트 세션 시트에 수행 절차와 발견 내용을 기록할 수 있다.","유용한 상황: 명세가 부족하거나 부적합할 때, 테스트에 시간 압박이 심할 때, 다른 공식 테스트 기법을 보완할 때.","테스터가 경험과 도메인 지식이 풍부하고 분석 기술, 호기심, 창의성 같은 필요 기술을 갖출수록 더 효과적이다(1.5.1 참조).","탐색적 테스팅 중에 다른 테스트 기법(예: 동등 분할)을 사용할 수 있다."],"traps":["탐색적 테스팅은 설계와 실행을 나누지 않고 '동시에' 한다.","세션 기반에서 커버리지 항목은 세션 전이 아니라 세션 '중에' 식별하고 실행한다.","탐색적 테스팅 중에 다른 기법(동등 분할 등)을 쓸 수 있다. 또 탐색적 테스팅은 다른 공식 테스트 기법을 보완하는 데도 유용하다."]},{"id":"4.4.3","title":"체크리스트 기반 테스팅","points":["테스터가 체크리스트의 테스트 컨디션을 확인하는 테스트를 설계, 구현, 실행한다.","체크리스트는 경험, 사용자에게 중요한 것에 대한 지식, 소프트웨어가 실패하는 이유와 방법에 대한 이해를 바탕으로 만들 수 있다.","넣으면 안 되는 항목: 자동으로 점검할 수 있는 항목, 시작 조건·종료 조건으로 더 적합한 항목, 너무 일반적인 항목.","항목은 질문 형식인 경우가 많고, 각 항목을 개별적이고 직접적으로 확인할 수 있어야 한다. 항목은 요구사항, 그래픽 인터페이스 속성, 품질 특성 등 여러 형태의 테스트 컨디션일 수 있다.","체크리스트는 기능·비기능 테스트를 포함한 다양한 테스트 유형을 지원할 수 있다(예: 사용성 테스트를 위한 10가지 휴리스틱 평가 기준).","개발자가 같은 오류를 피하게 되면서 일부 항목은 점차 효과가 떨어질 수 있다. 새로 발견한 심각도 높은 결함 때문에 항목을 추가해야 할 수도 있다. 그래서 결함 분석을 기반으로 정기적으로 업데이트하되, 너무 길어지지 않게 주의한다.","구체적인 테스트 케이스가 없을 때 체크리스트 기반 테스팅은 지침과 일정 수준의 일관성을 준다. 체크리스트가 상위 수준이면 실제 테스트가 조금씩 달라져 커버리지는 높아질 수 있지만 재현 가능성은 떨어질 수 있다."],"traps":["상위 수준 체크리스트: 커버리지는 높아질 수 있고 재현 가능성은 떨어질 수 있다. 방향을 뒤집은 보기에 주의한다.","자동으로 점검할 수 있는 항목은 체크리스트에서 뺀다.","업데이트는 하되 너무 길어지지 않게 한다. '길수록 좋다'는 틀린다."]},{"id":"4.5","title":"협업 기반 테스트 접근법","points":["4.2~4.4의 테스트 기법은 결함 식별에 관한 특정 목표를 가진다. 협업 기반 접근법은 협업과 커뮤니케이션을 통한 결함 예방에도 초점을 둔다.","다루는 내용: 협업 기반 사용자 스토리 작성(4.5.1), 인수 조건(4.5.2), 인수 테스트 주도 개발(ATDD, 4.5.3).","시험에서는 4.5.1·4.5.2 묶음에서 K2 1문제가 나오고, 4.5.3은 4.2 기법들과 묶여 K3로 나온다."],"traps":["협업 기반 접근법은 결함 예방'에도' 초점을 둔다. 결함 식별에만 초점을 둔다는 보기는 틀린다."]},{"id":"4.5.1","title":"협업 기반 사용자 스토리 작성","points":["사용자 스토리는 시스템이나 소프트웨어의 사용자 또는 구매자에게 가치를 주는 기능을 나타낸다.","3C: ① 카드(Card) = 사용자 스토리를 설명하는 매체(예: 인덱스 카드, 전자 게시판 항목) ② 대화(Conversation) = 소프트웨어 사용 방법에 대한 설명(문서 또는 구두) ③ 확인(Confirmation) = 인수 조건.","가장 일반적인 형식: '[역할]로서 [목표]를 달성해 [역할이 얻게 될 비즈니스 가치]를 얻기를 원한다.' 다음에 인수 조건이 뒤따른다.","협업 작성에는 브레인스토밍, 마인드 매핑 같은 기법을 쓴다. 비즈니스, 개발, 테스팅의 세 관점을 고려해 만들어서 전달할 것에 대한 공유된 비전을 얻는다.","좋은 사용자 스토리는 INVEST: 독립적(Independent), 협상 가능(Negotiable), 가치 있음(Valuable), 추정 가능(Estimable), 작음(Small), 테스트 가능(Testable).","이해관계자가 스토리를 테스트하는 방법을 모른다면, 스토리가 명확하지 않거나, 사용자에게 중요한 내용이 반영되지 않았거나, 이해관계자가 테스트하는 데 도움이 필요하다는 뜻일 수 있다."],"traps":["확인(Confirmation) = 인수 조건, 카드(Card) = 매체. 둘을 바꿔 낸 보기에 주의한다.","대화(Conversation)는 문서로도 구두로도 할 수 있다.","협업에서 고려하는 세 관점은 비즈니스, 개발, 테스팅이다."]},{"id":"4.5.2","title":"인수 조건","points":["인수 조건은 사용자 스토리 구현 결과를 이해관계자가 승인하려면 충족해야 하는 조건이다. 이런 관점에서 테스트로 실행해야 할 테스트 컨디션으로 볼 수 있다.","인수 조건은 보통 3C 중 대화(Conversation)를 통해 결정된다.","용도 다섯 가지: ① 사용자 스토리 범위 정의 ② 이해관계자 간 합의 도출 ③ 긍정과 부정 시나리오 설명 ④ 사용자 스토리 인수 테스팅의 베이시스 제공 ⑤ 정확한 계획 및 추정.","가장 일반적인 작성 형식 두 가지: 시나리오 기반(예: 행위 주도 개발(BDD)에서 쓰는 Given/When/Then 형식), 규칙 기반(예: 베리피케이션이 필요한 목록, 표로 표현된 입력-출력 매핑).","대부분의 인수 조건은 두 형식 중 하나로 문서화할 수 있다. 팀이 자체 형식을 쓸 수도 있는데, 이때도 인수 조건은 잘 정의되고 모호하지 않아야 한다."],"traps":["Given/When/Then = 시나리오 기반, 목록이나 표(입력-출력 매핑) = 규칙 기반.","인수 조건은 3C의 '확인'이고, 보통 '대화'를 통해 결정된다. '카드'가 아니다.","자체 형식도 허용된다. 단, 잘 정의되고 모호하지 않아야 한다."]},{"id":"4.5.3","title":"인수 테스트 주도 개발(ATDD)","points":["ATDD는 테스트 우선 접근법이다(2.1.3 참조). 테스트 케이스를 사용자 스토리 구현 전에 만든다. 고객, 개발자, 테스터 등 관점이 다른 팀원들이 만들고, 수동 또는 자동으로 실행할 수 있다.","첫 단계는 명세 워크숍이다. 팀원들이 사용자 스토리와 (아직 없다면) 인수 조건을 분석·토론·작성하고, 이 과정에서 스토리의 불완전성, 모호성, 결함을 해결한다.","다음 단계는 테스트 케이스 작성이다. 팀 전체가 하거나 테스터가 개별적으로 할 수 있다. 테스트 케이스는 인수 조건을 기반으로 하며, 소프트웨어가 어떻게 동작하는지 보여 주는 예제로 볼 수 있다. 이 예제는 팀이 사용자 스토리를 올바르게 구현하는 데 도움을 준다. 예제와 테스트는 같은 뜻이라 혼용하기도 한다. 4.2~4.4의 테스트 기법을 적용할 수 있다.","일반적인 작성 순서: ① 긍정/유효 테스트 케이스(예외·오류 없이 모든 것이 예상대로 될 때의 활동) ② 비유효/부정 테스트 ③ 비기능 품질 특성(예: 성능 효율성, 사용성).","테스트 케이스는 이해관계자가 이해할 수 있게 표현한다. 보통 (있다면) 전제 조건, 입력값, 사후 조건을 담은 자연어 문장이다.","테스트 케이스는 사용자 스토리의 모든 특성을 다뤄야 하고 스토리를 벗어나면 안 된다. 다만 인수 조건이 스토리에 나온 문제의 일부를 구체적으로 설명할 수는 있다. 또 두 개 이상의 테스트 케이스가 사용자 스토리의 같은 특성을 설명해서는 안 된다.","테스트 자동화 프레임워크가 지원하는 형식으로 쓰면, 개발자가 기능을 구현하면서 테스트 케이스를 자동화할 수 있다. 그러면 인수 테스트는 실행 가능한 요구사항이 된다.","예제: 스토리 '회원으로서 비밀번호를 재설정해 계정에 다시 접근하기를 원한다', 인수 조건 '등록된 이메일을 입력하면 재설정 링크를 보낸다 / 등록되지 않은 이메일이면 안내 메시지를 보여 준다 / 링크는 요청 후 1분 안에 발송된다'. 도출 순서: ① 긍정: 등록된 이메일 입력 → 링크 발송 확인 ② 부정: 등록되지 않은 이메일 입력 → 안내 메시지 확인 ③ 비기능: 요청 후 1분 안에 링크가 발송되는지 확인. 세 테스트 케이스는 서로 다른 특성을 다루고, 스토리 밖의 기능은 다루지 않는다."],"traps":["ATDD의 테스트 케이스는 구현 '전'에 만든다(테스트 우선).","첫 단계는 명세 워크숍이다. 테스트 케이스 작성은 그다음이다.","일반적인 순서는 긍정 → 부정 → 비기능이다.","테스트 케이스는 스토리를 벗어나면 안 되고, 같은 특성을 두 테스트 케이스가 설명하면 안 된다.","테스트 케이스 작성은 팀 전체가 할 수도, 테스터 혼자 할 수도 있다."]}]},{"ch":5,"title":"테스트 활동 관리","titleEn":"Managing the Test Activities","minutes":335,"examCount":9,"keywords":[{"ko":"결함 관리","en":"defect management","def":"보고된 결함(이상 사항)을 발견부터 종료까지 처리하는 프로세스. 최소한 처리 작업 흐름과 분류 규칙이 들어가야 한다(5.5)."},{"ko":"결함 보고서","en":"defect report","def":"발견한 이상 사항을 기록한 문서. 해결 담당자에게 충분한 정보를 주고, 작업 산출물 품질을 추적하는 수단이 되며, 프로세스 개선 아이디어를 준다(5.5)."},{"ko":"시작 조건","en":"entry criteria","def":"어떤 활동을 수행하기 위한 전제 조건. 예: 자원 가용성, 테스트웨어 가용성, 테스트 대상의 초기 품질 수준(모든 스모크 테스트 합격)(5.1.3)."},{"ko":"완료 조건","en":"exit criteria","def":"어떤 활동이 끝났다고 선언하려면 달성해야 하는 사항. 예: 달성한 커버리지 수준, 계획한 모든 테스트의 실행 여부(5.1.3)."},{"ko":"제품 리스크","en":"product risk","def":"제품 품질 특성과 관련된 리스크. 예: 누락 또는 잘못된 기능, 부정확한 계산, 보안 취약점(5.2.2)."},{"ko":"프로젝트 리스크","en":"project risk","def":"프로젝트 관리 및 제어와 관련된 리스크. 발생하면 프로젝트 일정·예산·범위에 영향을 줄 수 있다. 예: 작업 산출물 인도 지연, 직원 부족(5.2.2)."},{"ko":"리스크","en":"risk","def":"발생하면 부정적인 영향을 미칠 수 있는 잠재적인 사건, 위험, 위협 또는 상황. 발생 가능성과 영향(피해)으로 특징짓는다(5.2.1)."},{"ko":"리스크 분석","en":"risk analysis","def":"리스크 식별과 리스크 평가로 이루어진 리스크 관리 활동(5.2, 5.2.3)."},{"ko":"리스크 평가","en":"risk assessment","def":"식별한 리스크를 분류하고, 발생 가능성·영향·수준을 정하고, 우선순위를 매기고, 조치 방법을 제안하는 일(5.2.3)."},{"ko":"리스크 제어","en":"risk control","def":"분석한 리스크에 대응해 취하는 조치. 리스크 완화와 리스크 모니터링으로 이루어진다(5.2, 5.2.4)."},{"ko":"리스크 식별","en":"risk identification","def":"포괄적인 리스크 목록을 만드는 일. 브레인스토밍, 워크숍, 인터뷰, 원인-결과 다이어그램 등을 쓴다(5.2.3)."},{"ko":"리스크 수준","en":"risk level","def":"리스크를 측정한 값. 리스크 발생 가능성과 리스크 영향으로 표현하며, 높을수록 그에 대한 조치가 중요해진다(5.2.1)."},{"ko":"리스크 관리","en":"risk management","def":"리스크를 분석하고 제어하는 활동. 조직이 목표를 달성할 가능성과 제품 품질을 높이고 이해관계자의 신뢰를 얻게 한다(5.2)."},{"ko":"리스크 완화","en":"risk mitigation","def":"리스크 평가 때 제안된 조치를 실행해 리스크 수준을 낮추는 활동(5.2.4)."},{"ko":"리스크 모니터링","en":"risk monitoring","def":"완화 조치가 효과적인지 확인하고, 리스크 평가를 개선할 정보를 더 얻고, 새로 나타난 리스크를 찾는 활동(5.2.4)."},{"ko":"리스크 기반 테스팅","en":"risk-based testing","def":"리스크 분석과 리스크 제어를 기반으로 테스트 활동을 선택하고 우선순위를 정해 관리하는 테스트 접근법(5.2)."},{"ko":"테스트 접근법","en":"test approach","def":"테스트 계획에서 고르는 '어떻게 테스트할지'에 대한 방식(1.4.1). 테스트 계획서의 테스트 접근법 항목에는 테스트 레벨, 테스트 유형, 테스트 기법, 시작·완료 조건, 수집할 메트릭 등이 들어간다(5.1.1). 리스크 기반 테스팅도 테스트 접근법의 하나다(5.2)."},{"ko":"테스트 완료 보고서","en":"test completion report","def":"테스트 완료 활동 중 작성하는 보고서. 특정 테스트 활동(테스트 레벨, 테스트 주기, 반복 주기 등)을 요약하고 후속 테스팅에 쓸 정보를 줄 수 있다(5.3.2)."},{"ko":"테스트 제어","en":"test control","def":"테스트 모니터링에서 얻은 정보로 제어 지침과 필요한 수정 조치를 내리는 활동. 예: 리스크가 발현되면 테스트 우선순위 재지정(5.3, 1.4.1)."},{"ko":"테스트 모니터링","en":"test monitoring","def":"테스팅에 대한 정보를 모아 진행 상황을 평가하고 완료 조건 충족 여부를 측정하는 활동. 실제 진행 상황을 계획과 비교한다(5.3, 1.4.1)."},{"ko":"테스트 계획서","en":"test plan","def":"테스트 프로젝트의 테스트 목적, 자원, 프로세스를 설명하는 문서(5.1.1)."},{"ko":"테스트 계획","en":"test planning","def":"테스트 목적을 정하고, 주어진 제약 조건 안에서 그 목적을 가장 잘 달성할 접근법을 고르는 과정(1.4.1, 5.1)."},{"ko":"테스트 진행 보고서","en":"test progress report","def":"테스트 모니터링·제어 중 보통 정기적으로(예: 매일, 매주) 작성해 지속적인 테스트 제어를 지원하는 보고서. 5.3.2 본문에서는 '테스트 진행 상황 보고서'라고 쓴다."},{"ko":"테스트 피라미드","en":"test pyramid","def":"테스트마다 세분화 수준이 다를 수 있음을 보여 주는 모델. 아래층은 작고 빠른 테스트로 적절한 커버리지에 보통 많은 수가 필요하고, 위층은 일반적으로 더 느린 엔드-투-엔드 테스트로 적은 수로도 적절한 커버리지를 달성할 수 있다(5.1.6)."},{"ko":"테스트 전략","en":"test strategy","def":"5장에는 별도 정의가 없다. 테스트 계획서는 테스팅이 기존 테스트 정책과 테스트 전략을 준수함을 보여 주거나 벗어나는 이유를 설명하고(5.1.1), 조직의 테스트 전략은 테스트 상황 전달 방법에도 영향을 준다(5.3.3)."},{"ko":"테스팅 사분면","en":"testing quadrants","def":"브라이언 마릭이 정의한 모델. 애자일에서 테스트를 '비즈니스 측면/기술 측면'과 '팀 지원/제품 평가' 두 기준으로 나눠 네 칸에 배치한다(5.1.7)."}],"sections":[{"id":"5.1.1","title":"테스트 계획서의 목적과 내용","points":["테스트 계획서는 테스트 프로젝트의 테스트 목적, 자원, 프로세스를 설명한다.","목적 4가지: ① 테스트 목적 달성을 위한 방법과 일정을 문서화한다 ② 수행한 테스트 활동이 정해진 기준을 충족하는 데 도움을 준다 ③ 팀원과 기타 이해관계자의 의사소통 수단이 된다 ④ 테스팅이 수립한 테스트 정책 및 전략을 준수함을 보여 준다(또는 준수하지 않는 이유를 설명한다).","테스트 계획 활동은 테스터가 리스크, 일정, 인력, 도구, 비용, 노력 등 앞으로 닥칠 문제를 미리 고민하게 한다. 계획서를 준비하는 과정 자체가 테스트 목적 달성에 필요한 노력을 따져 보는 유용한 방법이다.","일반적인 내용 7가지: ① 테스팅 정황(예: 테스트 범위, 테스트 목적, 테스트 베이시스) ② 테스트 프로젝트의 가정 및 제약 사항 ③ 이해관계자(예: 역할, 책임, 테스팅 관련성, 채용 및 훈련 요구사항) ④ 의사소통(예: 의사소통 방법 및 빈도, 문서 양식) ⑤ 리스크 목록(예: 제품 리스크, 프로젝트 리스크) ⑥ 테스트 접근법 ⑦ 예산 및 일정","테스트 접근법 항목의 예: 테스트 레벨, 테스트 유형, 테스트 기법, 테스트 산출물, 시작 조건 및 완료 조건, 테스팅의 독립성, 수집할 메트릭, 테스트 데이터 요구사항, 테스트 환경 요구사항, 테스트 정책과 테스트 전략과의 편차","테스트 계획서의 자세한 내용은 ISO/IEC/IEEE 29119-3 표준에서 확인할 수 있다."],"traps":["시작·완료 조건, 수집할 메트릭, 테스팅의 독립성은 '테스트 접근법' 항목이다. 테스트 범위·테스트 베이시스는 '테스팅 정황', 채용 및 훈련 요구사항은 '이해관계자', 문서 양식은 '의사소통' 항목이다.","현재 진행 상황(진행 상황 보고서), 방해 요소와 대응 방법(진행 상황·완료 보고서), 수정되지 않은 결함·교훈(완료 보고서), 장애 재현 정보·기대/실제 결과(결함 보고서)는 실라버스가 제시한 테스트 계획서의 일반적인 내용 목록에 없다. 각각 해당 보고서의 항목이다.","리스크 목록에는 제품 리스크와 프로젝트 리스크가 모두 들어간다."]},{"id":"5.1.2","title":"반복 주기와 릴리스 계획에 대한 테스터의 기여","points":["반복적 SDLC에서는 보통 두 가지 계획, 즉 릴리스 계획과 반복 주기 계획을 한다.","릴리스 계획: 제품 릴리스를 계획한다. 제품 백로그를 (재)정의하고, 큰 사용자 스토리를 작은 사용자 스토리로 세분화하기도 한다. 개별 반복 주기의 테스트 접근법과 테스트 계획을 위한 기반이 된다.","릴리스 계획에서 테스터가 하는 일: ① 테스트 가능한 사용자 스토리와 인수 조건 작성에 참여(4.5) ② 프로젝트 및 품질 리스크 분석에 참여(5.2) ③ 사용자 스토리와 관련된 테스트 노력 추정(5.1.4) ④ 테스트 접근법 결정 ⑤ 릴리스를 위한 테스팅 계획","반복 주기 계획: 개별 반복 주기를 계획하며 반복 주기 백로그와 관련이 있다.","반복 주기 계획에서 테스터가 하는 일: ① 사용자 스토리의 구체적인 리스크 분석에 참여 ② 사용자 스토리의 테스트 용이성 판단 ③ 사용자 스토리를 업무(특히 테스팅 업무) 단위로 분류 ④ 각 테스팅 업무에 필요한 테스트 노력 추정 ⑤ 테스트 대상의 기능 및 비기능적 측면 식별·구체화"],"traps":["제품 백로그는 릴리스 계획, 반복 주기 백로그는 반복 주기 계획과 짝이다.","큰 사용자 스토리를 작은 사용자 스토리로 세분화하는 것은 릴리스 계획, 사용자 스토리를 업무(테스팅 업무) 단위로 나누는 것은 반복 주기 계획이다."]},{"id":"5.1.3","title":"시작 조건과 완료 조건","points":["시작 조건은 어떤 활동을 수행하기 위한 전제 조건이다. 충족하지 못하면 활동이 더 어려워지고, 시간과 비용이 늘고, 리스크가 커질 가능성이 높다.","완료 조건은 어떤 활동의 종료를 선언하기 위해 달성해야 하는 사항이다.","시작 조건과 완료 조건은 각 테스트 레벨에 대해 정의해야 하며, 테스트 목적에 따라 달라진다.","시작 조건의 예: ① 자원의 가용성(예: 인력, 도구, 환경, 테스트 데이터, 예산, 시간) ② 테스트웨어 가용성(예: 테스트 베이시스, 테스트 가능한 요구사항, 사용자 스토리, 테스트 케이스) ③ 테스트 대상의 초기 품질 수준(예: 모든 스모크 테스트가 합격함)","완료 조건의 예: ① 철저함(thoroughness)을 측정하는 지표(예: 달성한 커버리지 수준, 미해결 결함 수, 결함 밀도, 실패한 테스트 케이스 수) ② '예/아니오'로 판단하는 기준(예: 계획한 모든 테스트가 실행되었는가, 정적 테스팅이 수행되었는가, 발견한 모든 결함이 보고되었는가, 모든 리그레션 테스트가 자동화되었는가)","시간 및 예산의 소진도 유효한 완료 조건으로 볼 수 있다. 이해관계자가 추가 테스트 없이 배포하는 리스크를 검토하고 수용했다면, 다른 완료 조건이 충족되지 않아도 테스트를 끝낼 수 있다.","애자일에서 완료 조건은 흔히 완료의 정의(Definition of Done)라고 하며, 릴리스 가능 항목에 대한 팀의 목표 메트릭을 정의한다. 사용자 스토리가 개발·테스트 활동을 시작하기 위해 충족해야 하는 시작 조건은 준비의 정의(Definition of Ready)라고 한다."],"traps":["'모든 스모크 테스트 합격'은 완료 조건이 아니라 시작 조건(테스트 대상의 초기 품질 수준)의 예다.","준비의 정의(DoR)는 시작 조건, 완료의 정의(DoD)는 완료 조건이다. 둘을 뒤바꾼 보기에 주의한다.","미해결 결함 수·결함 밀도는 완료 조건 중 '철저함 측정 지표', '계획한 모든 테스트를 실행했는가'는 '예/아니오 기준'이다."]},{"id":"5.1.4","title":"추정 기법","points":["테스트 노력 추정은 테스트 목적을 달성하는 데 필요한 테스트 관련 작업량을 예측하는 것이다. 추정은 여러 가정에 기반하고 항상 오류가 있을 수 있다는 점을 이해관계자가 분명히 알게 해야 한다.","보통 작은 작업의 추정이 큰 작업보다 정확하다. 그래서 큰 작업은 여러 개의 작은 작업으로 나눈 다음 추정한다.","비율 기반 추정(메트릭 기반): 조직의 이전 프로젝트 수치를 모아 유사 프로젝트용 '표준' 비율을 만든다. 보통 조직이 직접 수행한 프로젝트의 비율(과거 데이터)이 가장 좋은 자료다. 예: 이전 프로젝트의 개발 노력 대 테스트 노력이 3:2이고 이번 개발 노력이 600MD(맨데이)면, 테스트 노력은 400MD로 추정한다.","외삽법(메트릭 기반): 현재 프로젝트에서 가능한 한 빨리 측정해 데이터를 모으고, 관찰 결과가 충분히 쌓이면 외삽(보통 수학적 모델 사용)으로 남은 작업의 노력을 근사 추정한다. 반복적 SDLC에 매우 적합하다. 예: 지난 세 번의 반복 주기에 든 평균 노력으로 다음 반복 주기의 테스트 노력을 추정한다.","와이드밴드 델파이(반복적, 전문가 기반): 각 전문가가 혼자 추정한다 → 결과를 모은다 → 합의된 범위를 벗어난 편차가 있으면 각자의 추정치를 논의한다 → 다시 각자 새로 추정한다. 합의에 이를 때까지 반복한다. 플래닝 포커는 애자일에서 많이 쓰는 와이드밴드 델파이의 변형으로, 보통 노력 규모를 나타내는 숫자가 적힌 카드로 추정한다.","3점 추정(전문가 기반): 전문가가 가장 낙관적인 추정치(a), 확률적으로 가장 높은 추정치(m), 가장 비관적인 추정치(b)를 낸다. 최종 추정치(E)는 가중 산술 평균이며, 가장 널리 쓰는 식은 E = (a + 4×m + b) / 6이다. 측정 오류도 계산할 수 있는데, SD(표준 편차) = (b − a) / 6이다.","3점 추정 예: a=6, m=9, b=18(맨아워)이면 E = (6 + 4×9 + 18) / 6 = 60 / 6 = 10, SD = (18 − 6) / 6 = 2. 최종 추정치는 10±2, 즉 8~12 맨아워다."],"traps":["메트릭 기반 기법은 비율 기반 추정과 외삽법, 전문가 기반 기법은 와이드밴드 델파이와 3점 추정이다.","비율 기반은 '이전 프로젝트' 데이터, 외삽법은 '현재 프로젝트' 데이터를 쓴다.","3점 추정에서 4를 곱하는 값은 m(확률적으로 가장 높은 추정치)이고, 합을 6으로 나눈다. SD 식에는 m이 들어가지 않는다.","플래닝 포커는 3점 추정이 아니라 와이드밴드 델파이의 변형이다."]},{"id":"5.1.5","title":"테스트 케이스 우선순위지정","points":["테스트 케이스와 테스트 절차를 테스트 스위트로 조립하고 나면, 실행 순서를 정의하는 테스트 실행 일정으로 구성할 수 있다.","리스크 기반 우선순위지정: 리스크 분석 결과(5.2.3)에 따라 실행 순서를 정한다. 가장 중요한 리스크를 다루는 테스트 케이스를 먼저 실행한다.","커버리지 기반 우선순위지정: 커버리지(예: 구문 커버리지)에 따라 실행 순서를 정한다. 가장 높은 커버리지를 달성하는 테스트 케이스를 먼저 실행한다.","추가 커버리지 우선순위지정(커버리지 기반의 변형): 가장 높은 커버리지를 달성하는 테스트 케이스를 먼저 실행하고, 그다음부터는 가장 높은 '추가' 커버리지를 달성하는 테스트 케이스를 차례로 실행한다.","요구사항 기반 우선순위지정: 테스트 케이스의 기반이 되는 요구사항의 우선순위에 따라 실행 순서를 정한다. 요구사항 우선순위는 이해관계자가 정의하며, 가장 중요한 요구사항 관련 테스트 케이스를 먼저 실행한다.","종속성이 있으면 우선순위대로 실행하기 어려울 수 있다. 우선순위가 높은 테스트 케이스가 우선순위가 낮은 테스트 케이스에 종속되면, 낮은 쪽을 먼저 실행해야 한다.","실행 순서는 자원의 가용성도 고려해야 한다. 필요한 테스트 도구, 테스트 환경, 인력을 특정 시간대에만 쓸 수 있을 수 있다."],"traps":["추가 커버리지 방식은 두 번째부터 '전체 커버리지가 가장 높은' 테스트가 아니라 '추가로 늘어나는 커버리지가 가장 높은' 테스트를 고른다.","종속성이 있으면 우선순위가 낮은 테스트 케이스가 먼저 실행될 수 있다.","요구사항 우선순위는 이해관계자가 정의한다."]},{"id":"5.1.6","title":"테스트 피라미드","points":["테스트 피라미드는 테스트에 따라 세분화 수준(granularity)이 다를 수 있다는 것을 보여 주는 모델이다.","다양한 테스트 목표가 서로 다른 테스트 자동화 수준으로 지원된다는 것을 보여 줘서, 팀의 테스트 자동화와 테스트 노력 할당을 지원한다.","피라미드의 각 층은 하나의 테스트 그룹이다. 층이 높아질수록 테스트 세분화 정도는 낮아지고, 테스트 격리는 낮아지며(즉, 시스템의 다른 요소에 대한 의존도가 커지며), 테스트 실행 시간은 길어진다.","아래층 테스트: 작고, 독립적이며, 빠르고, 작은 기능을 확인한다. 그래서 적절한 커버리지를 달성하려면 많은 테스트가 필요한 경우가 많다.","위층 테스트: 복잡하고 상위 수준의 엔드-투-엔드 테스트다. 일반적으로 아래층보다 느리고, 보통 큰 규모의 기능을 확인하므로 적은 수로도 적절한 커버리지를 달성할 수 있다.","층의 수와 명칭은 다를 수 있다. 최초 모델(Cohn 2009)은 '단위 테스트', '서비스 테스트', 'UI 테스트' 세 층이다. 단위(컴포넌트)·통합(컴포넌트 통합)·엔드-투-엔드 테스트로 나누는 모델도 많이 알려져 있고, 다른 테스트 레벨 분류(2.2.1)를 쓰기도 한다."],"traps":["위로 갈수록 '격리'는 낮아진다(다른 요소에 대한 의존도는 높아진다).","적절한 커버리지를 달성하는 데 보통 많은 테스트가 필요한 쪽은 아래층(작은 기능), 적은 수로 되는 쪽은 위층(큰 기능)이다.","테스트를 '비즈니스/기술 측면', '팀 지원/제품 평가'로 나누는 것은 테스팅 사분면이지 테스트 피라미드가 아니다."]},{"id":"5.1.7","title":"테스팅 사분면","points":["브라이언 마릭(Brian Marick)이 정의했다. 애자일 소프트웨어 개발에서 테스트 레벨을 적합한 테스트 유형, 활동, 테스트 기법, 작업 산출물과 묶는다.","테스트 관리자가 필요한 모든 테스트 유형과 테스트 레벨을 SDLC에 포함하고, 테스트 레벨에 따라 테스트 유형별 연관성이 다르다는 점을 이해하도록 돕는다. 또 개발자, 테스터, 비즈니스 담당자 등 모든 이해관계자에게 테스트 유형을 구분하고 설명하는 방법을 준다.","두 가지 기준: 비즈니스 측면 vs 기술 측면, 그리고 팀 지원(개발을 위한 지침) vs 제품 평가(기대치 대비 동작 측정). 이 둘의 조합으로 네 사분면이 정해진다.","1 사분면(기술 측면, 팀 지원): 컴포넌트 테스트, 컴포넌트 통합 테스트. 자동화해야 하며 지속적인 통합(CI) 프로세스에 포함돼야 한다.","2 사분면(비즈니스 측면, 팀 지원): 기능 테스트, 예제, 사용자 스토리 테스트, 사용자 경험 프로토타입, API 테스팅, 시뮬레이션. 인수 조건을 확인하며, 수동으로 실행하거나 자동화할 수 있다.","3 사분면(비즈니스 측면, 제품 평가): 탐색적 테스팅, 사용성 테스팅, 사용자 인수 테스팅. 사용자 중심이며 수동으로 실행하는 경우가 많다.","4 사분면(기술 측면, 제품 평가): 스모크 테스트, 비기능 테스트(사용성 테스트 제외). 자동화되는 경우가 많다."],"traps":["사용성 테스트는 비기능 테스트지만 4 사분면이 아니라 3 사분면이다.","API 테스팅은 기술적으로 보이지만 2 사분면(비즈니스 측면, 팀 지원)이다.","스모크 테스트는 1 사분면이 아니라 4 사분면(기술 측면, 제품 평가)이다.","자동화 표현이 사분면마다 다르다: 1 사분면 '자동화해야 함', 2 사분면 '수동 또는 자동', 3 사분면 '수동인 경우가 많음', 4 사분면 '자동화되는 경우가 많음'."]},{"id":"5.2","title":"리스크 관리","points":["조직은 목표의 달성 여부와 시기를 불확실하게 만드는 여러 내부·외부 요인에 직면한다(ISO 31000).","리스크 관리는 조직이 목표를 달성할 가능성과 제품 품질을 높이고, 이해관계자의 신뢰와 믿음을 얻게 한다.","주요 리스크 관리 활동: ① 리스크 분석 = 리스크 식별 + 리스크 평가(5.2.3) ② 리스크 제어 = 리스크 완화 + 리스크 모니터링(5.2.4)","리스크 분석과 리스크 제어를 기반으로 테스트 활동을 선택하고 우선순위를 정해 관리하는 테스트 접근법을 리스크 기반 테스팅이라고 한다."],"traps":["식별·평가는 '리스크 분석', 완화·모니터링은 '리스크 제어'에 속한다. 짝을 바꾼 보기에 주의한다."]},{"id":"5.2.1","title":"리스크의 정의와 리스크의 속성","points":["리스크는 발생 시 부정적인 영향을 미칠 수 있는 잠재적인 사건, 위험, 위협 또는 상황이다.","리스크를 특징짓는 두 요소: ① 리스크 발생 가능성 = 리스크 발생 확률(0보다 크고 1보다 작음) ② 리스크 영향(피해) = 발생했을 때 생기게 될 피해","이 두 요소로 리스크 수준을 표현한다. 리스크 수준은 리스크를 측정한 값이며, 높을수록 그에 대한 조치가 중요해진다.","정량적 접근법에서는 리스크 수준 = 발생 가능성 × 영향으로 계산하고, 정성적 접근법에서는 리스크 행렬로 판단하기도 한다(5.2.3)."],"traps":["발생 가능성은 0보다 크고 1보다 작다. 0과 1은 포함하지 않는다.","리스크 수준은 두 요소를 함께 본다. 정량적 접근법에서는 발생 가능성이나 영향 하나만으로 수준을 정하지 않고, 둘을 곱한 값으로 계산한다. 곱한 값이 가장 큰 리스크가 수준이 가장 높다."]},{"id":"5.2.2","title":"프로젝트 리스크와 제품 리스크","points":["소프트웨어 테스팅에서는 보통 프로젝트 리스크와 제품 리스크 두 유형을 다룬다.","프로젝트 리스크는 프로젝트 관리 및 제어와 관련이 있다.","프로젝트 리스크 4가지: ① 조직 문제(예: 작업 산출물 인도 지연, 부정확한 추정, 예산 축소) ② 인력 문제(예: 기술 부족, 갈등, 의사소통 문제, 직원 부족) ③ 기술적 문제(예: 협의되지 않은 개발 범위의 점진적 추가(scope creep), 도구 지원 부족) ④ 공급업체 문제(예: 제3자 인도 실패, 지원 기업의 파산)","프로젝트 리스크가 발생하면 프로젝트 일정, 예산, 범위에 영향을 끼쳐 프로젝트의 목표 달성 능력에 영향을 줄 수 있다.","제품 리스크는 제품 품질 특성(예: ISO 25010 품질 모델이 설명하는 특성)과 관련이 있다. 예: 누락 또는 잘못된 기능, 부정확한 계산, 런타임 오류, 열악한 아키텍처, 비효율적인 알고리즘, 부적절한 응답 시간, 열악한 UX(사용자 경험), 보안 취약점","제품 리스크가 발현되면 생길 수 있는 결과: ① 사용자 불만족 ② 매출, 신뢰, 평판 손실 ③ 제3자 피해 ④ 높은 유지보수 비용, 고객지원 부서의 과부하 ⑤ 형사 처벌 ⑥ 극단적인 경우 신체적 손상, 부상 또는 사망"],"traps":["'기술적 문제'(범위의 점진적 추가, 도구 지원 부족)는 프로젝트 리스크다. 반면 열악한 아키텍처, 비효율적인 알고리즘은 '기술적'으로 들려도 제품 리스크다.","작업 산출물 인도 지연은 조직 문제, 제3자 인도 실패는 공급업체 문제다.","구분 기준: 프로젝트 관리 및 제어와 관련되면 프로젝트 리스크, 제품 품질 특성과 관련되면 제품 리스크."]},{"id":"5.2.3","title":"제품 리스크 분석","points":["테스팅 관점의 목표: 제품 리스크를 인식해, 잔존 제품 리스크 수준을 최소화하는 방향으로 테스트 노력을 집중하게 하는 것. SDLC 초기에 시작하는 것이 이상적이다.","제품 리스크 분석은 리스크 식별과 리스크 평가로 이루어진다.","리스크 식별: 포괄적인 리스크 목록을 만든다. 이해관계자는 브레인스토밍, 워크숍, 인터뷰, 원인-결과 다이어그램 등을 쓸 수 있다.","리스크 평가: 식별한 리스크의 분류, 발생 가능성·영향·수준 결정, 우선순위지정, 조치 방법 제안을 포함한다. 같은 범주의 리스크는 비슷한 접근법으로 완화할 수 있는 경우가 많아, 분류는 완화 조치를 정하는 데 도움이 된다.","리스크 평가는 정량적, 정성적, 또는 둘을 섞은 접근법을 쓸 수 있다. 정량적: 리스크 수준 = 발생 가능성 × 영향. 정성적: 리스크 행렬로 리스크 수준을 판단하기도 한다.","제품 리스크 분석은 테스팅의 철저함 정도와 테스트 범위에 영향을 줄 수 있다. 결과 활용 6가지: ① 수행할 테스트 범위 결정 ② 테스트 레벨 결정 및 수행할 테스트 유형 제안 ③ 사용할 테스트 기법과 달성할 커버리지 결정 ④ 업무별 필요 테스트 노력 추정 ⑤ 중요 결함을 가능한 한 빨리 식별하기 위한 테스트 우선순위지정 ⑥ 리스크를 줄이기 위해 테스팅 외 다른 활동을 할 수 있는지 판단"],"traps":["리스크 목록 만들기는 식별, 수준 결정·우선순위·조치 제안은 평가다.","정량적 접근법은 '곱하기'다. 더하기가 아니다."]},{"id":"5.2.4","title":"제품 리스크 제어","points":["제품 리스크 제어는 식별·평가된 제품 리스크에 대응해 취하는 모든 조치이며, 리스크 완화와 리스크 모니터링으로 이루어진다.","리스크 완화: 리스크 평가 때 제안된 조치를 실행해 리스크 수준을 낮추는 활동.","리스크 모니터링의 목적: ① 리스크 완화 조치가 효과적인지 확인 ② 리스크 평가 개선을 위한 추가 정보 확보 ③ 새롭게 나타난 리스크 식별","분석된 리스크에 대한 대응 방안(한글 실라버스 표기: '완화 방안', 영문: response options)의 예: 테스팅을 통한 리스크 완화, 리스크 수용, 리스크 전가, 대안 계획(Veenendaal 2012).","테스팅으로 제품 리스크를 완화하는 조치 6가지: ① 주어진 리스크 유형에 적절한 경험과 기술을 갖춘 테스터 선정 ② 적절한 수준의 테스팅 독립성 적용 ③ 리뷰 및 정적 분석 수행 ④ 적절한 테스트 기법 및 커버리지 수준 적용 ⑤ 영향을 받는 품질 특성을 다루는 적절한 테스트 유형 적용 ⑥ 리그레션 테스팅을 포함한 동적 테스팅 수행"],"traps":["리스크 수용, 리스크 전가, 대안 계획은 리스크 대응 방안(한글 실라버스는 '완화 방안'이라고 씀)의 예지만, '테스팅으로 제품 리스크를 완화하는 조치' 6가지에는 들어가지 않는다.","조치를 실행해 수준을 낮추는 것은 완화, 효과 확인·추가 정보 확보·새 리스크 찾기는 모니터링이다.","리뷰와 정적 분석도 테스팅을 통한 완화 조치에 들어간다. 동적 테스팅만 있는 것이 아니다."]},{"id":"5.3","title":"테스트 모니터링, 테스트 제어, 테스트 완료","points":["테스트 모니터링은 테스팅에 대한 정보 수집이다. 이 정보로 테스트 진행 상황을 평가하고, 완료 조건(예: 제품 리스크, 요구사항, 인수 기준에 대한 커버리지 목표 달성)이나 관련 테스트 작업이 충족됐는지 측정한다.","테스트 제어는 테스트 모니터링에서 얻은 정보로 가장 효과적이고 효율적인 테스팅을 위한 제어 지침, 지도, 필요한 수정 조치를 제공한다.","제어 지침의 예: ① 식별된 리스크가 발현될 경우 테스트 우선순위 재지정 ② 재작업 이후 테스트 항목이 시작 조건 및 완료 조건을 충족하는지 재평가 ③ 테스트 환경 인도 지연에 대응하기 위한 테스트 일정 조정 ④ 필요한 지점과 시기에 신규 자원 추가","테스트 완료는 끝난 테스트 활동에서 데이터를 모아 경험, 테스트웨어, 기타 관련 정보를 정리하는 단계다.","테스트 완료 활동은 프로젝트 마일스톤에 이루어진다: 테스트 레벨 완료, 애자일 반복 주기 종료, 테스트 프로젝트 완료(또는 취소), 소프트웨어 배포, 유지보수 릴리스 완료."],"traps":["정보를 모으는 것은 모니터링, 그 정보로 지침과 수정 조치를 내리는 것은 제어다.","테스트 프로젝트가 취소된 경우에도 테스트 완료 활동이 이루어진다."]},{"id":"5.3.1","title":"테스팅에 사용하는 메트릭","points":["테스트 메트릭은 ① 계획한 테스트 일정 및 예산 대비 현재 진행 상황 ② 테스트 대상의 현재 품질 ③ 테스트 목적이나 반복 주기 목표 대비 테스트 활동의 효과를 보여 주기 위해 수집한다. 테스트 모니터링이 수집하며, 테스트 제어와 테스트 완료를 지원한다.","프로젝트 진행 상황 메트릭: 작업 완료율, 자원 사용률, 테스트 노력 투입률","테스트 진행 상황 메트릭: 테스트 케이스 구현 진행률, 테스트 환경 준비 진행률, 실행/미실행 및 합격/불합격 테스트 케이스 수, 테스트 실행 시간","제품 품질 메트릭: 가용성, 응답 시간, 평균 장애 시간","결함 메트릭: 발견/수정한 결함의 수와 우선순위, 결함 밀도, 결함 발견 비율","리스크 메트릭: 잔여 리스크 수준","커버리지 메트릭: 요구사항 커버리지, 코드 커버리지","비용 메트릭: 테스팅 비용, 조직의 품질 비용"],"traps":["테스트 노력 투입률은 '테스트 진행 상황'이 아니라 '프로젝트 진행 상황' 메트릭이다.","결함 밀도·결함 발견 비율은 결함 메트릭, 평균 장애 시간·가용성·응답 시간은 제품 품질 메트릭이다.","결함 밀도는 완료 조건의 철저함 측정 지표 예로도 나온다(5.1.3)."]},{"id":"5.3.2","title":"테스트 보고서의 목적, 내용, 대상","points":["테스트 보고는 테스팅 도중과 이후에 테스트 정보를 요약하고 전달하는 활동이다.","테스트 진행 상황 보고서: 지속적인 테스트 제어를 지원한다. 계획에서 벗어나거나 상황이 바뀌어 테스트 일정, 자원, 테스트 계획을 수정해야 할 때 그만큼 충분한 정보를 줘야 한다. 테스트 모니터링·제어 중 보통 정기적으로(예: 매일, 매주) 작성한다.","진행 상황 보고서 내용 6가지: ① 테스팅 기간 ② 테스트 진행 상황(예: 예정보다 빠름 또는 늦음), 주목할 만한 편차 포함 ③ 테스팅 진행 방해 요소와 대응 방법 ④ 테스트 메트릭(5.3.1) ⑤ 테스팅 중 식별한 신규 및 변경된 리스크 ⑥ 다음 주기에 예정된 테스팅","테스트 완료 보고서: 특정 테스트 활동(예: 테스트 레벨, 테스트 주기, 반복 주기)을 요약하고 후속 테스팅을 위한 정보를 줄 수 있다. 프로젝트, 테스트 레벨, 테스트 유형이 끝나고 이상적으로는 완료 조건도 충족된 상황에서, 진행 상황 보고서와 기타 데이터를 기반으로 작성한다.","완료 보고서 내용 7가지: ① 테스트 요약 ② 원래 테스트 계획(테스트 목적과 완료 조건)에 기반한 테스팅 및 제품 품질 평가 ③ 테스트 계획과의 편차(예: 계획한 테스트 일정, 기간, 공수와의 차이) ④ 테스팅 방해 요소와 대응 방법 ⑤ 테스트 진행 상황 보고서를 기반으로 한 테스트 메트릭 ⑥ 완화되지 않은 리스크, 수정되지 않은 결함 ⑦ 테스팅 관련 교훈","보고 대상에 따라 보고서에 들어갈 정보와 보고의 형식·빈도가 달라진다. 같은 팀 구성원에게 하는 진행 상황 보고는 빈번하고 비공식적인 경우가 많고, 테스트 완료 보고는 정해진 템플릿을 따르며 한 번만 이뤄지는 것이 일반적이다.","ISO/IEC/IEEE 29119-3 표준에 테스트 진행 상황 보고서(표준에서는 '테스트 상황 보고서')와 테스트 완료 보고서의 양식과 예제가 있다."],"traps":["'다음 주기에 예정된 테스팅', '신규 및 변경된 리스크'는 진행 상황 보고서 항목이고, '테스팅 관련 교훈', '완화되지 않은 리스크·수정되지 않은 결함'은 완료 보고서 항목이다.","'방해 요소와 대응 방법'은 두 보고서 모두에 들어간다.","ISO/IEC/IEEE 29119-3의 '테스트 상황 보고서'는 진행 상황 보고서를 가리킨다."]},{"id":"5.3.3","title":"테스팅 상황 전달","points":["가장 좋은 전달 방법은 테스트 관리자의 관심, 조직의 테스트 전략, 규제 표준, 자체 조직 팀(self-organizing team)이라면 팀 자체에 따라 달라진다(1.5.2).","전달 방법 5가지: ① 팀원 및 기타 이해관계자와의 대화 ② 대시보드(예: 지속적 통합/지속적 전달 대시보드, 태스크 보드, 번다운 차트) ③ 전자 통신 채널(예: 이메일, 채팅) ④ 온라인 문서 ⑤ 공식 테스트 보고서(5.3.2)","이 중 하나 이상을 함께 쓸 수 있다.","물리적 거리나 시차 때문에 직접 대화가 어려운 분산 팀에는 더 공식적인 의사소통 방법이 적합할 수 있다.","보통 이해관계자마다 관심을 가지는 정보가 다르므로, 그에 맞게 의사소통 방식을 조정한다."],"traps":["태스크 보드·번다운 차트는 '대시보드', 이메일·채팅은 '전자 통신 채널'이다.","언제나 가장 좋은 단 하나의 방법은 없다. 상황에 따라 달라진다."]},{"id":"5.4","title":"형상 관리","points":["테스팅에서 형상 관리(CM)는 테스트 계획서, 테스트 전략서, 테스트 컨디션, 테스트 케이스, 테스트 스크립트, 테스트 결과, 테스트 로그, 테스트 보고서 같은 작업 산출물을 형상 항목으로 식별, 제어, 추적하는 지침을 준다.","복잡한 형상 항목(예: 테스트 환경)의 경우, 형상 관리는 구성 항목, 항목 간 관계, 버전 등을 기록한다.","형상 항목이 테스팅용으로 승인되면 베이스라인이 되고, 이후에는 공식적인 변경 제어 프로세스를 통해서만 수정할 수 있다.","새 베이스라인을 만들 때 변경된 형상 항목의 기록을 유지한다. 이전 베이스라인으로 되돌리면 이전 테스트 결과를 재현할 수 있다.","형상 관리가 보장하는 것 ①: 테스트 항목(테스트 대상의 개별 부분)을 포함한 모든 형상 항목이 고유하게 식별되고, 버전이 관리되고, 변경이 추적되고, 다른 형상 항목과의 연관성이 식별돼 테스트 프로세스 전체에서 추적성이 유지된다.","형상 관리가 보장하는 것 ②: 식별된 모든 문서와 소프트웨어 항목이 테스트웨어 안에서 명확하게 참조된다.","지속적 통합, 지속적 전달, 지속적 배포와 관련 테스팅은 보통 자동화된 데브옵스 파이프라인으로 구현하며(2.1.4), 여기에는 보통 자동화된 형상 관리가 포함된다."],"traps":["형상 관리 대상은 소스 코드만이 아니다. 테스트 케이스, 테스트 로그, 테스트 보고서 같은 작업 산출물과 테스트 환경도 포함된다.","베이스라인은 형상 항목이 테스팅용으로 '승인'될 때 생기며, 변경은 공식적인 변경 제어 프로세스로만 한다."]},{"id":"5.5","title":"결함 관리","points":["테스트의 주요 목적 중 하나가 결함 식별이므로 잘 확립된 결함 관리 프로세스가 필요하다.","보고된 이상 사항은 실제 결함일 수도, 아닐 수도 있다(예: 거짓-양성 결과, 변경 요청). 이는 결함 보고서를 처리하는 과정에서 가려진다. 이상 사항은 SDLC 모든 단계에서 보고될 수 있고, 양식은 SDLC에 따라 다르다.","결함 관리 프로세스에는 최소한 개별 결함·이상 사항을 발견부터 종료까지 처리하는 작업 흐름과 분류 규칙이 들어가야 한다. 작업 흐름은 보통 기록 → 분석 및 분류 → 적절한 대응 결정(수정 또는 그대로 유지 등) → 결함 보고 종료로 이루어진다. 관련된 모든 이해관계자가 이 프로세스를 따라야 한다.","정적 테스팅(특히 정적 분석)에서 찾은 결함도 비슷한 방식으로 처리하는 것이 좋다.","결함 보고서의 목적 3가지: ① 결함을 처리·해결할 책임자에게 문제 해결을 위한 충분한 정보 제공 ② 작업 산출물의 품질을 추적하는 수단 제공 ③ 개발 및 테스트 프로세스 개선을 위한 아이디어 제공","동적 테스팅 중 작성하는 결함 보고서의 일반적인 내용: ① 고유 식별자 ② 보고하는 이상 사항을 요약하는 제목 ③ 이상 사항이 관찰된 날짜, 보고 주체 조직, 작성자(역할 포함) ④ 테스트 대상 및 테스트 환경 식별 정보 ⑤ 결함의 정황(예: 실행 중인 테스트 케이스, 수행 중인 테스트 활동, SDLC 단계, 사용 중인 테스트 기법·체크리스트·테스트 데이터 같은 기타 관련 정보) ⑥ 장애의 재현 및 해결에 필요한 정보(이상 사항을 발견한 절차, 관련 테스트 로그, 데이터베이스 덤프, 스크린샷, 녹음 파일 등) ⑦ 기대 결과와 실제 결과 ⑧ 결함이 이해관계자의 이익 또는 요구사항에 끼치는 영향의 심각도 ⑨ 수정 우선순위 ⑩ 결함 상태(예: 신규, 연기, 중복, 수정 대기, 확인 테스트 대기, 재-오픈, 완료, 거부) ⑪ 참조 사항(예: 관련 테스트 케이스)","결함 관리 도구를 쓰면 일부 데이터(예: 식별자, 날짜, 작성자, 초기 상태)는 자동으로 포함될 수 있다. 결함 보고서 양식과 예시는 ISO/IEC/IEEE 29119-3 표준에 있으며, 이 표준은 결함 보고서를 '인시던트 보고서'라고 부른다."],"traps":["심각도는 결함이 이해관계자의 이익이나 요구사항에 끼치는 영향의 정도이고, 우선순위는 수정 우선순위다. 서로 다른 항목이다.","보고된 이상 사항이 모두 결함은 아니다. 거짓-양성 결과나 변경 요청일 수 있다.","ISO/IEC/IEEE 29119-3에서는 결함 보고서를 '인시던트 보고서'라고 부른다."]}]},{"ch":6,"title":"테스트 도구","titleEn":"Test Tools","minutes":20,"examCount":2,"keywords":[{"ko":"테스트 자동화","en":"test automation","def":"실라버스 본문에 별도 정의 문장은 없다. 6장 문맥에서는 테스트 도구를 써서 테스트 활동을 수행하거나 지원하는 것을 말한다(예: 리그레션 테스트 실행, 예상 결과와 실제 결과의 비교, 테스트 데이터의 체계적 생성, 커버리지 측정). 시간 절약 같은 효과와 도구에 대한 지나친 의존 같은 리스크가 함께 있다."}],"sections":[{"id":"6.1","title":"테스팅 지원 도구","points":["테스트 도구는 다양한 테스트 활동을 지원하고 촉진한다. 아래 목록은 예시이며 이것이 전부는 아니다.","테스트 관리 도구(test management tools): 소프트웨어 개발수명주기(SDLC), 요구사항, 테스트, 결함, 형상 관리를 용이하게 해서 테스트 프로세스 효율성을 높인다.","정적 테스팅 도구(static testing tools): 테스터의 리뷰와 정적 분석 수행을 지원한다.","테스트 설계 및 테스트 구현 도구(test design and test implementation tools): 테스트 케이스, 테스트 데이터, 테스트 절차 생성을 용이하게 한다.","테스트 실행 및 테스트 커버리지 도구(test execution and test coverage tools): 자동 테스트 실행 및 커버리지 측정을 지원한다.","비기능 테스팅 도구(non-functional testing tools): 수동으로 실행하기 어렵거나 불가능한 비기능 테스트를 테스터가 수행할 수 있게 한다.","데브옵스 도구(DevOps tools): 데브옵스 배포 파이프라인, 작업 흐름 추적, 자동 빌드 프로세스, 지속적인 통합 및 배포(CI/CD) 등을 지원한다.","협업 도구(collaboration tools): 원활한 커뮤니케이션을 지원한다.","확장성 및 배포 표준화 지원 도구(tools supporting scalability and deployment standardization): 예로 가상 머신, 컨테이너화 도구가 있다.","테스팅에 도움이 되는 기타 도구: 예를 들어 테스팅에 활용하면 스프레드시트도 테스트 도구가 된다."],"traps":["가상 머신과 컨테이너화 도구는 ‘확장성 및 배포 표준화 지원 도구’의 예다. 배포 파이프라인, 작업 흐름 추적, 자동 빌드, CI/CD를 지원하는 데브옵스 도구와 구분한다.","테스트 케이스·테스트 데이터·테스트 절차의 ‘생성을 용이하게’ 하는 것은 테스트 설계 및 테스트 구현 도구다. ‘자동 테스트 실행 및 커버리지 측정을 지원’하는 것은 테스트 실행 및 테스트 커버리지 도구다.","정적 테스팅 도구는 정적 분석뿐 아니라 리뷰 수행도 지원한다.","스프레드시트도 테스팅에 활용하면 테스트 도구다."]},{"id":"6.2","title":"테스트 자동화의 효과와 리스크","points":["도구를 도입한다고 성공이 보장되는 것은 아니다. 실질적이고 지속적인 효과를 얻으려면 새로운 도구를 도입할 때마다 노력을 들여야 한다(예: 도구의 도입, 유지보수, 교육).","테스트 자동화에는 분석과 완화가 필요한 리스크도 있다.","효과 ①: 반복적 수작업(예: 리그레션 테스트 실행, 같은 테스트 데이터의 반복 입력, 예상 결과와 실제 결과의 비교, 코딩 표준 확인)을 줄여 시간 절약","효과 ②: 일관성 및 재현성 향상으로 사람의 단순 실수 방지(예: 요구사항에서 테스트를 일관되게 도출, 테스트 데이터의 체계적 생성, 테스트를 도구가 같은 주기 및 동일한 순서로 실행)","효과 ③: 보다 객관적인 평가(예: 커버리지), 그리고 사람이 판단하기 어려운 복잡한 측정치의 제공","효과 ④: 테스트 관리 및 테스트 보고를 지원하기 위한 테스팅 정보에 더 쉽게 접근 가능(예: 테스트 진행률, 실패율, 테스트 실행 기간에 대한 통계, 그래프, 집계 데이터)","효과 ⑤: 결함 조기 식별, 빠른 피드백, 출시 시간 단축을 가능하게 하는 테스트 실행 시간 단축","효과 ⑥: 테스터가 새로운, 그리고 더 심층적이며 효과적인 테스트를 설계할 시간 확보","리스크 ①: 도구의 효과(기능 및 사용 편의성 포함)에 대한 비현실적인 기대","리스크 ②: 도구 도입, 테스트 스크립트 유지 관리, 기존 수동 테스트 프로세스 변경에 필요한 시간, 비용, 노력에 대한 부정확한 추정","리스크 ③: 수동 테스팅이 더 적합한 곳에 테스트 도구 사용","리스크 ④: 도구에 지나치게 의존(예: 사람의 비판적 사고의 필요성 무시)","리스크 ⑤: 폐업, 도구 지원 중단, 다른 공급업체로 도구 매각, 열악한 지원(예: 문의, 업그레이드, 결함 수정에 대한 대응) 등의 문제가 생길 수 있는 도구 공급업체에 대한 종속성","리스크 ⑥: 지원이 중단되거나(즉, 더는 업데이트되지 않거나), 추가 개발을 통해 내부 컴포넌트를 빈번하게 업데이트해야 할 필요가 있을 수 있는 오픈소스 소프트웨어의 사용","리스크 ⑦: 자동화 도구가 개발 플랫폼과 호환되지 않을 수 있음","리스크 ⑧: 규제 요건이나 안전 표준을 준수하지 않는 부적합한 도구의 선택"],"traps":["‘도구를 도입하면 성공이 보장된다’는 틀린 말이다. 실질적이고 지속적인 효과를 얻으려면 도구의 도입, 유지보수, 교육 등에 노력을 들여야 한다.","도구 공급업체에 대한 종속성(폐업, 지원 중단, 매각, 열악한 지원)과 오픈소스 소프트웨어의 사용(지원 중단, 잦은 내부 컴포넌트 업데이트)은 별개의 리스크다.","비현실적인 기대는 도구의 효과(기능, 사용 편의성)에 대한 것이고, 부정확한 추정은 시간·비용·노력에 대한 것이다.","테스터가 새로운, 그리고 더 심층적이며 효과적인 테스트를 설계할 시간 확보는 효과다. 도구에 지나치게 의존하는 것(예: 사람의 비판적 사고의 필요성 무시)은 리스크다."]}]}]}</script>

function startWeak() {

  const take = (pool, n) => pool.filter(q => !ids.includes(q.id)).map(q => ({ q, r: rank(q) })).sort((a, b) => a.r - b.r).slice(0, n).map(x => x.q);

      for (const lo of avail) out.push(...take(QS.filter(q => q.lo === lo && !out.includes(q)), 1));

    case "note": {
      const [c, sec] = String(n || 1).split("#");
      go("note", { ch: +c, sec: sec || null });
      if (sec) { const el = document.getElementById("s-" + sec); if (el) el.scrollIntoView({ block: "start" }); }
      return;
    }
    case "chapter": return startChapter(n || 1);
    case "cards": cardSet = String(n || "0"); cardIdx = 0; cardFlip = false; return go("cards");
    case "k3": return startK3(n || 0);
    case "wrong": return startWrong(0);
    case "wrongread": wrongRead = true; return go("wrong");
    case "mock": return askMock();
    case "weak": return startWeak();
    case "hard": return startHard(n || 0);
    case "hard10": return startHard(0, 10);
    case "resume": return go("quiz");
    case "cram": return go("cram");
    case "result": return go("result", n);
  }
}

  return `${d}일 ${String(h).padStart(2, "0")}시간 ${String(mi).padStart(2, "0")}분 남음`;
}

async function copyText(text, ta, btn) {

  catch (e) { ta.hidden = false; ta.value = text; ta.focus(); ta.select(); btn.textContent = "아래 글자를 길게 눌러 복사하세요"; }
}
function exportCode() { const o = Object.assign({}, S, { cur: null }); o.mocks = S.mocks.map(m => ({ t: m.t, score: m.score, byCh: m.byCh, dur: m.dur, n: m.n })); return "CTFL1:" + btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
function parseCode(code) {

  if (!m) throw new Error("코드 형식이 달라요. CTFL1: 로 시작하는 코드 전체를 붙여넣어 주세요.");
  return JSON.parse(decodeURIComponent(escape(atob(m[1]))));
}
function mergeState(o) {
  for (const [id, r] of Object.entries(o.q || {})) if (!S.q[id] || (r.t || 0) > (S.q[id].t || 0)) S.q[id] = r;
  for (const [id, w] of Object.entries(o.wrong || {})) {
    const r = S.q[id];
    // 오답이 된 뒤 다른 쪽 기기에서 두 번 연속 맞혀 졸업한 문제는 다시 넣지 않음
    if (!S.wrong[id] && !(r && r.last === 1 && r.st >= 2 && (r.t || 0) > (w.t || 0))) S.wrong[id] = w;
  }
  S.grad = Math.max(S.grad || 0, o.grad || 0);
  const seenT = new Set(S.mocks.map(m => m.t));
  for (const m of o.mocks || []) if (!seenT.has(m.t)) S.mocks.push(m);
  S.mocks.sort((a, b) => a.t - b.t);
  for (const [k, val] of Object.entries(o.plan || {})) if (val) S.plan[k] = true;
  for (const [k, val] of Object.entries(o.cards || {})) if (S.cards[k] === undefined || val === 1) S.cards[k] = val;
  S.mockSeen = Array.from(new Set([...(S.mockSeen || []), ...(o.mockSeen || [])]));
  for (const [k, val] of Object.entries(o.samples || {})) if (val != null && S.samples[k] == null) S.samples[k] = val;
  Object.assign(S.reports, o.reports || {});
  save();
}

    catch (e) { msg.textContent = e.message && e.message.includes("코드") ? e.message : "코드를 읽지 못했어요. 처음부터 끝까지 빠짐없이 복사했는지 확인해 주세요."; }

function paceBudget(cur, i) {
  // 공식 구조표 예상 시간(K1·K2 1분, K3 3분, 합 56분)을 60분에 비례 배분
  let t = 0; for (let j = 0; j < i; j++) t += QBY[cur.ids[j]].k === 3 ? 3 : 1;
  return t * 60 / 56 * 60000;
}
function tableHtml(t) {
  return `<div class="tbl"><table><thead><tr>${t.head.map(h => `<th>${fmt(h)}</th>`).join("")}</tr></thead><tbody>${t.rows.map(r => `<tr>${r.map(c => `<td>${fmt(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
// 채점된 보기: 정답·내 선택은 해설을 펼치고, 나머지 보기 해설은 접어 둔다
function gradedOpts(q, sel, perm) {
  const row = (oi, pos) => {
    const mine = sel.includes(oi), right = q.ans.includes(oi);
    const cls = right ? "right" : mine ? "wrong" : "";
    const tag = right ? `<span class="tag ok">정답${mine ? " · 내 선택" : ""}</span>` : mine ? `<span class="tag bad">내 선택</span>` : "";
    const why = right || mine ? `<span class="why">${fmt(q.why[oi])}</span>` : "";
    return `<div class="opt ${cls}"><span class="lt">${LETTERS[pos]}</span><span>${fmt(q.opts[oi])}</span>${tag}${why}</div>`;
  };
  const rest = perm.map((oi, pos) => ({ oi, pos })).filter(({ oi }) => !q.ans.includes(oi) && !sel.includes(oi));
  return `<div class="opts">${perm.map(row).join("")}</div>${rest.length ? `<details class="others"><summary><span class="small">나머지 보기는 왜 틀렸나요</span></summary>${rest.map(({ oi, pos }) => `<div class="opt"><span class="lt">${LETTERS[pos]}</span><span class="why">${fmt(q.why[oi])}</span></div>`).join("")}</details>` : ""}`;
}

  const ex = $("#qexp"); if (ex) ex.onclick = () => { const e = v.querySelector(".exp"); if (e) e.scrollIntoView({ behavior: smooth(), block: "start" }); };
  if (mock) {
    $("#qflag").onclick = () => { cur.flags[id] = !cur.flags[id]; save(); renderQuizKeepFocus(); };
    const sub = $("#qsubmit"); if (sub) sub.onclick = () => openNav(true);
    $("#qnav").onclick = () => openNav(false);
    const upd = () => {
      const left = cur.limit - (Date.now() - cur.start);
      if (left <= 0) { submitMock(true); return; }
      const diff = Math.round((paceBudget(cur, cur.i) - (Date.now() - cur.start)) / 60000);
      const tm = $("#tm"); if (tm) { tm.textContent = mmss(left); tm.classList.toggle("low", left < 600000); tm.classList.toggle("behind", diff <= -1 && left >= 600000); }
      const p = $("#pace"); if (p) p.textContent = diff >= 1 ? `페이스: 예정보다 ${diff}분 여유` : diff <= -1 ? `페이스: 예정보다 ${-diff}분 늦음` : "페이스: 예정대로";
    };
    upd(); tick = setInterval(upd, 1000);
  } else {
    // 공식 구조표 기준 문제당 예상 시간: K1·K2 1분, K3 3분
    const target = q.k === 3 ? 180 : 60, t = cur.qt[id];
    const sw = () => {
      const sec = Math.floor(((t.e || Date.now()) - t.s) / 1000), el = $("#sw"); if (!el) return;
      const shown = sec >= 900 ? "15:00+" : `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
      el.textContent = `${shown} / 목표 ${target / 60}분`; el.classList.toggle("over", sec > target);
    };
    sw(); if (!t.e) tick = setInterval(sw, 1000);
  }
}
function renderQuizKeepFocus() {
  const y = window.scrollY, ae = document.activeElement, oi = ae && ae.dataset ? ae.dataset.oi : null, aid = ae ? ae.id : null;
  render(); window.scrollTo(0, y);
  const el = oi != null ? document.querySelector(`[data-oi="${oi}"]`) : aid ? document.getElementById(aid) : null;
  if (el) el.focus({ preventScroll: true });
}
function quitQuiz() {
  const cur = S.cur;
  if (cur.mode === "mock") {
    return openSheet("모의고사를 어떻게 할까요?", `<p class="small muted">남은 시간 ${mmss(cur.limit - (Date.now() - cur.start))}. 나가 있어도 시간은 계속 흘러요.</p>`, [
      { label: "계속 풀기", cls: "primary" },
      { label: "나중에 이어 풀기", fn: () => go("home") },
      { label: "지금 제출하고 채점", fn: () => submitMock(false) },
      { label: "그만두기 (기록 안 남김)", cls: "danger", fn: () => { S.cur = null; save(); go("practice"); } }
    ]);
  }
  if (Object.keys(cur.checked).length) finishPractice(); else { S.cur = null; save(); go("practice"); }
}
function finishPractice() {
  const cur = S.cur; const done = cur.ids.filter(id => cur.checked[id]);
  const right = done.filter(id => same(cur.sel[id], QBY[id].ans));
  const need = { chapter: Math.min(15, cur.ids.length), k3: Math.min(8, cur.ids.length), wrong: 1, weak: 1, hard: 1 }[cur.kind];
  if (need && done.length >= need) autoDone(cur.kind, cur.arg);
  S.cur = null; save();
  go("summary", { title: cur.title, done, right });
}
function openNav(submitting) {
  const cur = S.cur;
  const st = id => { const n = (cur.sel[id] || []).length; return n === QBY[id].ans.length ? "ans" : n ? "part" : ""; };
  const answered = cur.ids.filter(id => st(id) === "ans").length;
  const flagged = cur.ids.filter(id => cur.flags[id]).length;
  openSheet(submitting ? "제출할까요?" : "문제 목록", `
    <p class="small muted">답한 문제 ${answered}/${cur.ids.length} · 다시 보기 ${flagged}개${answered < cur.ids.length ? ` · <b>안 푼 문제 ${cur.ids.length - answered}개</b>` : ""}</p>
    <p class="pace" id="pace"></p>
    <div class="legend"><span>파란 칸 = 답함</span><span>점선 = 두 개 중 하나만 고름</span><span>! = 다시 보기</span></div>
    <div class="navgrid">${cur.ids.map((id, i) => { const s = st(id), f = !!cur.flags[id]; return `<button data-i="${i}" class="${s} ${f ? "flag" : ""} ${i === cur.i ? "cur" : ""}" aria-label="${i + 1}번, ${s === "ans" ? "답함" : s ? "일부만 답함" : "안 품"}${f ? ", 다시 보기" : ""}"${i === cur.i ? ' aria-current="true"' : ""}>${i + 1}</button>`; }).join("")}</div>`,
    submitting ? [{ label: "제출하고 채점하기", cls: "primary", fn: () => submitMock(false) }, { label: "더 풀기" }] : [{ label: "제출하기…", fn: () => openNav(true) }],
    panel => panel.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { cur.i = +b.dataset.i; save(); closeSheet(true); go("quiz"); }));
}
function submitMock(timeout) {
  const cur = S.cur; if (!cur || cur.mode !== "mock") return;
  const byCh = {}; let score = 0, blank = 0;
  for (const id of cur.ids) {
    const q = QBY[id]; const s = cur.sel[id] || []; const ok = same(s, q.ans);
    // 안 고른 문제는 점수에서만 틀린 것으로 친다. 정답률·오답노트에는 넣지 않음.
    if (s.length) record(id, ok); else blank++;
    if (ok) score++;
    const b = byCh[q.ch] || (byCh[q.ch] = [0, 0]); b[1]++; if (ok) b[0]++;
  }
  const dur = Math.min(Date.now() - cur.start, cur.limit);
  S.mocks.push({ t: Date.now(), score, byCh, dur, n: cur.ids.length, blank, timeout: !!timeout, ids: cur.ids, sel: cur.sel, perm: cur.perm });
  S.mockSeen = Array.from(new Set([...S.mockSeen, ...cur.ids]));
  S.cur = null; autoDone("mock", 0); save();
  go("result", S.mocks.length - 1);
}

/* ---------- 결과 ---------- */
function reportBtn(id) {
  return `<button class="btn ghost small report" data-report="${esc(id)}">${S.reports[id] ? "신고함 (누르면 취소)" : "이 문제가 이상해요"}</button>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-report]"); if (!b) return;
  const id = b.dataset.report;
  if (S.reports[id]) delete S.reports[id]; else S.reports[id] = Date.now();
  save(); b.textContent = S.reports[id] ? "신고함 (누르면 취소)" : "이 문제가 이상해요";
});
function reviewCard(q, sel, perm, label, opts = {}) {
  const ok = same(sel, q.ans);
  const keyTxt = q.ans.map(a => LETTERS[perm.indexOf(a)]).join(", ");
  const verdict = opts.read ? "" : `<div class="verdict ${ok ? "ok" : "bad"}">${ok ? "맞힌 문제" : sel.length ? `틀린 문제 · 정답 ${keyTxt}` : `안 푼 문제 · 정답 ${keyTxt}`}</div>`;
  return `<article class="${opts.bare ? "" : "flat "}stack" style="margin-top:8px">
    <div class="chips">${label ? `<span class="chip mono">${esc(label)}</span>` : ""}<span class="chip">${q.ch}장</span><span class="chip mono">${esc(q.lo)}</span><span class="chip ${q.k === 3 ? "k3" : ""}">K${q.k}</span>${q.hard ? '<span class="chip hard">실전</span>' : ""}</div>
    ${opts.bare ? "" : `<div class="qtext">${fmt(q.q)}${q.ans.length === 2 ? ' <span class="pick2">(두 개를 고르시오)</span>' : ""}</div>`}
    ${q.table ? tableHtml(q.table) : ""}${q.code ? `<pre class="code">${esc(q.code)}</pre>` : ""}
    ${verdict}${gradedOpts(q, sel, perm)}
    <div class="exp"><b>해설</b>${fmtP(q.exp)}<div class="src">근거: 실라버스 ${esc(q.ref)}</div></div>${reportBtn(q.id)}</article>`;
}
function vResult(v) {
  const r = S.mocks[route.p]; if (!r || !r.ids) return go("practice");
  const pass = r.score >= PASS;
  const mm = Math.floor(r.dur / 60000), ss = Math.floor(r.dur % 60000 / 1000);
  const wrongIdx = r.ids.map((id, i) => i).filter(i => !same(r.sel[r.ids[i]] || [], QBY[r.ids[i]].ans));
  v.innerHTML = `
  <section class="card stack" style="text-align:center;justify-items:center">
    <span class="eyebrow">실전 모의고사 결과 · ${new Date(r.t).toLocaleDateString("ko-KR")}</span>
    <h1 class="score ${pass ? "pass" : "fail"}">${r.score}<span class="muted" style="font-size:1.4rem"> / ${r.n || r.ids.length}</span></h1>
    <div class="chip ${pass ? "ok" : "bad"}">${pass ? `합격선(26) 통과${r.score >= GOAL ? " · 목표 30 달성" : ""}` : `합격선까지 ${PASS - r.score}문제 부족`}</div>
    <div class="muted small mono">걸린 시간 ${mm}분 ${String(ss).padStart(2, "0")}초${r.timeout ? " · 시간 종료로 자동 제출" : ""}${r.blank ? ` · 안 푼 문제 ${r.blank}개` : ""}</div>
  </section>
  <section class="card stack"><h2>장별 결과</h2>
    <div class="chres">${Object.keys(r.byCh).map(Number).sort().map(ch => { const [c, n] = r.byCh[ch]; return `<span class="mono">${ch}장</span><span class="bar"><i style="width:${c / n * 100}%;background:${accColor(c / n)}"></i></span><span class="mono">${c}/${n}</span>`; }).join("")}</div>
    <p class="small muted">빨간 장(65% 미만)부터 개념 노트를 다시 보세요. 틀린 문제는 오답노트에 들어갔어요(안 푼 문제는 제외).</p>
  </section>
  <section class="card stack"><h2>문제별 해설</h2>
    <div class="legend"><span>○ 맞힘</span><span>✕ 틀림·안 품</span></div>
    <div class="navgrid">${r.ids.map((id, i) => { const ok = same(r.sel[id] || [], QBY[id].ans), none = !(r.sel[id] || []).length; return `<button data-i="${i}" class="${ok ? "r-ok" : "r-bad"}" aria-label="${i + 1}번 ${ok ? "정답" : none ? "안 품" : "오답"}">${i + 1}<span class="mk" aria-hidden="true">${ok ? "○" : "✕"}</span></button>`; }).join("")}</div>
    ${wrongIdx.length ? `<button class="btn" id="allwrong">틀린 문제 ${wrongIdx.length}개 모두 펼치기</button>` : ""}
    <div id="rv"></div></section>
  <div class="row"><button class="btn primary" data-act="wrong">오답노트 풀기</button><button class="btn" data-go>홈으로</button></div>`;
  bindActs(v); v.querySelector("[data-go]").onclick = () => go("home");
  const show = idxs => { $("#rv").innerHTML = idxs.map(i => reviewCard(QBY[r.ids[i]], r.sel[r.ids[i]] || [], r.perm[r.ids[i]], `${i + 1}번`)).join(""); $("#rv").scrollIntoView({ behavior: smooth(), block: "start" }); };
  v.querySelectorAll("[data-i]").forEach(b => b.onclick = () => show([+b.dataset.i]));
  const aw = $("#allwrong"); if (aw) aw.onclick = () => show(wrongIdx);
}
function vSummary(v) {
  const r = route.p; if (!r) return go("practice");
  const wrong = r.done.filter(id => !r.right.includes(id));
  const today = seoulDate(), plan = PLAN.find(p => p.d === today);
  const left = plan ? plan.tasks.filter((t, i) => t[1] !== "none" && !S.plan[`${today}-${i}`]).length : 0;
  v.innerHTML = `
  <section class="card stack" style="text-align:center;justify-items:center"><span class="eyebrow">${esc(r.title)}</span>
    <h1 class="score">${r.right.length}<span class="muted" style="font-size:1.4rem"> / ${r.done.length}</span></h1>
    <div class="muted">${r.done.length ? `정답률 ${Math.round(r.right.length / r.done.length * 100)}%` : "푼 문제가 없어요"}</div></section>
  <div class="row">${left ? `<button class="btn primary" data-go>오늘 할 일로 (${left}개 남음)</button>` : `<button class="btn primary" data-go>홈으로</button>`}
    ${wrong.length ? `<button class="btn" id="redo">틀린 ${wrong.length}문제 바로 다시 풀기</button>` : ""}</div>
  ${wrong.length ? `<section class="card"><h2 style="margin-bottom:6px">틀린 문제 ${wrong.length}개 · 오답노트에 저장됨</h2>${wrong.map(id => wrongItem(id)).join("")}</section>` : ""}`;
  bindActs(v); v.querySelector("[data-go]").onclick = () => go("home");
  const rd = $("#redo"); if (rd) rd.onclick = () => newSession("practice", "틀린 문제 다시 풀기", wrong, { kind: "wrong", arg: 0 });
}

/* ---------- 오답노트 ---------- */
let wrongCh = 0, wrongRead = false;
function wrongItem(id) {
  const q = QBY[id];
  return `<details class="list-q"><summary><div class="chips"><span class="chip">${q.ch}장</span><span class="chip mono">${esc(q.lo)}</span>${S.wrong[id] && S.wrong[id].st ? '<span class="chip ok">1번 맞힘</span>' : ""}</div><div class="t">${plain(q.q)}</div></summary>
    ${reviewCard(q, [], q.opts.map((_, i) => i), "", { read: true, bare: true })}</details>`;
}
function vWrong(v) {
  const all = Object.keys(S.wrong).filter(id => QBY[id]);
  const ids = all.filter(id => !wrongCh || QBY[id].ch === wrongCh).sort((a, b) => S.wrong[b].t - S.wrong[a].t);
  v.innerHTML = `<header class="note-head"><h1 class="page-title">오답노트</h1>
    <p class="lead">틀린 문제가 모여요. <b>두 번 연속</b> 맞히면 졸업해서 빠져요. 지금까지 ${S.grad}문제 졸업.</p></header>
  ${all.length ? `<div class="seg" aria-label="장 필터"><button aria-pressed="${!wrongCh}" data-wc="0">전체 ${all.length}</button>${[1, 2, 3, 4, 5, 6].map(c => { const n = all.filter(id => QBY[id].ch === c).length; return n ? `<button aria-pressed="${wrongCh === c}" data-wc="${c}">${c}장 ${n}</button>` : ""; }).join("")}</div>
    <button class="btn primary block" id="wgo">${ids.length}문제 다시 풀기</button>
    <section class="card"><div class="sec-title" style="margin-bottom:4px"><h2>읽기 모드</h2><span class="small muted">눌러서 정답과 해설 보기</span></div>${ids.map(wrongItem).join("")}</section>`
    : `<div class="card empty"><b>오답노트가 비어 있어요</b><p>문제를 풀다 틀리면 여기에 모여요.</p><button class="btn primary" data-act="weak">약점 공략 10문제</button></div>`}
  ${Object.keys(S.reports).length ? `<section class="card stack"><h2>이상하다고 표시한 문제 ${Object.keys(S.reports).length}개</h2>
    <p class="small muted">목록을 복사해서 앱을 만든 사람에게 보내주세요. 확인해서 고칠게요.</p>
    <div class="chips">${Object.keys(S.reports).map(id => `<span class="chip mono">${esc(id)}</span>`).join("")}</div>
    <button class="btn" id="rpcopy">목록 복사</button><textarea id="rpta" rows="3" hidden readonly aria-label="신고 목록"></textarea></section>` : ""}`;
  bindActs(v);
  v.querySelectorAll("[data-wc]").forEach(b => b.onclick = () => { wrongCh = +b.dataset.wc; renderKeepScroll(); });
  const wg = $("#wgo"); if (wg) wg.onclick = () => startWrong(wrongCh);
  const rc = $("#rpcopy"); if (rc) rc.onclick = () => copyText("CTFL 이상한 문제: " + Object.keys(S.reports).join(", "), $("#rpta"), rc);
  if (wrongRead) { wrongRead = false; autoDone("wrongread", 0); }
}

/* ---------- 용어 카드 ---------- */
let cardSet = "0", cardIdx = 0, cardFlip = false, cardOnlyUnknown = false;
function cardChs() { return cardSet === "0" ? [1, 2, 3, 4, 5, 6] : cardSet.split(",").map(Number); }
function cardAll() { const out = []; for (const ch of cardChs()) for (const k of (NOTES[ch]?.keywords || [])) out.push({ ...k, ch, key: `${ch}:${k.en}` }); return out; }
function cardList() { const l = cardAll(); return cardOnlyUnknown ? l.filter(k => S.cards[k.key] !== 1) : l; }
function vCards(v) {
  const list = cardList(); if (cardIdx >= list.length) cardIdx = 0;
  const c = list[cardIdx], all = cardAll();
  const known = all.filter(k => S.cards[k.key] === 1).length;
  v.innerHTML = `<header class="note-head"><h1 class="page-title">용어 카드</h1>
    <p class="lead">실라버스 각 장의 키워드예요. 정의가 그대로 K1 문제로 나올 수 있어요. 카드를 누르면 뒤집혀요.</p></header>
  <div class="seg" aria-label="장 선택"><button aria-pressed="${cardSet === "0"}" data-c="0">전체</button>${[1, 2, 3, 4, 5, 6].map(ch => `<button aria-pressed="${cardSet === String(ch)}" data-c="${ch}">${ch}장</button>`).join("")}${cardSet.includes(",") ? `<button aria-pressed="true" data-c="${cardSet}">${cardSet.replace(",", "·")}장</button>` : ""}</div>
  <div class="row spread"><span class="muted small">외운 용어 ${known}/${all.length}</span>
    <label class="row small toggle" style="gap:6px;min-height:44px;padding-inline:6px"><input type="checkbox" id="onlyu" ${cardOnlyUnknown ? "checked" : ""} style="width:22px;height:22px;accent-color:var(--pen);margin:0"> 모르는 것만</label></div>
  ${c ? `<button class="flash" id="flash" aria-pressed="${cardFlip}">${cardFlip
      ? `<div class="def"><div class="eyebrow" style="margin-bottom:8px">${c.ch}장 · ${esc(c.ko)}</div>${fmt(c.def)}</div>`
      : `<div><div class="term">${esc(c.ko)}</div><div class="en" lang="en">${esc(c.en)}</div><div class="muted small" style="margin-top:14px">눌러서 뜻 보기</div></div>`}</button>
    <div class="row spread"><span class="mono muted small">${cardIdx + 1} / ${list.length}</span>${S.cards[c.key] === 1 ? '<span class="chip ok">외움</span>' : S.cards[c.key] === 0 ? '<span class="chip bad">모름</span>' : ""}</div>
    <div class="row"><button class="btn" id="cprev" style="flex:1">이전</button><button class="btn danger" id="cno" style="flex:1">모르겠어요</button><button class="btn primary" id="cyes" style="flex:1">알아요</button></div>`
    : `<div class="card empty"><b>${cardOnlyUnknown ? "모르는 용어가 없어요" : "용어가 없어요"}</b></div>`}`;
  v.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { cardSet = b.dataset.c; cardIdx = 0; cardFlip = false; render(); });
  $("#onlyu").onchange = e => { cardOnlyUnknown = e.target.checked; cardIdx = 0; cardFlip = false; render(); };
  if (!c) return;
  const refocus = () => { const f = $("#flash"); if (f) f.focus({ preventScroll: true }); };
  const rated = () => { if (cardAll().every(k => S.cards[k.key] !== undefined)) autoDone("cards", cardSet); };
  $("#flash").onclick = () => { cardFlip = !cardFlip; render(); refocus(); };
  const step = d => { const n = cardList().length; cardIdx = n ? (cardIdx + d + n) % n : 0; cardFlip = false; render(); refocus(); };
  $("#cprev").onclick = () => step(-1);
  $("#cyes").onclick = () => { S.cards[c.key] = 1; save(); rated(); if (cardOnlyUnknown) { cardFlip = false; render(); refocus(); } else step(1); };
  $("#cno").onclick = () => { S.cards[c.key] = 0; save(); rated(); step(1); };
}

/* ---------- 시작 ---------- */
function start(data) {
  applyFs();
  if (data && data.route && data.route.name !== "quiz") route = data.route;
  render();
}
window.claude?.hot?.snapshot?.(() => ({ route: { name: route.name, p: ["note", "result"].includes(route.name) ? route.p : null } }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body></html>
